name: diagnose-research-campaign-target-patch

on:
  push:
    branches: [platform/research-campaign-target-20261014]
    paths: ['.github/workflows/_diagnose_research_campaign_target_patch.yml']

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: platform/research-campaign-target-20261014
          fetch-depth: 0
      - name: Count patch anchors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('platform/internal/campaign/campaign.go').read_text()
          checks={
            'start_request': '\tCandidateEngineReleaseID uuid.UUID   `json:"candidate_engine_release_id"`\n\tCohortSubjectIDs         []uuid.UUID `json:"cohort_subject_ids"`\n',
            'status': '\tCohortComplete           bool      `json:"cohort_complete"`\n\tRegressionComplete       bool      `json:"regression_complete"`\n\tFullClosureComplete      bool      `json:"full_closure_complete"`\n',
            'start_anchor': 'func Start(ctx context.Context, pool *pgxpool.Pool, apiGraph *stagegraph.Graph, deployedCodeSHA string, req StartRequest) (Status, error) {\n',
            'execution_scope': '\t\t"execution_scope":             "FULL_DAG_FROM_SOURCE_ENTRY_TO_PRODUCT_CLOSURE",\n',
            'closure_rollup': '\tout.CohortComplete = cohortTotal > 0 && cohortComplete == cohortTotal\n\tout.RegressionComplete = regressionComplete == regressionTotal\n\tout.FullClosureComplete = out.CohortComplete && out.RegressionComplete && !out.AnyFailed\n\treturn out, nil\n',
          }
          lines=[]
          for name,value in checks.items(): lines.append(f'{name}={text.count(value)}')
          pattern=r'\tcandidateGraph, _, err := release\.LoadGraph\(ctx, pool, req\.CandidateEngineReleaseID\)\n.*?\tif len\(closure\) != candidateGraph\.StageCount\(\) \{\n\t\treturn Status\{\}, errors\.New\("RESEARCH_CAMPAIGN_PRODUCT_TARGET_MUST_CLOSE_FULL_DAG"\)\n\t\}\n'
          lines.append(f'target_block={len(list(re.finditer(pattern,text,re.S)))}')
          Path('campaign-target-diagnostic.txt').write_text('\n'.join(lines)+'\n')
          PY
          cat campaign-target-diagnostic.txt
          git config user.name realsas-ci
          git config user.email ci@realsas.local
          git add campaign-target-diagnostic.txt
          git commit -m 'ops: record campaign target patch anchors'
          git push origin HEAD:platform/research-campaign-target-20261014
