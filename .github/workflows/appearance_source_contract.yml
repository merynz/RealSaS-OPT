name: appearance-source-contract
on:
  pull_request:
    paths:
      - 'compiler/realsas_compiler_core/appearance.py'
      - 'experiments/single_family_e2e_v1/appearance_builder_v1.py'
      - 'compiler/test_appearance_source_v1.py'
      - '.github/workflows/appearance_source_contract.yml'
  push:
    branches: [source/generic-completion-v1-20260902]
    paths:
      - 'compiler/realsas_compiler_core/appearance.py'
      - 'experiments/single_family_e2e_v1/appearance_builder_v1.py'
      - 'compiler/test_appearance_source_v1.py'
      - '.github/workflows/appearance_source_contract.yml'
jobs:
  appearance-source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pytest numpy pillow
      - run: python -m py_compile compiler/realsas_compiler_core/appearance.py experiments/single_family_e2e_v1/appearance_builder_v1.py
      - run: PYTHONPATH=. python -m pytest -q compiler/test_appearance_source_v1.py
