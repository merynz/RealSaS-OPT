name: apply-rev31-exact-large-files
on:
  push:
    branches: [fit8/rev3-1-authority-clean-20261014]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reconstruct and verify exact Rev3.1 authority files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess, zlib

          specs = [
              ('.transfer_rev31/build', 6, 'tools/notebooks/build_iris_cohort_v1.py', 'b952ca2b5f80cac33ef473975225eb9d4b37a373'),
              ('.transfer_rev31/cohort', 7, 'models/iris/training/cohort_v1.py', '53a7bffde60de37f86713485df92d713b11d297a'),
              ('.transfer_rev31/test', 3, 'tests/iris/test_shared_cohort_v1.py', '46f155c771d5480de97d69cceffa7b32cca8cf75'),
          ]
          for prefix, count, target, expected in specs:
              encoded = ''.join(Path(f'{prefix}.{i:02d}.hex').read_text().strip() for i in range(count))
              data = zlib.decompress(bytes.fromhex(encoded))
              path = Path(target)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              actual = subprocess.check_output(['git','hash-object',str(path)], text=True).strip()
              if actual != expected:
                  raise SystemExit(f'REV31_RECONSTRUCT_BLOB_DRIFT:{target}:{actual}:{expected}')

          expected = {
              'tools/training/export_iris_cohort_surfaces_v1.py':'41991fd6cec75818a5f2c5845cda9964c72f2541',
              'tools/training/iris_cohort_preflight_v1.py':'666bd641331444e2f19de76866707fdfd4f578e2',
              'tools/training/prepare_iris_cohort_v1.py':'61b8134757d7f95f6cace329c2c9d483a1a62c41',
              'tools/notebooks/build_iris_cohort_v1.py':'b952ca2b5f80cac33ef473975225eb9d4b37a373',
              'canonical/FIT8_IRIS_KNIGHT_RECIPE_REFERENCE_V1.json':'a475b47cbca9bb7c32ff46b21cc0a2e75014eb7c',
              'canonical/FIT8_IRIS_REVISION3_AUDIT_20261013.json':'5531be786421d0cfe5aa6815f88db286069d7506',
              'canonical/FIT8_IRIS_SHARED_TRAINING_POLICY_V1.json':'dfb82ea28f7962fdb793ca417b4395fe571829bd',
              'canonical/FIT8_IRIS_REV3_1_POOL_GUARD_DELIVERY_RECEIPT_20261013.json':'ddf64e078709539b11fd5a6e338ba3ec52435e30',
              'models/iris/training/apparatus_v1.py':'78934d2b9f92777a3c934441dbf0bcec22ea38a1',
              'models/iris/training/cohort_v1.py':'53a7bffde60de37f86713485df92d713b11d297a',
              'tests/iris/test_shared_cohort_v1.py':'46f155c771d5480de97d69cceffa7b32cca8cf75',
              'docs/corpus/IRIS_SHARED_COHORT_RUNNER_V1.md':'3fc6267be55bd19d07824409a22099c6d4c0b4e9',
          }
          for path, wanted in expected.items():
              got = subprocess.check_output(['git','hash-object',path], text=True).strip()
              if got != wanted:
                  raise SystemExit(f'REV31_AUTHORITY_BLOB_DRIFT:{path}:{got}:{wanted}')
          print('REV31_AUTHORITY_EXACT_12_OF_12')
          PY
          rm -rf .transfer_rev31
          rm -f .github/workflows/apply_rev31_exact_large_files.yml
          git diff --check
          python -m compileall -q models/iris/training tools/training tools/notebooks tests/iris
          git config user.name 'realsas-ci'
          git config user.email 'realsas-ci@users.noreply.github.com'
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m 'Align Fit8 IRIS authority with Rev3.1 joint training'
          git push origin HEAD:fit8/rev3-1-authority-clean-20261014
