name: arachne-a0-storage-probe-selfhosted

on:
  push:
    branches:
      - exp/arachne-skintokens-cleanroom-fit1-20260908
    paths:
      - '.github/workflows/arachne_a0_storage_probe_selfhosted.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, realsas, gpu]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Search only known RealSaS roots for sealed A0 inputs
        shell: bash
        run: |
          set -u
          ROOTS=(/mnt/d/RealSaS /mnt/d/realSaS_work /mnt/d/realSaS_external /mnt/d/realSaS_Backups)
          for root in "${ROOTS[@]}"; do
            if [ -d "$root" ]; then
              echo "ROOT:$root"
              timeout 30s find "$root" -maxdepth 10 -type f \( \
                -name 'ARACHNE_MAGE_A0_FS1_PROGRESS.pt' -o \
                -name 'ARACHNE_MAGE_FS1_CONDITIONING_CACHE_V2.npz' -o \
                -name 'ARACHNE_MAGE_A0_FS1_RESULT.json' \
              \) -print 2>/dev/null || true
            fi
          done
