name: arachne-codec-v2-source-contract

on:
  pull_request:
    paths:
      - 'experiments/geppetto_arachne_r6_20260901/**'
      - '.github/workflows/arachne_codec_v2_source_contract.yml'
  push:
    branches:
      - source/generic-completion-v1-20260902
      - architecture/v4-generic-strength-source-completion-20260902
    paths:
      - 'experiments/geppetto_arachne_r6_20260901/**'
      - '.github/workflows/arachne_codec_v2_source_contract.yml'

jobs:
  arachne-codec-v2-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pillow pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile Arachne and codec source
        run: |
          python -m py_compile experiments/geppetto_arachne_r6_20260901/*.py
      - name: Verify Codec objective truth stationarity regression
        env: &det_env
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          PYTHONHASHSEED: '0'
        run: |
          python -m pytest -q -s experiments/geppetto_arachne_r6_20260901/test_skin_field_codec_objective_causal_diagnostic.py
      - name: Diagnose post-PASS Codec A0 objective forces
        env: *det_env
        run: |
          python -m pytest -q -s experiments/geppetto_arachne_r6_20260901/test_skin_field_codec_a0_force_decomposition_diagnostic.py
      - name: Diagnose full frozen-panel A0 reconstruction-only objective
        env: *det_env
        run: |
          python -m pytest -q -s experiments/geppetto_arachne_r6_20260901/test_skin_field_codec_a0_reconstruction_ab_diagnostic.py
      - name: Verify canonical skin target row binding and frozen behavioral panel
        env: *det_env
        run: |
          python -m pytest -q -s experiments/geppetto_arachne_r6_20260901/test_arachne_v2_behavioral_panel_bound_v2.py
      - name: Run Arachne/codec source gates
        env: *det_env
        run: |
          python -m pytest -q -s \
            experiments/geppetto_arachne_r6_20260901/test_arachne_codec_v2_source.py \
            experiments/geppetto_arachne_r6_20260901/test_arachne_v2_generic_strength.py \
            experiments/geppetto_arachne_r6_20260901/test_geppetto_v2_source.py
