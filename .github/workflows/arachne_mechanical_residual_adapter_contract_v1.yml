name: arachne-mechanical-residual-adapter-contract-v1

on:
  push:
    branches: [audit/canonical-caa-mechanics-geometry-lock-20261002]
    paths:
      - models/arachne/v4/mechanical_residual_adapter_v1.py
      - models/arachne/v4/mechanical_consequence_loss_v1.py
      - models/arachne/v4/train_mechanical_residual_adapter_v1.py
      - tests/models/test_arachne_mechanical_residual_adapter_v1.py
      - tests/models/test_arachne_mechanical_adapter_trainer_v1.py
      - .github/workflows/arachne_mechanical_residual_adapter_contract_v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - run: python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt
      - run: |
          python -m pytest -q \
            tests/models/test_arachne_mechanical_residual_adapter_v1.py \
            tests/models/test_arachne_mechanical_adapter_trainer_v1.py
