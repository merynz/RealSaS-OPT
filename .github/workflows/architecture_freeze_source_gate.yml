name: architecture-freeze-source-gate

on:
  pull_request:
    paths:
      - 'canonical/architecture_freeze_gate_v1.py'
      - 'canonical/DINO_TOKEN_PARITY_V1_SEAL_20260902.json'
      - 'canonical/ARCHITECTURE_FREEZE_V1.json'
      - 'canonical/R6_ORACLE_SUBSTRATE_INFORMATION_SUFFICIENCY_PREREG_20260903.md'
      - 'canonical/R6_ARACHNE_ORACLE_SUBSTRATE_PREREG_20260903.md'
      - 'canonical/R6_ARACHNE_ORACLE_SUBSTRATE_HETEROGENEOUS_PREREG_20260903.md'
      - 'canonical/MWB2_DIRECTIONAL_BEHAVIORAL_PREREG_20260903.md'
      - 'canonical/MWB2_DIRECTIONAL_BEHAVIORAL_CLOSURE_20260903.md'
      - 'canonical/APPEARANCE_PIXEL_CENTER_BEHAVIORAL_PREREG_20260903.md'
      - 'canonical/APPEARANCE_PIXEL_CENTER_BEHAVIORAL_CLOSURE_20260903.md'
      - 'experiments/iris_reprojection_v2_20260831/**'
      - 'experiments/geppetto_arachne_r6_20260901/**'
      - 'experiments/single_family_e2e_v1/appearance_builder_v1.py'
      - 'compiler/realsas_compiler_core/proof_engine.py'
      - 'compiler/realsas_compiler_core/skin.py'
      - 'compiler/realsas_compiler_core/rig.py'
      - 'compiler/realsas_compiler_core/mwb2.py'
      - 'compiler/realsas_compiler_core/mwb2_skin.py'
      - 'compiler/realsas_compiler_core/mesh_binding.py'
      - 'compiler/realsas_compiler_core/appearance.py'
      - 'compiler/test_proof_engine_source_v1.py'
      - 'compiler/test_mwb2_source_v1.py'
      - 'compiler/test_mwb2_directional_behavioral_v1.py'
      - 'compiler/test_appearance_source_v1.py'
      - 'compiler/test_appearance_pixel_center_behavioral_v1.py'
      - 'tests/iris/**'
      - '.github/workflows/architecture_freeze_source_gate.yml'
  push:
    branches:
      - architecture/v4-generic-strength-source-completion-20260902
      - behavioral/geppetto-v2-integrity-v1-20260903
    paths:
      - 'canonical/architecture_freeze_gate_v1.py'
      - 'canonical/DINO_TOKEN_PARITY_V1_SEAL_20260902.json'
      - 'canonical/ARCHITECTURE_FREEZE_V1.json'
      - 'canonical/R6_ORACLE_SUBSTRATE_INFORMATION_SUFFICIENCY_PREREG_20260903.md'
      - 'canonical/R6_ARACHNE_ORACLE_SUBSTRATE_PREREG_20260903.md'
      - 'canonical/R6_ARACHNE_ORACLE_SUBSTRATE_HETEROGENEOUS_PREREG_20260903.md'
      - 'canonical/MWB2_DIRECTIONAL_BEHAVIORAL_PREREG_20260903.md'
      - 'canonical/MWB2_DIRECTIONAL_BEHAVIORAL_CLOSURE_20260903.md'
      - 'canonical/APPEARANCE_PIXEL_CENTER_BEHAVIORAL_PREREG_20260903.md'
      - 'canonical/APPEARANCE_PIXEL_CENTER_BEHAVIORAL_CLOSURE_20260903.md'
      - 'experiments/iris_reprojection_v2_20260831/**'
      - 'experiments/geppetto_arachne_r6_20260901/**'
      - 'experiments/single_family_e2e_v1/appearance_builder_v1.py'
      - 'compiler/realsas_compiler_core/proof_engine.py'
      - 'compiler/realsas_compiler_core/skin.py'
      - 'compiler/realsas_compiler_core/rig.py'
      - 'compiler/realsas_compiler_core/mwb2.py'
      - 'compiler/realsas_compiler_core/mwb2_skin.py'
      - 'compiler/realsas_compiler_core/mesh_binding.py'
      - 'compiler/realsas_compiler_core/appearance.py'
      - 'compiler/test_proof_engine_source_v1.py'
      - 'compiler/test_mwb2_source_v1.py'
      - 'compiler/test_mwb2_directional_behavioral_v1.py'
      - 'compiler/test_appearance_source_v1.py'
      - 'compiler/test_appearance_pixel_center_behavioral_v1.py'
      - 'tests/iris/**'
      - '.github/workflows/architecture_freeze_source_gate.yml'

jobs:
  architecture-freeze-source-gate:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install generic source test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow pytest scipy
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Compile current learner and deterministic consumer source
        run: |
          python -m py_compile canonical/architecture_freeze_gate_v1.py experiments/iris_reprojection_v2_20260831/*.py experiments/geppetto_arachne_r6_20260901/*.py compiler/realsas_compiler_core/proof_engine.py compiler/realsas_compiler_core/mwb2.py compiler/realsas_compiler_core/mwb2_skin.py compiler/realsas_compiler_core/mesh_binding.py compiler/realsas_compiler_core/appearance.py compiler/test_proof_engine_source_v1.py compiler/test_mwb2_source_v1.py compiler/test_mwb2_directional_behavioral_v1.py compiler/test_appearance_source_v1.py compiler/test_appearance_pixel_center_behavioral_v1.py
      - name: Verify architecture is family-independent and freeze-eligible
        run: |
          python canonical/architecture_freeze_gate_v1.py --repo-root . | tee architecture-freeze-candidate.json
      - name: Preserve refreeze candidate fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: architecture-freeze-candidate
          path: architecture-freeze-candidate.json
      - name: Run current generic-strength and behavioral learner/consumer gates
        id: generic_tests
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          PYTHONHASHSEED: '0'
        shell: bash
        run: |
          set +e
          python -m pytest -q -s \
            tests/iris/test_iris_v2_source_v1.py \
            tests/iris/test_iris_v2_generic_strength_v1.py \
            tests/iris/test_iris_v2_privileged_input_firewall_v1.py \
            tests/iris/test_iris_v2_surface_relations_v1.py \
            compiler/test_proof_engine_source_v1.py \
            compiler/test_mwb2_source_v1.py \
            compiler/test_mwb2_directional_behavioral_v1.py \
            compiler/test_appearance_source_v1.py \
            compiler/test_appearance_pixel_center_behavioral_v1.py \
            experiments/geppetto_arachne_r6_20260901/test_geppetto_loss_accumulator_v2.py \
            experiments/geppetto_arachne_r6_20260901/test_geppetto_v2_source.py \
            experiments/geppetto_arachne_r6_20260901/test_geppetto_v2_generic_strength.py \
            experiments/geppetto_arachne_r6_20260901/test_geppetto_v2_behavioral_integrity.py \
            experiments/geppetto_arachne_r6_20260901/test_geppetto_v2_behavioral_overfit.py \
            experiments/geppetto_arachne_r6_20260901/test_geppetto_v2_behavioral_panel.py \
            experiments/geppetto_arachne_r6_20260901/test_arachne_codec_v2_source.py \
            experiments/geppetto_arachne_r6_20260901/test_arachne_v2_generic_strength.py \
            experiments/geppetto_arachne_r6_20260901/test_skin_field_codec_objective_causal_diagnostic.py \
            experiments/geppetto_arachne_r6_20260901/test_skin_field_codec_shipping_stable_v1.py \
            experiments/geppetto_arachne_r6_20260901/test_arachne_shipping_boundary_v1.py \
            experiments/geppetto_arachne_r6_20260901/test_r6_oracle_substrate_geppetto_one_family_v1.py \
            experiments/geppetto_arachne_r6_20260901/test_r6_oracle_substrate_geppetto_heterogeneous_v1.py \
            experiments/geppetto_arachne_r6_20260901/test_r6_oracle_substrate_arachne_one_family_v1.py \
            experiments/geppetto_arachne_r6_20260901/test_r6_oracle_substrate_arachne_heterogeneous_v1.py \
            2>&1 | tee generic-strength-tests.log
          STATUS=${PIPESTATUS[0]}
          echo "pytest_exit_code=$STATUS" >> generic-strength-tests.log
          exit $STATUS
      - name: Preserve generic learner gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generic-strength-tests-log
          path: generic-strength-tests.log
      - name: Verify V1 provenance / selection-authority handoff
        shell: bash
        run: |
          V1_SUPERSEDED=$(python - <<'PY'
          import json
          from pathlib import Path

          v1_path = Path('canonical/ARCHITECTURE_FREEZE_V1.json')
          v2_path = Path('canonical/ARCHITECTURE_FREEZE_V2.json')
          if not (v1_path.is_file() and v2_path.is_file()):
              print('no')
          else:
              v1 = json.loads(v1_path.read_text())
              v2 = json.loads(v2_path.read_text())
              historical = v2.get('historical_freeze_v1', {})
              superseded = (
                  v1.get('schema') == 'RealSaS.ArchitectureFreezeSeal.v1'
                  and v1.get('status') == 'PASS_ARCHITECTURE_FROZEN'
                  and v2.get('schema') == 'RealSaS.ArchitectureFreezeSeal.v2'
                  and historical.get('path') == 'canonical/ARCHITECTURE_FREEZE_V1.json'
                  and historical.get('status') == 'SUPERSEDED_FOR_CURRENT_SELECTION_AUTHORITY'
                  and historical.get('preserved_for_provenance') is True
              )
              print('yes' if superseded else 'no')
          PY
          )
          if [ "$V1_SUPERSEDED" = "yes" ]; then
            echo 'PASS: V1 freeze is preserved as historical provenance and explicitly superseded for current selection authority; this V1 gate does not re-authorize selection.'
            exit 0
          fi

          STATUS=$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('canonical/ARCHITECTURE_FREEZE_V1.json')
          print(json.loads(p.read_text()).get('status','MISSING') if p.is_file() else 'MISSING')
          PY
          )
          if [ "$STATUS" = "PASS_ARCHITECTURE_FROZEN" ]; then
            python canonical/architecture_freeze_gate_v1.py --repo-root . --check-selection-authority
            echo 'PASS: frozen V1 fingerprint authorizes family selection'
          else
            if python canonical/architecture_freeze_gate_v1.py --repo-root . --check-selection-authority; then
              echo 'ERROR: family selection became authorized while V1 freeze is absent/invalidated'
              exit 1
            fi
            echo "PASS: family selection remains blocked while V1 freeze status is $STATUS"
          fi
