name: architecture-freeze-source-gate

on:
  pull_request:
    paths:
      - 'canonical/architecture_freeze_gate_v1.py'
      - 'canonical/DINO_TOKEN_PARITY_V1_SEAL_20260902.json'
      - 'canonical/ARCHITECTURE_FREEZE_V1.json'
      - 'experiments/iris_reprojection_v2_20260831/**'
      - 'experiments/geppetto_arachne_r6_20260901/**'
      - 'compiler/realsas_compiler_core/proof_engine.py'
      - 'compiler/test_proof_engine_source_v1.py'
      - 'tests/iris/**'
      - '.github/workflows/architecture_freeze_source_gate.yml'
  push:
    branches:
      - architecture/v4-generic-strength-source-completion-20260902
    paths:
      - 'canonical/architecture_freeze_gate_v1.py'
      - 'canonical/DINO_TOKEN_PARITY_V1_SEAL_20260902.json'
      - 'canonical/ARCHITECTURE_FREEZE_V1.json'
      - 'experiments/iris_reprojection_v2_20260831/**'
      - 'experiments/geppetto_arachne_r6_20260901/**'
      - 'compiler/realsas_compiler_core/proof_engine.py'
      - 'compiler/test_proof_engine_source_v1.py'
      - 'tests/iris/**'
      - '.github/workflows/architecture_freeze_source_gate.yml'

jobs:
  architecture-freeze-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install generic source test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow pytest scipy
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Compile current learner source
        run: |
          python -m py_compile canonical/architecture_freeze_gate_v1.py experiments/iris_reprojection_v2_20260831/*.py experiments/geppetto_arachne_r6_20260901/*.py compiler/realsas_compiler_core/proof_engine.py compiler/test_proof_engine_source_v1.py
      - name: Verify architecture is family-independent and freeze-eligible
        run: |
          python canonical/architecture_freeze_gate_v1.py --repo-root . | tee architecture-freeze-candidate.json
      - name: Preserve refreeze candidate fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: architecture-freeze-candidate
          path: architecture-freeze-candidate.json
      - name: Run current generic-strength and behavioral learner gates
        id: generic_tests
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          PYTHONHASHSEED: '0'
        shell: bash
        run: |
          set +e
          python -m pytest -q -s \
            tests/iris/test_iris_v2_source_v1.py \
            tests/iris/test_iris_v2_generic_strength_v1.py \
            tests/iris/test_iris_v2_surface_relations_v1.py \
            compiler/test_proof_engine_source_v1.py \
            experiments/geppetto_arachne_r6_20260901/test_geppetto_loss_accumulator_v2.py \
            experiments/geppetto_arachne_r6_20260901/test_geppetto_v2_source.py \
            experiments/geppetto_arachne_r6_20260901/test_geppetto_v2_generic_strength.py \
            experiments/geppetto_arachne_r6_20260901/test_geppetto_v2_behavioral_integrity.py \
            experiments/geppetto_arachne_r6_20260901/test_geppetto_v2_behavioral_overfit.py \
            experiments/geppetto_arachne_r6_20260901/test_geppetto_v2_behavioral_panel.py \
            experiments/geppetto_arachne_r6_20260901/test_arachne_codec_v2_source.py \
            experiments/geppetto_arachne_r6_20260901/test_arachne_v2_generic_strength.py \
            2>&1 | tee generic-strength-tests.log
          STATUS=${PIPESTATUS[0]}
          echo "pytest_exit_code=$STATUS" >> generic-strength-tests.log
          exit $STATUS
      - name: Preserve generic learner gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generic-strength-tests-log
          path: generic-strength-tests.log
      - name: Verify family-selection authorization state
        shell: bash
        run: |
          STATUS=$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('canonical/ARCHITECTURE_FREEZE_V1.json')
          print(json.loads(p.read_text()).get('status','MISSING') if p.is_file() else 'MISSING')
          PY
          )
          if [ "$STATUS" = "PASS_ARCHITECTURE_FROZEN" ]; then
            python canonical/architecture_freeze_gate_v1.py --repo-root . --check-selection-authority
            echo 'PASS: frozen fingerprint authorizes family selection'
          else
            if python canonical/architecture_freeze_gate_v1.py --repo-root . --check-selection-authority; then
              echo 'ERROR: family selection became authorized while freeze is absent/invalidated'
              exit 1
            fi
            echo "PASS: family selection remains blocked while freeze status is $STATUS"
          fi
