name: architecture-freeze-v2-candidate

on:
  push:
    branches:
      - hardening/pre-fit-closure-v1-20260904
    paths:
      - 'models/**'
      - 'compiler/realsas_compiler_core/**'
      - 'compiler/realsas_compiler_services/**'
      - 'compiler/vendor/realsas_synthesis/**'
      - 'compiler/vendor/realsas_v05_current_execution_closure.b64/**'
      - 'runtime/reference_v4/**'
      - 'runtime/realsas_cpp/**'
      - 'experiments/family_selection_v1/**'
      - 'experiments/single_family_e2e_v1/data_manifest_v1.py'
      - 'canonical/architecture_freeze_gate_v2.py'
      - 'canonical/LEARNED_ARTIFACT_REGISTRY_V1_20260904.json'
      - 'canonical/ARCHITECTURE_FREEZE_V2.json'
      - 'canonical/DINO_TOKEN_PARITY_V1_SEAL_20260902.json'
      - 'canonical/MWB2_DIRECTIONAL_BEHAVIORAL_CLOSURE_20260903.md'
      - 'tests/models/test_learned_artifact_registry_authorization_v1.py'
      - 'tests/repository/test_learned_artifact_registry_v1.py'
      - '.github/workflows/architecture_freeze_v2_candidate.yml'
  workflow_dispatch:

jobs:
  freeze-candidate:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install freeze dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
          PIP_DEFAULT_TIMEOUT: '60'
        run: |
          python -m pip install --no-input --progress-bar off --only-binary=:all: numpy scipy pytest pillow
          python -m pip install --no-input --progress-bar off torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build living-source freeze candidate
        run: python canonical/architecture_freeze_gate_v2.py --repo-root . | tee architecture-freeze-v2-candidate.json
      - name: Run prefit hardening and selection regressions
        run: |
          python -m pytest -q \
            tests/compiler/test_canonical_graph_visible_authority_v1.py \
            tests/compiler/test_skin_repair_accounting_v1.py \
            tests/iris/test_iris_v2_mode_determinism_v1.py \
            tests/iris/test_iris_v2_resource_contract_v1.py \
            tests/iris/test_iris_v2_support_telemetry_v1.py \
            tests/models/test_geppetto_determinism_hardening_v1.py \
            tests/models/test_geppetto_matching_hardening_v1.py \
            tests/models/test_arachne_checkpoint_v2.py \
            tests/models/test_learned_artifact_registry_authorization_v1.py \
            tests/repository/test_learned_artifact_registry_v1.py \
            experiments/family_selection_v1/test_prefit_family_truth_eligibility_v1.py \
            experiments/family_selection_v1/test_post_freeze_family_selector_v1.py
      - name: Verify sealed selection authority when seal exists
        run: |
          if [ -f canonical/ARCHITECTURE_FREEZE_V2.json ]; then
            python canonical/architecture_freeze_gate_v2.py --repo-root . --check-selection-authority
          else
            echo 'V2 seal absent: candidate-only run, selection remains blocked'
          fi
      - name: Emit candidate identities
        run: |
          python - <<'PY'
          import json
          d=json.load(open('architecture-freeze-v2-candidate.json','r',encoding='utf-8'))
          print('FREEZE_V2_CANDIDATE_STATUS='+d['status'])
          print('LIVING_SOURCE_COUNT='+str(d['living_source_count']))
          print('LIVING_SOURCE_FINGERPRINT_SHA256='+d['living_source_fingerprint_sha256'])
          print('SELECTION_APPARATUS_COUNT='+str(d['selection_apparatus_count']))
          print('SELECTION_APPARATUS_FINGERPRINT_SHA256='+d['selection_apparatus_fingerprint_sha256'])
          print('VENDOR_EXECUTION_RAW_SHA256='+d['vendor_execution_raw_sha256'])
          print('VISIBLE_OPTIMIZER_SHA256='+d['visible_optimizer_sha256'])
          PY
      - name: Preserve candidate
        uses: actions/upload-artifact@v4
        with:
          name: architecture-freeze-v2-candidate
          path: architecture-freeze-v2-candidate.json
