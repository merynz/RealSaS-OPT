name: authored-visual-oracle-v1

on:
  workflow_run:
    workflows: [platform-developer-deployment]
    types: [completed]

concurrency:
  group: authored-visual-oracle-v1-canonical-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  native-go-attempt:
    # Explicit native-host research witness. Actions only submits to Go; it does
    # not execute Compiler stages or write Registry/Attempt state directly.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Require exact deployed live canonical main
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
          /home/monster/realsas_platform/current/bin/realsas-python - <<'PY'
          import json, os
          from pathlib import Path
          deployment = json.loads(Path('/home/monster/realsas_platform/deployment.json').read_text())
          assert deployment['code_sha'] == os.environ['EXPECTED_SHA'], 'DEPLOYED_MAIN_DRIFT'
          PY
      - name: Execute or inspect the same authorized Go Attempt
        run: |
          /home/monster/realsas_platform/current/bin/realsas-python \
            tools/platform_visual_oracle_v1.py \
            --root /home/monster/realsas_platform --timeout 1200
      - name: Preserve exact measurement and Go handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authored-visual-oracle-v1
          path: /home/monster/realsas_platform/oracle-results/AUTHORED_VISUAL_ORACLE_V1_20261010
          if-no-files-found: error
          retention-days: 30
