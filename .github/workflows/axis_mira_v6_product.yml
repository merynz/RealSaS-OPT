name: axis-mira-v6-product

on:
  pull_request:
    paths:
      - 'models/axis/**'
      - 'models/mira/**'
      - 'compiler/realsas_compiler_core/rig_program_ir_v1.py'
      - 'compiler/realsas_compiler_core/canonical_rig_ir_v2.py'
      - 'compiler/realsas_compiler_core/skin_token_ir_v1.py'
      - 'compiler/realsas_compiler_core/canonical_skin_ir_v2.py'
      - 'compiler/realsas_compiler_services/platform_worker/rig_executor_v2.py'
      - 'compiler/realsas_compiler_services/platform_worker/skin_executor_v2.py'
      - 'compiler/realsas_compiler_services/platform_worker/worker.py'
      - 'platform/internal/capability/product_rig.go'
      - 'platform/internal/capability/product_skin.go'
      - 'platform/internal/capability/product_models_test.go'
      - 'platform/internal/capability/contracts/product_capabilities_v1.json'
      - 'tests/models/test_axis_v6_rig_program.py'
      - 'tests/models/test_mira_v6_skin_fsq_codec.py'
      - 'tests/models/test_mira_v6_training.py'
      - 'tests/models/test_axis_mira_v6_product_runtime.py'
      - 'tests/models/test_axis_v6_training.py'
      - 'tests/compiler/test_control_ready_rig_v2.py'
      - 'tests/repository/test_fit1_mechanical_product_role_alignment_v1.py'
      - '.github/workflows/axis_mira_v6_product.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axis-mira-v6-product-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  v6-contract-and-model-courts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-go@v5
        with:
          go-version-file: platform/go.mod
          cache-dependency-path: platform/go.sum

      - name: Install reviewed CPU dependencies
        run: |
          set -euo pipefail
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
          python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt

      - name: Compile V6 product sources
        run: |
          set -euo pipefail
          python -m py_compile \
            models/mira/skin_fsq_codec_v6.py \
            models/mira/conditioning_v6.py \
            models/mira/training_v6.py \
            models/mira/runtime_checkpoint_v2.py \
            models/axis/scene_conditioning_v6.py \
            models/axis/rig_program_model_v6.py \
            models/axis/rig_program_decode_v6.py \
            models/axis/training_v6.py \
            models/axis/runtime_checkpoint_v2.py \
            compiler/realsas_compiler_core/rig_program_ir_v1.py \
            compiler/realsas_compiler_core/canonical_rig_ir_v2.py \
            compiler/realsas_compiler_core/skin_token_ir_v1.py \
            compiler/realsas_compiler_core/canonical_skin_ir_v2.py \
            compiler/realsas_compiler_services/platform_worker/rig_executor_v2.py \
            compiler/realsas_compiler_services/platform_worker/skin_executor_v2.py \
            compiler/realsas_compiler_services/platform_worker/worker.py

      - name: Run V6 model Compiler runtime and training courts
        run: |
          set -euo pipefail
          pytest -q \
            tests/models/test_mira_v6_skin_fsq_codec.py \
            tests/models/test_mira_v6_training.py \
            tests/models/test_axis_v6_rig_program.py \
            tests/models/test_axis_mira_v6_product_runtime.py \
            tests/models/test_axis_v6_training.py \
            tests/compiler/test_control_ready_rig_v2.py \
            tests/repository/test_fit1_mechanical_product_role_alignment_v1.py

      - name: Validate Platform product capability catalog
        working-directory: platform
        run: |
          set -euo pipefail
          go test ./internal/capability

      - name: Smoke coupled shipping-target AXIS-MIRA contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import torch
          from models.axis.rig_program_model_v6 import AXISRigProgramConfigV6, AXISRigProgramModelV6, AXISSequenceV6, RigProgramEventV6, RigTokenKindV6
          from models.axis.scene_conditioning_v6 import AXIS_V6_SURFACE_SCENE_DIM
          from models.mira.conditioning_v6 import MIRA_V6_VERTEX_FEATURE_DIM, MIRA_V6_JOINT_FEATURE_DIM
          from models.mira.skin_fsq_codec_v6 import MIRASkinFSQCodecConfig, MIRASkinFSQCodecV6

          mira_cfg = MIRASkinFSQCodecConfig(MIRA_V6_VERTEX_FEATURE_DIM, MIRA_V6_JOINT_FEATURE_DIM, hidden_dim=32, tokens_per_joint=3, levels=(3,3,3))
          mira = MIRASkinFSQCodecV6(mira_cfg)
          v = torch.randn(1, 12, MIRA_V6_VERTEX_FEATURE_DIM)
          j = torch.randn(1, 4, MIRA_V6_JOINT_FEATURE_DIM)
          w = torch.softmax(torch.randn(1, 12, 4), dim=-1)
          code_ids = mira(w, v, j)['token_ids']
          assert code_ids.shape == (1, 4, 3)

          axis_cfg = AXISRigProgramConfigV6(scene_dim=AXIS_V6_SURFACE_SCENE_DIM, hidden_dim=32, layers=1, heads=4, ff_mult=2, max_sequence_length=32, max_pointer_entities=16, skin_vocab_size=mira_cfg.vocab_size)
          axis = AXISRigProgramModelV6(axis_cfg)
          seq = AXISSequenceV6.from_events([RigProgramEventV6(RigTokenKindV6.BOS)], device=torch.device('cpu'))
          out = axis(torch.randn(1, 9, AXIS_V6_SURFACE_SCENE_DIM), seq)
          assert out['skin_code_logits'].shape[-1] == mira_cfg.vocab_size
          assert out['pointer_c_logits'].shape[-1] == axis_cfg.max_pointer_entities + 1
          print('AXIS_MIRA_V6_PRODUCT_SMOKE_PASS')
          PY
