name: axis-v541-drive-transport-probe

on:
  push:
    branches:
      - probe/axis-v541-drive-transport-v1
    paths:
      - '.github/workflows/axis_v541_drive_transport_probe.yml'

permissions:
  contents: read

jobs:
  stage-sources:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 10
    env:
      KEY_DIR: /home/monster/realsas_authority/transport_keys/axis_v541_v1
      SOURCE_DIR: /home/monster/realsas_authority/model_runtime_recovery/axis_v541/sources
      BASE_SOURCE: /home/monster/realsas_authority/runs/SUBJECT2_KNIGHT_DEMO_V2_20260924/imports/geppetto_stage27_mechanically_meaningful_v2/GEPPETTO_KNIGHT_CHECKPOINT.pt
      BASE_SHA256: 1c124f876858f6f5b5fd0d4639fc7f2b596a25e962d19de8799ecd64ae59b08f
      V53_SHA256: 5f527a51c676bf9ef2d82691f305c139b365e921867623b7338e0848c7dea55a
      V541_SHA256: 4d484c325c3ae2a9a91df422a820cc5ccdf01c804adef4259ff5398cf30e12fb
      TRANSPORT_PUBLIC_KEY_SHA256: 66437a791026ba5bb8abf1dd69453c7a078070a79aa9827de31fdd1305628cfa
      V53_URL_CIPHERTEXT_B64: 
      V541_URL_CIPHERTEXT_B64: 
    steps:
      - uses: actions/checkout@v4

      - name: Require exact host-local transport key
        shell: bash
        run: |
          set -euo pipefail
          private="$KEY_DIR/private.pem"
          public="$KEY_DIR/public.pem"
          test -s "$private"
          test -s "$public"
          actual="$(openssl pkey -pubin -in "$public" -outform DER 2>/dev/null | sha256sum | awk '{print $1}')"
          test "$actual" = "$TRANSPORT_PUBLIC_KEY_SHA256"
          test "$(stat -c '%a' "$private")" = '600'
          echo "TRANSPORT_KEY_FINGERPRINT_OK:$actual"

      - name: Decrypt ephemeral URLs, verify exact bytes, and stage immutable sources
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$SOURCE_DIR"
          chmod 755 "$SOURCE_DIR"
          private="$KEY_DIR/private.pem"

          verify_sha() {
            local path="$1" expected="$2"
            local actual
            actual="$(sha256sum "$path" | awk '{print $1}')"
            test "$actual" = "$expected"
          }

          stage_local() {
            local source="$1" name="$2" expected="$3"
            verify_sha "$source" "$expected"
            local dest="$SOURCE_DIR/$name"
            if [ -e "$dest" ]; then
              verify_sha "$dest" "$expected"
            else
              install -m 0444 "$source" "$dest"
              verify_sha "$dest" "$expected"
            fi
            echo "SOURCE_STAGE_EXACT_PASS:$name:$expected"
          }

          decrypt_url() {
            local ciphertext="$1" out="$2"
            printf '%s' "$ciphertext" | base64 -d | \
              openssl pkeyutl -decrypt -inkey "$private" \
                -pkeyopt rsa_padding_mode:oaep \
                -pkeyopt rsa_oaep_md:sha256 \
                -pkeyopt rsa_mgf1_md:sha256 > "$out"
            python - "$out" <<'PY'
          import sys
          from pathlib import Path
          from urllib.parse import urlparse
          url = Path(sys.argv[1]).read_text(encoding='utf-8')
          parsed = urlparse(url)
          assert parsed.scheme == 'https', 'TRANSPORT_URL_SCHEME'
          assert parsed.hostname and parsed.hostname.endswith('.oaiusercontent.com'), 'TRANSPORT_URL_HOST'
          assert len(url) < 1024, 'TRANSPORT_URL_LENGTH'
          PY
          }

          fetch_stage() {
            local name="$1" expected="$2" ciphertext="$3"
            local url_file="$tmp/$name.url" payload="$tmp/$name"
            decrypt_url "$ciphertext" "$url_file"
            local url
            url="$(cat "$url_file")"
            curl --fail --location --silent --show-error \
              --connect-timeout 15 --max-time 240 \
              "$url" -o "$payload"
            verify_sha "$payload" "$expected"
            local dest="$SOURCE_DIR/$name"
            if [ -e "$dest" ]; then
              verify_sha "$dest" "$expected"
            else
              install -m 0444 "$payload" "$dest"
              verify_sha "$dest" "$expected"
            fi
            echo "SOURCE_STAGE_EXACT_PASS:$name:$expected"
          }

          stage_local "$BASE_SOURCE" GEPPETTO_KNIGHT_CHECKPOINT.pt "$BASE_SHA256"
          fetch_stage AXIS41_TREE_GRAMMAR_PROGRESS_V53.pt "$V53_SHA256" "$V53_URL_CIPHERTEXT_B64"
          fetch_stage AXIS41_DISCRETE_XYZ_FROZEN_CAUSAL_COMPOSITE_V541.pt "$V541_SHA256" "$V541_URL_CIPHERTEXT_B64"

      - name: Write non-secret transport receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['SOURCE_DIR'])
          expected = {
              'GEPPETTO_KNIGHT_CHECKPOINT.pt': os.environ['BASE_SHA256'],
              'AXIS41_TREE_GRAMMAR_PROGRESS_V53.pt': os.environ['V53_SHA256'],
              'AXIS41_DISCRETE_XYZ_FROZEN_CAUSAL_COMPOSITE_V541.pt': os.environ['V541_SHA256'],
          }
          files = []
          for name, want in expected.items():
              p = root / name
              h = hashlib.sha256(p.read_bytes()).hexdigest()
              assert h == want
              files.append({'name': name, 'sha256': h, 'size_bytes': p.stat().st_size})
          receipt = {
              'schema': 'RealSaS.AXISV541SourceTransportReceipt.v1',
              'status': 'EXACT_SOURCE_BYTES_STAGED',
              'transport_public_key_sha256': os.environ['TRANSPORT_PUBLIC_KEY_SHA256'],
              'source_files': files,
              'plaintext_url_persisted': False,
              'training_executed': False,
              'runtime_packaging_executed': False,
              'artifact_import_performed': False,
              'modelrelease_registered': False,
              'model_promotion_performed': False,
              'model_inference_executed': False,
              'scientific_pass_minted': False,
              'product_authority_minted': False,
          }
          out = root / 'SOURCE_TRANSPORT_RECEIPT.json'
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(receipt, sort_keys=True))
          PY
