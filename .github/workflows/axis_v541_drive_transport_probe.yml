name: axis-v541-drive-transport-probe

on:
  push:
    branches:
      - probe/axis-v541-drive-transport-v1
    paths:
      - '.github/workflows/axis_v541_drive_transport_probe.yml'

permissions:
  contents: read

jobs:
  bootstrap-key:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Create or reuse host-local transport key and emit public half
        shell: bash
        run: |
          set -euo pipefail
          key_dir=/home/monster/realsas_authority/transport_keys/axis_v541_v1
          private="$key_dir/private.pem"
          public="$key_dir/public.pem"
          mkdir -p "$key_dir"
          chmod 700 "$key_dir"

          if [ ! -s "$private" ]; then
            umask 077
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out "$private" >/dev/null 2>&1
          fi
          chmod 600 "$private"
          openssl pkey -in "$private" -pubout -out "$public" >/dev/null 2>&1
          chmod 644 "$public"

          echo 'AXIS_TRANSPORT_PUBLIC_KEY_BEGIN'
          cat "$public"
          echo 'AXIS_TRANSPORT_PUBLIC_KEY_END'
          printf 'AXIS_TRANSPORT_PUBLIC_KEY_SHA256:'
          openssl pkey -pubin -in "$public" -outform DER 2>/dev/null | sha256sum | awk '{print $1}'
          echo 'AXIS_TRANSPORT_PRIVATE_KEY_HOST_LOCAL_ONLY:true'
