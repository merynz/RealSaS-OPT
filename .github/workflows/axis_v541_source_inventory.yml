name: axis-v541-source-inventory

on:
  workflow_dispatch:
  workflow_run:
    workflows: [platform-developer-deployment]
    types: [completed]

concurrency:
  group: axis-v541-source-inventory
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  activation:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      expected_sha: ${{ steps.resolve.outputs.expected_sha }}
    steps:
      - name: Resolve selected canonical SHA
        id: sha
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'workflow_run' ]; then
            echo "expected_sha=$WORKFLOW_RUN_HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "expected_sha=$DISPATCH_SHA" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.expected_sha }}
          fetch-depth: 2

      - name: Resolve read-only AXIS inventory request
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SHA: ${{ steps.sha.outputs.expected_sha }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGER_PATH: canonical/AXIS_V541_SOURCE_INVENTORY_TRIGGER_V1.json
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import subprocess
          from pathlib import Path

          event = os.environ['EVENT_NAME']
          expected_sha = os.environ['EXPECTED_SHA'].strip().lower()
          should_run = event == 'workflow_dispatch'
          if event == 'workflow_run':
              if (os.environ.get('WORKFLOW_RUN_CONCLUSION') == 'success' and
                      os.environ.get('WORKFLOW_RUN_HEAD_BRANCH') == 'main'):
                  changed = subprocess.check_output(
                      ['git', 'diff-tree', '--no-commit-id', '--name-only', '-r', 'HEAD^1', 'HEAD'],
                      text=True,
                  ).splitlines()
                  trigger_path = Path(os.environ['TRIGGER_PATH'])
                  if str(trigger_path) in changed:
                      trigger = json.loads(trigger_path.read_text(encoding='utf-8'))
                      assert trigger.get('schema') == 'RealSaS.AXISV541SourceInventoryTrigger.v1', 'AXIS_SOURCE_INVENTORY_TRIGGER_SCHEMA'
                      assert trigger.get('operation') == 'AXIS_V541_SOURCE_INVENTORY', 'AXIS_SOURCE_INVENTORY_TRIGGER_OPERATION'
                      assert isinstance(trigger.get('enabled'), bool), 'AXIS_SOURCE_INVENTORY_TRIGGER_ENABLED_BOOL'
                      should_run = bool(trigger['enabled'])

          print(f"should_run={'true' if should_run else 'false'}")
          print(f'expected_sha={expected_sha}')
          PY

  inspect:
    needs: activation
    if: needs.activation.outputs.should_run == 'true'
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    env:
      PLATFORM_ROOT: /home/monster/realsas_platform
      EXPECTED_SHA: ${{ needs.activation.outputs.expected_sha }}
      OUTPUT_PATH: /home/monster/realsas_authority/model_runtime_recovery/axis_v541/inventory/${{ github.run_id }}-${{ github.run_attempt }}/INVENTORY.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}

      - name: Require exact deployed canonical main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
          "$PLATFORM_ROOT/current/bin/realsas-python" - <<'PY'
          import json
          import os
          from pathlib import Path

          deployment = json.loads(Path('/home/monster/realsas_platform/deployment.json').read_text())
          assert deployment['schema'] == 'RealSaS.DeveloperDeployment.v1', 'AXIS_SOURCE_INVENTORY_DEPLOYMENT_SCHEMA'
          assert deployment['code_sha'] == os.environ['EXPECTED_SHA'], 'AXIS_SOURCE_INVENTORY_DEPLOYED_MAIN_DRIFT'
          PY

      - name: Execute read-only exact-hash source inventory
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$OUTPUT_PATH")"
          "$PLATFORM_ROOT/current/bin/realsas-python" \
            "$GITHUB_WORKSPACE/tools/ops/inspect_axis_v541_source_inventory_v1.py" \
            --out "$OUTPUT_PATH"

      - name: Verify inventory authority boundaries
        run: |
          set -euo pipefail
          "$PLATFORM_ROOT/current/bin/realsas-python" - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(Path(os.environ['OUTPUT_PATH']).read_text(encoding='utf-8'))
          assert receipt['schema'] == 'RealSaS.AXISV541SourceInventory.v1', 'AXIS_SOURCE_INVENTORY_SCHEMA'
          assert receipt['status'] in {
              'EXACT_ALL_COMPONENTS_FOUND_ON_HOST',
              'PARTIAL_EXACT_COMPONENTS_FOUND_ON_HOST',
              'NO_EXACT_COMPONENTS_FOUND_ON_HOST',
          }, 'AXIS_SOURCE_INVENTORY_STATUS'
          assert receipt['read_only_inventory'] is True
          for key in (
              'training_executed', 'runtime_packaging_executed',
              'artifact_import_performed', 'modelrelease_registered',
              'model_promotion_performed', 'model_inference_executed',
              'compiler_capability_executed', 'scientific_pass_minted',
              'product_authority_minted', 'genericity_claimed',
          ):
              assert receipt[key] is False, f'AXIS_SOURCE_INVENTORY_AUTHORITY_VIOLATION:{key}'
          PY

      - name: Preserve exact read-only AXIS inventory receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axis-v541-source-inventory-${{ github.run_id }}
          path: ${{ env.OUTPUT_PATH }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
