name: BUSTED Pages Live Witness
# Manual incident-recovery/proof tool; never run on ordinary product PRs.
on:
  workflow_dispatch:
jobs:
  public-pages-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public GitHub Pages HTML and CSS directly
        shell: bash
        run: |
          set -euo pipefail
          URL="https://merynz.github.io/RealSaS-OPT"
          curl --fail --location --silent --show-error --retry 3 \
            -H 'Cache-Control: no-cache' "$URL/index.html?pages_witness=${GITHUB_RUN_ID}" -o /tmp/busted-live-index.html
          echo "=== Public page revision markers ==="
          grep -E 'busted_awaken_reactor|busted_compile_terminal|studio_director|QUALIFIED|ALIVE' /tmp/busted-live-index.html || true
          echo "=== Pages HTML content fingerprint ==="
          sha256sum /tmp/busted-live-index.html
          echo "=== Public reactor CSS status ==="
          curl -sSLI --retry 3 "$URL/static/css/busted_awaken_reactor_v3.css?pages_witness=${GITHUB_RUN_ID}" | sed -n '1,18p'
          curl --fail -sSL --retry 3 "$URL/static/css/busted_awaken_reactor_v3.css?pages_witness=${GITHUB_RUN_ID}" -o /tmp/live-fire.css
          grep -E 'fiery|#awaken.awaken-button|#ffac55' /tmp/live-fire.css || true
          echo "=== Authoritative live source and half-density check ==="
          curl -fsSL "$URL/static/js/busted_stage_rain_v2.js?pages_witness=${GITHUB_RUN_ID}" -o /tmp/rain.js
          curl -fsSL "$URL/static/js/busted_spatial_typing_v4.js?pages_witness=${GITHUB_RUN_ID}" -o /tmp/typing.js
          curl -fsSL "$URL/static/js/busted_ignition_reactor_v3.js?pages_witness=${GITHUB_RUN_ID}" -o /tmp/reactor.js
          curl -fsSL "$URL/static/css/busted_product_story_v1.css?pages_witness=${GITHUB_RUN_ID}" -o /tmp/story.css
          curl -fsSL "$URL/static/css/busted_story_refinement_v2.css?pages_witness=${GITHUB_RUN_ID}" -o /tmp/story-refine.css
          echo "=== Compiler-first product positioning: LIVE ==="
          grep -E 'The character is the result|PUPPET-FIRST|ANIMATION-FIRST|CREATIVE CONTROL' /tmp/busted-live-index.html || true
          if grep -q 'The character is the result.' /tmp/busted-live-index.html && \
             grep -q 'CREATIVE CONTROL, NOT MANDATORY SETUP' /tmp/busted-live-index.html && \
             grep -q 'PUPPET-FIRST' /tmp/busted-live-index.html && \
             grep -q 'ANIMATION-FIRST' /tmp/busted-live-index.html && \
             grep -q 'busted_story_refinement_v2.css?v=2.1.0' /tmp/busted-live-index.html && \
             grep -q 'busted-compile-vs-studio' /tmp/story-refine.css && \
             grep -q 'width:max-content!important' /tmp/live-fire.css && \
             grep -q 'id="artworkGuide"' /tmp/busted-live-index.html && \
             grep -q 'id="technology"' /tmp/busted-live-index.html && \
             grep -q 'busted_product_story_v1.css?v=1.0.0' /tmp/busted-live-index.html && \
             grep -q '#artworkGuide' /tmp/story.css && \
             grep -q '#technology' /tmp/story.css && \
             grep -q 'width:100%!important' /tmp/live-fire.css && \
             grep -q 'busted_awaken_reactor_v3.css' /tmp/busted-live-index.html && \
             grep -q 'busted_spatial_typing_v4.js?v=4.1.0' /tmp/busted-live-index.html && \
             grep -q '<h2>QUALIFIED</h2>' /tmp/busted-live-index.html && \
             grep -q "hero'?36:32" /tmp/rain.js && \
             grep -q 'tablet?4:6' /tmp/typing.js && \
             grep -q 'installAwakenReactor' /tmp/reactor.js; then
            echo 'PUBLIC_PAGES_CURRENT=YES'
          else
            echo 'PUBLIC_PAGES_CURRENT=NO'
            exit 1
          fi
