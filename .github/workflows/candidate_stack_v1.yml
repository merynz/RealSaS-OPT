name: candidate-stack-v1

on:
  pull_request:
    paths:
      - 'experiments/geppetto_arachne_r6_20260901/**'
      - '.github/workflows/candidate_stack_v1.yml'
  push:
    branches:
      - single-family-e2e-models-v1-20260902
    paths:
      - 'experiments/geppetto_arachne_r6_20260901/**'
      - '.github/workflows/candidate_stack_v1.yml'

jobs:
  candidate-stack-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile candidate source
        run: |
          python -m py_compile experiments/geppetto_arachne_r6_20260901/*.py
      - name: Run candidate contract tests
        run: |
          python -m pytest -q experiments/geppetto_arachne_r6_20260901/test_candidate_stack_v1.py
