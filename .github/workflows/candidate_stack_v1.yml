name: candidate-stack-v1

on:
  pull_request:
    paths:
      - 'experiments/geppetto_arachne_r6_20260901/**'
      - '.github/workflows/candidate_stack_v1.yml'
  push:
    branches:
      - single-family-e2e-models-v1-20260902
    paths:
      - 'experiments/geppetto_arachne_r6_20260901/**'
      - '.github/workflows/candidate_stack_v1.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate-stack-v1:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements/mainline-ci.txt
            requirements/torch-cpu.txt
      - name: Install test dependencies
        run: |

          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
          python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt
      - name: Compile candidate source
        run: |
          python -m py_compile experiments/geppetto_arachne_r6_20260901/*.py
      - name: Run candidate contract tests
        run: |
          python -m pytest -q experiments/geppetto_arachne_r6_20260901/test_candidate_stack_v1.py
