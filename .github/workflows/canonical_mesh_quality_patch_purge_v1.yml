name: canonical-mesh-quality-patch-purge-v1

on:
  push:
    branches:
      - audit/canonical-caa-mechanics-geometry-lock-20261002
    paths:
      - compiler/realsas_compiler_core/canonical_mesh_quality_patch_purge_v1.py
      - tests/compiler/test_canonical_mesh_quality_patch_purge_v1.py
      - .github/workflows/canonical_mesh_quality_patch_purge_v1.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - run: python -m py_compile compiler/realsas_compiler_core/canonical_mesh_quality_patch_purge_v1.py
      - run: python -m pytest -q tests/compiler/test_canonical_mesh_quality_patch_purge_v1.py
