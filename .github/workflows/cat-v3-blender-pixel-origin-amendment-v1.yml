name: Original Cat V3 Blender pixel-origin amended independent physical court
on:
  push:
    branches: [research/cat-v3-blender-exr-origin-court-v1]
    paths:
      - 'tools/truth_foundry/blender_image_pixels_bottom_left_origin_fixture_v0.py'
      - 'tools/corpus/court_original_cat_v3_blender_pixel_origin_amendment_v1.py'
      - 'tests/corpus/test_cat_v3_blender_pixel_origin_amendment_v1.py'
      - '.github/workflows/cat-v3-blender-pixel-origin-amendment-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cat-v3-pixel-origin-amendment-v1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  independent-blender-image-buffer-origin-witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Blender marker, independent top-row PNG decoding, no original Cat art
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'numpy>=1.26,<3' 'pillow>=10,<13' 'pytest>=8,<10'
          python -m pytest -q tests/corpus/test_cat_v3_blender_pixel_origin_amendment_v1.py
          D="$RUNNER_TEMP/pixel-origin-fixture"
          mkdir -p "$D"
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 libgl1
          curl -fL --retry 4 --max-time 300 https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz -o "$D/blender.tar.xz"
          curl -fL --retry 4 --max-time 120 https://download.blender.org/release/Blender4.5/blender-4.5.14.sha256 -o "$D/checksums"
          D="$D" python - <<'PY'
          from pathlib import Path
          import hashlib,os,re
          d=Path(os.environ["D"])
          rows=[s for s in (d/"checksums").read_text().splitlines() if "blender-4.5.14-linux-x64.tar.xz" in s]
          assert len(rows)==1
          digests=re.findall(r"[a-fA-F0-9]{64}", rows[0])
          assert len(digests)==1
          with (d/"blender.tar.xz").open("rb") as f:
            assert hashlib.file_digest(f,"sha256").hexdigest()==digests[0].lower()
          PY
          tar -xJf "$D/blender.tar.xz" -C "$D"
          BLENDER="$D/blender-4.5.14-linux-x64/blender"
          test "$(sha256sum "$BLENDER" | cut -d' ' -f1)" = 050c02562f81fe80ba616a80198fa02d381e60f8b61b8d39add881f4bca0d7d8
          "$BLENDER" --background --factory-startup --threads 2 --python-exit-code 1 \
            --python tools/truth_foundry/blender_image_pixels_bottom_left_origin_fixture_v0.py -- \
            --output "$D/marker.png"
          D="$D" python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import os,numpy as np
          d=Path(os.environ["D"])
          a=np.asarray(Image.open(d/"marker.png").convert("RGBA"),dtype=np.uint8)
          assert a.shape == (2,2,4),a.shape
          # PNG decoder rows are TOP FIRST; bpy Image.pixels authored row 0
          # contains red/yellow BOTTOM, row1 blue/green TOP.
          assert np.array_equal(a[0,0],np.array([0,0,255,255],np.uint8)),a.tolist()
          assert np.array_equal(a[0,1],np.array([0,255,0,255],np.uint8))
          assert np.array_equal(a[1,0],np.array([255,0,0,255],np.uint8))
          assert np.array_equal(a[1,1],np.array([255,255,0,255],np.uint8))
          print("INDEPENDENT_PNG_DECODER_PROVES_BLENDER_IMAGE_PIXELS_BOTTOM_FIRST",flush=True)
          PY
  corrected-original-source-physical-court:
    needs: independent-blender-image-buffer-origin-witness
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DRIVE_CONFIG_B64: ${{ secrets.REALSAS_HOSTED_DRIVE_RCLONE_CONFIG_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Re-court exact V0 physical arrays with ONLY fixed source-height reversal
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python -m pip install 'numpy>=1.26,<3'
          D="$RUNNER_TEMP/cat-v3-pixel-origin-amendment"
          mkdir -p "$D"
          export RCLONE_CONFIG="$D/rclone.conf"
          test -n "$DRIVE_CONFIG_B64"
          printf '%s' "$DRIVE_CONFIG_B64" | base64 -d > "$RCLONE_CONFIG"
          test -s "$RCLONE_CONFIG"
          unset DRIVE_CONFIG_B64
          R="$D/rclone-v1.75.2-linux-amd64.zip"
          curl -fLsS --retry 3 --max-time 180 https://github.com/rclone/rclone/releases/download/v1.75.2/rclone-v1.75.2-linux-amd64.zip -o "$R"
          echo "349ac8fba6ff65d6247043f1750cdcb518ec5d500ef91463a10d37c0ccdf3702  $R" | sha256sum --check
          unzip -q "$R" -d "$D"
          export PATH="$D/rclone-v1.75.2-linux-amd64:$PATH"
          ROOT="gdrive:corpus370_preparation_v1"
          SOURCE="$ROOT/hosted_drawable_capability_pose_transport_v3/CAT/42273572984-1"
          V0="$ROOT/hosted_original_cat_v3_puppet_physical_parity_v0/CAT/42285528834-1"
          for F in PRIVATE_CAT_NATIVE_POSE_UV_EDIT_CYCLES_SAMPLES_V3.npz PRIVATE_CAT_NATIVE_POSE_UV_EDIT_CYCLES_V3.json PRIVATE_INDEPENDENT_CAT_POSE_UV_TRANSPORT_V3.json; do
            rclone copyto "$SOURCE/$F" "$D/$F" --checksum --retries 3
          done
          for F in PRIVATE_CAT_V3_PUPPET_REFERENCE_PREDICTIONS_V0.npz PRIVATE_CAT_V3_PUPPET_REFERENCE_PREDICTIONS_V0.json PRIVATE_INDEPENDENT_CAT_V3_PUPPET_REFERENCE_PHYSICAL_PARITY_V0.json; do
            rclone copyto "$V0/$F" "$D/$F" --checksum --retries 3
          done
          echo "b2bb4fa9fc0b777bb8418aebc729123616b774b55eeb215ba17651e7f3448e0d  $D/PRIVATE_CAT_NATIVE_POSE_UV_EDIT_CYCLES_SAMPLES_V3.npz" | sha256sum --check
          echo "55675886ae92c3b122647b1749290675dc8fbc13d1c617c9340ec42fe3e702d8  $D/PRIVATE_CAT_V3_PUPPET_REFERENCE_PREDICTIONS_V0.npz" | sha256sum --check
          echo "90759dd7f431b89ccc697824a9f9485fa2cdef15360a89746d0978dbd1ae50b4  $D/PRIVATE_INDEPENDENT_CAT_V3_PUPPET_REFERENCE_PHYSICAL_PARITY_V0.json" | sha256sum --check
          python -m tools.corpus.court_original_cat_v3_blender_pixel_origin_amendment_v1 \
            --root "$D" --output "$D/PRIVATE_CAT_V3_BLENDER_PIXEL_ORIGIN_AMENDMENT_A1_COURT.json"
          DEST="$ROOT/hosted_cat_v3_blender_pixel_origin_amendment_a1/CAT/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          F="$D/PRIVATE_CAT_V3_BLENDER_PIXEL_ORIGIN_AMENDMENT_A1_COURT.json"
          rclone copyto "$F" "$DEST/$(basename "$F")" --checksum --retries 3
          rclone cat "$DEST/$(basename "$F")" > "$D/readback.json"
          cmp "$F" "$D/readback.json"
          sha256sum "$F"
          echo "A1_ORIGIN_ONLY_COURT_RECORDED__ORIGINAL_V0_FAIL_PRESERVED__NO_TRAINING_AUTHORITY"
