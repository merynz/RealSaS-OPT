name: CharacterGen Mage Baseline V1

on:
  push:
    branches:
      - first-family-fit/charactergen-backbone-v1
    paths:
      - '.github/workflows/charactergen_mage_baseline_v1.yml'
      - 'experiments/charactergen_baseline_v1/**'
      - 'compiler/realsas_compiler_core/substrate/reconstructed_mesh.py'
  workflow_dispatch:

jobs:
  mage-charactergen-cardinal4:
    runs-on: [self-hosted, realsas, gpu]
    timeout-minutes: 180
    env:
      REALSAS_LOCAL_ML_VENV: /home/monster/realsas-ml312
      REALSAS_BLENDER_CACHE: /home/monster/.cache/realsas/blender
      REALSAS_SOURCE_CACHE: /home/monster/.cache/realsas/family_sources
      FIRST_FAMILY_SPEC: experiments/first_family_fit_v1/FIRST_FAMILY_FIT_SPEC_V1.json
      FIRST_FAMILY_AUTHORITY_MANIFEST: experiments/first_family_fit_v1/FIRST_FAMILY_AUTHORITY_V1.json
      CHARACTERGEN_COMMIT: f329a835dbd5003060a5653eafd83d4d8868b043
      CHARACTERGEN_ROOT: /home/monster/.cache/realsas/charactergen/f329a835dbd5003060a5653eafd83d4d8868b043
      CHARACTERGEN_HF_ROOT: /home/monster/.cache/realsas/charactergen_hf/zjpshadow_CharacterGen
      CHARACTERGEN_VENV: /home/monster/.cache/realsas/charactergen_venv_py39_f329a835

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify RealSaS CUDA environment
        shell: bash
        run: |
          set -euxo pipefail
          test -x "$REALSAS_LOCAL_ML_VENV/bin/python"
          "$REALSAS_LOCAL_ML_VENV/bin/python" - <<'PY'
          import torch
          assert torch.cuda.is_available()
          print('torch', torch.__version__)
          print('gpu', torch.cuda.get_device_name(0))
          free,total=torch.cuda.mem_get_info()
          print('gpu_mem_free_gib', free/2**30, 'total_gib', total/2**30)
          PY
          nvidia-smi || true

      - name: Resolve Mage authority source
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          asset_id="$("$REALSAS_LOCAL_ML_VENV/bin/python" -c 'import json,os; print(json.load(open(os.environ["FIRST_FAMILY_SPEC"]))["asset_id"])')"
          pg_sha="$("$REALSAS_LOCAL_ML_VENV/bin/python" -c 'import json,os; print(json.load(open(os.environ["FIRST_FAMILY_SPEC"]))["authority"]["primary_geometry_sha256"])')"
          zip_name="$("$REALSAS_LOCAL_ML_VENV/bin/python" -c 'import json,os; print(json.load(open(os.environ["FIRST_FAMILY_SPEC"]))["authority"]["fallback_zip_name"])')"
          zip_sha="$("$REALSAS_LOCAL_ML_VENV/bin/python" -c 'import json,os; print(json.load(open(os.environ["FIRST_FAMILY_SPEC"]))["authority"]["fallback_zip_sha256"])')"
          master=''
          roots=()
          [ -n "${REALSAS_MASTER_ROOT:-}" ] && roots+=("$REALSAS_MASTER_ROOT")
          roots+=(
            /mnt/g/My\ Drive/RealSaS_MASTER_CORPUS_1024_V3
            /mnt/g/RealSaS_MASTER_CORPUS_1024_V3
            /mnt/g/Google\ Drive/My\ Drive/RealSaS_MASTER_CORPUS_1024_V3
            /mnt/c/Users/*/My\ Drive/RealSaS_MASTER_CORPUS_1024_V3
            /mnt/c/Users/*/Google\ Drive/My\ Drive/RealSaS_MASTER_CORPUS_1024_V3
            /mnt/c/Users/*/Google\ Drive/RealSaS_MASTER_CORPUS_1024_V3
            /mnt/c/Users/*/Drive/My\ Drive/RealSaS_MASTER_CORPUS_1024_V3
            /mnt/d/RealSaS_MASTER_CORPUS_1024_V3
            /mnt/e/RealSaS_MASTER_CORPUS_1024_V3
          )
          for root in "${roots[@]}"; do
            [ -d "$root" ] || continue
            pg="$root/master/assets/$asset_id/primary_geometry.npz"
            [ -f "$pg" ] || continue
            got="$(sha256sum "$pg" | awk '{print $1}')"
            if [ "$got" = "$pg_sha" ]; then master="$root"; break; fi
          done
          if [ -n "$master" ]; then
            echo "REALSAS_MASTER_ROOT=$master" >> "$GITHUB_ENV"
            echo "REALSAS_AUTHORITY_MODE=DIRECT_MASTER_CORPUS" >> "$GITHUB_ENV"
            exit 0
          fi
          packs=(/mnt/c/Users/*/Downloads/"$zip_name")
          test "${#packs[@]}" -gt 0
          pack="${packs[0]}"
          got="$(sha256sum "$pack" | awk '{print $1}')"
          test "$got" = "$zip_sha"
          echo "FIRST_FAMILY_AUTHORITY_ZIP=$pack" >> "$GITHUB_ENV"
          echo "REALSAS_AUTHORITY_MODE=PREPACKAGED_ZIP_FALLBACK" >> "$GITHUB_ENV"

      - name: Materialize exact Mage source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts/charactergen_mage_baseline
          result="$RUNNER_TEMP/FIRST_FAMILY_SOURCE_RESULT.json"
          "$REALSAS_LOCAL_ML_VENV/bin/python" experiments/first_family_fit_v1/materialize_family_source_v1.py \
            --spec "$FIRST_FAMILY_SPEC" \
            --cache-root "$REALSAS_SOURCE_CACHE" \
            --result-json "$result"
          source_file="$("$REALSAS_LOCAL_ML_VENV/bin/python" -c 'import json,sys; print(json.load(open(sys.argv[1]))["source_file"])' "$result")"
          source_root="$("$REALSAS_LOCAL_ML_VENV/bin/python" -c 'import json,sys; print(json.load(open(sys.argv[1]))["source_root"])' "$result")"
          echo "FIRST_FAMILY_SOURCE_FILE=$source_file" >> "$GITHUB_ENV"
          echo "FIRST_FAMILY_SOURCE_ROOT=$source_root" >> "$GITHUB_ENV"
          cp "$result" artifacts/charactergen_mage_baseline/FIRST_FAMILY_SOURCE_RESULT.json

      - name: Provision checksum-verified Blender 5.2.0
        shell: bash
        run: |
          set -euxo pipefail
          "$REALSAS_LOCAL_ML_VENV/bin/python" experiments/first_family_fit_v1/bootstrap_blender_5_2_v1.py \
            --cache-root "$REALSAS_BLENDER_CACHE" \
            | tee artifacts/charactergen_mage_baseline/BLENDER_BOOTSTRAP.log
          blender="$(tail -n 1 artifacts/charactergen_mage_baseline/BLENDER_BOOTSTRAP.log)"
          test -x "$blender"
          echo "REALSAS_BLENDER=$blender" >> "$GITHUB_ENV"

      - name: Build frozen 8-view Mage observations
        shell: bash
        run: |
          set -euxo pipefail
          work="$HOME/.cache/realsas/charactergen_mage_observation_work"
          out="$GITHUB_WORKSPACE/artifacts/charactergen_mage_baseline/observation"
          authority_args=()
          if [ "$REALSAS_AUTHORITY_MODE" = 'DIRECT_MASTER_CORPUS' ]; then
            authority_args=(--master-root "$REALSAS_MASTER_ROOT")
          else
            authority_args=(--authority-zip "$FIRST_FAMILY_AUTHORITY_ZIP")
          fi
          PYTHONPATH="$GITHUB_WORKSPACE" "$REALSAS_LOCAL_ML_VENV/bin/python" \
            experiments/first_family_fit_v1/run_first_family_observation_v1.py \
            --spec "$FIRST_FAMILY_SPEC" \
            "${authority_args[@]}" \
            --authority-manifest "$FIRST_FAMILY_AUTHORITY_MANIFEST" \
            --source-file "$FIRST_FAMILY_SOURCE_FILE" \
            --source-package "$FIRST_FAMILY_SOURCE_ROOT" \
            --blender "$REALSAS_BLENDER" \
            --repo-root "$GITHUB_WORKSPACE" \
            --work-root "$work" \
            --out-root "$out" \
            | tee artifacts/charactergen_mage_baseline/FIRST_FAMILY_OBSERVATION_STDOUT.log
          test -s "$out/FIRST_FAMILY_OBSERVATION_RESULT_V1.json"
          grep -q '"status": "PASS"' "$out/FIRST_FAMILY_OBSERVATION_RESULT_V1.json"
          for v in 0 1 2 3 4 5 6 7; do test -s "$out/V${v}/RGBA.png"; done
          echo "MAGE_OBSERVATION_ROOT=$out" >> "$GITHUB_ENV"

      - name: Activate upstream-supported Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Pin CharacterGen source checkout
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$(dirname "$CHARACTERGEN_ROOT")"
          if [ ! -d "$CHARACTERGEN_ROOT/.git" ]; then
            rm -rf "$CHARACTERGEN_ROOT"
            git clone https://github.com/zjp-shadow/CharacterGen.git "$CHARACTERGEN_ROOT"
          fi
          git -C "$CHARACTERGEN_ROOT" fetch --depth=1 origin "$CHARACTERGEN_COMMIT"
          git -C "$CHARACTERGEN_ROOT" checkout --detach "$CHARACTERGEN_COMMIT"
          test "$(git -C "$CHARACTERGEN_ROOT" rev-parse HEAD)" = "$CHARACTERGEN_COMMIT"
          grep -q 'Apache License' "$CHARACTERGEN_ROOT/LICENSE"

      - name: Provision isolated CharacterGen environment
        shell: bash
        run: |
          set -euxo pipefail
          req_sha="$(sha256sum "$CHARACTERGEN_ROOT/requirements.txt" | awk '{print $1}')"
          marker="$CHARACTERGEN_VENV/.realsas_ready_${req_sha}"
          if [ ! -f "$marker" ]; then
            rm -rf "$CHARACTERGEN_VENV"
            python -m venv "$CHARACTERGEN_VENV"
            "$CHARACTERGEN_VENV/bin/python" -m pip install --upgrade pip setuptools wheel
            "$CHARACTERGEN_VENV/bin/python" -m pip install -r "$CHARACTERGEN_ROOT/requirements.txt"
            "$CHARACTERGEN_VENV/bin/python" -m pip install opencv-python-headless huggingface_hub
            touch "$marker"
          fi
          "$CHARACTERGEN_VENV/bin/python" - <<'PY'
          import torch
          print('CharacterGen torch', torch.__version__)
          print('cuda', torch.cuda.is_available(), torch.version.cuda)
          assert torch.cuda.is_available()
          PY

      - name: Materialize CharacterGen 3D checkpoint bundle
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$CHARACTERGEN_HF_ROOT"
          "$CHARACTERGEN_VENV/bin/python" - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='zjpshadow/CharacterGen',
              allow_patterns=['3D_Stage/*'],
              local_dir=os.environ['CHARACTERGEN_HF_ROOT'],
          )
          PY
          test -s "$CHARACTERGEN_HF_ROOT/3D_Stage/models/lrm.ckpt"
          rm -rf "$CHARACTERGEN_ROOT/3D_Stage/models" "$CHARACTERGEN_ROOT/3D_Stage/load/tets"
          cp -a "$CHARACTERGEN_HF_ROOT/3D_Stage/models" "$CHARACTERGEN_ROOT/3D_Stage/models"
          mkdir -p "$CHARACTERGEN_ROOT/3D_Stage/load"
          cp -a "$CHARACTERGEN_HF_ROOT/3D_Stage/load/tets" "$CHARACTERGEN_ROOT/3D_Stage/load/tets"
          test -s "$CHARACTERGEN_ROOT/3D_Stage/models/lrm.ckpt"
          test -d "$CHARACTERGEN_ROOT/3D_Stage/models/base"
          test -d "$CHARACTERGEN_ROOT/3D_Stage/load/tets"

      - name: Run actual CharacterGen cardinal-4 reconstruction into RealSaS GSA
        shell: bash
        run: |
          set -euxo pipefail
          out="$GITHUB_WORKSPACE/artifacts/charactergen_mage_baseline/cardinal4"
          mkdir -p "$out"
          PYTHONPATH="$GITHUB_WORKSPACE" "$CHARACTERGEN_VENV/bin/python" \
            experiments/charactergen_baseline_v1/run_family_charactergen_baseline_v1.py \
            --charactergen-root "$CHARACTERGEN_ROOT" \
            --observation-root "$MAGE_OBSERVATION_ROOT" \
            --out-root "$out" \
            --conditioning-mode cardinal4 \
            --alpha-policy gray_composite \
            --surface-samples 2048 \
            --device cuda \
            2>&1 | tee artifacts/charactergen_mage_baseline/CHARACTERGEN_CARDINAL4_STDOUT.log
          test -s "$out/CHARACTERGEN_BASELINE_RESULT_V1.json"
          grep -q 'PASS_CHARACTERGEN_3D_TO_RIGGING_SURFACE' "$out/CHARACTERGEN_BASELINE_RESULT_V1.json"

      - name: Verify emitted substrate reaches Geppetto conditioning
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" "$REALSAS_LOCAL_ML_VENV/bin/python" - <<'PY'
          import os, torch
          from models.geppetto.v2.geppetto_conditioning_v2 import GeppettoConditioningAdapterV2
          root=os.path.join(os.environ['GITHUB_WORKSPACE'],'artifacts','charactergen_mage_baseline','cardinal4')
          bundle=torch.load(os.path.join(root,'CHARACTERGEN_RIGGING_SURFACE.pt'), weights_only=False)
          s=bundle['surface']
          b=GeppettoConditioningAdapterV2()((s,))
          print('surface_nodes',len(s.surface_nodes),'features',tuple(b.features.shape),'valid',int(b.valid_mask.sum()))
          assert len(s.surface_nodes)==2048
          assert tuple(b.features.shape)==(1,2048,24)
          assert bool(b.valid_mask.all())
          PY

      - name: Upload CharacterGen Mage baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charactergen-mage-baseline-v1
          path: artifacts/charactergen_mage_baseline/
          if-no-files-found: warn
          retention-days: 30
