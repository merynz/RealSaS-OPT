name: CI queue sentinel (read-only)
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-queue-sentinel
  cancel-in-progress: false

jobs:
  classify-queued-runs:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check aged zero-job workflow run records without mutating them
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const all = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner, repo, status: 'queued', per_page: 100
            });
            const now = Date.now();
            const stale = all.filter(run => now - Date.parse(run.created_at) > 30 * 60 * 1000);
            const byBranch = {};
            for (const run of stale) byBranch[run.head_branch || '<none>'] = (byBranch[run.head_branch || '<none>'] || 0) + 1;
            const sample = [];
            for (const run of stale.slice(0, 8)) {
              const {data} = await github.rest.actions.listJobsForWorkflowRun({owner, repo, run_id: run.id, per_page: 1});
              sample.push({id:run.id, workflow:run.path, sha:run.head_sha, status:run.status, job_count:data.total_count});
            }
            const report = {all_queued:all.length, stale_over_30m:stale.length,
              branches:byBranch, sample, inspected_at:new Date().toISOString()};
            core.info(JSON.stringify(report));
            await core.summary.addHeading('GitHub Actions queued-run classification')
              .addCodeBlock(JSON.stringify(report,null,2),'json').write();
            if (stale.length >= 30 && sample.some(x=>x.job_count === 0)) {
              core.setFailed('CI_QUEUE_STALE_ZERO_JOB_SCHEDULER_INCIDENT__GITHUB_SUPPORT_REQUIRED');
            }
