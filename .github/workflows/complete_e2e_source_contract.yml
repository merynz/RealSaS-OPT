# IMPORTANT: RealSaS CI uses the canonical LOCAL/SELF-HOSTED runner.
# Do not switch this workflow back to GitHub-hosted `ubuntu-latest` unless the
# Actions billing/quota policy is intentionally changed. Expected labels:
# [self-hosted, linux, x64, realsas].

name: complete-e2e-source-contract
on:
  pull_request:
    paths:
      - 'experiments/single_family_e2e_v1/inference_firewall_v1.py'
      - 'experiments/single_family_e2e_v1/run_complete_e2e_v1.py'
      - 'experiments/single_family_e2e_v1/test_complete_e2e_source_v1.py'
      - '.github/workflows/complete_e2e_source_contract.yml'
  push:
    branches: [source/generic-completion-v1-20260902]
    paths:
      - 'experiments/single_family_e2e_v1/inference_firewall_v1.py'
      - 'experiments/single_family_e2e_v1/run_complete_e2e_v1.py'
      - 'experiments/single_family_e2e_v1/test_complete_e2e_source_v1.py'
      - '.github/workflows/complete_e2e_source_contract.yml'
jobs:
  complete-e2e-source-contract:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest
      - run: python -m py_compile experiments/single_family_e2e_v1/inference_firewall_v1.py experiments/single_family_e2e_v1/run_complete_e2e_v1.py
      - run: PYTHONPATH=. python -m pytest -q experiments/single_family_e2e_v1/test_complete_e2e_source_v1.py
