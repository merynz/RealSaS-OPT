name: corpus370-evidence-slice-v1
on:
  push:
    branches: [main, 'ci/corpus370-evidence-slice-v1']
    paths:
      - '.github/workflows/corpus370-evidence-slice-v1.yml'
  workflow_dispatch:
    inputs:
      subjects:
        description: 'At most12 exact subject IDs for bounded read-only source diagnostics'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: corpus370-evidence-slice-v1
  cancel-in-progress: false
jobs:
  readback:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        subjects: ${{ fromJSON(inputs.subjects != '' && format('[{0}]', toJSON(inputs.subjects)) || '["corpus_af623aec64c806e56abf,truth139_07455b9e058affdd69c3","corpus_808c86d0f7f49e102184,corpus_583d22a00ea3b92b3a0a","truth139_5a84086fb4933610f592,corpus_b6e6c534f69bb0336157"]') }}
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 7
    env:
      SUBJECT_IDS: ${{ matrix.subjects }}
      OUTPUT: /tmp/corpus370-evidence-slice-${{ github.run_id }}-${{ strategy.job-index }}
      PREP_ROOT: /home/monster/realsas_authority/corpus370_preparation_v1
    steps:
      - uses: actions/checkout@v4
      - name: Report independent raw FBX evaluator ABI without executing source scenes
        run: |
          sha256sum "$PREP_ROOT/tools/ufbx_bind_scene_probe_v1"
          readelf --version-info "$PREP_ROOT/tools/ufbx_bind_scene_probe_v1" | tail -n 24
      - name: Read exact small source evidence; no scientific execution
        run: |
          /home/monster/realsas_platform/current/bin/realsas-python \
            tools/corpus/export_corpus370_evidence_slice_v1.py \
            --bundle "$PREP_ROOT/CORPUS370_PLATFORM_FAMILY_INPUT_BUNDLE_V2.zip" \
            --expected-sha256 4462b7f90fcff58a8d56b1a975fde4f7f91cbda51417cad5121cf55f25994c5c \
            --all-native-views --subjects "$SUBJECT_IDS" --preparation-root "$PREP_ROOT" --output "$OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: corpus370-evidence-slice-${{ github.run_id }}-${{ strategy.job-index }}
          path: |
            ${{ env.OUTPUT }}/EVIDENCE_SLICE.zip
            ${{ env.OUTPUT }}/EVIDENCE_SLICE_RECEIPT.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
