name: corpus370-generic-locus-counterfactual-contracts-v1

# Diagnostic only: synthetic counterfactual contracts, no private Corpus370 inputs.
on:
  push:
    branches: [corpus370-source-relative-contact-v1-review]
    paths:
      - '.github/workflows/corpus370-generic-locus-counterfactual-contracts-v1.yml'
      - 'tools/corpus/generic_source_locus_counterfactual_v1.py'
      - 'tests/corpus/test_generic_source_locus_counterfactual_v1.py'
  pull_request:
    paths:
      - '.github/workflows/corpus370-generic-locus-counterfactual-contracts-v1.yml'
      - 'tools/corpus/generic_source_locus_counterfactual_v1.py'
      - 'tests/corpus/test_generic_source_locus_counterfactual_v1.py'

permissions:
  contents: read

concurrency:
  group: corpus370-generic-locus-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-source-locus-contract-no-ownership-promotion:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile independent court and execute all positive/negative fixtures
        run: |
          set -euo pipefail
          python3 -m py_compile tools/corpus/generic_source_locus_counterfactual_v1.py
          PYTHONPATH=. python3 -m unittest discover \
            -s tests/corpus \
            -p 'test_generic_source_locus_counterfactual_v1.py' -v
          echo "GENERIC_SOURCE_LOCUS_CONTRACTS_ONLY__NO_MEASURED_SUBJECTS_NO_OWNER_AUTHORITY"
