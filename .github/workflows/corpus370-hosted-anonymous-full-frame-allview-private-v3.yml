name: corpus370-hosted-anonymous-full-frame-allview-private-v3

# Three parallel original source Blender workers, each separately
# SHA-hydrates exact original Corpus370 V5 and previous grouped candidate.
# Full-field-of-view source/soup/edit frames stay on PRIVATE Drive.
on:
  push:
    branches: [corpus370-source-relative-contact-v1-review]
    paths:
      - 'canonical/CORPUS370_HOSTED_FULL_FRAME_EDIT_REQUEST_V3.json'

permissions:
  contents: read

concurrency:
  group: corpus370-hosted-anonymous-full-frame-allview-private-v3
  cancel-in-progress: false

jobs:
  validate-source-locked-full-fov-request:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      manifest_sha: ${{ steps.gate.outputs.manifest_sha }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        name: Reject public images, unsealed source/motion and model authority
        env:
          PRIVATE_DRIVE_CONFIG_PRESENT: ${{ secrets.REALSAS_HOSTED_DRIVE_RCLONE_CONFIG_B64 != '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os
          from pathlib import Path
          d=json.loads(Path("canonical/CORPUS370_HOSTED_FULL_FRAME_EDIT_REQUEST_V3.json").read_text())
          assert d["schema"]=="RealSaS.Corpus370FullFrameAnonymousEditRequest.v3"
          assert d["source_locked"] is True
          assert d["source_subjects"]==d["parallel_hosted_workers"]==3
          assert d["source_v5_sha256"]=="8ab2ebf526bbf91d78117580b68ed3784e53bcbafdbd326f012e143c924c0ac4"
          assert d["source_roster_sha256"]=="925dac90ecbf949375aa3ef5d2ed2f40788ae7dcf5669a02b708ada8d9435355"
          assert d["private_v5_manifest_sha256"]=="cb9ffea96b22bb4500b367afe9965d98fa52b99f51dbe4faf5fac8aabc1ae172"
          assert d["geometric_rays_index_sha256"]=="0eeb24089322d0802567ba9736ada1de03e234bbf133bc91164132a80bec3c70"
          assert d["source_native_visibility_join_sha256"]=="e72f3380c2f34cbf3e088218ebfcd4be0f4aa71c9138d4b3d1865a4f4074439a"
          assert d["source_allview_group_batch_sha256"]=="1d8b8e2e8018d2cd3b94188f2683424659a8b0735f43c43eb381b6b252a3b8a1"
          assert d["input_geometry_views"]==list(range(8))
          assert d["view4_geometry_is_compiler_input"] is True
          assert d["view4_render_edit_response_used_for_selection"] is False
          assert d["render_edit_holdout_view"]==4
          assert d["rest_pose_only"] is True and d["views"]==[0,4]
          assert d["full_field_of_view"] is True
          assert d["raster_resolution"]==192 and d["cycles_samples"]==32
          assert len(d["render_arms"])==6
          assert d["no_public_source_or_render_artifacts"] is True
          for flag in ("full_native_resolution_qualified","source_appearance_caa_authorized",
                       "graphics_owner_authorized","animation_replay_authorized",
                       "model_training_authorized","training_authorized"):
              assert d[flag] is False,flag
          ready=d["enabled"] is True and os.environ["PRIVATE_DRIVE_CONFIG_PRESENT"]=="true"
          print("ready="+str(ready).lower())
          print("manifest_sha="+(d["private_v5_manifest_sha256"] if ready else ""))
          PY

  three-parallel-original-source-full-frame-workers:
    needs: validate-source-locked-full-fov-request
    if: needs.validate-source-locked-full-fov-request.outputs.ready == 'true'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        subject_ordinal: [0, 1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 220
    env:
      PYTHONPATH: ${{ github.workspace }}
      RCLONE_CONFIG: /tmp/realsas-c370-full-frame-private.conf
      MANIFEST_SHA: ${{ needs.validate-source-locked-full-fov-request.outputs.manifest_sha }}
      ORIGINAL_V5_SHARDS: gdrive:corpus370_preparation_v1/hosted_portability_v1/private_v5_shards
      RAYS_REMOTE: gdrive:corpus370_preparation_v1/hosted_source_locus_rays_all352/41883539256-1
      JOIN_REMOTE: gdrive:corpus370_preparation_v1/hosted_native_visibility_pair_join_v1/41916724594-1
      GROUP_REMOTE: gdrive:corpus370_preparation_v1/hosted_allview_geometry_groups_v3/41986038051-1
      V5: /home/monster/realsas_authority/corpus370_v5_delta_repair_pilot/CORPUS370_PREPARED_OBSERVATION_PACKETS_V5.json
      ROSTER: /home/monster/realsas_authority/corpus370_preparation_v1/CORPUS370_EXACT_SOURCE_ROSTER_V1.json
      RAYS_LOCAL: /home/monster/realsas_authority/corpus370_hosted_ray_outputs/41883539256-1
      JOIN_LOCAL: /home/monster/realsas_authority/corpus370_hosted_native_visibility_pairs/41916724594-1
      GROUP_LOCAL: /home/monster/realsas_authority/corpus370_allview_groups_v3/41986038051-1
      SOURCE_ARCHIVE_SHA: 5c92e77ae07b215fa4234d221faf27659bc0c47a54d2711d6e49db3d820b8fa9
      OUTPUT_ROOT: /home/monster/realsas_authority/corpus370_full_frame_editor_allview_v3/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.subject_ordinal }}
      OUTPUT_REMOTE: gdrive:corpus370_preparation_v1/hosted_anonymous_full_frame_allview_private_v3/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.subject_ordinal }}
    steps:
      - uses: actions/checkout@v4
      - name: Bound original source compute and synthetic full-image court regressions
        run: |
          set -euo pipefail
          test "$(awk '/MemTotal:/{print $2}' /proc/meminfo)" -ge 14000000
          test "$(df -Pk / | awk 'NR==2{print $4}')" -ge 9000000
          sudo install -d -o "$USER" -g "$(id -gn)" -m 0700 /home/monster/realsas_authority
          mkdir -p "$OUTPUT_ROOT"
          python3 -m pip install --disable-pip-version-check numpy pytest
          python3 -m py_compile \
            tools/truth_foundry/blender_corpus370_anonymous_full_frame_edit_v3.py \
            tools/corpus/court_corpus370_anonymous_full_frame_edit_v3.py \
            tools/corpus/run_corpus370_full_frame_group_edit_private_v3.py
          PYTHONPATH=. python3 -m pytest -q \
            tests/corpus/test_corpus370_anonymous_full_frame_edit_v3.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rclone
      - name: Establish private Drive source transport without logging secrets
        env:
          DRIVE_CONFIG_B64: ${{ secrets.REALSAS_HOSTED_DRIVE_RCLONE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$DRIVE_CONFIG_B64"
          printf '%s' "$DRIVE_CONFIG_B64" | base64 --decode > "$RCLONE_CONFIG"
          test -s "$RCLONE_CONFIG"
          for remote in "$ORIGINAL_V5_SHARDS" "$RAYS_REMOTE" "$JOIN_REMOTE" "$GROUP_REMOTE"; do
            rclone lsf "$remote" --max-depth 1 >/dev/null
          done
          echo "ORIGINAL_SOURCE_RAY_AND_CANDIDATE_PRIVATE_REMOTE_ACCESS_OK"
      - name: Independently hydrate original sealed 370 source bytes and observation/rest courts
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/private-v5-full" "$RUNNER_TEMP/private-object-full" "$OUTPUT_ROOT"
          rclone copy "$ORIGINAL_V5_SHARDS" "$RUNNER_TEMP/private-v5-full" \
            --checksum --transfers 2 --checkers 2 --timeout 90s --retries 3
          python3 -u tools/corpus/hosted_v5_private_shards_v1.py hydrate \
            --manifest "$RUNNER_TEMP/private-v5-full/PRIVATE_V5_SHARD_MANIFEST.json" \
            --expected-manifest-sha256 "$MANIFEST_SHA" \
            --private-dir "$RUNNER_TEMP/private-v5-full" \
            --object-cache "$RUNNER_TEMP/private-object-full" \
            > "$OUTPUT_ROOT/PRIVATE_ORIGINAL_HYDRATE_LOG.txt" 2>&1
          test "$(sha256sum "$V5" | cut -d' ' -f1)" = 8ab2ebf526bbf91d78117580b68ed3784e53bcbafdbd326f012e143c924c0ac4
          test "$(sha256sum "$ROSTER" | cut -d' ' -f1)" = 925dac90ecbf949375aa3ef5d2ed2f40788ae7dcf5669a02b708ada8d9435355
          echo "ORIGINAL_SOURCE_AND_V5_PUBLICATION_SHA_EXACT"
      - name: Acquire only immutable original 3-subject layer and ray receipts
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$JOIN_LOCAL" "$GROUP_LOCAL" "$RAYS_LOCAL"
          rclone copy "$JOIN_REMOTE" "$JOIN_LOCAL" \
            --checksum --transfers 2 --checkers 2 --timeout 90s --retries 3
          rclone copy "$GROUP_REMOTE" "$GROUP_LOCAL" \
            --checksum --transfers 2 --checkers 2 --timeout 90s --retries 3
          rclone copyto "$RAYS_REMOTE/SOURCE_LOCUS_GEOMETRIC_RAYS_PILOT_INDEX_V1.json" \
            "$RAYS_LOCAL/SOURCE_LOCUS_GEOMETRIC_RAYS_PILOT_INDEX_V1.json" \
            --checksum --timeout 90s --retries 3
          test "$(sha256sum "$JOIN_LOCAL/CORPUS370_NATIVE_VISIBILITY_PAIR_JOIN_V1.json" | cut -d' ' -f1)" = e72f3380c2f34cbf3e088218ebfcd4be0f4aa71c9138d4b3d1865a4f4074439a
          test "$(sha256sum "$GROUP_LOCAL/CORPUS370_ALLVIEW_GEOMETRY_GROUPS_PRIVATE_BATCH_V3.json" | cut -d' ' -f1)" = 1d8b8e2e8018d2cd3b94188f2683424659a8b0735f43c43eb381b6b252a3b8a1
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["GROUP_LOCAL"])/"CORPUS370_ALLVIEW_GEOMETRY_GROUPS_PRIVATE_BATCH_V3.json").read_text())
          assert d["schema"]=="RealSaS.Corpus370AllViewGeometricLayerPrivateBatch.v3"
          assert d["candidate_qualified_count"]==3 and d["failure_count"]==0
          assert d["heldout_proxy_revealed_count"]==3
          assert d["model_training_authorized"] is False
          assert d["graphics_owner_authorized"] is False
          PY
          test "$(sha256sum "$RAYS_LOCAL/SOURCE_LOCUS_GEOMETRIC_RAYS_PILOT_INDEX_V1.json" | cut -d' ' -f1)" = 0eeb24089322d0802567ba9736ada1de03e234bbf133bc91164132a80bec3c70
          SUBJECT_ORDINAL=${{ matrix.subject_ordinal }} python3 - <<'PY' > "$RUNNER_TEMP/c370-selected-one-subject.txt"
          import json,os
          from pathlib import Path
          p=Path(os.environ["JOIN_LOCAL"])/"CORPUS370_NATIVE_VISIBILITY_PAIR_JOIN_V1.json"
          doc=json.loads(p.read_text())
          assert len(doc["subjects"])==3
          index=int(os.environ["SUBJECT_ORDINAL"])
          assert 0<=index<3
          print(sorted(doc["subjects"])[index])
          PY
          sid="$(cat "$RUNNER_TEMP/c370-selected-one-subject.txt")"
          test -n "$sid"
          mkdir -p "$RAYS_LOCAL/subjects/$sid"
          rclone copyto "$RAYS_REMOTE/subjects/$sid/SOURCE_LOCUS_GEOMETRIC_RAYS_V1.json" \
            "$RAYS_LOCAL/subjects/$sid/SOURCE_LOCUS_GEOMETRIC_RAYS_V1.json" \
            --checksum --timeout 90s --retries 3
          echo "EXACT_SINGLE_SOURCE_PER_HOSTED_WORKER_GEOMETRY_REST_GROUPS_READY"
      - name: Install byte-verified Blender 4.5.14 real-source renderer
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender45"
          base=https://download.blender.org/release/Blender4.5
          file=blender-4.5.14-linux-x64.tar.xz
          curl -fL --retry 4 --max-time 300 "$base/$file" -o "$RUNNER_TEMP/blender45/$file"
          curl -fL --retry 4 --max-time 120 "$base/blender-4.5.14.sha256" -o "$RUNNER_TEMP/blender45/official.sha256"
          ARCHIVE="$RUNNER_TEMP/blender45/$file" CHECKSUMS="$RUNNER_TEMP/blender45/official.sha256" python3 - <<'PY'
          import os,re,hashlib
          from pathlib import Path
          f=Path(os.environ["ARCHIVE"])
          lines=[x for x in Path(os.environ["CHECKSUMS"]).read_text().splitlines() if f.name in x]
          assert len(lines)==1
          expected=re.findall(r"[0-9a-fA-F]{64}",lines[0])
          assert len(expected)==1
          with f.open("rb") as stream:
              assert hashlib.file_digest(stream,"sha256").hexdigest()==expected[0].lower()
          PY
          tar -xJf "$RUNNER_TEMP/blender45/$file" -C "$RUNNER_TEMP/blender45"
          test "$(sha256sum "$RUNNER_TEMP/blender45/blender-4.5.14-linux-x64/blender" | cut -d' ' -f1)" = 050c02562f81fe80ba616a80198fa02d381e60f8b61b8d39add881f4bca0d7d8
      - name: Original art vs triangle-soup entire FOV and 3 independent group edit operators
        run: |
          set -euo pipefail
          umask 077
          python3 -u tools/corpus/run_corpus370_full_frame_group_edit_private_v3.py \
            --v5-index "$V5" --exact-roster "$ROSTER" \
            --geometric-ray-index "$RAYS_LOCAL/SOURCE_LOCUS_GEOMETRIC_RAYS_PILOT_INDEX_V1.json" \
            --extracted-source-root "/home/monster/realsas_authority/corpus370_preparation_v1/source_bundle/extracted/$SOURCE_ARCHIVE_SHA" \
            --original-join-root "$JOIN_LOCAL" \
            --allview-groups-root "$GROUP_LOCAL" \
            --blender "$RUNNER_TEMP/blender45/blender-4.5.14-linux-x64/blender" \
            --output "$OUTPUT_ROOT" --subject-ordinal ${{ matrix.subject_ordinal }} \
            > "$OUTPUT_ROOT/PRIVATE_FULL_FRAME_WORKER_LOG.txt" 2>&1
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json,os
          from pathlib import Path
          p=Path(os.environ["OUTPUT_ROOT"])/"PRIVATE_FULL_FRAME_LAYER_BATCH_RESULT_V3.json"
          d=json.loads(p.read_text())
          assert d["schema"]=="RealSaS.Corpus370FullFrameAnonymousEditorPrivateRunner.v3"
          assert d["status"]=="COMPLETE_FULL_FRAME_ORIGINAL_SOURCE_AND_ANON_RENDER_COURT__FAMILY_SEPARATE"
          assert d["full_frame_pixels"]==2*192*192
          assert d["bounded_appearance_parity_and_group_separation_views"]==2
          assert d["training_authorized"] is False
          assert d["graphics_owner_authorized"] is False
          print("## Original source real full-FOV RGBA + anonymous group edits")
          print("Worker ordinal:",d["subject_ordinal"])
          print("Full-FOV source pixels courted:",d["full_frame_pixels"])
          print("Bounded source appearance/no-op parity & independent A/B group views:",
                d["bounded_appearance_parity_and_group_separation_views"],"/2")
          print("192x192 rest-pose source field; full native resolution/CAA/pose/product/training NOT authorized")
          PY
      - name: Preserve full private pixel arrays and failure receipts even on source failure
        if: always()
        run: |
          set -euo pipefail
          if test -s "$RCLONE_CONFIG" && test -d "$OUTPUT_ROOT"; then
            rclone copy "$OUTPUT_ROOT" "$OUTPUT_REMOTE" \
              --checksum --transfers 2 --checkers 2 --timeout 90s --retries 3
            echo "PRIVATE_FULL_FRAME_ORIGINAL_SOURCE_RGBA_ARRAYS_STORED"
          fi
