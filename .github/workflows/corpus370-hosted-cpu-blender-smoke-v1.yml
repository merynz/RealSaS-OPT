name: corpus370-hosted-cpu-blender-smoke-v1
on:
  push:
    branches: [corpus370-source-relative-contact-v1-review]
    paths:
      - '.github/workflows/corpus370-hosted-cpu-blender-smoke-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-blender-and-resource-baseline:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Read standard hosted runner capacity
        run: |
          set -euo pipefail
          nproc
          free -h
          df -h /
          test "$(nproc)" -ge 2
          test "$(awk '/MemTotal:/{print $2}' /proc/meminfo)" -ge 10000000
          echo "HOSTED_CPU_CAPACITY_MEASURED_NO_TRUTH_AUTHORITY"
      - name: Install SOURCE-EXACT official Blender 4.5.14, verify vendor SHA-256
        env:
          BLENDER_VERSION: "4.5.14"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender"
          base="https://download.blender.org/release/Blender4.5"
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl -fL --retry 4 --connect-timeout 20 --max-time 300 \
            "$base/$archive" -o "$RUNNER_TEMP/blender/$archive"
          curl -fL --retry 4 --connect-timeout 20 --max-time 120 \
            "$base/blender-${BLENDER_VERSION}.sha256" -o "$RUNNER_TEMP/blender/official.sha256"
          ARCHIVE="$RUNNER_TEMP/blender/$archive" \
          CHECKSUMS="$RUNNER_TEMP/blender/official.sha256" python3 - <<'PY'
          from pathlib import Path
          import hashlib,os,re
          p=Path(os.environ["ARCHIVE"])
          rows=[x.strip() for x in Path(os.environ["CHECKSUMS"]).read_text().splitlines()
                if p.name in x]
          assert len(rows)==1,"OFFICIAL_BLENDER_SHA_LINE_MISSING_OR_DUPLICATE"
          hashes=re.findall(r"(?<![0-9a-fA-F])[0-9a-fA-F]{64}(?![0-9a-fA-F])",rows[0])
          assert len(hashes)==1,"OFFICIAL_BLENDER_SHA_FORMAT"
          actual=hashlib.file_digest(p.open("rb"),"sha256").hexdigest()
          assert actual==hashes[0].lower(),"OFFICIAL_BLENDER_SHA_MISMATCH"
          print("PASS_OFFICIAL_ARCHIVE_SHA256="+actual)
          PY
          tar -xJf "$RUNNER_TEMP/blender/$archive" -C "$RUNNER_TEMP/blender"
          rm "$RUNNER_TEMP/blender/$archive"
          df -h /
      - name: Smoke real source-version headless mesh on private-data-free cube
        run: |
          set -euo pipefail
          blender="$RUNNER_TEMP/blender/blender-4.5.14-linux-x64/blender"
          test -x "$blender"
          "$blender" --version | head -5
          "$blender" --background --factory-startup --python-exit-code 4 \
            --python-expr "import bpy; assert bpy.app.version == (4,5,14); bpy.ops.mesh.primitive_cube_add(); obj=bpy.context.active_object; assert obj.type == 'MESH'; assert len(obj.data.vertices) == 8; print('HOSTED_BLENDER_4_5_14_SOURCE_VERSION_PASS')"
          sha256sum "$blender"
          echo "NO_SOURCE_TRUTH_OPENED_NO_TRAINING_AUTHORITY"
