name: corpus370-hosted-hierarchical-layer-private-v1

# Reuses two independently sealed, private, real-source parents.
# No raw art download, no public provenance/face arrays, no model training.
on:
  push:
    branches: [corpus370-source-relative-contact-v1-review]
    paths:
      - 'canonical/CORPUS370_HOSTED_HIERARCHICAL_LAYER_REQUEST_V1.json'

permissions:
  contents: read

concurrency:
  group: corpus370-hosted-hierarchical-layer-private-v1
  cancel-in-progress: false

jobs:
  preregistered-sha-and-authority-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        name: Reject source drift, test leakage and false owner training
        env:
          DRIVE_AVAILABLE: ${{ secrets.REALSAS_HOSTED_DRIVE_RCLONE_CONFIG_B64 != '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os
          from pathlib import Path
          d=json.loads(Path("canonical/CORPUS370_HOSTED_HIERARCHICAL_LAYER_REQUEST_V1.json").read_text())
          assert d["schema"]=="RealSaS.Corpus370HostedHierarchicalLayerResearchRequest.v1"
          assert d["source_locked"] is True
          assert d["private_original_native_visibility_run_id"]==41916724594
          assert d["private_prior_anonymous_run_id"]==41928889420
          assert d["private_native_visibility_join_sha256"]=="e72f3380c2f34cbf3e088218ebfcd4be0f4aa71c9138d4b3d1865a4f4074439a"
          assert d["private_prior_anonymous_batch_sha256"]=="47b3f3beb7a3625504ccf8488d6fe0cd8fbe0014421c5e4c77748f829c9f01ca"
          assert d["selected_subject_count"]==3
          assert d["target_group_counts"]==[8,16,32,64]
          assert d["camera_views"]=={"training":0,"independent_diagnostic":4}
          for k in ("heldout_used_for_training","family_authority_minted",
                    "renderer_full_frame_court_executed",
                    "student_source_face_ids_exposed",
                    "student_rig_or_semantic_source_names_exposed",
                    "model_training_authorized","training_authorized"):
              assert d[k] is False,k
          print("ready="+str(d["enabled"] is True and os.environ["DRIVE_AVAILABLE"]=="true").lower())
          PY

  measure-hierarchical-anonymous-layer-groups:
    needs: preregistered-sha-and-authority-gate
    if: needs.preregistered-sha-and-authority-gate.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONPATH: ${{ github.workspace }}
      RCLONE_CONFIG: /tmp/realsas-c370-hierarchy.conf
      JOIN_REMOTE: gdrive:corpus370_preparation_v1/hosted_native_visibility_pair_join_v1/41916724594-1
      ANON_REMOTE: gdrive:corpus370_preparation_v1/hosted_anonymous_layer_pilot_v1/41928889420-1
      JOIN_LOCAL: /home/monster/realsas_authority/corpus370_hosted_native_visibility_pairs/41916724594-1
      ANON_LOCAL: /home/monster/realsas_authority/corpus370_anonymous_layer_private/41928889420-1
      OUTPUT_LOCAL: /home/monster/realsas_authority/corpus370_hierarchical_layer_private/${{ github.run_id }}-${{ github.run_attempt }}
      OUTPUT_REMOTE: gdrive:corpus370_preparation_v1/hosted_hierarchical_layer_pilot_v1/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and held-out regression contracts independently
        run: |
          set -euo pipefail
          test "$(awk '/MemTotal:/{print $2}' /proc/meminfo)" -ge 14000000
          sudo install -d -o "$USER" -g "$(id -gn)" -m 0700 /home/monster/realsas_authority
          mkdir -p "$OUTPUT_LOCAL"
          python3 -m pip install --disable-pip-version-check numpy pytest
          python3 -m py_compile \
            tools/corpus/compile_corpus370_hierarchical_layer_groups_v1.py \
            tools/corpus/court_corpus370_hierarchical_layer_groups_v1.py \
            tools/corpus/run_corpus370_hierarchical_layer_private_batch_v1.py
          PYTHONPATH=. python3 -m pytest -q \
            tests/corpus/test_corpus370_hierarchical_layer_groups_v1.py \
            tests/corpus/test_corpus370_anonymous_layer_compiler_v1.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rclone
      - name: Authenticate private Drive without printing rclone secrets
        env:
          PRIVATE_RCLONE_CONFIG_B64: ${{ secrets.REALSAS_HOSTED_DRIVE_RCLONE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$PRIVATE_RCLONE_CONFIG_B64"
          printf '%s' "$PRIVATE_RCLONE_CONFIG_B64" | base64 --decode > "$RCLONE_CONFIG"
          test -s "$RCLONE_CONFIG"
          rclone lsf "$JOIN_REMOTE" --max-depth 1 >/dev/null
          rclone lsf "$ANON_REMOTE" --max-depth 1 >/dev/null
          echo "BOTH_PRIVATE_SOURCE_AUTHORITY_PARENTS_ACCESSIBLE"
      - name: Hydrate only sealed canonical arrays and previous private layer receipts
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$JOIN_LOCAL" "$ANON_LOCAL"
          rclone copy "$JOIN_REMOTE" "$JOIN_LOCAL" \
            --checksum --transfers 3 --checkers 3 --timeout 90s --retries 3
          rclone copy "$ANON_REMOTE" "$ANON_LOCAL" \
            --checksum --transfers 3 --checkers 3 --timeout 90s --retries 3
          test "$(sha256sum "$JOIN_LOCAL/CORPUS370_NATIVE_VISIBILITY_PAIR_JOIN_V1.json" | cut -d' ' -f1)" = e72f3380c2f34cbf3e088218ebfcd4be0f4aa71c9138d4b3d1865a4f4074439a
          test "$(sha256sum "$ANON_LOCAL/CORPUS370_ANON_LAYER_PRIVATE_BATCH_V1.json" | cut -d' ' -f1)" = 47b3f3beb7a3625504ccf8488d6fe0cd8fbe0014421c5e4c77748f829c9f01ca
          echo "ORIGINAL_PRIVATE_SOURCE_GEOMETRY_ANNOTATIONS_SHA_LOCKED"
      - name: Produce group hierarchy and independently court non-destructive source faces
        run: |
          set -euo pipefail
          umask 077
          python3 -u tools/corpus/run_corpus370_hierarchical_layer_private_batch_v1.py \
            --native-visibility-join-root "$JOIN_LOCAL" \
            --prior-anonymous-layer-root "$ANON_LOCAL" \
            --output-root "$OUTPUT_LOCAL" \
            > "$OUTPUT_LOCAL/PRIVATE_HIERARCHY_LOG.txt" 2>&1
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json,os
          from pathlib import Path
          report=json.loads((Path(os.environ["OUTPUT_LOCAL"])/"CORPUS370_HIERARCHICAL_LAYER_PRIVATE_BATCH_V1.json").read_text())
          assert report["schema"]=="RealSaS.Corpus370HierarchicalLayerPrivateBatch.v1"
          assert report["candidate_qualified_subject_count"]==3
          assert report["failure_count"]==0
          assert report["model_training_authorized"] is False
          assert report["graphics_owner_authorized"] is False
          print("## Hierarchical operational graphics layer research — actual source geometry")
          print("Original source-matched subjects:",report["candidate_qualified_subject_count"])
          print("Selected train-only anonymous group counts:",sorted(report["candidate_group_counts"].values()))
          print("Opposite-view source-hit proxy preserved:",report["heldout_proxy_reveal_count"],"/3 subjects")
          print("Product drawable identity / full-image CAA / training: NOT AUTHORIZED")
          PY
      - name: Store private group maps and independent consumer receipts even on failure
        if: always()
        run: |
          set -euo pipefail
          if test -s "$RCLONE_CONFIG" && test -d "$OUTPUT_LOCAL"; then
            rclone copy "$OUTPUT_LOCAL" "$OUTPUT_REMOTE" \
              --checksum --transfers 2 --checkers 2 --timeout 90s --retries 3
            echo "PRIVATE_HIERARCHICAL_GROUP_RECEIPTS_STORED"
          fi
