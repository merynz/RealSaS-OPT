name: corpus370-hosted-native-pose-partition-private-v8

# Source-bound PRIVATE non-raster evidence: 3 real authored pose / anonymous group
# courts. Original source faces and teacher pose arrays remain on private Drive.
on:
  push:
    branches: [corpus370-source-relative-contact-v1-review]
    paths:
      - 'canonical/CORPUS370_HOSTED_NATIVE_POSE_PARTITION_REQUEST_V8.json'

permissions:
  contents: read

concurrency:
  group: corpus370-hosted-native-pose-partition-private-v8
  cancel-in-progress: false

jobs:
  validate-original-source-v8-request:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      manifest_sha: ${{ steps.gate.outputs.manifest_sha }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        name: Fail closed on source lineage, authority, and missing private transport
        env:
          PRIVATE_DRIVE_CONFIG_PRESENT: ${{ secrets.REALSAS_HOSTED_DRIVE_RCLONE_CONFIG_B64 != '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os
          from pathlib import Path
          d=json.loads(Path("canonical/CORPUS370_HOSTED_NATIVE_POSE_PARTITION_REQUEST_V8.json").read_text())
          assert d["schema"]=="RealSaS.Corpus370NativePosePartitionResearchRequest.v8"
          assert d["source_original_parents_unchanged"] is True
          assert d["subject_count"]==d["parallel_hosted_workers"]==3
          assert d["source_v5_sha256"]=="8ab2ebf526bbf91d78117580b68ed3784e53bcbafdbd326f012e143c924c0ac4"
          assert d["source_roster_sha256"]=="925dac90ecbf949375aa3ef5d2ed2f40788ae7dcf5669a02b708ada8d9435355"
          assert d["private_v5_manifest_sha256"]=="cb9ffea96b22bb4500b367afe9965d98fa52b99f51dbe4faf5fac8aabc1ae172"
          assert d["geometric_rays_index_sha256"]=="0eeb24089322d0802567ba9736ada1de03e234bbf133bc91164132a80bec3c70"
          assert d["source_native_visibility_join_sha256"]=="e72f3380c2f34cbf3e088218ebfcd4be0f4aa71c9138d4b3d1865a4f4074439a"
          assert d["source_allview_group_batch_sha256"]=="1d8b8e2e8018d2cd3b94188f2683424659a8b0735f43c43eb381b6b252a3b8a1"
          assert d["native_authored_teacher_summary_sha256"]=="5aa3c4d9cc97ab669d2a7a951a4c9d18218ef5ea4d6f58f5b1ff1ac5b89cc272"
          assert d["expected_authored_pose_count_by_worker"]==[32,24,24]
          assert d["reference_policy"]=="SOURCE_FACE_ADDRESS_REPLAY_NOT_AUTHOR_DRAWABLE"
          assert d["candidate_sizes_if_present"]==[8,16,32,64]
          assert d["all_teacher_artifacts_remain_private"] is True
          for key in ("source_rig_pose_response_authorized",
                      "native_resolution_full_appearance_caa_authorized",
                      "human_authored_drawable_identity_qualified",
                      "graphics_owner_authorized", "tessa_teacher_authorized",
                      "materialization_authorized","product_compilation_authorized",
                      "training_authorized"):
              assert d[key] is False,key
          ready=d["enabled"] is True and os.environ["PRIVATE_DRIVE_CONFIG_PRESENT"]=="true"
          print("ready="+str(ready).lower())
          print("manifest_sha="+(d["private_v5_manifest_sha256"] if ready else ""))
          PY

  original-source-authored-native-pose-workers:
    needs: validate-original-source-v8-request
    if: needs.validate-original-source-v8-request.outputs.ready == 'true'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        subject_ordinal: [0, 1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}
      RCLONE_CONFIG: /tmp/realsas-c370-native-pose-v8.conf
      MANIFEST_SHA: ${{ needs.validate-original-source-v8-request.outputs.manifest_sha }}
      ORIGINAL_V5_SHARDS: gdrive:corpus370_preparation_v1/hosted_portability_v1/private_v5_shards
      RAYS_REMOTE: gdrive:corpus370_preparation_v1/hosted_source_locus_rays_all352/41883539256-1
      JOIN_REMOTE: gdrive:corpus370_preparation_v1/hosted_native_visibility_pair_join_v1/41916724594-1
      GROUP_REMOTE: gdrive:corpus370_preparation_v1/hosted_allview_geometry_groups_v3/41986038051-1
      NATIVE_REMOTE: gdrive:corpus370_preparation_v1/hosted_native_temporal_pilot_v1/41915393652-1
      V5: /home/monster/realsas_authority/corpus370_v5_delta_repair_pilot/CORPUS370_PREPARED_OBSERVATION_PACKETS_V5.json
      ROSTER: /home/monster/realsas_authority/corpus370_preparation_v1/CORPUS370_EXACT_SOURCE_ROSTER_V1.json
      RAYS_LOCAL: /home/monster/realsas_authority/corpus370_hosted_ray_outputs/41883539256-1
      JOIN_LOCAL: /home/monster/realsas_authority/corpus370_hosted_native_visibility_pairs/41916724594-1
      GROUP_LOCAL: /home/monster/realsas_authority/corpus370_allview_groups_v3/41986038051-1
      NATIVE_LOCAL: /home/monster/realsas_authority/corpus370_hosted_native_teacher_pilot/41915393652-1
      OUTPUT_ROOT: /home/monster/realsas_authority/corpus370_native_pose_partition_v8/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.subject_ordinal }}
      OUTPUT_REMOTE: gdrive:corpus370_preparation_v1/hosted_native_pose_partition_private_v8/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.subject_ordinal }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate bounded private research host and V8 counterfeit contracts
        run: |
          set -euo pipefail
          test "$(awk '/MemTotal:/{print $2}' /proc/meminfo)" -ge 14000000
          test "$(df -Pk / | awk 'NR==2{print $4}')" -ge 9000000
          sudo install -d -o "$USER" -g "$(id -gn)" -m 0700 /home/monster/realsas_authority
          mkdir -p "$OUTPUT_ROOT"
          python3 -m pip install --disable-pip-version-check numpy pytest
          python3 -m py_compile \
            tools/corpus/corpus370_partition_edit_plan_v7.py \
            tools/corpus/court_corpus370_native_pose_partition_v8.py \
            tools/corpus/run_corpus370_native_pose_partition_private_v8.py \
            tools/corpus/run_corpus370_native_pose_partition_batch_v8.py
          PYTHONPATH=. python3 -m pytest -q tests/corpus/test_corpus370_native_pose_partition_v8.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rclone
      - name: Authenticate ephemeral private Drive without exposing original faces
        env:
          DRIVE_CONFIG_B64: ${{ secrets.REALSAS_HOSTED_DRIVE_RCLONE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$DRIVE_CONFIG_B64"
          printf '%s' "$DRIVE_CONFIG_B64" | base64 --decode > "$RCLONE_CONFIG"
          test -s "$RCLONE_CONFIG"
          for remote in "$ORIGINAL_V5_SHARDS" "$RAYS_REMOTE" "$JOIN_REMOTE" "$GROUP_REMOTE" "$NATIVE_REMOTE"; do
            rclone lsf "$remote" --max-depth 1 >/dev/null
          done
          echo "FIVE_IMMUTABLE_SOURCE_NATIVE_PARENTS_AVAILABLE"
      - name: SHA hydrate original private V5, source rest, and authored teacher receipts
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/private-v5-v8" "$RUNNER_TEMP/private-objects-v8" \
            "$RAYS_LOCAL" "$JOIN_LOCAL" "$GROUP_LOCAL" "$NATIVE_LOCAL" "$OUTPUT_ROOT"
          rclone copy "$ORIGINAL_V5_SHARDS" "$RUNNER_TEMP/private-v5-v8" \
            --checksum --transfers 2 --checkers 2 --timeout 90s --retries 3
          python3 -u tools/corpus/hosted_v5_private_shards_v1.py hydrate \
            --manifest "$RUNNER_TEMP/private-v5-v8/PRIVATE_V5_SHARD_MANIFEST.json" \
            --expected-manifest-sha256 "$MANIFEST_SHA" \
            --private-dir "$RUNNER_TEMP/private-v5-v8" \
            --object-cache "$RUNNER_TEMP/private-objects-v8" \
            > "$OUTPUT_ROOT/PRIVATE_SOURCE_HYDRATE_V8_LOG.txt" 2>&1
          test "$(sha256sum "$V5" | cut -d' ' -f1)" = 8ab2ebf526bbf91d78117580b68ed3784e53bcbafdbd326f012e143c924c0ac4
          test "$(sha256sum "$ROSTER" | cut -d' ' -f1)" = 925dac90ecbf949375aa3ef5d2ed2f40788ae7dcf5669a02b708ada8d9435355
          rclone copy "$JOIN_REMOTE" "$JOIN_LOCAL" --checksum --transfers 2 --checkers 2 --retries 3
          rclone copy "$GROUP_REMOTE" "$GROUP_LOCAL" --checksum --transfers 2 --checkers 2 --retries 3
          rclone copy "$NATIVE_REMOTE" "$NATIVE_LOCAL" --checksum --transfers 2 --checkers 2 --retries 3
          rclone copyto "$RAYS_REMOTE/SOURCE_LOCUS_GEOMETRIC_RAYS_PILOT_INDEX_V1.json" \
            "$RAYS_LOCAL/SOURCE_LOCUS_GEOMETRIC_RAYS_PILOT_INDEX_V1.json" --checksum --retries 3
          test "$(sha256sum "$JOIN_LOCAL/CORPUS370_NATIVE_VISIBILITY_PAIR_JOIN_V1.json" | cut -d' ' -f1)" = e72f3380c2f34cbf3e088218ebfcd4be0f4aa71c9138d4b3d1865a4f4074439a
          test "$(sha256sum "$GROUP_LOCAL/CORPUS370_ALLVIEW_GEOMETRY_GROUPS_PRIVATE_BATCH_V3.json" | cut -d' ' -f1)" = 1d8b8e2e8018d2cd3b94188f2683424659a8b0735f43c43eb381b6b252a3b8a1
          test "$(sha256sum "$NATIVE_LOCAL/CORPUS370_V5_AUTHORED_TEMPORAL_PILOT_V1.json" | cut -d' ' -f1)" = 5aa3c4d9cc97ab669d2a7a951a4c9d18218ef5ea4d6f58f5b1ff1ac5b89cc272
          test "$(sha256sum "$RAYS_LOCAL/SOURCE_LOCUS_GEOMETRIC_RAYS_PILOT_INDEX_V1.json" | cut -d' ' -f1)" = 0eeb24089322d0802567ba9736ada1de03e234bbf133bc91164132a80bec3c70
          SUBJECT_ORDINAL=${{ matrix.subject_ordinal }} python3 - <<'PY' > "$RUNNER_TEMP/native-pose-subject.txt"
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["JOIN_LOCAL"])/"CORPUS370_NATIVE_VISIBILITY_PAIR_JOIN_V1.json").read_text())
          print(sorted(d["subjects"])[int(os.environ["SUBJECT_ORDINAL"])])
          PY
          sid="$(cat "$RUNNER_TEMP/native-pose-subject.txt")"
          test -n "$sid"
          mkdir -p "$RAYS_LOCAL/subjects/$sid"
          rclone copyto "$RAYS_REMOTE/subjects/$sid/SOURCE_LOCUS_GEOMETRIC_RAYS_V1.json" \
            "$RAYS_LOCAL/subjects/$sid/SOURCE_LOCUS_GEOMETRIC_RAYS_V1.json" --checksum --retries 3
          echo "SHA_EXACT_ORIGINAL_REST_AND_AUTHORED_NATIVE_TEACHER_READY"
      - name: Independently measure real authored native pose correspondence for all source groups
        run: |
          set -euo pipefail
          umask 077
          python3 -u tools/corpus/run_corpus370_native_pose_partition_batch_v8.py \
            --v5-index "$V5" --exact-roster "$ROSTER" \
            --geometric-ray-index "$RAYS_LOCAL/SOURCE_LOCUS_GEOMETRIC_RAYS_PILOT_INDEX_V1.json" \
            --original-join-root "$JOIN_LOCAL" \
            --allview-groups-root "$GROUP_LOCAL" \
            --native-teacher-root "$NATIVE_LOCAL" \
            --output "$OUTPUT_ROOT" --subject-ordinal ${{ matrix.subject_ordinal }} \
            > "$OUTPUT_ROOT/PRIVATE_NATIVE_POSE_V8_LOG.txt" 2>&1
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["OUTPUT_ROOT"])/"PRIVATE_NATIVE_POSE_BATCH_RESULT_V8.json").read_text())
          assert d["schema"]=="RealSaS.Corpus370NativePosePartitionPrivateBatch.v8"
          assert d["status"]=="PASS_REAL_NATIVE_POSE_SOURCE_FACE_GROUP_DIAGNOSTIC__NO_OWNER_AUTHORITY"
          assert d["real_authored_pose_count"] in (24,32)
          assert d["group_sizes"][0]==8
          assert d["source_face_identity_in_pose_domain_verified"] is True
          assert d["animated_render_caa_authorized"] is False
          assert d["graphics_owner_authorized"] is False and d["training_authorized"] is False
          print("## Native temporal source-face group persistence (NOT drawable ownership)")
          print("Worker:",d["subject_ordinal"])
          print("Real authored source pose frames:",d["real_authored_pose_count"])
          print("Candidate source partitions:",d["group_sizes"])
          print("Source face domain stable; graphics CAA, causal controls, training still forbidden")
          PY
      - name: Preserve private source pose court and any failure receipts
        if: always()
        run: |
          set -euo pipefail
          if test -s "$RCLONE_CONFIG" && test -d "$OUTPUT_ROOT"; then
            rclone copy "$OUTPUT_ROOT" "$OUTPUT_REMOTE" \
              --checksum --transfers 2 --checkers 2 --timeout 90s --retries 3
            echo "NATIVE_SOURCE_FACE_POSE_DIAGNOSTICS_STORED_PRIVATE"
          fi
