name: corpus370-hosted-native-visibility-pair-join-private-v1

# Exact original V5/rest, existing authored native teachers, independent
# 2-view palette/visibility proof. No public private-source bytes or NPZs.
on:
  push:
    branches: [corpus370-source-relative-contact-v1-review]
    paths:
      - 'canonical/CORPUS370_HOSTED_NATIVE_VISIBILITY_PAIR_JOIN_REQUEST_V1.json'

permissions:
  contents: read

concurrency:
  group: corpus370-hosted-native-visibility-pair-join-private-v1
  cancel-in-progress: false

jobs:
  resolve-source-locked-private-join:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.request.outputs.ready }}
      manifest_sha: ${{ steps.request.outputs.manifest_sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify fixed original V5, real native and visibility parents
        id: request
        env:
          DRIVE_SECRET_EXISTS: ${{ secrets.REALSAS_HOSTED_DRIVE_RCLONE_CONFIG_B64 != '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os,re
          from pathlib import Path
          d=json.loads(Path('canonical/CORPUS370_HOSTED_NATIVE_VISIBILITY_PAIR_JOIN_REQUEST_V1.json').read_text())
          assert d['schema']=='RealSaS.Corpus370HostedNativeVisibilityPairJoinRequest.v1'
          assert d['source_locked'] is True and d['teacher_only'] is True
          assert d['training_authorized'] is False
          assert d['native_teacher_run_id']==41915393652
          assert d['native_teacher_attempt']==1
          assert d['native_teacher_summary_sha256']=='5aa3c4d9cc97ab669d2a7a951a4c9d18218ef5ea4d6f58f5b1ff1ac5b89cc272'
          assert d['palette_run_id']==41902211474
          assert d['source_hit_visibility_run_id']==41904446622
          assert d['visibility_batch_sha256']=='fbca92b37ed71975de31b77b91a1fba7871c40b03b4b0ebb5b1695669c43bcbd'
          assert d['expected_subjects']==3 and d['expected_pixel_pairs']==6
          assert re.fullmatch(r'[0-9a-f]{64}',d['private_v5_manifest_sha256'])
          ready=d['enabled'] is True and os.environ['DRIVE_SECRET_EXISTS']=='true'
          print('ready='+str(ready).lower())
          print('manifest_sha='+(d['private_v5_manifest_sha256'] if ready else ''))
          PY
          echo "EXACT_NATIVE_VISIBILITY_JOIN_PRIVATE_SHA_GATE_ONLY"

  independent-real-native-visibility-canonical-pairs:
    needs: resolve-source-locked-private-join
    if: github.event.repository.private == false && needs.resolve-source-locked-private-join.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PYTHONPATH: ${{ github.workspace }}
      RCLONE_CONFIG: /tmp/realsas-c370-source-pair-join.conf
      MANIFEST_SHA: ${{ needs.resolve-source-locked-private-join.outputs.manifest_sha }}
      SOURCE_SHARDS: gdrive:corpus370_preparation_v1/hosted_portability_v1/private_v5_shards
      NATIVE_REMOTE: gdrive:corpus370_preparation_v1/hosted_native_temporal_pilot_v1/41915393652-1
      PALETTE_REMOTE: gdrive:corpus370_preparation_v1/hosted_generic_palette_reciprocal/41883539256-1/41902211474-1
      VIS_REMOTE: gdrive:corpus370_preparation_v1/hosted_source_hit_visibility_v1/41902211474/41904446622-1
      NATIVE_ROOT: /home/monster/realsas_authority/corpus370_hosted_native_teacher_pilot/41915393652-1
      PALETTE_ROOT: /home/monster/realsas_authority/corpus370_hosted_palette_reciprocal/41902211474-1
      VIS_ROOT: /home/monster/realsas_authority/corpus370_hosted_hit_visibility_court/41904446622-1
      V5: /home/monster/realsas_authority/corpus370_v5_delta_repair_pilot/CORPUS370_PREPARED_OBSERVATION_PACKETS_V5.json
      ROSTER: /home/monster/realsas_authority/corpus370_preparation_v1/CORPUS370_EXACT_SOURCE_ROSTER_V1.json
      REST_INDEX: /home/monster/realsas_authority/corpus370_source_rest_courts_v1_8ab2ebf5/SOURCE_REST_COURTS_INDEX.json
      OUTPUT_ROOT: /home/monster/realsas_authority/corpus370_hosted_native_visibility_pairs/${{ github.run_id }}-${{ github.run_attempt }}
      REMOTE_OUTPUT: gdrive:corpus370_preparation_v1/hosted_native_visibility_pair_join_v1/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Enforce private research compute budget and compile independent courts
        run: |
          set -euo pipefail
          test "$(awk '/MemTotal:/{print $2}' /proc/meminfo)" -ge 14000000
          test "$(df -Pk / | awk 'NR==2{print $4}')" -ge 9000000
          sudo install -d -o "$USER" -g "$(id -gn)" -m 0700 /home/monster/realsas_authority
          python3 -m pip install --disable-pip-version-check numpy
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rclone
          python3 -m py_compile \
            tools/corpus/hosted_v5_private_shards_v1.py \
            tools/corpus/run_corpus370_hosted_native_visibility_pair_join_v1.py \
            tools/corpus/build_corpus370_v5_source_native_canonical_animation_v1.py \
            tools/corpus/diagnose_corpus370_generic_pair_kinematics_v1.py \
            tools/corpus/court_corpus370_visibility_oracle_consumer_v1.py
      - name: Authenticate private Drive transport without token logging
        env:
          DRIVE_RCLONE_CONFIG_B64: ${{ secrets.REALSAS_HOSTED_DRIVE_RCLONE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$DRIVE_RCLONE_CONFIG_B64"
          printf '%s' "$DRIVE_RCLONE_CONFIG_B64" | base64 --decode > "$RCLONE_CONFIG"
          for remote in "$SOURCE_SHARDS" "$NATIVE_REMOTE" "$PALETTE_REMOTE" "$VIS_REMOTE"; do
            rclone lsf "$remote" --max-depth 1 >/dev/null
          done
          echo "SOURCE_AND_ALL_THREE_PRIVATE_EVIDENCE_PARENTS_ACCESSIBLE"
      - name: Hydrate exact original V5 and rest evidence; recover only sealed teacher and graphics receipts
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/private-v5-pair" "$RUNNER_TEMP/private-object-pair" "$OUTPUT_ROOT"
          rclone copy "$SOURCE_SHARDS" "$RUNNER_TEMP/private-v5-pair" \
            --checksum --transfers 2 --checkers 2 --timeout 90s --retries 3
          python3 -u tools/corpus/hosted_v5_private_shards_v1.py hydrate \
            --manifest "$RUNNER_TEMP/private-v5-pair/PRIVATE_V5_SHARD_MANIFEST.json" \
            --expected-manifest-sha256 "$MANIFEST_SHA" \
            --private-dir "$RUNNER_TEMP/private-v5-pair" \
            --object-cache "$RUNNER_TEMP/private-object-pair" \
            > "$OUTPUT_ROOT/PRIVATE_HYDRATE_LOG.txt" 2>&1
          test "$(sha256sum "$V5" | cut -d' ' -f1)" = 8ab2ebf526bbf91d78117580b68ed3784e53bcbafdbd326f012e143c924c0ac4
          test "$(sha256sum "$ROSTER" | cut -d' ' -f1)" = 925dac90ecbf949375aa3ef5d2ed2f40788ae7dcf5669a02b708ada8d9435355
          test "$(sha256sum "$REST_INDEX" | cut -d' ' -f1)" = 384c92940e1ea8eec7bbb98cf319eeda5f89222c07b782b607998e2067f1d9c8
          mkdir -p "$NATIVE_ROOT" "$PALETTE_ROOT" "$VIS_ROOT"
          rclone copy "$NATIVE_REMOTE" "$NATIVE_ROOT" \
            --checksum --transfers 2 --checkers 2 --timeout 90s --retries 3
          rclone copy "$PALETTE_REMOTE" "$PALETTE_ROOT" \
            --checksum --transfers 2 --checkers 2 --timeout 90s --retries 3
          rclone copy "$VIS_REMOTE" "$VIS_ROOT" \
            --checksum --transfers 2 --checkers 2 --timeout 90s --retries 3
          test "$(sha256sum "$NATIVE_ROOT/CORPUS370_V5_AUTHORED_TEMPORAL_PILOT_V1.json" | cut -d' ' -f1)" = 5aa3c4d9cc97ab669d2a7a951a4c9d18218ef5ea4d6f58f5b1ff1ac5b89cc272
          test "$(sha256sum "$PALETTE_ROOT/CORPUS370_V5_PALETTE_INTERVENTION_PILOT_V1.json" | cut -d' ' -f1)" = 638579beb83edfa90614dd8db5c4da77406862a5cfaa3e8653d0cc67ad93e10e
          test "$(sha256sum "$VIS_ROOT/CORPUS370_HOSTED_SOURCE_HIT_VISIBILITY_BATCH_V1.json" | cut -d' ' -f1)" = fbca92b37ed71975de31b77b91a1fba7871c40b03b4b0ebb5b1695669c43bcbd
          echo "SOURCE_REST_NATIVE_ANIMATION_PALETTE_VISIBILITY_SHA_EXACT"
      - name: Independently replay 3x2 real visibility and native pose pairs into canonical candidates
        run: |
          set -euo pipefail
          umask 077
          python3 -u tools/corpus/run_corpus370_hosted_native_visibility_pair_join_v1.py \
            --v5-index "$V5" \
            --exact-roster "$ROSTER" \
            --source-rest-index "$REST_INDEX" \
            --native-root "$NATIVE_ROOT" \
            --palette-root "$PALETTE_ROOT" \
            --visibility-root "$VIS_ROOT" \
            --output-root "$OUTPUT_ROOT" \
            > "$OUTPUT_ROOT/PRIVATE_JOIN_LOG.txt" 2>&1
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['OUTPUT_ROOT'])/'CORPUS370_NATIVE_VISIBILITY_PAIR_JOIN_V1.json').read_text())
          assert d['schema']=='RealSaS.Corpus370HostedNativeVisibilityPairJoin.v1'
          assert d['expected_subject_count']==d['qualified_subject_count']==3
          assert d['failure_count']==0 and d['measured_kinematic_pair_count']==6
          assert d['training_authorized'] is False
          assert d['graphic_owner_identity_minted'] is False
          assert d['tessa_teacher_authorized'] is False
          assert d['same_drawable_positives']==d['different_drawable_negatives']==0
          print('## Real native authored pose x source-hit visibility x canonical join')
          print('Source-exact subjects:',d['qualified_subject_count'])
          print('Source-hit pairs:',d['measured_kinematic_pair_count'])
          print('Pairs with observed relative deformation:',d['observed_relative_deformation_pair_count'])
          print('Degenerate/ABSTAIN:',d['degenerate_abstain_count'])
          print('Same/different drawable authority: 0 / 0 — UNKNOWN')
          print('Causal response and training: NOT AUTHORIZED')
          PY
      - name: Preserve full private source-pair and canonical candidate receipts even after failure
        if: always()
        run: |
          set -euo pipefail
          if test -s "$RCLONE_CONFIG" && test -d "$OUTPUT_ROOT"; then
            rclone copy "$OUTPUT_ROOT" "$REMOTE_OUTPUT" \
              --checksum --transfers 2 --checkers 2 --timeout 90s --retries 3
            echo "PRIVATE_SOURCE_NATIVE_VISIBILITY_PAIR_EVIDENCE_STORED"
          fi
