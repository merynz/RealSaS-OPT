name: corpus370-hosted-workflow-lint-v1
on:
  push:
    branches: [corpus370-source-relative-contact-v1-review]
    paths:
      - '.github/workflows/corpus370-hosted-workflow-lint-v1.yml'
      - '.github/workflows/corpus370-hosted-v5-source-rays-all352-private-v1.yml'
      - '.github/workflows/corpus370-hosted-v5-portability-census-real-v1.yml'
      - '.github/workflows/corpus370-hosted-cpu-blender-smoke-v1.yml'
      - '.github/actionlint.yaml'
      - '.github/workflows/corpus370-hosted-generic-palette-pilot-private-v1.yml'
      - '.github/workflows/corpus370-hosted-source-hit-visibility-court-v1.yml'
      - '.github/workflows/corpus370-hosted-native-teacher-pilot-private-v1.yml'
      - '.github/workflows/corpus370-hosted-native-visibility-pair-join-private-v1.yml'
      - '.github/workflows/corpus370-parallel-evidence-campaign-v1.yml'
      - '.github/workflows/corpus370-hosted-anonymous-layer-private-v1.yml'
      - '.github/workflows/corpus370-hosted-hierarchical-layer-private-v1.yml'
      - '.github/workflows/corpus370-hosted-multiview-geometry-groups-private-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independently-validate-executable-actions-yaml:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Reject invalid GitHub Actions syntax/contexts before any data work
        run: |
          set -euo pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 \
            -shellcheck= -pyflakes= \
            .github/workflows/corpus370-hosted-v5-source-rays-all352-private-v1.yml \
            .github/workflows/corpus370-hosted-v5-portability-census-real-v1.yml \
            .github/workflows/corpus370-hosted-cpu-blender-smoke-v1.yml \
            .github/workflows/corpus370-hosted-generic-palette-pilot-private-v1.yml \
            .github/workflows/corpus370-hosted-source-hit-visibility-court-v1.yml \
            .github/workflows/corpus370-hosted-native-teacher-pilot-private-v1.yml \
            .github/workflows/corpus370-hosted-native-visibility-pair-join-private-v1.yml \
            .github/workflows/corpus370-parallel-evidence-campaign-v1.yml \
            .github/workflows/corpus370-hosted-anonymous-layer-private-v1.yml \
            .github/workflows/corpus370-hosted-hierarchical-layer-private-v1.yml \
            .github/workflows/corpus370-hosted-multiview-geometry-groups-private-v2.yml
