name: corpus370-native-animated-partition-contracts-v9

on:
  push:
    branches: [corpus370-source-relative-contact-v1-review]
    paths:
      - '.github/workflows/corpus370-native-animated-partition-contracts-v9.yml'
      - 'tools/truth_foundry/blender_corpus370_native_animated_partition_render_v9.py'
      - 'tools/corpus/court_corpus370_native_animated_partition_v9.py'
      - 'tools/corpus/run_corpus370_native_animated_partition_private_v9.py'
      - 'tests/corpus/test_corpus370_native_animated_partition_v9.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/corpus370-native-animated-partition-contracts-v9.yml'
      - 'tools/truth_foundry/blender_corpus370_native_animated_partition_render_v9.py'
      - 'tools/corpus/court_corpus370_native_animated_partition_v9.py'
      - 'tools/corpus/run_corpus370_native_animated_partition_private_v9.py'
      - 'tests/corpus/test_corpus370_native_animated_partition_v9.py'

permissions:
  contents: read

concurrency:
  group: corpus370-native-animated-partition-contracts-v9-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-native-render-authority-fail-closed:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Compile all original-source native animated V9 and run synthetic adversarial negatives
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check numpy pytest
          python3 -m py_compile \
            tools/truth_foundry/blender_corpus370_native_animated_partition_render_v9.py \
            tools/corpus/court_corpus370_native_animated_partition_v9.py \
            tools/corpus/run_corpus370_native_animated_partition_private_v9.py
          PYTHONPATH=. python3 -m pytest -q \
            tests/corpus/test_corpus370_native_animated_partition_v9.py
