name: Corpus370 operational drawable algebra contracts v1
on:
  push:
    branches:
      - corpus370-operational-drawable-decision-v1
    paths:
      - 'tools/corpus/compile_corpus370_operational_edit_algebra_v1.py'
      - 'tools/corpus/court_corpus370_operational_edit_algebra_v1.py'
      - 'tests/corpus/test_corpus370_operational_edit_algebra_v1.py'
      - '.github/workflows/corpus370-operational-drawable-algebra-contracts-v1.yml'
  pull_request:
    paths:
      - 'tools/corpus/compile_corpus370_operational_edit_algebra_v1.py'
      - 'tools/corpus/court_corpus370_operational_edit_algebra_v1.py'
      - 'tests/corpus/test_corpus370_operational_edit_algebra_v1.py'
      - '.github/workflows/corpus370-operational-drawable-algebra-contracts-v1.yml'
permissions:
  contents: read
jobs:
  algebra-synthetic-court:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest>=8,<10'
      - name: Verify finite edit algebra against independent exhaustive court
        run: python -m pytest -q tests/corpus/test_corpus370_operational_edit_algebra_v1.py
