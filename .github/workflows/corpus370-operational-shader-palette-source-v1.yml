name: Corpus370 original shader palette and joint edit workload court v1
on:
  push:
    branches: [corpus370-operational-drawable-decision-v1]
    paths:
      - 'tools/truth_foundry/blender_corpus370_operational_palette_v1.py'
      - 'tools/truth_foundry/blender_corpus370_operational_palette_independent_court_v1.py'
      - 'tools/corpus/compile_corpus370_operational_palette_joint_v1.py'
      - 'tests/corpus/test_corpus370_operational_palette_joint_v1.py'
      - 'tools/corpus/court_corpus370_operational_palette_pixel_consequence_v1.py'
      - 'tools/truth_foundry/blender_corpus370_operational_palette_physical_render_v1.py'
      - 'tools/truth_foundry/blender_corpus370_operational_palette_physical_independent_ray_court_v1.py'
      - 'tests/corpus/test_corpus370_operational_palette_pixel_consequence_v1.py'
      - '.github/workflows/corpus370-operational-shader-palette-source-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: corpus370-original-palette-${{ github.ref }}
  cancel-in-progress: true
jobs:
  joint-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'pytest>=8,<10'
      - run: |
          python -m pytest -q tests/corpus/test_corpus370_operational_edit_algebra_v1.py tests/corpus/test_corpus370_operational_native_support_v1.py tests/corpus/test_corpus370_operational_palette_joint_v1.py tests/corpus/test_corpus370_operational_palette_pixel_consequence_v1.py
  original-blender-palette:
    needs: joint-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - subject: CAT
            subject_id: corpus_000ca1ae51f9582fde9e
            source_sha: 1e73aaf7d497dd7d2946badf92d189d2333f163e66dced91feb446bc9bdee850
            ext: glb
          - subject: TRICERATOPS
            subject_id: corpus_004e16e05b90505ca23c
            source_sha: ad66b51cc5fc44c9a3429a5b1b98a61621af08d58d102d8a817499bd6a7f5b5a
            ext: fbx
    env:
      SUBJECT: ${{ matrix.subject }}
      SUBJECT_ID: ${{ matrix.subject_id }}
      SOURCE_SHA: ${{ matrix.source_sha }}
      EXT: ${{ matrix.ext }}
      DRIVE_CONFIG_B64: ${{ secrets.REALSAS_HOSTED_DRIVE_RCLONE_CONFIG_B64 }}
      PYTHONPATH: ${{ github.workspace }}
      D: ${{ github.workspace }}/od-palette-${{ matrix.subject }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official source evaluator system libraries
        run: |
          sudo apt-get -o Acquire::Retries=6 -o Acquire::http::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=6 install -y --no-install-recommends libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 libgl1
          python -m pip install 'numpy>=1.26,<3'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender-4.0.2-linux-x64.tar.xz
          key: observation-blender-4.0.2-linux-x64-5583a5588736da8858c522ef17fff5d73be59c47a6fe91ad29c6f3263e22086a
      - name: Verify pinned Blender 4.0.2 and rclone
        run: |
          set -euo pipefail
          B="$RUNNER_TEMP/blender-4.0.2-linux-x64.tar.xz"
          if [ ! -f "$B" ]; then curl --fail --location --retry 3 --retry-delay 2 'https://download.blender.org/release/Blender4.0/blender-4.0.2-linux-x64.tar.xz' -o "$B"; fi
          echo "5583a5588736da8858c522ef17fff5d73be59c47a6fe91ad29c6f3263e22086a  $B" | sha256sum --check
          tar -xJf "$B" -C "$RUNNER_TEMP"
          EXE="$RUNNER_TEMP/blender-4.0.2-linux-x64/blender"
          test "$("$EXE" --version|head -n1)" = "Blender 4.0.2"
          echo "BLENDER_EXE=$EXE" >> "$GITHUB_ENV"
          R="$RUNNER_TEMP/rclone-v1.75.2-linux-amd64.zip"
          curl -fLsS --retry 3 --max-time 180 "https://github.com/rclone/rclone/releases/download/v1.75.2/rclone-v1.75.2-linux-amd64.zip" -o "$R"
          echo "349ac8fba6ff65d6247043f1750cdcb518ec5d500ef91463a10d37c0ccdf3702  $R" | sha256sum --check
          unzip -q "$R" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/rclone-v1.75.2-linux-amd64" >> "$GITHUB_PATH"
      - name: Prepare SHA-sealed ORIGINAL source, source rest and prior native evidence
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$D"
          test -n "$DRIVE_CONFIG_B64"
          export RCLONE_CONFIG="$RUNNER_TEMP/source-private-palette.conf"
          printf %s "$DRIVE_CONFIG_B64" | base64 -d > "$RCLONE_CONFIG"
          test -s "$RCLONE_CONFIG"
          unset DRIVE_CONFIG_B64
          ROOT="gdrive:corpus370_preparation_v1"
          rclone copyto "$ROOT/hosted_operational_drawable_inputs_v1/42220981274-1/ORIGINAL_TWO_SOURCE_INPUTS.zip" "$D/source.zip" --checksum --retries 3
          echo "e3c758b0a4dc9bd3e7f889e94366fa7ff40517deb15e68a202d525b62de13948  $D/source.zip" | sha256sum --check
          rclone copyto "$ROOT/hosted_reactive_stain_v18a/$SUBJECT/42097722762-1/PRIVATE_REACTIVE_STAIN_CANDIDATE_V18A.npz" "$D/v18a.npz" --checksum --retries 3
          rclone copyto "$ROOT/hosted_operational_drawable_native_support_v1/$SUBJECT/42231532311-1/PRIVATE_OPERATIONAL_NATIVE_SUPPORT_FIT_EVIDENCE_V1.json" "$D/native.json" --checksum --retries 3
          python - <<'PY'
          import os,zipfile,json,hashlib
          from pathlib import Path
          d=Path(os.environ['D']); sid=os.environ['SUBJECT_ID']; expected=os.environ['SOURCE_SHA']
          with zipfile.ZipFile(d/'source.zip') as z:
            manifest=json.loads(z.read('PRIVATE_TRANSPORT_MANIFEST.json'))
            assert manifest['parent_manifest_sha256']=='cb9ffea96b22bb4500b367afe9965d98fa52b99f51dbe4faf5fac8aabc1ae172'
            files=manifest['files']
            def exact(predicate):
              rows=[r for r in files if predicate(r['relative_path'])]
              assert len(rows)==1, (sid,len(rows))
              r=rows[0]; data=z.read('objects/'+r['sha256'])
              assert len(data)==r['size_bytes'] and hashlib.sha256(data).hexdigest()==r['sha256']
              return data
            source=exact(lambda p:p.endswith('/animal-cat.glb') if os.environ['SUBJECT']=='CAT' else p.endswith('/Triceratops.fbx'))
            assert hashlib.sha256(source).hexdigest()==expected
            (d/('source.'+os.environ['EXT'])).write_bytes(source)
            (d/'rest.npz').write_bytes(exact(lambda p:sid in p and p.endswith('/SOURCE_REST_GEOMETRY_V1.npz')))
            (d/'policy.json').write_bytes(exact(lambda p:sid in p and p.endswith('/SOURCE_REST_RENDER_CANDIDATE.json')))
            (d/'camera.json').write_bytes(exact(lambda p:sid in p and p.endswith('/camera_bundle.json')))
            # Restore exact GLB texture dependency if present; no texture replacement or synthesis.
            if os.environ['SUBJECT']=='CAT':
              material=exact(lambda p:p.endswith('/Models/GLB format/Textures/colormap.png'))
              (d/'Textures').mkdir(exist_ok=True)
              (d/'Textures/colormap.png').write_bytes(material)
            policy=json.loads((d/'policy.json').read_text())
            assert policy['source_sha256']==expected
          print(json.dumps({'source_sha256':expected,'subject':sid,'source_policy':True,'training_authorized':False}),flush=True)
          PY
      - name: Real Blender independently imported source palette and joint algebra
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/od-palette-out-$SUBJECT"
          "$BLENDER_EXE" --background --factory-startup --threads 2 --python-exit-code 1 --python tools/truth_foundry/blender_corpus370_operational_palette_v1.py -- --source "$D/source.$EXT" --source-sha256 "$SOURCE_SHA" --v18a-npz "$D/v18a.npz" --rest-npz "$D/rest.npz" --source-policy "$D/policy.json" --output-dir "$RUNNER_TEMP/od-palette-out-$SUBJECT"
          "$BLENDER_EXE" --background --factory-startup --threads 2 --python-exit-code 1 --python tools/truth_foundry/blender_corpus370_operational_palette_independent_court_v1.py -- --source "$D/source.$EXT" --source-sha256 "$SOURCE_SHA" --v18a-npz "$D/v18a.npz" --reference-rest-npz "$D/rest.npz" --source-policy "$D/policy.json" --facts "$RUNNER_TEMP/od-palette-out-$SUBJECT/PRIVATE_ORIGINAL_SHADER_CONSTANT_PALETTE_FACTS_V1.json" --output-dir "$RUNNER_TEMP/od-palette-out-$SUBJECT"
          python -m tools.corpus.compile_corpus370_operational_palette_joint_v1 --native-evidence "$D/native.json" --source-palette "$RUNNER_TEMP/od-palette-out-$SUBJECT/PRIVATE_ORIGINAL_SHADER_CONSTANT_PALETTE_FACTS_V1.json" --palette-court "$RUNNER_TEMP/od-palette-out-$SUBJECT/PRIVATE_INDEPENDENT_ORIGINAL_SHADER_PALETTE_COURT_V1.json" --v18a-npz "$D/v18a.npz" --joint-evidence "$RUNNER_TEMP/od-palette-out-$SUBJECT/PRIVATE_PALETTE_NATIVE_JOINT_EVIDENCE_V1.json" --joint-decision "$RUNNER_TEMP/od-palette-out-$SUBJECT/PRIVATE_PALETTE_NATIVE_JOINT_DECISION_V1.json" --summary "$RUNNER_TEMP/od-palette-out-$SUBJECT/PRIVATE_PALETTE_NATIVE_JOINT_SUMMARY_V1.json"
      - name: Real Triceratops physical palette edit and independent original source-ray court
        if: matrix.subject == 'TRICERATOPS'
        run: |
          set -euo pipefail
          umask 077
          P="$RUNNER_TEMP/od-physical-TRICERATOPS"
          C="$RUNNER_TEMP/od-physical-source-court-TRICERATOPS"
          "$BLENDER_EXE" --background --factory-startup --threads 2 --python-exit-code 1 --python tools/truth_foundry/blender_corpus370_operational_palette_physical_render_v1.py -- --source "$D/source.$EXT" --source-sha256 "$SOURCE_SHA" --source-policy "$D/policy.json" --camera-bundle "$D/camera.json" --source-palette "$RUNNER_TEMP/od-palette-out-$SUBJECT/PRIVATE_ORIGINAL_SHADER_CONSTANT_PALETTE_FACTS_V1.json" --v18a-npz "$D/v18a.npz" --output-dir "$P"
          "$BLENDER_EXE" --background --factory-startup --threads 2 --python-exit-code 1 --python tools/truth_foundry/blender_corpus370_operational_palette_physical_independent_ray_court_v1.py -- --source "$D/source.$EXT" --source-sha256 "$SOURCE_SHA" --source-policy "$D/policy.json" --camera-bundle "$D/camera.json" --source-palette "$RUNNER_TEMP/od-palette-out-$SUBJECT/PRIVATE_ORIGINAL_SHADER_CONSTANT_PALETTE_FACTS_V1.json" --render-manifest "$P/PRIVATE_ORIGINAL_PHYSICAL_PALETTE_RENDER_MANIFEST_V1.json" --render-root "$P" --output-dir "$C"
      - name: Immutable private upload and checksum readback
        run: |
          set -euo pipefail
          umask 077
          ROOT="gdrive:corpus370_preparation_v1"
          export RCLONE_CONFIG="$RUNNER_TEMP/source-private-palette.conf"
          DEST="$ROOT/hosted_operational_shader_palette_v1/$SUBJECT/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          for F in PRIVATE_ORIGINAL_SHADER_CONSTANT_PALETTE_FACTS_V1.json PRIVATE_INDEPENDENT_ORIGINAL_SHADER_PALETTE_COURT_V1.json PRIVATE_PALETTE_NATIVE_JOINT_EVIDENCE_V1.json PRIVATE_PALETTE_NATIVE_JOINT_DECISION_V1.json PRIVATE_PALETTE_NATIVE_JOINT_SUMMARY_V1.json; do
            rclone copyto "$RUNNER_TEMP/od-palette-out-$SUBJECT/$F" "$DEST/$F" --checksum --retries 3
            GOT=0
            for attempt in 1 2 3 4 5 6; do
              if rclone cat "$DEST/$F" > "$RUNNER_TEMP/od-palette-out-$SUBJECT/readback-$F" 2>/dev/null && test -s "$RUNNER_TEMP/od-palette-out-$SUBJECT/readback-$F"; then
                cmp "$RUNNER_TEMP/od-palette-out-$SUBJECT/$F" "$RUNNER_TEMP/od-palette-out-$SUBJECT/readback-$F"
                GOT=1
                break
              fi
              sleep 4
            done
            test "$GOT" = 1
          done
          if [ "$SUBJECT" = TRICERATOPS ]; then
            SRC="$RUNNER_TEMP/od-physical-TRICERATOPS"
            COURT="$RUNNER_TEMP/od-physical-source-court-TRICERATOPS"
            OUT="$DEST/physical_source_edit"
            for F in "PRIVATE_ORIGINAL_PHYSICAL_PALETTE_RENDER_MANIFEST_V1.json" "PRIVATE_INDEPENDENT_ORIGINAL_PHYSICAL_PALETTE_RAY_COURT_V1.json"; do
              case "$F" in
                PRIVATE_INDEPENDENT*) FROM="$COURT/$F" ;;
                *) FROM="$SRC/$F" ;;
              esac
              rclone copyto "$FROM" "$OUT/$F" --checksum --retries 3
              rclone cat "$OUT/$F" > "$D/physical-readback-$F"
              cmp "$FROM" "$D/physical-readback-$F"
            done
            for V in 0 2 4 6; do
              for LABEL in BASELINE EDIT_0 EDIT_1 EDIT_2; do
                FROM="$SRC/$LABEL/V$V.png"
                TO="$OUT/$LABEL/V$V.png"
                test -s "$FROM"
                rclone copyto "$FROM" "$TO" --checksum --retries 3
                rclone cat "$TO" > "$D/physical-readback-$LABEL-V$V.png"
                cmp "$FROM" "$D/physical-readback-$LABEL-V$V.png"
              done
            done
            echo "TRICERATOPS_ORIGINAL_PHYSICAL_EDIT_SOURCE_RAY_COURT_SEALED__NO_OWNER_AUTHORITY"
          fi
          echo "SOURCE_PALETTE_JOINT_SHA_READBACK_VERIFIED__NO_GRAPHICS_OWNER"
