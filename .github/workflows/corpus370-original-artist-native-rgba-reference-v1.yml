name: corpus370-original-artist-native-rgba-reference-research-v1

on:
  push:
    branches: [corpus370-source-relative-contact-v1-review]
    paths:
      - '.github/workflows/corpus370-original-artist-native-rgba-reference-v1.yml'
      - 'tools/corpus/artist_spine_headless_reference_v1.mjs'
  pull_request:
    paths:
      - '.github/workflows/corpus370-original-artist-native-rgba-reference-v1.yml'
      - 'tools/corpus/artist_spine_headless_reference_v1.mjs'

permissions:
  contents: read

concurrency:
  group: corpus370-native-art-source-rgba-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  owl-original-nonhumanoid-author-visual-court:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official Spine CanvasKit evaluation runtime in TEMPORARY workspace
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/real_original_artist_renderer"
          cp tools/corpus/artist_spine_headless_reference_v1.mjs \
            "$RUNNER_TEMP/real_original_artist_renderer/runner.mjs"
          cd "$RUNNER_TEMP/real_original_artist_renderer"
          npm init -y >/dev/null
          npm install --no-save --no-package-lock \
            @esotericsoftware/spine-canvaskit@4.3.13 \
            @esotericsoftware/spine-core@4.3.13 \
            canvaskit-wasm@0.39.1
          node --check runner.mjs
      - name: Download ORIGINAL author export, atlas and texture only for evaluation
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/real_original_artist_renderer/source"
          mkdir -p "$BASE"
          PREFIX="https://raw.githubusercontent.com/EsotericSoftware/spine-runtimes/4.3/examples/owl/export"
          for ASSET in owl-pro.json owl.atlas owl.png; do
            curl --fail --silent --show-error --location --retry 3 \
              "$PREFIX/$ASSET" --output "$BASE/$ASSET"
          done
          test "$(git hash-object "$BASE/owl-pro.json")" = "d42317f7c0bbe7c8c508765d16b0c643d65fb847"
          test "$(git hash-object "$BASE/owl.atlas")" = "0c1c5283335b5b162c58a231515ecf1e3741975b"
          test "$(file -b --mime-type "$BASE/owl.png")" = "image/png"
          echo "GENUINE_ORIGINAL_NONHUMANOID_ART_EVALUATION_ASSETS_VERIFIED"
          sha256sum "$BASE"/*
      - name: Independent original runtime image vs hidden artist hide/isolate references
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/real_original_artist_renderer"
          node "$WORK/runner.mjs" \
            --source "$WORK/source/owl-pro.json" \
            --atlas "$WORK/source/owl.atlas" \
            --output "$WORK/output"
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const root=path.join(process.env.RUNNER_TEMP,"real_original_artist_renderer","output");
          const receipt=JSON.parse(fs.readFileSync(path.join(root,"receipt.json"),"utf8"));
          const sourceInput=JSON.parse(fs.readFileSync(path.join(root,"model_input","manifest.json"),"utf8"));
          const hidden=JSON.parse(fs.readFileSync(path.join(root,"private_artist_court","reference.json"),"utf8"));
          if(receipt.status!=="OFFICIAL_RUNTIME_ORIGINAL_SOURCE_RGBA_AND_PRIVATE_HIDE_ISOLATE_REFS_PRODUCED__NO_MODEL_OWNER")throw Error("NO_REAL_NATIVE_SOURCE_RGBA_REFERENCE");
          if(receipt.original_active_attachments_teacher_only!==25)throw Error("ORIGINAL_OWL_ACTIVE_ATTACHMENT_MISMATCH");
          if(receipt.author_hide_isolate_measured_pair_count!==25)throw Error("ORIGINAL_OWL_AUTHOR_EDITS_NOT_PRESENT");
          if(!(receipt.original_raster_occupied_alpha_pixels>0))throw Error("ORIGINAL_OWL_ALPHA_EMPTY");
          if(sourceInput.original_artist_slot_names_present ||
              sourceInput.original_artist_layer_count_present ||
              sourceInput.source_mesh_face_incidence_present ||
              !sourceInput.consumer_image_only_source_input ||
              sourceInput.training_authorized ||
              hidden.training_authorized)throw Error("REAL_SOURCE_AUTHOR_ART_LEAKAGE");
          if(!hidden.original_hide_isolate_restoration_exact)throw Error("ORIGINAL_EDIT_NOOP_NOT_RESTORED");
          console.log("REAL_ORIGINAL_AUTHOR_OWL_REFERENCE_RGBA_AND_BLIND_IMAGE_CREATED_NOT_OWNER_TRUTH");
          console.log(JSON.stringify({
            original_source_SHA256:receipt.original_source_export_SHA256,
            actual_official_source_render_RGBA_SHA256:receipt.original_rendered_RGBA_SHA256,
            author_slots_hidden_from_model:receipt.source_layer_identifiers_in_model_input===false,
            original_active_authored_layer_hide_isolate_cases:receipt.author_hide_isolate_measured_pair_count,
            source_original_alpha_pixels:receipt.original_raster_occupied_alpha_pixels,
            original_native_editable_project_verified:false,
            original_artist_layer_recovery_measured:false,
            training_authorized:false
          }));
          JS
      - name: Do NOT upload copyrighted source art into project artifacts
        run: echo "All external original source, RGBAs and reference images remain ephemeral; only hashes/counts printed."
