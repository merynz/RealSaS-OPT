name: Corpus370 real original 3-palette same-Cycles-sample K3 edit court
on:
  push:
    branches: [corpus370-operational-drawable-decision-v1]
    paths:
      - 'tools/truth_foundry/blender_corpus370_original_source_palette_k3_cycles_v1.py'
      - 'tools/corpus/court_corpus370_original_source_k3_cycles_palette_edits_v1.py'
      - 'tools/corpus/compose_corpus370_source_sample_k_v1.py'
      - 'tests/corpus/test_corpus370_original_source_k3_cycles_palette_edits_v1.py'
      - '.github/workflows/corpus370-original-source-palette-k3-cycles-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: corpus370-original-source-K3-samples-${{ github.ref }}
  cancel-in-progress: false
jobs:
  independent-k3-source-court-math-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'pytest>=8,<10'
      - name: Syntax and source material/sample K3 independent math contracts
        run: |
          set -euo pipefail
          python -m py_compile tools/truth_foundry/blender_corpus370_original_source_palette_k3_cycles_v1.py tools/corpus/court_corpus370_original_source_k3_cycles_palette_edits_v1.py
          python -m pytest -q tests/corpus/test_corpus370_source_sample_k_v1.py tests/corpus/test_corpus370_original_source_k3_cycles_palette_edits_v1.py
  original-triceratops-k3-physical-source:
    needs: independent-k3-source-court-math-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      DRIVE_CONFIG_B64: ${{ secrets.REALSAS_HOSTED_DRIVE_RCLONE_CONFIG_B64 }}
      PYTHONPATH: ${{ github.workspace }}
      SOURCE_SHA: ad66b51cc5fc44c9a3429a5b1b98a61621af08d58d102d8a817499bd6a7f5b5a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare original source-safe Blender 4.5.14 and transport
        run: |
          set -euo pipefail
          umask 077
          sudo apt-get -o Acquire::Retries=6 update -qq
          sudo apt-get -o Acquire::Retries=6 install -y --no-install-recommends libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 libgl1
          python -m pip install 'numpy>=1.26,<3'
          D="$RUNNER_TEMP/od-original-k3"
          mkdir -p "$D/blender" "$D/inputs"
          curl -fL --retry 4 --max-time 300 https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz -o "$D/blender/source.tar.xz"
          curl -fL --retry 4 --max-time 120 https://download.blender.org/release/Blender4.5/blender-4.5.14.sha256 -o "$D/blender/checksums"
          D="$D" python - <<'PY'
          import hashlib,os,re
          from pathlib import Path
          d=Path(os.environ['D'])/'blender'
          rows=[r for r in (d/'checksums').read_text().splitlines() if 'blender-4.5.14-linux-x64.tar.xz' in r]
          assert len(rows)==1
          matches=re.findall(r'[0-9a-fA-F]{64}',rows[0])
          assert len(matches)==1
          with (d/'source.tar.xz').open('rb') as f:
            assert hashlib.file_digest(f,'sha256').hexdigest()==matches[0].lower()
          PY
          tar -xJf "$D/blender/source.tar.xz" -C "$D/blender"
          BIN="$D/blender/blender-4.5.14-linux-x64/blender"
          test "$(sha256sum "$BIN"|cut -d' ' -f1)" = 050c02562f81fe80ba616a80198fa02d381e60f8b61b8d39add881f4bca0d7d8
          echo "BLENDER_EXE=$BIN" >> "$GITHUB_ENV"
          R="$RUNNER_TEMP/rclone-v1.75.2-linux-amd64.zip"
          curl -fLsS --retry 3 --max-time 180 "https://github.com/rclone/rclone/releases/download/v1.75.2/rclone-v1.75.2-linux-amd64.zip" -o "$R"
          echo "349ac8fba6ff65d6247043f1750cdcb518ec5d500ef91463a10d37c0ccdf3702  $R" | sha256sum --check
          unzip -q "$R" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/rclone-v1.75.2-linux-amd64" >> "$GITHUB_PATH"
          test -n "$DRIVE_CONFIG_B64"
          export RCLONE_CONFIG="$D/source-private-rclone.conf"
          printf %s "$DRIVE_CONFIG_B64" | base64 -d > "$RCLONE_CONFIG"
          test -s "$RCLONE_CONFIG"
          unset DRIVE_CONFIG_B64
      - name: Bind original SHA-immutable Triceratops source, geometry, shader and calibrated cameras
        run: |
          set -euo pipefail
          umask 077
          D="$RUNNER_TEMP/od-original-k3"
          export RCLONE_CONFIG="$D/source-private-rclone.conf"
          ROOT="gdrive:corpus370_preparation_v1"
          rclone copyto "$ROOT/hosted_operational_drawable_inputs_v1/42220981274-1/ORIGINAL_TWO_SOURCE_INPUTS.zip" "$D/inputs/parent.zip" --checksum --retries 3
          echo "e3c758b0a4dc9bd3e7f889e94366fa7ff40517deb15e68a202d525b62de13948  $D/inputs/parent.zip" | sha256sum --check
          rclone copyto "$ROOT/hosted_operational_shader_palette_v1/TRICERATOPS/42236071677-1/PRIVATE_ORIGINAL_SHADER_CONSTANT_PALETTE_FACTS_V1.json" "$D/inputs/palette.json" --checksum --retries 3
          echo "8ff5534e4e8d7549cb9d419e4aea58511e0e042f9113e7d5807a8652a1b76edc  $D/inputs/palette.json" | sha256sum --check
          D="$D" python - <<'PY'
          import json,hashlib,os,zipfile
          from pathlib import Path
          d=Path(os.environ['D'])/'inputs'
          with zipfile.ZipFile(d/'parent.zip') as z:
            manifest=json.loads(z.read('PRIVATE_TRANSPORT_MANIFEST.json'))
            assert manifest['parent_manifest_sha256']=='cb9ffea96b22bb4500b367afe9965d98fa52b99f51dbe4faf5fac8aabc1ae172'
            rows=manifest['files']
            sid='corpus_004e16e05b90505ca23c'
            for suffix,name in [
              ('/Triceratops.fbx','source.fbx'),
              ('/SOURCE_REST_GEOMETRY_V1.npz','rest.npz'),
              ('/camera_bundle.json','camera.json'),
              ('/SOURCE_REST_RENDER_CANDIDATE.json','policy.json')]:
              matches=[r for r in rows if r['relative_path'].endswith(suffix) and
                       (sid in r['relative_path'] or suffix.endswith('Triceratops.fbx'))]
              assert len(matches)==1,(suffix,len(matches))
              ref=matches[0];data=z.read('objects/'+ref['sha256'])
              assert len(data)==ref['size_bytes'] and hashlib.sha256(data).hexdigest()==ref['sha256']
              (d/name).write_bytes(data)
          assert hashlib.sha256((d/'source.fbx').read_bytes()).hexdigest()==os.environ['SOURCE_SHA']
          assert hashlib.sha256((d/'rest.npz').read_bytes()).hexdigest()=='282cdd2813da95ab65ec8211c8338daeb263395659f556f2e7c01d76cc9afcd0'
          assert hashlib.sha256((d/'camera.json').read_bytes()).hexdigest()=='e73917f650ee2dd925efe68a88e2fafdd5f99dbc5b7c410b7de0532ecf66bb0d'
          PY
      - name: Actual K3 physical original-source Cycles SAME-index renders
        run: |
          set -euo pipefail
          umask 077
          D="$RUNNER_TEMP/od-original-k3"
          "$BLENDER_EXE" --background --factory-startup --threads 2 --python-exit-code 1 --python tools/truth_foundry/blender_corpus370_original_source_palette_k3_cycles_v1.py -- --source "$D/inputs/source.fbx" --source-policy "$D/inputs/policy.json" --palette-facts "$D/inputs/palette.json" --camera-bundle "$D/inputs/camera.json" --rest-geometry "$D/inputs/rest.npz" --output-dir "$D/render" > "$D/render_stdout.log" 2>&1 || { tail -n 120 "$D/render_stdout.log"; exit 1; }
          tail -n 20 "$D/render_stdout.log"
      - name: Independent original-source K3 same-sample material-depth + full-edit court
        run: |
          set -euo pipefail
          umask 077
          D="$RUNNER_TEMP/od-original-k3"
          python -m tools.corpus.court_corpus370_original_source_k3_cycles_palette_edits_v1 --manifest "$D/render/PRIVATE_ORIGINAL_SOURCE_K3_SAME_CYCLES_SAMPLES_V1.json" --array "$D/render/PRIVATE_ORIGINAL_SOURCE_K3_SAME_CYCLES_SAMPLES_V1.npz" --output "$D/PRIVATE_INDEPENDENT_ORIGINAL_SOURCE_K3_SAME_INDEX_COURT_V1.json"
      - name: Preserve pass/fail source-private immutable evidence
        if: always()
        run: |
          set -euo pipefail
          umask 077
          D="$RUNNER_TEMP/od-original-k3"
          if [ ! -s "$D/source-private-rclone.conf" ]; then
            echo "NO_TRANSPORT_CREDENTIAL__NOTHING_TO_PRESERVE"
            exit 0
          fi
          export RCLONE_CONFIG="$D/source-private-rclone.conf"
          DEST="gdrive:corpus370_preparation_v1/hosted_operational_original_k3_source_cycles_v1/TRICERATOPS/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          for F in "$D/render/PRIVATE_ORIGINAL_SOURCE_K3_SAME_CYCLES_SAMPLES_V1.json" "$D/render/PRIVATE_ORIGINAL_SOURCE_K3_SAME_CYCLES_SAMPLES_V1.npz" "$D/PRIVATE_INDEPENDENT_ORIGINAL_SOURCE_K3_SAME_INDEX_COURT_V1.json" "$D/render_stdout.log"; do
            if [ -s "$F" ]; then
              NAME="$(basename "$F")"
              rclone copyto "$F" "$DEST/$NAME" --checksum --retries 3
              rclone cat "$DEST/$NAME" > "$D/readback-$NAME"
              cmp "$F" "$D/readback-$NAME"
            fi
          done
          echo "ORIGINAL_K3_CYCLES_SOURCE_PRIVATE_SHA_READBACK__NO_ARTIST_OWNER"
