name: corpus370-runner-diagnostic-contracts-v1
on:
  push:
    branches: [corpus370-source-relative-contact-v1-review]
    paths:
      - '.github/workflows/corpus370-runner-diagnostic-contracts-v1.yml'
      - 'tools/corpus/diagnose_corpus370_wsl_runner_v1.py'
      - 'tests/corpus/test_corpus370_wsl_runner_diagnostic_v1.py'
      - 'tools/corpus/check_corpus370_runner_capacity_v1.py'
      - 'tests/corpus/test_corpus370_runner_capacity_v1.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-postmortem-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate OOM/disk/WSL evidence parser and no-destructive operation
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m py_compile tools/corpus/diagnose_corpus370_wsl_runner_v1.py tools/corpus/check_corpus370_runner_capacity_v1.py
          PYTHONPATH=. python -m pytest -q tests/corpus/test_corpus370_wsl_runner_diagnostic_v1.py tests/corpus/test_corpus370_runner_capacity_v1.py
