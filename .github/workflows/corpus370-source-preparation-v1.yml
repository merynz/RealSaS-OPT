name: corpus370-source-preparation-v1

on:
  workflow_dispatch:
  push:
    branches:
      - corpus400-training-readiness-closure-v1
    paths:
      - '.github/workflows/corpus370-source-preparation-v1.yml'
      - 'canonical/CORPUS370_SOURCE_BUNDLE_TRANSPORT_V1.json'
      - 'canonical/CORPUS370_SOURCE_PACK_PROVENANCE_V1.json'
      - 'canonical/CORPUS370_IRIS_OBSERVATION_POLICY_V1.json'
      - 'canonical/CORPUS370_TRUTH_OPERATOR_REQUEST_V1.json'
      - 'tools/corpus/hydrate_corpus370_source_bundle_v1.py'
      - 'tools/corpus/build_corpus370_exact_source_roster_v1.py'
      - 'tools/corpus/acquire_corpus370_source_provenance_v1.py'
      - 'tools/corpus/prepare_corpus370_observation_packets_v1.py'
      - 'tools/corpus/run_corpus370_observation_sweep_v1.py'
      - 'tools/corpus/prepare_corpus370_platform_truth_bundle_v1.py'
      - 'tools/corpus/iris_observation_admission_v1.py'
      - 'tools/corpus/ufbx_bind_scene_probe_v1.c'
      - 'tools/observation/blender_controlled_8view_v2.py'
      - 'tools/observation/blender_controlled_8view_v1.py'
      - 'tools/observation/source_scene_contract_v2.py'
      - 'tools/observation/blender_source_parity_export_v1.py'

permissions:
  contents: read

concurrency:
  group: corpus370-source-preparation-v1
  cancel-in-progress: false

jobs:
  prepare-corpus370:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 720
    env:
      PYTHONPATH: ${{ github.workspace }}
      PLATFORM_ROOT: /home/monster/realsas_platform
      PREP_ROOT: /home/monster/realsas_authority/corpus370_preparation_v1
      SOURCE_ROOT: /home/monster/realsas_authority/corpus370_preparation_v1/source_bundle
      ROSTER: /home/monster/realsas_authority/corpus370_preparation_v1/CORPUS370_EXACT_SOURCE_ROSTER_V1.json
      PROVENANCE_ROOT: /home/monster/realsas_authority/corpus370_preparation_v1/provenance
      OBSERVATION_ROOT: /home/monster/realsas_authority/corpus370_preparation_v1/observations
      PLATFORM_BUNDLE: /home/monster/realsas_authority/corpus370_preparation_v1/CORPUS370_PLATFORM_TRUTH_INPUT_BUNDLE_V1.zip
      SUMMARY: /home/monster/realsas_authority/corpus370_preparation_v1/CORPUS370_SOURCE_PREPARATION_SUMMARY_V1.json
      BLENDER: /home/monster/.cache/realsas/blender/official-4.0.2-6fe78c9e/blender-4.0.2-linux-x64/numeric-runtime-239/blender-glibc239
      UFBX_REVISION: 5955c5c0b042ac2dc6f32955ab206aaec0620cfc
      UFBX_ROOT: /home/monster/.cache/realsas/ufbx/5955c5c0b042ac2dc6f32955ab206aaec0620cfc
      UFBX_PROBE: /home/monster/realsas_authority/corpus370_preparation_v1/tools/ufbx_bind_scene_probe_v1
      RCLONE_REMOTE: realsas-drive
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify execution prerequisites
        run: |
          set -euo pipefail
          test -x "$PLATFORM_ROOT/current/bin/realsas-python"
          command -v rclone >/dev/null
          command -v git >/dev/null
          command -v cc >/dev/null
          mkdir -p "$PREP_ROOT" "$PREP_ROOT/tools"
          echo "SOURCE_PREPARATION_REVISION=${GITHUB_SHA}"

      - name: Install and verify pinned Blender 4.0.2 numeric runtime
        run: |
          set -euo pipefail
          "$PLATFORM_ROOT/current/bin/realsas-python" \
            tools/observation/install_pinned_evaluator_runtime_v1.py \
            --request canonical/CORPUS370_TRUTH_OPERATOR_REQUEST_V1.json
          test -x "$BLENDER"
          ACTUAL_SHA="$(sha256sum "$BLENDER" | awk '{print $1}')"
          test "$ACTUAL_SHA" = "c47c0b83d061621014c8312abd99db5c1ef057bcf5516faf4bb8d92b3ef6de60"
          "$BLENDER" --version | head -n 1 | grep -F 'Blender 4.0.2'

      - name: Build independent pinned ufbx FBX bind probe
        run: |
          set -euo pipefail
          if [ ! -d "$UFBX_ROOT/.git" ]; then
            rm -rf "$UFBX_ROOT"
            git clone --no-checkout https://github.com/ufbx/ufbx.git "$UFBX_ROOT"
          fi
          git -C "$UFBX_ROOT" fetch --depth 1 origin "$UFBX_REVISION"
          git -C "$UFBX_ROOT" checkout --detach --force FETCH_HEAD
          test "$(git -C "$UFBX_ROOT" rev-parse HEAD)" = "$UFBX_REVISION"
          cc -O2 -std=c99 -I"$UFBX_ROOT" \
            tools/corpus/ufbx_bind_scene_probe_v1.c "$UFBX_ROOT/ufbx.c" -lm \
            -o "$UFBX_PROBE"
          test -x "$UFBX_PROBE"
          echo "UFBX_PROBE_SHA256=$(sha256sum "$UFBX_PROBE" | awk '{print $1}')"

      - name: Hydrate and exhaustively verify exact 370 raw-source bundle
        run: |
          set -euo pipefail
          "$PLATFORM_ROOT/current/bin/realsas-python" \
            tools/corpus/hydrate_corpus370_source_bundle_v1.py \
            --transport canonical/CORPUS370_SOURCE_BUNDLE_TRANSPORT_V1.json \
            --output-root "$SOURCE_ROOT" \
            --rclone-remote "$RCLONE_REMOTE"

      - name: Seal exact Corpus370 source roster from verified archive manifest
        run: |
          set -euo pipefail
          MANIFEST="$SOURCE_ROOT/extracted/5c92e77ae07b215fa4234d221faf27659bc0c47a54d2711d6e49db3d820b8fa9/SOURCE_BUNDLE_MANIFEST_V1.json"
          test -f "$MANIFEST"
          "$PLATFORM_ROOT/current/bin/realsas-python" \
            tools/corpus/build_corpus370_exact_source_roster_v1.py \
            --source-bundle-manifest "$MANIFEST" \
            --source-bundle-archive-sha256 5c92e77ae07b215fa4234d221faf27659bc0c47a54d2711d6e49db3d820b8fa9 \
            --expected-subject-count 370 \
            --output "$ROSTER"
          ACTUAL="$(sha256sum "$ROSTER" | awk '{print $1}')"
          test "$ACTUAL" = "925dac90ecbf949375aa3ef5d2ed2f40788ae7dcf5669a02b708ada8d9435355"
          echo "CORPUS370_EXACT_SOURCE_ROSTER_SHA256=$ACTUAL"

      - name: Acquire and seal exact official pack provenance bytes
        run: |
          set -euo pipefail
          "$PLATFORM_ROOT/current/bin/realsas-python" \
            tools/corpus/acquire_corpus370_source_provenance_v1.py \
            --exact-source-roster "$ROSTER" \
            --provenance-sources canonical/CORPUS370_SOURCE_PACK_PROVENANCE_V1.json \
            --output-root "$PROVENANCE_ROOT"

      - name: Run failure-preserving 370 bind-rest observation sweep
        run: |
          set -euo pipefail
          EXTRACTED="$SOURCE_ROOT/extracted/5c92e77ae07b215fa4234d221faf27659bc0c47a54d2711d6e49db3d820b8fa9"
          "$PLATFORM_ROOT/current/bin/realsas-python" \
            tools/corpus/run_corpus370_observation_sweep_v1.py \
            --exact-source-roster "$ROSTER" \
            --extracted-source-root "$EXTRACTED" \
            --output-root "$OBSERVATION_ROOT" \
            --blender "$BLENDER" \
            --probe "$UFBX_PROBE" \
            --policy canonical/CORPUS370_IRIS_OBSERVATION_POLICY_V1.json

      - name: Build Platform truth input bundle only after 370 of 370 observation preparation
        id: platform_bundle
        run: |
          set -euo pipefail
          OBS_INDEX="$OBSERVATION_ROOT/CORPUS370_PREPARED_OBSERVATION_PACKETS_V1.json"
          PROV_INDEX="$PROVENANCE_ROOT/CORPUS370_SOURCE_PROVENANCE_INDEX_V1.json"
          MANIFEST="$SOURCE_ROOT/extracted/5c92e77ae07b215fa4234d221faf27659bc0c47a54d2711d6e49db3d820b8fa9/SOURCE_BUNDLE_MANIFEST_V1.json"
          EXTRACTED="$SOURCE_ROOT/extracted/5c92e77ae07b215fa4234d221faf27659bc0c47a54d2711d6e49db3d820b8fa9"
          READY="$($PLATFORM_ROOT/current/bin/realsas-python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['OBSERVATION_ROOT'])/'CORPUS370_PREPARED_OBSERVATION_PACKETS_V1.json'
          d=json.loads(p.read_text())
          print('true' if d.get('prepared_subject_count') == 370 and d.get('failure_count') == 0 else 'false')
          PY
          )"
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          if [ "$READY" != "true" ]; then
            echo "Platform bundle remains blocked: observation preparation is incomplete."
            exit 0
          fi
          "$PLATFORM_ROOT/current/bin/realsas-python" \
            tools/corpus/prepare_corpus370_platform_truth_bundle_v1.py \
            --exact-source-roster "$ROSTER" \
            --source-bundle-manifest "$MANIFEST" \
            --extracted-source-root "$EXTRACTED" \
            --observation-index "$OBS_INDEX" \
            --provenance-index "$PROV_INDEX" \
            --output "$PLATFORM_BUNDLE"
          BUNDLE_SHA="$(sha256sum "$PLATFORM_BUNDLE" | awk '{print $1}')"
          BUNDLE_SIZE="$(stat -c '%s' "$PLATFORM_BUNDLE")"
          echo "bundle_sha=$BUNDLE_SHA" >> "$GITHUB_OUTPUT"
          echo "bundle_size=$BUNDLE_SIZE" >> "$GITHUB_OUTPUT"
          DEST="corpus370_preparation_v1/CORPUS370_PLATFORM_TRUTH_INPUT_BUNDLE_V1_${BUNDLE_SHA}.zip"
          rclone copyto "$PLATFORM_BUNDLE" "$RCLONE_REMOTE:$DEST" --checksum --progress
          echo "drive_path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Seal preparation summary
        if: always()
        run: |
          set -euo pipefail
          "$PLATFORM_ROOT/current/bin/realsas-python" - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          def ref(path):
              path=Path(path)
              if not path.is_file(): return None
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for block in iter(lambda:f.read(8*1024*1024),b''): h.update(block)
              return {'path':str(path),'sha256':h.hexdigest(),'size_bytes':path.stat().st_size}

          root=Path(os.environ['PREP_ROOT'])
          obs=ref(Path(os.environ['OBSERVATION_ROOT'])/'CORPUS370_PREPARED_OBSERVATION_PACKETS_V1.json')
          prov=ref(Path(os.environ['PROVENANCE_ROOT'])/'CORPUS370_SOURCE_PROVENANCE_INDEX_V1.json')
          roster=ref(Path(os.environ['ROSTER']))
          source=ref(Path(os.environ['SOURCE_ROOT'])/'CORPUS370_SOURCE_BUNDLE_HYDRATION_V1.json')
          bundle=ref(Path(os.environ['PLATFORM_BUNDLE']))
          obs_doc=json.loads(Path(obs['path']).read_text()) if obs else {}
          payload={
              'schema':'RealSaS.Corpus370SourcePreparationSummary.v1',
              'source_revision':os.environ['GITHUB_SHA'],
              'source_bundle_hydration':source,
              'exact_source_roster':roster,
              'source_provenance':prov,
              'observation_packets':obs,
              'prepared_subject_count':obs_doc.get('prepared_subject_count',0),
              'observation_failure_count':obs_doc.get('failure_count',370),
              'platform_truth_bundle':bundle,
              'platform_truth_bundle_ready':bool(bundle and obs_doc.get('prepared_subject_count')==370 and obs_doc.get('failure_count')==0),
              'family_authority_minted':False,
              'split_minted':False,
              'training_authorized':False,
          }
          out=Path(os.environ['SUMMARY']); out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(payload,sort_keys=True,indent=2)+'\n')
          print(json.dumps({k:payload[k] for k in ('prepared_subject_count','observation_failure_count','platform_truth_bundle_ready','training_authorized')},sort_keys=True))
          PY

      - name: Publish preparation summary
        if: always()
        run: |
          set -euo pipefail
          if [ -f "$SUMMARY" ]; then
            cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus370-source-preparation-v1-${{ github.run_id }}
          path: |
            ${{ env.SUMMARY }}
            ${{ env.ROSTER }}
            ${{ env.PROVENANCE_ROOT }}/CORPUS370_SOURCE_PROVENANCE_INDEX_V1.json
            ${{ env.OBSERVATION_ROOT }}/CORPUS370_PREPARED_OBSERVATION_PACKETS_V1.json
            ${{ env.OBSERVATION_ROOT }}/failures/*.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
