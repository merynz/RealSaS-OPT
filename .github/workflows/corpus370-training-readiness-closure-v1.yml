name: corpus370-training-readiness-closure-v1

on:
  push:
    branches:
      - corpus400-training-readiness-closure-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus370-training-readiness-closure-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authority-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install narrow dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy pillow pytest trimesh fast-simplification

      - name: Compile Corpus370 closure entrypoints
        run: |
          python -m py_compile \
            tools/corpus/audit_corpus370_raw_source_capabilities_v1.py \
            tools/corpus/build_corpus370_exact_source_roster_v1.py \
            tools/corpus/build_corpus370_family_evidence_from_subject_sweeps_v1.py \
            tools/corpus/build_corpus370_global_sdf_composite_evidence_v1.py \
            tools/corpus/build_corpus370_subject_family_authority_matrix_v1.py \
            tools/corpus/derive_corpus370_model_rosters_v1.py \
            tools/corpus/build_corpus370_lineage_groups_v1.py \
            tools/corpus/seal_corpus370_lineage_split_v1.py \
            tools/corpus/plan_corpus370_family_authority_work_v1.py \
            tools/corpus/gltf_bind_scene_v1.py \
            tools/corpus/audit_corpus370_source_camera_authority_v2.py \
            tools/corpus/build_gltf_rig_skin_authority_v1.py \
            tools/corpus/build_gltf_animation_authority_v1.py \
            tools/corpus/blender_fbx_rig_skin_replay_v1.py \
            tools/corpus/validate_fbx_imported_rig_skin_authority_v1.py \
            tools/corpus/collect_corpus370_rig_skin_court_index_v1.py \
            tools/corpus/build_corpus370_rig_skin_evidence_v1.py \
            tools/corpus/render_corpus370_authority_matrix_markdown_v1.py \
            tools/corpus/hydrate_corpus370_source_bundle_v1.py \
            tools/corpus/acquire_corpus370_source_provenance_v1.py \
            tools/corpus/prepare_corpus370_observation_packets_v1.py \
            tools/corpus/run_corpus370_observation_sweep_v1.py \
            tools/corpus/prepare_corpus370_observation_packets_v2.py \
            tools/corpus/run_corpus370_observation_sweep_v2.py \
            tools/corpus/rescue_corpus370_observation_packets_v3.py \
            tools/corpus/prepare_corpus370_platform_truth_bundle_v1.py \
            tools/corpus/prepare_corpus370_platform_truth_bundle_v2.py \
            tools/platform_truth_cohort_bootstrap_v1.py \
            tools/platform_observation_truth_cohort_bootstrap_v2.py \
            tools/truth_foundry/platform_corpus370_truth_operator_v1.py \
            tools/truth_foundry/observe_corpus370_truth_v1.py

      - name: Run fail-closed authority source-format transport lineage split and Platform-contract tests
        run: |
          pytest -q \
            tests/corpus/test_corpus370_subject_family_authority_matrix_v1.py \
            tests/corpus/test_gltf_bind_scene_uint8_offset_v1.py \
            tests/corpus/test_gltf_rig_skin_authority_e2e_v1.py \
            tests/corpus/test_gltf_animation_authority_v1.py \
            tests/corpus/test_gltf2_glb_authority_v1.py \
            tests/corpus/test_fbx_imported_rig_skin_authority_v1.py \
            tests/corpus/test_corpus370_rig_skin_evidence_v1.py \
            tests/corpus/test_corpus370_authority_matrix_markdown_v1.py \
            tests/corpus/test_corpus370_source_transport_provenance_v1.py \
            tests/corpus/test_corpus370_platform_family_input_bundle_v2.py \
            tests/corpus/test_platform_observation_truth_cohort_bootstrap_v2.py \
            tests/corpus/test_corpus370_lineage_groups_v1.py \
            tests/corpus/test_corpus370_lineage_split_v1.py \
            tests/corpus/test_corpus370_truth_platform_contract_v1.py \
            tests/corpus/test_corpus370_truth_projection_operator_v2.py

      - name: Publish branch-scope notice
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          # Corpus370 readiness closure

          This branch job validates source-side contracts only.

          - It does not mint family authority.
          - It does not create TRAIN / UNSEEN membership without sealed lineage and family evidence.
          - It does not authorize training.
          - Heavy 370-subject truth execution remains Platform Experiment -> Campaign -> Attempt owned and must bind an exact deployed revision.
          EOF
