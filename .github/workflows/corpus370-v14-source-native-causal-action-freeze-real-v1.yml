name: corpus370-v14-source-native-causal-action-freeze-real-v1
on:
  push:
    branches: [alfred/v14-native-raster-causal-persistence-v1]
    paths:
      - '.github/workflows/corpus370-v14-source-native-causal-action-freeze-real-v1.yml'
      - 'tools/truth_foundry/blender_corpus370_native_mechanical_raster_join_v14.py'
      - 'tools/corpus/court_corpus370_mechanical_raster_join_v14.py'
      - 'tests/corpus/test_corpus370_native_mechanical_raster_join_v14.py'
permissions:
  contents: read
concurrency:
  group: corpus370-native-render-action-freeze-v1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-native-rgba:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        ordinal: [0,1,2]
    runs-on: ubuntu-24.04
    timeout-minutes: 220
    env:
      SUBJECT_ORDINAL: ${{ matrix.ordinal }}
      DRIVE_CONFIG_B64: ${{ secrets.REALSAS_HOSTED_DRIVE_RCLONE_CONFIG_B64 }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Exact V13b source court gate and unchanged training prohibition
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('canonical/CORPUS370_HOSTED_NATIVE_MECHANICAL_RGBA_REQUEST_V14.json').read_text())
          assert d['schema']=='RealSaS.Corpus370NativeMechanicalRGBAResearchRequest.v14'
          assert d['enabled'] is True
          assert d['training_authorized'] is False and d['graphics_owner_authorized'] is False
          assert d['prior_v13b_real_native_carrier_run_id']==42040199925
          assert d['v14_original_same_perturbation_rgba_required'] is True
          assert d['control_selection_by_original_vertex_response_before_rgba'] is True
          assert d['artist_layer_ownership_minted'] is False
          PY
      - name: Install private transport
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rclone
      - name: Real Blender source +/- intervention RGBA and independent court
        run: bash tools/corpus/hosted_corpus370_native_mechanical_raster_v14.sh

      - name: Require exact real-source original-control RGBA cause, not hosted workflow-only success
        run: |
          set -euo pipefail
          OUT="/home/monster/realsas_authority/corpus370_native_rgba_v14/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/${SUBJECT_ORDINAL}"
          test -f "$OUT/PRIVATE_INDEPENDENT_GEOMETRIC_MECHANICAL_RGBA_COURT_V14.json"
          OUT="$OUT" python3 - <<'PY'
          import os,json
          from pathlib import Path
          d=json.loads((Path(os.environ['OUT'])/'PRIVATE_INDEPENDENT_GEOMETRIC_MECHANICAL_RGBA_COURT_V14.json').read_text())
          assert d['schema']=='RealSaS.Corpus370SameNativeControlGeometricRasterCourt.v14'
          assert d['status']=='V14_REAL_CAUSAL_SOURCE_MECHANICAL_TO_RGBA_JOIN_QUALIFIED__OWNER_UNKNOWN', d['status']
          assert d['baseline_source_vs_soup_and_root_noop_qualified_pose_views']==12
          assert d['original_native_perturbation_vs_source_soup_qualified_camera_cases']==d['original_native_perturbation_vs_source_soup_total_camera_cases']
          assert d['real_source_perturbations_with_visible_rgba_consequences'] is True
          assert all(k>0 for k in d['whole_source_perturbation_effective_pixel_instances_by_selected_control'])
          assert d['artist_same_drawable_pairs']==d['artist_different_drawable_pairs']==0
          assert d['graphics_owner_authorized'] is False and d['training_authorized'] is False
          print('REAL_V14_CAUSAL_NATIVE_CONTROL_RGBA_PASS__AUTHOR_OWNER_UNKNOWN',d['subject_id'],d['whole_source_perturbation_effective_pixel_instances_by_selected_control'],flush=True)
          PY
