name: corpus370-v17-real-pose-aware-source-ray-rgba

on:
  push:
    branches: [corpus370-v17-pose-aware-source-ray-rgba-v1]
    paths:
      - '.github/workflows/corpus370-v17-real-pose-aware-source-ray-rgba.yml'
      - 'tools/corpus/hosted_corpus370_pose_aware_source_ray_v17.sh'
      - 'tools/corpus/corpus370_v17_pose_aware_source_ray_rgba_join_v1.py'
      - 'tests/corpus/test_corpus370_v17_pose_aware_source_ray_rgba_v1.py'

permissions:
  contents: read
concurrency:
  group: corpus370-v17-source-ray-${{ github.ref }}
  cancel-in-progress: false

jobs:
  blind-ray-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Source-only geometry and independent original RGBA court contracts
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check numpy pytest
          python3 -m py_compile tools/corpus/corpus370_v17_pose_aware_source_ray_rgba_join_v1.py
          bash -n tools/corpus/hosted_corpus370_pose_aware_source_ray_v17.sh
          PYTHONPATH=. python3 -m pytest -q tests/corpus/test_corpus370_v17_pose_aware_source_ray_rgba_v1.py

  real-original-pose-source-ray:
    needs: blind-ray-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        include:
          - subject: CAT
            ordinal: 0
          - subject: TRICERATOPS
            ordinal: 1
          - subject: COWFISH
            ordinal: 2
    env:
      SUBJECT: ${{ matrix.subject }}
      SUBJECT_ORDINAL: ${{ matrix.ordinal }}
      DRIVE_CONFIG_B64: ${{ secrets.REALSAS_HOSTED_DRIVE_RCLONE_CONFIG_B64 }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Install private original-source transport
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rclone
      - name: Reopen SHA-locked original source, model-blind posed rays, independent native RGBA court
        run: |
          set -euo pipefail
          bash tools/corpus/hosted_corpus370_pose_aware_source_ray_v17.sh
