name: corpus370-v18f-original-full-physical-face-edits

on:
  push:
    branches: [corpus370-v18b-reactive-stain-source-edit-court-v1]
    paths:
      - '.github/workflows/corpus370-v18f-original-full-physical-face-edits.yml'
      - 'tools/truth_foundry/blender_corpus370_v18f_full_physical_edit_benchmark.py'
      - 'tools/corpus/court_corpus370_v18f_full_physical_edit_benchmark.py'
      - 'tools/corpus/hosted_corpus370_v18f_full_physical_edit_benchmark.sh'
      - 'tests/corpus/test_corpus370_v18f_full_physical_edit_benchmark.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus370-v18f-full-physical-source-edits-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-physical-full-source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compile producer and independent source court, redteam blinded masks
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check numpy pytest
          python3 -m py_compile \
            tools/truth_foundry/blender_corpus370_v18f_full_physical_edit_benchmark.py \
            tools/corpus/court_corpus370_v18f_full_physical_edit_benchmark.py
          bash -n tools/corpus/hosted_corpus370_v18f_full_physical_edit_benchmark.sh
          PYTHONPATH=. python3 -m pytest -q \
            tests/corpus/test_corpus370_v18f_full_physical_edit_benchmark.py

  original-physical-full-source-edit-consequence:
    needs: original-physical-full-source-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - subject: CAT
            ordinal: 0
          - subject: TRICERATOPS
            ordinal: 1
    env:
      SUBJECT: ${{ matrix.subject }}
      SUBJECT_ORDINAL: ${{ matrix.ordinal }}
      DRIVE_CONFIG_B64: ${{ secrets.REALSAS_HOSTED_DRIVE_RCLONE_CONFIG_B64 }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Install source-private transport
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rclone
      - name: Run original Blender physical edit effects, six heldout targets and three policies
        run: |
          set -euo pipefail
          bash tools/corpus/hosted_corpus370_v18f_full_physical_edit_benchmark.sh
