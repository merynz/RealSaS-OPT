name: corpus370-v18k-original-sample-aware-compositing

on:
  push:
    branches: [corpus370-v18b-reactive-stain-source-edit-court-v1]
    paths:
      - '.github/workflows/corpus370-v18k-original-sample-aware-compositing.yml'
      - 'tools/corpus/measure_corpus370_v18k_sample_aware_source_compositing.py'
      - 'tools/corpus/court_corpus370_v18k_sample_aware_source_compositing.py'
      - 'tools/corpus/hosted_corpus370_v18k_sample_aware_source_compositing.sh'
      - 'tests/corpus/test_corpus370_v18k_sample_aware_source_compositing.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus370-v18k-source-sample-aware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v18k-geometric-sample-order-and-unknown-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pure mathematical subpixel compositing falsifiers and source-contract syntax
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check numpy pytest
          bash -n tools/corpus/hosted_corpus370_v18k_sample_aware_source_compositing.sh
          python3 -m py_compile \
            tools/corpus/measure_corpus370_v18k_sample_aware_source_compositing.py \
            tools/corpus/court_corpus370_v18k_sample_aware_source_compositing.py
          PYTHONPATH=. python3 -m pytest -q tests/corpus/test_corpus370_v18k_sample_aware_source_compositing.py

  v18k-original-source-geometry-and-real-blender-control:
    needs: v18k-geometric-sample-order-and-unknown-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - subject: CAT
            ordinal: 0
          - subject: TRICERATOPS
            ordinal: 1
    env:
      SUBJECT: ${{ matrix.subject }}
      SUBJECT_ORDINAL: ${{ matrix.ordinal }}
      DRIVE_CONFIG_B64: ${{ secrets.REALSAS_HOSTED_DRIVE_RCLONE_CONFIG_B64 }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: SHA-256 verified portable rclone rather than system apt
        run: |
          set -euo pipefail
          VERSION=1.75.2
          ARCHIVE="$RUNNER_TEMP/rclone-v${VERSION}-linux-amd64.zip"
          curl -fLsS --retry 3 --connect-timeout 12 --max-time 180 \
            "https://github.com/rclone/rclone/releases/download/v${VERSION}/rclone-v${VERSION}-linux-amd64.zip" \
            -o "$ARCHIVE"
          echo "349ac8fba6ff65d6247043f1750cdcb518ec5d500ef91463a10d37c0ccdf3702  $ARCHIVE" | sha256sum --check
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/rclone-v${VERSION}-linux-amd64/rclone"
          echo "$RUNNER_TEMP/rclone-v${VERSION}-linux-amd64" >> "$GITHUB_PATH"
      - name: Verify original sources and independently remeasure 4x4 joint-sample versus postfilter
        run: |
          set -euo pipefail
          bash tools/corpus/hosted_corpus370_v18k_sample_aware_source_compositing.sh
