name: corpus370-v18p-source-response-vs-topology-court

on:
  push:
    branches: [corpus370-v18b-reactive-stain-source-edit-court-v1]
    paths:
      - '.github/workflows/corpus370-v18p-source-response-vs-topology-court.yml'
      - 'tools/corpus/court_corpus370_v18p_response_topology_identifiability.py'
      - 'tests/corpus/test_corpus370_v18p_response_topology_identifiability.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus370-v18p-identifiability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v18p-response-topology-redteam:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Prove topology vs response separability and negative artist authority
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check numpy pytest
          python3 -m py_compile tools/corpus/court_corpus370_v18p_response_topology_identifiability.py
          PYTHONPATH=. python3 -m pytest -q tests/corpus/test_corpus370_v18p_response_topology_identifiability.py

  v18p-original-source-private-court:
    needs: v18p-response-topology-redteam
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - subject: CAT
            stain_court_sha: 2801bc94c58349f7561071f2c36d9a30b8d13b3b476aa4430e164f2e5de02c7b
            v18o_court_sha: 19d660c5e4a5289d9ddc74048a6aeff9eecd66011fc4a4e3f3f7a8393d0fe239
          - subject: TRICERATOPS
            stain_court_sha: bd7ac5e561af6d4a4bbab8aac555951e5c7e6b97f589a700ef3691edc89ce5c0
            v18o_court_sha: fad9481945af06fbdbaf654974dec60f9d708b898755965748143afc07b0c2ee
    env:
      SUBJECT: ${{ matrix.subject }}
      STAIN_COURT_SHA: ${{ matrix.stain_court_sha }}
      V18O_COURT_SHA: ${{ matrix.v18o_court_sha }}
      DRIVE_CONFIG_B64: ${{ secrets.REALSAS_HOSTED_DRIVE_RCLONE_CONFIG_B64 }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Install immutable rclone and numpy, no apt
        run: |
          set -euo pipefail
          VERSION=1.75.2
          ARCHIVE="$RUNNER_TEMP/rclone-v${VERSION}-linux-amd64.zip"
          curl -fLsS --retry 3 --connect-timeout 12 --max-time 180 \
            "https://github.com/rclone/rclone/releases/download/v${VERSION}/rclone-v${VERSION}-linux-amd64.zip" \
            -o "$ARCHIVE"
          echo "349ac8fba6ff65d6247043f1750cdcb518ec5d500ef91463a10d37c0ccdf3702  $ARCHIVE" | sha256sum --check
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/rclone-v${VERSION}-linux-amd64" >> "$GITHUB_PATH"
          python3 -m pip install --disable-pip-version-check numpy
      - name: Reopen original V18a and V18o immutable sources; independently decompose topology and response
        run: |
          set -euo pipefail
          umask 077
          test -n "$DRIVE_CONFIG_B64"
          export RCLONE_CONFIG="$RUNNER_TEMP/v18p-response-origin.conf"
          printf %s "$DRIVE_CONFIG_B64" | base64 -d > "$RCLONE_CONFIG"
          test -s "$RCLONE_CONFIG"
          unset DRIVE_CONFIG_B64
          D="$RUNNER_TEMP/v18p-original"
          mkdir -p "$D"
          ROOT="gdrive:corpus370_preparation_v1"
          A="$ROOT/hosted_reactive_stain_v18a/$SUBJECT/42097722762-1"
          O="$ROOT/hosted_original_source_partition_viability_v18o/$SUBJECT/42193599098-1"
          rclone copyto "$A/PRIVATE_REACTIVE_STAIN_REPORT_V18A.json" "$D/stain.json" --checksum --retries 3
          rclone copyto "$A/PRIVATE_REACTIVE_STAIN_CANDIDATE_V18A.npz" "$D/stain.npz" --checksum --retries 3
          rclone copyto "$A/PRIVATE_INDEPENDENT_REACTIVE_STAIN_COURT_V18A.json" "$D/stain-court.json" --checksum --retries 3
          rclone copyto "$O/PRIVATE_INDEPENDENT_V18O_SOURCE_PARTITION_VIABILITY_COURT.json" "$D/v18o-court.json" --checksum --retries 3
          test "$(sha256sum "$D/stain-court.json"|cut -d' ' -f1)" = "$STAIN_COURT_SHA"
          test "$(sha256sum "$D/v18o-court.json"|cut -d' ' -f1)" = "$V18O_COURT_SHA"
          python3 -u tools/corpus/court_corpus370_v18p_response_topology_identifiability.py \
            --stain-report "$D/stain.json" --stain-npz "$D/stain.npz" \
            --stain-court "$D/stain-court.json" --v18o-court "$D/v18o-court.json" \
            --expected-stain-court-sha "$STAIN_COURT_SHA" \
            --expected-v18o-court-sha "$V18O_COURT_SHA" \
            --output "$D/PRIVATE_V18P_ORIGINAL_SOURCE_RESPONSE_TOPOLOGY_COURT.json"
          D="$D" python3 - <<'PY'
          import json,os
          from pathlib import Path
          z=json.loads((Path(os.environ["D"])/"PRIVATE_V18P_ORIGINAL_SOURCE_RESPONSE_TOPOLOGY_COURT.json").read_text())
          assert z["status"]=="SOURCE_TOPOLOGY_AND_AXIS_RESPONSE_ABLATION_MEASURED__DRAWABLE_OWNER_UNKNOWN"
          s=z["source_identifiability_audit"]
          assert s["original_source_teacher_axis_and_face_ids_never_model_inputs"] is True
          assert len(s["original_source_threshold_diagnostics"])==3
          assert s["original_source_artist_same_drawable_pairs_minted"]==0
          assert s["original_source_artist_different_drawable_pairs_minted"]==0
          assert z["new_drawable_partition_constructed"] is False
          assert all(z[k] is False for k in ("graphics_owner_authorized",
              "iris_training_authorized","tessa_training_authorized",
              "materialization_authorized","training_authorized"))
          for t in s["original_source_threshold_diagnostics"]:
              assert t["original_V18a_candidates"]["component_count"]>=t["topological_component_floor"]
              assert t["topology_components_contain_all_source_edges"] is True
              assert t["source_semantic_labels_used"] is False
          print("V18P_ORIGINAL_RESPONSE_AND_TOPOLOGY_IDENTIFIABILITY_MEASURED__ARTIST_OWNER_UNKNOWN",flush=True)
          PY
          OUT="$ROOT/hosted_source_response_topology_v18p/$SUBJECT/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/PRIVATE_V18P_ORIGINAL_SOURCE_RESPONSE_TOPOLOGY_COURT.json"
          rclone copyto "$D/PRIVATE_V18P_ORIGINAL_SOURCE_RESPONSE_TOPOLOGY_COURT.json" "$OUT" --checksum --retries 3
          rclone cat "$OUT" > "$D/readback.json"
          test "$(sha256sum "$D/readback.json"|cut -d' ' -f1)" = "$(sha256sum "$D/PRIVATE_V18P_ORIGINAL_SOURCE_RESPONSE_TOPOLOGY_COURT.json"|cut -d' ' -f1)"
          echo "V18P_ORIGINAL_SOURCE_IDENTIFIABILITY_COURT_SHA=$(sha256sum "$D/readback.json"|cut -d' ' -f1)"
