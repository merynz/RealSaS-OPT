name: corpus370-v5-current-family-requalification-real-v1
on:
  push:
    branches: [corpus370-source-relative-contact-v1-review]
    paths:
      - '.github/workflows/corpus370-v5-current-family-requalification-real-v1.yml'
      - 'tools/corpus/build_corpus370_v5_geometry_family_evidence_v1.py'
      - 'tools/corpus/requalify_corpus370_v5_source_camera_families_v1.py'
      - 'tests/corpus/test_corpus370_v5_geometry_family_evidence_v1.py'
      - 'tests/corpus/test_corpus370_v5_source_camera_requalification_v1.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: corpus370-v5-current-family-requalification-real-v1
  cancel-in-progress: false

jobs:
  fail-closed-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify that current V5 PASS is independent, source-locked and not sign/graphics/teacher promotion
        run: |
          python -m pip install --disable-pip-version-check numpy scipy pillow pytest trimesh fast-simplification Rtree==1.4.1
          PYTHONPATH=. python -m pytest -q \
            tests/corpus/test_corpus370_v5_geometry_family_evidence_v1.py \
            tests/corpus/test_corpus370_v5_source_camera_requalification_v1.py

  admit-measured-source-surface-families:
    needs: fail-closed-contract-tests
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
      PY: /home/monster/realsas_platform/current/bin/realsas-python
      PREP: /home/monster/realsas_authority/corpus370_preparation_v1
      V5: /home/monster/realsas_authority/corpus370_v5_delta_repair_pilot/CORPUS370_PREPARED_OBSERVATION_PACKETS_V5.json
      GEOMETRY: /home/monster/realsas_authority/corpus370_component_geometry_courts_v1_384c9294/COMPONENT_GEOMETRY_COURTS_INDEX.json
      OUTPUT: /home/monster/realsas_authority/corpus370_v5_current_family_requalification/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Reopen all independently courted 352 source-surface UDF/normals targets
        run: |
          set -euo pipefail
          test "$(sha256sum "$V5" | cut -d' ' -f1)" = 8ab2ebf526bbf91d78117580b68ed3784e53bcbafdbd326f012e143c924c0ac4
          test "$(sha256sum "$PREP/CORPUS370_EXACT_SOURCE_ROSTER_V1.json" | cut -d' ' -f1)" = 925dac90ecbf949375aa3ef5d2ed2f40788ae7dcf5669a02b708ada8d9435355
          mkdir -p "$OUTPUT"
          "$PY" -u tools/corpus/build_corpus370_v5_geometry_family_evidence_v1.py \
            --v5-index "$V5" --component-index "$GEOMETRY" \
            --exact-source-roster "$PREP/CORPUS370_EXACT_SOURCE_ROSTER_V1.json" \
            --output "$OUTPUT/CORPUS370_V5_SOURCE_GEOMETRY_FAMILY_EVIDENCE_V1.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus370-v5-source-geometry-family-352-${{ github.run_id }}
          path: ${{ env.OUTPUT }}/CORPUS370_V5_SOURCE_GEOMETRY_FAMILY_EVIDENCE_V1.json
          if-no-files-found: warn
          retention-days: 30

  requalify-current-v5-source-import-and-camera:
    needs: fail-closed-contract-tests
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 180
    env:
      PYTHONPATH: ${{ github.workspace }}
      PY: /home/monster/realsas_platform/current/bin/realsas-python
      PREP: /home/monster/realsas_authority/corpus370_preparation_v1
      V5: /home/monster/realsas_authority/corpus370_v5_delta_repair_pilot/CORPUS370_PREPARED_OBSERVATION_PACKETS_V5.json
      REST: /home/monster/realsas_authority/corpus370_source_rest_courts_v1_8ab2ebf5/SOURCE_REST_COURTS_INDEX.json
      SOURCE_ARCHIVE_SHA: 5c92e77ae07b215fa4234d221faf27659bc0c47a54d2711d6e49db3d820b8fa9
      OUTPUT: /home/monster/realsas_authority/corpus370_v5_current_family_requalification/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Re-court immutable raw source, V5 admitted import and exact 8-view cameras for all 370
        run: |
          set -euo pipefail
          "$PY" -u tools/corpus/requalify_corpus370_v5_source_camera_families_v1.py \
            --v5-index "$V5" --source-rest-index "$REST" \
            --exact-source-roster "$PREP/CORPUS370_EXACT_SOURCE_ROSTER_V1.json" \
            --extracted-source-root "$PREP/source_bundle/extracted/$SOURCE_ARCHIVE_SHA" \
            --policy "${{ github.workspace }}/canonical/CORPUS370_SOURCE_CAMERA_AUTHORITY_POLICY_V2.json" \
            --output-dir "$OUTPUT" | tee "$OUTPUT-source-camera-progress.jsonl"
      - name: Surface real source import/camera family outcomes (not model admission)
        if: always()
        run: |
          if test -f "$OUTPUT/CORPUS370_V5_SOURCE_CAMERA_REQUALIFICATION_V1.json"; then
            "$PY" - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json,os
          from pathlib import Path
          report=json.loads((Path(os.environ['OUTPUT'])/'CORPUS370_V5_SOURCE_CAMERA_REQUALIFICATION_V1.json').read_text())
          print('## V5 370 actual current Source/CAMERA family courts')
          print('No training, no Graphics/Mechanics/TESSA authority.')
          print('```json')
          print(json.dumps(report['rollup'],indent=2,sort_keys=True))
          print('```')
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus370-v5-current-source-camera-370-${{ github.run_id }}
          path: |
            ${{ env.OUTPUT }}/CORPUS370_V5_SOURCE_CAMERA_REQUALIFICATION_V1.json
            ${{ env.OUTPUT }}/CORPUS370_V5_SOURCE_CAMERA_FAMILY_EVIDENCE_V1.json
            ${{ env.OUTPUT }}-source-camera-progress.jsonl
          if-no-files-found: warn
          retention-days: 30

  join-exact-current-family-evidence:
    needs: [admit-measured-source-surface-families, requalify-current-v5-source-import-and-camera]
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      PY: /home/monster/realsas_platform/current/bin/realsas-python
      PREP: /home/monster/realsas_authority/corpus370_preparation_v1
      OUTPUT: /home/monster/realsas_authority/corpus370_v5_current_family_requalification/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Build 370 whole-universe current per-family matrix, preserving UNKNOWN
        run: |
          set -euo pipefail
          "$PY" tools/corpus/build_corpus370_subject_family_authority_matrix_v1.py \
            --policy canonical/CORPUS370_SUBJECT_FAMILY_AUTHORITY_POLICY_V1.json \
            --candidate-manifest "$PREP/CORPUS370_EXACT_SOURCE_ROSTER_V1.json" \
            --evidence-index "$OUTPUT/CORPUS370_V5_SOURCE_CAMERA_FAMILY_EVIDENCE_V1.json" \
            --evidence-index "$OUTPUT/CORPUS370_V5_SOURCE_GEOMETRY_FAMILY_EVIDENCE_V1.json" \
            --output "$OUTPUT/CORPUS370_V5_CURRENT_FAMILY_MATRIX_V1.json"
          "$PY" tools/corpus/build_corpus370_materialization_checkpoint_v1.py \
            --matrix "$OUTPUT/CORPUS370_V5_CURRENT_FAMILY_MATRIX_V1.json" \
            --output "$OUTPUT"
      - name: Publish real model-head matrix, no premature readiness
        if: always()
        run: |
          if test -f "$OUTPUT/CORPUS370_MATERIALIZATION_CHECKPOINT_V1.md"; then
            cat "$OUTPUT/CORPUS370_MATERIALIZATION_CHECKPOINT_V1.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus370-v5-current-family-matrix-370-${{ github.run_id }}
          path: |
            ${{ env.OUTPUT }}/CORPUS370_V5_CURRENT_FAMILY_MATRIX_V1.json
            ${{ env.OUTPUT }}/CORPUS370_MATERIALIZATION_CHECKPOINT_V1.json
            ${{ env.OUTPUT }}/CORPUS370_MATERIALIZATION_CHECKPOINT_V1.md
          if-no-files-found: warn
          retention-days: 30
