name: corpus370-v5-head-target-readiness-real-v1
on:
  push:
    branches: [corpus370-source-relative-contact-v1-review]
    paths:
      - '.github/workflows/corpus370-v5-head-target-readiness-real-v1.yml'
      - 'tools/corpus/audit_corpus370_v5_head_target_readiness_v1.py'
      - 'tests/corpus/test_corpus370_v5_head_target_readiness_v1.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus370-v5-head-target-readiness-real-v1
  cancel-in-progress: false

jobs:
  head-target-audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact scientific non-promotion of component sign and unknown heads
        run: |
          python -m pip install --disable-pip-version-check pytest
          PYTHONPATH=. python -m pytest -q tests/corpus/test_corpus370_v5_head_target_readiness_v1.py

  source-locked-real-352-evidence-readback:
    needs: [head-target-audit-tests]
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      PY: /home/monster/realsas_platform/current/bin/realsas-python
      V5_INDEX: /home/monster/realsas_authority/corpus370_v5_delta_repair_pilot/CORPUS370_PREPARED_OBSERVATION_PACKETS_V5.json
      COMPONENT_INDEX: /home/monster/realsas_authority/corpus370_component_geometry_courts_v1_384c9294/COMPONENT_GEOMETRY_COURTS_INDEX.json
      OUTPUT: /home/monster/realsas_authority/corpus370_v5_head_target_readback/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable V5 observation parent and independent Stage50 artifact presence
        run: |
          set -euo pipefail
          test -x "$PY"
          test -f "$V5_INDEX" && test -f "$COMPONENT_INDEX"
          test "$(sha256sum "$V5_INDEX" | cut -d' ' -f1)" = 8ab2ebf526bbf91d78117580b68ed3784e53bcbafdbd326f012e143c924c0ac4
          "$PY" -m py_compile tools/corpus/audit_corpus370_v5_head_target_readiness_v1.py
      - name: Independently re-open all 352 source geometry court receipts and audit head-target coverage
        run: |
          set -euo pipefail
          "$PY" -u tools/corpus/audit_corpus370_v5_head_target_readiness_v1.py \
            --v5-index "$V5_INDEX" \
            --component-index "$COMPONENT_INDEX" \
            --output-dir "$OUTPUT"
      - name: Surface real candidate coverage and all UNKNOWN model-target families
        if: always()
        run: |
          if test -f "$OUTPUT/CORPUS370_STAGE50_HEAD_TARGET_READBACK_V1.md"; then
            cat "$OUTPUT/CORPUS370_STAGE50_HEAD_TARGET_READBACK_V1.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Stage50 evidence readback failed before producing its receipt.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus370-v5-head-target-readback-${{ github.run_id }}
          path: |
            ${{ env.OUTPUT }}/CORPUS370_STAGE50_HEAD_TARGET_READBACK_V1.json
            ${{ env.OUTPUT }}/CORPUS370_STAGE50_HEAD_TARGET_READBACK_V1.md
          if-no-files-found: warn
          retention-days: 30
          compression-level: 1
