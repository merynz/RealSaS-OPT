name: corpus370-v5-source-locus-geometric-ray-pilot-v1
on:
  push:
    branches: [corpus370-source-relative-contact-v1-review]
    paths:
      - '.github/workflows/corpus370-v5-source-locus-geometric-ray-pilot-v1.yml'
      - 'tools/corpus/measure_corpus370_v5_source_locus_rays_v1.py'
      - 'tests/corpus/test_corpus370_v5_source_locus_geometric_rays_v1.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: corpus370-v5-source-locus-geometric-ray-pilot-v1
  cancel-in-progress: false

jobs:
  source-ray-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove source-locus ray addresses do not impersonate drawable/alpha ownership
        run: |
          python -m pip install --disable-pip-version-check numpy pytest
          PYTHONPATH=. python -m pytest -q tests/corpus/test_corpus370_v5_source_locus_geometric_rays_v1.py
  source-locked-geometry-ray-pilot:
    needs: source-ray-contracts
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 120
    env:
      PYTHONPATH: ${{ github.workspace }}
      PY: /home/monster/realsas_platform/current/bin/realsas-python
      V5: /home/monster/realsas_authority/corpus370_v5_delta_repair_pilot/CORPUS370_PREPARED_OBSERVATION_PACKETS_V5.json
      REST: /home/monster/realsas_authority/corpus370_source_rest_courts_v1_8ab2ebf5/SOURCE_REST_COURTS_INDEX.json
      OUTPUT: /home/monster/realsas_authority/corpus370_v5_source_locus_rays/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Measure actual exact V5 source face+barycentric ray stacks over three morphologies
        run: |
          set -euo pipefail
          "$PY" -u tools/corpus/measure_corpus370_v5_source_locus_rays_v1.py \
            --v5-index "$V5" --source-rest-index "$REST" \
            --output-dir "$OUTPUT" \
            --subject-id corpus_000ca1ae51f9582fde9e \
            --subject-id corpus_004e16e05b90505ca23c \
            --subject-id corpus_00a3688e42a29045056b
      - name: Publish measured pairs vs abstain, never graphical owner labels
        if: always()
        run: |
          if test -f "$OUTPUT/SOURCE_LOCUS_GEOMETRIC_RAYS_PILOT_INDEX_V1.json"; then
            "$PY" - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['OUTPUT'])/'SOURCE_LOCUS_GEOMETRIC_RAYS_PILOT_INDEX_V1.json').read_text())
          print('## Source-locus ray geometry pilot')
          print('This is depth-order geometry only; rendered alpha and drawable ownership require separate causal source measurements.')
          for sid,row in r['subject_results'].items():
              print(sid+': '+row['status']+' '+json.dumps(row.get('counts',{}),sort_keys=True))
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus370-v5-source-locus-rays-${{ github.run_id }}
          path: |
            ${{ env.OUTPUT }}/SOURCE_LOCUS_GEOMETRIC_RAYS_PILOT_INDEX_V1.json
            ${{ env.OUTPUT }}/subjects/*/SOURCE_LOCUS_GEOMETRIC_RAYS_V1.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 1
