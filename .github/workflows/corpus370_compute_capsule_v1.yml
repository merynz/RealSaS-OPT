name: corpus370-compute-capsule-v1
on:
  push:
    branches: [main]
    paths:
      - 'canonical/CORPUS370_COMPUTE_EXPORT_V1.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: corpus370-compute-capsule-v1
  cancel-in-progress: false
jobs:
  export:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 50
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: '1'
      OUTPUT: /home/monster/realsas_authority/corpus370_compute_publications/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify and reuse existing immutable package; do not repeat measurement
        run: |
          /home/monster/realsas_platform/current/bin/realsas-python -m tools.corpus.publish_corpus370_compute_capsule_v1 prepare --config canonical/CORPUS370_COMPUTE_EXPORT_V1.json --output "$OUTPUT"
      - name: Preserve complete compute package as alternate authenticated transport
        uses: actions/upload-artifact@v4
        timeout-minutes: 10
        continue-on-error: true
        with:
          name: corpus370-compute-full-package-${{ github.run_id }}
          path: |
            ${{ env.OUTPUT }}/CORPUS370_COMPUTE_CAPSULE_V1.zip
            ${{ env.OUTPUT }}/COMPUTE_CAPSULE_RECEIPT.json
            ${{ env.OUTPUT }}/COMPUTE_CAPSULE.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Publish with visible progress and bounded network waits; readiness receipt last
        run: |
          /home/monster/realsas_platform/current/bin/realsas-python -m tools.corpus.publish_corpus370_compute_capsule_v1 publish --output "$OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus370-compute-capsule-receipt-${{ github.run_id }}
          path: |
            ${{ env.OUTPUT }}/COMPUTE_CAPSULE_RECEIPT.json
            ${{ env.OUTPUT }}/COMPUTE_CAPSULE.json
            ${{ env.OUTPUT }}/Corpus370_Compute_Worker_Run_All_v1.ipynb
            ${{ env.OUTPUT }}/PUBLISH_PROGRESS.json
          if-no-files-found: error
          retention-days: 30
