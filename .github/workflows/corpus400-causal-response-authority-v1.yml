name: corpus400-causal-response-authority-v1

on:
  push:
    branches:
      - corpus400-causal-response-authority-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus400-causal-response-authority-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  causal-response-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install narrow dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy pillow pytest trimesh fast-simplification

      - name: Compile causal response authority tools
        run: |
          python -m py_compile \
            tools/corpus/build_causal_response_authority_v1.py \
            tools/corpus/validate_causal_response_authority_v1.py

      - name: Run accumulated truth-authority courts
        run: |
          pytest -q \
            tests/corpus/test_component_geometry_authority_v1.py \
            tests/corpus/test_component_geometry_court_v1.py \
            tests/corpus/test_component_geometry_authority_e2e_v1.py \
            tests/corpus/test_iris_component_geometry_consumer_v1.py \
            tests/corpus/test_gltf_rig_skin_authority_e2e_v1.py \
            tests/corpus/test_gltf_animation_authority_v1.py \
            tests/corpus/test_mechanical_surface_topology_authority_v1.py \
            tests/corpus/test_tessa_component_surface_topology_v1.py \
            tests/corpus/test_tessa_mechanical_surface_topology_v5.py \
            tests/corpus/test_causal_response_authority_v1.py
