name: corpus400-geometry-authority-v1

on:
  push:
    branches:
      - corpus400-geometry-authority-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus400-geometry-authority-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  geometry-authority-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install narrow dependencies
        run: python -m pip install --disable-pip-version-check numpy pytest

      - name: Compile component geometry authority tools
        run: |
          python -m py_compile \
            models/iris/truth/component_geometry_authority_v1.py \
            tools/corpus/build_component_geometry_authority_v1.py \
            tools/corpus/validate_component_geometry_authority_v1.py

      - name: Run component authority regression courts
        run: |
          pytest -q \
            tests/corpus/test_component_geometry_authority_v1.py \
            tests/corpus/test_component_geometry_court_v1.py
