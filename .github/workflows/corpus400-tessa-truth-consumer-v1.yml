name: corpus400-tessa-truth-consumer-v1

on:
  push:
    branches:
      - corpus400-tessa-truth-consumer-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus400-tessa-truth-consumer-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tessa-truth-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install narrow dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy pillow pytest trimesh fast-simplification

      - name: Compile TESSA truth consumer tools
        run: |
          python -m py_compile \
            models/tessa/truth/component_surface_topology_v1.py \
            tools/training/build_corpus_mechanical_tessa_teacher_v4.py \
            tools/training/validate_corpus_mechanical_tessa_teacher_v4.py

      - name: Run accumulated truth-authority and TESSA consumer courts
        run: |
          pytest -q \
            tests/corpus/test_component_geometry_authority_v1.py \
            tests/corpus/test_component_geometry_court_v1.py \
            tests/corpus/test_component_geometry_authority_e2e_v1.py \
            tests/corpus/test_iris_component_geometry_consumer_v1.py \
            tests/corpus/test_gltf_rig_skin_authority_e2e_v1.py \
            tests/corpus/test_gltf_animation_authority_v1.py \
            tests/corpus/test_tessa_component_surface_topology_v1.py
