name: corpus400-trainer-truth-consumer-v1

on:
  push:
    branches:
      - corpus400-trainer-truth-consumer-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus400-trainer-truth-consumer-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trainer-truth-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install narrow dependencies
        run: python -m pip install --disable-pip-version-check numpy pytest trimesh

      - name: Compile truth consumer tools
        run: |
          python -m py_compile \
            models/iris/truth/component_geometry_training_targets_v1.py \
            tools/training/validate_iris_component_geometry_consumer_v1.py

      - name: Run trainer truth-consumer courts
        run: |
          pytest -q \
            tests/corpus/test_component_geometry_authority_v1.py \
            tests/corpus/test_component_geometry_court_v1.py \
            tests/corpus/test_component_geometry_authority_e2e_v1.py \
            tests/corpus/test_iris_component_geometry_consumer_v1.py
