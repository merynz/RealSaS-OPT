name: corpus4008-mesh2motion-native-control-pilot-v1

# Public immutable CC0 source-rig observations. Never run source-embedded scripts.
# The resulting receipts are private and are NOT independent functional IK truth.
on:
  push:
    branches: [corpus4008-target1000-source-scout-v1-20261107]
    paths:
      - '.github/workflows/corpus4008-mesh2motion-native-control-pilot-v1.yml'
      - 'tools/corpus/blender_corpus4008_native_blend_control_probe_v1.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus4008-external-native-rig-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mesh2motion-native-control-source-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RCLONE_CONFIG: /tmp/realsas-c4008-native-control-private.conf
      REMOTE: gdrive:RealSaS_MASTER_CORPUS_1024_V3
      PRIVATE_OUTPUT: gdrive:RealSaS_MASTER_CORPUS_1024_V3/audits/external_native_control_v1/${{ github.run_id }}-${{ github.run_attempt }}
      SOURCE_COMMIT: dc2eb3cf06ba0aaeb0c651503d5667f773781522
    steps:
      - uses: actions/checkout@v4
        with:
          path: engine
      - uses: actions/checkout@v4
        with:
          repository: Mesh2Motion/mesh2motion-assets
          ref: dc2eb3cf06ba0aaeb0c651503d5667f773781522
          path: upstream-rigs
          persist-credentials: false
      - name: Compile safe source inspection script
        run: |
          set -euo pipefail
          PYTHONPATH=engine python -m compileall -q engine/tools/corpus/blender_corpus4008_native_blend_control_probe_v1.py
          echo "Pinned upstream repo SHA: $(git -C upstream-rigs rev-parse HEAD)"
          test "$(git -C upstream-rigs rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -s upstream-rigs/LICENSE
          grep -q 'Creative Commons' upstream-rigs/LICENSE
          python - <<'PY'
          from pathlib import Path
          names=('rig-snake','rig-spider','rig-dragon')
          for name in names:
              path=Path('upstream-rigs/rigs')/(name+'.blend')
              assert path.is_file() and path.stat().st_size>1024, f'MISSING_SOURCE_BYTES:{name}'
              magic=path.open('rb').read(7)
              if magic.startswith(b'BLENDER'):
                  category="NATIVE_BLEND"
              elif magic[:4]==bytes.fromhex('28b52ffd'):
                  category="ZSTANDARD_WRAPPED_BLEND"
              else:
                  raise ValueError(f'UNSUPPORTED_SOURCE_ENCODING:{name}:{magic.hex()}')
              print(name, category, 'bytes', path.stat().st_size)
          PY
      - name: Check private Drive configured
        id: gate
        env:
          HAS_DRIVE: ${{ secrets.REALSAS_HOSTED_DRIVE_RCLONE_CONFIG_B64 != '' }}
        run: |
          if test "$HAS_DRIVE" = true; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'NO_PRIVATE_DESTINATION_NO_SOURCE_OBSERVATION' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify official pinned Blender and private storage
        if: steps.gate.outputs.ready == 'true'
        env:
          DRIVE_CONFIG_B64: ${{ secrets.REALSAS_HOSTED_DRIVE_RCLONE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          umask 077
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends rclone xz-utils zstd
          printf '%s' "$DRIVE_CONFIG_B64" | base64 -d > "$RCLONE_CONFIG"
          mkdir -p "$RUNNER_TEMP/c4008-native/bin" "$RUNNER_TEMP/c4008-native/output"
          cd "$RUNNER_TEMP/c4008-native/bin"
          curl -fL --retry 4 --max-time 300 https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz -o blender.tar.xz
          curl -fL --retry 4 --max-time 120 https://download.blender.org/release/Blender4.5/blender-4.5.14.sha256 -o official.sha256
          python - <<'PY'
          from pathlib import Path
          import hashlib,re
          lines=[x for x in Path("official.sha256").read_text().splitlines()
                 if 'blender-4.5.14-linux-x64.tar.xz' in x]
          assert len(lines)==1
          expected=re.findall('[0-9a-fA-F]{64}',lines[0])
          assert len(expected)==1
          with open('blender.tar.xz','rb') as f:
              assert hashlib.file_digest(f,'sha256').hexdigest()==expected[0].lower()
          PY
          tar -xJf blender.tar.xz
          printf '050c02562f81fe80ba616a80198fa02d381e60f8b61b8d39add881f4bca0d7d8  %s\n' "$RUNNER_TEMP/c4008-native/bin/blender-4.5.14-linux-x64/blender" | sha256sum -c
      - name: Read three original control rigs without executing untrusted Blender scripts
        if: steps.gate.outputs.ready == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/engine
        run: |
          set -euo pipefail
          umask 077
          binary="$RUNNER_TEMP/c4008-native/bin/blender-4.5.14-linux-x64/blender"
          mkdir -p "$RUNNER_TEMP/c4008-native/unwrapped"
          for name in rig-snake rig-spider rig-dragon; do
            raw="$GITHUB_WORKSPACE/upstream-rigs/rigs/$name.blend"
            dst="$RUNNER_TEMP/c4008-native/unwrapped/$name.blend"
            original_transport_sha="$(sha256sum "$raw" | cut -d' ' -f1)"
            header="$(head -c 4 "$raw" | od -An -tx1 | tr -d ' \n')"
            if test "$header" = "424c454e"; then
              transport_type="NATIVE_BLEND"
              cp "$raw" "$dst"
            elif test "$header" = "28b52ffd"; then
              transport_type="ZSTANDARD_WRAPPED_BLEND"
              (ulimit -f 262144; timeout 45s zstd -q -d -f "$raw" -o "$dst")
            else
              echo "SOURCE_UNSUPPORTED_TRANSPORT_MAGIC:$name:$header" >&2
              exit 10
            fi
            test -s "$dst"
            test "$(head -c 7 "$dst")" = BLENDER
            decoded_sha="$(sha256sum "$dst" | cut -d' ' -f1)"
            "$binary" --background --factory-startup --disable-autoexec --python-exit-code 1 \
              --python "$GITHUB_WORKSPACE/engine/tools/corpus/blender_corpus4008_native_blend_control_probe_v1.py" -- \
              --source "$dst" \
              --expected-sha256 "$decoded_sha" \
              --transported-source-sha256 "$original_transport_sha" \
              --transport-encoding "$transport_type" \
              --source-repo Mesh2Motion/mesh2motion-assets \
              --source-commit "$SOURCE_COMMIT" \
              --asset-key "$name" \
              --output "$RUNNER_TEMP/c4008-native/output/$name.native-control.json"
          done
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os,json
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"c4008-native/output"
          print("### Native CC0 rig source graph observations (not source control truths)")
          for f in sorted(p.glob("*.native-control.json")):
              d=json.loads(f.read_text())
              assert d["training_authorized"] is False
              assert d["source_file_script_execution_disabled"] is True
              assert d["source_native_ik_fk_functionality"] == "UNKNOWN"
              assert d["upstream_transport_encoding"] in ("NATIVE_BLEND","ZSTANDARD_WRAPPED_BLEND")
              assert len(d["upstream_transport_sha256"]) == 64
              c=d["profile"]
              print(d["source_asset_key"],
                    "bones",c["imported_pose_bone_count"],
                    "IK constraints",c["imported_ik_constraint_count"],
                    "drivers",c["imported_driver_count"],
                    "constraints",c["imported_constraint_count"])
          assert len(list(p.glob("*.native-control.json")))==3
          PY
      - name: Quarantine source-bound native control observations privately
        if: always() && steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/c4008-native/output"
          if test -s "$RCLONE_CONFIG" && test -d "$root"; then
            rclone copy "$root" "$PRIVATE_OUTPUT" --checksum --retries 3
            echo "Original native control graph observations stored in private Drive; no training." >> "$GITHUB_STEP_SUMMARY"
          fi
