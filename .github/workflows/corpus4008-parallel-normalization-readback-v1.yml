name: corpus4008-parallel-normalization-readback-v1

# 32 independently measured source-world bounds, eight groups of four
# SHA-bound reversible normalization plans: replay from immutable bytes,
# verify Master3993 identity/split and NEVER mint source-truth or teacher PASS.
on:
  push:
    branches: [corpus4008-32shard-parallel-evidence-readback-v1-20261107]
    paths:
      - '.github/workflows/corpus4008-parallel-normalization-readback-v1.yml'
      - 'tools/corpus/reconcile_corpus4008_parallel_normalization_v1.py'
      - 'tests/corpus/test_corpus4008_parallel_normalization_replay_v1.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus4008-parallel-norm-readback-${{ github.ref }}
  cancel-in-progress: false

jobs:
  local-exact-replay-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 32-source deterministic coordinate replay and source authority tests
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check pytest
          PYTHONPATH=. python -m pytest -q \
            tests/corpus/test_corpus4008_parallel_normalization_replay_v1.py
          python -m compileall -q \
            tools/corpus/reconcile_corpus4008_parallel_normalization_v1.py

  replay-all-original-normalization-receipts:
    needs: local-exact-replay-regressions
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RCLONE_CONFIG: /tmp/realsas-c4008-parnorm-readback-private.conf
      REMOTE: gdrive:RealSaS_MASTER_CORPUS_1024_V3
      PARENT: gdrive:RealSaS_MASTER_CORPUS_1024_V3/audits/parallel_source_normalization_v1/42395751241-1
      OUTPUT: gdrive:RealSaS_MASTER_CORPUS_1024_V3/audits/parallel_normalization_readback_v1/${{ github.run_id }}-${{ github.run_attempt }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Require existing private source proof
        env:
          DRIVE_CONFIG_B64: ${{ secrets.REALSAS_HOSTED_DRIVE_RCLONE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$DRIVE_CONFIG_B64"
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends rclone
          printf '%s' "$DRIVE_CONFIG_B64" | base64 -d > "$RCLONE_CONFIG"
      - name: Download eight private normalization evidence groups concurrently
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/c4008-norm-readback"
          mkdir -p "$root/groups" "$root/output"
          rclone copyto "$REMOTE/metadata/CANONICAL_VARIANT_SELECTION.json" "$root/selection.json" --retries 3
          printf 'af2436d2a25a6f715e2d81af14b731837c7b02b609f1a4fc206acb591beb61c9  %s\n' "$root/selection.json" | sha256sum -c
          export ROOT="$root" PARENT
          seq 0 7 | xargs -P 8 -I '{}' sh -c '
            set -eu
            mkdir -p "$ROOT/groups/group-{}"
            g="{}"
            rclone copyto "$PARENT/group-$g/STATUS.jsonl" "$ROOT/groups/group-$g/STATUS.jsonl" --retries 3
            base=$((g*4))
            for shard in $(seq "$base" "$((base+3))"); do
              for ext in SELECTION BOUNDS NORMALIZATION; do
                rclone copyto "$PARENT/group-$g/shard-$shard.$ext.json" "$ROOT/groups/group-$g/shard-$shard.$ext.json" --retries 3
              done
            done
          '
          python -m tools.corpus.reconcile_corpus4008_parallel_normalization_v1 \
            --root "$root/groups" --master "$root/selection.json" \
            --output "$root/output"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os,json
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"c4008-norm-readback/output/CORPUS4008_32SOURCE_NORMALIZATION_REPLAY_SUMMARY_V1.json"
          d=json.loads(p.read_text())
          assert d["normalized_unique_original_sources"]==32
          assert d["training_authorized"] is False
          assert d["materialization_authorized"] is False
          assert d["source_mesh_and_bone_roundtrip_courted"] is False
          print("## 32 verified reversible original-source normalization plans")
          print("Distinct original FIT assets:",d["normalized_unique_original_sources"])
          print("Source→IRIS→TESSA plan replay error max:",d["max_bbox_corner_relative_replay_error"])
          print("Only imported bbox transform authority; no mesh/skin/controller/semantic/graphics PASS.")
          PY
      - name: Store SHA-bound normalized source matrix privately
        if: always()
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/c4008-norm-readback/output"
          if test -s "$RCLONE_CONFIG" && test -f "$root/CORPUS4008_32SOURCE_NORMALIZATION_REPLAY_SUMMARY_V1.json"; then
            rclone copy "$root" "$OUTPUT" --checksum --retries 3
            echo "32-source normalization replay matrix persisted privately; no training authorization." >> "$GITHUB_STEP_SUMMARY"
          fi
