name: corpus4008-private-original-recovery-eight-shards-v1

# First 128-asset capped preflight from a planned 32-way source recovery.
# It does not authorize full-corpus bulk acquisition or training.
on:
  push:
    branches: [corpus4008-source-structure-and-camera-audit-v1-20261107]
    paths:
      - '.github/workflows/corpus4008-private-original-recovery-eight-shards-v1.yml'
      - 'tools/corpus/recover_corpus4008_github_source_shard_v1.py'
      - 'tests/corpus/test_corpus4008_github_source_shard_v1.py'

permissions:
  contents: read

concurrency:
  group: corpus4008-private-original-recovery-eight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bounded-original-source-batch:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      RCLONE_CONFIG: /tmp/realsas-c4008-shard-private.conf
      REMOTE: gdrive:RealSaS_MASTER_CORPUS_1024_V3
      PRIVATE_OUTPUT: gdrive:RealSaS_MASTER_CORPUS_1024_V3/audits/original_recovery_shards_v1/${{ github.run_id }}-${{ github.run_attempt }}/shard-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact shard ownership and SHA-pinned source gates
        run: |
          python -m pip install --disable-pip-version-check pytest requests==2.32.3
          PYTHONPATH=. python -m pytest -q tests/corpus/test_corpus4008_github_source_shard_v1.py tests/corpus/test_corpus4008_github_original_pilot_v1.py
      - name: Establish restricted private source transport
        id: gate
        env:
          DRIVE_AVAILABLE: ${{ secrets.REALSAS_HOSTED_DRIVE_RCLONE_CONFIG_B64 != '' }}
        run: |
          if test "$DRIVE_AVAILABLE" = true; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Private Drive unavailable, no source transfer' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Obtain SHA-pinned recovery plan, never public original source urls
        if: steps.gate.outputs.ready == 'true'
        env:
          PRIVATE_CREDENTIAL_B64: ${{ secrets.REALSAS_HOSTED_DRIVE_RCLONE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          umask 077
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends rclone
          printf '%s' "$PRIVATE_CREDENTIAL_B64" | base64 -d > "$RCLONE_CONFIG"
          mkdir -p "$RUNNER_TEMP/c4008-private-shard"
          rclone copyto "$REMOTE/audits/source_recovery_v1/42371850821-1/RECOVERY_PRIVATE.json" \
            "$RUNNER_TEMP/c4008-private-shard/PLAN.json" --retries 3
          test "$(sha256sum "$RUNNER_TEMP/c4008-private-shard/PLAN.json" | cut -d ' ' -f1)" = 3c1088fb26d2171ccde8b8dfaac3406a26ba12e16eb3b6506c11c8ccc775426f
      - name: Exactly one 32-way shard; cap at sixteen source bytes
        if: steps.gate.outputs.ready == 'true'
        env:
          INDEX: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          umask 077
          python -m tools.corpus.recover_corpus4008_github_source_shard_v1 \
            --plan "$RUNNER_TEMP/c4008-private-shard/PLAN.json" \
            --output "$RUNNER_TEMP/c4008-private-shard/verified" \
            --shard-count 32 \
            --shard-index "$INDEX" \
            --max-objects 16 --max-original-mib 64
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os,json
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/'c4008-private-shard/verified/SHARD_PUBLIC.json'
          d=json.loads(p.read_text())
          print('## Corpus4008 original-source SHA batch')
          print('Shard:',d['shard_index'],'/',d['shard_count'])
          print('Selected:',d['selected_count'],'deferred:',d['deferred_count'])
          print('Exact source-byte recovery:',d['exact_source_bytes_recovered'])
          print('Training authorized:',d['training_authorized'])
          for name,n in d['result_statuses'].items():
              print(name+':',n)
          PY
      - name: Private provenance and verified original quarantine publication
        if: always() && steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/c4008-private-shard/verified"
          if test -s "$RCLONE_CONFIG" && test -s "$root/SHARD_PRIVATE.json"; then
            rclone copyto "$root/SHARD_PRIVATE.json" "$PRIVATE_OUTPUT/SHARD_PRIVATE.json" --retries 3
            rclone copyto "$root/SHARD_PUBLIC.json" "$PRIVATE_OUTPUT/SHARD_PUBLIC.json" --retries 3
            rclone copy "$root/verified_quarantine_objects" "$PRIVATE_OUTPUT/verified_quarantine_objects" --checksum --retries 3
            echo 'Quarantined exact source bytes stored privately; no training or source-root mutation.'
          fi
