name: corpus4008-source-scene-preflight-v1

on:
  push:
    branches: [corpus4008-source-structure-and-camera-audit-v1-20261107]
    paths:
      - 'tools/corpus/probe_corpus4008_source_scene_v1.py'
      - 'tests/corpus/test_corpus4008_source_scene_probe_v1.py'
      - '.github/workflows/corpus4008-source-scene-preflight-v1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/corpus/probe_corpus4008_source_scene_v1.py'
      - 'tests/corpus/test_corpus4008_source_scene_probe_v1.py'
      - '.github/workflows/corpus4008-source-scene-preflight-v1.yml'

permissions:
  contents: read

concurrency:
  group: corpus4008-source-scene-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-source-scene-contracts:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify fail-closed source hierarchy and orientation admission
        run: |
          python -m pip install --disable-pip-version-check pytest
          PYTHONPATH=. python -m pytest -q tests/corpus/test_corpus4008_source_scene_probe_v1.py
