name: Corpus Visual Anomaly Triage V1

on:
  push:
    paths:
      - 'experiments/geppetto_arachne_v0_1_20260830/semantic_visual_anomaly_triage_v1.py'
      - 'experiments/geppetto_arachne_v0_1_20260830/test_semantic_visual_anomaly_triage_v1.py'
      - '.github/workflows/corpus_visual_anomaly_triage_v1.yml'
  workflow_dispatch:

jobs:
  triage-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/geppetto_arachne_v0_1_20260830
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.1.3 pillow scipy
      - run: python -m unittest -v test_semantic_visual_anomaly_triage_v1.py
