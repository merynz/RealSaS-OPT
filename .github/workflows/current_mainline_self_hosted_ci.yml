name: current-mainline-self-hosted-ci

on:
  push:
    branches:
      - main
      - restoration/compiler-runtime-promotion-v1-20260903
    paths:
      - 'models/**'
      - 'compiler/**'
      - 'runtime/reference_v4/**'
      - 'runtime/realsas_cpp/**'
      - 'tests/compiler/**'
      - 'tests/models/**'
      - 'tests/iris/test_iris_mainline_source_v1.py'
      - 'tests/repository/**'
      - 'canonical/**'
      - 'requirements/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - '.pre-commit-config.yaml'
      - '.python-version'
      - 'pyproject.toml'
      - '.github/CODEOWNERS'
      - '.github/dependabot.yml'
      - '.github/pull_request_template.md'
      - 'RESTORATION_STATE.md'
      - 'SYSTEM_INDEX.md'
      - 'AGENTS.md'
      - '.github/workflows/current_mainline_self_hosted_ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: current-mainline-self-hosted-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-current-mainline:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # This repository intentionally does not enable setup-python's remote pip-cache
      # save step on the single self-hosted runner. The runner already retains its
      # local pip cache, while the action's post-job cache upload serializes the
      # entire CI queue and has previously remained in the post step after every
      # substantive regression had passed.
      - name: Install pinned CPU regression dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
          PIP_DEFAULT_TIMEOUT: '60'
        run: |
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
          python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt
      - name: Compile current Python ownership roots
        run: python -m compileall -q models compiler runtime/reference_v4 tools tests
      - name: Repository governance and readiness
        run: |
          python -m pytest -q \
            tests/repository/test_repository_governance_v1.py \
            tests/repository/test_model_branding_boundary_v1.py \
            tests/repository/test_current_continuity_authority_v2.py \
            tests/repository/test_canonical_main_readiness_v1.py \
            tests/repository/test_mainline_execution_plan_v2.py \
            tests/repository/test_mainline_v2_dag_scheduler.py
      - name: Validate V2 DAG structure
        run: python -m compiler.realsas_compiler_services.orchestrator.mainline validate-plan
      - name: Build native V2 CAA reference player
        run: |
          mkdir -p "$HOME/realsas_authority/toolchain"
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic \
            runtime/realsas_cpp/src/runtime_v2_caa_reference.cpp \
            -o "$HOME/realsas_authority/toolchain/runtime_v2_caa_reference"
          sha256sum "$HOME/realsas_authority/toolchain/runtime_v2_caa_reference"
      - name: Learned source ownership
        run: |
          python -m pytest -q \
            tests/models \
            tests/iris/test_iris_mainline_source_v1.py
      - name: Compiler regressions
        run: python -m pytest -q tests/compiler
      - name: Fast gate summary
        run: |
          echo 'CURRENT_MAINLINE_FAST_GATE_PASS'
          echo "commit=$GITHUB_SHA"
          echo 'self_hosted_only=true'
          echo 'pinned_environment=true'
          echo 'repository_governance=true'
          echo 'v2_dag=true'
          echo 'native_caa_player_built=true'
          echo 'witness_execution=BLOCKED_UNTIL_V2_READINESS_SEAL'
