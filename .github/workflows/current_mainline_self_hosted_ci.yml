name: current-mainline-ci

on:
  push:
    branches:
      - main
      - restoration/compiler-runtime-promotion-v1-20260903
    paths:
      - 'models/**'
      - 'compiler/**'
      - 'runtime/reference_v4/**'
      - 'runtime/realsas_cpp/**'
      - 'tests/**'
      - 'canonical/**'
      - 'requirements/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - '.pre-commit-config.yaml'
      - '.python-version'
      - 'pyproject.toml'
      - '.github/CODEOWNERS'
      - '.github/dependabot.yml'
      - '.github/pull_request_template.md'
      - 'SYSTEM_INDEX.md'
      - 'AGENTS.md'
      - 'README.md'
      - 'tools/build_knowledge_artifact_catalog.py'
      - 'tools/render_authority_map.py'
      - 'tools/render_rehydration_packet.py'
      - 'tools/audit_context_coverage.py'
      - '.github/workflows/current_mainline_self_hosted_ci.yml'
      - '.github/workflows/live_authority_map.yml'
      - '.github/workflows/subject2_knight_observation_preflight.yml'
      - '.github/workflows/v2_witness_orchestration_subject_free_dry_run.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: current-mainline-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-current-mainline:
    # Standard hosted compute is intentionally enabled only while this repository
    # is public. If visibility is changed to private during a pause/trip, the job
    # is skipped rather than consuming private-repository Actions minutes.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      REALSAS_RUNTIME_V2_PLAYER: /tmp/realsas_runtime_v2_caa_reference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements/mainline-ci.txt
            requirements/torch-cpu.txt
      - name: Install pinned CPU regression dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
          PIP_DEFAULT_TIMEOUT: '60'
        run: |
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
          python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt
      - name: Ensure native CAA build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpng-dev zlib1g-dev blender python3-numpy
      - name: Synthetic Blender source scene and alpha engineering smoke
        env:
          PYTHONPATH: .:/usr/lib/python3/dist-packages
        run: blender --background --factory-startup --threads 2 --python-exit-code 1 --python tests/fixtures/source_scene_v2/blender_smoke.py
      - name: Compile current Python ownership roots
        run: python -m compileall -q models compiler runtime/reference_v4 tools tests
      - name: Repository governance and readiness
        run: |
          python -m pytest -q \
            tests/repository/test_repository_governance_v1.py \
            tests/repository/test_fit8_source_identity_v1.py \
            tests/repository/test_source_scene_contract_v2.py \
            tests/repository/test_model_branding_boundary_v1.py \
            tests/repository/test_current_continuity_authority_v2.py \
            tests/repository/test_canonical_main_readiness_v1.py \
            tests/repository/test_mainline_execution_plan_v2.py \
            tests/repository/test_mainline_v2_dag_scheduler.py \
            tests/repository/test_witness_orchestration_v2.py \
            tests/repository/test_v9_pretraining_artifact_operator_v1.py
      - name: Validate V2 DAG structure and implementation closure
        run: |
          python -m compiler.realsas_compiler_services.orchestrator.mainline validate-plan
          python -m compiler.realsas_compiler_services.orchestrator.mainline implementation-closure
      - name: Build native V2 CAA reference player
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic \
            runtime/realsas_cpp/src/runtime_v2_caa_reference.cpp \
            -lpng -lz \
            -o "$REALSAS_RUNTIME_V2_PLAYER"
          sha256sum "$REALSAS_RUNTIME_V2_PLAYER"
      - name: Learned source ownership
        run: |
          python -m pytest -q \
            tests/models \
            tests/iris/test_iris_mainline_source_v1.py \
            tests/iris/test_iris_v2_dense_source_coverage_v2.py \
            tests/iris/test_shared_cohort_v1.py \
            tests/iris/test_cohort_notebook_closure_v1.py
      - name: Compiler regressions
        env:
          REALSAS_RUN_CONTRACT_DIAGNOSTIC_DIR: ${{ runner.temp }}/realsas-contract-diags
        run: |
          rm -rf "$REALSAS_RUN_CONTRACT_DIAGNOSTIC_DIR"
          python -m pytest -q \
            tests/compiler \
            tests/artifact_registry \
            tests/ci/test_compiler_dependency_v1.py \
            tests/ci/test_build_contract_v1.py \
            tests/ci/test_artifact_registry_contract_v1.py \
            tests/ci/test_stage26_semantic_filter_v1.py \
            tests/ci/test_stage30_contract_v1.py \
            tests/ci/test_architecture_freeze_v1.py \
            tests/ci/test_workflow_safety_v1.py \
            tests/ci/test_surface_addressing_v1.py \
            tests/ci/test_surface_addressing_v2.py \
            tests/ci/test_preproduct_surface_address_authority_v1.py \
            tests/ci/test_complete_appearance_authority_v1.py \
            tests/ci/test_typed_rig_authority_v1.py \
            tests/ci/test_geppetto_v2_source_contract.py \
            tests/ci/test_skin_field_codec_v4_source_contract.py \
            tests/ci/test_arachne_codec_v2_source_contract.py \
            tests/ci/test_motion_deformation_v2_source_contract.py \
            tests/ci/test_runtime_contract_v1.py \
            tests/ci/test_runtime_model_v1.py \
            tests/ci/test_runtime_graphics_v1.py \
            tests/ci/test_runtime_caa_v2.py \
            tests/ci/test_build_contract_pipeline_v1.py \
            tests/ci/test_exact_region_domain_v1.py \
            tests/ci/test_ggts_entangled_v4.py \
            tests/ci/test_behavioral_motion_v1.py \
            tests/ci/test_reference_platform_v1.py \
            tests/ci/test_image_coverage_v1.py \
            tests/ci/test_current_runtime_native_v2.py \
            tests/ci/test_runtime_animation_v1.py \
            tests/ci/test_native_player_v2.py \
            tests/ci/test_runtime_stage37_semantics_v1.py \
            tests/ci/test_runtime_stage42_pose_v1.py \
            tests/ci/test_current_mainline_compiler_v2.py
      - name: Persist compiler regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-mainline-contract-diags
          path: ${{ runner.temp }}/realsas-contract-diags/*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Fast gate summary
        if: always()
        run: |
          echo "### Current Mainline Fast Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Canonical source: \`main\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Synthetic source-scene Blender smoke: required" >> "$GITHUB_STEP_SUMMARY"
          echo "- Compiler + runtime source checks: required" >> "$GITHUB_STEP_SUMMARY"
          echo "- Native CAA V2 reference player: required" >> "$GITHUB_STEP_SUMMARY"
