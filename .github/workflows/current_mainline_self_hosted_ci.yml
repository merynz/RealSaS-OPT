name: current-mainline-self-hosted-ci

on:
  push:
    branches:
      - main
      - restoration/compiler-runtime-promotion-v1-20260903
    paths:
      - 'models/**'
      - 'compiler/**'
      - 'runtime/reference_v4/**'
      - 'runtime/realsas_cpp/**'
      - 'tests/**'
      - 'canonical/**'
      - 'requirements/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - '.pre-commit-config.yaml'
      - '.python-version'
      - 'pyproject.toml'
      - '.github/CODEOWNERS'
      - '.github/dependabot.yml'
      - '.github/pull_request_template.md'
      - 'SYSTEM_INDEX.md'
      - 'AGENTS.md'
      - 'README.md'
      - 'tools/build_knowledge_artifact_catalog.py'
      - 'tools/render_authority_map.py'
      - 'tools/render_rehydration_packet.py'
      - 'tools/audit_context_coverage.py'
      - 'tools/platform_cache_gc.py'
      - 'tools/platform_ci_bootstrap.py'
      - 'tests/repository/test_platform_cache_gc.py'
      - 'tests/repository/test_platform_ci_bootstrap.py'
      - '.github/workflows/current_mainline_self_hosted_ci.yml'
      - '.github/workflows/live_authority_map.yml'
      - '.github/workflows/subject2_knight_observation_preflight.yml'
      - '.github/workflows/v2_witness_orchestration_subject_free_dry_run.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: current-mainline-self-hosted-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-current-mainline:
    # Public fork code must never execute on the persistent self-hosted workstation.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      REALSAS_RUNTIME_V2_PLAYER: /tmp/realsas_runtime_v2_caa_reference
      REALSAS_CI_CACHE_SOFT_GIB: '12'
      REALSAS_CI_CACHE_TARGET_GIB: '8'
      REALSAS_CI_CACHE_MIN_FREE_GIB: '5'
      REALSAS_CI_CACHE_MAX_AGE_DAYS: '30'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select persistent per-runner cache namespace
        run: |
          CACHE_ROOT="$HOME/.cache/realsas-ci/${RUNNER_NAME:-unnamed-runner}"
          echo "REALSAS_CI_CACHE_ROOT=$CACHE_ROOT" >> "$GITHUB_ENV"
          echo "PIP_CACHE_DIR=$CACHE_ROOT/pip" >> "$GITHUB_ENV"
      - name: Bounded local cache GC
        run: |
          python3 tools/platform_cache_gc.py \
            --root "$REALSAS_CI_CACHE_ROOT" \
            --soft-max-gib "$REALSAS_CI_CACHE_SOFT_GIB" \
            --target-max-gib "$REALSAS_CI_CACHE_TARGET_GIB" \
            --max-age-days "$REALSAS_CI_CACHE_MAX_AGE_DAYS" \
            --min-free-gib "$REALSAS_CI_CACHE_MIN_FREE_GIB" \
            --out "$RUNNER_TEMP/realsas-mainline-cache-gc.json"
      - name: Reuse exact pinned CPU regression environment
        run: |
          python3 tools/platform_ci_bootstrap.py \
            --cache-root "$REALSAS_CI_CACHE_ROOT" \
            --pip-cache "$PIP_CACHE_DIR" \
            --requirements-file requirements/mainline-ci.txt \
            --requirements-file requirements/torch-cpu.txt \
            --github-path "$GITHUB_PATH" \
            --out "$RUNNER_TEMP/realsas-mainline-bootstrap.json"
      - name: Compile current Python ownership roots
        run: python -m compileall -q models compiler runtime/reference_v4 tools tests
      - name: Repository governance and readiness
        run: |
          python -m pytest -q \
            tests/repository/test_repository_governance_v1.py \
            tests/repository/test_model_branding_boundary_v1.py \
            tests/repository/test_current_continuity_authority_v2.py \
            tests/repository/test_canonical_main_readiness_v1.py \
            tests/repository/test_mainline_execution_plan_v2.py \
            tests/repository/test_mainline_v2_dag_scheduler.py \
            tests/repository/test_witness_orchestration_v2.py
      - name: Validate V2 DAG structure and implementation closure
        run: |
          python -m compiler.realsas_compiler_services.orchestrator.mainline validate-plan
          python -m compiler.realsas_compiler_services.orchestrator.mainline implementation-closure
      - name: Build native V2 CAA reference player
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic \
            runtime/realsas_cpp/src/runtime_v2_caa_reference.cpp \
            -lpng -lz \
            -o "$REALSAS_RUNTIME_V2_PLAYER"
          sha256sum "$REALSAS_RUNTIME_V2_PLAYER"
      - name: Learned source ownership
        run: |
          python -m pytest -q \
            tests/models \
            tests/iris/test_iris_mainline_source_v1.py \
            tests/iris/test_iris_v2_dense_source_coverage_v2.py
      - name: Compiler regressions
        run: python -m pytest -q tests/compiler --junitxml=compiler-regressions-junit.xml
      - name: Dry-run next tool-cache GC decision
        if: always()
        run: |
          python3 tools/platform_cache_gc.py \
            --root "$REALSAS_CI_CACHE_ROOT" \
            --soft-max-gib "$REALSAS_CI_CACHE_SOFT_GIB" \
            --target-max-gib "$REALSAS_CI_CACHE_TARGET_GIB" \
            --max-age-days "$REALSAS_CI_CACHE_MAX_AGE_DAYS" \
            --min-free-gib "$REALSAS_CI_CACHE_MIN_FREE_GIB" \
            --dry-run \
            --out "$RUNNER_TEMP/realsas-mainline-cache-gc-dry-run.json"
      - name: Persist compiler and cache diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-mainline-diagnostics
          path: |
            compiler-regressions-junit.xml
            ${{ runner.temp }}/realsas-mainline-cache-gc.json
            ${{ runner.temp }}/realsas-mainline-cache-gc-dry-run.json
            ${{ runner.temp }}/realsas-mainline-bootstrap.json
          if-no-files-found: error
          retention-days: 7
      - name: Fast gate summary
        run: |
          echo 'CURRENT_MAINLINE_FAST_GATE_PASS'
          echo "commit=$GITHUB_SHA"
          echo 'self_hosted_only=true'
          echo 'fork_pr_execution=false'
          echo 'persistent_dependency_cache=true'
          echo 'bounded_cache_gc=true'
          echo 'pinned_environment=true'
          echo 'repository_governance=true'
          echo 'v2_dag=true'
          echo 'native_caa_player_built=true'
          echo 'witness_execution=BLOCKED_UNTIL_V2_READINESS_SEAL'
