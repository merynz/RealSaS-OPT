name: current-runtime-self-hosted-ci

on:
  push:
    branches:
      - main
      - restoration/compiler-runtime-promotion-v1-20260903
      - playback-stack-v1-20260916
    paths:
      - 'compiler/realsas_compiler_core/**'
      - 'compiler/realsas_compiler_services/export/**'
      - 'compiler/realsas_compiler_services/proof/**'
      - 'runtime/realsas_cpp/**'
      - 'runtime/reference_v4/**'
      - 'tests/runtime/**'
      - 'tests/compiler/test_current_v4_runtime_v2_projection_v1.py'
      - 'tests/compiler/test_current_v4_directional_runtime_v4.py'
      - 'tests/compiler/test_runtime_v4_cache_v1.py'
      - 'tests/compiler/test_directional_joint_view_binding_v1.py'
      - 'tests/compiler/test_motion_bake_firewall_v1.py'
      - 'tests/compiler/test_playback_runtime_v3_contract_v1.py'
      - 'tests/compiler/test_playback_full_surface_v3.py'
      - 'tests/compiler/test_motion_3d_v1.py'
      - 'tests/compiler/test_motion_3d_gates_v1.py'
      - 'tests/compiler/test_motion_3d_adapter_v1.py'
      - 'tests/compiler/test_playback_v3_d1_bridge.py'
      - 'tests/compiler/test_test_subject_001_materializer_v1.py'
      - 'tests/compiler/test_test_subject_001_r2_appearance_authority_v1.py'
      - 'tests/compiler/test_test_subject_001_d0_fix1_seal_v1.py'
      - 'experiments/single_family_e2e_v1/**'
      - 'experiments/playback_stack_v1/**'
      - 'canonical/MAIN_POST_MERGE_INTEGRITY_TRIGGER_ONCE_V1_20260904.json'
      - 'canonical/COMPILER_RUNTIME_PROMOTION_SOURCE_SEAL_V1_20260903.json'
      - 'canonical/COMPILER_RUNTIME_SOURCE_EXTENSION_SEAL_V1_20260917.json'
      - 'canonical/COMPILER_RUNTIME_SOURCE_EXTENSION_SEAL_V2_20260917.json'
      - 'canonical/COMPILER_RUNTIME_SOURCE_EXTENSION_SEAL_V3_20260918.json'
      - 'canonical/COMPILER_RUNTIME_SOURCE_EXTENSION_SEAL_V4_20260918.json'
      - 'tools/verify_native_runtime_source_seal_v2.py'
      - '.github/workflows/current_runtime_self_hosted_ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'compiler/**'
      - 'runtime/**'
      - 'tests/runtime/**'
      - 'tests/compiler/test_playback_runtime_v3_contract_v1.py'
      - 'tests/compiler/test_playback_full_surface_v3.py'
      - 'tests/compiler/test_motion_3d_v1.py'
      - 'tests/compiler/test_motion_3d_gates_v1.py'
      - 'tests/compiler/test_motion_3d_adapter_v1.py'
      - 'tests/compiler/test_playback_v3_d1_bridge.py'
      - 'tests/compiler/test_test_subject_001_materializer_v1.py'
      - 'tests/compiler/test_test_subject_001_r2_appearance_authority_v1.py'
      - 'tests/compiler/test_test_subject_001_d0_fix1_seal_v1.py'
      - 'experiments/single_family_e2e_v1/**'
      - 'experiments/playback_stack_v1/**'
  workflow_dispatch:

# This workflow runs on persistent self-hosted RealSaS runners. Multiple push runs
# must never mutate the same checkout/build tree concurrently; stale runs have no
# authority once a newer commit exists on the same ref.
concurrency:
  group: realsas-self-hosted-runtime-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proof-export-native:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU runtime-gate dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
          PIP_DEFAULT_TIMEOUT: '60'
        run: |
          python -m pip install --no-input --progress-bar off --only-binary=:all: numpy scipy pytest
      - name: Verify append-only native source seal chain
        run: PYTHONPATH=. python tools/verify_native_runtime_source_seal_v2.py

      - name: Directional binding / bake / projection regressions
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/compiler/test_directional_joint_view_binding_v1.py \
            tests/compiler/test_motion_bake_firewall_v1.py \
            tests/compiler/test_current_v4_runtime_v2_projection_v1.py \
            tests/compiler/test_current_v4_directional_runtime_v4.py \
            tests/compiler/test_mage_runtime_v4_exact_input_resolver_v1.py \
            tests/compiler/test_runtime_v4_cache_v1.py \
            tests/compiler/test_playback_runtime_v3_contract_v1.py \
            tests/compiler/test_playback_full_surface_v3.py \
            tests/compiler/test_motion_3d_v1.py \
            tests/compiler/test_motion_3d_gates_v1.py \
            tests/compiler/test_motion_3d_adapter_v1.py \
            tests/compiler/test_playback_v3_d1_bridge.py \
            tests/compiler/test_playback_appearance_authority_v2.py \
            tests/compiler/test_playback_runtime_v4_contract_v1.py \
            tests/compiler/test_playback_directional_body_v1.py \
            tests/compiler/test_directional_edge_flip_repair_v1.py \
            tests/compiler/test_test_subject_001_materializer_v1.py \
            tests/compiler/test_test_subject_001_r2_appearance_authority_v1.py \
            tests/compiler/test_test_subject_001_d0_fix1_seal_v1.py
      - name: Complete synthetic proof/export gate
        run: PYTHONPATH=. python -m pytest -q experiments/single_family_e2e_v1/test_complete_e2e_source_v1.py
      - name: Emit exact current package and probe identities
        run: |
          rm -rf .runtime-ci
          mkdir -p .runtime-ci
          PYTHONPATH=. python - <<'PY'
          from pathlib import Path
          from experiments.single_family_e2e_v1.run_complete_e2e_v1 import run_complete_e2e_v1
          out = run_complete_e2e_v1(Path('.runtime-ci/e2e'))
          native = out['native_runtime_result']
          Path('.runtime-ci/native_probe.env').write_text(
              f"ARCHIVE_PATH={Path(out['native_runtime_archive']).resolve()}\n"
              f"SOURCE_BINDING_SHA256={native['source_binding_sha256']}\n"
              f"PROOF_BUNDLE_SHA256={out['proof'].proof_bundle_hash}\n",
              encoding='utf-8',
          )
          print('product_state_hash=' + out['product'].product_state_hash)
          print('proof_bundle_hash=' + out['proof'].proof_bundle_hash)
          print('motion_bake_hash=' + out['motion_bake_hash'])
          print('projection_hash=' + out['native_projection'].projection_hash)
          print('archive_sha256=' + native['archive_sha256'])
          print('runtime_binary_sha256=' + native['runtime_binary_sha256'])
          PY
      - name: Verify native toolchain
        run: |
          cmake --version
          c++ --version
          dpkg -s libarchive-dev libpng-dev zlib1g-dev >/dev/null
      - name: Build sealed runtime + ABI smoke + playback-v3 conformance
        run: |
          cmake -S runtime/realsas_cpp -B .runtime-ci/native-build \
            -DREALSAS_BUILD_SHARED=ON \
            -DREALSAS_BUILD_EXAMPLES=OFF \
            -DREALSAS_BUILD_TESTS=ON
          cmake --build .runtime-ci/native-build --parallel
          ctest --test-dir .runtime-ci/native-build --output-on-failure
      - name: Dense Runtime-v4 P0/P1 representation measurement
        run: |
          PYTHONPATH=. python experiments/playback_stack_v1/benchmark_runtime_v4_p0_p1.py \
            | tee .runtime-ci/runtime-v4-p0-p1-benchmark.log

      - name: Build external package probe
        run: |
          c++ -std=c++17 \
            -Iruntime/realsas_cpp/include \
            tests/runtime/current_v4_native_package_probe.cpp \
            -L.runtime-ci/native-build \
            -Wl,-rpath,"$GITHUB_WORKSPACE/.runtime-ci/native-build" \
            -lrealsas_runtime \
            -o .runtime-ci/current_v4_native_package_probe
      - name: Exact package open/sample/render interlock
        run: |
          set -a
          source .runtime-ci/native_probe.env
          set +a
          .runtime-ci/current_v4_native_package_probe \
            "$ARCHIVE_PATH" \
            "$SOURCE_BINDING_SHA256" \
            "$PROOF_BUNDLE_SHA256"
      - name: Runtime gate summary
        run: |
          echo 'CURRENT_RUNTIME_NATIVE_INTERLOCK_PASS'
          echo 'PLAYBACK_V3_NATIVE_CONFORMANCE_PASS'
          echo 'RUNTIME_V4_P0_P1_MEASUREMENT_PASS'
          echo 'NATIVE_SOURCE_SEAL_CHAIN_PASS'
          echo "commit=$GITHUB_SHA"
