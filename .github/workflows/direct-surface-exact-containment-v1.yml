name: direct-surface-exact-containment-v1

on:
  pull_request:
    paths:
      - 'models/iris/vnext/sparse_surface_v4.py'
      - 'tools/iris_vnext/materialize_fit8_direct_surface_subject_v3.py'
      - 'tools/iris_vnext/materialize_fit8_direct_surface_resumable_v3.py'
      - 'canonical/VNEXT_DIRECT_SURFACE_INPUT_BINDING_V2.json'
      - 'tests/iris/test_vnext_direct_surface_exact_containment_v1.py'
      - '.github/workflows/direct-surface-exact-containment-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-containment-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependency
        run: python -m pip install --no-input --progress-bar off pytest==8.4.1
      - name: Validate JSON and compile correction source
        run: |
          python -m json.tool canonical/VNEXT_DIRECT_SURFACE_INPUT_BINDING_V2.json >/dev/null
          python -m py_compile \
            models/iris/vnext/sparse_surface_v4.py \
            tools/iris_vnext/materialize_fit8_direct_surface_subject_v3.py \
            tools/iris_vnext/materialize_fit8_direct_surface_resumable_v3.py \
            tests/iris/test_vnext_direct_surface_exact_containment_v1.py
      - name: Run exact-containment contract tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q -s tests/iris/test_vnext_direct_surface_exact_containment_v1.py
