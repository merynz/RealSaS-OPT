name: direct-surface-runtime-hardening-v2

on:
  pull_request:
    paths:
      - 'tools/iris_vnext/materialize_fit8_direct_surface_subject_v2.py'
      - 'tools/iris_vnext/materialize_fit8_direct_surface_resumable_v2.py'
      - 'tests/iris/test_direct_surface_runtime_hardening_v2.py'
      - '.github/workflows/direct-surface-runtime-hardening-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-surface-runtime-hardening:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependency
        run: python -m pip install --no-input --progress-bar off pytest==8.4.1
      - name: Compile runtime hardening source
        run: |
          python -m py_compile \
            tools/iris_vnext/materialize_fit8_direct_surface_subject_v2.py \
            tools/iris_vnext/materialize_fit8_direct_surface_resumable_v2.py \
            tests/iris/test_direct_surface_runtime_hardening_v2.py
      - name: Run runtime hardening contract tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q -s tests/iris/test_direct_surface_runtime_hardening_v2.py
