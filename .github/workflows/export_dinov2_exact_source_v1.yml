name: Export exact DINOv2 source V1
on:
  push:
    branches:
      - tooling/export-frozen-source-7f39
    paths:
      - '.github/workflows/export_dinov2_exact_source_v1.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Clone exact DINOv2 revision
        shell: bash
        run: |
          set -euo pipefail
          REV=7764ea0f912e53c92e82eb78a2a1631e92725fc8
          git clone --filter=blob:none https://github.com/facebookresearch/dinov2.git dinov2
          git -C dinov2 checkout --detach "$REV"
          test "$(git -C dinov2 rev-parse HEAD)" = "$REV"
          git -C dinov2 gc --prune=now
          tar -czf dinov2_7764ea0f912e_exact_git.tgz dinov2
          sha256sum dinov2_7764ea0f912e_exact_git.tgz > dinov2_7764ea0f912e_exact_git.tgz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: dinov2-exact-source-7764ea0f912e
          path: |
            dinov2_7764ea0f912e_exact_git.tgz
            dinov2_7764ea0f912e_exact_git.tgz.sha256
          if-no-files-found: error
