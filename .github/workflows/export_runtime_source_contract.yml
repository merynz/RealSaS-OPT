# IMPORTANT: RealSaS CI uses the canonical LOCAL/SELF-HOSTED runner.
# Do not switch this workflow back to GitHub-hosted `ubuntu-latest` unless the
# Actions billing/quota policy is intentionally changed. Expected labels:
# [self-hosted, linux, x64, realsas].

name: export-runtime-source-contract
on:
  pull_request:
    paths:
      - 'experiments/single_family_e2e_v1/export_bundle_v1.py'
      - 'experiments/single_family_e2e_v1/runtime_bridge_v1.py'
      - 'runtime/reference_v4/**'
      - 'experiments/single_family_e2e_v1/test_export_runtime_source_v1.py'
      - '.github/workflows/export_runtime_source_contract.yml'
  push:
    branches: [source/generic-completion-v1-20260902]
    paths:
      - 'experiments/single_family_e2e_v1/export_bundle_v1.py'
      - 'experiments/single_family_e2e_v1/runtime_bridge_v1.py'
      - 'runtime/reference_v4/**'
      - 'experiments/single_family_e2e_v1/test_export_runtime_source_v1.py'
      - '.github/workflows/export_runtime_source_contract.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  export-runtime-source-contract:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - run: python -m py_compile experiments/single_family_e2e_v1/export_bundle_v1.py experiments/single_family_e2e_v1/runtime_bridge_v1.py runtime/reference_v4/consumer.py
      - run: PYTHONPATH=. python -m pytest -q experiments/single_family_e2e_v1/test_export_runtime_source_v1.py
