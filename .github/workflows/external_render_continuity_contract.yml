# Product contract gate for independently qualified render support + continuity composition.
# Canonical RealSaS CI runs on the local/self-hosted runner.
# The temporary product-branch push trigger is deliberate: this bounded fulfillment
# line is rooted at the exact 2800a22 source snapshot and must be tested without
# rebasing onto unrelated current-main authority.

name: External Render Continuity Contract

on:
  pull_request:
    paths:
      - 'compiler/realsas_compiler_core/continuity_underlay.py'
      - 'compiler/realsas_compiler_core/proof_engine.py'
      - 'compiler/realsas_compiler_core/product_external_render.py'
      - 'compiler/realsas_compiler_core/render_support.py'
      - 'compiler/realsas_compiler_core/component_attachment.py'
      - 'compiler/realsas_compiler_core/semantic_joint_roles.py'
      - 'compiler/realsas_compiler_core/motion.py'
      - 'compiler/realsas_compiler_core/motion_rotation_only.py'
      - 'compiler/realsas_compiler_core/mesh/quality.py'
      - 'compiler/realsas_compiler_core/mesh/face_subset_repair.py'
      - 'compiler/realsas_compiler_services/proof/directional_motion_evaluator.py'
      - 'experiments/mage_demo_fit1_v5_p1/materialize_p1_b2_g10_current_authority_v1.py'
      - 'experiments/mage_demo_fit1_v5_p1/run_v5_direct_p1_current_authority_binding_v1.py'
      - 'experiments/mage_demo_fit1_v5_p1/build_source_component_owner_raster_v1.py'
      - 'tests/product/test_external_render_support_v1.py'
      - 'tests/product/test_component_attachment_v1.py'
      - 'tests/product/test_external_product_proof_and_continuity_v1.py'
      - 'tests/product/test_face_subset_repair_v1.py'
      - 'tests/product/test_semantic_joint_roles_v1.py'
      - 'tests/product/test_mage_topology_motion_deformation_v1.py'
      - 'tests/product/test_mage_rotation_only_qualified_motion_v1.py'
      - 'tests/product/test_external_directional_motion_rest_v1.py'
      - '.github/workflows/external_render_continuity_contract.yml'
  push:
    branches:
      - 'product/mage-fit1-demo-fulfillment-20260914'
    paths:
      - 'compiler/realsas_compiler_core/continuity_underlay.py'
      - 'compiler/realsas_compiler_core/proof_engine.py'
      - 'compiler/realsas_compiler_core/product_external_render.py'
      - 'compiler/realsas_compiler_core/render_support.py'
      - 'compiler/realsas_compiler_core/component_attachment.py'
      - 'compiler/realsas_compiler_core/semantic_joint_roles.py'
      - 'compiler/realsas_compiler_core/motion.py'
      - 'compiler/realsas_compiler_core/motion_rotation_only.py'
      - 'compiler/realsas_compiler_core/mesh/quality.py'
      - 'compiler/realsas_compiler_core/mesh/face_subset_repair.py'
      - 'compiler/realsas_compiler_services/proof/directional_motion_evaluator.py'
      - 'experiments/mage_demo_fit1_v5_p1/materialize_p1_b2_g10_current_authority_v1.py'
      - 'experiments/mage_demo_fit1_v5_p1/run_v5_direct_p1_current_authority_binding_v1.py'
      - 'experiments/mage_demo_fit1_v5_p1/build_source_component_owner_raster_v1.py'
      - 'tests/product/test_external_render_support_v1.py'
      - 'tests/product/test_component_attachment_v1.py'
      - 'tests/product/test_external_product_proof_and_continuity_v1.py'
      - 'tests/product/test_face_subset_repair_v1.py'
      - 'tests/product/test_semantic_joint_roles_v1.py'
      - 'tests/product/test_mage_topology_motion_deformation_v1.py'
      - 'tests/product/test_mage_rotation_only_qualified_motion_v1.py'
      - 'tests/product/test_external_directional_motion_rest_v1.py'
      - '.github/workflows/external_render_continuity_contract.yml'

permissions:
  contents: read

jobs:
  external-render-continuity:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check numpy pytest scikit-image pillow
      - name: Compile contract sources
        run: |
          python -m py_compile \
            compiler/realsas_compiler_core/continuity_underlay.py \
            compiler/realsas_compiler_core/proof_engine.py \
            compiler/realsas_compiler_core/product_external_render.py \
            compiler/realsas_compiler_core/render_support.py \
            compiler/realsas_compiler_core/component_attachment.py \
            compiler/realsas_compiler_core/semantic_joint_roles.py \
            compiler/realsas_compiler_core/motion.py \
            compiler/realsas_compiler_core/motion_rotation_only.py \
            compiler/realsas_compiler_core/mesh/quality.py \
            compiler/realsas_compiler_core/mesh/face_subset_repair.py \
            compiler/realsas_compiler_services/proof/directional_motion_evaluator.py \
            experiments/mage_demo_fit1_v5_p1/materialize_p1_b2_g10_current_authority_v1.py \
            experiments/mage_demo_fit1_v5_p1/run_v5_direct_p1_current_authority_binding_v1.py \
            experiments/mage_demo_fit1_v5_p1/build_source_component_owner_raster_v1.py
      - name: Run external render and continuity regressions
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q \
            tests/product/test_external_render_support_v1.py \
            tests/product/test_component_attachment_v1.py \
            tests/product/test_external_product_proof_and_continuity_v1.py \
            tests/product/test_face_subset_repair_v1.py \
            tests/product/test_semantic_joint_roles_v1.py \
            tests/product/test_mage_topology_motion_deformation_v1.py \
            tests/product/test_mage_rotation_only_qualified_motion_v1.py \
            tests/product/test_external_directional_motion_rest_v1.py
