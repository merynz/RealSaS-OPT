name: first-family-charactergen-geometry-v1

on:
  push:
    branches:
      - first-family-fit/v1-20260904
    paths:
      - '.github/workflows/first_family_charactergen_geometry_v1.yml'
      - 'experiments/geometry_backends/charactergen_geometry_backend_v1.py'
      - 'experiments/geometry_backends/render_source_cardinals_v1.py'
      - 'compiler/realsas_compiler_core/substrate/complete_mesh.py'
      - 'tests/geometry/test_charactergen_geometry_backend_source_v1.py'
      - 'tests/compiler/test_complete_mesh_substrate_v1.py'
  workflow_dispatch:

jobs:
  mage-charactergen-geometry:
    runs-on: [self-hosted, realsas, gpu]
    timeout-minutes: 180
    env:
      REALSAS_LOCAL_ML_VENV: /home/monster/realsas-ml312
      REALSAS_BLENDER_CACHE: /home/monster/.cache/realsas/blender
      REALSAS_SOURCE_CACHE: /home/monster/.cache/realsas/family_sources
      REALSAS_CHARACTERGEN_ROOT: /home/monster/.cache/realsas/external/CharacterGen
      REALSAS_CHARACTERGEN_VENV: /home/monster/realsas-charactergen39
      FIRST_FAMILY_SPEC: experiments/first_family_fit_v1/FIRST_FAMILY_FIT_SPEC_V1.json
      CHARACTERGEN_ENV_FINGERPRINT: realsas-charactergen39-isosurfaceonly-torch2.1.2-cu118-v2

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Activate Linux Python 3.12 toolchain for RealSaS
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Source-contract preflight
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts/first_family_charactergen_geometry
          test -x "$REALSAS_LOCAL_ML_VENV/bin/python"
          PYTHONPATH="$GITHUB_WORKSPACE" "$REALSAS_LOCAL_ML_VENV/bin/python" -m unittest \
            tests.compiler.test_complete_mesh_substrate_v1 \
            tests.geometry.test_charactergen_geometry_backend_source_v1

      - name: Record GPU and runtime
        shell: bash
        run: |
          set -euxo pipefail
          nvidia-smi | tee artifacts/first_family_charactergen_geometry/NVIDIA_SMI.txt
          git rev-parse HEAD | tee artifacts/first_family_charactergen_geometry/REALSAS_HEAD.txt

      - name: Materialize exact first-family source repository
        shell: bash
        run: |
          set -euxo pipefail
          source_result="$RUNNER_TEMP/FIRST_FAMILY_SOURCE_RESULT.json"
          "$REALSAS_LOCAL_ML_VENV/bin/python" \
            experiments/first_family_fit_v1/materialize_family_source_v1.py \
            --spec "$FIRST_FAMILY_SPEC" \
            --cache-root "$REALSAS_SOURCE_CACHE" \
            --result-json "$source_result"
          source_root="$("$REALSAS_LOCAL_ML_VENV/bin/python" -c 'import json,sys; print(json.load(open(sys.argv[1]))["source_root"])' "$source_result")"
          asset_id="$("$REALSAS_LOCAL_ML_VENV/bin/python" -c 'import json,os; print(json.load(open(os.environ["FIRST_FAMILY_SPEC"]))["asset_id"])')"
          source_glb="$source_root/addons/kaykit_character_pack_adventures/Characters/gltf/Mage.glb"
          test -s "$source_glb"
          echo "FIRST_FAMILY_SOURCE_ROOT=$source_root" >> "$GITHUB_ENV"
          echo "FIRST_FAMILY_SOURCE_GLB=$source_glb" >> "$GITHUB_ENV"
          echo "FIRST_FAMILY_ASSET_ID=$asset_id" >> "$GITHUB_ENV"
          cp "$source_result" artifacts/first_family_charactergen_geometry/FIRST_FAMILY_SOURCE_RESULT.json
          sha256sum "$source_glb" | tee artifacts/first_family_charactergen_geometry/MAGE_GLB_SHA256.txt

      - name: Provision checksum-verified Blender 5.2.0
        shell: bash
        run: |
          set -euxo pipefail
          "$REALSAS_LOCAL_ML_VENV/bin/python" experiments/first_family_fit_v1/bootstrap_blender_5_2_v1.py \
            --cache-root "$REALSAS_BLENDER_CACHE" \
            | tee artifacts/first_family_charactergen_geometry/BLENDER_BOOTSTRAP.log
          blender="$(tail -n 1 artifacts/first_family_charactergen_geometry/BLENDER_BOOTSTRAP.log)"
          test -x "$blender"
          echo "REALSAS_BLENDER=$blender" >> "$GITHUB_ENV"

      - name: Render native neutral cardinal RGB inputs
        shell: bash
        run: |
          set -euxo pipefail
          card="$GITHUB_WORKSPACE/artifacts/first_family_charactergen_geometry/cardinals"
          mkdir -p "$card"
          "$REALSAS_BLENDER" -b --factory-startup \
            --python experiments/geometry_backends/render_source_cardinals_v1.py \
            -- "$FIRST_FAMILY_SOURCE_GLB" "$card" 1024 \
            | tee artifacts/first_family_charactergen_geometry/CARDINAL_RENDER.log
          grep -q 'REALSAS_SOURCE_CARDINAL_RENDER=PASS' artifacts/first_family_charactergen_geometry/CARDINAL_RENDER.log
          for v in S N E W; do test -s "$card/$v.png"; done
          sha256sum "$card"/*.png | sort | tee artifacts/first_family_charactergen_geometry/CARDINAL_SHA256.txt

      - name: Activate Python 3.9 for CharacterGen
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Build isolated pinned CharacterGen isosurface environment
        shell: bash
        run: |
          set -euxo pipefail
          marker="$REALSAS_CHARACTERGEN_VENV/.realsas_env_fingerprint"
          if [ ! -x "$REALSAS_CHARACTERGEN_VENV/bin/python" ] || [ ! -f "$marker" ] || [ "$(cat "$marker")" != "$CHARACTERGEN_ENV_FINGERPRINT" ]; then
            rm -rf "$REALSAS_CHARACTERGEN_VENV"
            python -m venv "$REALSAS_CHARACTERGEN_VENV"
            "$REALSAS_CHARACTERGEN_VENV/bin/python" -m pip install --upgrade 'pip==24.3.1' 'setuptools==75.3.0' wheel
            "$REALSAS_CHARACTERGEN_VENV/bin/pip" install \
              'torch==2.1.2' 'torchvision==0.16.2' --index-url https://download.pytorch.org/whl/cu118
            "$REALSAS_CHARACTERGEN_VENV/bin/pip" install \
              'numpy==1.26.4' 'xformers==0.0.23.post1' \
              'huggingface_hub==0.25.2' 'transformers==4.35.2' 'accelerate==0.24.1' 'diffusers==0.24.0' \
              'pytorch_lightning==2.1.3' 'torchmetrics==1.2.1' \
              'jaxtyping==0.2.25' 'einops==0.7.0' 'omegaconf==2.3.0' \
              'wandb==0.16.1' 'lpips==0.1.4' 'imageio==2.33.1' \
              'opencv-python-headless==4.9.0.80' 'matplotlib==3.8.2' 'tqdm==4.66.1' 'Pillow==10.2.0'
            printf '%s' "$CHARACTERGEN_ENV_FINGERPRINT" > "$marker"
          fi
          "$REALSAS_CHARACTERGEN_VENV/bin/python" - <<'PY'
          import torch
          print('torch', torch.__version__, 'cuda', torch.version.cuda, 'available', torch.cuda.is_available())
          assert torch.cuda.is_available()
          import xformers, pytorch_lightning, transformers, diffusers, cv2, matplotlib
          print('charactergen_isosurface_runtime_imports=PASS')
          PY
          "$REALSAS_CHARACTERGEN_VENV/bin/pip" freeze | sort > artifacts/first_family_charactergen_geometry/CHARACTERGEN_ENV_FREEZE.txt

      - name: Run pinned CharacterGen isosurface baseline
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$(dirname "$REALSAS_CHARACTERGEN_ROOT")"
          out="$GITHUB_WORKSPACE/artifacts/first_family_charactergen_geometry/geometry"
          card="$GITHUB_WORKSPACE/artifacts/first_family_charactergen_geometry/cardinals"
          PYTHONPATH="$GITHUB_WORKSPACE" "$REALSAS_CHARACTERGEN_VENV/bin/python" \
            experiments/geometry_backends/charactergen_geometry_backend_v1.py \
            --realsas-root "$GITHUB_WORKSPACE" \
            --charactergen-root "$REALSAS_CHARACTERGEN_ROOT" \
            --view-dir "$card" \
            --output-dir "$out" \
            --source-asset-id "$FIRST_FAMILY_ASSET_ID" \
            --sample-count 2048 \
            --device cuda \
            --bootstrap \
            | tee artifacts/first_family_charactergen_geometry/CHARACTERGEN_STDOUT.log
          test -s "$out/rigging_surface.json"
          test -s "$out/CHARACTERGEN_GEOMETRY_REPORT_V1.json"
          test ! -e "$out/transient_charactergen_isosurface_debug.npz"
          cp experiments/EXPERIMENT_LEDGER.jsonl artifacts/first_family_charactergen_geometry/EXPERIMENT_LEDGER_AFTER_RUN.jsonl

      - name: Smoke Geppetto conditioning on predicted sufficient substrate
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" "$REALSAS_CHARACTERGEN_VENV/bin/python" - <<'PY' | tee artifacts/first_family_charactergen_geometry/GEPPETTO_CONDITIONING_SMOKE.json
          import json
          from pathlib import Path
          from compiler.realsas_compiler_core.types import RiggingSurfaceIR, SurfaceNode, SurfaceRelation
          from models.geppetto.v2.geppetto_conditioning_v2 import GeppettoConditioningAdapterV2
          d = json.loads(Path('artifacts/first_family_charactergen_geometry/geometry/rigging_surface.json').read_text())
          nodes = tuple(SurfaceNode(**n) for n in d['surface_nodes'])
          relations = tuple(SurfaceRelation(**r) for r in d.get('local_relations', []))
          s = RiggingSurfaceIR(surface_nodes=nodes, local_relations=relations,
              geometry_lineage_hash=d['geometry_lineage_hash'], builder_id=d.get('builder_id',''),
              schema_version=d.get('schema_version','RealSaS.RiggingSurfaceIR.v1'), metadata=d.get('metadata',{}))
          batch = GeppettoConditioningAdapterV2()((s,))
          print(json.dumps({'status':'PASS','surface_nodes':len(nodes),'feature_shape':list(batch.features.shape),
              'valid_rows':int(batch.valid_mask.sum()),'source_surface_hash':batch.source_surface_hashes[0],
              'conditioning_hash':batch.conditioning_hashes[0]}, sort_keys=True))
          PY

      - name: Upload CharacterGen geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-family-charactergen-geometry-v1
          path: artifacts/first_family_charactergen_geometry/
          if-no-files-found: warn
          retention-days: 30
