name: first-family-dino-bootstrap-v1

on:
  push:
    branches:
      - first-family-fit/v1-20260904
    paths:
      - '.github/workflows/first_family_dino_bootstrap_v1.yml'
      - 'tools/first_family_fit_v1/bootstrap_dinov2_s_v1.py'
  workflow_dispatch:

jobs:
  dino-authority:
    runs-on: [self-hosted, realsas, gpu]
    timeout-minutes: 45
    env:
      REALSAS_LOCAL_ML_VENV: /home/monster/realsas-ml312
      REALSAS_DINO_CACHE: /home/monster/.cache/realsas/dinov2-s-v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Activate Linux Python 3.12 toolchain
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require persistent ML environment
        shell: bash
        run: |
          set -euxo pipefail
          test -x "$REALSAS_LOCAL_ML_VENV/bin/python"
          "$REALSAS_LOCAL_ML_VENV/bin/python" -c "import torch; assert torch.cuda.is_available(); print(torch.__version__)"

      - name: Bootstrap exact DINOv2-S authority
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts/first_family_dino
          "$REALSAS_LOCAL_ML_VENV/bin/python" tools/first_family_fit_v1/bootstrap_dinov2_s_v1.py \
            --cache-root "$REALSAS_DINO_CACHE" \
            | tee artifacts/first_family_dino/DINO_BOOTSTRAP.txt
          grep -q 'status=PASS' artifacts/first_family_dino/DINO_BOOTSTRAP.txt

      - name: Exact DINO source-weight load and CUDA smoke
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" "$REALSAS_LOCAL_ML_VENV/bin/python" - <<'PY' | tee artifacts/first_family_dino/DINO_CUDA_SMOKE.txt
          from pathlib import Path
          import torch
          from models.iris.v2.dinov2_foundation_v2 import load_exact_dinov2_s_v2
          root=Path('/home/monster/.cache/realsas/dinov2-s-v1')
          model,seal=load_exact_dinov2_s_v2(root/'dinov2',root/'dinov2_vits14_pretrain.pth',device='cuda')
          assert seal.source_head=='7764ea0f912e53c92e82eb78a2a1631e92725fc8'
          assert seal.weight_sha256=='b938bf1bc15cd2ec0feacfe3a1bb553fe8ea9ca46a7e1d8d00217f29aef60cd9'
          print('device=',next(model.parameters()).device)
          print('source_head=',seal.source_head)
          print('weight_sha256=',seal.weight_sha256)
          print('PASS_EXACT_DINO_CUDA_LOAD')
          PY
          grep -q PASS_EXACT_DINO_CUDA_LOAD artifacts/first_family_dino/DINO_CUDA_SMOKE.txt

      - name: Upload DINO authority evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-family-dino-authority-v1
          path: artifacts/first_family_dino/
          if-no-files-found: warn
          retention-days: 30
