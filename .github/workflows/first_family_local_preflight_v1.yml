name: first-family-local-preflight-v1

on:
  push:
    branches:
      - first-family-fit/v1-20260904
    paths:
      - 'experiments/first_family_fit_v1/**'
      - '.github/workflows/first_family_local_preflight_v1.yml'
      - 'models/**'
      - 'compiler/**'
      - 'runtime/**'
  workflow_dispatch:

jobs:
  mage-local-preflight:
    runs-on: [self-hosted, realsas, gpu]
    timeout-minutes: 60
    env:
      KAYKIT_COMMIT: 672074b73ba276876a19e8816ecdc5241817ab47
      KAYKIT_REPO: https://github.com/KayKit-Game-Assets/KayKit-Character-Pack-Adventures-1.0.git
      MAGE_FBX_REL: addons/kaykit_character_pack_adventures/Characters/fbx/Mage.fbx
      MAGE_TEXTURE_REL: addons/kaykit_character_pack_adventures/Characters/fbx/mage_texture.png
      REALSAS_LOCAL_ML_VENV: /home/monster/realsas-ml312
      REALSAS_PIP_TMP: /home/monster/.cache/realsas/pip-tmp
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Environment summary
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts/first_family_preflight "$REALSAS_PIP_TMP"
          {
            echo "runner=${RUNNER_NAME:-unknown}"
            uname -a
            echo '=== capacity ==='
            df -h / /home /tmp "$HOME/.cache" "$GITHUB_WORKSPACE" || true
            df -i / /home /tmp "$HOME/.cache" "$GITHUB_WORKSPACE" || true
            nvidia-smi || true
            echo '=== persistent ML venv ==='
            ls -la "$REALSAS_LOCAL_ML_VENV/bin/python" 2>/dev/null || true
            echo '=== blender candidates ==='
            command -v blender || true
            find '/mnt/c/Program Files/Blender Foundation' -maxdepth 3 -iname 'blender.exe' -print 2>/dev/null || true
          } | tee artifacts/first_family_preflight/environment_summary.log

      - name: Set up Linux Python 3.12 bootstrap
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Provision persistent Linux ML environment if needed
        shell: bash
        run: |
          set -euxo pipefail
          export TMPDIR="$REALSAS_PIP_TMP"
          mkdir -p "$TMPDIR"
          if [ ! -x "$REALSAS_LOCAL_ML_VENV/bin/python" ]; then
            python -m venv "$REALSAS_LOCAL_ML_VENV"
          fi
          if ! "$REALSAS_LOCAL_ML_VENV/bin/python" -c 'import torch,numpy,scipy,PIL; assert torch.cuda.is_available()' >/dev/null 2>&1; then
            "$REALSAS_LOCAL_ML_VENV/bin/python" -m pip install --upgrade 'pip<26'
            "$REALSAS_LOCAL_ML_VENV/bin/python" -m pip install --no-cache-dir \
              torch==2.7.0 torchvision==0.22.0 \
              --index-url https://download.pytorch.org/whl/cu118
            "$REALSAS_LOCAL_ML_VENV/bin/python" -m pip install --no-cache-dir \
              'numpy<3' 'scipy<2' 'pillow<13' 'pytest<9'
          fi
          "$REALSAS_LOCAL_ML_VENV/bin/python" -m pip freeze | sort | tee artifacts/first_family_preflight/PYTHON_ENV_FREEZE.txt
          df -h "$TMPDIR" "$REALSAS_LOCAL_ML_VENV" | tee artifacts/first_family_preflight/ML_ENV_DISK_AFTER.txt

      - name: Require persistent Linux ML environment
        shell: bash
        run: |
          set -euxo pipefail
          test -x "$REALSAS_LOCAL_ML_VENV/bin/python"
          "$REALSAS_LOCAL_ML_VENV/bin/python" -c "import torch,numpy,scipy,PIL; print(torch.__version__)" | tee artifacts/first_family_preflight/ML_ENV_READY.txt

      - name: CUDA PyTorch smoke
        shell: bash
        run: |
          set -euxo pipefail
          "$REALSAS_LOCAL_ML_VENV/bin/python" -c "import json,torch; assert torch.cuda.is_available(), 'CUDA_NOT_AVAILABLE'; p=torch.cuda.get_device_properties(0); x=torch.arange(1024,device='cuda',dtype=torch.float32); y=(x*x).sum(); torch.cuda.synchronize(); print(json.dumps({'torch':torch.__version__,'cuda_runtime':torch.version.cuda,'device':p.name,'total_memory':p.total_memory,'smoke_sum':float(y.cpu())},indent=2))" | tee artifacts/first_family_preflight/TORCH_CUDA_SMOKE.json

      - name: Acquire exact public KayKit Mage source
        shell: bash
        run: |
          set -euxo pipefail
          cache="$HOME/.cache/realsas/kaykit-adventures-$KAYKIT_COMMIT"
          if [ ! -d "$cache/.git" ]; then
            rm -rf "$cache"
            git clone --filter=blob:none --no-checkout "$KAYKIT_REPO" "$cache"
          fi
          git -C "$cache" fetch --depth=1 origin "$KAYKIT_COMMIT"
          git -C "$cache" checkout --detach "$KAYKIT_COMMIT"
          fbx="$cache/$MAGE_FBX_REL"
          tex="$cache/$MAGE_TEXTURE_REL"
          test -f "$fbx"
          test -f "$tex"
          fbx_sha="$(sha256sum "$fbx" | awk '{print $1}')"
          tex_sha="$(sha256sum "$tex" | awk '{print $1}')"
          test "$fbx_sha" = "93b401d56e2547316f8841a4ac0086011c64d79185c9cb7623567c2dbf125c7d"
          {
            echo "kaykit_commit=$KAYKIT_COMMIT"
            echo "fbx=$fbx"
            stat -c 'fbx_bytes=%s' "$fbx"
            echo "fbx_sha256=$fbx_sha"
            echo "texture=$tex"
            stat -c 'texture_bytes=%s' "$tex"
            echo "texture_sha256=$tex_sha"
          } | tee artifacts/first_family_preflight/MAGE_PUBLIC_SOURCE_AUTHORITY.txt
          echo "REALSAS_MAGE_PUBLIC_ROOT=$cache" >> "$GITHUB_ENV"

      - name: Current learned and compiler import smoke
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" "$REALSAS_LOCAL_ML_VENV/bin/python" -c "from models.iris.v2.q_domain_v2 import build_production_observation_ray_lattice_v2; from models.iris.v2.observation_contract_v2 import ObservationContractV2; from compiler.realsas_compiler_core.substrate.iris_v2 import compile_surface_v2,attach_dtb_nd1_from_evidence; from models.geppetto.v2.geppetto_candidate_v2 import GeppettoCandidateV2; from compiler.realsas_compiler_core.rig import qualify_skeleton_v2; from models.skin_field_codec.v1.skin_field_codec_v1 import SkinFieldCodecV1; from models.arachne.v2.arachne_candidate_v2 import ArachneCandidateV2; from compiler.realsas_compiler_core.skin import qualify_skin; from compiler.realsas_compiler_core.mwb2 import build_mwb2_candidate,qualify_mwb2_mesh; from compiler.realsas_compiler_core.mwb2_skin import bind_mwb2_mesh_skin; print('PASS_CURRENT_LEARNED_COMPILER_IMPORT_SMOKE')" | tee artifacts/first_family_preflight/current_import_smoke.log

      - name: Existing Master locality diagnostic
        id: master_probe
        shell: bash
        run: |
          set +e
          PYTHONPATH="$GITHUB_WORKSPACE" "$REALSAS_LOCAL_ML_VENV/bin/python" experiments/first_family_fit_v1/local_preflight_v1.py \
            --out artifacts/first_family_preflight/FIRST_FAMILY_LOCAL_PREFLIGHT_V1.json \
            | tee artifacts/first_family_preflight/master_probe_stdout.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-family-local-preflight-v1
          path: artifacts/first_family_preflight/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce local execution readiness
        shell: bash
        run: |
          set -euxo pipefail
          test -s artifacts/first_family_preflight/ML_ENV_READY.txt
          test -s artifacts/first_family_preflight/TORCH_CUDA_SMOKE.json
          test -s artifacts/first_family_preflight/MAGE_PUBLIC_SOURCE_AUTHORITY.txt
          grep -q PASS_CURRENT_LEARNED_COMPILER_IMPORT_SMOKE artifacts/first_family_preflight/current_import_smoke.log
