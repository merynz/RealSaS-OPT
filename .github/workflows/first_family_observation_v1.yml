name: first-family-observation-v1

on:
  push:
    branches:
      - first-family-fit/v1-20260904
    paths:
      - '.github/workflows/first_family_observation_v1.yml'
      - 'experiments/first_family_fit_v1/run_first_family_observation_v1.py'
      - 'experiments/first_family_fit_v1/materialize_family_source_v1.py'
      - 'experiments/first_family_fit_v1/bootstrap_blender_5_2_v1.py'
      - 'experiments/first_family_fit_v1/FIRST_FAMILY_FIT_SPEC_V1.json'
      - 'experiments/first_family_fit_v1/FIRST_FAMILY_AUTHORITY_V1.json'
      - 'experiments/fit_observation_v1/blender_extract_source_appearance_v1.py'
      - 'experiments/fit_observation_v1/master_aligned_source_appearance_v1.py'
  workflow_dispatch:

jobs:
  first-family-observation:
    runs-on: [self-hosted, realsas, gpu]
    timeout-minutes: 90
    env:
      REALSAS_LOCAL_ML_VENV: /home/monster/realsas-ml312
      REALSAS_BLENDER_CACHE: /home/monster/.cache/realsas/blender
      REALSAS_SOURCE_CACHE: /home/monster/.cache/realsas/family_sources
      FIRST_FAMILY_SPEC: experiments/first_family_fit_v1/FIRST_FAMILY_FIT_SPEC_V1.json
      FIRST_FAMILY_AUTHORITY_MANIFEST: experiments/first_family_fit_v1/FIRST_FAMILY_AUTHORITY_V1.json

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Activate Linux Python 3.12 toolchain
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require persistent ML environment
        shell: bash
        run: |
          set -euxo pipefail
          test -x "$REALSAS_LOCAL_ML_VENV/bin/python"
          "$REALSAS_LOCAL_ML_VENV/bin/python" -c "import torch,numpy,PIL; assert torch.cuda.is_available(); print(torch.__version__)"

      - name: Resolve authority source without family-specific code
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          asset_id="$("$REALSAS_LOCAL_ML_VENV/bin/python" -c 'import json,os; print(json.load(open(os.environ["FIRST_FAMILY_SPEC"]))["asset_id"])')"
          pg_sha="$("$REALSAS_LOCAL_ML_VENV/bin/python" -c 'import json,os; print(json.load(open(os.environ["FIRST_FAMILY_SPEC"]))["authority"]["primary_geometry_sha256"])')"
          zip_name="$("$REALSAS_LOCAL_ML_VENV/bin/python" -c 'import json,os; print(json.load(open(os.environ["FIRST_FAMILY_SPEC"]))["authority"]["fallback_zip_name"])')"
          zip_sha="$("$REALSAS_LOCAL_ML_VENV/bin/python" -c 'import json,os; print(json.load(open(os.environ["FIRST_FAMILY_SPEC"]))["authority"]["fallback_zip_sha256"])')"

          master=''
          roots=()
          [ -n "${REALSAS_MASTER_ROOT:-}" ] && roots+=("$REALSAS_MASTER_ROOT")
          roots+=(
            /mnt/g/My\ Drive/RealSaS_MASTER_CORPUS_1024_V3
            /mnt/g/RealSaS_MASTER_CORPUS_1024_V3
            /mnt/g/Google\ Drive/My\ Drive/RealSaS_MASTER_CORPUS_1024_V3
            /mnt/c/Users/*/My\ Drive/RealSaS_MASTER_CORPUS_1024_V3
            /mnt/c/Users/*/Google\ Drive/My\ Drive/RealSaS_MASTER_CORPUS_1024_V3
            /mnt/c/Users/*/Google\ Drive/RealSaS_MASTER_CORPUS_1024_V3
            /mnt/c/Users/*/Drive/My\ Drive/RealSaS_MASTER_CORPUS_1024_V3
            /mnt/d/RealSaS_MASTER_CORPUS_1024_V3
            /mnt/e/RealSaS_MASTER_CORPUS_1024_V3
          )
          for root in "${roots[@]}"; do
            [ -d "$root" ] || continue
            pg="$root/master/assets/$asset_id/primary_geometry.npz"
            [ -f "$pg" ] || continue
            got="$(sha256sum "$pg" | awk '{print $1}')"
            if [ "$got" = "$pg_sha" ]; then master="$root"; break; fi
          done
          if [ -n "$master" ]; then
            echo "REALSAS_MASTER_ROOT=$master" >> "$GITHUB_ENV"
            echo "REALSAS_AUTHORITY_MODE=DIRECT_MASTER_CORPUS" >> "$GITHUB_ENV"
            echo "authority_mode=DIRECT_MASTER_CORPUS"
            exit 0
          fi

          packs=(/mnt/c/Users/*/Downloads/"$zip_name")
          if [ "${#packs[@]}" -gt 0 ]; then
            pack="${packs[0]}"
            got="$(sha256sum "$pack" | awk '{print $1}')"
            test "$got" = "$zip_sha"
            echo "FIRST_FAMILY_AUTHORITY_ZIP=$pack" >> "$GITHUB_ENV"
            echo "REALSAS_AUTHORITY_MODE=PREPACKAGED_ZIP_FALLBACK" >> "$GITHUB_ENV"
            echo "authority_mode=PREPACKAGED_ZIP_FALLBACK"
            exit 0
          fi
          echo 'NO_LOCAL_MASTER_MOUNT_AND_NO_VALIDATED_FALLBACK_PACK' >&2
          exit 17

      - name: Materialize exact source from spec
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts/first_family_observation
          source_result="$RUNNER_TEMP/FIRST_FAMILY_SOURCE_RESULT.json"
          "$REALSAS_LOCAL_ML_VENV/bin/python" \
            experiments/first_family_fit_v1/materialize_family_source_v1.py \
            --spec "$FIRST_FAMILY_SPEC" \
            --cache-root "$REALSAS_SOURCE_CACHE" \
            --result-json "$source_result"
          source_file="$("$REALSAS_LOCAL_ML_VENV/bin/python" -c 'import json,sys; print(json.load(open(sys.argv[1]))["source_file"])' "$source_result")"
          source_root="$("$REALSAS_LOCAL_ML_VENV/bin/python" -c 'import json,sys; print(json.load(open(sys.argv[1]))["source_root"])' "$source_result")"
          echo "FIRST_FAMILY_SOURCE_FILE=$source_file" >> "$GITHUB_ENV"
          echo "FIRST_FAMILY_SOURCE_ROOT=$source_root" >> "$GITHUB_ENV"
          cp "$source_result" artifacts/first_family_observation/FIRST_FAMILY_SOURCE_RESULT.json

      - name: Provision checksum-verified Blender 5.2.0
        shell: bash
        run: |
          set -euxo pipefail
          "$REALSAS_LOCAL_ML_VENV/bin/python" experiments/first_family_fit_v1/bootstrap_blender_5_2_v1.py \
            --cache-root "$REALSAS_BLENDER_CACHE" \
            | tee artifacts/first_family_observation/BLENDER_BOOTSTRAP.log
          blender="$(tail -n 1 artifacts/first_family_observation/BLENDER_BOOTSTRAP.log)"
          test -x "$blender"
          "$blender" --version | head -n 2 | tee artifacts/first_family_observation/BLENDER_VERSION.txt
          echo "REALSAS_BLENDER=$blender" >> "$GITHUB_ENV"

      - name: Build exact Master-aligned source-textured observations
        shell: bash
        run: |
          set -euxo pipefail
          work="$HOME/.cache/realsas/first_family_observation_work"
          out="$GITHUB_WORKSPACE/artifacts/first_family_observation/observation"
          authority_args=()
          if [ "$REALSAS_AUTHORITY_MODE" = 'DIRECT_MASTER_CORPUS' ]; then
            authority_args=(--master-root "$REALSAS_MASTER_ROOT")
          else
            authority_args=(--authority-zip "$FIRST_FAMILY_AUTHORITY_ZIP")
          fi
          PYTHONPATH="$GITHUB_WORKSPACE" "$REALSAS_LOCAL_ML_VENV/bin/python" \
            experiments/first_family_fit_v1/run_first_family_observation_v1.py \
            --spec "$FIRST_FAMILY_SPEC" \
            "${authority_args[@]}" \
            --authority-manifest "$FIRST_FAMILY_AUTHORITY_MANIFEST" \
            --source-file "$FIRST_FAMILY_SOURCE_FILE" \
            --source-package "$FIRST_FAMILY_SOURCE_ROOT" \
            --blender "$REALSAS_BLENDER" \
            --repo-root "$GITHUB_WORKSPACE" \
            --work-root "$work" \
            --out-root "$out" \
            | tee artifacts/first_family_observation/FIRST_FAMILY_OBSERVATION_STDOUT.log
          test -s "$out/FIRST_FAMILY_OBSERVATION_RESULT_V1.json"
          grep -q '"status": "PASS"' "$out/FIRST_FAMILY_OBSERVATION_RESULT_V1.json"

      - name: Upload first-family observation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-family-observation-v1
          path: artifacts/first_family_observation/
          if-no-files-found: error
          retention-days: 30
