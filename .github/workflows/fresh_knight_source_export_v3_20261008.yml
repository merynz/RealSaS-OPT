name: fresh-knight-source-export-v3-20261008

on:
  push:
    branches:
      - validation/fresh-knight-source-export-v3-20261008

permissions:
  contents: read

jobs:
  export:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    env:
      CANONICAL_SHA: 949422678d34cf69008cffd6b4d7647c8c066b8a
      AUTHORITY_ROOT: /home/monster/realsas_authority
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANONICAL_SHA }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact canonical code and deps
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANONICAL_SHA"
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Resolve sealed source lineage and export render inputs
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          from __future__ import annotations
          import json, shutil
          from pathlib import Path
          import numpy as np
          from compiler.realsas_compiler_core.appearance_authority_v2 import complete_appearance_asset_from_dict
          from compiler.realsas_compiler_core.appearance_render_v2 import load_face_page_index, load_face_uv
          from compiler.realsas_compiler_core.artifact_codec_v2 import canonical_mesh_candidate_from_dict, qualified_camera_set_from_dict
          from compiler.realsas_compiler_services.orchestrator.adapters.adapter_io import resolved_path, sha256_file
          from compiler.realsas_compiler_services.orchestrator.adapters.appearance_v2 import _load_texture_pages

          ROOT=Path('/home/monster/realsas_authority')
          out=Path('/tmp/fresh_knight_source_bundle_v3')
          if out.exists(): shutil.rmtree(out)
          out.mkdir(parents=True)

          candidate_runs=[
              'SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929',
              'SUBJECT2_KNIGHT_CORRECTED_MECHANICAL_CAA_AB_V1_20260929',
              'SUBJECT2_KNIGHT_CORRECTED_MECHANICAL_CAA_HARMONIC_FIRST_STAGE24_RECOVERED_V1_643714DE',
              'SUBJECT2_KNIGHT_CORRECTED_MECHANICAL_CAA_HARMONIC_FIRST_IMMUTABLE_RECOVERED_V1_643714DE',
              'SUBJECT2_KNIGHT_CORRECTED_MECHANICAL_CAA_HARMONIC_FIRST_IMMUTABLE_V1_70CBD671',
          ]
          appearance_runs=[
              'SUBJECT2_KNIGHT_CORRECTED_MECHANICAL_CAA_HARMONIC_FIRST_STAGE24_RECOVERED_V1_643714DE',
              'SUBJECT2_KNIGHT_CORRECTED_MECHANICAL_CAA_HARMONIC_FIRST_IMMUTABLE_RECOVERED_V1_643714DE',
              'SUBJECT2_KNIGHT_CORRECTED_MECHANICAL_CAA_HARMONIC_FIRST_STAGE24_V1_70CBD671',
              'SUBJECT2_KNIGHT_CORRECTED_MECHANICAL_CAA_HARMONIC_FIRST_IMMUTABLE_V1_70CBD671',
              'SUBJECT2_KNIGHT_CORRECTED_MECHANICAL_CAA_AB_V1_20260929',
          ]

          def ledger(run_id):
              p=ROOT/'runs'/run_id/'ACTIVE_RUN_V2.json'
              if not p.is_file(): return None
              return json.loads(p.read_text())

          def schema_rows(run_id, stage_id):
              led=ledger(run_id)
              if led is None: return []
              row=next((r for r in led.get('stages',[]) if r.get('id')==stage_id),None)
              if row is None: return []
              print('ROW',json.dumps({'run':run_id,'stage':stage_id,'status':row.get('status'),'schemas':[x.get('schema') for x in row.get('outputs',[])]},sort_keys=True),flush=True)
              return list(row.get('outputs',[]))

          def resolve_one(run_ids, stage_id, schema):
              for run_id in run_ids:
                  for ref in schema_rows(run_id,stage_id):
                      if ref.get('schema')!=schema: continue
                      path=resolved_path(ref['path'])
                      if not path.is_file():
                          print('REF_MISSING',run_id,stage_id,path,flush=True); continue
                      actual=sha256_file(path)
                      if actual!=ref.get('sha256'):
                          raise RuntimeError(f'REF_SHA_DRIFT:{run_id}:{stage_id}:{actual}!={ref.get("sha256")}')
                      payload=json.loads(path.read_text(encoding='utf-8'))
                      actual_schema=str(payload.get('schema') or payload.get('schema_version') or '')
                      if actual_schema!=schema:
                          raise RuntimeError(f'REF_SCHEMA_DRIFT:{run_id}:{stage_id}:{actual_schema}!={schema}')
                      return run_id,payload,{'path':str(path),'sha256':actual}
              raise RuntimeError(f'NO_SEALED_OUTPUT:{stage_id}:{schema}')

          cand_run,cand_payload,cand_ref=resolve_one(candidate_runs,'18_CANONICAL_MESH_ADDRESSING_BUILD','RealSaS.CanonicalMeshCandidateIR.v1')
          app_run,app_payload,app_ref=resolve_one(appearance_runs,'23_COMPLETE_APPEARANCE_ASSET_BAKED','RealSaS.CompleteAppearanceAssetIR.v2')
          cam_run,cam_payload,cam_ref=resolve_one(candidate_runs,'05_CAMERA_CONTRACT_SOLVED','RealSaS.QualifiedCameraSetIR.v1')

          cand=canonical_mesh_candidate_from_dict(cand_payload)
          app=complete_appearance_asset_from_dict(app_payload)
          cams=qualified_camera_set_from_dict(cam_payload)
          binding=str(app_payload.get('candidate_mesh_binding_hash') or app_payload.get('candidate_lineage_hash') or '')
          print('RESOLVED_BINDINGS',json.dumps({'candidate_run':cand_run,'candidate_lineage_hash':cand.candidate_lineage_hash,'appearance_run':app_run,'appearance_candidate_binding':binding,'appearance_asset_hash':app.asset_hash,'camera_run':cam_run,'camera_set_hash':cams.camera_set_hash},sort_keys=True),flush=True)
          if binding and binding != cand.candidate_lineage_hash:
              raise RuntimeError(f'APPEARANCE_CARRIER_BINDING_DRIFT:{binding}!={cand.candidate_lineage_hash}')

          idx={str(v.candidate_vertex_id):i for i,v in enumerate(cand.vertices)}
          vertices=np.asarray([v.P for v in cand.vertices],dtype=np.float64)
          faces=np.asarray([[idx[str(x)] for x in f] for f in cand.faces],dtype=np.int64)
          face_uv=np.asarray(load_face_uv(app))
          face_page=np.asarray(load_face_page_index(app))
          if len(face_uv)!=len(faces) or len(face_page)!=len(faces):
              raise RuntimeError(f'APPEARANCE_FACE_DOMAIN_DRIFT:{len(face_uv)}:{len(face_page)}:{len(faces)}')
          np.savez(out/'source_carrier_appearance_arrays.npz',vertices=vertices,faces=faces,face_uv=face_uv,face_page_index=face_page)
          (out/'camera_set.json').write_text(json.dumps(cam_payload,indent=2,sort_keys=True)+'\n')
          (out/'appearance.json').write_text(json.dumps(app_payload,indent=2,sort_keys=True)+'\n')

          textures_out=out/'textures'; textures_out.mkdir()
          copied=[]
          for texture in app.textures:
              for page_index,page in enumerate(_load_texture_pages(texture)):
                  src=Path(page.transport_png_path)
                  if not src.is_file(): raise RuntimeError('SOURCE_TEXTURE_MISSING:'+str(src))
                  dst=textures_out/f'view{int(texture.direction_index)}_page{page_index}.png'
                  shutil.copy2(src,dst)
                  copied.append({'direction_index':int(texture.direction_index),'page_index':page_index,'path':dst.name,'sha256':sha256_file(dst)})
          prov=Path(app.provenance_npz_path)
          if not prov.is_file(): raise RuntimeError('SOURCE_PROVENANCE_MISSING:'+str(prov))
          shutil.copy2(prov,out/'provenance.npz')
          manifest={
              'schema':'RealSaS.FreshKnightSourceAppearanceBundle.v3',
              'canonical_sha':'949422678d34cf69008cffd6b4d7647c8c066b8a',
              'candidate_run_id':cand_run,
              'appearance_run_id':app_run,
              'camera_run_id':cam_run,
              'source_refs':{'stage05':cam_ref,'stage18':cand_ref,'stage23':app_ref},
              'candidate_lineage_hash':cand.candidate_lineage_hash,
              'appearance_candidate_binding_hash':binding,
              'appearance_asset_hash':app.asset_hash,
              'camera_set_hash':cams.camera_set_hash,
              'vertex_count':int(vertices.shape[0]),
              'face_count':int(faces.shape[0]),
              'face_uv_shape':list(face_uv.shape),
              'face_page_shape':list(face_page.shape),
              'arrays_sha256':sha256_file(out/'source_carrier_appearance_arrays.npz'),
              'provenance_sha256':sha256_file(out/'provenance.npz'),
              'texture_pages':copied,
              'mechanics_from_source_runs_authorized':False,
              'source_owned_appearance_only':True,
          }
          (out/'BUNDLE_MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          print('FRESH_SOURCE_BUNDLE_V3='+json.dumps(manifest,sort_keys=True),flush=True)
          PY
      - name: Archive bundle
        run: tar -C /tmp -czf /tmp/fresh_knight_source_bundle_v3.tar.gz fresh_knight_source_bundle_v3
      - uses: actions/upload-artifact@v4
        with:
          name: fresh-knight-source-appearance-bundle-v3
          path: /tmp/fresh_knight_source_bundle_v3.tar.gz
          if-no-files-found: error
          retention-days: 7
