name: g3-vectorized-equivalence-benchmark-v1

on:
  workflow_dispatch:
  push:
    branches: [research/vf11-certified-adaptive-20260921]
    paths:
      - 'tools/audit_g3_vectorized_equivalence_benchmark_v1.py'
      - '.github/workflows/g3_vectorized_equivalence_benchmark_v1.yml'

concurrency:
  group: g3-vectorized-equivalence-benchmark-v1
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 30
    env:
      AUTHORITY_ROOT: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_DEMO_V2_20260924
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Benchmark legacy vs vectorized G3
        run: |
          set -euo pipefail
          PYTHONPATH=. python tools/audit_g3_vectorized_equivalence_benchmark_v1.py \
            --authority-root "$AUTHORITY_ROOT" --run-id "$RUN_ID" \
            --out /tmp/G3_VECTOR_EQ.json

