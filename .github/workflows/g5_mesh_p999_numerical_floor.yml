name: g5-mesh-p999-numerical-floor

on:
  push:
    branches:
      - research/g5-mesh-v2-numerical-floor-20260919
    paths:
      - 'tools/g5_mesh_p999_numerical_floor.py'
      - '.github/workflows/g5_mesh_p999_numerical_floor.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 45
    env:
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      REALSAS_G5_FLOOR_OUT: g5_floor_out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
          python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt
          python -m pip install --no-input --progress-bar off scikit-image==0.25.2
      - name: Run exact G5 MESH numerical floor
        run: python tools/g5_mesh_p999_numerical_floor.py
      - name: Assert no subject dependency
        run: |
          ! grep -R -E 'SUBJECT2_KNIGHT|Knight\.fbx|MAGE_|Mage' tools/g5_mesh_p999_numerical_floor.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g5-mesh-p999-numerical-floor
          path: g5_floor_out/
          if-no-files-found: error
