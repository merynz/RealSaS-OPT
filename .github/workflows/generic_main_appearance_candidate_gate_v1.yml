name: generic-main-appearance-candidate-gate-v1

on:
  push:
    branches:
      - integration/generic-main-normalization-v2-20260930
    paths:
      - '.github/workflows/generic_main_appearance_candidate_gate_v1.yml'
      - 'compiler/realsas_compiler_core/appearance_*.py'
      - 'compiler/realsas_compiler_core/visual_mesh_arap_v1.py'
      - 'compiler/realsas_compiler_core/visibility_v2.py'
      - 'compiler/realsas_compiler_core/presentation_partition_v2.py'
      - 'compiler/realsas_compiler_services/orchestrator/adapters/appearance_v2.py'
      - 'compiler/realsas_compiler_services/orchestrator/adapters/product_state_v2.py'
      - 'canonical/CAA_*.json'
      - 'canonical/COMPLETE_APPEARANCE_AUTHORITY_*.json'
      - 'tests/compiler/test_caa_*.py'
      - 'tests/compiler/test_*appearance*.py'
      - 'tests/compiler/test_visibility_and_caa_v2.py'
      - 'tests/compiler/test_visual_mesh_arap_v1.py'
  workflow_dispatch:

concurrency:
  group: generic-main-appearance-candidate-gate-v1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  appearance:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned regression dependencies
        run: |
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
          python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt
      - name: Compile appearance closure
        run: |
          python -m compileall -q             compiler/realsas_compiler_core             compiler/realsas_compiler_services/orchestrator/adapters
      - name: Stage20-25 appearance regression slice
        run: |
          python -m pytest -q             tests/compiler/test_caa_abstention_contract_v1.py             tests/compiler/test_caa_adaptive_paging_v2.py             tests/compiler/test_caa_canonical_completion_v1.py             tests/compiler/test_caa_demo_static_mesh_admission_v2.py             tests/compiler/test_caa_v2_subject_free_policy.py             tests/compiler/test_caa_variational_completion_v1.py             tests/compiler/test_dynamic_appearance_conditioning_v2.py             tests/compiler/test_playback_appearance_authority_v2.py             tests/compiler/test_visibility_and_caa_v2.py             tests/compiler/test_visual_mesh_arap_v1.py             tests/compiler/test_product_mesh_stage_adapters_v1.py::test_vf23_stage20_to25_uses_unmodified_production_caa_policy
      - name: Appearance authority invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          appearance = Path("compiler/realsas_compiler_services/orchestrator/adapters/appearance_v2.py").read_text()
          product = Path("compiler/realsas_compiler_services/orchestrator/adapters/product_state_v2.py").read_text()
          assert '"mechanical_mesh_render_authority": False' in appearance
          assert '"SOURCE_VISUAL_MESH_V1"' in appearance
          assert '"visual_geometry_authority"] = "SOURCE_ART_SILHOUETTE"' in appearance
          assert '"mechanical_mesh_render_authority": False' in product
          assert '"STAGE18_SOURCE_OWNED_VISUAL_MESH_SET"' in product
          print("APPEARANCE_AUTHORITY_INVARIANTS_PASS")
          PY
      - name: Gate summary
        run: |
          echo STAGE20_25_APPEARANCE_CANDIDATE_PASS
          echo source_owned_visual_mesh=true
          echo mechanical_mesh_render_authority=false
          echo source_rgba_authority=true
          echo runtime_generation_forbidden=true
