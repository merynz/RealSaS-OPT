name: geppetto-lossless-conditioning-v3

on:
  pull_request:
    paths:
      - 'models/geppetto/__init__.py'
      - 'models/geppetto/product_conditioning.py'
      - 'models/geppetto/v3/**'
      - 'tests/models/test_geppetto_lossless_conditioning_v3.py'
      - 'canonical/RIGGING_EVIDENCE_LOSSLESS_CONDITIONING_AUTHORITY_V1_20260906.md'
      - '.github/workflows/geppetto_lossless_conditioning_v3.yml'

jobs:
  lossless-conditioning-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pytest
      - name: Compile V3 conditioning sources
        run: |
          python -m py_compile \
            models/geppetto/__init__.py \
            models/geppetto/product_conditioning.py \
            models/geppetto/v3/__init__.py \
            models/geppetto/v3/conditioning_lossless_v3.py \
            tests/models/test_geppetto_lossless_conditioning_v3.py
      - name: Run V3 lossless evidence regression
        run: python -m pytest -q tests/models/test_geppetto_lossless_conditioning_v3.py
