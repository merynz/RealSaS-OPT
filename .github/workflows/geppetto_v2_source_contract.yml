name: geppetto-v2-source-contract

on:
  pull_request:
    paths:
      - 'experiments/geppetto_arachne_r6_20260901/geppetto_*_v2.py'
      - 'experiments/geppetto_arachne_r6_20260901/conditioning_v2.py'
      - 'experiments/geppetto_arachne_r6_20260901/training_targets_v2.py'
      - 'experiments/geppetto_arachne_r6_20260901/train_geppetto_r6_v1.py'
      - 'experiments/geppetto_arachne_r6_20260901/eval_geppetto_r6_v1.py'
      - 'experiments/geppetto_arachne_r6_20260901/test_geppetto_v2_source.py'
      - 'experiments/geppetto_arachne_r6_20260901/test_geppetto_v2_generic_strength.py'
      - 'experiments/geppetto_arachne_r6_20260901/test_geppetto_v2_behavioral_integrity.py'
      - 'experiments/geppetto_arachne_r6_20260901/test_geppetto_v2_behavioral_overfit.py'
      - 'experiments/geppetto_arachne_r6_20260901/test_geppetto_v2_behavioral_panel.py'
      - '.github/workflows/geppetto_v2_source_contract.yml'
  push:
    branches:
      - source/generic-completion-v1-20260902
      - architecture/v4-generic-strength-source-completion-20260902
    paths:
      - 'experiments/geppetto_arachne_r6_20260901/geppetto_*_v2.py'
      - 'experiments/geppetto_arachne_r6_20260901/conditioning_v2.py'
      - 'experiments/geppetto_arachne_r6_20260901/training_targets_v2.py'
      - 'experiments/geppetto_arachne_r6_20260901/train_geppetto_r6_v1.py'
      - 'experiments/geppetto_arachne_r6_20260901/eval_geppetto_r6_v1.py'
      - 'experiments/geppetto_arachne_r6_20260901/test_geppetto_v2_source.py'
      - 'experiments/geppetto_arachne_r6_20260901/test_geppetto_v2_generic_strength.py'
      - 'experiments/geppetto_arachne_r6_20260901/test_geppetto_v2_behavioral_integrity.py'
      - 'experiments/geppetto_arachne_r6_20260901/test_geppetto_v2_behavioral_overfit.py'
      - 'experiments/geppetto_arachne_r6_20260901/test_geppetto_v2_behavioral_panel.py'
      - '.github/workflows/geppetto_v2_source_contract.yml'

jobs:
  geppetto-v2-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile Geppetto V2 source
        run: |
          python -m py_compile \
            experiments/geppetto_arachne_r6_20260901/geppetto_conditioning_v2.py \
            experiments/geppetto_arachne_r6_20260901/conditioning_v2.py \
            experiments/geppetto_arachne_r6_20260901/geppetto_candidate_v2.py \
            experiments/geppetto_arachne_r6_20260901/geppetto_loss_v2.py \
            experiments/geppetto_arachne_r6_20260901/geppetto_train_v2.py \
            experiments/geppetto_arachne_r6_20260901/geppetto_eval_v2.py \
            experiments/geppetto_arachne_r6_20260901/train_geppetto_r6_v1.py \
            experiments/geppetto_arachne_r6_20260901/eval_geppetto_r6_v1.py \
            experiments/geppetto_arachne_r6_20260901/geppetto_checkpoint_v2.py \
            experiments/geppetto_arachne_r6_20260901/geppetto_cpu_capacity_v2.py \
            experiments/geppetto_arachne_r6_20260901/training_targets_v2.py \
            experiments/geppetto_arachne_r6_20260901/test_geppetto_v2_behavioral_integrity.py \
            experiments/geppetto_arachne_r6_20260901/test_geppetto_v2_behavioral_overfit.py \
            experiments/geppetto_arachne_r6_20260901/test_geppetto_v2_behavioral_panel.py
      - name: Diagnose OpenBLAS conditioning and fork replay
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          PYTHONHASHSEED: '0'
        run: |
          lscpu | grep -E 'Model name|Vendor ID|Architecture' || true
          OPENBLAS_NUM_THREADS=1 python - <<'PY'
          import hashlib
          from experiments.geppetto_arachne_r6_20260901.geppetto_conditioning_v2 import GeppettoConditioningAdapterV2
          from experiments.geppetto_arachne_r6_20260901.test_geppetto_v2_behavioral_panel import WITNESSES, _surface
          spec = next(x for x in WITNESSES if x.name == 'fork_5')
          c = GeppettoConditioningAdapterV2()([_surface(spec)])
          print('FORK_CONDITIONING_OPENBLAS1', c.conditioning_hashes[0], hashlib.sha256(c.features.tobytes()).hexdigest())
          PY
          env -u OPENBLAS_NUM_THREADS python - <<'PY'
          import hashlib
          from experiments.geppetto_arachne_r6_20260901.geppetto_conditioning_v2 import GeppettoConditioningAdapterV2
          from experiments.geppetto_arachne_r6_20260901.test_geppetto_v2_behavioral_panel import WITNESSES, _surface
          spec = next(x for x in WITNESSES if x.name == 'fork_5')
          c = GeppettoConditioningAdapterV2()([_surface(spec)])
          print('FORK_CONDITIONING_OPENBLAS_DEFAULT', c.conditioning_hashes[0], hashlib.sha256(c.features.tobytes()).hexdigest())
          PY
          set +e
          OPENBLAS_NUM_THREADS=1 python -m pytest -q -s 'experiments/geppetto_arachne_r6_20260901/test_geppetto_v2_behavioral_panel.py::test_preregistered_generic_behavioral_panel[fork_5]'
          A=$?
          env -u OPENBLAS_NUM_THREADS python -m pytest -q -s 'experiments/geppetto_arachne_r6_20260901/test_geppetto_v2_behavioral_panel.py::test_preregistered_generic_behavioral_panel[fork_5]'
          B=$?
          echo "FORK_OPENBLAS1_DEFAULT_EXIT_CODES=${A},${B}"
          exit 0
      - name: Run Geppetto V2 source and behavioral gates
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          PYTHONHASHSEED: '0'
        run: |
          python -m pytest -q -s \
            experiments/geppetto_arachne_r6_20260901/test_geppetto_v2_source.py \
            experiments/geppetto_arachne_r6_20260901/test_geppetto_v2_generic_strength.py \
            experiments/geppetto_arachne_r6_20260901/test_geppetto_v2_behavioral_integrity.py \
            experiments/geppetto_arachne_r6_20260901/test_geppetto_v2_behavioral_overfit.py \
            experiments/geppetto_arachne_r6_20260901/test_geppetto_v2_behavioral_panel.py
