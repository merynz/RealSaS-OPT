name: gofmt-probe-external-handoff

on:
  push:
    branches:
      - platform/external-stage-handoff-v1-mainline-20261013

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Apply canonical Go formatting
        run: |
          gofmt -w .
          if git diff --quiet -- .; then
            echo 'GOFMT_ALREADY_CLEAN'
            exit 0
          fi
          git diff --check -- .
          git config user.name 'realsas-ci'
          git config user.email 'realsas-ci@users.noreply.github.com'
          git add .
          git commit -m 'Apply gofmt to external stage handoff'
          git push origin HEAD:platform/external-stage-handoff-v1-mainline-20261013
