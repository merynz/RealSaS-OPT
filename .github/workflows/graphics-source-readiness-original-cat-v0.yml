name: Graphics readiness v0 original Cat V3 source-only requalification
on:
  push:
    branches: [research/operational-representation-synthesis-v0]
    paths:
      - 'tools/corpus/admit_corpus370_original_cat_v3_graphics_readiness_v0.py'
      - 'compiler/realsas_compiler_core/graphics_source_readiness_v0.py'
      - '.github/workflows/graphics-source-readiness-original-cat-v0.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: graphics-readiness-cat-v0-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-source-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DRIVE_CONFIG_B64: ${{ secrets.REALSAS_HOSTED_DRIVE_RCLONE_CONFIG_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Re-open immutable PRIVATE original source arrays and independently re-court
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python -m pip install 'numpy>=1.26,<3'
          D="$RUNNER_TEMP/original-cat-readiness-v0"
          ROOT="gdrive:corpus370_preparation_v1"
          mkdir -p "$D/src/Textures" "$D/render" "$D/out" "$D/report"
          export RCLONE_CONFIG="$D/private-rclone.conf"
          test -n "$DRIVE_CONFIG_B64"
          printf '%s' "$DRIVE_CONFIG_B64" | base64 -d > "$RCLONE_CONFIG"
          test -s "$RCLONE_CONFIG"
          unset DRIVE_CONFIG_B64
          R="$D/rclone-v1.75.2-linux-amd64.zip"
          curl -fLsS --retry 3 --max-time 180 \
            https://github.com/rclone/rclone/releases/download/v1.75.2/rclone-v1.75.2-linux-amd64.zip -o "$R"
          echo "349ac8fba6ff65d6247043f1750cdcb518ec5d500ef91463a10d37c0ccdf3702  $R" | sha256sum --check
          unzip -q "$R" -d "$D"
          export PATH="$D/rclone-v1.75.2-linux-amd64:$PATH"
          rclone copyto "$ROOT/hosted_operational_drawable_inputs_v1/42220981274-1/ORIGINAL_TWO_SOURCE_INPUTS.zip" "$D/inputs.zip" --checksum --retries 3
          echo "e3c758b0a4dc9bd3e7f889e94366fa7ff40517deb15e68a202d525b62de13948  $D/inputs.zip" | sha256sum --check
          NATIVE="$ROOT/hosted_native_temporal_pilot_v1/41915393652-1/subjects/corpus_000ca1ae51f9582fde9e"
          rclone copyto "$NATIVE/teacher.npz" "$D/teacher.npz" --checksum --retries 3
          rclone copyto "$NATIVE/teacher.npz.json" "$D/teacher.json" --checksum --retries 3
          rclone copyto "$ROOT/hosted_operational_cat_source_uv_plan_v2/CAT/42260446130-1/PRIVATE_CAT_ORIGINAL_SOURCE_UV_EDIT_PLAN_V2.json" "$D/plan.json" --checksum --retries 3
          rclone copyto "$ROOT/hosted_operational_cat_uv_texture_cycles_v2/CAT/42263195370-1/PRIVATE_SOURCE_UV_ATLAS_EDIT_IMAGES_V1.json" "$D/atlas-assets.json" --checksum --retries 3
          REMOTE="$ROOT/hosted_drawable_capability_pose_transport_v3/CAT/42273572984-1"
          for FILE in PRIVATE_CAT_NATIVE_POSE_UV_EDIT_CYCLES_V3.json PRIVATE_CAT_NATIVE_POSE_UV_EDIT_CYCLES_SAMPLES_V3.npz; do
            rclone copyto "$REMOTE/$FILE" "$D/render/$FILE" --checksum --retries 3
          done
          echo "c2792c8efb36c4ccdf9178c6b933351b50364bbd28707e9365a3c115db00d603  $D/teacher.npz" | sha256sum --check
          echo "a0f224019deca20bf5d807ab4d27a7c341a65bc21930fc99ad8e88ca5b4bc023  $D/teacher.json" | sha256sum --check
          echo "8be8fccde3d9cc97f7ba452fd50c1a9f4ebea2e34da590a22d30872b2b0f497b  $D/plan.json" | sha256sum --check
          echo "0e9a2fcf6a2c048eb6e99048793290b8865d802689f59b7c8c20bc6390cf479a  $D/atlas-assets.json" | sha256sum --check
          echo "89dcb4d516e5579e766b19bd2d25eb31cbfaaa64f27ce34632405d99ce6874bc  $D/render/PRIVATE_CAT_NATIVE_POSE_UV_EDIT_CYCLES_V3.json" | sha256sum --check
          echo "b2bb4fa9fc0b777bb8418aebc729123616b774b55eeb215ba17651e7f3448e0d  $D/render/PRIVATE_CAT_NATIVE_POSE_UV_EDIT_CYCLES_SAMPLES_V3.npz" | sha256sum --check
          D="$D" python - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          d=Path(os.environ["D"])
          expected=[
            ("/Models/GLB format/animal-cat.glb","src/animal-cat.glb",
             "1e73aaf7d497dd7d2946badf92d189d2333f163e66dced91feb446bc9bdee850"),
            ("/Models/GLB format/Textures/colormap.png","src/Textures/colormap.png",
             "2f6d0032e51c2d49b13b8e689d59eb39aa3ee6c32f2a1851213e11fc7593177d"),
            ("/corpus_000ca1ae51f9582fde9e/SOURCE_REST_RENDER_CANDIDATE.json","policy.json",
             "c8fe4e307ddbbaf5cc0892cffc4267bd08e394f2299f4e70155ffc6207190a4b"),
            ("/corpus_000ca1ae51f9582fde9e/camera_bundle.json","camera.json",
             "300b935a47379f6c44d4b4356554d1c32a86ca3b732a62405c73da9e0ec6adf0")
          ]
          with zipfile.ZipFile(d/"inputs.zip") as z:
            manifest=json.loads(z.read("PRIVATE_TRANSPORT_MANIFEST.json"))
            assert manifest["parent_manifest_sha256"]=="cb9ffea96b22bb4500b367afe9965d98fa52b99f51dbe4faf5fac8aabc1ae172"
            for suffix,path,sha in expected:
              rows=[r for r in manifest["files"] if r["relative_path"].endswith(suffix)]
              assert len(rows)==1
              r=rows[0]
              payload=z.read("objects/"+r["sha256"])
              assert len(payload)==r["size_bytes"] and hashlib.sha256(payload).hexdigest()==sha==r["sha256"]
              dst=d/path
              dst.parent.mkdir(parents=True,exist_ok=True)
              dst.write_bytes(payload)
          print("CAT_V3_PRIVATE_PARENT_SOURCE_SHA_VERIFIED")
          PY
          python -m tools.corpus.admit_corpus370_original_cat_v3_graphics_readiness_v0 \
            --root "$D" --out "$D/report/PRIVATE_CAT_V3_GRAPHICS_READINESS_V0.json"
          PRIVATE_DEST="$ROOT/hosted_graphics_source_readiness_v0/CAT/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rclone copyto "$D/report/PRIVATE_CAT_V3_GRAPHICS_READINESS_V0.json" \
            "$PRIVATE_DEST/PRIVATE_CAT_V3_GRAPHICS_READINESS_V0.json" --checksum --retries 3
          rclone cat "$PRIVATE_DEST/PRIVATE_CAT_V3_GRAPHICS_READINESS_V0.json" > "$D/readback.json"
          cmp "$D/readback.json" "$D/report/PRIVATE_CAT_V3_GRAPHICS_READINESS_V0.json"
          sha256sum "$D/report/PRIVATE_CAT_V3_GRAPHICS_READINESS_V0.json"
          echo "CAT_V3_READINESS_SOURCE_PHYSICAL_REPLAY_SUCCEEDED__NO_PUPPET_ADMISSION"
