name: historical-cdt-v05-capability-audit-v1

on:
  workflow_dispatch:
  push:
    branches:
      - research/vf11-certified-adaptive-20260921
    paths:
      - 'tools/audit_historical_cdt_v05_capabilities_v1.py'
      - '.github/workflows/historical_cdt_v05_capability_audit_v1.yml'

concurrency:
  group: historical-cdt-v05-capability-audit-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Inspect sealed CDT source
        run: |
          set -euo pipefail
          PYTHONPATH=. python tools/audit_historical_cdt_v05_capabilities_v1.py | tee /tmp/cdt_capabilities.txt
      - name: Seal
        run: |
          set -euo pipefail
          mkdir -p canonical/historical_cdt_v05_capability_audit_v1
          cp /tmp/cdt_capabilities.txt canonical/historical_cdt_v05_capability_audit_v1/AUDIT_STDOUT.txt
          git config user.name realsas-self-hosted-runner
          git config user.email runner@realsas.local
          git add canonical/HISTORICAL_CDT_V05_CAPABILITY_AUDIT_V1_20260928.json canonical/historical_cdt_v05_capability_audit_v1
          git commit -m 'audit: seal CDT v0.5 capability evidence'
          git fetch origin research/vf11-certified-adaptive-20260921
          git rebase origin/research/vf11-certified-adaptive-20260921
          git push origin HEAD:research/vf11-certified-adaptive-20260921
