name: iris-continuous-joint-system-v1

on:
  push:
    branches:
      - research/iris-tessa-v3-apparatus-audit-v1
    paths:
      - 'experiments/iris_tessa_v3_apparatus_audit_20261025/CONTINUOUS_JOINT_SYSTEM_PREREG_V1.md'
      - 'experiments/iris_tessa_v3_apparatus_audit_20261025/ORACLE_Z_FINAL_CARRIER_SELECTION_V6.json'
      - 'experiments/iris_tessa_v3_apparatus_audit_20261025/continuous_joint_system_probe_v1.py'
      - '.github/workflows/iris_continuous_joint_system_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuous-joint-system:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/torch-cpu.txt
      - name: Install pinned CPU torch profile
        run: python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt
      - name: Execute sealed continuous joint-system court
        run: |
          python experiments/iris_tessa_v3_apparatus_audit_20261025/continuous_joint_system_probe_v1.py \
            --selection experiments/iris_tessa_v3_apparatus_audit_20261025/ORACLE_Z_FINAL_CARRIER_SELECTION_V6.json \
            --out "$RUNNER_TEMP/continuous_joint_system_v1_report.json"
          cat "$RUNNER_TEMP/continuous_joint_system_v1_report.json"
      - name: Preserve report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-continuous-joint-system-v1-report
          path: ${{ runner.temp }}/continuous_joint_system_v1_report.json
          if-no-files-found: error
