name: iris-dinov2-v31-fusion-form-v1

on:
  push:
    branches:
      - research/iris-tessa-v3-apparatus-audit-v1
    paths:
      - 'experiments/iris_tessa_v3_apparatus_audit_20261025/DINOV2_V31_FUSION_FORM_PREREG_V1.md'
      - 'experiments/iris_tessa_v3_apparatus_audit_20261025/dinov2_v31_fusion_form_probe_v1.py'
      - '.github/workflows/iris_dinov2_v31_fusion_form_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dinov2-v31-fusion-form:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      DINO_SOURCE_REVISION: 7764ea0f912e53c92e82eb78a2a1631e92725fc8
      DINO_WEIGHT_SHA256: b938bf1bc15cd2ec0feacfe3a1bb553fe8ea9ca46a7e1d8d00217f29aef60cd9
      DINO_WEIGHT_SIZE: '88283115'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/torch-cpu.txt
      - name: Install pinned CPU torch profile
        run: python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt
      - name: Fetch exact DINOv2 source and weights
        run: |
          git clone -q https://github.com/facebookresearch/dinov2.git "$RUNNER_TEMP/dinov2"
          git -C "$RUNNER_TEMP/dinov2" checkout -q "$DINO_SOURCE_REVISION"
          test "$(git -C "$RUNNER_TEMP/dinov2" rev-parse HEAD)" = "$DINO_SOURCE_REVISION"
          curl --fail --location --retry 4 --silent --show-error \
            https://dl.fbaipublicfiles.com/dinov2/dinov2_vits14/dinov2_vits14_pretrain.pth \
            --output "$RUNNER_TEMP/dinov2_vits14_pretrain.pth"
          test "$(stat -c%s "$RUNNER_TEMP/dinov2_vits14_pretrain.pth")" = "$DINO_WEIGHT_SIZE"
          echo "$DINO_WEIGHT_SHA256  $RUNNER_TEMP/dinov2_vits14_pretrain.pth" | sha256sum -c -
      - name: Execute sealed fusion-form court
        run: |
          python experiments/iris_tessa_v3_apparatus_audit_20261025/dinov2_v31_fusion_form_probe_v1.py \
            --dinov2-source "$RUNNER_TEMP/dinov2" \
            --dinov2-weights "$RUNNER_TEMP/dinov2_vits14_pretrain.pth" \
            --out "$RUNNER_TEMP/dinov2_v31_fusion_form_v1_report.json"
          cat "$RUNNER_TEMP/dinov2_v31_fusion_form_v1_report.json"
      - name: Preserve report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-dinov2-v31-fusion-form-v1-report
          path: ${{ runner.temp }}/dinov2_v31_fusion_form_v1_report.json
          if-no-files-found: error
