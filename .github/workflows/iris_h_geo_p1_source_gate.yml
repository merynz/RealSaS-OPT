name: iris-h-geo-p1-source-gate

on:
  pull_request:
    paths:
      - 'canonical/H_GEO_P1_INPUT_BINDING_V1.json'
      - 'canonical/H_GEO_P1_PREREGISTRATION_V1.json'
      - 'models/iris/vnext/metric_geometry_v1.py'
      - 'tools/iris_vnext/h_geo_p1_geometry_v1.py'
      - 'tools/iris_vnext/h_geo_p1_runtime_v1.py'
      - 'tools/iris_vnext/build_fit8_h_geo_p1_dataset_v1.py'
      - 'tools/iris_vnext/preflight_h_geo_p1_a100_v1.py'
      - 'tools/iris_vnext/train_fit8_h_geo_p1_v1.py'
      - 'tools/iris_vnext/audit_fit8_h_geo_p1_v1.py'
      - 'tests/iris/test_h_geo_p1_v1.py'
      - 'tests/repository/test_h_geo_p1_contract_v1.py'
      - '.github/workflows/iris_h_geo_p1_source_gate.yml'
  push:
    branches:
      - research/iris-vnext-hybrid-tessa-v2-20261019
    paths:
      - 'canonical/H_GEO_P1_INPUT_BINDING_V1.json'
      - 'canonical/H_GEO_P1_PREREGISTRATION_V1.json'
      - 'models/iris/vnext/metric_geometry_v1.py'
      - 'tools/iris_vnext/h_geo_p1_geometry_v1.py'
      - 'tools/iris_vnext/h_geo_p1_runtime_v1.py'
      - 'tools/iris_vnext/build_fit8_h_geo_p1_dataset_v1.py'
      - 'tools/iris_vnext/preflight_h_geo_p1_a100_v1.py'
      - 'tools/iris_vnext/train_fit8_h_geo_p1_v1.py'
      - 'tools/iris_vnext/audit_fit8_h_geo_p1_v1.py'
      - 'tests/iris/test_h_geo_p1_v1.py'
      - 'tests/repository/test_h_geo_p1_contract_v1.py'
      - '.github/workflows/iris_h_geo_p1_source_gate.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  h-geo-p1-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements/mainline-ci.txt
            requirements/torch-cpu.txt
      - name: Install source-test dependencies
        run: |
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
          python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt
          python -m pip install --no-input --progress-bar off scipy
      - name: Compile H-GEO-P1 boundary
        run: |
          python -m py_compile \
            models/iris/vnext/metric_geometry_v1.py \
            tools/iris_vnext/h_geo_p1_geometry_v1.py \
            tools/iris_vnext/h_geo_p1_runtime_v1.py \
            tools/iris_vnext/build_fit8_h_geo_p1_dataset_v1.py \
            tools/iris_vnext/preflight_h_geo_p1_a100_v1.py \
            tools/iris_vnext/train_fit8_h_geo_p1_v1.py \
            tools/iris_vnext/audit_fit8_h_geo_p1_v1.py \
            tests/iris/test_h_geo_p1_v1.py \
            tests/repository/test_h_geo_p1_contract_v1.py
      - name: Run H-GEO-P1 source courts
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          PYTHONHASHSEED: '0'
        run: |
          python -m pytest -q -s \
            tests/iris/test_h_geo_p1_v1.py \
            tests/repository/test_h_geo_p1_contract_v1.py
      - name: Verify narrow scientific boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('canonical/H_GEO_P1_PREREGISTRATION_V1.json').read_text())
          assert p['architecture']['architecture_expansion_allowed'] is False
          assert p['architecture']['trainable_existing_module'] == 'scene_core.field'
          assert p['architecture']['tessa_invoked'] is False
          assert p['truth']['point_cloud_proxy_used_for_primary_truth'] is False
          assert p['truth']['signed_distance_claimed'] is False
          assert p['runtime_admission']['optimizer_step_allowed_before_all_authority_gates'] is False
          assert p['runtime_admission']['drive_tree_discovery_allowed'] is False
          assert p['interpretation']['pass_authorizes_surf_a2'] is False
          assert p['interpretation']['pass_authorizes_tessa'] is False
          print('PASS_H_GEO_P1_SOURCE_ONLY__A100_RUN_STILL_REQUIRED')
          PY
