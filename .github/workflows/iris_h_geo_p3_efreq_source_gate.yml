name: iris-h-geo-p3-efreq-source-gate

on:
  pull_request:
    paths:
      - 'canonical/H_GEO_P3_EFREQ_INPUT_BINDING_V1.json'
      - 'canonical/H_GEO_P3_EFREQ_PREREGISTRATION_V1.json'
      - 'docs/research/IRIS_H_GEO_P3_RESULT_20261020.json'
      - 'docs/research/IRIS_H_GEO_P3_EFREQ_DECISION_LEDGER_20261020.md'
      - 'tools/iris_vnext/h_geo_p3_efreq_v1.py'
      - 'tools/iris_vnext/audit_h_geo_p3_efreq_v1.py'
      - 'tests/iris/test_h_geo_p3_efreq_v1.py'
      - 'tests/repository/test_h_geo_p3_efreq_contract_v1.py'
      - '.github/workflows/iris_h_geo_p3_efreq_source_gate.yml'
      - 'CURRENT_STATE.md'
      - 'CURRENT_PLAN.md'
      - 'canonical/IRIS_RESEARCH_EXPERIMENT_LEDGER_V1.json'
  push:
    branches:
      - research/iris-vnext-hybrid-tessa-v2-20261019
    paths:
      - 'canonical/H_GEO_P3_EFREQ_INPUT_BINDING_V1.json'
      - 'canonical/H_GEO_P3_EFREQ_PREREGISTRATION_V1.json'
      - 'docs/research/IRIS_H_GEO_P3_RESULT_20261020.json'
      - 'docs/research/IRIS_H_GEO_P3_EFREQ_DECISION_LEDGER_20261020.md'
      - 'tools/iris_vnext/h_geo_p3_efreq_v1.py'
      - 'tools/iris_vnext/audit_h_geo_p3_efreq_v1.py'
      - 'tests/iris/test_h_geo_p3_efreq_v1.py'
      - 'tests/repository/test_h_geo_p3_efreq_contract_v1.py'
      - '.github/workflows/iris_h_geo_p3_efreq_source_gate.yml'
      - 'CURRENT_STATE.md'
      - 'CURRENT_PLAN.md'
      - 'canonical/IRIS_RESEARCH_EXPERIMENT_LEDGER_V1.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  endpoint-frequency-source-contract:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements/mainline-ci.txt
            requirements/torch-cpu.txt
      - name: Install source-test dependencies
        run: |
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
          python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt
      - name: Compile endpoint-frequency source
        run: |
          python -m py_compile \
            tools/iris_vnext/h_geo_p3_efreq_v1.py \
            tools/iris_vnext/audit_h_geo_p3_efreq_v1.py \
            tests/iris/test_h_geo_p3_efreq_v1.py \
            tests/repository/test_h_geo_p3_efreq_contract_v1.py
      - name: Run endpoint-frequency CPU/source courts
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          PYTHONHASHSEED: '0'
        run: |
          python -m pytest -q -s \
            tests/iris/test_h_geo_p3_efreq_v1.py \
            tests/repository/test_h_geo_p3_efreq_contract_v1.py
      - name: Verify diagnostic has no optimizer path
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('tools/iris_vnext/audit_h_geo_p3_efreq_v1.py').read_text()
          for bad in ('torch.optim','.backward(','.step()','requires_grad_(True)'):
              assert bad not in text, bad
          print('PASS_H_GEO_P3_EFREQ_ZERO_OPTIMIZER_SOURCE_BOUNDARY')
          PY
