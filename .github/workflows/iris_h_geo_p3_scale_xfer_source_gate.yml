name: iris-h-geo-p3-scale-xfer-source-gate

on:
  pull_request:
    paths:
      - 'canonical/H_GEO_P3_SCALE_XFER_*.json'
      - 'docs/research/IRIS_H_GEO_P3_EFREQ_RESULT_20261020.json'
      - 'docs/research/IRIS_H_GEO_P3_SCALE_XFER_DECISION_LEDGER_20261020.md'
      - 'tools/iris_vnext/h_geo_p3_scale_xfer_v1.py'
      - 'tools/iris_vnext/audit_h_geo_p3_scale_xfer_v1.py'
      - 'tests/iris/test_h_geo_p3_scale_xfer_v1.py'
      - 'tests/repository/test_h_geo_p3_scale_xfer_contract_v1.py'
      - '.github/workflows/iris_h_geo_p3_scale_xfer_source_gate.yml'

jobs:
  iris-h-geo-p3-scale-xfer-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements/mainline-ci.txt
            requirements/torch-cpu.txt
      - name: Install pinned source-test dependencies
        run: |
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
          python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt
      - name: Compile scale-transfer source
        run: |
          python -m py_compile \
            tools/iris_vnext/h_geo_p3_scale_xfer_v1.py \
            tools/iris_vnext/audit_h_geo_p3_scale_xfer_v1.py \
            tests/iris/test_h_geo_p3_scale_xfer_v1.py \
            tests/repository/test_h_geo_p3_scale_xfer_contract_v1.py
      - name: Run scale-transfer helper and repository contracts
        env:
          PYTHONPATH: .
          PYTHONHASHSEED: '0'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m pytest -q -s \
            tests/iris/test_h_geo_p3_scale_xfer_v1.py \
            tests/repository/test_h_geo_p3_scale_xfer_contract_v1.py
      - name: Enforce zero-optimizer source boundary
        shell: bash
        run: |
          ! grep -R "torch\.optim\|\.backward(\|optimizer\.step" \
            tools/iris_vnext/h_geo_p3_scale_xfer_v1.py \
            tools/iris_vnext/audit_h_geo_p3_scale_xfer_v1.py
          grep -q '"carrier_optimizer_steps_authorized": 0' canonical/H_GEO_P3_SCALE_XFER_PREREGISTRATION_V1.json
          grep -q '"p4_training_authorized": false' canonical/H_GEO_P3_SCALE_XFER_PREREGISTRATION_V1.json
          grep -q '"tessa_authorized": false' canonical/H_GEO_P3_SCALE_XFER_PREREGISTRATION_V1.json
