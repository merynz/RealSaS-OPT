name: iris-h-geo-p3-source-gate
on:
  pull_request:
    paths:
      - 'CURRENT_STATE.md'
      - 'CURRENT_PLAN.md'
      - 'AGENTS.md'
      - 'canonical/IRIS_RESEARCH_EXPERIMENT_LEDGER_V1.json'
      - 'canonical/H_GEO_P3_INPUT_BINDING_V1.json'
      - 'canonical/H_GEO_P3_PREREGISTRATION_V1.json'
      - 'docs/research/IRIS_H_GEO_P2_RESULT_20261020.json'
      - 'docs/research/IRIS_H_GEO_P3_DECISION_LEDGER_20261020.md'
      - 'models/iris/vnext/explicit_geometry_carrier_v1.py'
      - 'tools/iris_vnext/h_geo_p3_runtime_v1.py'
      - 'tools/iris_vnext/preflight_h_geo_p3_a100_v1.py'
      - 'tools/iris_vnext/train_fit8_h_geo_p3_v1.py'
      - 'tools/iris_vnext/train_fit8_h_geo_p3_seeded_v1.py'
      - 'tools/iris_vnext/audit_fit8_h_geo_p3_v1.py'
      - 'tools/iris_vnext/audit_fit8_h_geo_p3_seeded_v1.py'
      - 'tests/repository/test_h_geo_p3_contract_v1.py'
      - '.github/workflows/iris_h_geo_p3_source_gate.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  h-geo-p3-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements/mainline-ci.txt
            requirements/torch-cpu.txt
      - name: Install source-test dependencies
        run: |
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
          python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt
      - name: Compile H-GEO-P3 source
        run: |
          python -m py_compile \
            models/iris/vnext/explicit_geometry_carrier_v1.py \
            tools/iris_vnext/h_geo_p3_runtime_v1.py \
            tools/iris_vnext/preflight_h_geo_p3_a100_v1.py \
            tools/iris_vnext/train_fit8_h_geo_p3_v1.py \
            tools/iris_vnext/train_fit8_h_geo_p3_seeded_v1.py \
            tools/iris_vnext/audit_fit8_h_geo_p3_v1.py \
            tools/iris_vnext/audit_fit8_h_geo_p3_seeded_v1.py \
            tests/repository/test_h_geo_p3_contract_v1.py
      - name: Run H-GEO-P3 repository courts
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python -m pytest -q -s tests/repository/test_h_geo_p3_contract_v1.py
      - name: Verify decision boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('canonical/H_GEO_P3_PREREGISTRATION_V1.json').read_text())
          b=json.loads(Path('canonical/H_GEO_P3_INPUT_BINDING_V1.json').read_text())
          assert p['architecture']['architecture_expansion_allowed'] is True
          assert p['architecture']['p2_checkpoint_initialization_allowed'] is False
          assert p['architecture']['high_resolution_geometry_plane_resolution']==128
          assert b['exact_triangle_dataset']['reuse_bytes_exactly'] is True
          assert b['exact_triangle_dataset']['rebuild_or_resample_allowed'] is False
          assert p['training']['shared_v8_receives_gradients'] is False
          assert p['runtime_admission']['shared_v8_hash_nonregression_required'] is True
          assert p['training']['initialization_seed']==27090001
          assert p['independent_court']['probe_initialization_seed']==27099991
          assert p['interpretation']['pass_authorizes_tessa'] is False
          assert p['interpretation']['pass_authorizes_surf_a2'] is False
          print('PASS_H_GEO_P3_SOURCE_ONLY__A100_RUN_STILL_REQUIRED')
          PY
