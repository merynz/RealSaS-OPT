name: iris-h-rep-p0-source-gate

on:
  pull_request:
    paths:
      - 'CURRENT_STATE.md'
      - 'CURRENT_PLAN.md'
      - 'canonical/IRIS_RESEARCH_EXPERIMENT_LEDGER_V1.json'
      - 'canonical/H_REP_P0_INPUT_BINDING_V1.json'
      - 'canonical/H_REP_P0_PREREGISTRATION_V1.json'
      - 'docs/research/IRIS_SURF_A1_FROZEN_H_RESULT_20261019.json'
      - 'docs/research/IRIS_H_REP_P0_DECISION_LEDGER_20261019.md'
      - 'models/iris/vnext/h_rep_probe_v1.py'
      - 'tools/iris_vnext/h_rep_probe_authority_v1.py'
      - 'tools/iris_vnext/build_fit8_h_rep_probe_dataset_v1.py'
      - 'tools/iris_vnext/h_rep_probe_runtime_v1.py'
      - 'tools/iris_vnext/train_fit8_h_rep_probe_v1.py'
      - 'tools/iris_vnext/audit_fit8_h_rep_probe_v1.py'
      - 'tests/iris/test_h_rep_probe_v1.py'
      - 'tests/repository/test_h_rep_p0_contract_v1.py'
      - '.github/workflows/iris_h_rep_p0_source_gate.yml'
  push:
    branches:
      - research/iris-vnext-hybrid-tessa-v2-20261019
    paths:
      - 'CURRENT_STATE.md'
      - 'CURRENT_PLAN.md'
      - 'canonical/IRIS_RESEARCH_EXPERIMENT_LEDGER_V1.json'
      - 'canonical/H_REP_P0_INPUT_BINDING_V1.json'
      - 'canonical/H_REP_P0_PREREGISTRATION_V1.json'
      - 'docs/research/IRIS_SURF_A1_FROZEN_H_RESULT_20261019.json'
      - 'docs/research/IRIS_H_REP_P0_DECISION_LEDGER_20261019.md'
      - 'models/iris/vnext/h_rep_probe_v1.py'
      - 'tools/iris_vnext/h_rep_probe_authority_v1.py'
      - 'tools/iris_vnext/build_fit8_h_rep_probe_dataset_v1.py'
      - 'tools/iris_vnext/h_rep_probe_runtime_v1.py'
      - 'tools/iris_vnext/train_fit8_h_rep_probe_v1.py'
      - 'tools/iris_vnext/audit_fit8_h_rep_probe_v1.py'
      - 'tests/iris/test_h_rep_probe_v1.py'
      - 'tests/repository/test_h_rep_p0_contract_v1.py'
      - '.github/workflows/iris_h_rep_p0_source_gate.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  h-rep-p0-source-contract:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements/mainline-ci.txt
            requirements/torch-cpu.txt
      - name: Install source-test dependencies
        run: |
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
          python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt
      - name: Compile H-REP-P0 source boundary
        run: |
          python -m py_compile \
            models/iris/vnext/h_rep_probe_v1.py \
            tools/iris_vnext/h_rep_probe_authority_v1.py \
            tools/iris_vnext/build_fit8_h_rep_probe_dataset_v1.py \
            tools/iris_vnext/h_rep_probe_runtime_v1.py \
            tools/iris_vnext/train_fit8_h_rep_probe_v1.py \
            tools/iris_vnext/audit_fit8_h_rep_probe_v1.py \
            tests/iris/test_h_rep_probe_v1.py \
            tests/repository/test_h_rep_p0_contract_v1.py
      - name: Run H-REP-P0 CPU/source courts
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          PYTHONHASHSEED: '0'
        run: |
          python -m pytest -q -s \
            tests/iris/test_h_rep_probe_v1.py \
            tests/repository/test_h_rep_p0_contract_v1.py
      - name: Verify sealed H-REP-P0 authority after later geometry experiments
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('canonical/H_REP_P0_PREREGISTRATION_V1.json').read_text())
          l = json.loads(Path('canonical/IRIS_RESEARCH_EXPERIMENT_LEDGER_V1.json').read_text())
          assert p['frozen_authority']['v8_scene_core_trainable'] is False
          assert p['frozen_authority']['flexicubes_used'] is False
          assert p['frozen_authority']['tessa_used'] is False
          assert p['shared_probe_architecture']['equal_parameter_count_across_arms'] is True
          r = p['runtime_admission']
          assert r['accelerator'] == 'NVIDIA_A100_CLASS'
          assert r['minimum_cuda_memory_gib'] == 39
          assert r['source_precompile_required'] is True
          assert r['optimizer_step_allowed_before_all_authority_gates'] is False
          assert r['single_drive_mount_consent_required'] is True
          assert r['drive_tree_discovery_allowed'] is False
          assert r['additional_google_oauth_allowed'] is False
          assert r['reduced_capacity_or_subject_fallback_allowed'] is False
          assert p['interpretation']['pass_authorizes_tessa'] is False
          assert p['interpretation']['pass_authorizes_surf_a2'] is False
          assert p['interpretation']['fail_authorizes_carrier_retraining'] is False
          rows = {row['id']: row for row in l['experiments']}
          hrep = rows['H-REP-P0']
          assert hrep['status'] == 'SCIENTIFIC_FAIL'
          assert hrep['frozen_execution_source_sha'] == '479e8e53cf0d7df234a3e64b824bb704b861bf19'
          assert hrep['scientific_result_available'] is True
          assert hrep['tessa_authorized'] is False
          assert rows['H-GEO-P1']['status'] == 'SCIENTIFIC_FAIL'
          assert rows['H-GEO-P2-SCENE-FIELD']['status'] in ('SOURCE_PREPARATION','SCIENTIFIC_FAIL')
          assert l['active_experiment'] in ('H-GEO-P2-SCENE-FIELD','H-GEO-P3-EXPLICIT-HIRES-CARRIER')
          if l['active_experiment'] == 'H-GEO-P3-EXPLICIT-HIRES-CARRIER':
              assert rows['H-GEO-P2-SCENE-FIELD']['status'] == 'SCIENTIFIC_FAIL'
              assert rows['H-GEO-P3-EXPLICIT-HIRES-CARRIER']['status'] == 'SOURCE_PREPARATION'
          print('PASS_H_REP_P0_SEALED_HISTORY__LATER_H_GEO_PROGRESSION_ALLOWED')
          PY
