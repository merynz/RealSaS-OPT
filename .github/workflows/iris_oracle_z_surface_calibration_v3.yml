name: iris-oracle-z-surface-calibration-v3

on:
  push:
    branches:
      - research/iris-tessa-v3-apparatus-audit-v1
    paths:
      - 'experiments/iris_tessa_v3_apparatus_audit_20261025/ORACLE_Z_SURFACE_CALIBRATION_PREREG_V3.md'
      - 'experiments/iris_tessa_v3_apparatus_audit_20261025/oracle_z_surface_calibration_probe_v3.py'
      - '.github/workflows/iris_oracle_z_surface_calibration_v3.yml'
      - 'requirements/torch-cpu.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oracle-z-surface-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/torch-cpu.txt
      - run: python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt
      - name: Execute sealed surface calibration court
        run: |
          python experiments/iris_tessa_v3_apparatus_audit_20261025/oracle_z_surface_calibration_probe_v3.py --out "$RUNNER_TEMP/oracle_z_surface_calibration_v3_report.json"
          cat "$RUNNER_TEMP/oracle_z_surface_calibration_v3_report.json"
      - name: Preserve report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-z-surface-calibration-v3-report
          path: ${{ runner.temp }}/oracle_z_surface_calibration_v3_report.json
          if-no-files-found: error
