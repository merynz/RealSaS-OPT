name: IRIS Reprojection V2 Gate0

on:
  push:
    paths:
      - 'experiments/iris_reprojection_v2_20260831/**'
      - '.github/workflows/iris_reprojection_v2_gate0.yml'
  workflow_dispatch:

jobs:
  gate0-cpu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/iris_reprojection_v2_20260831
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.1.3 pillow==11.3.0 scipy==1.14.1
      - name: Synthetic geometry unit regressions
        run: python -m unittest -v test_gate0_geometry_v1.py
      - name: Real-corpus runner helper regressions
        run: python -m unittest -v test_gate0_real_corpus_v1.py
      - name: Synthetic Gate0 preflight
        run: python run_gate0_synthetic_preflight_v1.py
