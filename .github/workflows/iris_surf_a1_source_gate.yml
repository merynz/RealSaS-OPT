name: iris-surf-a1-source-gate

on:
  pull_request:
    paths:
      - 'canonical/IRIS_RESEARCH_EXPERIMENT_LEDGER_V1.json'
      - 'canonical/COLAB_RESEARCH_WORKER_UX_V1.json'
      - 'canonical/SURF_A1_FROZEN_H_INPUT_BINDING_V1.json'
      - 'canonical/SURF_A1_FROZEN_H_PREREGISTRATION_V1.json'
      - 'canonical/TESSA_V2_FIT8_PREREGISTRATION_V1.json'
      - 'models/iris/vnext/surface_rescue_v1.py'
      - 'models/iris/vnext/surface_rescue_raster_v1.py'
      - 'models/iris/vnext/surface_rescue_training_v1.py'
      - 'tools/iris_vnext/build_fit8_surface_raster_truth_v1.py'
      - 'tools/iris_vnext/surf_a1_io_v1.py'
      - 'tools/iris_vnext/preflight_surf_a1_a100_v1.py'
      - 'tools/iris_vnext/train_fit8_surf_a1_frozen_h_v1.py'
      - 'tools/iris_vnext/audit_fit8_surf_a1_representation_v1.py'
      - 'tests/iris/test_surface_rescue_v1.py'
      - 'tests/iris/test_surface_raster_truth_v1.py'
      - 'tests/iris/test_surface_rescue_raster_v1.py'
      - 'tests/iris/test_surface_rescue_training_v1.py'
      - 'tests/repository/test_surf_a1_contract_v1.py'
      - '.github/workflows/iris_surf_a1_source_gate.yml'
  push:
    branches:
      - research/iris-vnext-hybrid-tessa-v2-20261019
    paths:
      - 'canonical/IRIS_RESEARCH_EXPERIMENT_LEDGER_V1.json'
      - 'canonical/COLAB_RESEARCH_WORKER_UX_V1.json'
      - 'canonical/SURF_A1_FROZEN_H_INPUT_BINDING_V1.json'
      - 'canonical/SURF_A1_FROZEN_H_PREREGISTRATION_V1.json'
      - 'canonical/TESSA_V2_FIT8_PREREGISTRATION_V1.json'
      - 'models/iris/vnext/surface_rescue_v1.py'
      - 'models/iris/vnext/surface_rescue_raster_v1.py'
      - 'models/iris/vnext/surface_rescue_training_v1.py'
      - 'tools/iris_vnext/build_fit8_surface_raster_truth_v1.py'
      - 'tools/iris_vnext/surf_a1_io_v1.py'
      - 'tools/iris_vnext/preflight_surf_a1_a100_v1.py'
      - 'tools/iris_vnext/train_fit8_surf_a1_frozen_h_v1.py'
      - 'tools/iris_vnext/audit_fit8_surf_a1_representation_v1.py'
      - 'tests/iris/test_surface_rescue_v1.py'
      - 'tests/iris/test_surface_raster_truth_v1.py'
      - 'tests/iris/test_surface_rescue_raster_v1.py'
      - 'tests/iris/test_surface_rescue_training_v1.py'
      - 'tests/repository/test_surf_a1_contract_v1.py'
      - '.github/workflows/iris_surf_a1_source_gate.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  iris-surf-a1-source-gate:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements/mainline-ci.txt
            requirements/torch-cpu.txt
      - name: Install source-test dependencies
        run: |
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
          python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt
      - name: Compile SURF-A1 source boundary
        run: |
          python -m py_compile \
            models/iris/vnext/surface_rescue_v1.py \
            models/iris/vnext/surface_rescue_raster_v1.py \
            models/iris/vnext/surface_rescue_training_v1.py \
            tools/iris_vnext/build_fit8_surface_raster_truth_v1.py \
            tools/iris_vnext/surf_a1_io_v1.py \
            tools/iris_vnext/preflight_surf_a1_a100_v1.py \
            tools/iris_vnext/train_fit8_surf_a1_frozen_h_v1.py \
            tools/iris_vnext/audit_fit8_surf_a1_representation_v1.py \
            tests/iris/test_surface_rescue_v1.py \
            tests/iris/test_surface_raster_truth_v1.py \
            tests/iris/test_surface_rescue_raster_v1.py \
            tests/iris/test_surface_rescue_training_v1.py \
            tests/repository/test_surf_a1_contract_v1.py
      - name: Run SURF-A1 CPU/source courts
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          PYTHONHASHSEED: '0'
        run: |
          python -m pytest -q -s \
            tests/iris/test_surface_rescue_v1.py \
            tests/iris/test_surface_raster_truth_v1.py \
            tests/iris/test_surface_rescue_raster_v1.py \
            tests/iris/test_surface_rescue_training_v1.py \
            tests/repository/test_surf_a1_contract_v1.py
      - name: Verify no GPU scientific claim exists in source gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('canonical/SURF_A1_FROZEN_H_PREREGISTRATION_V1.json').read_text())
          assert p['runtime_admission']['source_precompile_required'] is True
          assert p['differentiable_raster_apparatus']['preflight_optimizer_step_allowed'] is False
          assert p['interpretation']['a1_pass_authorizes_tessa_training'] is False
          print('PASS_SOURCE_ONLY__A100_SCIENTIFIC_RUN_STILL_REQUIRED')
          PY
