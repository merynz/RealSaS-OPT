name: iris-surface-witness-sampler-v1-stage

on:
  push:
    branches:
      - research/iris-tessa-v3-apparatus-audit-stage2
    paths:
      - 'experiments/iris_tessa_v3_apparatus_audit_20261025/SURFACE_WITNESS_SAMPLER_PREREG_V1.md'
      - 'experiments/iris_tessa_v3_apparatus_audit_20261025/surface_witness_sampler_probe_v1.py'
      - '.github/workflows/iris_surface_witness_sampler_v1_stage.yml'
      - 'requirements/torch-cpu.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  surface-witness-sampler-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/torch-cpu.txt
      - name: Install pinned CPU torch profile
        run: python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt
      - name: Execute sealed sampler court
        run: |
          python experiments/iris_tessa_v3_apparatus_audit_20261025/surface_witness_sampler_probe_v1.py \
            --out "$RUNNER_TEMP/surface_witness_sampler_v1_report.json"
          cat "$RUNNER_TEMP/surface_witness_sampler_v1_report.json"
      - name: Preserve sampler report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-surface-witness-sampler-v1-report
          path: ${{ runner.temp }}/surface_witness_sampler_v1_report.json
          if-no-files-found: warn
