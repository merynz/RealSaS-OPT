name: iris-tessa-coordinate-contract-v1-stage

on:
  push:
    branches:
      - research/iris-tessa-v3-apparatus-audit-stage2
    paths:
      - 'models/iris/vnext/coordinate_contract_v1.py'
      - 'models/iris/vnext/structure_v5.py'
      - 'tests/iris/test_coordinate_contract_v1.py'
      - '.github/workflows/iris_tessa_coordinate_contract_v1_stage.yml'
      - 'requirements/torch-cpu.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coordinate-contract-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/torch-cpu.txt
      - name: Install pinned CPU torch profile
        run: python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt
      - name: Run coordinate-contract tests
        run: python -m unittest tests.iris.test_coordinate_contract_v1 -v
