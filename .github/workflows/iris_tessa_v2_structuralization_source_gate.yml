name: iris-tessa-v2-structuralization-source-gate

on:
  pull_request:
    paths:
      - models/tessa/v2/**
      - models/iris/vnext/heads_v3.py
      - models/iris/vnext/evidence_heads_v3.py
      - models/iris/vnext/training_v3.py
      - models/iris/vnext/structure_v3.py
      - models/iris/vnext/structure_global_v3.py
      - models/iris/vnext/model_v3.py
      - models/iris/vnext/stack_v3.py
      - models/iris/vnext/sparse_surface_v3.py
      - tools/iris_vnext/materialize_fit8_direct_surface_v1.py
      - tools/iris_vnext/hydrate_fit8_direct_surface_inputs_v1.py
      - tools/iris_vnext/preflight_fit8_direct_surface_a100_v1.py
      - canonical/VNEXT_DIRECT_SURFACE_INPUT_BINDING_V1.json
      - tests/iris/test_tessa_structuralizer_v2.py
      - tests/iris/test_tessa_global_history_v2.py
      - tests/iris/test_tessa_decoded_court_v2.py
      - tests/iris/test_tessa_generation_v2.py
      - tests/iris/test_tessa_structuralization_ab_v2.py
      - tests/iris/test_relation_head_v3.py
      - tests/iris/test_structure_bridge_v3.py
      - tests/iris/test_evidence_model_v3.py
      - tests/iris/test_sparse_surface_v3.py
      - tests/iris/test_direct_surface_materialization_v1.py
      - tests/iris/test_direct_surface_input_binding_v1.py
      - tests/iris/test_direct_surface_a100_preflight_v1.py
      - docs/research/IRIS_TESSA_V2_STRUCTURALIZATION_PLAN_20261019.md
      - .github/workflows/iris_tessa_v2_structuralization_source_gate.yml
  workflow_dispatch:

concurrency:
  group: iris-tessa-v2-structuralization-source-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-contract:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 25
    env:
      CUDA_VISIBLE_DEVICES: ""
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: .
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned source-test dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_DEFAULT_TIMEOUT: "60"
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
          python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt
          python - <<'PY'
          import pytest, torch
          print("IRIS_TESSA_V2_ENV_PASS", pytest.__version__, torch.__version__)
          PY

      - name: Compile V2 structuralization sources
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            models/tessa/v2/__init__.py \
            models/tessa/v2/config_v2.py \
            models/tessa/v2/objective_v2.py \
            models/tessa/v2/court_v2.py \
            models/tessa/v2/generation_v2.py \
            models/tessa/v2/ab_court_v2.py \
            models/tessa/v2/model_v2.py \
            models/tessa/v2/global_attention_v2.py \
            models/tessa/v2/model_global_v2.py \
            models/iris/vnext/heads_v3.py \
            models/iris/vnext/evidence_heads_v3.py \
            models/iris/vnext/training_v3.py \
            models/iris/vnext/structure_v3.py \
            models/iris/vnext/structure_global_v3.py \
            models/iris/vnext/model_v3.py \
            models/iris/vnext/stack_v3.py \
            models/iris/vnext/sparse_surface_v3.py \
            tools/iris_vnext/materialize_fit8_direct_surface_v1.py \
            tools/iris_vnext/hydrate_fit8_direct_surface_inputs_v1.py \
            tools/iris_vnext/preflight_fit8_direct_surface_a100_v1.py \
            tests/iris/test_tessa_structuralizer_v2.py \
            tests/iris/test_tessa_global_history_v2.py \
            tests/iris/test_tessa_decoded_court_v2.py \
            tests/iris/test_tessa_generation_v2.py \
            tests/iris/test_tessa_structuralization_ab_v2.py \
            tests/iris/test_relation_head_v3.py \
            tests/iris/test_structure_bridge_v3.py \
            tests/iris/test_evidence_model_v3.py \
            tests/iris/test_sparse_surface_v3.py \
            tests/iris/test_direct_surface_materialization_v1.py \
            tests/iris/test_direct_surface_input_binding_v1.py \
            tests/iris/test_direct_surface_a100_preflight_v1.py
          echo "IRIS_TESSA_V2_COMPILE_PASS"

      - name: Verify reference-capacity and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from models.tessa.v2 import TESSAStructuralizerConfigV2
          from models.iris.vnext.heads_v3 import GraphicsRelationHeadV3
          from models.iris.vnext.model_v3 import IRISVNextEvidenceModelV3
          from models.iris.vnext.sparse_surface_v3 import VNextScalarFieldQueryV3
          from models.iris.v5.indexed_sparse_tetra_decoder_v5 import SparseRegularTetraPolicyV5
          from tools.iris_vnext.materialize_fit8_direct_surface_v1 import assert_full_sparse_policy
          from tools.iris_vnext.hydrate_fit8_direct_surface_inputs_v1 import validate_binding
          cfg = TESSAStructuralizerConfigV2()
          cfg.validate()
          assert (cfg.d_model, cfg.n_heads, cfg.decoder_layers) == (1024, 16, 24)
          assert cfg.total_conditioning_tokens == 1024
          assert cfg.coordinate_bins == 1024
          assert GraphicsRelationHeadV3.neural_confidence_output is False
          assert GraphicsRelationHeadV3.pairwise_visibility_output is False
          assert IRISVNextEvidenceModelV3.topology_decoder_embedded is False
          assert VNextScalarFieldQueryV3.coordinate_transform == "IDENTITY_NORMALIZED_MINUS1_PLUS1"
          assert VNextScalarFieldQueryV3.scalar_transform == "IDENTITY_LEARNED_FIELD"
          assert VNextScalarFieldQueryV3.teacher_truth_used is False
          assert_full_sparse_policy(SparseRegularTetraPolicyV5())
          validate_binding(json.loads(Path("canonical/VNEXT_DIRECT_SURFACE_INPUT_BINDING_V1.json").read_text()))
          print("IRIS_TESSA_V2_REFERENCE_CAPACITY_PASS")
          PY

      - name: Run V2/V3 architecture tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/iris/test_tessa_structuralizer_v2.py \
            tests/iris/test_tessa_global_history_v2.py \
            tests/iris/test_tessa_decoded_court_v2.py \
            tests/iris/test_tessa_generation_v2.py \
            tests/iris/test_tessa_structuralization_ab_v2.py \
            tests/iris/test_relation_head_v3.py \
            tests/iris/test_structure_bridge_v3.py \
            tests/iris/test_evidence_model_v3.py \
            tests/iris/test_sparse_surface_v3.py \
            tests/iris/test_direct_surface_materialization_v1.py \
            tests/iris/test_direct_surface_input_binding_v1.py \
            tests/iris/test_direct_surface_a100_preflight_v1.py
          echo "IRIS_TESSA_V2_ARCHITECTURE_TEST_PASS"

      - name: Run historical relation and TESSA regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/iris/test_graphics_relation_head_v2.py \
            tests/iris/test_vnext_topology_teacher_v1.py \
            tests/models/test_tessa_v1.py \
            tests/models/test_tessa_training_data_v1.py \
            tests/iris/test_indexed_sparse_tetra_decoder_v5.py
          echo "IRIS_TESSA_V2_HISTORICAL_REGRESSION_PASS"
