name: iris-tessa-v3-research-provenance-v1

on:
  push:
    branches:
      - research/iris-tessa-v3-apparatus-audit-stage2
    paths:
      - 'experiments/iris_tessa_v3_apparatus_audit_20261025/*_RESULT_V1.md'
      - 'experiments/iris_tessa_v3_apparatus_audit_20261025/*_PREREG_V1.md'
      - 'experiments/iris_tessa_v3_apparatus_audit_20261025/*_probe_v1.py'
      - 'experiments/iris_tessa_v3_apparatus_audit_20261025/research_provenance_gate_v1.py'
      - '.github/workflows/iris_*_v1*.yml'
      - '.github/workflows/iris_tessa_v3_research_provenance_v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  research-provenance-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify preregistration -> probe/workflow -> Actions run -> result ancestry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python experiments/iris_tessa_v3_apparatus_audit_20261025/research_provenance_gate_v1.py \
            --out "$RUNNER_TEMP/research_provenance_v1_report.json"
      - name: Preserve provenance report
        uses: actions/upload-artifact@v4
        with:
          name: iris-tessa-v3-research-provenance-v1-report
          path: ${{ runner.temp }}/research_provenance_v1_report.json
          if-no-files-found: error
