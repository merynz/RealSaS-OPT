name: iris-tessa-v3-synthetic-addressability-v2

on:
  pull_request:
    paths:
      - 'experiments/iris_tessa_v3_apparatus_audit_20261025/SYNTHETIC_TESSA_ADDRESSABILITY_PREREG_V2.md'
      - 'experiments/iris_tessa_v3_apparatus_audit_20261025/tessa_addressability_probe_v2.py'
      - 'models/tessa/v2/**'
      - 'models/tessa/v3/**'
      - 'requirements/torch-cpu.txt'
      - '.github/workflows/iris_tessa_v3_synthetic_addressability_v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tiny-addressability-v2:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/torch-cpu.txt
      - name: Install pinned CPU torch profile
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
          PIP_DEFAULT_TIMEOUT: '60'
        run: python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt
      - name: Execute sealed V2 endpoint-addressability probe
        run: |
          python experiments/iris_tessa_v3_apparatus_audit_20261025/tessa_addressability_probe_v2.py \
            --out "$RUNNER_TEMP/tessa_addressability_v2_report.json"
          cat "$RUNNER_TEMP/tessa_addressability_v2_report.json"
      - name: Preserve V2 synthetic report
        uses: actions/upload-artifact@v4
        with:
          name: iris-tessa-v3-synthetic-addressability-v2-report
          path: ${{ runner.temp }}/tessa_addressability_v2_report.json
          if-no-files-found: error
