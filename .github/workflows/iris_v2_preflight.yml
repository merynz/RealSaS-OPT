name: IRIS V2 Preflight

on:
  push:
    branches:
      - audit/iris-architecture-discipline-20260824
    paths:
      - 'experiments/iris_single_pose_v2/**'
      - '.github/workflows/iris_v2_preflight.yml'
  pull_request:
    branches:
      - g0-g1/single-pose-geometry
    paths:
      - 'experiments/iris_single_pose_v2/**'
      - 'audit/**'
      - 'CURRENT_STATE.md'
      - '.github/workflows/iris_v2_preflight.yml'
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      WORKFLOW_EVENT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile exact committed sources
        working-directory: experiments/iris_single_pose_v2
        run: python -m py_compile *.py
      - name: Architecture / coordinate / matcher preflight
        working-directory: experiments/iris_single_pose_v2
        run: python preflight.py
      - name: Physical firewall / truth-cache preflight
        working-directory: experiments/iris_single_pose_v2
        run: python data_preflight.py
      - name: Observable evaluator preflight
        working-directory: experiments/iris_single_pose_v2
        run: python evaluation_preflight.py
      - name: Representation authority semantic preflight
        working-directory: experiments/iris_single_pose_v2
        run: python representation_preflight.py
      - name: Build exact R0-R3 execution bundle
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          test "$ACTUAL_HEAD" = "$SOURCE_HEAD_SHA"
          BUNDLE="$RUNNER_TEMP/iris-v2-r0-r3-execution-bundle"
          mkdir -p "$BUNDLE"
          SRC="experiments/iris_single_pose_v2"
          for f in \
            build_representation_seed_v1.py \
            stage_source.py \
            prepare_cache.py \
            audit_staged_cache_v2.py \
            representation_authority_study_v1.py \
            compact_representation_handoff_v1.py \
            geometry.py \
            run_representation_authority_v1.py; do
            cp "$SRC/$f" "$BUNDLE/$f"
          done
          (
            cd "$BUNDLE"
            sha256sum *.py | sort > SHA256SUMS.txt
          )
          python - <<'PY'
          import json, os
          from pathlib import Path
          bundle = Path(os.environ['RUNNER_TEMP']) / 'iris-v2-r0-r3-execution-bundle'
          info = {
              'schema': 'RealSaS.IRISSinglePoseV2.ExecutionBundle.v1',
              'source_head_sha': os.environ['SOURCE_HEAD_SHA'],
              'workflow_event_sha': os.environ['WORKFLOW_EVENT_SHA'],
              'workflow': 'IRIS V2 Preflight',
              'optimizer_steps': 0,
              'training_authorized': False,
              'entrypoint': 'run_representation_authority_v1.py --mode all',
              'required_corpus_root': '/content/drive/MyDrive/RealSaS_MASTER_CORPUS_1024_V3',
          }
          (bundle / 'BUNDLE_INFO.json').write_text(json.dumps(info, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Upload exact R0-R3 execution bundle
        uses: actions/upload-artifact@v4
        with:
          name: iris-v2-r0-r3-execution-bundle
          path: ${{ runner.temp }}/iris-v2-r0-r3-execution-bundle
          if-no-files-found: error
          retention-days: 14
