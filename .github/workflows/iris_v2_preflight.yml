name: IRIS V2 Preflight

on:
  push:
    branches:
      - audit/iris-architecture-discipline-20260824
    paths:
      - 'experiments/iris_single_pose_v2/**'
      - '.github/workflows/iris_v2_preflight.yml'
  pull_request:
    branches:
      - g0-g1/single-pose-geometry
    paths:
      - 'experiments/iris_single_pose_v2/**'
      - 'audit/**'
      - 'CURRENT_STATE.md'
      - '.github/workflows/iris_v2_preflight.yml'
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      WORKFLOW_EVENT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile exact committed sources
        working-directory: experiments/iris_single_pose_v2
        run: python -m py_compile *.py
      - name: Architecture / coordinate / matcher preflight
        working-directory: experiments/iris_single_pose_v2
        run: python preflight.py
      - name: Learner physical firewall / truth-cache preflight
        working-directory: experiments/iris_single_pose_v2
        run: python data_preflight.py
      - name: Representation-only geometry data-path preflight
        working-directory: experiments/iris_single_pose_v2
        run: python representation_data_preflight_v1.py
      - name: Partial-visibility representation cache regression
        working-directory: experiments/iris_single_pose_v2
        run: python representation_cache_visibility_preflight_v1.py
      - name: Observable evaluator preflight
        working-directory: experiments/iris_single_pose_v2
        run: python evaluation_preflight.py
      - name: Representation authority semantic preflight
        working-directory: experiments/iris_single_pose_v2
        run: python representation_preflight.py
      - name: Build exact R0-R3 representation-only execution bundle V3
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          test "$ACTUAL_HEAD" = "$SOURCE_HEAD_SHA"
          BUNDLE="$RUNNER_TEMP/iris-v2-r0-r3-execution-bundle-v3"
          mkdir -p "$BUNDLE"
          SRC="experiments/iris_single_pose_v2"
          for f in \
            build_representation_seed_v1.py \
            stage_representation_authority_v1.py \
            prepare_representation_cache_v1.py \
            audit_representation_stage_cache_v1.py \
            representation_authority_study_v1.py \
            compact_representation_handoff_v1.py \
            geometry.py \
            coords.py \
            run_representation_authority_v2.py; do
            cp "$SRC/$f" "$BUNDLE/$f"
          done
          (
            cd "$BUNDLE"
            sha256sum *.py | sort > SHA256SUMS.txt
          )
          python - <<'PY'
          import json, os
          from pathlib import Path
          bundle = Path(os.environ['RUNNER_TEMP']) / 'iris-v2-r0-r3-execution-bundle-v3'
          info = {
              'schema': 'RealSaS.IRISSinglePoseV2.ExecutionBundle.v3',
              'source_head_sha': os.environ['SOURCE_HEAD_SHA'],
              'workflow_event_sha': os.environ['WORKFLOW_EVENT_SHA'],
              'workflow': 'IRIS V2 Preflight',
              'optimizer_steps': 0,
              'training_authorized': False,
              'stage_profile': 'representation_authority_geometry_only',
              'rgb_staged': False,
              'rgb_consumed': False,
              'entrypoint': 'run_representation_authority_v2.py --mode all',
              'required_corpus_root': '/content/drive/MyDrive/RealSaS_MASTER_CORPUS_1024_V3',
          }
          (bundle / 'BUNDLE_INFO.json').write_text(json.dumps(info, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Verify isolated R0-R3 bundle dependency closure
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/iris-v2-r0-r3-execution-bundle-v3"
          SRC="experiments/iris_single_pose_v2"
          python - "$SRC" "$BUNDLE" <<'PY'
          import ast
          import sys
          from pathlib import Path

          src = Path(sys.argv[1])
          bundle = Path(sys.argv[2])
          local_modules = {p.stem for p in src.glob('*.py')}
          missing = set()
          for path in bundle.glob('*.py'):
              tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              for node in ast.walk(tree):
                  roots = []
                  if isinstance(node, ast.Import):
                      roots = [alias.name.split('.')[0] for alias in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      roots = [node.module.split('.')[0]]
                  for root in roots:
                      if root in local_modules and not (bundle / f'{root}.py').is_file():
                          missing.add((path.name, root))
          if missing:
              raise SystemExit(f'missing local bundle dependencies: {sorted(missing)}')
          print('local dependency closure PASS')
          PY
          cp "$SRC/representation_data_preflight_v1.py" "$BUNDLE/_isolated_representation_smoke.py"
          cp "$SRC/representation_cache_visibility_preflight_v1.py" "$BUNDLE/_isolated_partial_visibility_smoke.py"
          (
            cd "$BUNDLE"
            python -m py_compile *.py
            python _isolated_representation_smoke.py
            python _isolated_partial_visibility_smoke.py
          )
          rm "$BUNDLE/_isolated_representation_smoke.py" "$BUNDLE/_isolated_partial_visibility_smoke.py"
          find "$BUNDLE" -type d -name __pycache__ -prune -exec rm -rf {} +
          (
            cd "$BUNDLE"
            sha256sum -c SHA256SUMS.txt
          )
          python - "$BUNDLE" <<'PY'
          import sys
          from pathlib import Path
          bundle = Path(sys.argv[1])
          expected = {
              'BUNDLE_INFO.json',
              'SHA256SUMS.txt',
              'build_representation_seed_v1.py',
              'stage_representation_authority_v1.py',
              'prepare_representation_cache_v1.py',
              'audit_representation_stage_cache_v1.py',
              'representation_authority_study_v1.py',
              'compact_representation_handoff_v1.py',
              'geometry.py',
              'coords.py',
              'run_representation_authority_v2.py',
          }
          actual = {p.name for p in bundle.iterdir()}
          if actual != expected:
              raise SystemExit(f'bundle content drift: missing={sorted(expected-actual)} extra={sorted(actual-expected)}')
          print('exact bundle content PASS')
          PY
      - name: Upload exact R0-R3 representation-only execution bundle V3
        uses: actions/upload-artifact@v4
        with:
          name: iris-v2-r0-r3-execution-bundle-v3
          path: ${{ runner.temp }}/iris-v2-r0-r3-execution-bundle-v3
          if-no-files-found: error
          retention-days: 14
