name: IRIS V2 Preflight

on:
  push:
    branches:
      - audit/iris-architecture-discipline-20260824
    paths:
      - 'experiments/iris_single_pose_v2/**'
      - '.github/workflows/iris_v2_preflight.yml'
  pull_request:
    branches:
      - g0-g1/single-pose-geometry
    paths:
      - 'experiments/iris_single_pose_v2/**'
      - 'audit/**'
      - 'CURRENT_STATE.md'
      - '.github/workflows/iris_v2_preflight.yml'
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile exact committed sources
        working-directory: experiments/iris_single_pose_v2
        run: python -m py_compile *.py
      - name: Architecture / coordinate / matcher preflight
        working-directory: experiments/iris_single_pose_v2
        run: python preflight.py
      - name: Physical firewall / truth-cache preflight
        working-directory: experiments/iris_single_pose_v2
        run: python data_preflight.py
