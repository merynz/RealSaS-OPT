name: iris-v2-source-contract

on:
  pull_request:
    paths:
      - 'compiler/realsas_compiler_core/local_geometry.py'
      - 'experiments/iris_reprojection_v2_20260831/**'
      - 'tests/iris/**'
      - '.github/workflows/iris_v2_source_contract.yml'
  push:
    branches:
      - source/generic-completion-v1-20260902
      - architecture/v4-generic-strength-source-completion-20260902
    paths:
      - 'compiler/realsas_compiler_core/local_geometry.py'
      - 'experiments/iris_reprojection_v2_20260831/**'
      - 'tests/iris/**'
      - '.github/workflows/iris_v2_source_contract.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  iris-v2-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements/mainline-ci.txt
            requirements/torch-cpu.txt
      - name: Install pinned source-test dependencies
        run: |
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
          python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt
      - name: Compile IRIS V2 source
        run: |
          python -m py_compile compiler/realsas_compiler_core/local_geometry.py experiments/iris_reprojection_v2_20260831/*.py
      - name: Verify privileged-input firewall regressions
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          PYTHONHASHSEED: '0'
        run: |
          python -m pytest -q -s tests/iris/test_iris_v2_privileged_input_firewall_v1.py
      - name: Run IRIS V2 source gates
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          PYTHONHASHSEED: '0'
        run: |
          python -m pytest -q \
            tests/iris/test_iris_v2_source_v1.py \
            tests/iris/test_iris_v2_generic_strength_v1.py \
            tests/iris/test_iris_v2_privileged_input_firewall_v1.py
      - name: Execution lane
        run: echo 'execution_lane=github_hosted_public_standard'
