name: iris-v4-3-tp64-source-hull-lattice-contract

on:
  push:
    branches:
      - research/vf11-certified-adaptive-20260921
    paths:
      - 'models/iris/v4/source_hull_lattice_v4_3.py'
      - 'models/iris/v4/train_fit_v4_3.py'
      - 'models/iris/v4/regularity_v4_2.py'
      - 'models/iris/v4/train_fit_v4_2.py'
      - 'tests/iris/test_source_hull_lattice_v4_3.py'
      - 'tests/iris/test_regularity_v4_2.py'
      - 'canonical/KNIGHT_TRUTH_RASTER_CONVENTION_REFERENCE_20260923.json'
      - 'canonical/IRIS_V4_3_TP64_SOURCE_HULL_LATTICE_POLICY_20260923.json'
      - 'canonical/IRIS_V4_3_TP64_EXECUTION_BUDGET_20260923.json'
      - '.github/workflows/iris_v4_3_tp64_source_hull_lattice_contract.yml'
  workflow_dispatch:

jobs:
  v4-3-tp64-contract:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen CPU test dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
          PIP_DEFAULT_TIMEOUT: '60'
        run: |
          python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt
          python -m pip install --no-input --progress-bar off pytest==8.3.5 scipy==1.15.3
      - name: Compile V4.3 TP64 lane
        run: |
          python -m py_compile models/iris/v4/source_hull_lattice_v4_3.py
          python -m py_compile models/iris/v4/train_fit_v4_3.py
          python -m py_compile models/iris/v4/regularity_v4_2.py
          python -m py_compile models/iris/v4/train_fit_v4_2.py
          python -m py_compile tests/iris/test_source_hull_lattice_v4_3.py
          python -m py_compile tests/iris/test_regularity_v4_2.py
      - name: Run V4.3 authority tests
        run: |
          python -m pytest -q             tests/iris/test_source_hull_lattice_v4_3.py             tests/iris/test_regularity_v4_2.py             tests/iris/test_source_exterior_v4.py
      - name: Prove V4.3 source and claim boundary
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          from models.iris.v4.source_hull_lattice_v4_3 import SourceHullLatticePolicyV43
          p=json.loads(Path('canonical/IRIS_V4_3_TP64_SOURCE_HULL_LATTICE_POLICY_20260923.json').read_text())
          t=json.loads(Path('canonical/KNIGHT_TRUTH_RASTER_CONVENTION_REFERENCE_20260923.json').read_text())
          b=json.loads(Path('canonical/IRIS_V4_3_TP64_EXECUTION_BUDGET_20260923.json').read_text())
          q=SourceHullLatticePolicyV43()
          assert p['scientific_name']=='IRIS_V4_3_TP64'
          assert p['architecture']['changed_from_v4_2'] is False
          assert q.resolution==512 and q.full_scan_interval_steps==100
          assert q.replay_points_per_step==32768
          assert p['source_hull_lattice']['target_cap'] is None
          assert p['source_hull_lattice']['inside_visual_hull'].startswith('MASKED_OUT')
          assert p['causal_success_criteria']['primary_exact_r512_lattice']['certified_exterior_nonpositive_corner_count_final']==0
          assert p['causal_success_criteria']['secondary_source_projection']['stage13_pass_required_for_causal_success'] is False
          assert p['causal_success_criteria']['product_promotion']['frozen_stage13_v2_pass_required'] is True
          assert p['held']['training_only_differentiable_extracted_surface_raster_loss'] is True
          assert p['held']['global_teacher_sdf'] is True
          assert p['held']['teacher_first_hit_depth_loss'] is True
          assert p['qualification']['stage13_threshold_relaxation'] is False
          assert t['authority_boundary']['do_not_rebase_or_relax_stage13_to_this_reference'] is True
          assert t['exact_retained_summary']['truth_hard_raster_precision_all_views']==1.0
          assert t['constructive_source_contract_feasibility']['mc_r512_stage13_v2_pass'] is True
          assert b['status'].startswith('FROZEN_APPARATUS_ONLY')
          assert b['claim_boundary']['does_not_change_loss'] is True
          assert b['claim_boundary']['does_not_change_stage13'] is True
          assert b['limits']['max_estimated_total_notebook_wall_seconds']==10800.0
          print('V43_TP64_ARCHITECTURE_FROZEN=PASS')
          print('V43_R512_CANONICAL_LATTICE=PASS')
          print('V43_EXTERIOR_GATE_NO_RECALL_PRESSURE=PASS')
          print('V43_UNCAPPED_SOURCE_TARGET=PASS')
          print('V43_TRUTH_REFERENCE_NON_NORMATIVE=PASS')
          print('V43_STAGE13_UNCHANGED=PASS')
          print('V43_EXECUTION_BUDGET_APPARATUS_ONLY=PASS')
          PY
      - name: Enforce source-authority boundary
        run: |
          set -euo pipefail
          ! grep -RniE 'teacher_first_hit|global_teacher_sdf|visual[_ -]?hull.*clip|posthoc.*carv|differentiable.*raster'             models/iris/v4/source_hull_lattice_v4_3.py models/iris/v4/train_fit_v4_3.py
          echo 'V43_SOURCE_AUTHORITY_BOUNDARY=PASS'
