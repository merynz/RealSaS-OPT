name: iris-v5-runner-probe

on:
  push:
    branches:
      - research/vf11-certified-adaptive-20260921
    paths:
      - '.github/workflows/iris_v5_runner_probe.yml'

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe GPU and known authority paths
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi || true
          python3 - <<'PY'
          from pathlib import Path
          import torch
          print("cuda_available", torch.cuda.is_available())
          if torch.cuda.is_available():
              print("gpu", torch.cuda.get_device_name(0))
              print("vram_gib", torch.cuda.get_device_properties(0).total_memory/2**30)
          root=Path.home()/"realsas_authority"
          print("authority_root_exists", root.exists())
          for rel in [
              "RealSaS_SUBJECT2_KNIGHT_IRIS_FIT_V1/20260924T115953Z/V5_TP64_LONG_HORIZON_LOW_LR",
              "RealSaS_SUBJECT2_KNIGHT_IRIS_FIT_V1/20260923T212708Z/V5_TP64_DIRECT_FSTAR_FIT",
              "RealSaS_SUBJECT2_KNIGHT_IRIS_FIT_V1/SUBJECT2_KNIGHT_V1_STAGE08_PREFIT_EVIDENCE.zip",
          ]:
              p=root/rel
              print(rel, p.exists())
          PY
