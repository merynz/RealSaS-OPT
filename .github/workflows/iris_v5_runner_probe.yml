name: iris-v5-runner-probe

on:
  push:
    branches:
      - research/vf11-certified-adaptive-20260921
    paths:
      - '.github/workflows/iris_v5_runner_probe.yml'

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe known authority paths
        shell: bash
        run: |
          set -euo pipefail
          echo "HOME=$HOME"
          ROOT="$HOME/realsas_authority/RealSaS_SUBJECT2_KNIGHT_IRIS_FIT_V1"
          for P in \
            "$ROOT/SUBJECT2_KNIGHT_V1_STAGE08_PREFIT_EVIDENCE.zip" \
            "$ROOT/20260923T212708Z/V5_TP64_DIRECT_FSTAR_FIT/IRIS_V5_TP64_DIRECT_FSTAR_SELECTED.pt" \
            "$ROOT/20260923T212708Z/V5_TP64_DIRECT_FSTAR_FIT/FROZEN_FSTAR_QUERY_POOLS.npz" \
            "$ROOT/20260924T115953Z/V5_TP64_LONG_HORIZON_LOW_LR/V5_TP64_LONG_HORIZON_LOW_LR_RESULT.json" \
            "$ROOT/20260924T115953Z/V5_TP64_LONG_HORIZON_LOW_LR/FOUNDATION_AND_COMMON_BASE.json" \
            "$ROOT/20260924T115953Z/V5_TP64_LONG_HORIZON_LOW_LR/arms/B/SELECTED_CHECKPOINT.pt" \
            "$ROOT/20260924T115953Z/V5_TP64_LONG_HORIZON_LOW_LR/arms/B/IRIS_SIGNED_ZERO_SURFACE.npz" \
            "$ROOT/20260924T115953Z/V5_TP64_LONG_HORIZON_LOW_LR/arms/C/SELECTED_CHECKPOINT.pt" \
            "$ROOT/20260924T115953Z/V5_TP64_LONG_HORIZON_LOW_LR/arms/C/IRIS_SIGNED_ZERO_SURFACE.npz"
          do
            if [ -f "$P" ]; then
              stat -c 'FOUND %n %s' "$P"
            else
              echo "MISSING $P"
            fi
          done
