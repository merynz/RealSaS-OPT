name: iris-v5-source-field-contract

on:
  push:
    branches:
      - research/vf11-certified-adaptive-20260921
    paths:
      - 'models/iris/v5/**'
      - 'tests/iris/test_source_signed_field_v5.py'
      - 'tests/iris/test_indexed_sparse_tetra_decoder_v5.py'
      - 'tests/iris/test_direct_fstar_fit_v5.py'
      - 'tests/iris/test_learned_tail_localization_v5.py'
      - 'tests/iris/test_objective_tail_repair_v5.py'
      - 'tests/iris/test_shell_escape_diagnostics_v5.py'
      - 'tests/iris/test_stage13_mask_morphology_v5.py'
      - 'tests/iris/test_field_failure_diagnostics_v5.py'
      - 'canonical/IRIS_V5_FIELD_ONTOLOGY_RECLOSURE_20260923.json'
      - 'canonical/IRIS_V5_CONTINUOUS_SOURCE_FIELD_POLICY_20260923.json'
      - 'canonical/IRIS_V5_TP64_DIRECT_FSTAR_FIT_PREREG_20260923.json'
      - 'canonical/IRIS_V5_TP64_DIRECT_FSTAR_FIT_PREREG_AMENDMENT_20260923.json'
      - 'canonical/IRIS_V5_TP64_LEARNED_TAIL_LOCALIZATION_PREREG_20260924.json'
      - 'canonical/IRIS_V5_TP64_LEARNED_TAIL_LOCALIZATION_CLOSURE_20260924.json'
      - 'canonical/IRIS_V5_TP64_OBJECTIVE_CAUSAL_ABLATION_PREREG_20260924.json'
      - 'canonical/IRIS_V5_TP64_OBJECTIVE_CAUSAL_ABLATION_CLOSURE_20260924.json'
      - 'canonical/IRIS_V5_EXTERIOR_DECODER_SHELL_COMPAT_PREREG_20260924.json'
      - 'canonical/IRIS_V5_EXTERIOR_DECODER_SHELL_COMPAT_CLOSURE_20260924.json'
      - 'canonical/IRIS_V5_CORRECTED_DECODER_STAGE13_REQUALIFICATION_PREREG_20260924.json'
      - 'canonical/IRIS_V5_CORRECTED_DECODER_STAGE13_REQUALIFICATION_CLOSURE_20260924.json'
      - 'canonical/IRIS_V5_STAGE13_FROZEN_MASK_MORPHOLOGY_PREREG_20260924.json'
      - 'canonical/IRIS_V5_STAGE13_FROZEN_MASK_MORPHOLOGY_CLOSURE_20260924.json'
      - 'canonical/IRIS_V5_ZERO_SURFACE_OWNER_DIAGNOSTIC_PREREG_20260924.json'
      - 'canonical/IRIS_V5_ZERO_SURFACE_OWNER_DIAGNOSTIC_CLOSURE_20260924.json'
      - 'canonical/IRIS_V5_TP64_LONG_HORIZON_LOW_LR_PREREG_20260924.json'
      - 'canonical/IRIS_V5_TP64_LONG_HORIZON_LOW_LR_CLOSURE_20260924.json'
      - 'canonical/IRIS_V5_TP64_BC_ENDPOINT_CLOSURE_PREREG_20260924.json'
      - 'canonical/IRIS_V5_FIELD_FAILURE_DIAGNOSTIC_PREREG_20260924.json'
      - 'canonical/IRIS_V5_FIELD_FAILURE_DIAGNOSTIC_PREREG_AMENDMENT_20260924.json'
      - '.github/workflows/iris_v5_source_field_contract.yml'
  workflow_dispatch:

jobs:
  v5-source-field-contract:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen CPU test dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
          PIP_DEFAULT_TIMEOUT: '60'
        run: |
          python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt
          python -m pip install --no-input --progress-bar off pytest==8.3.5 scipy==1.15.3
      - name: Compile V5 geometry lane
        run: |
          python -m py_compile models/iris/v5/source_signed_field_v5.py
          python -m py_compile models/iris/v5/indexed_sparse_tetra_decoder_v5.py
          python -m py_compile models/iris/v5/direct_fstar_fit_v5.py
          python -m py_compile models/iris/v5/learned_tail_localization_v5.py
          python -m py_compile models/iris/v5/objective_tail_repair_v5.py
          python -m py_compile models/iris/v5/shell_escape_diagnostics_v5.py
          python -m py_compile models/iris/v5/stage13_mask_morphology_v5.py
          python -m py_compile models/iris/v5/field_failure_diagnostics_v5.py
          python -m py_compile tests/iris/test_source_signed_field_v5.py
          python -m py_compile tests/iris/test_indexed_sparse_tetra_decoder_v5.py
          python -m py_compile tests/iris/test_direct_fstar_fit_v5.py
          python -m py_compile tests/iris/test_learned_tail_localization_v5.py
          python -m py_compile tests/iris/test_objective_tail_repair_v5.py
          python -m py_compile tests/iris/test_shell_escape_diagnostics_v5.py
          python -m py_compile tests/iris/test_stage13_mask_morphology_v5.py
          python -m py_compile tests/iris/test_field_failure_diagnostics_v5.py
      - name: Run V5 target and indexed decoder tests
        run: |
          python -m pytest -q \
            tests/iris/test_source_signed_field_v5.py \
            tests/iris/test_indexed_sparse_tetra_decoder_v5.py \
            tests/iris/test_direct_fstar_fit_v5.py \
            tests/iris/test_learned_tail_localization_v5.py \
            tests/iris/test_objective_tail_repair_v5.py \
            tests/iris/test_shell_escape_diagnostics_v5.py \
            tests/iris/test_stage13_mask_morphology_v5.py \
            tests/iris/test_field_failure_diagnostics_v5.py
      - name: Prove ontology supersession boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ontology=json.loads(Path('canonical/IRIS_V5_FIELD_ONTOLOGY_RECLOSURE_20260923.json').read_text())
          target=json.loads(Path('canonical/IRIS_V5_CONTINUOUS_SOURCE_FIELD_POLICY_20260923.json').read_text())

          ext=ontology['evidence']['exact_r512_exterior_sign_audit']
          assert ext['certified_exterior_count']==128851336
          assert ext['nonpositive_certified_exterior_count']==0
          assert ext['pass'] is True
          assert ontology['active_field_ontology']['euclidean_sdf_required'] is False
