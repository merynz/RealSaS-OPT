          print('V5_EXTERIOR_SIGN_AUTHORITY=PASS_0_OF_128851336')
          print('V5_LEGACY_METRIC_MAGNITUDE_GATE=RETIRED')
          print('V5_FSTAR_CONTRACT=FROZEN')
