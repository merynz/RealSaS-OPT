          assert tail_prereg['execution']['stage13_qualification_permitted'] is False
          assert objective_prereg['status']=='FROZEN_BEFORE_CONTINUATION_OPTIMIZER_STEP_1'
          assert objective_prereg['execution']['code_repo_commit']=='df260b8e1423927d7df8873f80b2b82ab376a77b'
          assert objective_prereg['execution']['notebook_sha256']=='b469a617867e3e6e76c344a833568b9ed3d631039fcdb2010b30659e4f237fbb'
          assert objective_prereg['common_continuation']['all_arms_start_from_exact_same_model_state'] is True
          assert objective_prereg['common_continuation']['fixed_replay_bank']['arm_dependent_refresh'] is False
          assert objective_prereg['leakage_controls']['exact_r512_audit_lattice_training_points_forbidden'] is True
