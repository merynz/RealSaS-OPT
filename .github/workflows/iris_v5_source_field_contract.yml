name: iris-v5-source-field-contract

on:
  push:
    branches:
      - research/vf11-certified-adaptive-20260921
    paths:
      - 'models/iris/v5/**'
      - 'tests/iris/test_source_signed_field_v5.py'
      - 'tests/iris/test_indexed_sparse_tetra_decoder_v5.py'
      - 'tests/iris/test_direct_fstar_fit_v5.py'
      - 'tests/iris/test_learned_tail_localization_v5.py'
      - 'tests/iris/test_objective_tail_repair_v5.py'
      - 'tests/iris/test_shell_escape_diagnostics_v5.py'
      - 'canonical/IRIS_V5_FIELD_ONTOLOGY_RECLOSURE_20260923.json'
      - 'canonical/IRIS_V5_CONTINUOUS_SOURCE_FIELD_POLICY_20260923.json'
      - 'canonical/IRIS_V5_TP64_DIRECT_FSTAR_FIT_PREREG_20260923.json'
      - 'canonical/IRIS_V5_TP64_DIRECT_FSTAR_FIT_PREREG_AMENDMENT_20260923.json'
      - 'canonical/IRIS_V5_TP64_LEARNED_TAIL_LOCALIZATION_PREREG_20260924.json'
      - 'canonical/IRIS_V5_TP64_LEARNED_TAIL_LOCALIZATION_CLOSURE_20260924.json'
      - 'canonical/IRIS_V5_TP64_OBJECTIVE_CAUSAL_ABLATION_PREREG_20260924.json'
      - 'canonical/IRIS_V5_TP64_OBJECTIVE_CAUSAL_ABLATION_CLOSURE_20260924.json'
      - 'canonical/IRIS_V5_EXTERIOR_DECODER_SHELL_COMPAT_PREREG_20260924.json'
      - 'canonical/IRIS_V5_EXTERIOR_DECODER_SHELL_COMPAT_CLOSURE_20260924.json'
      - 'canonical/IRIS_V5_CORRECTED_DECODER_STAGE13_REQUALIFICATION_PREREG_20260924.json'
      - '.github/workflows/iris_v5_source_field_contract.yml'
  workflow_dispatch:

jobs:
  v5-source-field-contract:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen CPU test dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
          PIP_DEFAULT_TIMEOUT: '60'
        run: |
          python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt
          python -m pip install --no-input --progress-bar off pytest==8.3.5 scipy==1.15.3
      - name: Compile V5 geometry lane
        run: |
          python -m py_compile models/iris/v5/source_signed_field_v5.py
          python -m py_compile models/iris/v5/indexed_sparse_tetra_decoder_v5.py
          python -m py_compile models/iris/v5/direct_fstar_fit_v5.py
          python -m py_compile models/iris/v5/learned_tail_localization_v5.py
          python -m py_compile models/iris/v5/objective_tail_repair_v5.py
          python -m py_compile models/iris/v5/shell_escape_diagnostics_v5.py
          python -m py_compile tests/iris/test_source_signed_field_v5.py
          python -m py_compile tests/iris/test_indexed_sparse_tetra_decoder_v5.py
          python -m py_compile tests/iris/test_direct_fstar_fit_v5.py
          python -m py_compile tests/iris/test_learned_tail_localization_v5.py
          python -m py_compile tests/iris/test_objective_tail_repair_v5.py
          python -m py_compile tests/iris/test_shell_escape_diagnostics_v5.py
      - name: Run V5 target and indexed decoder tests
        run: |
          python -m pytest -q \
            tests/iris/test_source_signed_field_v5.py \
            tests/iris/test_indexed_sparse_tetra_decoder_v5.py \
            tests/iris/test_direct_fstar_fit_v5.py \
            tests/iris/test_learned_tail_localization_v5.py \
            tests/iris/test_objective_tail_repair_v5.py \
            tests/iris/test_shell_escape_diagnostics_v5.py
      - name: Prove ontology supersession boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ontology=json.loads(Path('canonical/IRIS_V5_FIELD_ONTOLOGY_RECLOSURE_20260923.json').read_text())
          target=json.loads(Path('canonical/IRIS_V5_CONTINUOUS_SOURCE_FIELD_POLICY_20260923.json').read_text())

          ext=ontology['evidence']['exact_r512_exterior_sign_audit']
          assert ext['certified_exterior_count']==128851336
          assert ext['nonpositive_certified_exterior_count']==0
          assert ext['pass'] is True
          assert ontology['active_field_ontology']['euclidean_sdf_required'] is False
          assert ontology['r512_independent_sign_certificate']['metric_magnitude_lower_bound_is_gate'] is False
          prereg=json.loads(Path('canonical/IRIS_V5_TP64_DIRECT_FSTAR_FIT_PREREG_20260923.json').read_text())
          amendment=json.loads(Path('canonical/IRIS_V5_TP64_DIRECT_FSTAR_FIT_PREREG_AMENDMENT_20260923.json').read_text())
          tail_prereg=json.loads(Path('canonical/IRIS_V5_TP64_LEARNED_TAIL_LOCALIZATION_PREREG_20260924.json').read_text())
          objective_prereg=json.loads(Path('canonical/IRIS_V5_TP64_OBJECTIVE_CAUSAL_ABLATION_PREREG_20260924.json').read_text())
          shell_prereg=json.loads(Path('canonical/IRIS_V5_EXTERIOR_DECODER_SHELL_COMPAT_PREREG_20260924.json').read_text())
          requal_prereg=json.loads(Path('canonical/IRIS_V5_CORRECTED_DECODER_STAGE13_REQUALIFICATION_PREREG_20260924.json').read_text())
          assert prereg['status']=='FROZEN_BEFORE_OPTIMIZER_STEP_1'
          assert prereg['execution']['repo_commit']=='4de08a779199d64b60b0d1aae3512a0f77e77c77'
          assert prereg['optimizer']['primary_objective']['type']=='SMOOTH_L1_DIRECT_FSTAR_ONLY'
          assert prereg['optimizer']['weight_decay']==0.0
          assert prereg['checkpoint_selection']['stage13_blind'] is True
          assert prereg['checkpoint_selection']['exact_r512_audit_blind'] is True
          assert amendment['status']=='FROZEN_APPARATUS_ONLY_REPAIR_BEFORE_FINAL_QUALIFICATION_DECISION'
          assert amendment['repair']['scientific_change'] is False
          assert amendment['amended_execution']['repo_commit']=='4de08a779199d64b60b0d1aae3512a0f77e77c77'
          assert amendment['amended_execution']['notebook_sha256']=='93e7dd44dcfed865b5ba5861365e88b6407255da6ce0af9674c43a6bbb231aad'
          assert tail_prereg['status']=='FROZEN_BEFORE_DIAGNOSTIC_EXECUTION'
          assert tail_prereg['execution']['diagnostic_repo_commit']=='3eb635f84768c180ea6acdda920f107188ad956b'
          assert tail_prereg['execution']['notebook_sha256']=='7b7a95f3fd9b104db2cdc48394fb3d9dfb345a5277fd6bab66e8bf9ccc85d0c8'
          assert tail_prereg['execution']['optimizer_steps_permitted']==0
          assert tail_prereg['execution']['parameter_updates_permitted']==0
          assert tail_prereg['execution']['stage13_qualification_permitted'] is False
          assert objective_prereg['status']=='FROZEN_BEFORE_CONTINUATION_OPTIMIZER_STEP_1'
          assert objective_prereg['execution']['code_repo_commit']=='df260b8e1423927d7df8873f80b2b82ab376a77b'
          assert objective_prereg['execution']['notebook_sha256']=='b469a617867e3e6e76c344a833568b9ed3d631039fcdb2010b30659e4f237fbb'
          assert objective_prereg['common_continuation']['all_arms_start_from_exact_same_model_state'] is True
          assert objective_prereg['common_continuation']['fixed_replay_bank']['arm_dependent_refresh'] is False
          assert objective_prereg['leakage_controls']['exact_r512_audit_lattice_training_points_forbidden'] is True
          assert objective_prereg['checkpoint_selection']['exact_r512_blind'] is True
          assert objective_prereg['checkpoint_selection']['stage13_blind'] is True
          assert objective_prereg['architecture']['spatial_resolution_ablation_in_this_notebook'] is False

          assert shell_prereg['status']=='PREREGISTERED__DIAGNOSTIC_ONLY__NO_TRAINING'
          assert shell_prereg['execution']['repo_commit']=='77cd81ffe6389a5c078f267ae2a1458f2a953459'
          assert shell_prereg['execution']['notebook_sha256']=='1215f809dd6f519ecf51a4eaa90aea3826f8d5123f296b511f092cf4490ba0ec'
          assert shell_prereg['execution']['optimizer_steps_permitted']==0
          assert shell_prereg['execution']['parameter_updates_permitted']==0
          assert shell_prereg['execution']['stage13_qualification_permitted'] is False
          assert requal_prereg['status']=='FROZEN_BEFORE_REQUALIFICATION_EXECUTION'
          assert requal_prereg['execution']['code_repo_commit']=='b39b5f13e2657553692c7a8b27db62b20332e279'
          assert requal_prereg['execution']['code_ci_run_id']==35986938283
          assert requal_prereg['execution']['code_ci_conclusion']=='success'
          assert requal_prereg['execution']['notebook_sha256']=='370ce75c128e20bd503ce3a9d34b2dbe57962dc94cb48d17c694bc8a4671b2ca'
          assert requal_prereg['execution']['optimizer_steps_permitted']==0
          assert requal_prereg['execution']['parameter_updates_permitted']==0
          assert requal_prereg['stage13']['profile']=='P999'
          assert requal_prereg['stage13']['threshold_change'] is False
          assert requal_prereg['stage13']['checkpoint_selection_feedback_forbidden'] is True
          diag=ontology['diagnostic_authorization']
          assert diag['authorized'] is False
          assert diag['completed_scope']=='KNIGHT_FIT1__FIVE_FROZEN_STATES__EXTERIOR_DECODER_SHELL_COMPATIBILITY_ONLY'
          assert diag['preregistration']=='canonical/IRIS_V5_EXTERIOR_DECODER_SHELL_COMPAT_PREREG_20260924.json'
          assert diag['closure']=='canonical/IRIS_V5_EXTERIOR_DECODER_SHELL_COMPAT_CLOSURE_20260924.json'
          assert diag['optimizer_steps_executed']==0
          assert diag['parameter_updates_executed']==0
          assert diag['stage13_qualification_executed'] is False

          auth=ontology['training_authorization']
          assert auth['authorized'] is False
          assert auth['prior_authorized_arm']=='canonical/IRIS_V5_TP64_OBJECTIVE_CAUSAL_ABLATION_PREREG_20260924.json'
          assert auth['prior_arm_closure']=='canonical/IRIS_V5_TP64_OBJECTIVE_CAUSAL_ABLATION_CLOSURE_20260924.json'
          assert auth['shell_compatibility_closure']=='canonical/IRIS_V5_EXTERIOR_DECODER_SHELL_COMPAT_CLOSURE_20260924.json'
          assert auth['blockers']==[
              'CLOSE_CORRECTED_DECODER_STAGE13_REQUALIFICATION_BEFORE_LONG_HORIZON',
          ]
          rq=ontology['requalification_authorization']
          assert rq['authorized'] is True
          assert rq['preregistration']=='canonical/IRIS_V5_CORRECTED_DECODER_STAGE13_REQUALIFICATION_PREREG_20260924.json'
          assert rq['code_repo_commit']=='b39b5f13e2657553692c7a8b27db62b20332e279'
          assert rq['code_ci_run_id']==35986938283
          assert rq['notebook_sha256']=='370ce75c128e20bd503ce3a9d34b2dbe57962dc94cb48d17c694bc8a4671b2ca'
          assert rq['optimizer_steps_permitted']==0
          assert rq['parameter_updates_permitted']==0
          assert rq['stage13_qualification_permitted'] is True
          assert rq['checkpoint_selection_permitted'] is False
          assert rq['threshold_change_authorized'] is False
          assert auth['architecture_change_authorized'] is False
          assert auth['spatial_resolution_change_authorized'] is False
          assert auth['regularity_loss_change_authorized'] is False
          assert auth['exact_r512_and_stage13_checkpoint_selection_blind'] is True

          c=target['exact_target_contract']
          assert c['required_view_count']==8
          assert c['required_resolution']==1024
          assert c['signed_2d']=='EDT(background)-EDT(foreground)'
          assert c['projection']['raster_cell_support']=='0<=sx<=RES AND 0<=sy<=RES'
          assert c['sample_coordinates']=='(sy-0.5,sx-0.5)'
          assert c['interpolation']=='BILINEAR'
          assert c['edge_extension']=='NEAREST'
          assert c['multi_view_aggregation']=='MAX_OVER_VALID_VIEWS'
          assert c['unseen_value']==0.25
          assert c['field_clamp']=={'min':-0.25,'max':0.25}
          assert target['next_gate']['training_before_gate'] is False

          print('V5_EXTERIOR_SIGN_AUTHORITY=PASS_0_OF_128851336')
          print('V5_LEGACY_METRIC_MAGNITUDE_GATE=RETIRED')
          print('V5_FSTAR_CONTRACT=FROZEN')
          print('V5_TRAINING_AUTHORIZED='+str(bool(ontology['training_authorization']['authorized'])).upper())
          PY
