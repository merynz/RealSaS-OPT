          assert bc_prereg['status']=='FROZEN_BEFORE_BC_ENDPOINT_CLOSURE_OPTIMIZER_STEP_1'
          assert bc_prereg['execution']['code_repo_commit']=='2d07f70536ecd2d02d0a55a5cb15c761a7ce6838'
          assert bc_prereg['execution']['notebook_sha256']=='6841b66a4d2622472835b30b9f46591546593ffdea2481b15a0dc884a151579e'
          assert [x['id'] for x in bc_prereg['train_arms']]==[
              'B_DIRECT_FSTAR_PLUS_NEAR_ZERO_SIGN',
              'C_DIRECT_FSTAR_PLUS_SOURCE_SILHOUETTE',
          ]
          assert bc_prereg['continuation']['restore_saved_optimizer_state'] is True
          assert bc_prereg['continuation']['active_schedule']=='CONSTANT_TERMINAL_LR'
          assert bc_prereg['continuation']['learning_rate']==1e-6
          assert bc_prereg['continuation']['continuation_steps_per_arm']==32000
          assert bc_prereg['continuation']['evaluation_every_steps']==1000
          assert bc_prereg['continuation']['schedule_index_offset']==9600
          assert bc_prereg['checkpoint_selection']['exact_r512_blind'] is True
          assert bc_prereg['checkpoint_selection']['stage13_blind'] is True
          assert field_diag_prereg['status']=='FROZEN_BEFORE_DIAGNOSTIC_EXECUTION'
          assert field_diag_prereg['execution']['diagnostic_repo_commit']=='6e3cf4d6f2d973e7c1df7ca0f31efbd7b11e3d86'
          assert field_diag_prereg['execution']['code_ci_run_id']==36007195382
          assert field_diag_prereg['execution']['notebook_sha256']=='efcb98d93da2a00570e97e1939d583cbb20f8dc30bdca1a4c28c2cf69ff5d2ff'
          assert field_diag_prereg['execution']['optimizer_steps_permitted']==0
          assert field_diag_prereg['execution']['parameter_updates_permitted']==0
          assert field_diag_prereg['evidence_boundary']['incomplete_bc_endpoint_run_consumed_as_scientific_evidence'] is False
          assert field_diag_prereg['surface_diagnostic']['sample_count_per_arm']==131072
          assert field_diag_prereg['replay_diagnostic']['expected_fixed_bank_sha256']=='f10fcd363423cda8131888b5720680297d7d4b263638e471f8b6484c5281ef16'
          assert field_diag_prereg['gradient_diagnostic']['total_rays']==256
          assert field_diag_amend['status']=='FROZEN_AFTER_APPARATUS_FAIL_BEFORE_RERUN'
          assert field_diag_amend['apparatus_failure']['scientific_surface_diagnostic_executed'] is False
          assert field_diag_amend['root_cause']['exact_historical_bank_indices_available'] is False
          assert field_diag_amend['amended_H3']['exact_training_bank_overlap_claimed'] is False
          assert field_diag_amend['amended_execution']['diagnostic_repo_commit']=='fd7ee14764f0d0be04b37349fac99825936c57a2'
          assert field_diag_amend['amended_execution']['code_ci_run_id']==36009727585
          assert field_diag_amend['amended_execution']['notebook_sha256']=='d988f57eb121865dd850a7b5514c0ff112235cd911acb4966e4618e356c0b3d2'
          diag=ontology['diagnostic_authorization']
          assert diag['authorized'] is False
          assert diag['completed_scope']=='KNIGHT_FIT1__FIVE_FROZEN_STATES__EXTERIOR_DECODER_SHELL_COMPATIBILITY_ONLY'
          assert diag['preregistration']=='canonical/IRIS_V5_EXTERIOR_DECODER_SHELL_COMPAT_PREREG_20260924.json'
          assert diag['closure']=='canonical/IRIS_V5_EXTERIOR_DECODER_SHELL_COMPAT_CLOSURE_20260924.json'
          assert diag['optimizer_steps_executed']==0
          assert diag['parameter_updates_executed']==0
          assert diag['stage13_qualification_executed'] is False

          auth=ontology['training_authorization']
          assert auth['authorized'] is False
          assert auth['blocker']=='CLOSE_FIELD_FAILURE_DIAGNOSTIC_BEFORE_ANY_FURTHER_TP64_TRAINING_OR_CAPACITY_CHANGE'
          assert auth['prior_bc_preregistration']=='canonical/IRIS_V5_TP64_BC_ENDPOINT_CLOSURE_PREREG_20260924.json'
          assert auth['replay_refresh_authorized'] is False
          assert auth['target_aggregation_change_authorized'] is False
          rq=ontology['requalification_authorization']
          assert rq['authorized'] is False
          assert rq['closure']=='canonical/IRIS_V5_CORRECTED_DECODER_STAGE13_REQUALIFICATION_CLOSURE_20260924.json'
          assert rq['optimizer_steps_executed']==0
          assert rq['parameter_updates_executed']==0
          morph=ontology['morphology_diagnostic_authorization']
          assert morph['authorized'] is False
          assert morph['closure']=='canonical/IRIS_V5_STAGE13_FROZEN_MASK_MORPHOLOGY_CLOSURE_20260924.json'
          assert morph['optimizer_steps_executed']==0
          assert morph['parameter_updates_executed']==0
          owner=ontology['zero_surface_owner_diagnostic_authorization']
          assert owner['authorized'] is False
          assert owner['closure']=='canonical/IRIS_V5_ZERO_SURFACE_OWNER_DIAGNOSTIC_CLOSURE_20260924.json'
          longh=ontology['long_horizon_training_authorization']
          assert longh['authorized'] is False
          assert longh['closure']=='canonical/IRIS_V5_TP64_LONG_HORIZON_LOW_LR_CLOSURE_20260924.json'
          bc=ontology['bc_endpoint_training_authorization']
          assert bc['authorized'] is False
          field_diag=ontology['field_failure_diagnostic_authorization']
