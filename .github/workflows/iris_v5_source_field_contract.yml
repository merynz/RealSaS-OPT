          assert owner_prereg['execution']['rerasterization_permitted'] is False
          assert owner_prereg['measurements']['all_points_exact_not_sampled'] is True
          assert owner_prereg['decision_rule']['automatic_route_authorization'] is False
          assert longh_prereg['status']=='FROZEN_BEFORE_LONG_HORIZON_OPTIMIZER_STEP_1'
          assert longh_prereg['execution']['code_repo_commit']=='54a18d5353c6d39f383b823c019c25336fbadaef'
          assert longh_prereg['execution']['notebook_sha256']=='ef2dde3de7b97af5d7da7d1782ebac72b3e9a83f07daf0fafe8c04c27bc1cc4d'
          assert [x['id'] for x in longh_prereg['required_arms']]==[
              'A0_CONTINUE_DIRECT_FSTAR_ONLY',
              'B_DIRECT_FSTAR_PLUS_NEAR_ZERO_SIGN',
              'C_DIRECT_FSTAR_PLUS_SOURCE_SILHOUETTE',
              'D_DIRECT_FSTAR_PLUS_SIGN_AND_SILHOUETTE',
