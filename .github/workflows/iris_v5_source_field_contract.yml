          assert auth['exact_r512_and_stage13_checkpoint_selection_blind'] is True

          c=target['exact_target_contract']
          assert c['required_view_count']==8
          assert c['required_resolution']==1024
          assert c['signed_2d']=='EDT(background)-EDT(foreground)'
          assert c['projection']['raster_cell_support']=='0<=sx<=RES AND 0<=sy<=RES'
