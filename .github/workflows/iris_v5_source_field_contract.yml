          assert shell_prereg['execution']['repo_commit']=='77cd81ffe6389a5c078f267ae2a1458f2a953459'
          assert shell_prereg['execution']['notebook_sha256']=='1215f809dd6f519ecf51a4eaa90aea3826f8d5123f296b511f092cf4490ba0ec'
          assert shell_prereg['execution']['optimizer_steps_permitted']==0
          assert shell_prereg['execution']['parameter_updates_permitted']==0
          assert shell_prereg['execution']['stage13_qualification_permitted'] is False
          assert requal_prereg['status']=='FROZEN_BEFORE_REQUALIFICATION_EXECUTION'
          assert requal_prereg['execution']['code_repo_commit']=='b39b5f13e2657553692c7a8b27db62b20332e279'
          assert requal_prereg['execution']['code_ci_run_id']==35986938283
          assert requal_prereg['execution']['code_ci_conclusion']=='success'
          assert requal_prereg['execution']['notebook_sha256']=='370ce75c128e20bd503ce3a9d34b2dbe57962dc94cb48d17c694bc8a4671b2ca'
          assert requal_prereg['execution']['optimizer_steps_permitted']==0
          assert requal_prereg['execution']['parameter_updates_permitted']==0
          assert requal_prereg['stage13']['profile']=='P999'
          assert requal_prereg['stage13']['threshold_change'] is False
          assert requal_prereg['stage13']['checkpoint_selection_feedback_forbidden'] is True
          assert morph_prereg['status']=='FROZEN_BEFORE_DIAGNOSTIC_EXECUTION'
          assert morph_prereg['execution']['diagnostic_repo_commit']=='ba4fcb6b3320f1590583e75d85d485aa01d7dc90'
          assert morph_prereg['execution']['code_ci_run_id']==35992552613
          assert morph_prereg['execution']['code_ci_conclusion']=='success'
          assert morph_prereg['execution']['notebook_sha256']=='76f2feb13ee136350ea348a52d577597a40b3dc8dadd250016bafd14617d4d56'
          assert morph_prereg['execution']['optimizer_steps_permitted']==0
          assert morph_prereg['execution']['parameter_updates_permitted']==0
          assert morph_prereg['execution']['rerasterization_permitted'] is False
