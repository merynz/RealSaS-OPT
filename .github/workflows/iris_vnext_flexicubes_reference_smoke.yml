name: iris-vnext-flexicubes-reference-smoke

on:
  push:
    branches:
      - agent/unified-iris-stdgenpp-foundation
    paths:
      - 'tools/corpus/fit8_f_flexicubes_reference_adapter_v1.py'
      - 'tools/corpus/run_fit8_f_flexicubes_reference_v1.py'
      - 'tools/corpus/make_flexicubes_reference_smoke_bundle_v1.py'
      - 'tools/corpus/verify_flexicubes_reference_smoke_v1.py'
      - 'tests/corpus/test_fit8_f_flexicubes_reference_adapter_v1.py'
      - '.github/workflows/iris_vnext_flexicubes_reference_smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-upstream-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout RealSaS research branch
        uses: actions/checkout@v4

      - name: Checkout exact FlexiCubes reference
        uses: actions/checkout@v4
        with:
          repository: nv-tlabs/FlexiCubes
          ref: 4cc7d6c3d0cee83c011ce36721b81adff0dd7db6
          path: external/flexicubes

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements/mainline-ci.txt
            requirements/torch-cpu.txt

      - name: Install smoke dependencies
        run: |
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
          python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt

      - name: Compile reference adapter and runner
        run: |
          python -m compileall -q \
            tools/corpus/fit8_f_flexicubes_reference_adapter_v1.py \
            tools/corpus/run_fit8_f_flexicubes_reference_v1.py \
            tools/corpus/make_flexicubes_reference_smoke_bundle_v1.py \
            tools/corpus/verify_flexicubes_reference_smoke_v1.py \
            tests/corpus/test_fit8_f_flexicubes_reference_adapter_v1.py

      - name: Run adapter guards
        run: |
          python -m pytest -q tests/corpus/test_fit8_f_flexicubes_reference_adapter_v1.py

      - name: Build analytic closed-surface input bundle
        run: |
          mkdir -p .artifacts/flexicubes-smoke
          python -m tools.corpus.make_flexicubes_reference_smoke_bundle_v1 \
            --resolution 16 \
            --output-npz .artifacts/flexicubes-smoke/input.npz \
            --output-manifest .artifacts/flexicubes-smoke/input.json

      - name: Execute exact upstream FlexiCubes
        run: |
          python -m tools.corpus.run_fit8_f_flexicubes_reference_v1 \
            --bundle-npz .artifacts/flexicubes-smoke/input.npz \
            --bundle-manifest .artifacts/flexicubes-smoke/input.json \
            --upstream-root external/flexicubes \
            --output-npz .artifacts/flexicubes-smoke/candidate.npz \
            --output-manifest .artifacts/flexicubes-smoke/run.json \
            --device cpu

      - name: Verify physical sphere topology
        run: |
          python -m tools.corpus.verify_flexicubes_reference_smoke_v1 \
            --candidate-npz .artifacts/flexicubes-smoke/candidate.npz \
            --run-manifest .artifacts/flexicubes-smoke/run.json

      - name: Preserve exact upstream execution bytes
        run: |
          mkdir -p .artifacts/flexicubes-smoke/upstream
          cp external/flexicubes/flexicubes.py .artifacts/flexicubes-smoke/upstream/flexicubes.py
          cp external/flexicubes/tables.py .artifacts/flexicubes-smoke/upstream/tables.py
          git -C external/flexicubes rev-parse HEAD > .artifacts/flexicubes-smoke/upstream/commit.txt
          git -C external/flexicubes hash-object flexicubes.py tables.py > .artifacts/flexicubes-smoke/upstream/blob_shas.txt
          sha256sum external/flexicubes/flexicubes.py external/flexicubes/tables.py > .artifacts/flexicubes-smoke/upstream/file_sha256.txt

      - name: Upload smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: iris-vnext-flexicubes-reference-smoke
          path: .artifacts/flexicubes-smoke/
          if-no-files-found: error
          retention-days: 7
