name: iris-vnext-pretraining-candidate-source-gate-v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/iris_vnext_fit8_pretraining_candidate_self_hosted_v1.yml'
      - '.github/workflows/iris_vnext_pretraining_candidate_source_gate_v1.yml'
      - 'tools/iris_vnext/build_fit8_boundary_causality_v1.py'
      - 'tools/iris_vnext/migrate_v8_relation_head_v2.py'
      - 'tools/iris_vnext/verify_fit8_candidate_roundtrip_v1.py'
      - 'tools/iris_vnext/seal_fit8_pretraining_materialization_v1.py'
      - 'tools/iris_vnext/audit_fit8_pretraining_readiness_v1.py'
      - 'tests/repository/test_vnext_fit8_self_hosted_workflow_safety_v2.py'
  push:
    branches: [research/iris-vnext-post-v8-quality-plan-20261018]
    paths:
      - '.github/workflows/iris_vnext_fit8_pretraining_candidate_self_hosted_v1.yml'
      - '.github/workflows/iris_vnext_pretraining_candidate_source_gate_v1.yml'
      - 'tools/iris_vnext/build_fit8_boundary_causality_v1.py'
      - 'tools/iris_vnext/migrate_v8_relation_head_v2.py'
      - 'tools/iris_vnext/verify_fit8_candidate_roundtrip_v1.py'
      - 'tools/iris_vnext/seal_fit8_pretraining_materialization_v1.py'
      - 'tools/iris_vnext/audit_fit8_pretraining_readiness_v1.py'
      - 'tests/repository/test_vnext_fit8_self_hosted_workflow_safety_v2.py'
  workflow_dispatch:

concurrency:
  group: iris-vnext-pretraining-candidate-source-gate-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements/mainline-ci.txt
            requirements/torch-cpu.txt
      - name: Install focused dependencies
        run: |
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
          python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt
      - name: Compile pretraining candidate machinery
        run: |
          python -m py_compile \
            tools/iris_vnext/build_fit8_boundary_causality_v1.py \
            tools/iris_vnext/migrate_v8_relation_head_v2.py \
            tools/iris_vnext/verify_fit8_candidate_roundtrip_v1.py \
            tools/iris_vnext/seal_fit8_pretraining_materialization_v1.py \
            tools/iris_vnext/audit_fit8_pretraining_readiness_v1.py
      - name: Safety and pretraining-boundary contracts
        run: |
          python -m pytest -q tests/repository/test_vnext_fit8_self_hosted_workflow_safety_v2.py
      - name: Summary
        run: |
          echo 'IRIS_VNEXT_PRETRAINING_CANDIDATE_SOURCE_GATE_PASS'
          echo 'quarantined_remote_write=false'
          echo 'candidate_remote=exact_source_sha_scoped'
          echo 'v8_relation_migration=exact_authority_artifact_zero_training_steps'
          echo 'truth_materialization=relation_v2_plus_boundary_causality_v1'
          echo 'training_entry=preregistration_and_readiness_required'
