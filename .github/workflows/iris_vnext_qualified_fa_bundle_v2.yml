name: iris-vnext-qualified-fa-bundle-v2

on:
  push:
    branches:
      - agent/unified-iris-stdgenpp-foundation
    paths:
      - 'tools/corpus/fit8_f_qualified_fa_bundle_v1.py'
      - 'tools/corpus/fit8_f_qualified_fa_bundle_v2.py'
      - 'tools/corpus/fit8_f_geometry_teacher_slice_v1.py'
      - 'tools/corpus/fit8_f_reference_input_bundle_contract_v2.py'
      - 'tools/corpus/fit8_f_extraction_scale_manifest_v1.py'
      - 'tests/corpus/test_fit8_f_qualified_fa_bundle_v1.py'
      - 'tests/corpus/test_fit8_f_qualified_fa_bundle_v2.py'
      - 'tests/corpus/test_fit8_f_geometry_teacher_slice_v1.py'
      - 'tests/corpus/test_fit8_f_reference_input_bundle_contract_v2.py'
      - 'tests/corpus/test_fit8_f_extraction_scale_manifest_v1.py'
      - '.github/workflows/iris_vnext_qualified_fa_bundle_v2.yml'
  pull_request:
    paths:
      - 'tools/corpus/fit8_f_qualified_fa_bundle_v1.py'
      - 'tools/corpus/fit8_f_qualified_fa_bundle_v2.py'
      - 'tools/corpus/fit8_f_geometry_teacher_slice_v1.py'
      - 'tools/corpus/fit8_f_reference_input_bundle_contract_v2.py'
      - 'tools/corpus/fit8_f_extraction_scale_manifest_v1.py'
      - 'tests/corpus/test_fit8_f_qualified_fa_bundle_v1.py'
      - 'tests/corpus/test_fit8_f_qualified_fa_bundle_v2.py'
      - 'tests/corpus/test_fit8_f_geometry_teacher_slice_v1.py'
      - 'tests/corpus/test_fit8_f_reference_input_bundle_contract_v2.py'
      - 'tests/corpus/test_fit8_f_extraction_scale_manifest_v1.py'
      - '.github/workflows/iris_vnext_qualified_fa_bundle_v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualified-fa-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/mainline-ci.txt
      - name: Install deterministic court dependencies
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Compile qualified F_A authority contracts
        run: |
          python -m compileall -q \
            tools/corpus/fit8_f_qualified_fa_bundle_v1.py \
            tools/corpus/fit8_f_qualified_fa_bundle_v2.py \
            tools/corpus/fit8_f_geometry_teacher_slice_v1.py \
            tools/corpus/fit8_f_reference_input_bundle_contract_v2.py \
            tools/corpus/fit8_f_extraction_scale_manifest_v1.py \
            tests/corpus/test_fit8_f_qualified_fa_bundle_v1.py \
            tests/corpus/test_fit8_f_qualified_fa_bundle_v2.py \
            tests/corpus/test_fit8_f_geometry_teacher_slice_v1.py \
            tests/corpus/test_fit8_f_reference_input_bundle_contract_v2.py \
            tests/corpus/test_fit8_f_extraction_scale_manifest_v1.py
      - name: Run qualified F_A authority guards
        run: |
          python -m pytest -q \
            tests/corpus/test_fit8_f_qualified_fa_bundle_v1.py \
            tests/corpus/test_fit8_f_qualified_fa_bundle_v2.py \
            tests/corpus/test_fit8_f_geometry_teacher_slice_v1.py \
            tests/corpus/test_fit8_f_reference_input_bundle_contract_v2.py \
            tests/corpus/test_fit8_f_extraction_scale_manifest_v1.py
