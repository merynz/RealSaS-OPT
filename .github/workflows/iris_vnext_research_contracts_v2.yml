name: iris-vnext-research-contracts-v2

on:
  push:
    branches:
      - agent/unified-iris-stdgenpp-foundation
    paths:
      - 'models/iris/vnext/**'
      - 'tools/corpus/fit8_f_representation_capacity_court_v2.py'
      - 'tools/corpus/fit8_f_matched_physical_court_v1.py'
      - 'tools/corpus/fit8_f_geometry_backend_contract_v1.py'
      - 'tools/corpus/fit8_f_geometry_measurement_protocol_v1.py'
      - 'tools/corpus/fit8_f_scalar_admission_v1.py'
      - 'tools/corpus/fit8_f_sheet_chart_contract_v1.py'
      - 'tools/corpus/fit8_f_sheet_chart_contract_v2.py'
      - 'tools/corpus/fit8_f_chart_lattice_oracle_v1.py'
      - 'tools/corpus/fit8_f_flexicubes_reference_adapter_v1.py'
      - 'tools/corpus/fit8_f_reference_input_bundle_contract_v1.py'
      - 'tools/corpus/fit8_f_reference_dense_grid_authority_v1.py'
      - 'tools/corpus/run_fit8_f_flexicubes_reference_v2.py'
      - 'tools/corpus/run_fit8_f_flexicubes_reference_v3.py'
      - 'tools/corpus/fit8_mesh_field_teacher_v1.py'
      - 'tools/corpus/fit8_mesh_field_teacher_v2.py'
      - 'tests/iris/test_unified_iris_contracts_v2.py'
      - 'tests/iris/test_unified_iris_field_heads_v2.py'
      - 'tests/iris/test_retopology_contract_v2.py'
      - 'tests/corpus/test_fit8_f_representation_capacity_court_v2.py'
      - 'tests/corpus/test_fit8_f_matched_physical_court_v1.py'
      - 'tests/corpus/test_fit8_f_geometry_backend_contract_v1.py'
      - 'tests/corpus/test_fit8_f_geometry_measurement_protocol_v1.py'
      - 'tests/corpus/test_fit8_f_scalar_admission_v1.py'
      - 'tests/corpus/test_fit8_f_sheet_chart_contract_v1.py'
      - 'tests/corpus/test_fit8_f_sheet_chart_contract_v2.py'
      - 'tests/corpus/test_fit8_f_chart_lattice_oracle_v1.py'
      - 'tests/corpus/test_fit8_f_flexicubes_reference_adapter_v1.py'
      - 'tests/corpus/test_fit8_f_reference_input_bundle_contract_v1.py'
      - 'tests/corpus/test_fit8_f_reference_dense_grid_authority_v1.py'
      - 'tests/corpus/test_run_fit8_f_flexicubes_reference_v3.py'
      - 'tests/corpus/test_fit8_mesh_field_teacher_v2.py'
      - '.github/workflows/iris_vnext_research_contracts_v2.yml'
  pull_request:
    paths:
      - 'models/iris/vnext/**'
      - 'tools/corpus/fit8_f_representation_capacity_court_v2.py'
      - 'tools/corpus/fit8_f_matched_physical_court_v1.py'
      - 'tools/corpus/fit8_f_geometry_backend_contract_v1.py'
      - 'tools/corpus/fit8_f_geometry_measurement_protocol_v1.py'
      - 'tools/corpus/fit8_f_scalar_admission_v1.py'
      - 'tools/corpus/fit8_f_sheet_chart_contract_v1.py'
      - 'tools/corpus/fit8_f_sheet_chart_contract_v2.py'
      - 'tools/corpus/fit8_f_chart_lattice_oracle_v1.py'
      - 'tools/corpus/fit8_f_flexicubes_reference_adapter_v1.py'
      - 'tools/corpus/fit8_f_reference_input_bundle_contract_v1.py'
      - 'tools/corpus/fit8_f_reference_dense_grid_authority_v1.py'
      - 'tools/corpus/run_fit8_f_flexicubes_reference_v2.py'
      - 'tools/corpus/run_fit8_f_flexicubes_reference_v3.py'
      - 'tools/corpus/fit8_mesh_field_teacher_v1.py'
      - 'tools/corpus/fit8_mesh_field_teacher_v2.py'
      - 'tests/iris/test_unified_iris_contracts_v2.py'
      - 'tests/iris/test_unified_iris_field_heads_v2.py'
      - 'tests/iris/test_retopology_contract_v2.py'
      - 'tests/corpus/test_fit8_f_representation_capacity_court_v2.py'
      - 'tests/corpus/test_fit8_f_matched_physical_court_v1.py'
      - 'tests/corpus/test_fit8_f_geometry_backend_contract_v1.py'
      - 'tests/corpus/test_fit8_f_geometry_measurement_protocol_v1.py'
      - 'tests/corpus/test_fit8_f_scalar_admission_v1.py'
      - 'tests/corpus/test_fit8_f_sheet_chart_contract_v1.py'
      - 'tests/corpus/test_fit8_f_sheet_chart_contract_v2.py'
      - 'tests/corpus/test_fit8_f_chart_lattice_oracle_v1.py'
      - 'tests/corpus/test_fit8_f_flexicubes_reference_adapter_v1.py'
      - 'tests/corpus/test_fit8_f_reference_input_bundle_contract_v1.py'
      - 'tests/corpus/test_fit8_f_reference_dense_grid_authority_v1.py'
      - 'tests/corpus/test_run_fit8_f_flexicubes_reference_v3.py'
      - 'tests/corpus/test_fit8_mesh_field_teacher_v2.py'
      - '.github/workflows/iris_vnext_research_contracts_v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements/mainline-ci.txt
            requirements/torch-cpu.txt
      - name: Install research contract dependencies
        run: |
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
          python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt
      - name: Compile vNext research contracts
        run: |
          python -m compileall -q \
            models/iris/vnext/contracts_v2.py \
            models/iris/vnext/field_heads_v2.py \
            models/iris/vnext/retopology_contract_v2.py \
            tools/corpus/fit8_f_representation_capacity_court_v2.py \
            tools/corpus/fit8_f_matched_physical_court_v1.py \
            tools/corpus/fit8_f_geometry_backend_contract_v1.py \
            tools/corpus/fit8_f_geometry_measurement_protocol_v1.py \
            tools/corpus/fit8_f_scalar_admission_v1.py \
            tools/corpus/fit8_f_sheet_chart_contract_v1.py \
            tools/corpus/fit8_f_sheet_chart_contract_v2.py \
            tools/corpus/fit8_f_chart_lattice_oracle_v1.py \
            tools/corpus/fit8_f_flexicubes_reference_adapter_v1.py \
            tools/corpus/fit8_f_reference_input_bundle_contract_v1.py \
            tools/corpus/fit8_f_reference_dense_grid_authority_v1.py \
            tools/corpus/run_fit8_f_flexicubes_reference_v2.py \
            tools/corpus/run_fit8_f_flexicubes_reference_v3.py \
            tools/corpus/fit8_mesh_field_teacher_v1.py \
            tools/corpus/fit8_mesh_field_teacher_v2.py \
            tests/iris/test_unified_iris_contracts_v2.py \
            tests/iris/test_unified_iris_field_heads_v2.py \
            tests/iris/test_retopology_contract_v2.py \
            tests/corpus/test_fit8_f_representation_capacity_court_v2.py \
            tests/corpus/test_fit8_f_matched_physical_court_v1.py \
            tests/corpus/test_fit8_f_geometry_backend_contract_v1.py \
            tests/corpus/test_fit8_f_geometry_measurement_protocol_v1.py \
            tests/corpus/test_fit8_f_scalar_admission_v1.py \
            tests/corpus/test_fit8_f_sheet_chart_contract_v1.py \
            tests/corpus/test_fit8_f_sheet_chart_contract_v2.py \
            tests/corpus/test_fit8_f_chart_lattice_oracle_v1.py \
            tests/corpus/test_fit8_f_flexicubes_reference_adapter_v1.py \
            tests/corpus/test_fit8_f_reference_input_bundle_contract_v1.py \
            tests/corpus/test_fit8_f_reference_dense_grid_authority_v1.py \
            tests/corpus/test_run_fit8_f_flexicubes_reference_v3.py \
            tests/corpus/test_fit8_mesh_field_teacher_v2.py
      - name: Run vNext research contract tests
        run: |
          python -m pytest -q \
            tests/iris/test_unified_iris_contracts_v2.py \
            tests/iris/test_unified_iris_field_heads_v2.py \
            tests/iris/test_retopology_contract_v2.py \
            tests/corpus/test_fit8_f_representation_capacity_court_v2.py \
            tests/corpus/test_fit8_f_matched_physical_court_v1.py \
            tests/corpus/test_fit8_f_geometry_backend_contract_v1.py \
            tests/corpus/test_fit8_f_geometry_measurement_protocol_v1.py \
            tests/corpus/test_fit8_f_scalar_admission_v1.py \
            tests/corpus/test_fit8_f_sheet_chart_contract_v1.py \
            tests/corpus/test_fit8_f_sheet_chart_contract_v2.py \
            tests/corpus/test_fit8_f_chart_lattice_oracle_v1.py \
            tests/corpus/test_fit8_f_flexicubes_reference_adapter_v1.py \
            tests/corpus/test_fit8_f_reference_input_bundle_contract_v1.py \
            tests/corpus/test_fit8_f_reference_dense_grid_authority_v1.py \
            tests/corpus/test_run_fit8_f_flexicubes_reference_v3.py \
            tests/corpus/test_fit8_mesh_field_teacher_v2.py
