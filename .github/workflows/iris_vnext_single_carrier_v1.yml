name: iris-vnext-single-carrier-v1
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: iris-vnext-single-carrier-v1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vnext-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
      REALSAS_FLEXICUBES_ROOT: /tmp/realsas-flexicubes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements/mainline-ci.txt
            requirements/torch-cpu.txt
      - name: Install focused dependencies
        run: |
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
          python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpng-dev zlib1g-dev
      - name: Pin Apache-2.0 FlexiCubes source
        run: |
          git clone --filter=blob:none https://github.com/nv-tlabs/FlexiCubes.git "$REALSAS_FLEXICUBES_ROOT"
          git -C "$REALSAS_FLEXICUBES_ROOT" checkout --detach 4cc7d6c3d0cee83c011ce36721b81adff0dd7db6
          test "$(git -C "$REALSAS_FLEXICUBES_ROOT" rev-parse HEAD)" = "4cc7d6c3d0cee83c011ce36721b81adff0dd7db6"
      - name: IRIS vNext model, teacher and batched Fit8 contracts
        run: python -m pytest -q tests/iris/test_iris_vnext_v1.py tests/iris/test_graphics_truth_v1.py tests/iris/test_iris_vnext_fit8_cohort_v1.py
      - name: Single-carrier mechanics, Graphics and DAG contracts
        run: python -m pytest -q tests/compiler/test_vnext_single_carrier_graphics_v1.py tests/repository/test_vnext_architecture_contract_v1.py tests/repository/test_vnext_execution_graph_v1.py tests/repository/test_vnext_fit8_preparation_contract_v1.py
      - name: Native Graphics ordering contract
        run: |
          g++ -std=c++17 -O2 runtime/realsas_cpp/tests/graphics_v1_contract_test.cpp -o /tmp/realsas_graphics_v1_test
          /tmp/realsas_graphics_v1_test
      - name: Build Graphics-authorized native player
        run: |
          g++ -std=c++17 -O2 runtime/realsas_cpp/src/runtime_v2_graphics_reference.cpp -lpng -lz -o /tmp/realsas_graphics_v1_player
      - name: RSS to native Graphics behavior E2E
        env:
          REALSAS_GRAPHICS_V1_PLAYER: /tmp/realsas_graphics_v1_player
        run: python -m pytest -q tests/compiler/test_vnext_graphics_native_e2e.py
      - name: Preserve decoder regressions
        run: python -m pytest -q tests/iris/test_iris_scene_topology_head_v1.py tests/models/test_tessa_v1.py
      - name: Summary
        run: |
          echo 'IRIS_VNEXT_SINGLE_CARRIER_ENGINEERING_CONTRACT_PASS'
          echo 'candidate_mesh_authority=proposal_only'
          echo 'canonical_M_G_W_count=1'
          echo 'independent_visual_mesh=false'
          echo 'graphics_runtime_hash_only_binding=false'
          echo 'native_graphics_rss_behavior_consumed=true'
          echo 'semantic_taxonomy=false'
          echo 'fit8_batch_subjects=8'
          echo 'fit8_shared_scene_encodes_per_optimizer_step=1'
          echo 'fit8_subject_serial_model_forward=false'
          echo 'fit8_active_trainer=IRISVNextFit8TrainerV2'
          echo 'fit8_exact_input_binding_required=true'
          echo 'fit8_preparation_receipt_required=true'
          echo 'a100_preflight_scientific_fit=false'
          echo 'flexicubes_commit=4cc7d6c3d0cee83c011ce36721b81adff0dd7db6'
          echo 'fit8_scientific_pass_claimed=false'
