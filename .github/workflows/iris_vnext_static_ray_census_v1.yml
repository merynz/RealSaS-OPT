name: iris-vnext-static-ray-census-v1

on:
  push:
    branches:
      - agent/unified-iris-stdgenpp-foundation
    paths:
      - 'tools/corpus/fit8_static_ray_census_v1.py'
      - 'tools/corpus/fit8_static_draw_order_capacity_court_v1.py'
      - 'tools/corpus/fit8_gltf_static_carrier_v1.py'
      - 'tools/corpus/fit8_fbx_static_carrier_v1.py'
      - 'tools/corpus/fit8_fbx_static_carrier_v2.py'
      - 'tools/corpus/build_ufbx_static_census_probe_v3.py'
      - 'tools/corpus/ufbx_static_census_probe_v3.c'
      - 'tools/corpus/gltf_bind_scene_v1.py'
      - 'tools/corpus/fit8_render_vertex_equivalence_v1.py'
      - 'tools/corpus/fit8_polygon_triangulation_qualification_v1.py'
      - 'tools/corpus/fit8_surface_topology_invariants_v1.py'
      - 'tools/corpus/fit8_rendered_mechanical_census_contract_v1.py'
      - 'tests/corpus/test_fit8_static_ray_census_v1.py'
      - 'tests/corpus/test_fit8_static_draw_order_capacity_court_v1.py'
      - 'tests/corpus/test_fit8_gltf_static_carrier_v1.py'
      - 'tests/corpus/test_fit8_fbx_static_carrier_v1.py'
      - '.github/workflows/iris_vnext_static_ray_census_v1.yml'
  pull_request:
    paths:
      - 'tools/corpus/fit8_static_ray_census_v1.py'
      - 'tools/corpus/fit8_static_draw_order_capacity_court_v1.py'
      - 'tools/corpus/fit8_gltf_static_carrier_v1.py'
      - 'tools/corpus/fit8_fbx_static_carrier_v1.py'
      - 'tools/corpus/fit8_fbx_static_carrier_v2.py'
      - 'tools/corpus/build_ufbx_static_census_probe_v3.py'
      - 'tools/corpus/ufbx_static_census_probe_v3.c'
      - 'tools/corpus/gltf_bind_scene_v1.py'
      - 'tools/corpus/fit8_render_vertex_equivalence_v1.py'
      - 'tools/corpus/fit8_polygon_triangulation_qualification_v1.py'
      - 'tools/corpus/fit8_surface_topology_invariants_v1.py'
      - 'tools/corpus/fit8_rendered_mechanical_census_contract_v1.py'
      - 'tests/corpus/test_fit8_static_ray_census_v1.py'
      - 'tests/corpus/test_fit8_static_draw_order_capacity_court_v1.py'
      - 'tests/corpus/test_fit8_gltf_static_carrier_v1.py'
      - 'tests/corpus/test_fit8_fbx_static_carrier_v1.py'
      - '.github/workflows/iris_vnext_static_ray_census_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-ray-census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/mainline-ci.txt
      - name: Install dependencies
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Compile static ray census
        run: |
          python -m compileall -q \
            tools/corpus/fit8_static_ray_census_v1.py \
            tools/corpus/fit8_static_draw_order_capacity_court_v1.py \
            tools/corpus/fit8_gltf_static_carrier_v1.py \
            tools/corpus/fit8_fbx_static_carrier_v1.py \
            tools/corpus/fit8_fbx_static_carrier_v2.py \
            tools/corpus/build_ufbx_static_census_probe_v3.py \
            tests/corpus/test_fit8_static_ray_census_v1.py \
            tests/corpus/test_fit8_static_draw_order_capacity_court_v1.py \
            tests/corpus/test_fit8_gltf_static_carrier_v1.py \
            tests/corpus/test_fit8_fbx_static_carrier_v1.py
      - name: Run static carrier and ray census guards
        run: |
          python -m pytest -q \
            tests/corpus/test_fit8_gltf_static_carrier_v1.py \
            tests/corpus/test_fit8_fbx_static_carrier_v1.py \
            tests/corpus/test_fit8_static_ray_census_v1.py \
            tests/corpus/test_fit8_static_draw_order_capacity_court_v1.py
      - name: Package exact producer source snapshot
        run: |
          mkdir -p /tmp/static-ray-producer/tools/corpus
          cp tools/corpus/fit8_static_ray_census_v1.py /tmp/static-ray-producer/tools/corpus/
          cp tools/corpus/fit8_rendered_mechanical_census_contract_v1.py /tmp/static-ray-producer/tools/corpus/
          cp tools/corpus/fit8_static_draw_order_capacity_court_v1.py /tmp/static-ray-producer/tools/corpus/
          printf '%s\n' "$GITHUB_SHA" > /tmp/static-ray-producer/commit.txt
          sha256sum \
            /tmp/static-ray-producer/tools/corpus/fit8_static_ray_census_v1.py \
            /tmp/static-ray-producer/tools/corpus/fit8_rendered_mechanical_census_contract_v1.py \
            /tmp/static-ray-producer/tools/corpus/fit8_static_draw_order_capacity_court_v1.py \
            > /tmp/static-ray-producer/file_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: static-ray-producer-source
          path: /tmp/static-ray-producer
          if-no-files-found: error
          retention-days: 7
