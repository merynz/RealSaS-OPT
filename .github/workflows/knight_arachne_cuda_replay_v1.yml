name: knight-arachne-cuda-replay-v1
on:
  push:
    branches: [audit/canonical-caa-mechanics-geometry-lock-20261002]
    paths:
      - tools/audit_arachne_precision_replay_v1.py
      - tools/inference/query_chunked_sdpa_v1.py
      - tests/compiler/test_query_chunked_sdpa_v1.py
      - .github/workflows/knight_arachne_cuda_replay_v1.yml
permissions:
  contents: read
jobs:
  cuda-replay:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '4'
      ARM: /home/monster/realsas_model_cache/arachne_uniform_all_projected_63e589b67946
      ARM_REMOTE: gdrive:RealSaS_SUBJECT2_KNIGHT_DEMO_V2_20260924/ARACHNE_V6_COVERAGE_SAMPLING_2X2_INDEXSPACE_FIXED_20260929/ARMS/UNIFORM_ALL_PROJECTED
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify complete attention is preserved by query partitioning
        run: /home/monster/realsas-ml312/bin/python -m pytest -q tests/compiler/test_query_chunked_sdpa_v1.py
      - name: Restore and verify corrected checkpoint
        run: |
          mkdir -p "$ARM"
          for FILE in ARACHNE_KNIGHT_V6_RESULT.json ARACHNE_KNIGHT_V6_MODEL_FINAL_FP32.pt; do
            if [ ! -f "$ARM/$FILE" ]; then
              rclone copyto "$ARM_REMOTE/$FILE" "$ARM/$FILE.partial" --checksum
              mv "$ARM/$FILE.partial" "$ARM/$FILE"
            fi
          done
          printf '%s  %s\n' 0a73240d2278a69fe24d1b6a8ebf185dbe8556a0bd17b7d4c70731ff558be31f "$ARM/ARACHNE_KNIGHT_V6_RESULT.json" | sha256sum --check
          printf '%s  %s\n' 63e589b679461daf7cf859eb0c10e4b5f9c285b055d18f114d0ba348f2829892 "$ARM/ARACHNE_KNIGHT_V6_MODEL_FINAL_FP32.pt" | sha256sum --check
      - name: Fixed original surface and rig CUDA precision replay without fitting
        run: |
          /home/monster/realsas-ml312/bin/python tools/audit_arachne_precision_replay_v1.py \
            --authority-root /home/monster/realsas_authority --run-id SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929 \
            --fit-run /home/monster/realsas_authority/runs/SUBJECT2_KNIGHT_DEMO_V2_20260924 \
            --arm-dir "$ARM" --device cuda --cuda-query-chunk 128 --readout-chunk 1024 \
            --out-dir /tmp/knight_arachne_cuda_replay_${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knight-arachne-cuda-replay-v1
          path: /tmp/knight_arachne_cuda_replay_${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
