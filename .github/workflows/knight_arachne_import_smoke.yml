name: knight-arachne-import-smoke

on:
  push:
    branches: [demo/knight-arachne-v5-20260925]
    paths:
      - '.github/workflows/knight_arachne_import_smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Discover usable Python
        shell: bash
        run: |
          set -euxo pipefail
          which -a python python3 || true
          find "$HOME" -maxdepth 4 -type f \( -name python -o -name python3 \) 2>/dev/null | head -80 || true
          for p in \
            python3 python \
            "$HOME/miniconda3/bin/python" "$HOME/anaconda3/bin/python" \
            "$HOME/.venv/bin/python" "$HOME/venv/bin/python"; do
            if command -v "$p" >/dev/null 2>&1 || [ -x "$p" ]; then
              echo "TRY=$p"
              "$p" - <<'PY' || true
          import sys
          print(sys.executable, sys.version)
          for m in ("numpy","torch"):
              try:
                  x=__import__(m); print(m,getattr(x,"__version__","?"))
              except Exception as e: print(m,"FAIL",repr(e))
          PY
            fi
          done
