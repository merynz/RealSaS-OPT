name: knight-arachne-stage17-stage18-repair-child-v1

on:
  workflow_dispatch:
  push:
    branches: [research/vf11-certified-adaptive-20260921]
    paths:
      - 'tools/audit_knight_arachne_stage17_stage18_repair_child_v1.py'
      - 'compiler/realsas_compiler_core/mechanical_repartition_v2.py'
      - 'tests/compiler/test_mechanical_repartition_v2.py'
      - '.github/workflows/knight_arachne_stage17_stage18_repair_child_v1.yml'

concurrency:
  group: knight-arachne-stage17-stage18-repair-child-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  court:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 45
    env:
      AUTHORITY_ROOT: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_DEMO_V2_20260924
      A100_AUDIT_REMOTE: gdrive:RealSaS_SUBJECT2_KNIGHT_DEMO_V2_20260924/ARACHNE_V6_COVERAGE_SAMPLING_2X2_INDEXSPACE_FIXED_20260929/ARACHNE_V6_2X2_INDEXSPACE_FIXED_RESULT_AUDIT.json
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Syntax and focused contracts
        run: |
          set -euo pipefail
          python -m py_compile tools/audit_knight_arachne_stage17_stage18_repair_child_v1.py
          python -m pytest -q             tests/compiler/test_mechanical_repartition_v2.py             tests/compiler/test_holeless_partitioned_dense_candidate_v1.py
      - name: Run coverage repair children
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          rclone copyto "$A100_AUDIT_REMOTE" "$work/a100_audit.json" --checksum
          outroot="canonical/knight_arachne_stage17_stage18_repair_child_v1"
          rm -rf "$outroot"; mkdir -p "$outroot"
          arms=(UNIFORM_ALL_PROJECTED ACTIVE_BALANCED_ALL_PROJECTED)
          for arm in "${arms[@]}"; do
            skin="canonical/knight_arachne_v6_2x2_rebound_stage35_v1/$arm.QUALIFIED_SKIN.json"
            directive="canonical/knight_arachne_v6_2x2_rebound_stage35_v1/$arm.REPARTITION_DIRECTIVE.json"
            rebound="canonical/knight_arachne_v6_2x2_rebound_stage35_v1/$arm.REPORT.json"
            test -s "$skin"; test -s "$directive"; test -s "$rebound"
            mkdir -p "$outroot/$arm"
            PYTHONPATH=. python tools/audit_knight_arachne_stage17_stage18_repair_child_v1.py               --authority-root "$AUTHORITY_ROOT"               --run-id "$RUN_ID"               --arm "$arm"               --skin-json "$skin"               --directive-json "$directive"               --a100-audit-json "$work/a100_audit.json"               --rebound-report-json "$rebound"               --out-dir "$outroot/$arm"               | tee "$outroot/$arm.STDOUT.txt"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("canonical/knight_arachne_stage17_stage18_repair_child_v1")
          arms=("UNIFORM_ALL_PROJECTED","ACTIVE_BALANCED_ALL_PROJECTED")
          rows={}
          for arm in arms:
              x=json.loads((root/arm/"report.json").read_text())
              assert x["status"]=="COMPLETE__NO_PARENT_MUTATION"
              rows[arm]={
                "authorization_hash":x["authorization"]["authorization_hash"],
                "child":x["child"],
                "post_repair_g3b":x["post_repair_g3b"],
                "post_repair_synthetic_stress":x["post_repair_synthetic_stress"],
                "post_repair_actual_motion":x["post_repair_actual_motion"],
                "invariants":x["invariants"],
              }
          summary={
              "schema":"RealSaS.KnightArachneStage17Stage18RepairChildCourt.v1.Summary",
              "status":"COMPLETE__NO_PARENT_MUTATION",
              "arms":rows,
              "selection_policy":[
                "No child is promoted from pre-repair Arachne metrics alone.",
                "Prefer a child that preserves zero face deletion/rest area and materially closes post-repair G3B plus actual-motion catastrophic tails.",
                "Parent run mutation is forbidden in this court."
              ],
          }
          Path("canonical/KNIGHT_ARACHNE_STAGE17_STAGE18_REPAIR_CHILD_COURT_V1_20260929.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print("KNIGHT_ARACHNE_REPAIR_CHILD_SUMMARY="+json.dumps({
              a:{
                "components":rows[a]["child"]["component_count"],
                "separate":rows[a]["child"]["separate_boundary_count"],
                "faces":rows[a]["child"]["face_count"],
                "g3b_unsafe":rows[a]["post_repair_g3b"]["unsafe_face_count"],
                "stress_unsafe":rows[a]["post_repair_synthetic_stress"]["unsafe_face_count"],
                "motion_gt10":rows[a]["post_repair_actual_motion"]["max_edge_gt_10"],
                "motion_gt4":rows[a]["post_repair_actual_motion"]["max_edge_gt_4"],
                "motion_worst":rows[a]["post_repair_actual_motion"]["worst_edge_max"],
                "face_deletion":rows[a]["invariants"]["face_deletion_count"],
                "area_error":rows[a]["invariants"]["rest_area_relative_error"],
              } for a in arms
          },sort_keys=True))
          PY
      - name: Seal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name realsas-self-hosted-runner
          git config user.email runner@realsas.local
          git add canonical/KNIGHT_ARACHNE_STAGE17_STAGE18_REPAIR_CHILD_COURT_V1_20260929.json                   canonical/knight_arachne_stage17_stage18_repair_child_v1
          git commit -m 'audit: seal corrected Arachne Stage17/18 repair child court'
          git fetch origin research/vf11-certified-adaptive-20260921
          git rebase origin/research/vf11-certified-adaptive-20260921
          git push origin HEAD:research/vf11-certified-adaptive-20260921
