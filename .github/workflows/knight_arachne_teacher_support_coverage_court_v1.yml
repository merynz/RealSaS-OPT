name: knight-arachne-teacher-support-coverage-court-v1

on:
  workflow_dispatch:
  push:
    branches: [research/vf11-certified-adaptive-20260921]
    paths:
      - 'tools/audit_knight_arachne_teacher_support_coverage_court_v1.py'
      - 'canonical/KNIGHT_ARACHNE_TEACHER_SUPPORT_COVERAGE_COURT_PREREG_V1_20260929.json'
      - '.github/workflows/knight_arachne_teacher_support_coverage_court_v1.yml'

concurrency:
  group: knight-arachne-teacher-support-coverage-court-v1
  cancel-in-progress: true

permissions: {contents: write}

jobs:
  court:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 15
    env:
      V5_HANDOFF: gdrive:RealSaS_SUBJECT2_KNIGHT_DEMO_V2_20260924/ARACHNE_STAGE31_V5_DEMO_HANDOFF
      GEP_HANDOFF: gdrive:RealSaS_SUBJECT2_KNIGHT_DEMO_V2_20260924/GEPPETTO_STAGE27_MECHANICALLY_MEANINGFUL_V2_HANDOFF
      EXPECTED_BANK_SHA256: 26b6891ff81b9bfc3405461394159547fa76b417852a44518425b4e1de7e67d3
      EXPECTED_TARGET_SHA256: 26d4d5411b14b23b894f0351ab08fc2da2b18d8fb3ac4776b25b8b2434b4bbc1
      EXPECTED_REPORT_SHA256: c629a40c6f357f30f143d57752a442185bed68ac3cabc473255a88e9b6acb1b7
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        run: python -m pip install --no-input --progress-bar off numpy
      - name: Fetch and verify sealed teacher artifacts
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          echo "$tmp" >/tmp/arachne_support_coverage_tmp
          rclone copyto "$V5_HANDOFF/ARACHNE_KNIGHT_TEACHER_BANK_FIX2.npz" "$tmp/bank.npz" --checksum
          rclone copyto "$GEP_HANDOFF/teacher_target_v2.npz" "$tmp/target.npz" --checksum
          rclone copyto "$GEP_HANDOFF/teacher_target_v2_report.json" "$tmp/target_report.json" --checksum
          test "$(sha256sum "$tmp/bank.npz" | awk '{print $1}')" = "$EXPECTED_BANK_SHA256"
          test "$(sha256sum "$tmp/target.npz" | awk '{print $1}')" = "$EXPECTED_TARGET_SHA256"
          test "$(sha256sum "$tmp/target_report.json" | awk '{print $1}')" = "$EXPECTED_REPORT_SHA256"
      - name: Run support coverage court
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(cat /tmp/arachne_support_coverage_tmp)"
          PYTHONPATH=. python tools/audit_knight_arachne_teacher_support_coverage_court_v1.py             --teacher-bank "$tmp/bank.npz"             --target-npz "$tmp/target.npz"             --target-report "$tmp/target_report.json"             --out canonical/KNIGHT_ARACHNE_TEACHER_SUPPORT_COVERAGE_COURT_V1_20260929.json             | tee /tmp/arachne_support_coverage.txt
      - name: Seal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p canonical/knight_arachne_teacher_support_coverage_court_v1
          cp /tmp/arachne_support_coverage.txt canonical/knight_arachne_teacher_support_coverage_court_v1/AUDIT_STDOUT.txt
          git config user.name realsas-self-hosted-runner
          git config user.email runner@realsas.local
          git add canonical/KNIGHT_ARACHNE_TEACHER_SUPPORT_COVERAGE_COURT_V1_20260929.json canonical/knight_arachne_teacher_support_coverage_court_v1/AUDIT_STDOUT.txt
          git commit -m 'research: seal Arachne teacher support coverage court'
          git fetch origin research/vf11-certified-adaptive-20260921
          git rebase origin/research/vf11-certified-adaptive-20260921
          git push origin HEAD:research/vf11-certified-adaptive-20260921
