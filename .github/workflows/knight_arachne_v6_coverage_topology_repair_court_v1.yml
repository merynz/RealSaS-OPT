name: knight-arachne-v6-coverage-topology-repair-court-v1

on:
  workflow_dispatch:
  push:
    branches: [research/vf11-certified-adaptive-20260921]
    paths:
      - 'canonical/KNIGHT_ARACHNE_V6_2X2_REBOUND_STAGE35_COURT_V1_20260929.json'

concurrency:
  group: knight-arachne-v6-coverage-topology-repair-court-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  court:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 120
    env:
      AUTHORITY_ROOT: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_DEMO_V2_20260924
      DRIVE_ROOT: gdrive:RealSaS_SUBJECT2_KNIGHT_DEMO_V2_20260924/ARACHNE_V6_COVERAGE_SAMPLING_2X2_INDEXSPACE_FIXED_20260929/ARMS
      OLD_SKEL: gdrive:RealSaS_SUBJECT2_KNIGHT_DEMO_V2_20260924/ARACHNE_STAGE31_V5_DEMO_HANDOFF/FINAL_QUALIFIED_SKELETON_IR.json
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Syntax and focused seam contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/audit_knight_arachne_v6_coverage_topology_repair_court_v1.py
          python -m pytest -q tests/compiler/test_holeless_partitioned_dense_candidate_v1.py tests/compiler/test_mechanical_repartition_v2.py tests/compiler/test_skin_topology_repartition_directive_v2.py
      - name: Execute two preregistered coverage repair arms
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          rclone copyto "$OLD_SKEL" "$work/old_skeleton.json" --checksum
          mkdir -p canonical/knight_arachne_v6_coverage_topology_repair_court_v1
          arms=(UNIFORM_ALL_PROJECTED ACTIVE_BALANCED_ALL_PROJECTED)
          for arm in "${arms[@]}"; do
            mkdir -p "$work/$arm"
            rclone copyto "$DRIVE_ROOT/$arm/ARACHNE_KNIGHT_V6_CANONICAL_SKIN_WEIGHTS_F64.npz" "$work/$arm/weights.npz" --checksum
            PYTHONPATH=. python tools/audit_knight_arachne_v6_coverage_topology_repair_court_v1.py               --authority-root "$AUTHORITY_ROOT"               --run-id "$RUN_ID"               --arm "$arm"               --weights-npz "$work/$arm/weights.npz"               --old-skeleton-json "$work/old_skeleton.json"               --a100-audit-json canonical/KNIGHT_ARACHNE_V6_2X2_INDEXSPACE_FIXED_RESULT_AUDIT_V1_20260929.json               --prereg-json canonical/KNIGHT_ARACHNE_V6_COVERAGE_TOPOLOGY_REPAIR_COURT_PREREG_V1_20260929.json               --work-dir "$work/$arm/artifacts"               --out "$work/$arm/report.json"               | tee "canonical/knight_arachne_v6_coverage_topology_repair_court_v1/$arm.STDOUT.txt"
            cp "$work/$arm/report.json" "canonical/knight_arachne_v6_coverage_topology_repair_court_v1/$arm.REPORT.json"
          done

          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("canonical/knight_arachne_v6_coverage_topology_repair_court_v1")
          arms=("UNIFORM_ALL_PROJECTED","ACTIVE_BALANCED_ALL_PROJECTED")
          rows={a:json.loads((root/f"{a}.REPORT.json").read_text()) for a in arms}
          eligible=[
              a for a in arms
              if rows[a]["final_g3b"]["passed"] is True
              and rows[a]["final_g3"]["passed"] is True
          ]
          def key(a):
              agg=rows[a]["actual_motion"]["final"]["aggregate"]
              return (
                  int(agg["max_edge_gt_10"]),
                  int(agg["max_edge_gt_4"]),
                  float(agg["worst_edge_max"]),
                  int(rows[a]["repairs_used"]),
                  a,
              )
          selected=None if not eligible else sorted(eligible,key=key)[0]
          report={
              "schema":"RealSaS.KnightArachneV6CoverageTopologyRepairCourt.v1",
              "status":"COMPLETE",
              "preregistration":"canonical/KNIGHT_ARACHNE_V6_COVERAGE_TOPOLOGY_REPAIR_COURT_PREREG_V1_20260929.json",
              "arms":{
                  a:{
                      "reliability_evidence_hash":rows[a]["reliability_evidence_hash"],
                      "repair_closed_within_budget":rows[a]["repair_closed_within_budget"],
                      "repairs_used":rows[a]["repairs_used"],
                      "final_topology":rows[a]["final_topology"],
                      "final_g3b":rows[a]["final_g3b"],
                      "final_g3":rows[a]["final_g3"],
                      "actual_motion":rows[a]["actual_motion"],
                      "compiler_requalification":rows[a]["compiler_requalification"],
                  } for a in arms
              },
              "eligible_for_mainline_replay":eligible,
              "selected_for_mainline_replay":selected,
              "selection_key":None if selected is None else list(key(selected)),
              "claim_boundary":[
                  "Selection follows the preregistered G3/G3B closure and actual-motion lexicographic rule.",
                  "This court mutates no product run state.",
                  "The selected arm, if any, still requires actual mainline Stage17/18 replay and requalification through Stage35.",
              ],
          }
          Path("canonical/KNIGHT_ARACHNE_V6_COVERAGE_TOPOLOGY_REPAIR_COURT_V1_20260929.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print("KNIGHT_ARACHNE_V6_COVERAGE_TOPOLOGY_REPAIR_COURT="+json.dumps({
              "selected":selected,
              "eligible":eligible,
              "arms":{
                  a:{
                      "repairs":rows[a]["repairs_used"],
                      "g3b_pass":rows[a]["final_g3b"]["passed"],
                      "g3b_unsafe":rows[a]["final_g3b"]["unsafe_face_count"],
                      "g3_pass":rows[a]["final_g3"]["passed"],
                      "g3_failures":rows[a]["final_g3"]["failure_invariants"],
                      "baseline_motion":rows[a]["actual_motion"]["baseline"]["aggregate"],
                      "final_motion":rows[a]["actual_motion"]["final"]["aggregate"],
                      "faces":rows[a]["final_topology"]["face_count"],
                      "vertices":rows[a]["final_topology"]["vertex_count"],
                  } for a in arms
              },
          },sort_keys=True))
          PY
      - name: Seal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name realsas-self-hosted-runner
          git config user.email runner@realsas.local
          git add canonical/KNIGHT_ARACHNE_V6_COVERAGE_TOPOLOGY_REPAIR_COURT_V1_20260929.json                   canonical/knight_arachne_v6_coverage_topology_repair_court_v1
          git commit -m 'audit: seal corrected Arachne coverage topology repair court'
          git fetch origin research/vf11-certified-adaptive-20260921
          git rebase origin/research/vf11-certified-adaptive-20260921
          git push origin HEAD:research/vf11-certified-adaptive-20260921
