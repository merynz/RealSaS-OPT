name: knight-atlas-carrier-first-c2-v1

on:
  push:
    branches: [impl/carrier-first-mechanical-compilation-20261004]
    paths:
      - tools/audit_knight_atlas_carrier_first_c2_v1.py
      - compiler/realsas_compiler_core/mechanical_carrier_evidence_v1.py
      - canonical/ATLAS_MIRA_COMPILER_MECHANICAL_COHERENCE_EXECUTION_PLAN_V1.md
      - .github/workflows/knight_atlas_carrier_first_c2_v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  court:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "4"
      PY: /home/monster/realsas-ml312/bin/python
      AUTH: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929
      FIT_RUN: /home/monster/realsas_authority/runs/SUBJECT2_KNIGHT_DEMO_V2_20260924
      OUT: /home/monster/realsas_research_scratch/atlas_carrier_first_c2_${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preflight frozen environment and inputs
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$pythonLocation/lib:${LD_LIBRARY_PATH:-}"
          test -x "$PY"
          test -f "$FIT_RUN/artifacts/27_GEPPETTO_FIT/model_fit_execution.json"
          test -f "$AUTH/runs/$RUN_ID/artifacts/15_RIGGING_SURFACE_QUALIFIED/qualified_rigging_surface.json"
          test -f "$AUTH/runs/$RUN_ID/artifacts/18_CANONICAL_MESH_ADDRESSING_BUILD/canonical_mesh_candidate.json"
          test -f "$AUTH/runs/$RUN_ID/artifacts/19_STATIC_CANONICAL_MESH_QUALIFIED/static_canonical_mesh_qualification.json"
          "$PY" - <<'PY'
          import torch, numpy
          print("PYTHON_ENV_PASS", torch.__version__, torch.version.cuda, torch.cuda.is_available(), numpy.__version__, flush=True)
          if not torch.cuda.is_available():
              raise SystemExit("CUDA_NOT_AVAILABLE")
          PY
          "$PY" -m py_compile             tools/audit_knight_atlas_carrier_first_c2_v1.py             compiler/realsas_compiler_core/mechanical_carrier_evidence_v1.py
          echo "ATLAS_C2_PREFLIGHT_PASS"

      - name: Frozen ATLAS carrier-first compatibility court
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$pythonLocation/lib:${LD_LIBRARY_PATH:-}"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          "$PY" -u tools/audit_knight_atlas_carrier_first_c2_v1.py             --authority-root "$AUTH"             --run-id "$RUN_ID"             --fit-run "$FIT_RUN"             --out-dir "$OUT"             --device cuda             --seed 11             --max-steps 128

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knight-atlas-carrier-first-c2-v1
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
