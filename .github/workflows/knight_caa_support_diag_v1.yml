name: knight-caa-support-diag-v1

on:
  push:
    branches: [ops/knight-latest-visual-probe-20261010]
    paths: ['.github/workflows/knight_caa_support_diag_v1.yml']

permissions:
  contents: read

jobs:
  diag:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: ops/knight-latest-visual-probe-20261010, fetch-depth: 1, clean: true}
      - name: Count unsupported source topology IDs and coefficient mass
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          PY=/home/monster/realsas_platform/current/bin/realsas-python
          "$PY" - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter,defaultdict
          from compiler.realsas_compiler_core.artifact_codec_v2 import canonical_mesh_candidate_from_dict,rigging_surface_from_dict
          root=Path('/home/monster/realsas_authority/runs/KNIGHT_LATEST_CURRENT_CAA_VISUAL_20261010')
          seed=Path('/home/monster/realsas_authority/runs/SUBJECT2_KNIGHT_CORRECTED_MECHANICAL_CAA_HARMONIC_FIRST_IMMUTABLE_RECOVERED_V1_643714DE')
          cand=canonical_mesh_candidate_from_dict(json.loads((root/'artifacts/18_CANONICAL_MESH_ADDRESSING_BUILD/../../../KNIGHT_LATEST_CARRIER_MATERIALIZATION_20261010/rebound_candidate.json').resolve().read_text())) if False else canonical_mesh_candidate_from_dict(json.loads(Path('/home/monster/realsas_authority/runs/KNIGHT_LATEST_CARRIER_MATERIALIZATION_20261010/rebound_candidate.json').read_text()))
          surface=rigging_surface_from_dict(json.loads(Path('/home/monster/realsas_authority/imports/knight_latest_carrier_20261010/qualified_rigging_surface.json').read_text()))
          prov_path=Path('/home/monster/realsas_authority/runs/SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929/artifacts/15_RIGGING_SURFACE_QUALIFIED/compacted_dense_face_provenance.json')
          prov=json.loads(prov_path.read_text())
          face_ids={str(x) for f in prov.get('compact_faces') or () for x in f}
          surface_ids={str(n.surface_id) for n in surface.surface_nodes}
          all_support=set(); unknown=Counter(); unknown_mass=defaultdict(float); affected=0; max_missing_mass=0.0; total_missing_mass=0.0
          examples=[]
          for v in cand.vertices:
            miss=[]; mass=0.0
            for sid,w in v.support_binding.coefficients:
              sid=str(sid); w=float(w); all_support.add(sid)
              if sid not in face_ids and w>0:
                unknown[sid]+=1; unknown_mass[sid]+=w; miss.append((sid,w)); mass+=w
            if miss:
              affected+=1; total_missing_mass+=mass; max_missing_mass=max(max_missing_mass,mass)
              if len(examples)<12: examples.append({'vertex':str(v.candidate_vertex_id),'component':str(v.component_id),'missing':miss,'all':list(v.support_binding.coefficients)})
          print('SURFACE_NODE_COUNT',len(surface_ids))
          print('COMPACT_FACE_COUNT',len(prov.get('compact_faces') or ()))
          print('FACE_REFERENCED_SURFACE_ID_COUNT',len(face_ids))
          print('SURFACE_NODES_NOT_IN_FACES',len(surface_ids-face_ids))
          print('SUPPORT_ID_COUNT',len(all_support))
          print('SUPPORT_IDS_NOT_IN_FACES',len(all_support-face_ids))
          print('SUPPORT_IDS_NOT_IN_SURFACE',len(all_support-surface_ids))
          print('AFFECTED_CARRIER_VERTICES',affected,'OF',len(cand.vertices))
          print('TOTAL_MISSING_COEFF_MASS',total_missing_mass)
          print('MAX_VERTEX_MISSING_MASS',max_missing_mass)
          print('TOP_UNKNOWN',json.dumps([{'sid':sid,'rows':n,'mass':unknown_mass[sid]} for sid,n in unknown.most_common(20)],sort_keys=True))
          print('EXAMPLES',json.dumps(examples,sort_keys=True))
          # degree in exact compact-face edge graph for absent ids is necessarily zero;
          # report whether all missing ids are legitimate Stage15 nodes.
          print('ALL_MISSING_ARE_STAGE15_NODES',set(unknown).issubset(surface_ids))
          PY
