name: knight-caa-support-diag-v1

on:
  push:
    branches: [ops/knight-latest-visual-probe-20261010]
    paths: ['.github/workflows/knight_caa_support_diag_v1.yml']

permissions:
  contents: read

jobs:
  diag:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: ops/knight-latest-visual-probe-20261010, fetch-depth: 1, clean: true}
      - name: Prove exact-face-supported component authority after orphan exclusion
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          PY=/home/monster/realsas_platform/current/bin/realsas-python
          "$PY" - <<'PY'
          import json
          from pathlib import Path
          from compiler.realsas_compiler_core.artifact_codec_v2 import canonical_mesh_candidate_from_dict
          cand=canonical_mesh_candidate_from_dict(json.loads(Path('/home/monster/realsas_authority/runs/KNIGHT_LATEST_CARRIER_MATERIALIZATION_20261010/rebound_candidate.json').read_text()))
          prov=json.loads(Path('/home/monster/realsas_authority/runs/SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929/artifacts/15_RIGGING_SURFACE_QUALIFIED/compacted_dense_face_provenance.json').read_text())
          faces=[tuple(map(str,f)) for f in prov.get('compact_faces') or ()]
          ids=sorted({x for f in faces for x in f})
          parent={x:x for x in ids}
          def find(x):
            while parent[x]!=x:
              parent[x]=parent[parent[x]]; x=parent[x]
            return x
          def union(a,b):
            ra,rb=find(a),find(b)
            if ra==rb:return
            if ra<rb: parent[rb]=ra
            else: parent[ra]=rb
          for a,b,c in faces: union(a,b); union(b,c); union(c,a)
          roots=sorted({find(x) for x in ids}); ri={r:i for i,r in enumerate(roots)}; comp={x:ri[find(x)] for x in ids}
          vertex_comp={}; orphan_vertices=[]; orphan_ids=set(); no_face_support=[]; multi=[]
          for v in cand.vertices:
            admitted=[]; orphan=[]
            for sid,w in v.support_binding.coefficients:
              sid=str(sid); w=float(w)
              if w<=0: continue
              if sid in comp: admitted.append((sid,w,comp[sid]))
              else: orphan.append((sid,w)); orphan_ids.add(sid)
            cs={x[2] for x in admitted}
            if not admitted: no_face_support.append(str(v.candidate_vertex_id))
            if len(cs)>1: multi.append({'vertex':str(v.candidate_vertex_id),'components':sorted(cs),'admitted':admitted,'orphan':orphan})
            if orphan: orphan_vertices.append({'vertex':str(v.candidate_vertex_id),'components':sorted(cs),'admitted':admitted,'orphan':orphan})
            if len(cs)==1: vertex_comp[str(v.candidate_vertex_id)]=next(iter(cs))
          face_cross=[]
          for i,f in enumerate(cand.faces):
            cs={vertex_comp.get(str(v)) for v in f}
            if None in cs or len(cs)!=1:
              face_cross.append({'face':i,'ids':list(map(str,f)),'components':sorted(str(x) for x in cs)})
          print('SOURCE_COMPONENT_COUNT',len(roots))
          print('ORPHAN_ID_COUNT',len(orphan_ids),sorted(orphan_ids))
          print('ORPHAN_VERTEX_COUNT',len(orphan_vertices))
          print('NO_EXACT_FACE_SUPPORT_VERTEX_COUNT',len(no_face_support))
          print('MULTI_EXACT_COMPONENT_VERTEX_COUNT',len(multi))
          print('FACE_CROSS_COMPONENT_COUNT_AFTER_ORPHAN_EXCLUSION',len(face_cross))
          print('ORPHAN_VERTICES',json.dumps(orphan_vertices,sort_keys=True))
          print('MULTI',json.dumps(multi[:20],sort_keys=True))
          print('FACE_CROSS_SAMPLE',json.dumps(face_cross[:20],sort_keys=True))
          assert len(no_face_support)==0
          assert len(multi)==0
          assert len(face_cross)==0
          print('ORPHAN_EXCLUSION_TOPOLOGY_PROOF=PASS')
          PY
