name: knight-canonical-caa-mechanics-geometry-lock-v1

on:
  push:
    branches:
      - audit/canonical-caa-mechanics-geometry-lock-20261002
    paths:
      - tools/audit_knight_canonical_caa_mechanics_geometry_lock_v1.py
      - .github/workflows/knight_canonical_caa_mechanics_geometry_lock_v1.yml
  workflow_dispatch:

concurrency:
  group: knight-canonical-caa-mechanics-geometry-lock-v1
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 60
    env:
      AUTHORITY_ROOT: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929
      CORRECTED_SKIN: canonical/knight_arachne_v6_2x2_rebound_stage35_v1/UNIFORM_ALL_PROJECTED.QUALIFIED_SKIN.json
      OUT_DIR: /tmp/knight_canonical_caa_mechanics_geometry_lock_v1
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Compile audit
        run: python -m py_compile tools/audit_knight_canonical_caa_mechanics_geometry_lock_v1.py tools/demo/build_knight_corrected_mechanical_caa_stage23_immutable_v1.py
      - name: Rebuild fresh immutable Stage23 from exact corrected parent
        shell: bash
        run: |
          set -euo pipefail
          short="$(printf '%s' "$GITHUB_SHA" | cut -c1-8)"
          caa_id="SUBJECT2_KNIGHT_CAA_LOCK_STAGE23_${short}"
          echo "CAA_RUN_ID=$caa_id" >> "$GITHUB_ENV"
          rm -rf "$AUTHORITY_ROOT/runs/$caa_id"
          PYTHONPATH=. python tools/demo/build_knight_corrected_mechanical_caa_stage23_immutable_v1.py \
            --authority-root "$AUTHORITY_ROOT" \
            --parent-run-id "$RUN_ID" \
            --child-run-id "$caa_id"
          test -f "$AUTHORITY_ROOT/runs/$caa_id/IMMUTABLE_STAGE23_SEAL.json"
      - name: Run exact current-code mechanics geometry lock
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          python tools/audit_knight_canonical_caa_mechanics_geometry_lock_v1.py             --authority-root "$AUTHORITY_ROOT"             --run-id "$RUN_ID"             --caa-run-id "$CAA_RUN_ID"             --corrected-skin-json "$CORRECTED_SKIN"             --out "$OUT_DIR/REPORT.json"
      - name: Print compact verdict
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads((Path(os.environ["OUT_DIR"])/"REPORT.json").read_text())
          print(json.dumps({
              "status":p["status"],
              "candidate":p["candidate_lineage_hash"],
              "skin":p["skin_lineage_hash"],
              "static":p["static_topology"],
              "source_fidelity_passed":p["stage19_source_fidelity"]["passed"],
              "corrected_skin_identity":p["corrected_skin_identity"],
              "g3":p["g3"],
              "motion":p["actual_motion"]["aggregate"],
              "caa_binding":p["exact_caa_render_binding"],
              "verdict":p["verdict"],
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: knight-canonical-caa-mechanics-geometry-lock-v1
          path: /tmp/knight_canonical_caa_mechanics_geometry_lock_v1/REPORT.json
          if-no-files-found: error
          retention-days: 30