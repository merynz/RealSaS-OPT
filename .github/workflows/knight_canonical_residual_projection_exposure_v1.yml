name: knight-canonical-residual-projection-exposure-v1

on:
  push:
    branches:
      - audit/knight-rest-visual-owner-20260930
    paths:
      - tools/audit_knight_canonical_residual_projection_exposure_v1.py
      - .github/workflows/knight_canonical_residual_projection_exposure_v1.yml

concurrency:
  group: knight-canonical-residual-projection-exposure-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 25
    env:
      AUTHORITY_ROOT: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_CORRECTED_MECHANICAL_CAA_HARMONIC_FIRST_IMMUTABLE_V1_70CBD671
      OUT: canonical/KNIGHT_CANONICAL_RESIDUAL_PROJECTION_EXPOSURE_V1_20260930.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Execute residual projection exposure audit
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/audit_knight_canonical_residual_projection_exposure_v1.py
          PYTHONPATH=. python tools/audit_knight_canonical_residual_projection_exposure_v1.py \
            --authority-root "$AUTHORITY_ROOT" \
            --run-id "$RUN_ID" \
            --out "$OUT"
      - name: Seal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "realsas-self-hosted-runner"
          git config user.email "runner@realsas.local"
          git add "$OUT"
          git commit -m "audit: seal residual Knight projection exposure"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
