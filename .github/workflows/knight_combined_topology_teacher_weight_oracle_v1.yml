name: knight-combined-topology-teacher-weight-oracle-v1

on:
  workflow_dispatch:
  push:
    branches:
      - research/vf11-certified-adaptive-20260921
    paths:
      - 'tools/audit_knight_combined_topology_teacher_weight_oracle_v1.py'
      - '.github/workflows/knight_combined_topology_teacher_weight_oracle_v1.yml'

concurrency:
  group: knight-combined-topology-teacher-weight-oracle-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    env:
      AUTHORITY_ROOT: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_DEMO_V2_20260924
      V5_HANDOFF: gdrive:RealSaS_SUBJECT2_KNIGHT_DEMO_V2_20260924/ARACHNE_STAGE31_V5_DEMO_HANDOFF
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        run: python -m pip install --no-input --progress-bar off numpy scipy
      - name: Fetch teacher artifacts
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          echo "$tmp" >/tmp/combined_oracle_tmp
          rclone copyto "$V5_HANDOFF/ARACHNE_KNIGHT_TEACHER_BANK_FIX2.npz" "$tmp/bank.npz" --checksum
          rclone copyto "$V5_HANDOFF/KNIGHT_EVALUATED_TEACHER_SOURCE.npz" "$tmp/source.npz" --checksum
      - name: Run combined oracle
        run: |
          set -euo pipefail
          tmp="$(cat /tmp/combined_oracle_tmp)"
          PYTHONPATH=. python tools/audit_knight_combined_topology_teacher_weight_oracle_v1.py             --authority-root "$AUTHORITY_ROOT"             --run-id "$RUN_ID"             --bank "$tmp/bank.npz"             --source "$tmp/source.npz"             --out canonical/KNIGHT_COMBINED_TOPOLOGY_TEACHER_WEIGHT_ORACLE_V1_20260928.json             | tee /tmp/combined_oracle.txt
      - name: Seal
        run: |
          set -euo pipefail
          mkdir -p canonical/knight_combined_topology_teacher_weight_oracle_v1
          cp /tmp/combined_oracle.txt canonical/knight_combined_topology_teacher_weight_oracle_v1/AUDIT_STDOUT.txt
          git config user.name realsas-self-hosted-runner
          git config user.email runner@realsas.local
          git add canonical/KNIGHT_COMBINED_TOPOLOGY_TEACHER_WEIGHT_ORACLE_V1_20260928.json canonical/knight_combined_topology_teacher_weight_oracle_v1
          git commit -m 'audit: seal combined topology and teacher-weight oracle'
          git fetch origin research/vf11-certified-adaptive-20260921
          git rebase origin/research/vf11-certified-adaptive-20260921
          git push origin HEAD:research/vf11-certified-adaptive-20260921
