name: knight-continuous-visual-binding-audit-v1
on:
  push:
    branches: [research/vf11-certified-adaptive-20260921]
    paths:
      - 'compiler/realsas_compiler_core/visual_mesh_arap_v1.py'
      - 'tools/demo/render_knight_source_owned_mechanical_binding_v1.py'
      - '.github/workflows/knight_continuous_visual_binding_audit_v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 15
    env:
      RUN_ROOT: /home/monster/realsas_authority/runs/SUBJECT2_KNIGHT_DEMO_V2_20260924
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Unit proof
        run: python -m pytest -q tests/compiler/test_visual_mesh_arap_v1.py
      - name: Measure Knight continuous binding
        shell: bash
        run: |
          python - <<'PY'
          import json, os, numpy as np
          from pathlib import Path
          from compiler.realsas_compiler_core.artifact_codec_v2 import (
              canonical_mesh_candidate_from_dict, qualified_camera_set_from_dict,
              qualified_observation_set_from_dict,
          )
          from compiler.realsas_compiler_core.visual_mesh_arap_v1 import (
              build_visual_mesh_from_mask, bind_source_visual_points_to_projected_surface_v1,
          )
          from compiler.realsas_compiler_services.orchestrator.adapters.appearance_v2 import _load_source_inputs
          from tools.demo.render_knight_motion_preview_v1 import _ctx
          from tools.demo.render_knight_visual_mesh_arap_witness_v1 import _candidate_face_indices
          root=Path(os.environ["RUN_ROOT"])
          ctx=_ctx(root.parents[1], root.name)
          candidate=canonical_mesh_candidate_from_dict(json.loads((root/"artifacts/18_CANONICAL_MESH_ADDRESSING_BUILD/canonical_mesh_candidate.json").read_text()))
          cameras=qualified_camera_set_from_dict(json.loads((root/"artifacts/05_CAMERA_CONTRACT_SOLVED/qualified_camera_set.json").read_text()))
          obs=qualified_observation_set_from_dict(json.loads((root/"artifacts/07_OBSERVATION_CONTRACT_QUALIFIED/qualified_observation_set.json").read_text()))
          cams=tuple(sorted(cameras.cameras,key=lambda c:int(c.view_index)))
          rgba,masks=_load_source_inputs(ctx,obs)
          rest=np.asarray([v.P for v in candidate.vertices],float)
          faces=_candidate_face_indices(candidate)
          for vi in (0,2):
              mesh=build_visual_mesh_from_mask(np.asarray(masks[vi],bool),target_edge_px=16)
              r=bind_source_visual_points_to_projected_surface_v1(
                  points_source_xy=mesh.positions,
                  mechanical_positions_xyz=rest,
                  mechanical_faces=faces,
                  camera=cams[vi],
              )
              valid=np.asarray(r["valid"],bool)
              print("CONTINUOUS_BIND",json.dumps({
                  "view":vi,"visual_vertices":len(mesh.positions),
                  "bound":int(valid.sum()),"fraction":float(valid.mean()),
                  "unbound":int((~valid).sum()),
              },sort_keys=True))
          PY
