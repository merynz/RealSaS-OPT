name: knight-corrected-mechanical-caa-diagnostic-render-v1

on:
  workflow_dispatch:
  push:
    branches: [research/vf11-certified-adaptive-20260921]
    paths:
      - 'tools/demo/render_knight_corrected_mechanical_caa_stage23_diagnostic_v1.py'
      - '.github/workflows/knight_corrected_mechanical_caa_diagnostic_render_v1.yml'

concurrency:
  group: knight-corrected-mechanical-caa-diagnostic-render-v1
  cancel-in-progress: false

jobs:
  render:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 8
    env:
      AUTHORITY_ROOT: /home/monster/realsas_authority
      SOURCE_RUN_ID: SUBJECT2_KNIGHT_CORRECTED_MECHANICAL_CAA_IMMUTABLE_V1_20260929_195329Z
      CONSUMER_RUN_ID: SUBJECT2_KNIGHT_CORRECTED_MECHANICAL_CAA_DIAGNOSTIC_RENDER_V1_20260929_201638Z
      OUT_DIR: /tmp/knight_corrected_mechanical_caa_diagnostic_render
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Verify diagnostic renderer and frozen baseline
        run: |
          set -euo pipefail
          test "$(git hash-object tools/demo/frozen/render_knight_motion_preview_v1_7917be02.py)" = "7917be02f325ba00b5dcd2b31a786898e45f640f"
          python -m py_compile tools/demo/render_knight_corrected_mechanical_caa_stage23_diagnostic_v1.py
      - name: Measure Stage24 and render diagnostic corrected GIFs
        run: |
          set -euo pipefail
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          PYTHONPATH=. python tools/demo/render_knight_corrected_mechanical_caa_stage23_diagnostic_v1.py             --authority-root "$AUTHORITY_ROOT"             --source-run-id "$SOURCE_RUN_ID"             --consumer-run-id "$CONSUMER_RUN_ID"             --out-dir "$OUT_DIR"
      - name: Upload corrected diagnostic GIFs
        uses: actions/upload-artifact@v4
        with:
          name: knight-corrected-mechanical-caa-diagnostic-render-v1
          path: |
            /tmp/knight_corrected_mechanical_caa_diagnostic_render/*.gif
            /tmp/knight_corrected_mechanical_caa_diagnostic_render/REPORT.json
            /tmp/knight_corrected_mechanical_caa_diagnostic_render/frozen_renderer/*.png
            /tmp/knight_corrected_mechanical_caa_diagnostic_render/frozen_renderer/*.json
          if-no-files-found: error
          retention-days: 7
