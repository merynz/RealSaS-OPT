name: knight-corrected-mechanical-caa-stage23-immutable-v1

on:
  workflow_dispatch:
  push:
    branches: [research/vf11-certified-adaptive-20260921]
    paths:
      - 'tools/demo/build_knight_corrected_mechanical_caa_stage23_immutable_v1.py'
      - '.github/workflows/knight_corrected_mechanical_caa_stage23_immutable_v1.yml'

concurrency:
  group: knight-corrected-mechanical-caa-stage23-immutable-v1
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 12
    env:
      AUTHORITY_ROOT: /home/monster/realsas_authority
      PARENT_RUN_ID: SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929
      CHILD_RUN_ID: SUBJECT2_KNIGHT_CORRECTED_MECHANICAL_CAA_IMMUTABLE_V1_20260929_195329Z
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Verify producer and CAA regressions
        run: |
          set -euo pipefail
          python -m py_compile             tools/demo/build_knight_corrected_mechanical_caa_stage23_immutable_v1.py             compiler/realsas_compiler_core/appearance_compile_v2.py             compiler/realsas_compiler_services/orchestrator/adapters/appearance_v2.py
          PYTHONPATH=. python -m pytest -q tests/compiler/test_visibility_and_caa_v2.py
      - name: Build and seal immutable Stage23
        run: |
          set -euo pipefail
          PYTHONPATH=. python tools/demo/build_knight_corrected_mechanical_caa_stage23_immutable_v1.py             --authority-root "$AUTHORITY_ROOT"             --parent-run-id "$PARENT_RUN_ID"             --child-run-id "$CHILD_RUN_ID"
