name: knight-corrected-source-owned-deformation-regions-forensic-v1

on:
  push:
    branches:
      - integration/final-main-knight-platform-20261002
      - main
      - repair/visual-triangle-deformation-domain-20261002
    paths:
      - .github/workflows/knight_corrected_source_owned_deformation_regions_forensic_v1.yml

concurrency:
  group: knight-corrected-source-owned-deformation-regions-forensic-v1
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  proof:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 35
    env:
      AUTHORITY_ROOT: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_CORRECTED_MECHANICAL_CAA_HARMONIC_FIRST_IMMUTABLE_V1_70CBD671
      OUT_DIR: canonical/knight_corrected_source_owned_deformation_regions_forensic_v1
      PLAYER: /tmp/realsas_native_visual_mesh_corrected_forensic_v1
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Build native source-owned renderer
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -pedantic \
            tools/demo/native_visual_mesh_preview_v1.cpp -lpng -lz -o "$PLAYER"
      - name: Run corrected source-owned forensic proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT_DIR"
          python -m tools.demo.render_knight_source_owned_deformation_regions_v1 \
            --authority-root "$AUTHORITY_ROOT" \
            --parent-run-id "$RUN_ID" \
            --out-dir "$OUT_DIR" \
            --native-player "$PLAYER" \
            --render-resolution 512
      - name: Summarize
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("canonical/knight_corrected_source_owned_deformation_regions_forensic_v1/REPORT.json").read_text())
          print("OWNER", json.dumps(p["ownership"], sort_keys=True))
          for v in p["views"]:
              print("VIEW",v["view_index"],"regions",v["region_count"],
                    "rest_error",v["max_rest_reconstruction_error_px"],
                    "seed_p95",v["p95_nearest_safe_seed_distance_px"])
              for clip,rows in v["qa_by_clip"].items():
                  print("QA",v["view_index"],clip,
                        "flip",max(x["flipped_triangles"] for x in rows),
                        "p95",max(x["p95_edge_stretch"] for x in rows),
                        "p99",max(x["p99_edge_stretch"] for x in rows),
                        "max",max(x["max_edge_stretch"] for x in rows))
          PY
      - name: Upload forensic visual proof
        uses: actions/upload-artifact@v4
        with:
          name: knight-corrected-source-owned-deformation-regions-forensic-v1
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 14