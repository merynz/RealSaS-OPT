name: knight-current-registry-probe-v1

on:
  push:
    branches: [ops/knight-latest-visual-probe-20261010]
    paths: ['.github/workflows/knight_current_registry_probe_v1.yml']

permissions:
  contents: read

env:
  PLATFORM_ROOT: /home/monster/realsas_platform
  CANONICAL_MAIN_SHA: d3c4f39ddecf2dc73e7c532ec352fc97ad92579b
  REALSAS_DATABASE_URL: postgresql:///postgres?host=/home/monster/realsas_platform/data/socket&port=55432

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1, clean: true}
      - name: Read current Registry only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANONICAL_MAIN_SHA"
          test "$(/home/monster/realsas_platform/current/bin/realsas-python -c 'import json; from pathlib import Path; print(json.loads(Path("/home/monster/realsas_platform/deployment.json").read_text())["code_sha"])')" = "$CANONICAL_MAIN_SHA"
          curl --fail --silent http://127.0.0.1:8080/health/live
          echo
          mkdir -p platform/cmd/registry-probe-tmp
          cat > platform/cmd/registry-probe-tmp/main.go <<'GO'
          package main
          import (
            "context"
            "fmt"
            "os"
            "github.com/jackc/pgx/v5/pgxpool"
          )
          func main() {
            ctx:=context.Background()
            pool,err:=pgxpool.New(ctx,os.Getenv("REALSAS_DATABASE_URL")); if err!=nil { panic(err) }; defer pool.Close()
            tables:=[]string{"subjects","engine_releases","subject_inputs","attempts","artifacts","attempt_artifacts","commands"}
            for _,t:=range tables { var n int; if err:=pool.QueryRow(ctx,"select count(*) from "+t).Scan(&n); err!=nil { fmt.Printf("%s=ERR:%v\n",t,err) } else { fmt.Printf("%s=%d\n",t,n) } }
            queries:=[]struct{name,q string}{
              {"SUBJECTS",`select coalesce(json_agg(x),'[]'::json) from (select id,slug,created_at from subjects order by created_at desc limit 10) x`},
              {"RELEASES",`select coalesce(json_agg(x),'[]'::json) from (select id,purpose,release_sha256,created_at from engine_releases order by created_at desc limit 10) x`},
              {"INPUTS",`select coalesce(json_agg(x),'[]'::json) from (select id,subject_id,input_sha256,created_at from subject_inputs order by created_at desc limit 10) x`},
              {"ATTEMPTS",`select coalesce(json_agg(x),'[]'::json) from (select id,subject_id,engine_release_id,kind,final_state,created_at from attempts order by created_at desc limit 10) x`},
            }
            for _,x:=range queries { var raw []byte; if err:=pool.QueryRow(ctx,x.q).Scan(&raw); err!=nil { fmt.Printf("%s=ERR:%v\n",x.name,err) } else { fmt.Printf("%s=%s\n",x.name,string(raw)) } }
          }
          GO
          (cd platform && go run ./cmd/registry-probe-tmp)
          rm -rf platform/cmd/registry-probe-tmp
          echo '--- STAGES ---'
          /home/monster/realsas_platform/current/bin/realsasctl stages | /home/monster/realsas_platform/current/bin/realsas-python -c 'import json,sys; x=json.load(sys.stdin); print("stage_count",len(x)); print("last",x[-1] if x else None)'
