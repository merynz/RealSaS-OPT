name: knight-current-skin-parent-execution

on:
  workflow_dispatch:
    inputs:
      subject_input_id:
        description: Exact sealed Platform SubjectInput UUID to consume
        required: false
        type: string
  workflow_run:
    workflows: [platform-developer-deployment]
    types: [completed]

concurrency:
  group: knight-current-skin-parent-execution
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  activation:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      expected_sha: ${{ steps.resolve.outputs.expected_sha }}
      subject_slug: ${{ steps.resolve.outputs.subject_slug }}
      subject_input_id: ${{ steps.resolve.outputs.subject_input_id }}
    steps:
      - name: Resolve selected canonical SHA
        id: sha
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'workflow_run' ]; then
            echo "expected_sha=$WORKFLOW_RUN_HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "expected_sha=$DISPATCH_SHA" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.expected_sha }}
          fetch-depth: 2

      - name: Resolve current parent execution request
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SHA: ${{ steps.sha.outputs.expected_sha }}
          DISPATCH_SUBJECT_INPUT_ID: ${{ github.event.inputs.subject_input_id }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGER_PATH: canonical/KNIGHT_CURRENT_SKIN_PARENT_EXECUTION_TRIGGER_V1.json
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import subprocess
          import uuid
          from pathlib import Path

          event = os.environ['EVENT_NAME']
          should_run = event == 'workflow_dispatch'
          subject_slug = 'knight'
          subject_input_id = str(os.environ.get('DISPATCH_SUBJECT_INPUT_ID') or '').strip()
          if subject_input_id:
              subject_input_id = str(uuid.UUID(subject_input_id))
          trigger_path = Path(os.environ['TRIGGER_PATH'])
          if trigger_path.is_file():
              trigger = json.loads(trigger_path.read_text(encoding='utf-8'))
              assert trigger.get('schema') == 'RealSaS.KnightCurrentSkinParentExecutionTrigger.v1', 'KNIGHT_CURRENT_PARENT_TRIGGER_SCHEMA'
              assert trigger.get('operation') == 'EXECUTE_CURRENT_KNIGHT_SKIN_PARENTS', 'KNIGHT_CURRENT_PARENT_TRIGGER_OPERATION'
              assert trigger.get('target_capability') == 'product.rig', 'KNIGHT_CURRENT_PARENT_TRIGGER_TARGET'
              assert trigger.get('execution_class') == 'IMPLEMENTATION_AUDIT', 'KNIGHT_CURRENT_PARENT_TRIGGER_EXECUTION_CLASS'
              assert trigger.get('promotion_policy') == 'NEVER', 'KNIGHT_CURRENT_PARENT_TRIGGER_PROMOTION_POLICY'
              assert trigger.get('mira_execution_authorized') is False, 'KNIGHT_CURRENT_PARENT_TRIGGER_MIRA_AUTHORITY'
              assert trigger.get('product_skin_activation_authorized') is False, 'KNIGHT_CURRENT_PARENT_TRIGGER_SKIN_AUTHORITY'
              assert trigger.get('genericity_claim_authorized') is False, 'KNIGHT_CURRENT_PARENT_TRIGGER_GENERICITY_AUTHORITY'
              subject_slug = str(trigger.get('subject_slug') or '')
              assert subject_slug, 'KNIGHT_CURRENT_PARENT_TRIGGER_SUBJECT'
          if event == 'workflow_run':
              if (os.environ.get('WORKFLOW_RUN_CONCLUSION') == 'success' and
                      os.environ.get('WORKFLOW_RUN_HEAD_BRANCH') == 'main'):
                  changed = subprocess.check_output(
                      ['git', 'diff-tree', '--no-commit-id', '--name-only', '-r', 'HEAD^1', 'HEAD'],
                      text=True,
                  ).splitlines()
                  should_run = str(trigger_path) in changed and bool(trigger.get('enabled'))
          print(f"should_run={'true' if should_run else 'false'}")
          print(f"expected_sha={os.environ['EXPECTED_SHA'].strip().lower()}")
          print(f"subject_slug={subject_slug}")
          print(f"subject_input_id={subject_input_id}")
          PY

  execute:
    needs: activation
    if: needs.activation.outputs.should_run == 'true'
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 90
    env:
      PLATFORM_ROOT: /home/monster/realsas_platform
      AUTHORITY_ROOT: /home/monster/realsas_authority
      EXPECTED_SHA: ${{ needs.activation.outputs.expected_sha }}
      SUBJECT_SLUG: ${{ needs.activation.outputs.subject_slug }}
      SUBJECT_INPUT_ID: ${{ needs.activation.outputs.subject_input_id }}
      COMPILER_RUN_ID: KNIGHT_CURRENT_SKIN_PARENTS_${{ github.run_id }}_${{ github.run_attempt }}
      OUTPUT_ROOT: /home/monster/realsas_authority/skin_readiness/current_parent_execution/${{ github.run_id }}-${{ github.run_attempt }}
      PYTHONPATH: ${{ github.workspace }}
      REALSAS_AUTHORITY_ROOT: /home/monster/realsas_authority
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}

      - name: Require exact deployed canonical main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
          "$PLATFORM_ROOT/current/bin/realsas-python" - <<'PY'
          import json
          import os
          from pathlib import Path

          deployment = json.loads(Path('/home/monster/realsas_platform/deployment.json').read_text())
          assert deployment['schema'] == 'RealSaS.DeveloperDeployment.v1', 'KNIGHT_CURRENT_PARENT_DEPLOYMENT_SCHEMA'
          assert deployment['code_sha'] == os.environ['EXPECTED_SHA'], 'KNIGHT_CURRENT_PARENT_DEPLOYED_MAIN_DRIFT'
          assert Path(deployment['authority_root']).resolve() == Path(os.environ['AUTHORITY_ROOT']).resolve(), 'KNIGHT_CURRENT_PARENT_AUTHORITY_ROOT_DRIFT'
          PY

      - name: Execute current Mesh and Rig responsibility closure
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_ROOT"
          args=(
            --api-root http://127.0.0.1:8080
            --subject-slug "$SUBJECT_SLUG"
            --expected-main-sha "$EXPECTED_SHA"
            --compiler-run-id "$COMPILER_RUN_ID"
            --out "$OUTPUT_ROOT/EXECUTION.json"
          )
          if [ -n "$SUBJECT_INPUT_ID" ]; then
            args+=(--subject-input-id "$SUBJECT_INPUT_ID")
          fi
          "$PLATFORM_ROOT/current/bin/realsas-python" \
            "$GITHUB_WORKSPACE/tools/ops/execute_current_skin_parent_capabilities_v1.py" \
            "${args[@]}"

      - name: Capture managed Platform diagnostics on parent failure
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_ROOT"
          "$PLATFORM_ROOT/current/bin/realsas-python" - <<'PY' > "$OUTPUT_ROOT/PLATFORM_DIAGNOSTICS.txt" 2>&1 || true
          from tools.platform_deploy import startup_diagnostics
          startup_diagnostics()
          PY
          cat "$OUTPUT_ROOT/PLATFORM_DIAGNOSTICS.txt"

      - name: Verify current typed parent execution receipt
        if: always()
        run: |
          set -euo pipefail
          test -f "$OUTPUT_ROOT/EXECUTION.json"
          "$PLATFORM_ROOT/current/bin/realsas-python" - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads((Path(os.environ['OUTPUT_ROOT']) / 'EXECUTION.json').read_text(encoding='utf-8'))
          assert receipt['source_code_sha'] == os.environ['EXPECTED_SHA'], 'KNIGHT_CURRENT_PARENT_RECEIPT_SHA_DRIFT'
          for key in (
              'mira_inference_executed',
              'canonical_skin_minted',
              'model_promotion_performed',
              'product_skin_activated',
              'product_revision_minted',
              'genericity_claimed',
          ):
              assert receipt[key] is False, f'KNIGHT_CURRENT_PARENT_AUTHORITY_VIOLATION:{key}'
          if receipt['schema'] != 'RealSaS.CurrentSkinParentCapabilityExecution.v1':
              raise RuntimeError('KNIGHT_CURRENT_PARENT_EXECUTION_FAILED:' + json.dumps(receipt, sort_keys=True))
          assert receipt['status'] == 'PASS_CURRENT_TYPED_SKIN_PARENTS_EXECUTED', 'KNIGHT_CURRENT_PARENT_STATUS'
          assert receipt['capability_target'] == 'product.rig', 'KNIGHT_CURRENT_PARENT_TARGET'
          assert receipt['attempt_state'] == 'COMPLETED', 'KNIGHT_CURRENT_PARENT_ATTEMPT_STATE'
          assert receipt['promotion_policy'] == 'NEVER', 'KNIGHT_CURRENT_PARENT_PROMOTION_POLICY'
          assert set(receipt['typed_parents']) == {'mesh', 'rig', 'surface', 'support'}, 'KNIGHT_CURRENT_PARENT_TYPED_SET'
          requested = str(os.environ.get('SUBJECT_INPUT_ID') or '')
          if requested:
              assert receipt['subject_input']['selection_mode'] == 'EXACT_PIN', 'KNIGHT_CURRENT_PARENT_INPUT_NOT_EXACT_PIN'
              assert receipt['subject_input']['subject_input_id'] == requested, 'KNIGHT_CURRENT_PARENT_INPUT_PIN_DRIFT'
          assert receipt['subject_input']['absent_sections_fabricated'] is False, 'KNIGHT_CURRENT_PARENT_ABSENT_SECTION_FABRICATION'
          PY

      - name: Re-run Skin readiness against fresh Platform artifacts
        if: success()
        run: |
          set -euo pipefail
          "$PLATFORM_ROOT/current/bin/realsas-python" \
            "$GITHUB_WORKSPACE/tools/ops/inspect_knight_skin_readiness_v1.py" \
            --api-root http://127.0.0.1:8080 \
            --expected-main-sha "$EXPECTED_SHA" \
            --out "$OUTPUT_ROOT/READINESS.json"

      - name: Require exact current Skin typed bundle
        if: success()
        run: |
          set -euo pipefail
          "$PLATFORM_ROOT/current/bin/realsas-python" - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads((Path(os.environ['OUTPUT_ROOT']) / 'READINESS.json').read_text(encoding='utf-8'))
          assert receipt['source_code_sha'] == os.environ['EXPECTED_SHA'], 'KNIGHT_CURRENT_PARENT_READINESS_SHA_DRIFT'
          assert receipt['decision']['typed_bundle_ready'] is True, 'KNIGHT_CURRENT_PARENT_TYPED_BUNDLE_NOT_READY'
          assert receipt['compatible_typed_bundle'] is not None, 'KNIGHT_CURRENT_PARENT_COMPATIBLE_BUNDLE_MISSING'
          assert receipt['model_inference_executed'] is False, 'KNIGHT_CURRENT_PARENT_READINESS_INFERENCE_VIOLATION'
          assert receipt['product_skin_activated'] is False, 'KNIGHT_CURRENT_PARENT_READINESS_SKIN_AUTHORITY_VIOLATION'
          assert receipt['genericity_claimed'] is False, 'KNIGHT_CURRENT_PARENT_READINESS_GENERICITY_VIOLATION'
          PY

      - name: Preserve execution and readiness receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knight-current-skin-parent-execution-${{ github.run_id }}
          path: ${{ env.OUTPUT_ROOT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
