name: knight-effective-control-prune-screen-c51a-v1

on:
  push:
    branches: [impl/carrier-first-mechanical-compilation-20261004]
    paths:
      - tools/audit_knight_effective_control_prune_screen_c51a_v1.py
      - compiler/realsas_compiler_core/control_basis_selection_v1.py
      - canonical/ATLAS_MIRA_COMPILER_MECHANICAL_COHERENCE_EXECUTION_PLAN_V1.md
      - .github/workflows/knight_effective_control_prune_screen_c51a_v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  court:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "4"
      PY: /home/monster/realsas-ml312/bin/python
      AUTH: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929
      C41: /home/monster/realsas_research_scratch/mira_actual_motion_weight_c41_37204866091
      OUT: /home/monster/realsas_research_scratch/control_prune_c51a_\${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: \${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$pythonLocation/lib:\${LD_LIBRARY_PATH:-}"
          test -x "$PY"
          test -f "$C41/REPORT.json"
          test -f "$C41/OPTIMIZED_ACTUAL_MOTION_WEIGHTS.npz"
          "$PY" -m py_compile \
            tools/audit_knight_effective_control_prune_screen_c51a_v1.py \
            compiler/realsas_compiler_core/control_basis_selection_v1.py
          echo "C51A_PREFLIGHT_PASS"

      - name: Run effective-control prune screen
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$pythonLocation/lib:\${LD_LIBRARY_PATH:-}"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          "$PY" -u tools/audit_knight_effective_control_prune_screen_c51a_v1.py \
            --authority-root "$AUTH" \
            --run-id "$RUN_ID" \
            --c41-dir "$C41" \
            --out-dir "$OUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knight-effective-control-prune-screen-c51a-v1
          path: \${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
