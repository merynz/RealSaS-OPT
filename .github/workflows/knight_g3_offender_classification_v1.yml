name: knight-g3-offender-classification-v1

on:
  workflow_dispatch:
  push:
    branches: [research/vf11-certified-adaptive-20260921]
    paths:
      - 'tools/audit_knight_g3_offender_classification_v1.py'
      - '.github/workflows/knight_g3_offender_classification_v1.yml'

permissions: {contents: write}

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 30
    env:
      AUTHORITY_ROOT: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_DEMO_V2_20260924
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Classify baseline and global-region offenders
        shell: bash
        run: |
          set -euo pipefail
          out="canonical/KNIGHT_G3_OFFENDER_CLASSIFICATION_V1_20260929.json"
          skin="canonical/knight_arachne_v6_2x2_rebound_stage35_v1/UNIFORM_ALL_PROJECTED.QUALIFIED_SKIN.json"
          PYTHONPATH=. python tools/audit_knight_g3_offender_classification_v1.py \
            --authority-root "$AUTHORITY_ROOT" \
            --run-id "$RUN_ID" \
            --skin-json "$skin" \
            --threshold 0.25 \
            --out "$out"
      - name: Seal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name realsas-self-hosted-runner
          git config user.email runner@realsas.local
          git add canonical/KNIGHT_G3_OFFENDER_CLASSIFICATION_V1_20260929.json
          git commit -m 'audit: seal G3 offender classification'
          git fetch origin research/vf11-certified-adaptive-20260921
          git rebase origin/research/vf11-certified-adaptive-20260921
          git push origin HEAD:research/vf11-certified-adaptive-20260921
