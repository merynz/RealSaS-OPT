name: knight-harmonic-first-frozen-render-only-v1

on:
  workflow_dispatch:
  push:
    branches: [research/vf11-certified-adaptive-20260921]
    paths:
      - 'tools/demo/render_knight_harmonic_first_frozen_only_v1.py'
      - '.github/workflows/knight_harmonic_first_frozen_render_only_v1.yml'

concurrency:
  group: knight-harmonic-first-frozen-render-only-v1
  cancel-in-progress: false

jobs:
  render:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 15
    env:
      AUTHORITY_ROOT: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_CORRECTED_MECHANICAL_CAA_HARMONIC_FIRST_IMMUTABLE_V1_70CBD671
      OUT_DIR: /tmp/knight_harmonic_first_frozen_render_only_v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Verify frozen renderer
        run: |
          set -euo pipefail
          test "$(git hash-object tools/demo/frozen/render_knight_motion_preview_v1_7917be02.py)" = "7917be02f325ba00b5dcd2b31a786898e45f640f"
          python -m py_compile tools/demo/render_knight_harmonic_first_frozen_only_v1.py
      - name: Render frozen corrected GIFs
        run: |
          set -euo pipefail
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          PYTHONPATH=. python tools/demo/render_knight_harmonic_first_frozen_only_v1.py             --authority-root "$AUTHORITY_ROOT"             --run-id "$RUN_ID"             --out-dir "$OUT_DIR"
      - name: Upload frozen corrected GIFs
        uses: actions/upload-artifact@v4
        with:
          name: knight-harmonic-first-frozen-render-only-v1
          path: |
            /tmp/knight_harmonic_first_frozen_render_only_v1/*.gif
            /tmp/knight_harmonic_first_frozen_render_only_v1/REPORT.json
            /tmp/knight_harmonic_first_frozen_render_only_v1/frozen_renderer/*.png
            /tmp/knight_harmonic_first_frozen_render_only_v1/frozen_renderer/*.json
          if-no-files-found: error
          retention-days: 7
