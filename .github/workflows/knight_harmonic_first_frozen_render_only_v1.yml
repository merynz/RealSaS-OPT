name: knight-harmonic-first-frozen-render-only-v1

on:
  workflow_dispatch:
  push:
    branches: [integration/final-main-knight-platform-20261002, main, repair/visual-triangle-deformation-domain-20261002]
    paths:
      - 'tools/demo/frozen/render_knight_motion_preview_v1_7917be02.py'
      - 'tools/demo/build_knight_corrected_mechanical_caa_stage23_immutable_v1.py'
      - 'tools/demo/consume_knight_corrected_mechanical_caa_stage23_immutable_v1.py'
      - '.github/workflows/knight_harmonic_first_frozen_render_only_v1.yml'

concurrency:
  group: knight-harmonic-first-frozen-render-only-v1
  cancel-in-progress: true

jobs:
  render:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 45
    env:
      AUTHORITY_ROOT: /home/monster/realsas_authority
      OLD_SOURCE_RUN_ID: SUBJECT2_KNIGHT_CORRECTED_MECHANICAL_CAA_HARMONIC_FIRST_IMMUTABLE_V1_70CBD671
      OUT_DIR: /tmp/knight_harmonic_first_frozen_canonical_gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt

      - name: Verify frozen renderer identity
        run: |
          set -euo pipefail
          test "$(git hash-object tools/demo/frozen/render_knight_motion_preview_v1_7917be02.py)" = "7917be02f325ba00b5dcd2b31a786898e45f640f"
          python -m py_compile \
            tools/demo/build_knight_corrected_mechanical_caa_stage23_immutable_v1.py \
            tools/demo/consume_knight_corrected_mechanical_caa_stage23_immutable_v1.py

      - name: Recover immutable Stage23 from sealed parent
        shell: bash
        run: |
          set -euo pipefail
          short="$(printf '%s' "$GITHUB_SHA" | cut -c1-8)"
          source_id="SUBJECT2_KNIGHT_FROZEN_GATE_STAGE23_${short}"
          qual_id="SUBJECT2_KNIGHT_FROZEN_GATE_STAGE24_${short}"
          printf 'NEW_SOURCE_RUN_ID=%s\nNEW_QUAL_RUN_ID=%s\n' "$source_id" "$qual_id" >> "$GITHUB_ENV"

          parent="$(python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['AUTHORITY_ROOT'])/'runs'/os.environ['OLD_SOURCE_RUN_ID']
          seal=json.load(open(root/'IMMUTABLE_STAGE23_SEAL.json',encoding='utf-8'))
          assert seal['status']=='SEALED_IMMUTABLE_STAGE23'
          assert seal['overwrite_forbidden'] is True
          print(seal['parent_run_id'])
          PY
          )"
          rm -rf "$AUTHORITY_ROOT/runs/$source_id" "$AUTHORITY_ROOT/runs/$qual_id" "$OUT_DIR"
          PYTHONPATH=. python tools/demo/build_knight_corrected_mechanical_caa_stage23_immutable_v1.py \
            --authority-root "$AUTHORITY_ROOT" \
            --parent-run-id "$parent" \
            --child-run-id "$source_id"

      - name: Qualify and render frozen witness
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          PYTHONPATH=. python tools/demo/consume_knight_corrected_mechanical_caa_stage23_immutable_v1.py \
            --authority-root "$AUTHORITY_ROOT" \
            --source-run-id "$NEW_SOURCE_RUN_ID" \
            --consumer-run-id "$NEW_QUAL_RUN_ID" \
            --out-dir "$OUT_DIR"

      - name: Require accepted reference hashes
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.load(open(Path(os.environ['OUT_DIR'])/'REPORT.json',encoding='utf-8'))
          expected={
            'IDLE':'4c64437ba1f2ecaca8302a52c598f3ba7750a923fd50b90f7cafa3f8473386c3',
            'RUN':'64ad50eeb9ea55ce202ddc46728ffea9074419dbf855938840f69d06661806e3',
            'SLASH':'adc8e8cd0e2272a836e50f7a73585208074703ea5f3c9a549583d7a659fa2b85',
          }
          actual={row['name']:row['sha256'] for row in report['gifs']}
          print(json.dumps({'actual':actual,'expected':expected},sort_keys=True))
          assert actual == expected, (actual, expected)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: knight-harmonic-first-frozen-render-only-v1
          path: |
            /tmp/knight_harmonic_first_frozen_canonical_gate/*.gif
            /tmp/knight_harmonic_first_frozen_canonical_gate/REPORT.json
            /tmp/knight_harmonic_first_frozen_canonical_gate/frozen_renderer/*.png
            /tmp/knight_harmonic_first_frozen_canonical_gate/frozen_renderer/*.json
          if-no-files-found: error
          retention-days: 30