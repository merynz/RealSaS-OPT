name: knight-invented-face-skin-causality-audit-v1

on:
  push:
    branches:
      - research/vf11-certified-adaptive-20260921
    paths:
      - 'tools/audit_knight_invented_face_skin_causality_v1.py'
      - '.github/workflows/knight_invented_face_skin_causality_audit_v1.yml'
  workflow_dispatch:

concurrency:
  group: knight-invented-face-skin-causality-audit-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install audit dependencies
        run: |
          set -euo pipefail
          python -m pip install --no-input --progress-bar off numpy scipy
      - name: Run exact Knight invented-face skin audit
        run: |
          set -euo pipefail
          PYTHONPATH=. python tools/audit_knight_invented_face_skin_causality_v1.py | tee /tmp/invented_face_skin.txt
      - name: Seal evidence
        run: |
          set -euo pipefail
          mkdir -p canonical/knight_invented_face_skin_causality_audit_v1
          cp /tmp/invented_face_skin.txt canonical/knight_invented_face_skin_causality_audit_v1/AUDIT_STDOUT.txt
          git config user.name realsas-self-hosted-runner
          git config user.email runner@realsas.local
          git add canonical/knight_invented_face_skin_causality_audit_v1
          git commit -m 'audit: seal Knight invented-face skin evidence'
          git fetch origin research/vf11-certified-adaptive-20260921
          git rebase origin/research/vf11-certified-adaptive-20260921
          git push origin HEAD:research/vf11-certified-adaptive-20260921
