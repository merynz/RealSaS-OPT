name: knight-invented-face-skin-correlation-audit-v1

on:
  workflow_dispatch:
  push:
    branches:
      - research/vf11-certified-adaptive-20260921
    paths:
      - '.github/workflows/knight_invented_face_skin_correlation_audit_v1.yml'

concurrency:
  group: knight-invented-face-skin-correlation-audit-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    env:
      RUN_ROOT: /home/monster/realsas_authority/runs/SUBJECT2_KNIGHT_DEMO_V2_20260924
      OUT: canonical/knight_invented_face_skin_correlation_audit_v1

    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - name: Install audit dependencies
        run: python -m pip install --no-input --progress-bar off numpy scipy

      - name: Correlate dense-incidence provenance with Arachne skin discontinuity
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib, json, math
          from pathlib import Path
          import numpy as np

          from compiler.realsas_compiler_core.artifact_codec_v2 import (
              canonical_mesh_candidate_from_dict,
              qualified_skeleton_from_dict,
              qualified_skin_from_dict,
              rigging_surface_from_dict,
          )
          from compiler.realsas_compiler_core.mesh.deformation_stress_v1 import _candidate_skin_matrix
          from compiler.realsas_compiler_core.mesh.skin_topology_compatibility_v1 import _skin_l1_per_face
          from compiler.realsas_compiler_core.substrate.scene_first_signed import (
              mesh_connected_component_labels_v1,
              _adaptive_voxel_compact,
          )

          root=Path("/home/monster/realsas_authority/runs/SUBJECT2_KNIGHT_DEMO_V2_20260924")
          out=Path("canonical/knight_invented_face_skin_correlation_audit_v1")
          out.mkdir(parents=True,exist_ok=True)

          paths={
            "stage12":root/"artifacts/12_ZERO_SURFACE_DECODED/signed_zero_surface_seal.json",
            "stage15":root/"artifacts/15_RIGGING_SURFACE_QUALIFIED/qualified_rigging_surface.json",
            "stage18":root/"artifacts/18_CANONICAL_MESH_ADDRESSING_BUILD/canonical_mesh_candidate.json",
            "stage28":root/"artifacts/28_SKELETON_QUALIFIED/qualified_skeleton.json",
            "stage32":root/"artifacts/32_SKIN_QUALIFIED/qualified_skin.json",
          }
          for k,p in paths.items():
              if not p.is_file(): raise RuntimeError(f"MISSING:{k}:{p}")

          z=json.loads(paths["stage12"].read_text())
          s_payload=json.loads(paths["stage15"].read_text())
          c_payload=json.loads(paths["stage18"].read_text())
          sk_payload=json.loads(paths["stage28"].read_text())
          w_payload=json.loads(paths["stage32"].read_text())

          surface=rigging_surface_from_dict(s_payload)
          candidate=canonical_mesh_candidate_from_dict(c_payload)
          skeleton=qualified_skeleton_from_dict(sk_payload)
          skin=qualified_skin_from_dict(w_payload)

          npz=Path(str(z["npz_path"]))
          with np.load(npz,allow_pickle=False) as data:
              dense_v=np.asarray(data["vertices_normalized"],np.float64)
              dense_f=np.asarray(data["faces"],np.int64)

          meta=dict(surface.metadata or {})
          target=int(meta["compact_target_nodes"])
          component_aware=bool(meta["component_aware_compaction"])
          dummy=np.zeros_like(dense_v); dummy[:,2]=1.0
          labels=mesh_connected_component_labels_v1(len(dense_v),dense_f) if component_aware else None
          cp,_cn,_edges,_divisions,inverse=_adaptive_voxel_compact(
              dense_v,dense_f,dummy,
              target_nodes=target,
              preserve_connected_components=component_aware,
              precomputed_component_labels=labels,
          )
          if len(cp)!=len(surface.surface_nodes):
              raise RuntimeError("COMPACTION_REPLAY_NODE_COUNT_DRIFT")

          # Vectorized dense compact face-incidence keys.
          mapped=np.sort(np.asarray(inverse[dense_f],np.int64),axis=1)
          valid=(mapped[:,0]!=mapped[:,1]) & (mapped[:,1]!=mapped[:,2])
          mapped=mapped[valid]
          N=int(len(cp))+1
          dense_keys=np.unique(mapped[:,0]*(N*N)+mapped[:,1]*N+mapped[:,2])

          # Stage18 candidate vertex -> compact surface index.
          sid_to_idx={str(n.surface_id):i for i,n in enumerate(surface.surface_nodes)}
          cid_to_idx={}
          cid_completed={}
          for v in candidate.vertices:
              sid=str(dict(v.metadata or {}).get("source_surface_id") or "")
              if sid not in sid_to_idx: raise RuntimeError("CANDIDATE_SOURCE_SURFACE_ID_DRIFT")
              cid_to_idx[str(v.candidate_vertex_id)]=sid_to_idx[sid]
              flags=set(surface.surface_nodes[sid_to_idx[sid]].validity_flags)
              cid_completed[str(v.candidate_vertex_id)]="MODEL_COMPLETED_SIGNED_ZERO_SURFACE" in flags

          cfaces=np.asarray(
              [[cid_to_idx[str(v)] for v in face] for face in candidate.faces],
              dtype=np.int64,
          )
          csorted=np.sort(cfaces,axis=1)
          ckeys=csorted[:,0]*(N*N)+csorted[:,1]*N+csorted[:,2]
          pos=np.searchsorted(dense_keys,ckeys)
          supported=(pos<len(dense_keys))
          supported &= dense_keys[np.minimum(pos,len(dense_keys)-1)]==ckeys
          invented=~supported

          rest,weights,face_idx=_candidate_skin_matrix(
              candidate,surface=surface,skeleton=skeleton,skin=skin
          )
          face_idx=np.asarray(face_idx,np.int64)
          if face_idx.shape!=(len(candidate.faces),3):
              raise RuntimeError("FACE_INDEX_SHAPE_DRIFT")
          skin_l1=_skin_l1_per_face(weights,face_idx)

          completed_count=np.asarray([
              sum(cid_completed[str(v)] for v in face)
              for face in candidate.faces
          ],dtype=np.int64)

          def stats(mask):
              x=skin_l1[mask]
              return {
                "count":int(len(x)),
                "mean":float(np.mean(x)) if len(x) else None,
                "p50":float(np.percentile(x,50)) if len(x) else None,
                "p95":float(np.percentile(x,95)) if len(x) else None,
                "p99":float(np.percentile(x,99)) if len(x) else None,
                "max":float(np.max(x)) if len(x) else None,
                "gt_0p5":int(np.count_nonzero(x>0.5)),
                "gt_1p0":int(np.count_nonzero(x>1.0)),
                "gt_1p5":int(np.count_nonzero(x>1.5)),
                "gt_1p9":int(np.count_nonzero(x>1.9)),
              }

          inv_stats=stats(invented)
          sup_stats=stats(supported)

          def rate(row,key):
              return float(row[key])/max(int(row["count"]),1)
          comparisons={}
          for key in ("gt_0p5","gt_1p0","gt_1p5","gt_1p9"):
              ri=rate(inv_stats,key); rs=rate(sup_stats,key)
              comparisons[key]={
                "invented_rate":ri,
                "supported_rate":rs,
                "risk_ratio":None if rs==0.0 else ri/rs,
                "rate_difference":ri-rs,
              }

          offenders={}
          for fi in (253,3829,3573):
              if fi>=len(candidate.faces): continue
              offenders[str(fi)]={
                "invented":bool(invented[fi]),
                "dense_face_supported":bool(supported[fi]),
                "skin_l1_max":float(skin_l1[fi]),
                "completed_vertex_count":int(completed_count[fi]),
                "vertex_ids":list(map(str,candidate.faces[fi])),
              }

          top_invented=sorted(np.nonzero(invented)[0].tolist(),key=lambda fi:float(skin_l1[fi]),reverse=True)[:64]
          report={
            "schema":"RealSaS.KnightInventedFaceSkinCorrelationAudit.v1",
            "status":"AUDIT_ONLY__NO_REPAIR_APPLIED",
            "artifact_sha256":{k:hashlib.sha256(p.read_bytes()).hexdigest() for k,p in paths.items()},
            "bindings":{
              "candidate_lineage_hash":candidate.candidate_lineage_hash,
              "surface_lineage_hash":surface.geometry_lineage_hash,
              "skeleton_lineage_hash":skeleton.skeleton_lineage_hash,
              "skin_lineage_hash":skin.skin_lineage_hash,
            },
            "provenance":{
              "face_count":len(candidate.faces),
              "dense_face_supported_count":int(np.count_nonzero(supported)),
              "invented_three_clique_face_count":int(np.count_nonzero(invented)),
            },
            "skin_l1":{
              "invented":inv_stats,
              "dense_supported":sup_stats,
              "threshold_comparison":comparisons,
            },
            "completed_vertex_strata":{
              "invented":{str(i):int(np.count_nonzero(invented & (completed_count==i))) for i in range(4)},
              "dense_supported":{str(i):int(np.count_nonzero(supported & (completed_count==i))) for i in range(4)},
            },
            "historical_smear_offender_faces":offenders,
            "top_invented_faces_by_skin_l1":[
              {
                "face_index":int(fi),
                "skin_l1_max":float(skin_l1[fi]),
                "completed_vertex_count":int(completed_count[fi]),
                "vertex_ids":list(map(str,candidate.faces[fi])),
              }
              for fi in top_invented
            ],
            "finding":{
              "id":"KNIGHT_INVENTED_FACE_SKIN_DISCONTINUITY_CORRELATION",
              "claim_boundary":"Observational correlation on the exact sealed Knight Stage18 candidate and Stage32 qualified skin. This does not by itself prove invented-face status caused skin discontinuity; it quantifies whether the two failure domains overlap before targeted causal ablation.",
            }
          }
          (out/"REPORT.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print(json.dumps(report,indent=2,sort_keys=True))
          PY

      - name: Seal evidence
        run: |
          set -euo pipefail
          git config user.name realsas-self-hosted-runner
          git config user.email runner@realsas.local
          git add "$OUT/REPORT.json"
          git commit -m 'audit: seal Knight invented-face skin correlation evidence'
          git fetch origin research/vf11-certified-adaptive-20260921
          git rebase origin/research/vf11-certified-adaptive-20260921
          git push origin HEAD:research/vf11-certified-adaptive-20260921
