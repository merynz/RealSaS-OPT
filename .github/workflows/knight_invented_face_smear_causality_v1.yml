name: knight-invented-face-smear-causality-v1

on:
  push:
    branches:
      - research/vf11-certified-adaptive-20260921
    paths:
      - 'tools/audit_knight_invented_face_smear_causality_v1.py'
      - '.github/workflows/knight_invented_face_smear_causality_v1.yml'
  workflow_dispatch:

concurrency:
  group: knight-invented-face-smear-causality-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact dependencies
        run: |
          set -euo pipefail
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Run invented-face smear causality correlation
        run: |
          set -euo pipefail
          PYTHONPATH=. python tools/audit_knight_invented_face_smear_causality_v1.py | tee /tmp/invented_face_smear.txt
          test -f canonical/knight_invented_face_smear_causality_v1/REPORT.json
      - name: Seal evidence
        run: |
          set -euo pipefail
          cp /tmp/invented_face_smear.txt canonical/knight_invented_face_smear_causality_v1/AUDIT_STDOUT.txt
          git config user.name realsas-self-hosted-runner
          git config user.email runner@realsas.local
          git add canonical/knight_invented_face_smear_causality_v1
          git commit -m 'audit: seal invented-face smear causality evidence'
          git fetch origin research/vf11-certified-adaptive-20260921
          git rebase origin/research/vf11-certified-adaptive-20260921
          git push origin HEAD:research/vf11-certified-adaptive-20260921
