name: knight-james-twigg-region-inference-v1

on:
  workflow_dispatch:
  push:
    branches:
      - research/vf11-certified-adaptive-20260921
    paths:
      - 'tools/audit_knight_james_twigg_region_inference_v1.py'
      - '.github/workflows/knight_james_twigg_region_inference_v1.yml'

concurrency:
  group: knight-james-twigg-region-inference-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  court:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 45
    env:
      AUTHORITY_ROOT: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_DEMO_V2_20260924
      V5_HANDOFF: gdrive:RealSaS_SUBJECT2_KNIGHT_DEMO_V2_20260924/ARACHNE_STAGE31_V5_DEMO_HANDOFF
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        run: python -m pip install --no-input --progress-bar off numpy scipy scikit-learn
      - name: Verify CutCell authority
        run: |
          set -euo pipefail
          test -f canonical/KNIGHT_CUTCELL_PRIOR_REPRODUCTION_V1_20260929.json
          test -f canonical/KNIGHT_CUTCELL_PRIOR_REPRODUCTION_V1_20260929.npz
          python - <<'PY'
          import json, numpy as np
          from pathlib import Path
          r=json.loads(Path("canonical/KNIGHT_CUTCELL_PRIOR_REPRODUCTION_V1_20260929.json").read_text())
          assert r["selected_variant_by_teacher_free_actual_motion"]=="CUT_CELL", r["selected_variant_by_teacher_free_actual_motion"]
          with np.load("canonical/KNIGHT_CUTCELL_PRIOR_REPRODUCTION_V1_20260929.npz",allow_pickle=False) as z:
              assert str(np.asarray(z["selected_variant"]).item())=="CUT_CELL"
              assert z["selected"].shape[0]==12049
          print("CUT_CELL_AUTHORITY_VERIFIED")
          PY
      - name: Fetch teacher evaluation artifacts
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          echo "$tmp" >/tmp/james_twigg_tmp
          rclone copyto "$V5_HANDOFF/ARACHNE_KNIGHT_TEACHER_BANK_FIX2.npz" "$tmp/bank.npz" --checksum
          rclone copyto "$V5_HANDOFF/KNIGHT_EVALUATED_TEACHER_SOURCE.npz" "$tmp/source.npz" --checksum
          sha256sum "$tmp/bank.npz" "$tmp/source.npz"
      - name: Infer regions from rotation sequences
        run: |
          set -euo pipefail
          tmp="$(cat /tmp/james_twigg_tmp)"
          PYTHONPATH=. python tools/audit_knight_james_twigg_region_inference_v1.py             --authority-root "$AUTHORITY_ROOT"             --run-id "$RUN_ID"             --weights-npz canonical/KNIGHT_CUTCELL_PRIOR_REPRODUCTION_V1_20260929.npz             --teacher-bank "$tmp/bank.npz"             --teacher-source "$tmp/source.npz"             --out canonical/KNIGHT_JAMES_TWIGG_REGION_INFERENCE_V1_20260929.json             | tee /tmp/james_twigg.txt
      - name: Seal
        run: |
          set -euo pipefail
          mkdir -p canonical/knight_james_twigg_region_inference_v1
          cp /tmp/james_twigg.txt canonical/knight_james_twigg_region_inference_v1/AUDIT_STDOUT.txt
          git config user.name realsas-self-hosted-runner
          git config user.email runner@realsas.local
          git add canonical/KNIGHT_JAMES_TWIGG_REGION_INFERENCE_V1_20260929.json canonical/knight_james_twigg_region_inference_v1
          git commit -m 'research: seal Knight James-Twigg region inference'
          git fetch origin research/vf11-certified-adaptive-20260921
          git rebase origin/research/vf11-certified-adaptive-20260921
          git push origin HEAD:research/vf11-certified-adaptive-20260921
