name: knight-latest-carrier-materialize-v1

on:
  push:
    branches: [ops/knight-latest-visual-probe-20261010]
    paths:
      - 'tools/ops/knight_latest_carrier_materialize_v1.py'
      - '.github/workflows/knight_latest_carrier_materialize_v1.yml'

permissions:
  contents: read

jobs:
  materialize:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/knight-latest-visual-probe-20261010
          fetch-depth: 1
          clean: true
      - name: Verify current main package source and materialize exact M/G/W_M
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA=d3c4f39ddecf2dc73e7c532ec352fc97ad92579b
          test "$(/home/monster/realsas_platform/current/bin/realsas-python -c 'import json; from pathlib import Path; print(json.loads(Path("/home/monster/realsas_platform/deployment.json").read_text())["code_sha"])')" = "$MAIN_SHA"
          export PYTHONPATH="$GITHUB_WORKSPACE"
          PY=/home/monster/realsas_platform/current/bin/realsas-python
          INPUT=/home/monster/realsas_authority/imports/knight_latest_carrier_20261010
          OUT=/home/monster/realsas_authority/runs/KNIGHT_LATEST_CARRIER_MATERIALIZATION_20261010
          rm -rf "$OUT"
          mkdir -p "$OUT"
          "$PY" tools/ops/knight_latest_carrier_materialize_v1.py --input-root "$INPUT" --out-root "$OUT"
          "$PY" - <<'PY'
          import json
          from pathlib import Path
          p=Path('/home/monster/realsas_authority/runs/KNIGHT_LATEST_CARRIER_MATERIALIZATION_20261010/RECEIPT.json')
          x=json.loads(p.read_text())
          assert x['status']=='PASS_RESEARCH_ONLY_M_G_W_M_MATERIALIZATION'
          assert x['xyz_exact_preserved'] is True and x['topology_exact_preserved'] is True
          print('MATERIALIZATION_PASS',json.dumps(x,sort_keys=True))
          PY
