name: knight-latest-stage-artifact-probe-v1

on:
  push:
    branches: [ops/knight-latest-visual-probe-20261010]
    paths: ['.github/workflows/knight_latest_stage_artifact_probe_v1.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          clean: true
      - name: Scan local authority for promoted mechanics identities
        shell: bash
        env:
          PLATFORM_ROOT: /home/monster/realsas_platform
          AUTHORITY_ROOT: /home/monster/realsas_authority
        run: |
          set -euo pipefail
          "$PLATFORM_ROOT/current/bin/realsas-python" - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['AUTHORITY_ROOT'])/'runs'
          needles={
            'carrier_basis':'dbac301b9c47fa7f31a024ef0612008d8315b590d7a2dd1552a75f75c7ac9ff2',
            'axis_qualified':'c5a3c7f5675ba84233c8d7eb4ccab076e69c105462f86673dc259e30e2ca6ca5',
            'axis_result':'072b52b206e622b1c1b51fe266c0e348fe3829925f8258035d23c61087abf528',
            'mira_weights':'880dd73b2f3a21196c229156a3271fa95e7261def3f50a3dfe9f1c49ca2bb27b',
            'mira_result':'31545e7180aa770b1efc4a1876c256999bdeb38f703d9a3e46892f888a4678c1',
            'coincident_qual':'118ac28fc8a597caec3ed28ab18af2091ce24b51642c6a2e41db417424d903a6',
          }
          hits=[]; scanned=0
          for p in root.rglob('*'):
            if not p.is_file(): continue
            scanned+=1
            if p.suffix.lower() not in {'.json','.txt','.md'}: continue
            try:
              if p.stat().st_size>12_000_000: continue
              text=p.read_text(errors='ignore')
            except OSError: continue
            found=[k for k,v in needles.items() if v in text]
            stageish=any(s in str(p) for s in ('19_STATIC_CANONICAL_MESH_QUALIFIED','28_SKELETON_QUALIFIED','32_SKIN_QUALIFIED','35_DYNAMIC_MECHANICS_PROVED','36_MECHANICS_QUALIFIED'))
            if found or stageish:
              hits.append({'path':str(p),'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'needle_hits':found})
          report={'schema':'RealSaS.KnightLatestStageArtifactProbe.v1','status':'READ_ONLY','scanned':scanned,'hits':hits}
          out=Path('/tmp/knight-latest-stage-artifact-probe'); out.mkdir(parents=True,exist_ok=True)
          (out/'REPORT.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps({'scanned':scanned,'hit_count':len(hits),'hits':hits[:200]},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: knight-latest-stage-artifact-probe
          path: /tmp/knight-latest-stage-artifact-probe/REPORT.json
          retention-days: 7
