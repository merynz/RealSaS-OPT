name: knight-latest-visual-host-probe-v1

on:
  push:
    branches:
      - ops/knight-latest-visual-probe-20261010
    paths:
      - '.github/workflows/knight_latest_visual_host_probe_v1.yml'

permissions:
  contents: read

concurrency:
  group: knight-latest-visual-host-probe-v1
  cancel-in-progress: true

env:
  PLATFORM_ROOT: /home/monster/realsas_platform
  AUTHORITY_ROOT: /home/monster/realsas_authority
  KNIGHT_RUN: SUBJECT2_KNIGHT_DEMO_V2_20260924

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          clean: true

      - name: Prove exact main and probe sealed host inputs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD)" = "$("$PLATFORM_ROOT/current/bin/realsas-python" -c 'import json,os; from pathlib import Path; print(json.loads((Path(os.environ["PLATFORM_ROOT"])/"deployment.json").read_text())["code_sha"])')"
          "$PLATFORM_ROOT/current/bin/realsas-python" - <<'PY'
          from __future__ import annotations
          import hashlib, json, os
          from pathlib import Path
          repo=Path.cwd(); platform=Path(os.environ['PLATFORM_ROOT']); authority=Path(os.environ['AUTHORITY_ROOT'])
          sysroot=platform/'current/source'
          import sys; sys.path.insert(0,str(sysroot))
          from tools.platform_host_preflight import inventory_report
          inv=json.loads((repo/'canonical/PLATFORM_KNIGHT_INPUT_INVENTORY_V1.json').read_text())
          preflight=inventory_report(authority,inv,deadline_seconds=60,max_files=150000)
          run_root=authority/'runs'/os.environ['KNIGHT_RUN']; manifest_path=run_root/'run_manifest.json'
          manifest=json.loads(manifest_path.read_text()) if manifest_path.is_file() else {}
          def file_ref(row,key):
              value=dict(row.get(key) or {}); p=Path(str(value.get('path') or ''))
              return {'path':str(p),'sha256':str(value.get('sha256') or ''),'exists':p.is_file()}
          obs=dict(manifest.get('observation') or {})
          source=[{'view_index':int(r['view_index']),**file_ref(r,'image')} for r in obs.get('source_rasters') or []]
          masks=[{'view_index':int(r['view_index']),**file_ref(r,'mask')} for r in obs.get('source_foreground_masks') or []]
          motion=dict(manifest.get('motion') or {})
          def refs(v,out):
              if isinstance(v,dict):
                  if isinstance(v.get('path'),str) and isinstance(v.get('sha256'),str):
                      p=Path(v['path']); out.append({'path':str(p),'sha256':v['sha256'],'exists':p.is_file(),'name':p.name})
                  for x in v.values(): refs(x,out)
              elif isinstance(v,list):
                  for x in v: refs(x,out)
          motion_refs=[]; refs(motion,motion_refs)
          exact_extra={
              '18cd79dca501413b1504fa8852a06e4dd6ac01cc7fd7197348eca25af54b2310':'demo_idle_v1.motion.json',
              '465bcdf522588974dd475851f5f0ec6e7beb5b7eee3055166f99457bbb8e15c0':'demo_run_v1.motion.json',
              '6422209f1291dbb3dbfdffb6b238e63214f8aeddfc31e12f1b105ecc1da85298':'demo_slash_v1.motion.json',
              'e11ab0fe32378eb1cd06fbebd8d1827e71eaa7b3fbe31b78248f7f3f9ab91920':'qualified_camera_set.json',
              '118ac28fc8a597caec3ed28ab18af2091ce24b51642c6a2e41db417424d903a6':'COMPILER_POST_BIND_COINCIDENT_FRAME_QUALIFICATION_V551.json',
              'e4944ec1da3ed0a3dad65c7596e2ee65d6f806a9c44873f6588db95706526855':'V551_DYNAMIC_FRAME_METRICS.json'}
          hits={sha:[] for sha in exact_extra}; scanned=0
          roots=[run_root,authority,platform/'artifacts']
          for root in roots:
              if not root.is_dir(): continue
              for p in root.rglob('*'):
                  if scanned>=120000: break
                  if not p.is_file(): continue
                  scanned+=1
                  expected=[sha for sha,name in exact_extra.items() if p.name==name or sha in p.name]
                  if not expected: continue
                  try:
                      h=hashlib.sha256(p.read_bytes()).hexdigest()
                  except OSError: continue
                  if h in hits: hits[h].append(str(p))
              if scanned>=120000: break
          report={
              'schema':'RealSaS.LatestKnightVisualHostProbe.v2','status':'MEASURED_READ_ONLY__NO_QUALIFICATION_MINTED',
              'canonical_main_sha':os.popen('git rev-parse HEAD').read().strip(),'external_inventory':preflight,
              'historical_manifest':{'path':str(manifest_path),'exists':manifest_path.is_file(),'sections':sorted(manifest.keys()),'source_rasters':source,'source_masks':masks,'motion_refs':motion_refs,'camera_bundle':dict(obs.get('camera_bundle') or {})},
              'extra_exact_hits':[{'name':name,'sha256':sha,'paths':hits[sha]} for sha,name in exact_extra.items()],
              'platform_deployment':json.loads((platform/'deployment.json').read_text()),
          }
          out=Path('/tmp/knight-latest-visual-host-probe'); out.mkdir(parents=True,exist_ok=True)
          (out/'REPORT.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,sort_keys=True))
          PY
          curl --fail --silent --show-error http://127.0.0.1:8080/v1/stages > /tmp/knight-latest-visual-host-probe/platform_stages.json

      - name: Upload bounded probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knight-latest-visual-host-probe
          path: /tmp/knight-latest-visual-host-probe
          if-no-files-found: warn
          retention-days: 7
