name: knight-manifest-binding-probe-v1

on:
  push:
    branches: [ops/knight-latest-visual-probe-20261010]
    paths: ['.github/workflows/knight_manifest_binding_probe_v1.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1, clean: true}
      - name: Print exact Stage15 and Stage17 output identities
        shell: bash
        run: |
          set -euo pipefail
          PY=/home/monster/realsas_platform/current/bin/realsas-python
          ROOT=/home/monster/realsas_authority/runs/SUBJECT2_KNIGHT_DEMO_V2_20260924
          "$PY" - <<'PY'
          import json
          from pathlib import Path
          root=Path('/home/monster/realsas_authority/runs/SUBJECT2_KNIGHT_DEMO_V2_20260924')
          ledger=json.loads((root/'ACTIVE_RUN_V2.json').read_text())
          for sid in ('15_RIGGING_SURFACE_QUALIFIED','17_MECHANICAL_PARTITION_QUALIFIED'):
              rows=[r for r in ledger.get('stages',[]) if r.get('id')==sid]
              print('STAGE',sid,'ROW_COUNT',len(rows))
              for row in rows:
                  print('STATUS',row.get('status'))
                  for out in row.get('outputs',[]):
                      print('OUTPUT',out.get('schema'),out.get('sha256'),out.get('path'))
                      p=Path(str(out.get('path') or ''))
                      if p.is_file() and p.suffix=='.json':
                          try:
                              v=json.loads(p.read_text())
                              print('LINEAGES',json.dumps({k:v.get(k) for k in ('geometry_lineage_hash','partition_lineage_hash','carrier_policy_lineage_hash','schema','schema_version') if k in v},sort_keys=True))
                          except Exception as e:
                              print('JSON_READ_ERROR',type(e).__name__)
          PY
