name: Knight native preview reality check once

on:
  push:
    branches: [platform/professional-backend-v1-20261001]
    paths:
      - '.github/workflows/knight_native_preview_reality_check_once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 45
    env:
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      AUTHORITY_ROOT: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929
      PLAYER: /tmp/realsas_knight_reality_runtime_v2
      OUT_DIR: /tmp/realsas_knight_native_preview_reality
    steps:
      - uses: actions/checkout@v4
        with:
          ref: platform/professional-backend-v1-20261001
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install render dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
          PIP_DEFAULT_TIMEOUT: '60'
        run: |
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
          python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt

      - name: Restore historical diagnostic renderer only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin research/vf11-certified-adaptive-20260921
          mkdir -p tools/demo
          git show origin/research/vf11-certified-adaptive-20260921:tools/demo/render_knight_motion_preview_v1.py > tools/demo/render_knight_motion_preview_v1.py
          git show origin/research/vf11-certified-adaptive-20260921:tools/demo/render_knight_motion_preview_native_v2.py > tools/demo/render_knight_motion_preview_native_v2.py
          git show origin/research/vf11-certified-adaptive-20260921:canonical/KNIGHT_MOTION_SOURCE_ACTION_DIAGNOSTIC_20260927.json > canonical/KNIGHT_MOTION_SOURCE_ACTION_DIAGNOSTIC_20260927.json
          printf '' > tools/demo/__init__.py

      - name: Verify solved lineage exists and upstream is untouched
        shell: bash
        run: |
          set -euo pipefail
          run="$AUTHORITY_ROOT/runs/$RUN_ID"
          test -f "$run/ACTIVE_RUN_V2.json"
          test -f "$run/run_manifest.json"
          sha256sum "$run/ACTIVE_RUN_V2.json" "$run/run_manifest.json" > "$RUNNER_TEMP/knight_upstream_before.sha256"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['AUTHORITY_ROOT'])/'runs'/os.environ['RUN_ID']
          ledger=json.load(open(root/'ACTIVE_RUN_V2.json',encoding='utf-8'))
          by={str(x['id']):x for x in ledger['stages']}
          required=['05_CAMERA_CONTRACT_SOLVED','18_CANONICAL_MESH_ADDRESSING_BUILD','23_COMPLETE_APPEARANCE_ASSET_BAKED','28_SKELETON_QUALIFIED','32_SKIN_QUALIFIED']
          out={k:by[k]['status'] for k in required}
          print(json.dumps(out,sort_keys=True))
          assert all(out[k] in {'PASS','PASS_DEMO_ONLY'} for k in required),out
          PY

      - name: Build current native V2 reference player
        run: |
          set -euo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -pedantic runtime/realsas_cpp/src/runtime_v2_caa_reference.cpp -lpng -lz -o "$PLAYER"
          sha256sum "$PLAYER"

      - name: Render Knight idle run slash from sealed lineage
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          python tools/demo/render_knight_motion_preview_native_v2.py             --authority-root "$AUTHORITY_ROOT"             --run-id "$RUN_ID"             --out-dir "$OUT_DIR"             --resolution 512             --native-player "$PLAYER"             --workers 4
          ls -lh "$OUT_DIR"
          cat "$OUT_DIR/KNIGHT_MOTION_NATIVE_PREVIEW_REPORT_V2.json"

      - name: Prove render did not mutate upstream lineage
        shell: bash
        run: |
          set -euo pipefail
          run="$AUTHORITY_ROOT/runs/$RUN_ID"
          sha256sum "$run/ACTIVE_RUN_V2.json" "$run/run_manifest.json" > "$RUNNER_TEMP/knight_upstream_after.sha256"
          diff -u "$RUNNER_TEMP/knight_upstream_before.sha256" "$RUNNER_TEMP/knight_upstream_after.sha256"
          printf '{"schema":"RealSaS.KnightRealityCheck.v1","status":"PASS","run_id":"%s","upstream_mutated":false,"git_sha":"%s"}\n' "$RUN_ID" "$GITHUB_SHA" > "$OUT_DIR/REALITY_CHECK.json"

      - uses: actions/upload-artifact@v4
        with:
          name: knight-native-preview-reality-check
          path: |
            /tmp/realsas_knight_native_preview_reality/*.gif
            /tmp/realsas_knight_native_preview_reality/*.json
            /tmp/realsas_knight_native_preview_reality/*.rss
          if-no-files-found: error
          retention-days: 30

      - name: Retire one-shot workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/knight_native_preview_reality_check_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/knight_native_preview_reality_check_once.yml
          git commit -m "ci: retire Knight native preview reality check"
          git push origin HEAD:platform/professional-backend-v1-20261001
