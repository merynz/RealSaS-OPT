name: knight-nonmanifold-owner-v1

on:
  push:
    branches:
      - audit/canonical-caa-mechanics-geometry-lock-20261002
    paths:
      - tools/audit_knight_nonmanifold_owner_v1.py
      - .github/workflows/knight_nonmanifold_owner_v1.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 10
    env:
      AUTHORITY_ROOT: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929
      OUT: /tmp/knight_nonmanifold_owner_v1/REPORT.json
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - run: python -m py_compile tools/audit_knight_nonmanifold_owner_v1.py
      - name: Classify nonmanifold topology ownership
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$(dirname "$OUT")"
          mkdir -p "$(dirname "$OUT")"
          python tools/audit_knight_nonmanifold_owner_v1.py             --authority-root "$AUTHORITY_ROOT"             --run-id "$RUN_ID"             --out "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: knight-nonmanifold-owner-v1
          path: /tmp/knight_nonmanifold_owner_v1/REPORT.json
          if-no-files-found: error
          retention-days: 30
