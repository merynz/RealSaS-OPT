name: knight-oracle-drawable-court-v1

on:
  workflow_dispatch:
  push:
    branches:
      - research/knight-oracle-drawable-court-20261023
    paths:
      - 'tools/demo/knight_oracle_drawable_court_v1.py'
      - '.github/workflows/knight_oracle_drawable_court_v1.yml'
      - 'canonical/KNIGHT_ORACLE_DRAWABLE_COURT_PREREG_V1_20261023.json'

concurrency:
  group: knight-oracle-drawable-court-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  oracle:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 45
    env:
      AUTHORITY_ROOT: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_CORRECTED_MECHANICAL_CAA_HARMONIC_FIRST_IMMUTABLE_RECOVERED_V1_643714DE
      CONSUMER_RUN_ID: SUBJECT2_KNIGHT_ORACLE_DRAWABLE_BASELINE_VERIFY_V1_20261023
      BASELINE_VERIFY_DIR: /tmp/knight_oracle_drawable_baseline_verify_v1
      OUT_DIR: canonical/knight_oracle_drawable_court_v1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt

      - name: Verify preregistration and recovered immutable source exists
        run: |
          set -euo pipefail
          python -m py_compile tools/demo/knight_oracle_drawable_court_v1.py
          test -f canonical/KNIGHT_ORACLE_DRAWABLE_COURT_PREREG_V1_20261023.json
          test -f "$AUTHORITY_ROOT/runs/$RUN_ID/IMMUTABLE_STAGE23_SEAL.json"
          RUN_ROOT="$AUTHORITY_ROOT/runs/$RUN_ID" python - <<'PY'
          import json, os
          from pathlib import Path
          prereg=json.loads(Path('canonical/KNIGHT_ORACLE_DRAWABLE_COURT_PREREG_V1_20261023.json').read_text())
          seal=json.loads((Path(os.environ['RUN_ROOT'])/'IMMUTABLE_STAGE23_SEAL.json').read_text())
          if prereg.get('status')!='PREREGISTERED_BEFORE_EXECUTION': raise RuntimeError('DRAWABLE_BASELINE_PREREG_STATUS')
          if prereg.get('product_authority') is not False: raise RuntimeError('DRAWABLE_BASELINE_PRODUCT_AUTHORITY')
          if seal.get('status')!='SEALED_IMMUTABLE_STAGE23': raise RuntimeError('DRAWABLE_BASELINE_SEAL_STATUS')
          if seal.get('overwrite_forbidden') is not True: raise RuntimeError('DRAWABLE_BASELINE_OVERWRITE_POLICY')
          if seal.get('source_owned_visual_mesh_mode') is not False: raise RuntimeError('DRAWABLE_BASELINE_VISUAL_MODE')
          print('KNIGHT_ORACLE_RECOVERED_SOURCE='+json.dumps({
              'run_id':seal.get('run_id'),
              'parent_run_id':seal.get('parent_run_id'),
              'candidate':seal.get('candidate_lineage_hash'),
              'stage23':seal.get('stage23_asset_hash'),
          },sort_keys=True))
          PY

      - name: Behaviorally verify recovered source against frozen canonical GIFs
        run: |
          set -euo pipefail
          rm -rf "$AUTHORITY_ROOT/runs/$CONSUMER_RUN_ID" "$BASELINE_VERIFY_DIR"
          PYTHONPATH=. python tools/demo/consume_knight_corrected_mechanical_caa_stage23_immutable_v1.py \
            --authority-root "$AUTHORITY_ROOT" \
            --source-run-id "$RUN_ID" \
            --consumer-run-id "$CONSUMER_RUN_ID" \
            --out-dir "$BASELINE_VERIFY_DIR" | tee /tmp/knight_oracle_baseline_verify.txt
          OUT="$BASELINE_VERIFY_DIR" python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads((Path(os.environ['OUT'])/'REPORT.json').read_text())
          expected={
            'IDLE':'4c64437ba1f2ecaca8302a52c598f3ba7750a923fd50b90f7cafa3f8473386c3',
            'RUN':'64ad50eeb9ea55ce202ddc46728ffea9074419dbf855938840f69d06661806e3',
            'SLASH':'adc8e8cd0e2272a836e50f7a73585208074703ea5f3c9a549583d7a659fa2b85',
          }
          actual={row['name']:row['sha256'] for row in report['gifs']}
          print('KNIGHT_ORACLE_BASELINE_HASH_GATE='+json.dumps({'actual':actual,'expected':expected,'stage23':report['stage23_asset_hash'],'skin':report['skin_lineage_hash']},sort_keys=True))
          if actual != expected:
              raise RuntimeError('DRAWABLE_ORACLE_BASELINE_FROZEN_RENDER_HASH_MISMATCH')
          PY

      - name: Run oracle drawable court
        run: |
          set -euo pipefail
          rm -rf "$OUT_DIR"
          PYTHONPATH=. python tools/demo/knight_oracle_drawable_court_v1.py \
            --authority-root "$AUTHORITY_ROOT" \
            --run-id "$RUN_ID" \
            --out-dir "$OUT_DIR" | tee /tmp/knight_oracle_drawable_court_v1.txt
          cp /tmp/knight_oracle_drawable_court_v1.txt "$OUT_DIR/AUDIT_STDOUT.txt"
          cp /tmp/knight_oracle_baseline_verify.txt "$OUT_DIR/BASELINE_VERIFY_STDOUT.txt"
          test -f "$OUT_DIR/REPORT.json"
          test -f "$OUT_DIR/DRAWABLE_PARTITION.json"
          test -f "$OUT_DIR/KNIGHT_IDLE_ORACLE_DRAWABLE_COURT_V1.gif"
          test -f "$OUT_DIR/KNIGHT_RUN_ORACLE_DRAWABLE_COURT_V1.gif"
          test -f "$OUT_DIR/KNIGHT_SLASH_ORACLE_DRAWABLE_COURT_V1.gif"

      - name: Upload oracle evidence
        uses: actions/upload-artifact@v4
        with:
          name: knight-oracle-drawable-court-v1
          path: |
            canonical/knight_oracle_drawable_court_v1/*.json
            canonical/knight_oracle_drawable_court_v1/*.txt
            canonical/knight_oracle_drawable_court_v1/*.png
            canonical/knight_oracle_drawable_court_v1/*.gif
          if-no-files-found: error
          retention-days: 14

      - name: Seal oracle evidence on research branch
        run: |
          set -euo pipefail
          git config user.name realsas-self-hosted-runner
          git config user.email runner@realsas.local
          git add "$OUT_DIR"
          if git diff --cached --quiet; then
            echo 'KNIGHT_ORACLE_DRAWABLE_EVIDENCE_UNCHANGED'
            exit 0
          fi
          git commit -m 'research: seal Knight oracle drawable court evidence'
          git fetch origin research/knight-oracle-drawable-court-20261023
          git rebase origin/research/knight-oracle-drawable-court-20261023
          git push origin HEAD:research/knight-oracle-drawable-court-20261023
