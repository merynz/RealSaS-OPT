name: knight-oracle-drawable-court-v1

on:
  workflow_dispatch:
  push:
    branches:
      - research/knight-oracle-drawable-court-20261023
    paths:
      - 'tools/demo/knight_oracle_drawable_court_v1.py'
      - 'tools/demo/knight_oracle_drawable_court_exact_v1.py'
      - '.github/workflows/knight_oracle_drawable_court_v1.yml'
      - 'canonical/KNIGHT_ORACLE_DRAWABLE_COURT_PREREG_V1_20261023.json'

concurrency:
  group: knight-oracle-drawable-court-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  oracle:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 45
    env:
      AUTHORITY_ROOT: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_CORRECTED_MECHANICAL_CAA_HARMONIC_FIRST_IMMUTABLE_V1_70CBD671
      OUT_DIR: canonical/knight_oracle_drawable_court_v1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt

      - name: Verify preregistration and exact immutable source
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/demo/knight_oracle_drawable_court_v1.py \
            tools/demo/knight_oracle_drawable_court_exact_v1.py
          test -f canonical/KNIGHT_ORACLE_DRAWABLE_COURT_PREREG_V1_20261023.json
          test -f "$AUTHORITY_ROOT/runs/$RUN_ID/IMMUTABLE_STAGE23_SEAL.json"
          test -f "$AUTHORITY_ROOT/runs/$RUN_ID/artifacts/23_COMPLETE_APPEARANCE_ASSET_BAKED/complete_appearance_asset.json"
          RUN_ROOT="$AUTHORITY_ROOT/runs/$RUN_ID" python - <<'PY'
          import json, os
          from pathlib import Path
          prereg=json.loads(Path('canonical/KNIGHT_ORACLE_DRAWABLE_COURT_PREREG_V1_20261023.json').read_text())
          root=Path(os.environ['RUN_ROOT'])
          seal=json.loads((root/'IMMUTABLE_STAGE23_SEAL.json').read_text())
          asset=json.loads((root/'artifacts/23_COMPLETE_APPEARANCE_ASSET_BAKED/complete_appearance_asset.json').read_text())
          diag={
              'prereg_status':prereg.get('status'),
              'prereg_source_run_id':prereg.get('source_run_id'),
              'env_run_id':os.environ['RUN_ID'],
              'seal_run_id':seal.get('run_id'),
              'seal_status':seal.get('status'),
              'seal_overwrite_forbidden':seal.get('overwrite_forbidden'),
              'seal_source_owned_visual_mesh_mode':seal.get('source_owned_visual_mesh_mode'),
              'seal_parent_run_id':seal.get('parent_run_id'),
              'seal_stage23_asset_hash':seal.get('stage23_asset_hash'),
              'asset_schema':asset.get('schema'),
              'asset_hash':asset.get('asset_hash'),
              'asset_source_owned_visual_mesh_mode':(asset.get('metadata') or {}).get('source_owned_visual_mesh_mode'),
          }
          print('KNIGHT_ORACLE_DRAWABLE_EXACT_DIAGNOSTIC='+json.dumps(diag,sort_keys=True))
          if prereg.get('status')!='PREREGISTERED_BEFORE_EXECUTION': raise RuntimeError('DRAWABLE_EXACT_PREREG_STATUS')
          if prereg.get('source_run_id')!=seal.get('run_id') or seal.get('run_id')!=os.environ['RUN_ID']: raise RuntimeError('DRAWABLE_EXACT_RUN_BINDING')
          if prereg.get('product_authority') is not False: raise RuntimeError('DRAWABLE_EXACT_PRODUCT_AUTHORITY')
          if seal.get('status')!='SEALED_IMMUTABLE_STAGE23': raise RuntimeError('DRAWABLE_EXACT_SEAL_STATUS')
          if seal.get('overwrite_forbidden') is not True: raise RuntimeError('DRAWABLE_EXACT_OVERWRITE_POLICY')
          if seal.get('source_owned_visual_mesh_mode') is not False: raise RuntimeError('DRAWABLE_EXACT_VISUAL_MODE')
          if asset.get('schema')!='RealSaS.CompleteAppearanceAssetIR.v2': raise RuntimeError('DRAWABLE_EXACT_STAGE23_SCHEMA')
          if asset.get('asset_hash')!=seal.get('stage23_asset_hash'): raise RuntimeError('DRAWABLE_EXACT_STAGE23_HASH')
          print('KNIGHT_ORACLE_DRAWABLE_EXACT_STAGE23_PASS', asset['asset_hash'], seal['parent_run_id'])
          PY

      - name: Run exact historical oracle drawable court
        run: |
          set -euo pipefail
          rm -rf "$OUT_DIR"
          PYTHONPATH=. python tools/demo/knight_oracle_drawable_court_exact_v1.py \
            --authority-root "$AUTHORITY_ROOT" \
            --run-id "$RUN_ID" \
            --out-dir "$OUT_DIR" | tee /tmp/knight_oracle_drawable_court_v1.txt
          cp /tmp/knight_oracle_drawable_court_v1.txt "$OUT_DIR/AUDIT_STDOUT.txt"
          test -f "$OUT_DIR/REPORT.json"
          test -f "$OUT_DIR/DRAWABLE_PARTITION.json"
          test -f "$OUT_DIR/KNIGHT_IDLE_ORACLE_DRAWABLE_COURT_V1.gif"
          test -f "$OUT_DIR/KNIGHT_RUN_ORACLE_DRAWABLE_COURT_V1.gif"
          test -f "$OUT_DIR/KNIGHT_SLASH_ORACLE_DRAWABLE_COURT_V1.gif"

      - name: Upload oracle evidence
        uses: actions/upload-artifact@v4
        with:
          name: knight-oracle-drawable-court-v1
          path: |
            canonical/knight_oracle_drawable_court_v1/*.json
            canonical/knight_oracle_drawable_court_v1/*.txt
            canonical/knight_oracle_drawable_court_v1/*.png
            canonical/knight_oracle_drawable_court_v1/*.gif
          if-no-files-found: error
          retention-days: 14

      - name: Seal oracle evidence on research branch
        run: |
          set -euo pipefail
          git config user.name realsas-self-hosted-runner
          git config user.email runner@realsas.local
          git add "$OUT_DIR"
          if git diff --cached --quiet; then
            echo 'KNIGHT_ORACLE_DRAWABLE_EVIDENCE_UNCHANGED'
            exit 0
          fi
          git commit -m 'research: seal Knight oracle drawable court evidence'
          git fetch origin research/knight-oracle-drawable-court-20261023
          git rebase origin/research/knight-oracle-drawable-court-20261023
          git push origin HEAD:research/knight-oracle-drawable-court-20261023
