name: knight-patch-pca-metric-remesh-feasibility-v1

on:
  push:
    branches:
      - audit/canonical-caa-mechanics-geometry-lock-20261002
    paths:
      - tools/audit_knight_patch_pca_metric_remesh_feasibility_v1.py
      - .github/workflows/knight_patch_pca_metric_remesh_feasibility_v1.yml

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 30
    env:
      RUN_ROOT: /home/monster/realsas_authority/runs/SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929
      STATIC_V7_DIR: /tmp/knight_static_quality_patch_purge_cycle_v7_input
      OUT: /tmp/knight_patch_pca_metric_remesh_feasibility_v1/REPORT.json
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - uses: actions/download-artifact@v4
        with:
          name: knight-static-quality-patch-purge-cycle-v7
          path: /tmp/knight_static_quality_patch_purge_cycle_v7_input
          github-token: ${{ github.token }}
          run-id: 37045557158
      - run: python -m py_compile tools/audit_knight_patch_pca_metric_remesh_feasibility_v1.py
      - name: Test PCA metric-chart patch remeshing feasibility
        run: |
          set -euo pipefail
          rm -rf "$(dirname "$OUT")"
          mkdir -p "$(dirname "$OUT")"
          python tools/audit_knight_patch_pca_metric_remesh_feasibility_v1.py             --run-root "$RUN_ROOT"             --static-v7-dir "$STATIC_V7_DIR"             --out "$OUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knight-patch-pca-metric-remesh-feasibility-v1
          path: /tmp/knight_patch_pca_metric_remesh_feasibility_v1/REPORT.json
          if-no-files-found: error
          retention-days: 30
