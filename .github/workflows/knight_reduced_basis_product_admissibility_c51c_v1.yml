name: knight-reduced-basis-product-admissibility-c51c-v1

on:
  push:
    branches: [impl/carrier-first-mechanical-compilation-20261004]
    paths:
      - tools/audit_knight_reduced_basis_product_admissibility_c51c_v1.py
      - .github/workflows/knight_reduced_basis_product_admissibility_c51c_v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  court:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "4"
      PY: /home/monster/realsas-ml312/bin/python
      AUTH: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929
      C50B: /home/monster/realsas_research_scratch/tree_retarget_skin_c50b_37207528345
      C51B: /home/monster/realsas_research_scratch/structural_prune_c51b_37207907720
      OUT: /home/monster/realsas_research_scratch/reduced_basis_product_c51c_${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$pythonLocation/lib:${LD_LIBRARY_PATH:-}"
          test -x "$PY"
          test -f "$C50B/REPORT.json"
          test -f "$C51B/REPORT.json"
          "$PY" -m py_compile             tools/audit_knight_reduced_basis_product_admissibility_c51c_v1.py
          echo "C51C_PREFLIGHT_PASS"

      - name: Run reduced-basis product admissibility gate
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$pythonLocation/lib:${LD_LIBRARY_PATH:-}"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          "$PY" -u tools/audit_knight_reduced_basis_product_admissibility_c51c_v1.py             --authority-root "$AUTH"             --run-id "$RUN_ID"             --c50b-dir "$C50B"             --c51b-dir "$C51B"             --out-dir "$OUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knight-reduced-basis-product-admissibility-c51c-v1
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
