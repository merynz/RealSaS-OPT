name: knight-relation-appearance-ownership-diagnostic

permissions:
  contents: write

on:
  push:
    branches:
      - research/vf11-certified-adaptive-20260921
    paths:
      - 'tools/demo/inspect_knight_relation_appearance_ownership_v1.py'
      - '.github/workflows/knight_relation_appearance_ownership_diagnostic.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 10
    env:
      RUN_ID: SUBJECT2_KNIGHT_DEMO_V2_20260924
      AUTHORITY_ROOT: /home/monster/realsas_authority
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Inspect relation appearance ownership
        run: |
          set -euo pipefail
          mkdir -p canonical/knight_relation_appearance_ownership_v1
          PYTHONPATH=. python -m tools.demo.inspect_knight_relation_appearance_ownership_v1 \
            --authority-root "$AUTHORITY_ROOT" \
            --run-id "$RUN_ID" \
            --out-path canonical/knight_relation_appearance_ownership_v1/REPORT.json
      - name: Seal diagnostic
        run: |
          set -euo pipefail
          git config user.name realsas-self-hosted-runner
          git config user.email runner@realsas.local
          git add canonical/knight_relation_appearance_ownership_v1/REPORT.json
          git commit -m "diagnostic: seal Knight relation appearance ownership"
          git fetch origin research/vf11-certified-adaptive-20260921
          git rebase origin/research/vf11-certified-adaptive-20260921
          git push origin HEAD:research/vf11-certified-adaptive-20260921
