name: knight-remaining-smear-owner-audit-v1

on:
  push:
    branches:
      - research/vf11-certified-adaptive-20260921
    paths:
      - 'tools/demo/audit_knight_remaining_smear_owner_v1.py'
      - '.github/workflows/knight_remaining_smear_owner_audit_v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: knight-remaining-smear-owner-audit-v1
  cancel-in-progress: true

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    env:
      RUN_ID: SUBJECT2_KNIGHT_DEMO_V2_20260924
      AUTHORITY_ROOT: /home/monster/realsas_authority
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Audit remaining smear owners
        run: |
          set -euo pipefail
          rm -rf canonical/knight_remaining_smear_owner_audit_v1
          python -m tools.demo.audit_knight_remaining_smear_owner_v1             --authority-root "$AUTHORITY_ROOT"             --run-id "$RUN_ID"             --out-dir canonical/knight_remaining_smear_owner_audit_v1
      - name: Seal
        run: |
          set -euo pipefail
          git config user.name realsas-self-hosted-runner
          git config user.email runner@realsas.local
          git add canonical/knight_remaining_smear_owner_audit_v1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'diagnostic: seal remaining smear owner audit'
          git fetch origin research/vf11-certified-adaptive-20260921
          git rebase origin/research/vf11-certified-adaptive-20260921
          git push origin HEAD:research/vf11-certified-adaptive-20260921
