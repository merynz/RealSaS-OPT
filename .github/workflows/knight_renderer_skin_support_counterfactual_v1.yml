name: knight-renderer-skin-support-counterfactual-v1

on:
  push:
    branches:
      - audit/knight-rest-visual-owner-20260930
    paths:
      - tools/audit_knight_renderer_skin_support_counterfactual_v1.py
      - .github/workflows/knight_renderer_skin_support_counterfactual_v1.yml

concurrency:
  group: knight-renderer-skin-support-counterfactual-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 25
    env:
      AUTHORITY_ROOT: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_CORRECTED_MECHANICAL_CAA_HARMONIC_FIRST_IMMUTABLE_V1_70CBD671
      OUT: canonical/KNIGHT_RENDERER_SKIN_SUPPORT_COUNTERFACTUAL_V1_20260930.json
      IMAGE_DIR: /tmp/knight_renderer_skin_support_ab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Execute renderer skin-support counterfactual
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$IMAGE_DIR"
          mkdir -p "$IMAGE_DIR"
          python -m py_compile tools/audit_knight_renderer_skin_support_counterfactual_v1.py
          PYTHONPATH=. python tools/audit_knight_renderer_skin_support_counterfactual_v1.py \
            --authority-root "$AUTHORITY_ROOT" \
            --run-id "$RUN_ID" \
            --out "$OUT" \
            --image-dir "$IMAGE_DIR"
      - name: Upload A/B evidence
        uses: actions/upload-artifact@v4
        with:
          name: knight-renderer-skin-support-counterfactual-v1
          path: |
            ${{ env.OUT }}
            ${{ env.IMAGE_DIR }}/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Seal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "realsas-self-hosted-runner"
          git config user.email "runner@realsas.local"
          git add "$OUT"
          git commit -m "audit: seal renderer mechanical skin support counterfactual"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
