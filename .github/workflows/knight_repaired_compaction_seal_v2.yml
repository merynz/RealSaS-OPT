name: knight-repaired-compaction-seal-v2

on:
  push:
    branches:
      - audit/canonical-caa-mechanics-geometry-lock-20261002
    paths:
      - tools/seal_knight_repaired_compaction_v2.py
      - .github/workflows/knight_repaired_compaction_seal_v2.yml

permissions:
  actions: read
  contents: read

jobs:
  seal:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 30
    env:
      RUN_ROOT: /home/monster/realsas_authority/runs/SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929
      INPUT_DIR: /tmp/knight_repaired_compaction_v1_input
      OUT_DIR: /tmp/knight_repaired_compaction_seal_v2
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - uses: actions/download-artifact@v4
        with:
          name: knight-repaired-compaction-seal-v1
          path: /tmp/knight_repaired_compaction_v1_input
          github-token: ${{ github.token }}
          run-id: 37009300021
      - run: python -m py_compile tools/seal_knight_repaired_compaction_v2.py
      - name: Seal edge+vertex manifold repaired inverse
        run: |
          set -euo pipefail
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          python tools/seal_knight_repaired_compaction_v2.py             --run-root "$RUN_ROOT"             --parent-inverse-npz "$INPUT_DIR/repaired_inverse.npz"             --parent-seal "$INPUT_DIR/SEAL.json"             --out-dir "$OUT_DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: knight-repaired-compaction-seal-v2
          path: /tmp/knight_repaired_compaction_seal_v2
          if-no-files-found: error
          retention-days: 30
