name: knight-repaired-quality-collapse-v1

on:
  push:
    branches:
      - audit/canonical-caa-mechanics-geometry-lock-20261002
    paths:
      - tools/audit_knight_repaired_quality_collapse_v1.py
      - .github/workflows/knight_repaired_quality_collapse_v1.yml

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 45
    env:
      RUN_ROOT: /home/monster/realsas_authority/runs/SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929
      INPUT_DIR: /tmp/knight_repaired_compaction_input
      OUT: /tmp/knight_repaired_quality_collapse_v1/REPORT.json
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - uses: actions/download-artifact@v4
        with:
          name: knight-repaired-compaction-seal-v1
          path: /tmp/knight_repaired_compaction_input
          github-token: ${{ github.token }}
          run-id: 37009300021
      - name: Verify repaired inverse seal
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("/tmp/knight_repaired_compaction_input")
          seal=json.loads((root/"SEAL.json").read_text())
          p=root/"repaired_inverse.npz"
          assert hashlib.sha256(p.read_bytes()).hexdigest()==seal["inverse_npz_sha256"]
          assert seal["final_metrics"]["nonmanifold_edge_count"]==0
          PY
      - run: python -m py_compile tools/audit_knight_repaired_quality_collapse_v1.py
      - name: Apply generic flip-collapse quality repair
        run: |
          set -euo pipefail
          rm -rf "$(dirname "$OUT")"
          mkdir -p "$(dirname "$OUT")"
          python tools/audit_knight_repaired_quality_collapse_v1.py             --run-root "$RUN_ROOT"             --inverse-npz "$INPUT_DIR/repaired_inverse.npz"             --out "$OUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knight-repaired-quality-collapse-v1
          path: /tmp/knight_repaired_quality_collapse_v1/REPORT.json
          if-no-files-found: warn
          retention-days: 30
