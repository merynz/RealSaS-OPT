name: knight-repaired-static-quality-v2

on:
  push:
    branches:
      - audit/canonical-caa-mechanics-geometry-lock-20261002
    paths:
      - tools/audit_knight_repaired_static_quality_v2.py
      - .github/workflows/knight_repaired_static_quality_v2.yml

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 30
    env:
      RUN_ROOT: /home/monster/realsas_authority/runs/SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929
      INPUT_DIR: /tmp/knight_repaired_compaction_v2_input
      OUT: /tmp/knight_repaired_static_quality_v2/REPORT.json
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - uses: actions/download-artifact@v4
        with:
          name: knight-repaired-compaction-seal-v2
          path: /tmp/knight_repaired_compaction_v2_input
          github-token: ${{ github.token }}
          run-id: 37023349486
      - run: python -m py_compile tools/audit_knight_repaired_static_quality_v2.py
      - name: Run topology-safe static quality repair v2
        run: |
          set -euo pipefail
          rm -rf "$(dirname "$OUT")"
          mkdir -p "$(dirname "$OUT")"
          python tools/audit_knight_repaired_static_quality_v2.py             --run-root "$RUN_ROOT"             --inverse-npz "$INPUT_DIR/repaired_inverse_v2.npz"             --out "$OUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knight-repaired-static-quality-v2
          path: /tmp/knight_repaired_static_quality_v2/REPORT.json
          if-no-files-found: warn
          retention-days: 30
