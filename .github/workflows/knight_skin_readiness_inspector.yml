name: knight-skin-readiness-inspector

on:
  workflow_dispatch:
  workflow_run:
    workflows: [platform-developer-deployment]
    types: [completed]

concurrency:
  group: knight-skin-readiness-inspector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  activation:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      expected_sha: ${{ steps.resolve.outputs.expected_sha }}
    steps:
      - name: Resolve selected canonical SHA
        id: sha
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'workflow_run' ]; then
            echo "expected_sha=$WORKFLOW_RUN_HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "expected_sha=$DISPATCH_SHA" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.expected_sha }}
          fetch-depth: 2

      - name: Resolve read-only inspector request
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SHA: ${{ steps.sha.outputs.expected_sha }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGER_PATH: canonical/KNIGHT_SKIN_READINESS_INSPECTOR_TRIGGER_V1.json
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import subprocess
          from pathlib import Path

          event = os.environ['EVENT_NAME']
          expected_sha = os.environ['EXPECTED_SHA'].strip().lower()
          should_run = event == 'workflow_dispatch'
          if event == 'workflow_run':
              if (os.environ.get('WORKFLOW_RUN_CONCLUSION') == 'success' and
                      os.environ.get('WORKFLOW_RUN_HEAD_BRANCH') == 'main'):
                  changed = subprocess.check_output(
                      ['git', 'diff-tree', '--no-commit-id', '--name-only', '-r', 'HEAD^1', 'HEAD'],
                      text=True,
                  ).splitlines()
                  trigger_path = Path(os.environ['TRIGGER_PATH'])
                  if str(trigger_path) in changed:
                      trigger = json.loads(trigger_path.read_text(encoding='utf-8'))
                      assert trigger.get('schema') == 'RealSaS.KnightSkinReadinessInspectorTrigger.v1', 'SKIN_READINESS_TRIGGER_SCHEMA'
                      assert trigger.get('operation') == 'KNIGHT_SKIN_READINESS_INSPECT', 'SKIN_READINESS_TRIGGER_OPERATION'
                      assert isinstance(trigger.get('enabled'), bool), 'SKIN_READINESS_TRIGGER_ENABLED_BOOL'
                      should_run = bool(trigger['enabled'])

          print(f"should_run={'true' if should_run else 'false'}")
          print(f'expected_sha={expected_sha}')
          PY

  inspector:
    needs: activation
    if: needs.activation.outputs.should_run == 'true'
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    env:
      PLATFORM_ROOT: /home/monster/realsas_platform
      API_ROOT: http://127.0.0.1:8080
      EXPECTED_SHA: ${{ needs.activation.outputs.expected_sha }}
      OUTPUT_PATH: /home/monster/realsas_authority/skin_readiness/actions/${{ github.run_id }}-${{ github.run_attempt }}/INSPECTION.json
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}

      - name: Require exact deployed canonical main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
          "$PLATFORM_ROOT/current/bin/realsas-python" - <<'PY'
          import json
          import os
          from pathlib import Path

          deployment = json.loads(Path('/home/monster/realsas_platform/deployment.json').read_text())
          assert deployment['schema'] == 'RealSaS.DeveloperDeployment.v1', 'SKIN_READINESS_DEPLOYMENT_SCHEMA'
          assert deployment['code_sha'] == os.environ['EXPECTED_SHA'], 'SKIN_READINESS_DEPLOYED_MAIN_DRIFT'
          PY

      - name: Require healthy loopback Platform API
        run: |
          set -euo pipefail
          "$PLATFORM_ROOT/current/bin/realsas-python" - <<'PY'
          import json
          import os
          import urllib.request

          with urllib.request.urlopen(os.environ['API_ROOT'].rstrip('/') + '/v1/ops/status', timeout=10) as response:
              assert response.status == 200, 'SKIN_READINESS_PLATFORM_API_UNHEALTHY'
              json.load(response)
          PY

      - name: Execute read-only Knight Skin readiness inspection
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$OUTPUT_PATH")"
          "$PLATFORM_ROOT/current/bin/realsas-python" \
            "$GITHUB_WORKSPACE/tools/ops/inspect_knight_skin_readiness_v1.py" \
            --api-root "$API_ROOT" \
            --expected-main-sha "$EXPECTED_SHA" \
            --out "$OUTPUT_PATH"

      - name: Verify inspection receipt and authority boundaries
        run: |
          set -euo pipefail
          "$PLATFORM_ROOT/current/bin/realsas-python" - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(Path(os.environ['OUTPUT_PATH']).read_text(encoding='utf-8'))
          assert receipt['schema'] == 'RealSaS.KnightSkinReadinessInspection.v1', 'SKIN_READINESS_RECEIPT_SCHEMA'
          assert receipt['source_code_sha'] == os.environ['EXPECTED_SHA'], 'SKIN_READINESS_SOURCE_SHA_DRIFT'
          assert receipt['status'] in {
              'READY_FOR_RESEARCH_SKIN_EXECUTION',
              'READY_FOR_DRAFT_MODEL_EVALUATION',
              'NOT_READY',
          }, 'SKIN_READINESS_STATUS_INVALID'
          for key in (
              'scientific_pass_minted',
              'qualification_minted',
              'model_inference_executed',
              'platform_mutation_performed',
              'model_promotion_performed',
              'product_skin_activated',
              'product_revision_minted',
              'genericity_claimed',
          ):
              assert receipt[key] is False, f'SKIN_READINESS_AUTHORITY_VIOLATION:{key}'
          if receipt['status'] == 'READY_FOR_DRAFT_MODEL_EVALUATION':
              assert receipt['decision']['typed_bundle_ready'] is True
              assert receipt['decision']['runtime_identity_ready'] is True
              assert receipt['decision']['research_execution_admitted'] is False
              assert receipt['decision']['draft_evaluation_required'] is True
          PY

      - name: Preserve exact read-only inspection receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knight-skin-readiness-${{ github.run_id }}
          path: ${{ env.OUTPUT_PATH }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
