name: knight-skin-topology-compatibility-audit-v1

on:
  push:
    branches:
      - research/vf11-certified-adaptive-20260921
    paths:
      - '.github/workflows/knight_skin_topology_compatibility_audit_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    env:
      RUN_ID: SUBJECT2_KNIGHT_DEMO_V2_20260924
      RUN_ROOT: /home/monster/realsas_authority/runs/SUBJECT2_KNIGHT_DEMO_V2_20260924
      ARACHNE_REMOTE: gdrive:RealSaS_SUBJECT2_KNIGHT_DEMO_V2_20260924/ARACHNE_STAGE31_V6_DEMO_OUTPUT
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Audit current topology x skin compatibility
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import numpy as np
          from compiler.realsas_compiler_core.artifact_codec_v2 import (
              canonical_mesh_candidate_from_dict,
              qualified_skeleton_from_dict,
              qualified_skin_from_dict,
              rigging_surface_from_dict,
          )
          from tools.demo.render_knight_motion_preview_v1 import _candidate_skin_weights

          root=Path(os.environ["RUN_ROOT"])
          ledger=json.loads((root/"ACTIVE_RUN_V2.json").read_text())
          by={x["id"]:x for x in ledger["stages"]}
          def one(stage,schema):
              rows=[x for x in by[stage]["outputs"] if x["schema"]==schema]
              assert len(rows)==1,(stage,schema,len(rows))
              return json.loads(Path(rows[0]["path"]).read_text())
          surf=rigging_surface_from_dict(one("15_RIGGING_SURFACE_QUALIFIED","RealSaS.RiggingSurfaceIR.v1"))
          cand=canonical_mesh_candidate_from_dict(one("18_CANONICAL_MESH_ADDRESSING_BUILD","RealSaS.CanonicalMeshCandidateIR.v1"))
          skel=qualified_skeleton_from_dict(one("28_SKELETON_QUALIFIED","RealSaS.QualifiedSkeletonIR.v1"))
          skin=qualified_skin_from_dict(one("32_SKIN_QUALIFIED","RealSaS.QualifiedSkinIR.v1"))

          joint_ids,W=_candidate_skin_weights(cand,skin,skel)
          vi={str(v.candidate_vertex_id):i for i,v in enumerate(cand.vertices)}
          candidate_edges=sorted({tuple(sorted((str(f[a]),str(f[b])))) for f in cand.faces for a,b in ((0,1),(1,2),(2,0))})
          safe_rel=set()
          for rel in surf.local_relations:
              k=str(rel.relation_kind).upper()
              if any(t in k for t in ("UNKNOWN","AMBIGUOUS","OCCLUDED","UNOBSERVED")): continue
              if float(rel.score)<=0: continue
              a,b=map(str,rel.endpoints)
              safe_rel.add(tuple(sorted((a,b))))
          def identity_sid(v):
              coeff=tuple(v.support_binding.coefficients)
              if len(coeff)==1 and abs(float(coeff[0][1])-1.0)<=1e-12:
                  return str(coeff[0][0])
              return None
          sid_by_vid={str(v.candidate_vertex_id):identity_sid(v) for v in cand.vertices}

          skin_rows={str(r.surface_id):r for r in skin.rows}
          joint_index={jid:i for i,jid in enumerate(joint_ids)}
          def surface_w(sid):
              x=np.zeros((len(joint_ids),),dtype=np.float64)
              row=skin_rows[sid]
              for jid,w in row.influences:
                  x[joint_index[str(jid)]]=float(w)
              return x
          surf_w_cache={sid:surface_w(sid) for sid in skin_rows}
          rel_l1=[]
          for a,b in safe_rel:
              if a in surf_w_cache and b in surf_w_cache:
                  rel_l1.append(float(np.abs(surf_w_cache[a]-surf_w_cache[b]).sum()))
          edge_rows=[]
          for a,b in candidate_edges:
              ia,ib=vi[a],vi[b]
              l1=float(np.abs(W[ia]-W[ib]).sum())
              sa,sb=sid_by_vid[a],sid_by_vid[b]
              relation_member=bool(sa and sb and tuple(sorted((sa,sb))) in safe_rel)
              edge_rows.append((l1,a,b,sa,sb,relation_member))
          vals=np.array([x[0] for x in edge_rows],dtype=np.float64)
          rv=np.array(rel_l1,dtype=np.float64)
          def summ(x):
              if len(x)==0:return {}
              return {
                "count":int(len(x)),
                "mean":float(np.mean(x)),
                "p50":float(np.quantile(x,.5)),
                "p90":float(np.quantile(x,.9)),
                "p95":float(np.quantile(x,.95)),
                "p99":float(np.quantile(x,.99)),
                "max":float(np.max(x)),
                "gt_0_5":int(np.sum(x>0.5)),
                "gt_1_0":int(np.sum(x>1.0)),
                "gt_1_5":int(np.sum(x>1.5)),
                "gt_1_9":int(np.sum(x>1.9)),
              }
          print("SURFACE_RELATION_SKIN_L1",json.dumps(summ(rv),sort_keys=True))
          print("STAGE18_EDGE_SKIN_L1",json.dumps(summ(vals),sort_keys=True))
          id_edges=[x for x in edge_rows if x[3] and x[4]]
          print("STAGE18_IDENTITY_EDGE_COUNTS",json.dumps({
              "identity_endpoint_edges":len(id_edges),
              "relation_member":sum(x[5] for x in id_edges),
              "not_relation_member":sum(not x[5] for x in id_edges),
          },sort_keys=True))
          print("TOP_STAGE18_DISCONTINUITY_EDGES")
          for x in sorted(edge_rows,reverse=True)[:40]:
              print(json.dumps({"l1":x[0],"a":x[1],"b":x[2],"surface_a":x[3],"surface_b":x[4],"safe_relation_member":x[5]},sort_keys=True))

          rep=json.loads(Path("canonical/knight_smear_topface_skin_counterfactual_v1/REPORT.json").read_text())
          print("SMEAR_OFFENDER_EDGE_AUDIT")
          for case in rep["cases"]:
              face=case["offender_vertex_ids"]
              rows=[]
              for a,b in ((face[0],face[1]),(face[1],face[2]),(face[2],face[0])):
                  ia,ib=vi[a],vi[b]
                  sa,sb=sid_by_vid[a],sid_by_vid[b]
                  rows.append({
                    "a":a,"b":b,
                    "l1":float(np.abs(W[ia]-W[ib]).sum()),
                    "surface_a":sa,"surface_b":sb,
                    "safe_relation_member":bool(sa and sb and tuple(sorted((sa,sb))) in safe_rel),
                  })
              print(json.dumps({"label":case["label"],"face":case["offender_face_index"],"edges":rows},sort_keys=True))
          PY
      - name: Pull V6 closure metadata read-only
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          rclone copy "$ARACHNE_REMOTE" "$tmp" --checksum
          python - "$tmp" <<'PY'
          import json,re,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          result=json.loads((root/"ARACHNE_KNIGHT_V6_RESULT.json").read_text())
          print("V6_RESULT_TOP_KEYS",sorted(result))
          print("V6_FINAL_EVAL",json.dumps(result.get("final_evaluation"),sort_keys=True)[:12000])
          src=(root/"run_knight_arachne_v6_demo_closure_v1.py").read_text(errors="replace")
          pats=("teacher","target","truth","source_mesh","mesh_faces","faces","topology",".npz",".json","skin")
          for i,line in enumerate(src.splitlines(),1):
              lo=line.lower()
              if any(p in lo for p in pats):
                  print(f"SRC:{i}:{line[:500]}")
          print("REMOTE_FILES")
          for p in sorted(root.iterdir()):
              print(p.name,p.stat().st_size)
          PY
