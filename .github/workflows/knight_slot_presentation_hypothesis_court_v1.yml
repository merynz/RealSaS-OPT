name: knight-slot-presentation-hypothesis-court-v1

on:
  push:
    branches:
      - integration/generic-main-normalization-v2-20260930
    paths:
      - 'tools/demo/audit_knight_slot_presentation_hypothesis_v1.py'
      - 'tools/demo/audit_knight_slot_presentation_hypothesis_v2.py'
      - '.github/workflows/knight_slot_presentation_hypothesis_court_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  court:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      AUTHORITY_ROOT: /home/monster/realsas_authority
      REALSAS_AUTHORITY_ROOT: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_DEMO_V2_20260924
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Materialize exact historical court inputs
        run: |
          set -euo pipefail
          RESEARCH_SHA=6ed060351512a5f76a206acce011b585f48b1768
          git fetch --no-tags origin "$RESEARCH_SHA"
          git show "$RESEARCH_SHA:canonical/knight_source_owned_deformation_regions_v1/REPORT.json" \
            > /tmp/knight_deformation_parent_report.json
          git show "$RESEARCH_SHA:canonical/KNIGHT_MOTION_SOURCE_ACTION_DIAGNOSTIC_20260927.json" \
            > /tmp/knight_motion_source_diagnostic.json
          git show "$RESEARCH_SHA:tools/demo/render_knight_motion_preview_v1.py" \
            > /tmp/realsas_knight_motion_court_helper.py
          sha256sum \
            /tmp/knight_deformation_parent_report.json \
            /tmp/knight_motion_source_diagnostic.json \
            /tmp/realsas_knight_motion_court_helper.py
      - name: Run slot-aware presentation court
        run: |
          python -m tools.demo.audit_knight_slot_presentation_hypothesis_v2 \
            --authority-root "$AUTHORITY_ROOT" \
            --run-id "$RUN_ID" \
            --parent-report /tmp/knight_deformation_parent_report.json \
            --motion-helper /tmp/realsas_knight_motion_court_helper.py \
            --source-report /tmp/knight_motion_source_diagnostic.json \
            --out /tmp/knight_slot_presentation_hypothesis_v2.json
      - name: Summarize
        run: |
          python - <<'PY'
          import json
          p=json.load(open("/tmp/knight_slot_presentation_hypothesis_v2.json"))
          print("VERDICT",p["hypothesis_verdict"])
          print("LOGICAL_SLOT_COUNT",p["logical_slot_count"])
          print("BLOCKERS",p["blockers"])
          for v in p["views"]:
              print("VIEW",v["view_index"],
                    "binding",v["binding_status"],
                    "slots",v["visible_logical_slot_count"],
                    "charts",v["chart_count"],
                    "faces",v["visual_face_count"],
                    "fill_p95",v["p95_unowned_fill_distance_px"],
                    "fill_max",v["max_unowned_fill_distance_px"])
              if v["binding_status"]!="PASS":
                  print("BIND_BLOCKER",v["view_index"],v.get("binding_blocker"))
                  continue
              print("BIND",v["view_index"],
                    "rest",v["max_rest_error_px"],
                    "seed_p95",v["p95_binding_seed_distance_px"],
                    "seed_max",v["max_binding_seed_distance_px"],
                    "extrap",v["max_affine_extrapolation_penalty"])
              for clip,rows in v["qa_by_clip"].items():
                  print("QA",v["view_index"],clip,
                        "flip",max(x["flipped_triangles"] for x in rows),
                        "flip_fraction",max(x["flip_fraction"] for x in rows),
                        "p95",max(x["p95_edge_stretch"] for x in rows),
                        "p99",max(x["p99_edge_stretch"] for x in rows),
                        "max",max(x["max_edge_stretch"] for x in rows))
          PY
