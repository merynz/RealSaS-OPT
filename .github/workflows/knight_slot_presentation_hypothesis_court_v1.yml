name: knight-slot-presentation-hypothesis-court-v1

on:
  push:
    branches:
      - integration/generic-main-normalization-v2-20260930
    paths:
      - 'tools/demo/audit_knight_slot_presentation_hypothesis_v1.py'
      - '.github/workflows/knight_slot_presentation_hypothesis_court_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  court:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      AUTHORITY_ROOT: /home/monster/realsas_authority
      REALSAS_AUTHORITY_ROOT: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_DEMO_V2_20260924
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Inspect Knight authority ledger and surviving artifacts
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["AUTHORITY_ROOT"])/"runs"/os.environ["RUN_ID"]
          ledger=json.loads((root/"ACTIVE_RUN_V2.json").read_text())
          by={str(x["id"]):x for x in ledger["stages"]}
          for sid in (
              "18_CANONICAL_MESH_ADDRESSING_BUILD",
              "35_DYNAMIC_MECHANICAL_MESH_QUALIFIED",
              "36_QUALIFIED_MESH_SKIN_TRANSFER",
              "37_QUALIFIED_PRESENTATION_STRUCTURE",
              "38_CANONICAL_PUPPET_SEALED",
              "41_MOTION_DYNAMIC_PROOF",
          ):
              row=by.get(sid,{})
              print("LEDGER_STAGE",json.dumps({
                  "id":sid,
                  "status":row.get("status"),
                  "blockers":row.get("blockers") or [],
                  "outputs":[
                      {"schema":x.get("schema"),"path":x.get("path"),"sha256":x.get("sha256")}
                      for x in row.get("outputs") or []
                  ],
              },sort_keys=True))
          for dirname in (
              "18_CANONICAL_MESH_ADDRESSING_BUILD",
              "27_QUALIFIED_MESH_GATE",
              "35_DYNAMIC_MECHANICAL_MESH_QUALIFIED",
              "36_QUALIFIED_MESH_SKIN_TRANSFER",
              "37_QUALIFIED_PRESENTATION_STRUCTURE",
              "38_CANONICAL_PUPPET_SEALED",
              "41_MOTION_DYNAMIC_PROOF",
          ):
              d=root/"artifacts"/dirname
              rows=[]
              if d.is_dir():
                  for q in sorted(d.rglob("*")):
                      if q.is_file():
                          rows.append(str(q.relative_to(root)))
              print("ARTIFACT_DIR",dirname,json.dumps(rows[:120]))
          PY
      - name: Run slot-aware presentation court
        run: |
          python -m tools.demo.audit_knight_slot_presentation_hypothesis_v1             --authority-root "$AUTHORITY_ROOT"             --run-id "$RUN_ID"             --out /tmp/knight_slot_presentation_hypothesis_v1.json
      - name: Summarize
        run: |
          python - <<'PY'
          import json
          p=json.load(open("/tmp/knight_slot_presentation_hypothesis_v1.json"))
          print("SLOT_COUNT",p["slot_count"])
          for v in p["views"]:
              print("VIEW",v["view_index"],"slots",v["visible_logical_slot_count"],
                    "charts",v["chart_count"],"faces",v["visual_face_count"],
                    "rest",v["max_rest_error_px"],
                    "seed_max",v["max_binding_seed_distance_px"],
                    "fill_max",v["max_unowned_fill_distance_px"])
              for clip,rows in v["qa_by_clip"].items():
                  print("QA",v["view_index"],clip,
                        "flip",max(x["flipped_triangles"] for x in rows),
                        "flip_fraction",max(x["flip_fraction"] for x in rows),
                        "p95",max(x["p95_edge_stretch"] for x in rows),
                        "p99",max(x["p99_edge_stretch"] for x in rows),
                        "max",max(x["max_edge_stretch"] for x in rows))
          PY
