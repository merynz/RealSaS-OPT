name: knight-solved-lineage-gifs-v1

on:
  workflow_dispatch:
  push:
    branches: [research/vf11-certified-adaptive-20260921]
    paths:
      - 'tools/demo/build_knight_solution_lineage_gifs_v1.py'
      - '.github/workflows/knight_solved_lineage_gifs_v1.yml'

concurrency:
  group: knight-solved-lineage-gifs-v1
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 45
    env:
      AUTHORITY_ROOT: /home/monster/realsas_authority
      PARENT_RUN_ID: SUBJECT2_KNIGHT_DEMO_V2_20260924
      CHILD_RUN_ID: SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929
      A100_AUDIT_REMOTE: gdrive:RealSaS_SUBJECT2_KNIGHT_DEMO_V2_20260924/ARACHNE_V6_COVERAGE_SAMPLING_2X2_INDEXSPACE_FIXED_20260929/ARACHNE_V6_2X2_INDEXSPACE_FIXED_RESULT_AUDIT.json
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Fetch exact Arachne reliability audit
        run: |
          set -euo pipefail
          mkdir -p /tmp/knight_solved_lineage
          rclone copyto "$A100_AUDIT_REMOTE" /tmp/knight_solved_lineage/a100_audit.json --checksum
      - name: Syntax
        run: python -m py_compile tools/demo/build_knight_solution_lineage_gifs_v1.py
      - name: Build exact solved lineage and GIFs
        run: |
          set -euo pipefail
          rm -rf /tmp/knight_solved_lineage/out
          mkdir -p /tmp/knight_solved_lineage/out
          PYTHONPATH=. python tools/demo/build_knight_solution_lineage_gifs_v1.py \
            --authority-root "$AUTHORITY_ROOT" \
            --parent-run-id "$PARENT_RUN_ID" \
            --child-run-id "$CHILD_RUN_ID" \
            --skin-json canonical/knight_arachne_v6_2x2_rebound_stage35_v1/UNIFORM_ALL_PROJECTED.QUALIFIED_SKIN.json \
            --a100-audit-json /tmp/knight_solved_lineage/a100_audit.json \
            --rebound-report-json canonical/knight_arachne_v6_2x2_rebound_stage35_v1/UNIFORM_ALL_PROJECTED.REPORT.json \
            --repo-commit "$GITHUB_SHA" \
            --out-dir /tmp/knight_solved_lineage/out
      - name: Upload GIFs and lineage
        uses: actions/upload-artifact@v4
        with:
          name: knight-solved-lineage-gifs-v1
          path: /tmp/knight_solved_lineage/out
          if-no-files-found: error
          retention-days: 14
