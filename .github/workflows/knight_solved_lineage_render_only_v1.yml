name: knight-solved-lineage-render-only-v1

on:
  workflow_dispatch:
  push:
    branches: [research/vf11-certified-adaptive-20260921]
    paths:
      - 'tools/demo/render_knight_solution_visual_resume_v1.py'
      - '.github/workflows/knight_solved_lineage_render_only_v1.yml'

concurrency:
  group: knight-solved-lineage-render-only-v1
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 8
    env:
      AUTHORITY_ROOT: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929
      PLAYER: /tmp/realsas_runtime_visual_mesh_v1_solution
      OUT_DIR: /tmp/knight_solved_lineage_render_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Build native visual renderer
        run: |
          set -euo pipefail
          c++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra -pedantic \
            tools/demo/native_visual_mesh_preview_v1.cpp \
            -lpng -lz -o "$PLAYER"
      - name: Render exact solved lineage only
        run: |
          set -euo pipefail
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          PYTHONPATH=. python tools/demo/render_knight_solution_visual_resume_v1.py \
            --authority-root "$AUTHORITY_ROOT" \
            --run-id "$RUN_ID" \
            --out-dir "$OUT_DIR" \
            --native-player "$PLAYER" \
            --render-resolution 512
      - name: Upload GIFs
        uses: actions/upload-artifact@v4
        with:
          name: knight-solved-lineage-render-only-v1
          path: |
            /tmp/knight_solved_lineage_render_only/*.gif
            /tmp/knight_solved_lineage_render_only/REPORT.json
          if-no-files-found: error
          retention-days: 7
