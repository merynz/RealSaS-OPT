name: knight-source-authority-alignment-v1

on:
  workflow_dispatch:
  push:
    branches:
      - research/vf11-certified-adaptive-20260921
    paths:
      - 'tools/audit_knight_source_authority_alignment_v1.py'
      - '.github/workflows/knight_source_authority_alignment_v1.yml'

concurrency:
  group: knight-source-authority-alignment-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 10
    env:
      AUTHORITY_ROOT: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_DEMO_V2_20260924
      V5_HANDOFF: gdrive:RealSaS_SUBJECT2_KNIGHT_DEMO_V2_20260924/ARACHNE_STAGE31_V5_DEMO_HANDOFF
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        run: python -m pip install --no-input --progress-bar off numpy
      - name: Fetch exact source NPZ
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          echo "$tmp" > /tmp/source_alignment_tmp
          rclone copyto "$V5_HANDOFF/KNIGHT_EVALUATED_TEACHER_SOURCE.npz" "$tmp/source.npz" --checksum
          sha256sum "$tmp/source.npz"
      - name: Measure source authority alignment
        run: |
          set -euo pipefail
          tmp="$(cat /tmp/source_alignment_tmp)"
          motion="$AUTHORITY_ROOT/runs/$RUN_ID/inputs/motion/quaternius_knight_v1/demo_run_v1.motion.json"
          PYTHONPATH=. python tools/audit_knight_source_authority_alignment_v1.py             --motion "$motion"             --source "$tmp/source.npz"             --out canonical/KNIGHT_SOURCE_AUTHORITY_ALIGNMENT_AUDIT_V1_20260928.json             | tee /tmp/source_alignment.txt
      - name: Seal
        run: |
          set -euo pipefail
          mkdir -p canonical/knight_source_authority_alignment_v1
          cp /tmp/source_alignment.txt canonical/knight_source_authority_alignment_v1/AUDIT_STDOUT.txt
          git config user.name realsas-self-hosted-runner
          git config user.email runner@realsas.local
          git add canonical/KNIGHT_SOURCE_AUTHORITY_ALIGNMENT_AUDIT_V1_20260928.json canonical/knight_source_authority_alignment_v1
          git commit -m 'audit: seal Knight source authority alignment'
          git fetch origin research/vf11-certified-adaptive-20260921
          git rebase origin/research/vf11-certified-adaptive-20260921
          git push origin HEAD:research/vf11-certified-adaptive-20260921
