name: knight-source-owned-mechanical-binding-proof-v1
on:
  push:
    branches: [research/vf11-certified-adaptive-20260921]
    paths:
      - 'tools/demo/render_knight_source_owned_mechanical_binding_v1.py'
      - '.github/workflows/knight_source_owned_mechanical_binding_proof_v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  proof:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 30
    env:
      RUN_ID: SUBJECT2_KNIGHT_DEMO_V2_20260924
      AUTHORITY_ROOT: /home/monster/realsas_authority
      OUT_DIR: canonical/knight_source_owned_mechanical_binding_v1
      PLAYER: /tmp/realsas_native_visual_mesh_preview_v1
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Build source-owned visual native renderer
        run: |
          set -euo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -pedantic tools/demo/native_visual_mesh_preview_v1.cpp -lpng -lz -o "$PLAYER"
          test -x "$PLAYER"
      - name: Run source-owned mechanical binding proof
        run: |
          set -euo pipefail
          rm -rf "$OUT_DIR"
          python -m tools.demo.render_knight_source_owned_mechanical_binding_v1             --authority-root "$AUTHORITY_ROOT"             --run-id "$RUN_ID"             --out-dir "$OUT_DIR"             --native-player "$PLAYER"             --render-resolution 512
      - name: Summarize proof
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("canonical/knight_source_owned_mechanical_binding_v1/REPORT.json").read_text())
          for v in p["views"]:
              print("VIEW",v["view_index"],"bound",v["bound_visual_vertex_fraction"])
              for clip,rows in v["qa_by_clip"].items():
                  print("QA",v["view_index"],clip,
                        "flip",max(x["flipped_triangles"] for x in rows),
                        "p95",max(x["p95_edge_stretch"] for x in rows),
                        "max",max(x["max_edge_stretch"] for x in rows),
                        "resid",max(x["max_binding_residual_px"] for x in rows))
          PY
      - name: Seal proof
        run: |
          set -euo pipefail
          git config user.name realsas-self-hosted-runner
          git config user.email runner@realsas.local
          git add "$OUT_DIR"
          git commit -m 'rescue: seal source-owned mechanical binding proof'
          git fetch origin research/vf11-certified-adaptive-20260921
          git rebase origin/research/vf11-certified-adaptive-20260921
          git push origin HEAD:research/vf11-certified-adaptive-20260921
