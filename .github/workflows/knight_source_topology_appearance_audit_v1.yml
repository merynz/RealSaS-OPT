name: knight-source-topology-appearance-audit-v1

on:
  workflow_dispatch:
  push:
    branches: [research/vf11-certified-adaptive-20260921]
    paths:
      - 'tools/demo/audit_knight_source_topology_appearance_components_v1.py'
      - '.github/workflows/knight_source_topology_appearance_audit_v1.yml'

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 5
    env:
      AUTHORITY_ROOT: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Audit source-topology appearance components
        run: |
          set -euo pipefail
          PYTHONPATH=. python tools/demo/audit_knight_source_topology_appearance_components_v1.py             --authority-root "$AUTHORITY_ROOT"             --run-id "$RUN_ID"
