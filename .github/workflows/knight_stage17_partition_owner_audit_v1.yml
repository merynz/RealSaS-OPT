name: knight-stage17-partition-owner-audit-v1
on:
  workflow_dispatch:
  push:
    branches: [research/vf11-certified-adaptive-20260921]
    paths:
      - 'tools/audit_knight_stage17_partition_owner_v1.py'
      - 'canonical/KNIGHT_STAGE17_PARTITION_OWNER_AUDIT_PREREG_V1_20260929.json'
      - '.github/workflows/knight_stage17_partition_owner_audit_v1.yml'
permissions:
  contents: write
concurrency:
  group: knight-stage17-partition-owner-audit-v1
  cancel-in-progress: true
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 10
    env:
      AUTHORITY_ROOT: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_DEMO_V2_20260924
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        run: python -m pip install --no-input --progress-bar off numpy scipy scikit-learn
      - name: Run Stage17 owner audit
        run: |
          set -euo pipefail
          PYTHONPATH=. python tools/audit_knight_stage17_partition_owner_v1.py \
            --authority-root "$AUTHORITY_ROOT" --run-id "$RUN_ID" \
            --out canonical/KNIGHT_STAGE17_PARTITION_OWNER_AUDIT_V1_20260929.json | tee /tmp/stage17_owner.txt
      - name: Seal
        run: |
          set -euo pipefail
          mkdir -p canonical/knight_stage17_partition_owner_audit_v1
          cp /tmp/stage17_owner.txt canonical/knight_stage17_partition_owner_audit_v1/AUDIT_STDOUT.txt
          git config user.name realsas-self-hosted-runner
          git config user.email runner@realsas.local
          git add canonical/KNIGHT_STAGE17_PARTITION_OWNER_AUDIT_V1_20260929.json canonical/knight_stage17_partition_owner_audit_v1
          git commit -m 'audit: seal Stage17 partition owner result'
          git fetch origin research/vf11-certified-adaptive-20260921
          git rebase origin/research/vf11-certified-adaptive-20260921
          git push origin HEAD:research/vf11-certified-adaptive-20260921

# rerun-after-direct-sealed-artifact-read
