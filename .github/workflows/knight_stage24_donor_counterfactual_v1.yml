name: knight-stage24-donor-counterfactual-v1

on:
  workflow_dispatch:
  push:
    branches: [research/vf11-certified-adaptive-20260921]
    paths:
      - 'tools/demo/audit_knight_stage24_donor_counterfactual_v1.py'
      - '.github/workflows/knight_stage24_donor_counterfactual_v1.yml'

concurrency:
  group: knight-stage24-donor-counterfactual-v1
  cancel-in-progress: true

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 8
    env:
      AUTHORITY_ROOT: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_CORRECTED_MECHANICAL_CAA_IMMUTABLE_V1_20260929_195329Z
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Compare Stage24 donor counterfactuals
        run: |
          set -euo pipefail
          PYTHONPATH=. python tools/demo/audit_knight_stage24_donor_counterfactual_v1.py             --authority-root "$AUTHORITY_ROOT"             --run-id "$RUN_ID"

# trigger: donor counterfactual
