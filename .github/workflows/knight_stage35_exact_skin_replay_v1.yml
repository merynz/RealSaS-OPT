name: knight-stage35-exact-skin-replay-v1

on:
  workflow_dispatch:
  push:
    branches: [research/vf11-certified-adaptive-20260921]
    paths:
      - 'tools/audit_knight_stage35_exact_skin_replay_v1.py'
      - '.github/workflows/knight_stage35_exact_skin_replay_v1.yml'

permissions: {contents: read}

jobs:
  replay:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 30
    env:
      AUTHORITY_ROOT: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_DEMO_V2_20260924
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        run: python -m pip install --no-input --progress-bar off numpy scipy
      - name: Syntax
        run: python -m py_compile tools/audit_knight_stage35_exact_skin_replay_v1.py
      - name: Replay historical current Stage32 skin
        shell: bash
        run: |
          set -euo pipefail
          skin="$AUTHORITY_ROOT/$RUN_ID/artifacts/32_SKIN_QUALIFIED/qualified_skin.json"
          out="$(mktemp).json"
          PYTHONPATH=. python tools/audit_knight_stage35_exact_skin_replay_v1.py             --authority-root "$AUTHORITY_ROOT"             --run-id "$RUN_ID"             --skin-json "$skin"             --out "$out" | tee /tmp/stage35_replay.txt
          python - "$out" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["status"]=="PASS_REPLAY_EXECUTED"
          assert x["g3b"]["weight_mutation"] is False
          if not x["g3b"]["passed"]:
              r=x["repartition"]
              assert r is not None
              assert r["face_deletion_count"]==0
              assert r["weight_mutation"] is False
              assert r["auto_apply_allowed"] is False
              assert r["requires_trustworthy_skin_reliability_authority"] is True
              assert r["restart_from"]=="17_MECHANICAL_PARTITION_QUALIFIED"
          print("KNIGHT_STAGE35_EXACT_SKIN_REPLAY_REGRESSION_PASS",json.dumps({
              "g3_passed":x["g3"]["passed"],
              "g3_unsafe":x["g3"]["unsafe_face_count"],
              "g3b_passed":x["g3b"]["passed"],
              "g3b_unsafe":x["g3b"]["unsafe_face_count"],
              "separate_pairs":None if x["repartition"] is None else x["repartition"]["candidate_separate_pair_count"],
          },sort_keys=True))
          PY
