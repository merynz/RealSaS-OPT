name: knight-stage35-iterative-threshold-court-v1

on:
  workflow_dispatch:
  push:
    branches:
      - research/vf11-certified-adaptive-20260921
    paths:
      - 'tools/audit_knight_stage35_iterative_threshold_court_v1.py'
      - '.github/workflows/knight_stage35_iterative_threshold_court_v1.yml'

concurrency:
  group: knight-stage35-iterative-threshold-court-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 60
    env:
      AUTHORITY_ROOT: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_DEMO_V2_20260924
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        run: python -m pip install --no-input --progress-bar off numpy scipy
      - name: Run iterative threshold court
        run: |
          set -euo pipefail
          PYTHONPATH=. python tools/audit_knight_stage35_iterative_threshold_court_v1.py             --authority-root "$AUTHORITY_ROOT"             --run-id "$RUN_ID"             --out canonical/KNIGHT_STAGE35_ITERATIVE_THRESHOLD_COURT_V1_20260928.json             | tee /tmp/stage35_threshold_court.txt
      - name: Seal
        run: |
          set -euo pipefail
          mkdir -p canonical/knight_stage35_iterative_threshold_court_v1
          cp /tmp/stage35_threshold_court.txt canonical/knight_stage35_iterative_threshold_court_v1/AUDIT_STDOUT.txt
          git config user.name realsas-self-hosted-runner
          git config user.email runner@realsas.local
          git add canonical/KNIGHT_STAGE35_ITERATIVE_THRESHOLD_COURT_V1_20260928.json canonical/knight_stage35_iterative_threshold_court_v1
          git commit -m 'audit: seal Stage35 iterative threshold court'
          git fetch origin research/vf11-certified-adaptive-20260921
          git rebase origin/research/vf11-certified-adaptive-20260921
          git push origin HEAD:research/vf11-certified-adaptive-20260921
