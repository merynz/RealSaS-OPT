name: knight-static-quality-edge-cavity-cycle-v6

on:
  push:
    branches:
      - audit/canonical-caa-mechanics-geometry-lock-20261002
    paths:
      - tools/audit_knight_static_quality_edge_cavity_cycle_v6.py
      - .github/workflows/knight_static_quality_edge_cavity_cycle_v6.yml

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 45
    env:
      RUN_ROOT: /home/monster/realsas_authority/runs/SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929
      STATIC_V5_DIR: /tmp/knight_static_quality_cavity_cycle_v5_input
      COMPACTION_V2_DIR: /tmp/knight_repaired_compaction_v2_input
      OUT_DIR: /tmp/knight_static_quality_edge_cavity_cycle_v6
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - uses: actions/download-artifact@v4
        with:
          name: knight-static-quality-cavity-cycle-v5
          path: /tmp/knight_static_quality_cavity_cycle_v5_input
          github-token: ${{ github.token }}
          run-id: 37033711886
      - uses: actions/download-artifact@v4
        with:
          name: knight-repaired-compaction-seal-v2
          path: /tmp/knight_repaired_compaction_v2_input
          github-token: ${{ github.token }}
          run-id: 37023349486
      - run: python -m py_compile tools/audit_knight_static_quality_edge_cavity_cycle_v6.py
      - name: Run edge-cavity remesh static-quality cycles
        run: |
          set -euo pipefail
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          python tools/audit_knight_static_quality_edge_cavity_cycle_v6.py             --run-root "$RUN_ROOT"             --inverse-npz "$COMPACTION_V2_DIR/repaired_inverse_v2.npz"             --static-v5-dir "$STATIC_V5_DIR"             --out-dir "$OUT_DIR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knight-static-quality-edge-cavity-cycle-v6
          path: /tmp/knight_static_quality_edge_cavity_cycle_v6
          if-no-files-found: error
          retention-days: 30
