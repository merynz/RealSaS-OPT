name: knight-targeted-noop-prune-frontier-c51d-v1

on:
  push:
    branches: [impl/carrier-first-mechanical-compilation-20261004]
    paths:
      - tools/audit_knight_targeted_noop_prune_frontier_c51d_v1.py
      - canonical/ATLAS_MIRA_COMPILER_MECHANICAL_COHERENCE_EXECUTION_PLAN_V1.md
      - .github/workflows/knight_targeted_noop_prune_frontier_c51d_v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  court:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 45
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "4"
      PY: /home/monster/realsas-ml312/bin/python
      AUTH: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929
      C50B: /home/monster/realsas_research_scratch/tree_retarget_skin_c50b_37207528345
      C51B: /home/monster/realsas_research_scratch/structural_prune_c51b_37207907720
      C51C: /home/monster/realsas_research_scratch/reduced_basis_product_c51c_37208786172
      OUT: /home/monster/realsas_research_scratch/targeted_noop_prune_c51d_${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$pythonLocation/lib:${LD_LIBRARY_PATH:-}"
          test -x "$PY"
          test -f "$C50B/REPORT.json"
          test -f "$C51B/REPORT.json"
          test -f "$C51C/REPORT.json"
          "$PY" - <<'PY'
          import torch, numpy
          print("C51D_ENV", torch.__version__, torch.version.cuda, torch.cuda.is_available(), numpy.__version__, flush=True)
          if not torch.cuda.is_available():
              raise SystemExit("C51D_CUDA_NOT_AVAILABLE")
          PY
          "$PY" -m py_compile tools/audit_knight_targeted_noop_prune_frontier_c51d_v1.py
          echo "C51D_PREFLIGHT_PASS"

      - name: Run targeted no-op prune frontier
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$pythonLocation/lib:${LD_LIBRARY_PATH:-}"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          "$PY" -u tools/audit_knight_targeted_noop_prune_frontier_c51d_v1.py             --authority-root "$AUTH"             --run-id "$RUN_ID"             --c50b-dir "$C50B"             --c51b-dir "$C51B"             --c51c-dir "$C51C"             --out-dir "$OUT"             --device cuda             --steps 250             --lr 0.02             --frame-batch 9             --log-every 50             --trust-weight 0.0005             --max-depth 2             --beam-width 4

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knight-targeted-noop-prune-frontier-c51d-v1
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
