name: knight-v9-arachne-mechanical-adapter-preflight-v1

on:
  push:
    branches: [audit/canonical-caa-mechanics-geometry-lock-20261002]
    paths:
      - tools/preflight_knight_v9_arachne_mechanical_adapter_v1.py
      - models/arachne/v4/mechanical_residual_adapter_v1.py
      - models/arachne/v4/mechanical_consequence_loss_v1.py
      - .github/workflows/knight_v9_arachne_mechanical_adapter_preflight_v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: '1'
      PY: /home/monster/realsas-ml312/bin/python
      AUTH: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929
      INPUT: /tmp/knight_v9_arachne_mech_preflight_${{ github.run_id }}
      OUT: /tmp/knight_v9_arachne_mech_preflight_out_${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          name: knight-v9-dynamic-mechanics-phase1-v1
          path: ${{ env.INPUT }}/phase1
          github-token: ${{ github.token }}
          run-id: 37064886261
      - uses: actions/download-artifact@v4
        with:
          name: knight-static-quality-source-opt-v9
          path: ${{ env.INPUT }}/static
          github-token: ${{ github.token }}
          run-id: 37057338450
      - uses: actions/download-artifact@v4
        with:
          name: knight-v9-fresh-rig-skin-inference-v1
          path: ${{ env.INPUT }}/fresh
          github-token: ${{ github.token }}
          run-id: 37106649335
      - uses: actions/download-artifact@v4
        with:
          name: knight-v9-exact-teacher-projection-oracle-v1
          path: ${{ env.INPUT }}/teacher
          github-token: ${{ github.token }}
          run-id: 37122879585
      - name: Run exact V9 CPU preflight
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          "$PY" -m py_compile tools/preflight_knight_v9_arachne_mechanical_adapter_v1.py
          "$PY" tools/preflight_knight_v9_arachne_mechanical_adapter_v1.py \
            --authority-root "$AUTH" --run-id "$RUN_ID" \
            --surface-json "$INPUT/phase1/refined_surface.json" \
            --candidate-json "$INPUT/static/final_candidate.json" \
            --fresh-dir "$INPUT/fresh" \
            --teacher-bank "$INPUT/teacher/V9_TEACHER_BANK.npz" \
            --out-dir "$OUT" --probe-count 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knight-v9-arachne-mechanical-adapter-preflight-v1
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
