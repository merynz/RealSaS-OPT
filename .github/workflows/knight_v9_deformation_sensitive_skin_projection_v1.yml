name: knight-v9-deformation-sensitive-skin-projection-v1
on:
  push:
    branches: [audit/canonical-caa-mechanics-geometry-lock-20261002]
    paths:
      - tools/audit_deformation_sensitive_skin_projection_v1.py
      - .github/workflows/knight_v9_deformation_sensitive_skin_projection_v1.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 60
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '4'
      PY: /home/monster/realsas-ml312/bin/python
      AUTH: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929
      INPUT: /tmp/knight_v9_deform_skin_input_${{ github.run_id }}
      OUT: /tmp/knight_v9_deform_skin_${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          name: knight-v9-dynamic-mechanics-phase1-v1
          path: ${{ env.INPUT }}/phase1
          github-token: ${{ github.token }}
          run-id: 37064886261
      - uses: actions/download-artifact@v4
        with:
          name: knight-static-quality-source-opt-v9
          path: ${{ env.INPUT }}/static
          github-token: ${{ github.token }}
          run-id: 37057338450
      - uses: actions/download-artifact@v4
        with:
          name: knight-v9-fresh-rig-skin-inference-v1
          path: ${{ env.INPUT }}/fresh
          github-token: ${{ github.token }}
          run-id: 37106649335
      - name: Build subject-free deformation-sensitive projection variants
        run: |
          "$PY" tools/audit_deformation_sensitive_skin_projection_v1.py \
            --authority-root "$AUTH" --run-id "$RUN_ID" \
            --surface-json "$INPUT/phase1/refined_surface.json" \
            --candidate-json "$INPUT/static/final_candidate.json" \
            --fresh-inference-dir "$INPUT/fresh" --out-root "$OUT"
      - name: Frozen G3 and 51-frame court for every variant
        run: |
          set +e
          for D in "$OUT"/p*_lambda_*; do
            echo "DEFORM_SENSITIVE_DYNAMIC_BEGIN=$D"
            "$PY" tools/audit_fresh_inference_dynamics_v1.py \
              --authority-root "$AUTH" --run-id "$RUN_ID" \
              --surface-json "$INPUT/phase1/refined_surface.json" \
              --candidate-json "$INPUT/static/final_candidate.json" \
              --inference-dir "$D"
            echo "$?" > "$D/dynamic_exit_code.txt"
          done
          exit 0
      - name: Summarize
        run: |
          "$PY" - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["OUT"])
          rows=[]
          for d in sorted(root.glob("p*_lambda_*")):
              stats=json.loads((d/"PROJECTION_STATS.json").read_text())
              dyn=json.loads((d/"DYNAMIC_REPORT.json").read_text())
              g3=json.loads((d/"fresh_g3_report.json").read_text())
              row={
                  "tag":d.name,
                  "lambda":stats["lambda"],
                  "length_power":stats["length_power"],
                  "p95_corr":stats["p95_row_correction_l1"],
                  "grad_p99":stats["carrier_weight_gradient_p99"],
                  "motion_energy_p99":stats["motion_metric_edge_energy_p99"],
                  "g3_passed":dyn["g3_passed"],
                  "g3_max_condition":g3["maximum_condition_number"],
                  "failed_frames":dyn["failed_motion_frame_count"],
                  "max_motion_edge_ratio":dyn["maximum_motion_edge_ratio"],
              }
              rows.append(row)
              print("DEFORM_SENSITIVE_RESULT="+json.dumps(row,sort_keys=True))
          (root/"RESULT.json").write_text(json.dumps({"status":"MEASURED_DIAGNOSTIC_ONLY","rows":rows},indent=2,sort_keys=True)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knight-v9-deformation-sensitive-skin-projection-v1
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
