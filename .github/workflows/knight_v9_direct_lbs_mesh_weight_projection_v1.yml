name: knight-v9-direct-lbs-mesh-weight-projection-v1
concurrency:
  group: knight-v9-direct-lbs-mesh-weight-projection-v1-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [audit/canonical-caa-mechanics-geometry-lock-20261002]
    paths:
      - tools/audit_direct_lbs_mesh_weight_projection_v1.py
      - .github/workflows/knight_v9_direct_lbs_mesh_weight_projection_v1.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 60
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '4'
      PY: /home/monster/realsas-ml312/bin/python
      AUTH: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929
      INPUT: /tmp/knight_v9_direct_lbs_input_${{ github.run_id }}
      OUT: /tmp/knight_v9_direct_lbs_${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Recover exact frozen Phase-B inputs from self-hosted cache
        id: frozen_cache
        shell: bash
        run: |
          set -euo pipefail
          CACHE_ROOT="/tmp/knight_v9_direct_lbs_input_37118100232"
          if [ ! -f "$CACHE_ROOT/phase1/refined_surface.json" ] || \
             [ ! -f "$CACHE_ROOT/static/final_candidate.json" ] || \
             [ ! -f "$CACHE_ROOT/fresh/fresh_qualified_skeleton.json" ] || \
             [ ! -f "$CACHE_ROOT/fresh/fresh_qualified_skin.json" ] || \
             [ ! -f "$CACHE_ROOT/fresh/rig_REPORT.json" ] || \
             [ ! -f "$CACHE_ROOT/fresh/skin_REPORT.json" ]; then
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "FROZEN_PHASE_B_CACHE_MISS"
            exit 0
          fi
          echo "a35fcc16b2e86c018aabf015834c8d9b4fd29d10bf31ecf3539bb778bb6cfb5b  $CACHE_ROOT/fresh/fresh_qualified_skeleton.json" | sha256sum -c -
          echo "97905d057b0164b39a56e75ed4087617cbbff786281959e9a0f46962d56ca230  $CACHE_ROOT/fresh/fresh_qualified_skin.json" | sha256sum -c -
          echo "f8fcb82b9439f1eaff54861110f4d9d232db1fd85b0e02dcea8e9c8415938aca  $CACHE_ROOT/fresh/rig_REPORT.json" | sha256sum -c -
          echo "96c04b0745dcab69628dedefa1cd513b88f07dfbf3d4110579c736f773e6ad93  $CACHE_ROOT/fresh/skin_REPORT.json" | sha256sum -c -
          "$PY" - "$CACHE_ROOT" <<'PY'
          import json, sys
          from pathlib import Path
          from compiler.realsas_compiler_core.artifact_codec_v2 import (
              canonical_mesh_candidate_from_dict,
              qualified_skeleton_from_dict,
              qualified_skin_from_dict,
              rigging_surface_from_dict,
          )
          from compiler.realsas_compiler_core.product_authority_v1 import (
              canonical_mesh_candidate_lineage_hash,
          )
          root=Path(sys.argv[1])
          surface=rigging_surface_from_dict(json.loads((root/"phase1/refined_surface.json").read_text()))
          candidate=canonical_mesh_candidate_from_dict(json.loads((root/"static/final_candidate.json").read_text()))
          skeleton=qualified_skeleton_from_dict(json.loads((root/"fresh/fresh_qualified_skeleton.json").read_text()))
          skin=qualified_skin_from_dict(json.loads((root/"fresh/fresh_qualified_skin.json").read_text()))
          if canonical_mesh_candidate_lineage_hash(candidate) != candidate.candidate_lineage_hash:
              raise SystemExit("CACHE_CANDIDATE_LINEAGE_HASH_INVALID")
          if candidate.surface_binding_hash != surface.geometry_lineage_hash:
              raise SystemExit("CACHE_CANDIDATE_SURFACE_DRIFT")
          if skin.surface_binding_hash != surface.geometry_lineage_hash:
              raise SystemExit("CACHE_SKIN_SURFACE_DRIFT")
          if skin.skeleton_binding_hash != skeleton.skeleton_lineage_hash:
              raise SystemExit("CACHE_SKIN_SKELETON_DRIFT")
          print("FROZEN_PHASE_B_CACHE_LINEAGE_PASS", surface.geometry_lineage_hash, candidate.candidate_lineage_hash)
          PY
          # Reuse the immutable, lineage-verified cache by symlink. Do not
          # duplicate tens of MB on the self-hosted runner's /tmp volume.
          find /tmp -maxdepth 1 -type d -name 'knight_v9_direct_lbs_input_*' \
            ! -name 'knight_v9_direct_lbs_input_37118100232' \
            ! -name "knight_v9_direct_lbs_input_${GITHUB_RUN_ID}" \
            -exec rm -rf {} + || true
          find /tmp -maxdepth 1 -type d -name 'knight_v9_direct_lbs_[0-9]*' \
            ! -name "knight_v9_direct_lbs_${GITHUB_RUN_ID}" \
            -exec rm -rf {} + || true
          rm -rf "$INPUT"
          mkdir -p "$INPUT"
          ln -s "$CACHE_ROOT/phase1" "$INPUT/phase1"
          ln -s "$CACHE_ROOT/static" "$INPUT/static"
          ln -s "$CACHE_ROOT/fresh" "$INPUT/fresh"
          echo "hit=true" >> "$GITHUB_OUTPUT"
          echo "FROZEN_PHASE_B_CACHE_HIT=$CACHE_ROOT"
      - uses: actions/download-artifact@v4
        if: steps.frozen_cache.outputs.hit != 'true'
        with:
          name: knight-v9-dynamic-mechanics-phase1-v1
          path: ${{ env.INPUT }}/phase1
          github-token: ${{ github.token }}
          run-id: 37064886261
      - uses: actions/download-artifact@v4
        if: steps.frozen_cache.outputs.hit != 'true'
        with:
          name: knight-static-quality-source-opt-v9
          path: ${{ env.INPUT }}/static
          github-token: ${{ github.token }}
          run-id: 37057338450
      - uses: actions/download-artifact@v4
        if: steps.frozen_cache.outputs.hit != 'true'
        with:
          name: knight-v9-fresh-rig-skin-inference-v1
          path: ${{ env.INPUT }}/fresh
          github-token: ${{ github.token }}
          run-id: 37106649335
      - name: Direct LBS mesh-weight projection and frozen courts
        run: |
          "$PY" tools/audit_direct_lbs_mesh_weight_projection_v1.py \
            --authority-root "$AUTH" --run-id "$RUN_ID" \
            --surface-json "$INPUT/phase1/refined_surface.json" \
            --candidate-json "$INPUT/static/final_candidate.json" \
            --fresh-inference-dir "$INPUT/fresh" --out-root "$OUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knight-v9-direct-lbs-mesh-weight-projection-v1
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
