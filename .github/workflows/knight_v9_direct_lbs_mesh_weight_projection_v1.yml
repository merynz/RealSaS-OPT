name: knight-v9-direct-lbs-mesh-weight-projection-v1
concurrency:
  group: knight-v9-direct-lbs-mesh-weight-projection-v1-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [audit/canonical-caa-mechanics-geometry-lock-20261002]
    paths:
      - tools/audit_direct_lbs_mesh_weight_projection_v1.py
      - .github/workflows/knight_v9_direct_lbs_mesh_weight_projection_v1.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 60
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '4'
      PY: /home/monster/realsas-ml312/bin/python
      AUTH: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929
      INPUT: /tmp/knight_v9_direct_lbs_input_${{ github.run_id }}
      OUT: /tmp/knight_v9_direct_lbs_${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          name: knight-v9-dynamic-mechanics-phase1-v1
          path: ${{ env.INPUT }}/phase1
          github-token: ${{ github.token }}
          run-id: 37064886261
      - uses: actions/download-artifact@v4
        with:
          name: knight-static-quality-source-opt-v9
          path: ${{ env.INPUT }}/static
          github-token: ${{ github.token }}
          run-id: 37057338450
      - name: Recover exact fresh inference from self-hosted cache
        id: fresh_cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$INPUT/fresh"
          check_dir() {
            local D="$1"
            [ -f "$D/fresh_qualified_skeleton.json" ] || return 1
            [ -f "$D/fresh_qualified_skin.json" ] || return 1
            [ -f "$D/rig_REPORT.json" ] || return 1
            [ -f "$D/skin_REPORT.json" ] || return 1
            echo "a35fcc16b2e86c018aabf015834c8d9b4fd29d10bf31ecf3539bb778bb6cfb5b  $D/fresh_qualified_skeleton.json" | sha256sum -c - >/dev/null || return 1
            echo "97905d057b0164b39a56e75ed4087617cbbff786281959e9a0f46962d56ca230  $D/fresh_qualified_skin.json" | sha256sum -c - >/dev/null || return 1
            echo "f8fcb82b9439f1eaff54861110f4d9d232db1fd85b0e02dcea8e9c8415938aca  $D/rig_REPORT.json" | sha256sum -c - >/dev/null || return 1
            echo "96c04b0745dcab69628dedefa1cd513b88f07dfbf3d4110579c736f773e6ad93  $D/skin_REPORT.json" | sha256sum -c - >/dev/null || return 1
            return 0
          }
          for D in /tmp/knight_v9_direct_lbs_input_*/fresh /tmp/knight_v9_deform_skin_input_*/fresh; do
            [ -d "$D" ] || continue
            if check_dir "$D"; then
              rm -rf "$INPUT/fresh"
              mkdir -p "$INPUT/fresh"
              cp -a "$D/." "$INPUT/fresh/"
              echo "hit=true" >> "$GITHUB_OUTPUT"
              echo "FRESH_INFERENCE_CACHE_HIT=$D"
              exit 0
            fi
          done
          echo "hit=false" >> "$GITHUB_OUTPUT"
          echo "FRESH_INFERENCE_CACHE_MISS"
      - uses: actions/download-artifact@v4
        if: steps.fresh_cache.outputs.hit != 'true'
        with:
          name: knight-v9-fresh-rig-skin-inference-v1
          path: ${{ env.INPUT }}/fresh
          github-token: ${{ github.token }}
          run-id: 37106649335
      - name: Direct LBS mesh-weight projection and frozen courts
        run: |
          "$PY" tools/audit_direct_lbs_mesh_weight_projection_v1.py \
            --authority-root "$AUTH" --run-id "$RUN_ID" \
            --surface-json "$INPUT/phase1/refined_surface.json" \
            --candidate-json "$INPUT/static/final_candidate.json" \
            --fresh-inference-dir "$INPUT/fresh" --out-root "$OUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knight-v9-direct-lbs-mesh-weight-projection-v1
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
