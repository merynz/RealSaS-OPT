name: knight-v9-exact-teacher-projection-oracle-v1

on:
  push:
    branches: [audit/canonical-caa-mechanics-geometry-lock-20261002]
    paths:
      - tools/audit_v9_teacher_projection_oracle_v1.py
      - .github/workflows/knight_v9_exact_teacher_projection_oracle_v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 45
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: '1'
      PY: /home/monster/realsas-ml312/bin/python
      AUTH: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929
      CACHE_ROOT: /tmp/knight_v9_direct_lbs_input_37118100232
      V5_HANDOFF: gdrive:RealSaS_SUBJECT2_KNIGHT_DEMO_V2_20260924/ARACHNE_STAGE31_V5_DEMO_HANDOFF
      GEP_HANDOFF: gdrive:RealSaS_SUBJECT2_KNIGHT_DEMO_V2_20260924/GEPPETTO_STAGE27_MECHANICALLY_MEANINGFUL_V2_HANDOFF
      OUT: /tmp/knight_v9_teacher_oracle_${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Verify exact frozen V9 inputs
        run: |
          set -euo pipefail
          test -f "$CACHE_ROOT/phase1/refined_surface.json"
          test -f "$CACHE_ROOT/static/final_candidate.json"
          test -f "$CACHE_ROOT/fresh/fresh_qualified_skeleton.json"
          test -f "$CACHE_ROOT/fresh/fresh_qualified_skin.json"
          echo "a35fcc16b2e86c018aabf015834c8d9b4fd29d10bf31ecf3539bb778bb6cfb5b  $CACHE_ROOT/fresh/fresh_qualified_skeleton.json" | sha256sum -c -
          echo "97905d057b0164b39a56e75ed4087617cbbff786281959e9a0f46962d56ca230  $CACHE_ROOT/fresh/fresh_qualified_skin.json" | sha256sum -c -
          "$PY" - "$CACHE_ROOT" <<'PY'
          import json,sys
          from pathlib import Path
          from compiler.realsas_compiler_core.artifact_codec_v2 import (
              canonical_mesh_candidate_from_dict, rigging_surface_from_dict,
          )
          root=Path(sys.argv[1])
          s=rigging_surface_from_dict(json.loads((root/"phase1/refined_surface.json").read_text()))
          c=canonical_mesh_candidate_from_dict(json.loads((root/"static/final_candidate.json").read_text()))
          assert s.geometry_lineage_hash=="25b8ff0acd2154d8a3fc333d65af70b65f2658309135cf630225ecdfc35ab08d"
          assert c.candidate_lineage_hash=="3ab6b0ae02e362079fed11ceb627acf9be795004e790ee897c98a1eadc14edab"
          assert c.surface_binding_hash==s.geometry_lineage_hash
          assert len(s.surface_nodes)==15490
          print("V9_FROZEN_INPUT_PASS",s.geometry_lineage_hash,c.candidate_lineage_hash,len(s.surface_nodes))
          PY

      - name: Fetch exact artist source and Geppetto target authority
        run: |
          set -euo pipefail
          mkdir -p "$OUT/input"
          rclone copyto "$V5_HANDOFF/KNIGHT_EVALUATED_TEACHER_SOURCE.npz" "$OUT/input/source.npz" --checksum
          rclone copyto "$GEP_HANDOFF/teacher_target_v2.npz" "$OUT/input/target.npz" --checksum
          got_source="$(sha256sum "$OUT/input/source.npz" | awk '{print $1}')"
          got_target="$(sha256sum "$OUT/input/target.npz" | awk '{print $1}')"
          test "$got_source" = "96435646a0084a0a038040ee748cb33d3bfa0b1ed550661befd3b18539e28e6f"
          test "$got_target" = "26d4d5411b14b23b894f0351ab08fc2da2b18d8fb3ac4776b25b8b2434b4bbc1"
          echo "TEACHER_SOURCE_TARGET_SHA_PASS source=$got_source target=$got_target"

      - name: Recover frozen historical teacher projector
        run: |
          set -euo pipefail
          git show 1dc51f4929a3ff35edc33f10cd5f8cd2cef0e98e:tools/training/knight_arachne_teacher_projection_v1.py > "$OUT/input/projector.py"
          got="$(sha256sum "$OUT/input/projector.py" | awk '{print $1}')"
          echo "TEACHER_PROJECTOR_SHA=$got"
          grep -q 'EXACT_SOURCE_TRIANGLE_CLOSEST_POINT_BARYCENTRIC_WITH_COMPONENT_MECHANICAL_ATTACHMENT' "$OUT/input/projector.py"

      - name: Install frozen projector runtime dependencies
        run: |
          python -m pip install --no-input --progress-bar off numpy scipy trimesh

      - name: Reproject exact artist skin onto V9 RiggingSurface
        run: |
          set -euo pipefail
          python "$OUT/input/projector.py" \
            --full-source-npz "$OUT/input/source.npz" \
            --target-npz "$OUT/input/target.npz" \
            --surface-json "$CACHE_ROOT/phase1/refined_surface.json" \
            --output-npz "$OUT/V9_TEACHER_BANK.npz" \
            --report-json "$OUT/V9_TEACHER_PROJECTION_REPORT.json" \
            --chunk-size 32

      - name: Run V9 teacher oracle mechanics court
        run: |
          set -euo pipefail
          "$PY" tools/audit_v9_teacher_projection_oracle_v1.py \
            --authority-root "$AUTH" --run-id "$RUN_ID" \
            --surface-json "$CACHE_ROOT/phase1/refined_surface.json" \
            --candidate-json "$CACHE_ROOT/static/final_candidate.json" \
            --fresh-inference-dir "$CACHE_ROOT/fresh" \
            --teacher-bank "$OUT/V9_TEACHER_BANK.npz" \
            --projection-report "$OUT/V9_TEACHER_PROJECTION_REPORT.json" \
            --out "$OUT/V9_TEACHER_ORACLE_REPORT.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knight-v9-exact-teacher-projection-oracle-v1
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
