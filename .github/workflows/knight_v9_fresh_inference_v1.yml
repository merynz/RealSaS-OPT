name: knight-v9-fresh-inference-v1
on:
  push:
    branches: [audit/canonical-caa-mechanics-geometry-lock-20261002]
    paths:
      - tools/audit_refined_inference_assets_v1.py
      - tools/inference/refined_surface_rig_skin_v1.py
      - tools/audit_fresh_inference_dynamics_v1.py
      - models/arachne/v6/**
      - tests/compiler/test_arachne_v6_inference_readout_v1.py
      - .github/workflows/knight_v9_fresh_inference_v1.yml
permissions:
  contents: read
  actions: read
jobs:
  inference:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 60
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '4'
      PY: /home/monster/realsas-ml312/bin/python
      FIT_RUN: /home/monster/realsas_authority/runs/SUBJECT2_KNIGHT_DEMO_V2_20260924
      INPUT: /tmp/knight_v9_fresh_input_${{ github.run_id }}
      OUT: /tmp/knight_v9_fresh_inference_${{ github.run_id }}
      ARM: /home/monster/realsas_model_cache/arachne_uniform_all_projected_63e589b67946
      ARM_REMOTE: gdrive:RealSaS_SUBJECT2_KNIGHT_DEMO_V2_20260924/ARACHNE_V6_COVERAGE_SAMPLING_2X2_INDEXSPACE_FIXED_20260929/ARMS/UNIFORM_ALL_PROJECTED
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Readout chunk and permutation contracts
        run: '"$PY" -m pytest -q tests/compiler/test_arachne_v6_inference_readout_v1.py'
      - uses: actions/download-artifact@v4
        with:
          name: knight-v9-dynamic-mechanics-phase1-v1
          path: ${{ env.INPUT }}/phase1
          github-token: ${{ github.token }}
          run-id: 37064886261
      - uses: actions/download-artifact@v4
        with:
          name: knight-static-quality-source-opt-v9
          path: ${{ env.INPUT }}/static
          github-token: ${{ github.token }}
          run-id: 37057338450
      - name: Fresh Geppetto inference on the exact refined surface
        run: |
          "$PY" tools/inference/refined_surface_rig_skin_v1.py --lane rig --device cuda \
            --surface-json "$INPUT/phase1/refined_surface.json" --fit-run "$FIT_RUN" --out-dir "$OUT"
      - name: Retrieve corrected Arachne model and its result receipt
        run: |
          mkdir -p "$ARM"
          for FILE in ARACHNE_KNIGHT_V6_RESULT.json ARACHNE_KNIGHT_V6_MODEL_FINAL_FP32.pt; do
            if [ ! -f "$ARM/$FILE" ]; then
              rclone copyto "$ARM_REMOTE/$FILE" "$ARM/$FILE.partial" --checksum
              mv "$ARM/$FILE.partial" "$ARM/$FILE"
            fi
          done
          printf '%s  %s\n' 0a73240d2278a69fe24d1b6a8ebf185dbe8556a0bd17b7d4c70731ff558be31f "$ARM/ARACHNE_KNIGHT_V6_RESULT.json" | sha256sum --check
          printf '%s  %s\n' 63e589b679461daf7cf859eb0c10e4b5f9c285b055d18f114d0ba348f2829892 "$ARM/ARACHNE_KNIGHT_V6_MODEL_FINAL_FP32.pt" | sha256sum --check
      - name: Fresh Arachne inference on the refined surface and fresh rig
        run: |
          "$PY" tools/inference/refined_surface_rig_skin_v1.py --lane skin --device cuda \
            --skin-autocast bf16 --cuda-query-chunk 128 --readout-chunk 1024 \
            --surface-json "$INPUT/phase1/refined_surface.json" --fit-run "$FIT_RUN" --out-dir "$OUT" --arm-dir "$ARM"
      - name: Frozen G3 and 51-frame motion court
        run: |
          "$PY" tools/audit_fresh_inference_dynamics_v1.py \
            --authority-root /home/monster/realsas_authority --run-id SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929 \
            --surface-json "$INPUT/phase1/refined_surface.json" --candidate-json "$INPUT/static/final_candidate.json" --inference-dir "$OUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knight-v9-fresh-rig-skin-inference-v1
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
