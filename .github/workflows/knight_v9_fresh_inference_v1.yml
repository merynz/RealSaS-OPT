name: knight-v9-fresh-inference-v1
on:
  push:
    branches: [audit/canonical-caa-mechanics-geometry-lock-20261002]
    paths:
      - tools/audit_refined_inference_assets_v1.py
      - .github/workflows/knight_v9_fresh_inference_v1.yml
permissions:
  contents: read
  actions: read
jobs:
  inference:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Inspect exact Geppetto and Arachne checkpoints
        shell: bash
        run: |
          model_python=/home/monster/realsas-ml312/bin/python
          if [ ! -x "$model_python" ]; then model_python=python; fi
          "$model_python" tools/audit_refined_inference_assets_v1.py \
            --run-root /home/monster/realsas_authority/runs/SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929 \
            --out-dir /tmp/knight_v9_inference_assets_${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knight-v9-inference-assets-v1
          path: /tmp/knight_v9_inference_assets_${{ github.run_id }}
          if-no-files-found: error
