name: knight-v9-inference-controls-v1
on:
  push:
    branches: [audit/canonical-caa-mechanics-geometry-lock-20261002]
    paths:
      - tools/audit_inference_replay_controls_v1.py
      - .github/workflows/knight_v9_inference_controls_v1.yml
permissions:
  contents: read
jobs:
  controls:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Same-checkpoint original-surface inference and motion controls
        run: |
          /home/monster/realsas-ml312/bin/python tools/audit_inference_replay_controls_v1.py \
            --authority-root /home/monster/realsas_authority --run-id SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929 \
            --fit-run /home/monster/realsas_authority/runs/SUBJECT2_KNIGHT_DEMO_V2_20260924 \
            --arm-dir /tmp/knight_v9_corrected_arm_37070427256 \
            --out-dir /tmp/knight_v9_inference_controls_${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knight-v9-inference-controls-v1
          path: /tmp/knight_v9_inference_controls_${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
