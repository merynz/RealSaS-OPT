name: knight-v9-mechanical-static-fixed-point-resume-v1

concurrency:
  group: knight-v9-mechanical-static-fixed-point-resume-v1-\${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [audit/canonical-caa-mechanics-geometry-lock-20261002]
    paths:
      - .github/workflows/knight_v9_mechanical_static_fixed_point_resume_v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 180
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: '1'
      PY: /home/monster/realsas-ml312/bin/python
      AUTH: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929
      CACHE_ROOT: /tmp/knight_v9_direct_lbs_input_37118100232
      TEACHER_ROOT: /tmp/knight_v9_teacher_oracle_37122879585
      INPUT: /tmp/knight_v9_fixed_point_resume_input_\${{ github.run_id }}
      OUT: /tmp/knight_v9_fixed_point_resume_\${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          name: knight-v9-mechanical-static-fixed-point-v1
          path: \${{ env.INPUT }}/prior
          github-token: \${{ github.token }}
          run-id: 37140820111
      - name: Resolve frozen and resume inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f "$INPUT/prior/cycle_01/CANDIDATE.json"
          test -f "$INPUT/prior/cycle_01/PARTITION.json"
          test -f "$INPUT/prior/cycle_01/STEP.json"
          test -f "$CACHE_ROOT/phase1/refined_surface.json"
          test -f "$CACHE_ROOT/static/final_candidate.json"
          test -f "$CACHE_ROOT/static/partition.json"
          test -f "$CACHE_ROOT/fresh/fresh_qualified_skeleton.json"
          test -f "$TEACHER_ROOT/V9_TEACHER_BANK.npz"
          echo "5f23adc084fdc15c95a6807e5f86fd365d547e7f558a0d341f9ec3be9bfa2987  $TEACHER_ROOT/V9_TEACHER_BANK.npz" | sha256sum -c -
          inverse=""
          for p in \
            /tmp/knight_v9_dynamic_compaction_input/repaired_inverse_v2.npz \
            /tmp/knight_v9_topology_attr_input_*/compaction/repaired_inverse_v2.npz \
            /tmp/knight_v9_topology_prolong_input_*/compaction/repaired_inverse_v2.npz; do
            if test -f "$p"; then inverse="$p"; break; fi
          done
          test -n "$inverse"
          echo "inverse=$inverse" >> "$GITHUB_OUTPUT"
          "$PY" -m py_compile tools/audit_v9_mechanical_static_fixed_point_v1.py
          echo "V9_FIXED_POINT_RESUME_INPUT_PASS inverse=$inverse"
      - name: Resume mechanical-static fixed point court
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          "$PY" tools/audit_v9_mechanical_static_fixed_point_v1.py \
            --authority-root "$AUTH" --run-id "$RUN_ID" \
            --surface-json "$CACHE_ROOT/phase1/refined_surface.json" \
            --candidate-json "$CACHE_ROOT/static/final_candidate.json" \
            --partition-json "$CACHE_ROOT/static/partition.json" \
            --fresh-skeleton-json "$CACHE_ROOT/fresh/fresh_qualified_skeleton.json" \
            --teacher-bank "$TEACHER_ROOT/V9_TEACHER_BANK.npz" \
            --inverse-npz "\${{ steps.inputs.outputs.inverse }}" \
            --resume-candidate-json "$INPUT/prior/cycle_01/CANDIDATE.json" \
            --resume-partition-json "$INPUT/prior/cycle_01/PARTITION.json" \
            --resume-step-json "$INPUT/prior/cycle_01/STEP.json" \
            --resume-cycle 1 \
            --static-rounds-per-cycle 1 \
            --out-dir "$OUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knight-v9-mechanical-static-fixed-point-resume-v1
          path: \${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
