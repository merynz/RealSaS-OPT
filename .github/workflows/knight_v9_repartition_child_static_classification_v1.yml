name: knight-v9-repartition-child-static-classification-v1

on:
  workflow_dispatch:
  push:
    branches: [audit/canonical-caa-mechanics-geometry-lock-20261002]
    paths:
      - .github/workflows/knight_v9_repartition_child_static_classification_v1.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: '1'
      CHILD: /tmp/knight_v9_teacher_repartition_37123289786
      AUTH: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929
      OUT: /tmp/knight_v9_child_static_class_${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Classify static residual
        run: |
          set -euo pipefail
          test -f "$CHILD/CHILD_CANDIDATE.json"
          test -f "$CHILD/CHILD_PARTITION.json"
          mkdir -p "$OUT"
          python - "$CHILD" "$AUTH" "$RUN_ID" "$OUT/REPORT.json" <<'PY'
          import json,sys
          from pathlib import Path
          from compiler.realsas_compiler_core.artifact_codec_v2 import (
              canonical_mesh_candidate_from_dict,mechanical_partition_from_dict,mesh_policy_from_dict,
          )
          from compiler.realsas_compiler_services.orchestrator.adapters.adapter_io import stage_output_payload
          from tools.audit_knight_static_quality_alternating_v3 import classify
          from tools.audit_knight_repaired_quality_collapse_v1 import report_quality
          from tools.demo.render_knight_motion_preview_v1 import _ctx
          child=Path(sys.argv[1]); auth=Path(sys.argv[2]); run_id=sys.argv[3]; out=Path(sys.argv[4])
          candidate=canonical_mesh_candidate_from_dict(json.loads((child/"CHILD_CANDIDATE.json").read_text()))
          partition=mechanical_partition_from_dict(json.loads((child/"CHILD_PARTITION.json").read_text()))
          ctx=_ctx(auth,run_id)
          policy=mesh_policy_from_dict(stage_output_payload(ctx,"18_CANONICAL_MESH_ADDRESSING_BUILD","RealSaS.MeshQualificationPolicyIR.v1"))
          q=report_quality(candidate,policy)
          c=classify(candidate,policy,partition)
          report={"schema":"RealSaS.V9RepartitionChildStaticClassification.v1","status":"DIAGNOSTIC_ONLY",
                  "candidate_lineage_hash":candidate.candidate_lineage_hash,
                  "partition_lineage_hash":partition.partition_lineage_hash,
                  "quality":q,"classification":c,"product_authority_minted":False}
          out.write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print("V9_CHILD_STATIC_CLASS="+json.dumps({
              "violations":c["violating_face_count"],
              "boundary":c["boundary_face_count"],
              "protected":c["protected_support_face_count"],
              "boundary_or_protected":c["boundary_or_protected_face_count"],
              "interior_unprotected":c["interior_unprotected_face_count"],
              "components":c["residual_component_count"],
              "largest":c["residual_component_sizes_top20"][:8],
              "angle_bins":c["angle_bins"],"aspect_bins":c["aspect_bins"],
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knight-v9-repartition-child-static-classification-v1
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
