name: knight-v9-skin-field-edge-audit-v1
on:
  push:
    branches: [audit/canonical-caa-mechanics-geometry-lock-20261002]
    paths:
      - tools/audit_skin_field_edge_discontinuity_v1.py
      - .github/workflows/knight_v9_skin_field_edge_audit_v1.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: '1'
      PY: /home/monster/realsas-ml312/bin/python
      AUTH: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929
      INPUT: /tmp/knight_v9_skin_field_input_${{ github.run_id }}
      OUT: /tmp/knight_v9_skin_field_${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          name: knight-v9-dynamic-mechanics-phase1-v1
          path: ${{ env.INPUT }}/phase1
          github-token: ${{ github.token }}
          run-id: 37064886261
      - uses: actions/download-artifact@v4
        with:
          name: knight-static-quality-source-opt-v9
          path: ${{ env.INPUT }}/static
          github-token: ${{ github.token }}
          run-id: 37057338450
      - uses: actions/download-artifact@v4
        with:
          name: knight-v9-fresh-rig-skin-inference-v1
          path: ${{ env.INPUT }}/fresh
          github-token: ${{ github.token }}
          run-id: 37106649335
      - name: Measure archived and V9 mesh-edge skin gradients
        run: |
          mkdir -p "$OUT"
          "$PY" tools/audit_skin_field_edge_discontinuity_v1.py \
            --authority-root "$AUTH" --run-id "$RUN_ID" \
            --v9-surface-json "$INPUT/phase1/refined_surface.json" \
            --v9-candidate-json "$INPUT/static/final_candidate.json" \
            --v9-inference-dir "$INPUT/fresh" \
            --out "$OUT/SKIN_FIELD_EDGE_AUDIT.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knight-v9-skin-field-edge-audit-v1
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
