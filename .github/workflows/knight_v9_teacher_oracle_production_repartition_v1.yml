name: knight-v9-teacher-oracle-production-repartition-v1

on:
  push:
    branches: [audit/canonical-caa-mechanics-geometry-lock-20261002]
    paths:
      - tools/audit_v9_teacher_oracle_production_repartition_v1.py
      - .github/workflows/knight_v9_teacher_oracle_production_repartition_v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 60
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: '1'
      PY: /home/monster/realsas-ml312/bin/python
      AUTH: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929
      CACHE_ROOT: /tmp/knight_v9_direct_lbs_input_37118100232
      TEACHER_ROOT: /tmp/knight_v9_teacher_oracle_37122879585
      OUT: /tmp/knight_v9_teacher_repartition_${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Resolve exact V9 inverse and frozen inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f "$CACHE_ROOT/phase1/refined_surface.json"
          test -f "$CACHE_ROOT/static/final_candidate.json"
          test -f "$CACHE_ROOT/static/partition.json"
          test -f "$CACHE_ROOT/fresh/fresh_qualified_skeleton.json"
          test -f "$TEACHER_ROOT/V9_TEACHER_BANK.npz"
          got_teacher="$(sha256sum "$TEACHER_ROOT/V9_TEACHER_BANK.npz" | awk '{print $1}')"
          test "$got_teacher" = "5f23adc084fdc15c95a6807e5f86fd365d547e7f558a0d341f9ec3be9bfa2987"

          inverse=""
          for p in \
            /tmp/knight_v9_dynamic_compaction_input/repaired_inverse_v2.npz \
            /tmp/knight_v9_topology_attr_input_*/compaction/repaired_inverse_v2.npz \
            /tmp/knight_v9_topology_prolong_input_*/compaction/repaired_inverse_v2.npz; do
            if test -f "$p"; then inverse="$p"; break; fi
          done
          if test -z "$inverse"; then
            echo "V9_REPARTITION_INVERSE_CACHE_MISS"
            exit 3
          fi
          echo "inverse=$inverse" >> "$GITHUB_OUTPUT"
          echo "V9_REPARTITION_INPUT_PASS teacher=$got_teacher inverse=$inverse"

      - name: Run production repartition feedback oracle
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          "$PY" tools/audit_v9_teacher_oracle_production_repartition_v1.py \
            --authority-root "$AUTH" --run-id "$RUN_ID" \
            --surface-json "$CACHE_ROOT/phase1/refined_surface.json" \
            --candidate-json "$CACHE_ROOT/static/final_candidate.json" \
            --partition-json "$CACHE_ROOT/static/partition.json" \
            --fresh-skeleton-json "$CACHE_ROOT/fresh/fresh_qualified_skeleton.json" \
            --teacher-bank "$TEACHER_ROOT/V9_TEACHER_BANK.npz" \
            --inverse-npz "${{ steps.inputs.outputs.inverse }}" \
            --out-dir "$OUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knight-v9-teacher-oracle-production-repartition-v1
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
