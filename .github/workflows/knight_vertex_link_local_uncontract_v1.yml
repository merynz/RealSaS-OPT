name: knight-vertex-link-local-uncontract-v1

on:
  push:
    branches:
      - audit/canonical-caa-mechanics-geometry-lock-20261002
    paths:
      - tools/audit_knight_vertex_link_local_uncontract_v1.py
      - .github/workflows/knight_vertex_link_local_uncontract_v1.yml

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    env:
      RUN_ROOT: /home/monster/realsas_authority/runs/SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929
      INPUT_DIR: /tmp/knight_repaired_compaction_input
      OUT: /tmp/knight_vertex_link_local_uncontract_v1/REPORT.json
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - uses: actions/download-artifact@v4
        with:
          name: knight-repaired-compaction-seal-v1
          path: /tmp/knight_repaired_compaction_input
          github-token: ${{ github.token }}
          run-id: 37009300021
      - run: python -m py_compile tools/audit_knight_vertex_link_local_uncontract_v1.py
      - name: Local-uncontract illegal vertex-link preimage
        run: |
          set -euo pipefail
          python tools/audit_knight_vertex_link_local_uncontract_v1.py             --run-root "$RUN_ROOT"             --inverse-npz "$INPUT_DIR/repaired_inverse.npz"             --out "$OUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knight-vertex-link-local-uncontract-v1
          path: /tmp/knight_vertex_link_local_uncontract_v1/REPORT.json
          if-no-files-found: warn
          retention-days: 30
