name: knight-visual-deformation-region-audit-v1
on:
  push:
    branches: [research/vf11-certified-adaptive-20260921]
    paths: ['.github/workflows/knight_visual_deformation_region_audit_v1.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    env:
      RUN_ROOT: /home/monster/realsas_authority/runs/SUBJECT2_KNIGHT_DEMO_V2_20260924
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Audit safe mechanical deformation regions in source raster
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          from collections import defaultdict,deque
          import numpy as np
          from compiler.realsas_compiler_core.artifact_codec_v2 import (
              canonical_mesh_candidate_from_dict,qualified_camera_set_from_dict,
              qualified_observation_set_from_dict,qualified_skeleton_from_dict,qualified_skin_from_dict,
              rigging_surface_from_dict,deformation_envelope_from_dict,
          )
          from compiler.realsas_compiler_core.artifact_codec_v2 import mesh_policy_from_dict
          from compiler.realsas_compiler_core.mesh.skin_topology_compatibility_v1 import run_skin_topology_compatibility_v1
          from compiler.realsas_compiler_core.visibility_v2 import rasterize_visible_owner
          root=Path(os.environ["RUN_ROOT"])
          led=json.loads((root/"ACTIVE_RUN_V2.json").read_text())
          by={x["id"]:x for x in led["stages"]}
          def old(stage,schema):
              # Artifacts remain on disk even though rescue rebind invalidated the ledger.
              p=root/"artifacts"/stage
              candidates=[]
              for f in p.glob("*.json"):
                  try:o=json.loads(f.read_text())
                  except:continue
                  if o.get("schema_version")==schema or o.get("schema")==schema:
                      candidates.append(o)
              if len(candidates)!=1: raise RuntimeError((stage,schema,len(candidates),[x.name for x in p.glob("*.json")]))
              return candidates[0]
          cand=canonical_mesh_candidate_from_dict(old("18_CANONICAL_MESH_ADDRESSING_BUILD","RealSaS.CanonicalMeshCandidateIR.v1"))
          policy=mesh_policy_from_dict(old("18_CANONICAL_MESH_ADDRESSING_BUILD","RealSaS.MeshQualificationPolicyIR.v1"))
          surf=rigging_surface_from_dict(old("15_RIGGING_SURFACE_QUALIFIED","RealSaS.RiggingSurfaceIR.v1"))
          skel=qualified_skeleton_from_dict(old("28_SKELETON_QUALIFIED","RealSaS.QualifiedSkeletonIR.v1"))
          skin=qualified_skin_from_dict(old("32_SKIN_QUALIFIED","RealSaS.QualifiedSkinIR.v1"))
          env=deformation_envelope_from_dict(old("34_DEFORMATION_CAPABILITY_ENVELOPE","RealSaS.DeformationCapabilityEnvelopeIR.v1"))
          cams=qualified_camera_set_from_dict(old("05_CAMERA_CONTRACT_SOLVED","RealSaS.QualifiedCameraSetIR.v1"))
          obs=qualified_observation_set_from_dict(old("07_OBSERVATION_CONTRACT_QUALIFIED","RealSaS.QualifiedObservationSetIR.v1"))
          ordered=tuple(sorted(cams.cameras,key=lambda x:int(x.view_index)))
          comp=run_skin_topology_compatibility_v1(cand,surface=surf,skeleton=skel,skin=skin,envelope=env,cameras=ordered,policy=policy)
          unsafe=set(map(int,comp["unsafe_face_indices"]))
          vids={str(v.candidate_vertex_id):i for i,v in enumerate(cand.vertices)}
          faces=np.asarray([[vids[str(x)] for x in f] for f in cand.faces],dtype=np.int64)
          edge_faces=defaultdict(list)
          for fi,(a,b,c) in enumerate(faces.tolist()):
              for u,v in ((a,b),(b,c),(c,a)): edge_faces[(min(u,v),max(u,v))].append(fi)
          adj=[[] for _ in range(len(faces))]
          for rows in edge_faces.values():
              if len(rows)==2:
                  a,b=rows
                  if a not in unsafe and b not in unsafe:
                      adj[a].append(b);adj[b].append(a)
          labels=np.full(len(faces),-1,dtype=np.int32)
          sizes=[]
          cid=0
          for fi in range(len(faces)):
              if fi in unsafe or labels[fi]>=0: continue
              q=[fi];labels[fi]=cid;n=0
              for x in q:
                  n+=1
                  for y in adj[x]:
                      if labels[y]<0: labels[y]=cid;q.append(y)
              sizes.append(n);cid+=1
          print("SAFE_COMPONENTS",json.dumps({"count":cid,"unsafe_faces":len(unsafe),"safe_faces":int(np.sum(labels>=0)),"top_sizes":sorted(sizes,reverse=True)[:30]},sort_keys=True))
          # source masks from run manifest
          manifest=json.loads((root/"run_manifest.json").read_text())
          mask_rows={int(x["view_index"]):x for x in manifest["observation"]["source_foreground_masks"]}
          for vi in (0,2):
              ref=mask_rows[vi]["mask"]; raw=str(ref["path"])
              if raw.startswith("$REALSAS_AUTHORITY_ROOT/"):
                  mp=root.parents[1]/raw.split("/",1)[1]
              else: mp=Path(raw)
              auth=next(v for v in obs.views if int(v.view_index)==vi)
              mask=np.frombuffer(mp.read_bytes(),dtype=np.uint8).reshape(int(auth.height),int(auth.width)).astype(bool)
              vis=rasterize_visible_owner(cand,ordered[vi],positions=np.asarray([v.P for v in cand.vertices],float),width=int(auth.width),height=int(auth.height),max_layers=4)
              owner=np.asarray(vis.owner_face_index,dtype=np.int64)
              fg=np.flatnonzero(mask.ravel())
              own=owner.ravel()[fg]
              valid=own>=0
              ownv=own[valid]
              unsafe_px=int(np.sum(np.isin(ownv,np.fromiter(unsafe,dtype=np.int64)))) if unsafe else 0
              safe_owner=ownv[(ownv>=0)&(~np.isin(ownv,np.fromiter(unsafe,dtype=np.int64)))]
              labs=labels[safe_owner]
              vals,counts=np.unique(labs[labs>=0],return_counts=True)
              order=np.argsort(counts)[::-1]
              print("VIEW_REGION",json.dumps({
                  "view":vi,"foreground":int(mask.sum()),"mechanical_owned":int(valid.sum()),
                  "unowned":int(len(fg)-valid.sum()),"unsafe_owner_pixels":unsafe_px,
                  "safe_owner_pixels":int(len(safe_owner)),"safe_component_count_visible":int(len(vals)),
                  "top_components":[[int(vals[i]),int(counts[i])] for i in order[:30]]
              },sort_keys=True))
          PY
