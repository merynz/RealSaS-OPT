name: knight-visual-resume-render

on:
  push:
    branches: [platform/professional-backend-v1-20261001]
    paths: ['.github/workflows/knight_visual_resume_render.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 60
    env:
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      AUTHORITY_ROOT: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929
      OUT_DIR: /tmp/realsas_knight_visual_resume
      PLAYER: /tmp/realsas_knight_visual_mesh_player
    steps:
      - uses: actions/checkout@v4
        with:
          ref: platform/professional-backend-v1-20261001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
          python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt
      - name: Build native visual renderer
        run: c++ -std=c++17 -O2 -Wall -Wextra -pedantic tools/demo/native_visual_mesh_preview_v1.cpp -lpng -lz -o "$PLAYER"
      - name: Seal upstream identity
        run: |
          run="$AUTHORITY_ROOT/runs/$RUN_ID"
          sha256sum "$run/ACTIVE_RUN_V2.json" "$run/run_manifest.json" > "$RUNNER_TEMP/upstream_before.sha256"
      - name: Render
        run: |
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          python tools/demo/render_knight_solution_visual_resume_v1.py             --authority-root "$AUTHORITY_ROOT"             --run-id "$RUN_ID"             --out-dir "$OUT_DIR"             --native-player "$PLAYER"             --render-resolution 512
          cat "$OUT_DIR/REPORT.json"
      - name: Verify no upstream mutation
        run: |
          run="$AUTHORITY_ROOT/runs/$RUN_ID"
          sha256sum "$run/ACTIVE_RUN_V2.json" "$run/run_manifest.json" > "$RUNNER_TEMP/upstream_after.sha256"
          diff -u "$RUNNER_TEMP/upstream_before.sha256" "$RUNNER_TEMP/upstream_after.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: knight-visual-resume-render
          path: |
            /tmp/realsas_knight_visual_resume/*.gif
            /tmp/realsas_knight_visual_resume/*.json
          if-no-files-found: error
          retention-days: 30
