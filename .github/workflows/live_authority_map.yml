name: Live Authority Map

on:
  push:
    branches: [main]
    paths:
      - 'CURRENT_STATE.md'
      - 'canonical/AUTHORITY_MAP_V1.json'
      - 'canonical/ARCHITECTURE_AUTHORITY_LEDGER_V1.md'
      - 'canonical/EXPERIMENT_AUTHORITY_LEDGER_V1.md'
      - 'canonical/BRANCH_AUTHORITY_V1.md'
      - 'tools/render_authority_map.py'
      - '.github/workflows/live_authority_map.yml'
  create:
  delete:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-authority-map
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 10
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Render live authority map
        id: render
        shell: bash
        run: |
          set +e
          python tools/render_authority_map.py --write
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ -f canonical/LIVE_AUTHORITY_MAP.md ]; then
            cat canonical/LIVE_AUTHORITY_MAP.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Commit refreshed diagnostic/current map
        shell: bash
        run: |
          if git diff --quiet -- canonical/LIVE_AUTHORITY_MAP.md; then
            echo "Live authority map already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canonical/LIVE_AUTHORITY_MAP.md
          git commit -m "Refresh live authority map [skip ci]"
          git push origin HEAD:main

      - name: Enforce authority-map validity
        if: steps.render.outputs.rc != '0'
        run: |
          echo "Live authority map is INVALID; inspect canonical/LIVE_AUTHORITY_MAP.md"
          exit 1
