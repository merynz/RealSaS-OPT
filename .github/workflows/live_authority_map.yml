name: Live Authority Context

on:
  push:
    branches: [main]
    paths:
      - 'CURRENT_STATE.md'
      - 'README.md'
      - 'AGENTS.md'
      - 'canonical/AUTHORITY_MAP_V1.json'
      - 'canonical/CONTEXT_STATE_V1.json'
      - 'canonical/BOOTSTRAP_COVERAGE_STATE_V1.json'
      - 'canonical/EXPERIMENT_REGISTRY_V1.json'
      - 'canonical/SCIENTIFIC_JOURNAL_V1.jsonl'
      - 'canonical/ARCHITECTURE_AUTHORITY_LEDGER_V1.md'
      - 'canonical/EXPERIMENT_AUTHORITY_LEDGER_V1.md'
      - 'canonical/BRANCH_AUTHORITY_V1.md'
      - 'tools/render_authority_map.py'
      - 'tools/render_rehydration_packet.py'
      - 'tools/audit_context_coverage.py'
      - '.github/workflows/live_authority_map.yml'
  create:
  delete:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-authority-context
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 10
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Audit context coverage
        id: coverage
        shell: bash
        run: |
          set +e
          python3 tools/audit_context_coverage.py
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Render live authority map
        id: authority
        shell: bash
        run: |
          set +e
          python3 tools/render_authority_map.py --write
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Render rehydration packet
        id: context
        shell: bash
        run: |
          set +e
          python3 tools/render_rehydration_packet.py --write
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish generated views to job summary
        shell: bash
        run: |
          if [ -f canonical/REHYDRATION_PACKET.md ]; then
            cat canonical/REHYDRATION_PACKET.md >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '\n---\n' >> "$GITHUB_STEP_SUMMARY"
          if [ -f canonical/CONTEXT_COVERAGE_AUDIT.md ]; then
            cat canonical/CONTEXT_COVERAGE_AUDIT.md >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '\n---\n' >> "$GITHUB_STEP_SUMMARY"
          if [ -f canonical/LIVE_AUTHORITY_MAP.md ]; then
            cat canonical/LIVE_AUTHORITY_MAP.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit refreshed generated views
        shell: bash
        run: |
          changed="$(git status --porcelain -- canonical/LIVE_AUTHORITY_MAP.md canonical/REHYDRATION_PACKET.md canonical/CONTEXT_COVERAGE_AUDIT.md canonical/CONTEXT_COVERAGE_AUDIT.json)"
          if [ -z "$changed" ]; then
            echo "Generated authority/context views already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canonical/LIVE_AUTHORITY_MAP.md canonical/REHYDRATION_PACKET.md canonical/CONTEXT_COVERAGE_AUDIT.md canonical/CONTEXT_COVERAGE_AUDIT.json
          git commit -m "Refresh live authority context [skip ci]"
          git push origin HEAD:main

      - name: Enforce live-context validity
        if: steps.coverage.outputs.rc != '0' || steps.authority.outputs.rc != '0' || steps.context.outputs.rc != '0'
        run: |
          echo "Live authority/context state is INVALID. Inspect generated canonical views."
          echo "coverage_rc=${{ steps.coverage.outputs.rc }}"
          echo "authority_rc=${{ steps.authority.outputs.rc }}"
          echo "context_rc=${{ steps.context.outputs.rc }}"
          exit 1
