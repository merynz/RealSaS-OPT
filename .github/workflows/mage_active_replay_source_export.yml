name: mage-active-replay-source-export

on:
  push:
    branches:
      - repair/mage-full-subject-reclosure-20260912
    paths:
      - '.github/workflows/mage_active_replay_source_export.yml'
  workflow_dispatch:

concurrency:
  group: mage-active-replay-source-export-realsas
  cancel-in-progress: true

jobs:
  export:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload frozen replay source bundle
        uses: actions/upload-artifact@v4
        with:
          name: mage-active-replay-source-${{ github.sha }}
          path: |
            compiler/realsas_compiler_core
            models/geppetto/reference_strength_v1
            experiments/geppetto_reference_strength_fullstack_v1
            experiments/mage_full_subject_reclosure_v1
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
