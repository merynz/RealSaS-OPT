name: Mage FIT2 Adaptive Boundary Quality CDT Preflight

on:
  push:
    branches:
      - repair/mage-full-subject-reclosure-20260912-adaptive-steiner-tmp
    paths:
      - 'experiments/mage_full_subject_reclosure_v1/run_fit2_adaptive_boundary_quality_cdt_v1.py'
      - 'tests/compiler/test_fit2_adaptive_boundary_quality_cdt_contract_v1.py'
      - 'canonical/FIT2_ADAPTIVE_BOUNDARY_QUALITY_CDT_PREREG_20260913.md'
      - '.github/workflows/mage_fit2_adaptive_boundary_quality_cdt_preflight.yml'
  workflow_dispatch:

jobs:
  preflight:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 25
    env:
      PYTHONPATH: .:compiler
      PYTHONHASHSEED: '20260912'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Isolated Python environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .preflight-venv
          python3 -m venv .preflight-venv
          .preflight-venv/bin/python -m pip install -q --upgrade pip
          .preflight-venv/bin/python -m pip install -q numpy scipy pillow scikit-image pytest
      - name: Runtime dependency probe
        shell: bash
        run: |
          set -euo pipefail
          .preflight-venv/bin/python - <<'PY'
          import numpy, scipy, PIL, skimage, pytest
          print('DEPENDENCY_PROBE_PASS')
          print('numpy', numpy.__version__)
          print('scipy', scipy.__version__)
          print('skimage', skimage.__version__)
          PY
      - name: Syntax and import preflight
        shell: bash
        run: |
          set -euo pipefail
          .preflight-venv/bin/python -m py_compile experiments/mage_full_subject_reclosure_v1/run_fit2_adaptive_boundary_quality_cdt_v1.py
          .preflight-venv/bin/python - <<'PY'
          import experiments.mage_full_subject_reclosure_v1.run_fit2_adaptive_boundary_quality_cdt_v1 as m
          assert [x['name'] for x in m.TREATMENTS] == ['B4_G16','B2_G12','B1_G8']
          assert m._PARENT_LOCAL_HOPS == 2
          print('IMPORT_PREFLIGHT_PASS', m.SCHEMA, m.TREATMENTS)
          PY
      - name: Adaptive boundary quality contract tests
        shell: bash
        run: |
          set -euo pipefail
          .preflight-venv/bin/python -m pytest -q tests/compiler/test_fit2_adaptive_boundary_quality_cdt_contract_v1.py
