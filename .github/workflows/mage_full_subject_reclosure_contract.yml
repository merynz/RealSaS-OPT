name: mage-full-subject-reclosure-contract

on:
  push:
    branches:
      - repair/mage-full-subject-reclosure-20260912
    paths:
      - 'compiler/realsas_compiler_core/component_attachment.py'
      - 'tests/compiler/test_component_attachment_v1.py'
      - 'tools/audit_full_subject_coverage.py'
      - 'canonical/MAGE_*20260912*'
      - '.github/workflows/mage_full_subject_reclosure_contract.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: [self-hosted]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        shell: powershell
        run: |
          python --version
          python -m pip install -q pytest numpy pillow
      - name: Static compile
        shell: powershell
        run: |
          python -m py_compile compiler/realsas_compiler_core/component_attachment.py
          python -m py_compile tools/audit_full_subject_coverage.py
          python -m py_compile tests/compiler/test_component_attachment_v1.py
      - name: Component attachment contract tests
        shell: powershell
        run: |
          python -m pytest -q tests/compiler/test_component_attachment_v1.py
