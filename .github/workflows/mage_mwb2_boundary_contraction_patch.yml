name: mage-mwb2-boundary-contraction-patch

on:
  push:
    branches:
      - repair/mage-full-subject-reclosure-20260912
    paths:
      - '.github/workflows/mage_mwb2_boundary_contraction_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --no-input --progress-bar off --only-binary=:all: numpy scipy pillow pytest scikit-image
      - name: Apply fail-closed boundary-recovery contraction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, zlib
          payload = ''
          raw = zlib.decompress(base64.b64decode(payload))
          assert hashlib.sha256(raw).hexdigest() == '3470a5463738960a60afbb88f5bdea7c78ecda0ee15c8c76589d7235471e81d8'
          Path('compiler/realsas_compiler_core/mesh/mwb2_cdt.py').write_bytes(raw)
          append_payload = ''
          test = Path('tests/compiler/test_mwb2_observation_cdt_v1.py')
          text = test.read_text(encoding='utf-8')
          if 'test_boundary_recovery_midpoint_is_solver_internal_only' not in text:
              text += zlib.decompress(base64.b64decode(append_payload)).decode('utf-8')
              test.write_text(text, encoding='utf-8')
          PY
      - name: Compile and test
        run: |
          python -m py_compile compiler/realsas_compiler_core/mesh/mwb2_cdt.py
          python -m py_compile compiler/realsas_compiler_core/mesh/observation_domain.py
          PYTHONPATH=. python -m pytest -q tests/compiler/test_mwb2_observation_cdt_v1.py tests/compiler/test_historical_cdt_v05_loader.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'RealSaS - OPT'
          git config user.email '140457344+merynz@users.noreply.github.com'
          git add compiler/realsas_compiler_core/mesh/mwb2_cdt.py tests/compiler/test_mwb2_observation_cdt_v1.py
          git diff --cached --quiet && exit 0
          git commit -m 'Contract historical CDT boundary recovery vertices'
          git push origin HEAD:repair/mage-full-subject-reclosure-20260912
