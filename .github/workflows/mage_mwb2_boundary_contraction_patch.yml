name: mage-mwb2-boundary-contraction-patch

on:
  push:
    branches:
      - repair/mage-full-subject-reclosure-20260912
    paths:
      - '.github/workflows/mage_mwb2_boundary_contraction_patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --no-input --progress-bar off --only-binary=:all: numpy scipy pillow pytest scikit-image
      - name: Apply repair
        run: python tools/repair_mwb2_boundary_contraction_20260912.py
      - name: Compile and test
        run: |
          python -m py_compile compiler/realsas_compiler_core/mesh/mwb2_cdt.py
          PYTHONPATH=. python -m pytest -q tests/compiler/test_mwb2_observation_cdt_v1.py tests/compiler/test_historical_cdt_v05_loader.py
      - name: Commit repaired adapter
        shell: bash
        run: |
          git config user.name 'RealSaS - OPT'
          git config user.email '140457344+merynz@users.noreply.github.com'
          git add compiler/realsas_compiler_core/mesh/mwb2_cdt.py tests/compiler/test_mwb2_observation_cdt_v1.py
          git diff --cached --quiet && exit 0
          git commit -m 'Contract historical CDT boundary recovery vertices'
          git push origin HEAD:repair/mage-full-subject-reclosure-20260912
