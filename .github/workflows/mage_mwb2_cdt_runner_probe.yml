name: mage-mwb2-cdt-runner-probe

on:
  push:
    branches:
      - repair/mage-full-subject-reclosure-20260912
    paths:
      - '.github/workflows/mage_mwb2_cdt_runner_probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Locate Mage H1 1024 cached artifacts
        shell: bash
        run: |
          mkdir -p runner_probe
          : > runner_probe/candidate_paths.txt
          for root in /mnt/c/Users /home; do
            if [ -d "$root" ]; then
              find "$root" -type f \
                \( -iname 'ZERO_SURFACE_PRODUCT_CLIPPED.npz' \
                   -o -iname '*zero_surface*.npz' \
                   -o -iname '*20260912T074348Z*' \
                   -o -iname '*mage*.npz' \
                   -o -iname '*mage*.json' \) \
                -not -path '*/AppData/*' \
                -not -path '*/node_modules/*' \
                -not -path '*/.git/*' \
                -not -path '*/.cache/*' \
                2>/dev/null >> runner_probe/candidate_paths.txt || true
            fi
          done
          sort -u runner_probe/candidate_paths.txt | head -n 1000 > runner_probe/candidate_paths.sorted.txt
          mv runner_probe/candidate_paths.sorted.txt runner_probe/candidate_paths.txt
          python - <<'PY'
          from pathlib import Path
          import json
          rows = []
          for raw in Path('runner_probe/candidate_paths.txt').read_text(encoding='utf-8', errors='replace').splitlines():
              p = Path(raw.strip())
              if not raw.strip():
                  continue
              try:
                  size = p.stat().st_size
              except OSError:
                  size = None
              rows.append({'path': str(p), 'size_bytes': size})
          out = {
              'schema': 'RealSaS.MageMWB2CDTRunnerArtifactProbe.v2',
              'hit_count': len(rows),
              'hits': rows,
          }
          Path('runner_probe/mage_h1_1024_artifact_inventory.json').write_text(
              json.dumps(out, indent=2), encoding='utf-8'
          )
          print(json.dumps({'hit_count': len(rows)}))
          PY
      - name: Upload probe inventory
        uses: actions/upload-artifact@v4
        with:
          name: mage-h1-1024-runner-probe
          path: |
            runner_probe/mage_h1_1024_artifact_inventory.json
            runner_probe/candidate_paths.txt
          if-no-files-found: error
          retention-days: 3
