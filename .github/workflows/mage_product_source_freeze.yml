name: Mage Product Source Freeze

on:
  push:
    branches:
      - 'product/mage-fit1-demo-fulfillment-20260914'
    paths:
      - 'compiler/realsas_compiler_core/motion_rotation_only.py'
      - 'compiler/realsas_compiler_core/motion_quality.py'
      - 'compiler/realsas_compiler_core/appearance_atlas.py'
      - 'compiler/realsas_compiler_core/mesh/rigid_attachment_skin.py'
      - 'compiler/realsas_compiler_core/render_support.py'
      - 'compiler/realsas_compiler_services/proof/directional_motion_evaluator.py'
      - 'experiments/mage_demo_fit1_v5_p1/materialize_p1q_current_authority_v1.py'
      - 'experiments/mage_demo_fit1_v5_p1/materialize_runtime_foreground_atlas_v1.py'
      - 'experiments/mage_demo_fit1_v5_p1/materialize_component_assembly_v1.py'
      - 'experiments/mage_demo_fit1_v5_p1/materialize_product_state_v1.py'
      - 'tests/product/test_mage_rotation_only_qualified_motion_v1.py'
      - 'tests/product/test_motion_quality_recovery_v1.py'
      - 'tests/product/test_external_directional_motion_evaluator_v1.py'
      - 'tests/product/test_external_render_support_v1.py'
      - 'tests/product/test_appearance_atlas_v1.py'
      - '.github/workflows/mage_product_source_freeze.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-freeze:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check numpy pytest pillow scikit-image torch
      - name: Compile notebook source surface
        run: |
          python -m py_compile \
            compiler/realsas_compiler_core/motion_rotation_only.py \
            compiler/realsas_compiler_core/motion_quality.py \
            compiler/realsas_compiler_core/appearance_atlas.py \
            compiler/realsas_compiler_core/mesh/rigid_attachment_skin.py \
            compiler/realsas_compiler_core/render_support.py \
            compiler/realsas_compiler_services/proof/directional_motion_evaluator.py \
            experiments/mage_demo_fit1_v5_p1/materialize_p1q_current_authority_v1.py \
            experiments/mage_demo_fit1_v5_p1/materialize_runtime_foreground_atlas_v1.py \
            experiments/mage_demo_fit1_v5_p1/materialize_component_assembly_v1.py \
            experiments/mage_demo_fit1_v5_p1/materialize_product_state_v1.py
      - name: Import notebook stage modules
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import compiler.realsas_compiler_core.motion_quality
          import experiments.mage_demo_fit1_v5_p1.materialize_p1q_current_authority_v1
          import experiments.mage_demo_fit1_v5_p1.materialize_runtime_foreground_atlas_v1
          import experiments.mage_demo_fit1_v5_p1.materialize_component_assembly_v1
          import experiments.mage_demo_fit1_v5_p1.materialize_product_state_v1
          print('MAGE_PRODUCT_STAGE_IMPORT_PASS')
          PY
      - name: Run source freeze regressions
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q \
            tests/product/test_mage_rotation_only_qualified_motion_v1.py \
            tests/product/test_motion_quality_recovery_v1.py \
            tests/product/test_external_directional_motion_evaluator_v1.py \
            tests/product/test_external_render_support_v1.py \
            tests/product/test_appearance_atlas_v1.py
