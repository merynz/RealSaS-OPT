name: main-green-governance-preflight

on:
  push:
    branches: [maintenance/main-green-20261002]
    paths:
      - 'CURRENT_STATE.md'
      - 'canonical/AUTHORITY_MAP_V1.json'
      - 'canonical/CONTEXT_STATE_V2.json'
      - 'canonical/CURRENT_RND_LINEAGE_V1.json'
      - 'canonical/APPEARANCE_RUNTIME_DATAFLOW_GRAPH_V1_20261002.json'
      - 'tests/repository/test_current_continuity_authority_v2.py'
      - '.github/workflows/live_authority_map.yml'
      - '.github/workflows/main_green_governance_preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install readiness dependencies
        run: |
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
          python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt
      - name: Repository readiness subset
        run: |
          python -m pytest -q \
            tests/repository/test_repository_governance_v1.py \
            tests/repository/test_current_continuity_authority_v2.py \
            tests/repository/test_canonical_main_readiness_v1.py \
            tests/repository/test_mainline_execution_plan_v2.py
      - name: Context coverage
        id: coverage
        shell: bash
        run: |
          set +e
          python tools/audit_context_coverage.py
          rc=$?
          cat canonical/CONTEXT_COVERAGE_AUDIT.json || true
          exit "$rc"
      - name: Authority map
        if: always()
        run: python tools/render_authority_map.py --cached-refs
      - name: Rehydration packet
        if: always()
        run: python tools/render_rehydration_packet.py
