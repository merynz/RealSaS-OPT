name: main-source-authority-guardrail-patch

on:
  push:
    branches:
      - ops/main-source-authority-guardrail-20261022
    paths:
      - '.github/workflows/main_source_authority_guardrail_patch.yml'
      - 'platform/internal/attempt/research.go'
      - 'platform/internal/campaign/campaign.go'
      - 'platform/internal/httpapi/operational_routes.go'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/main-source-authority-guardrail-20261022
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Apply canonical-main execution guardrail seams
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  if new in s:
                      return False
                  raise SystemExit(f'expected seam missing: {path}: {old[:80]!r}')
              p.write_text(s.replace(old, new, 1))
              return True

          # Research Attempt: deployed canonical SHA is internal authority, not caller JSON.
          replace_once(
              'platform/internal/attempt/research.go',
              '\tCreatedBy                string                `json:"created_by"`\n',
              '\tCreatedBy                string                `json:"created_by"`\n\tDeployedCodeSHA          string                `json:"-"`\n',
          )
          replace_once(
              'platform/internal/attempt/research.go',
              '\tif req.CreatedBy == "" {\n\t\treturn ResearchStart{}, errors.New("created_by is required")\n\t}\n\n\tbaselineInfo, err := release.LoadInfo',
              '\tif req.CreatedBy == "" {\n\t\treturn ResearchStart{}, errors.New("created_by is required")\n\t}\n\tif err := release.RequireCanonicalMain(ctx, pool, req.CandidateEngineReleaseID, req.DeployedCodeSHA); err != nil {\n\t\treturn ResearchStart{}, err\n\t}\n\n\tbaselineInfo, err := release.LoadInfo',
          )
          replace_once(
              'platform/internal/attempt/research.go',
              '\t\t"candidate_release_sha256":    candidateInfo.ReleaseSHA256,\n\t\t"direct_changed_stage_ids":    directIDs,',
              '\t\t"candidate_release_sha256":    candidateInfo.ReleaseSHA256,\n\t\t"canonical_code_sha":          req.DeployedCodeSHA,\n\t\t"direct_changed_stage_ids":    directIDs,',
          )
          replace_once(
              'platform/internal/attempt/research.go',
              "\t\t\tINSERT INTO attempts\n\t\t\t  (id,subject_id,engine_release_id,parent_attempt_id,kind,spec_sha256,created_by,final_state)\n\t\t\tVALUES ($1,$2,$3,$4,'research',$5,$6,'OPEN')\n\t\t`, attemptID, req.SubjectID, req.CandidateEngineReleaseID, req.ParentAttemptID, specSHA, req.CreatedBy); err != nil {",
              "\t\t\tINSERT INTO attempts\n\t\t\t  (id,subject_id,engine_release_id,parent_attempt_id,kind,spec_sha256,created_by,final_state,canonical_code_sha)\n\t\t\tVALUES ($1,$2,$3,$4,'research',$5,$6,'OPEN',$7)\n\t\t`, attemptID, req.SubjectID, req.CandidateEngineReleaseID, req.ParentAttemptID, specSHA, req.CreatedBy, req.DeployedCodeSHA); err != nil {",
          )
          replace_once(
              'platform/internal/attempt/research.go',
              '\t\t\t"candidate_engine_release_id": req.CandidateEngineReleaseID.String(),\n\t\t\t"direct_changes":',
              '\t\t\t"candidate_engine_release_id": req.CandidateEngineReleaseID.String(),\n\t\t\t"canonical_code_sha":          req.DeployedCodeSHA,\n\t\t\t"direct_changes":',
          )

          # Campaign: reject before creating campaign/member rows and pass exact deployed SHA to member Attempts.
          replace_once(
              'platform/internal/campaign/campaign.go',
              '\tmembers, err := orderedMembers(req)\n\tif err != nil {\n\t\treturn Status{}, err\n\t}\n\tcandidateGraph, _, err := release.LoadGraph',
              '\tmembers, err := orderedMembers(req)\n\tif err != nil {\n\t\treturn Status{}, err\n\t}\n\tif err := release.RequireCanonicalMain(ctx, pool, req.CandidateEngineReleaseID, deployedCodeSHA); err != nil {\n\t\treturn Status{}, err\n\t}\n\tcandidateGraph, _, err := release.LoadGraph',
          )
          replace_once(
              'platform/internal/campaign/campaign.go',
              '\t\t\tCandidateEngineReleaseID: req.CandidateEngineReleaseID,\n\t\t\tCreatedBy:                req.CreatedBy,',
              '\t\t\tCandidateEngineReleaseID: req.CandidateEngineReleaseID,\n\t\t\tCreatedBy:                req.CreatedBy,\n\t\t\tDeployedCodeSHA:          deployedCodeSHA,',
          )

          # Operational API shadows legacy release/attempt routes so source identity comes from deployed Platform, never request JSON.
          replace_once(
              'platform/internal/httpapi/operational_routes.go',
              '\t"github.com/google/uuid"\n\t"github.com/merynz/RealSaS-OPT/platform/internal/experiment"',
              '\t"github.com/google/uuid"\n\t"github.com/merynz/RealSaS-OPT/platform/internal/attempt"\n\t"github.com/merynz/RealSaS-OPT/platform/internal/experiment"',
          )
          replace_once(
              'platform/internal/httpapi/operational_routes.go',
              '\t"github.com/merynz/RealSaS-OPT/platform/internal/operational"\n)',
              '\t"github.com/merynz/RealSaS-OPT/platform/internal/operational"\n\t"github.com/merynz/RealSaS-OPT/platform/internal/release"\n)',
          )
          anchor = '\tmux := http.NewServeMux()\n\n'
          insertion = '''\tmux := http.NewServeMux()\n\n\t// EngineRelease source authority is minted only by the deployed Platform.\n\t// Clients can describe a release, but cannot self-assert that branch code is main.\n\tmux.HandleFunc("POST /v1/releases", func(w http.ResponseWriter, r *http.Request) {\n\t\tvar req struct {\n\t\t\tManifest  release.Manifest `json:"manifest"`\n\t\t\tCreatedBy string           `json:"created_by"`\n\t\t}\n\t\tif !decode(w, r, &req) {\n\t\t\treturn\n\t\t}\n\t\tout, err := release.Seal(r.Context(), a.Pool, a.Graph, req.Manifest, req.CreatedBy)\n\t\tif err != nil {\n\t\t\tresult(w, out, err)\n\t\t\treturn\n\t\t}\n\t\tif _, err := release.BindCanonicalMain(r.Context(), a.Pool, out.ReleaseID, a.CodeSHA, req.CreatedBy); err != nil {\n\t\t\tresult(w, out, err)\n\t\t\treturn\n\t\t}\n\t\tresult(w, out, nil)\n\t})\n\tmux.HandleFunc("GET /v1/releases/{id}/sources", func(w http.ResponseWriter, r *http.Request) {\n\t\tid, err := uuid.Parse(r.PathValue("id"))\n\t\tif err != nil {\n\t\t\trespond(w, 400, map[string]string{"error": "invalid release id"})\n\t\t\treturn\n\t\t}\n\t\tout, err := release.SourceBindings(r.Context(), a.Pool, id)\n\t\tif err != nil {\n\t\t\tresult(w, nil, err)\n\t\t\treturn\n\t\t}\n\t\trespond(w, 200, out)\n\t})\n\tmux.HandleFunc("POST /v1/research/attempts", func(w http.ResponseWriter, r *http.Request) {\n\t\tvar req attempt.ResearchRequest\n\t\tif !decode(w, r, &req) {\n\t\t\treturn\n\t\t}\n\t\treq.DeployedCodeSHA = a.CodeSHA\n\t\tout, err := attempt.StartResearch(r.Context(), a.Pool, a.Graph, req)\n\t\tresult(w, out, err)\n\t})\n\n'''
          replace_once('platform/internal/httpapi/operational_routes.go', anchor, insertion)
          PY

          gofmt -w \
            platform/internal/attempt/research.go \
            platform/internal/campaign/campaign.go \
            platform/internal/httpapi/operational_routes.go
          cd platform
          go test ./internal/release ./internal/attempt ./internal/campaign ./internal/httpapi
      - name: Commit patched guardrail seams
        run: |
          if git diff --quiet; then
            echo 'MAIN_SOURCE_AUTHORITY_SEAMS_ALREADY_APPLIED'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            platform/internal/attempt/research.go \
            platform/internal/campaign/campaign.go \
            platform/internal/httpapi/operational_routes.go
          git commit -m 'platform: enforce deployed-main authority for research execution'
          git push origin HEAD:ops/main-source-authority-guardrail-20261022
