name: mechanical-multisupport-owner-contract-v1

on:
  push:
    branches: [audit/canonical-caa-mechanics-geometry-lock-20261002]
    paths:
      - compiler/realsas_compiler_core/mesh/skin_topology_compatibility_v1.py
      - tests/compiler/test_skin_topology_repartition_directive_v2.py
      - .github/workflows/mechanical_multisupport_owner_contract_v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - run: python -m pytest -q tests/compiler/test_skin_topology_repartition_directive_v2.py
