name: mechanics-main-subtree-runtime-v1

on:
  pull_request:
    # Full court runs on opening/ready state, not every intermediate commit.
    types: [opened, reopened, ready_for_review]
    paths:
      - 'compiler/realsas_compiler_core/mechanics_control_solver_v1.py'
      - 'tests/compiler/test_mechanics_main_subtree_runtime_v1.py'
      - 'compiler/realsas_compiler_core/mechanics_*_v1.py'
      - 'tests/compiler/test_mechanics_*_v1.py'
      - 'docs/platform/MECHANICS_ROOT_SUBTREE_PRODUCT_RUNTIME_20261107.md'
      - '.github/workflows/mechanics_main_subtree_runtime_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  subtree-control-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU Compiler profile
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Run source-preserving Mechanics and Motion behavioral courts
        run: |
          python -m pytest -q \
            tests/compiler/test_mechanics_main_subtree_runtime_v1.py \
            tests/compiler/test_mechanics_control_solver_v1.py \
            tests/compiler/test_canonical_mechanics_ir_v1.py \
            tests/compiler/test_control_motion_v2.py \
            tests/compiler/test_control_motion_ik_integration_v1.py \
            tests/compiler/test_v6_motion_main_integration_v1.py \
            tests/compiler/test_mechanics_cas_worker_main_v1.py \
            tests/compiler/test_mechanics_secondary_runtime_contract_v1.py \
            tests/compiler/test_mechanics_multigoal_solver_v1.py \
            tests/compiler/test_mechanics_live_multigoal_integration_v1.py \
            tests/compiler/test_mechanics_attachment_frames_v1.py \
            tests/compiler/test_mechanics_oriented_ik_v1.py \
            tests/compiler/test_mechanics_attachment_feasibility_v1.py \
            tests/compiler/test_mechanics_relative_attachment_bridge_v1.py \
            tests/compiler/test_mechanics_attachment_priority_v1.py \
            tests/compiler/test_mechanics_prepared_skin_v1.py \
            tests/compiler/test_mechanics_xpbd_domain_v1.py \
            tests/compiler/test_controllable_puppet_multigoal_editor_v1.py \
            tests/compiler/test_mechanics_xpbd_secondary_v1.py \
            tests/compiler/test_mechanics_xpbd_product_bridge_v1.py \
            tests/compiler/test_mechanics_xpbd_surface_v1.py \
            tests/compiler/test_mechanics_xpbd_surface_editor_v1.py
