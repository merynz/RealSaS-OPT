name: mechanics-v1-product

on:
  pull_request:
    paths:
      - 'compiler/realsas_compiler_core/rig_constraint_schema_v1.py'
      - 'compiler/realsas_compiler_core/mechanics_control_solver_v1.py'
      - 'compiler/realsas_compiler_core/canonical_mechanics_ir_v1.py'
      - 'compiler/realsas_compiler_services/platform_worker/mechanics_executor_v1.py'
      - 'platform/internal/capability/product_mechanics.go'
      - 'tests/compiler/test_mechanics_control_solver_v1.py'
      - 'tests/compiler/test_canonical_mechanics_ir_v1.py'
      - '.github/workflows/mechanics_v1_product.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mechanics-v1-product-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mechanics-contract-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reviewed dependencies
        run: |
          set -euo pipefail
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
          python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt
      - name: Compile Mechanics product sources
        run: |
          set -euo pipefail
          python -m py_compile \
            compiler/realsas_compiler_core/rig_constraint_schema_v1.py \
            compiler/realsas_compiler_core/mechanics_control_solver_v1.py \
            compiler/realsas_compiler_core/canonical_mechanics_ir_v1.py \
            compiler/realsas_compiler_services/platform_worker/mechanics_executor_v1.py
      - name: Run Mechanics solver and canonical authority courts
        run: |
          set -euo pipefail
          pytest -q \
            tests/compiler/test_mechanics_control_solver_v1.py \
            tests/compiler/test_canonical_mechanics_ir_v1.py
