name: mira-v55-runtime-recovery-transient

on:
  pull_request:
    branches: [main]
    paths:
      - 'models/mira/**'
      - 'tools/build_mira_v55_runtime_checkpoint_v1.py'
      - 'canonical/MIRA_V55_RUNTIME_RECOVERY_V1.json'
      - '.github/workflows/mira_v55_runtime_recovery_transient.yml'

concurrency:
  group: mira-v55-runtime-recovery-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    if: >
      github.event.pull_request.head.ref == 'product/skin-mira-runtime-v1-20261024' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 45
    env:
      PLATFORM_ROOT: /home/monster/realsas_platform
      AUTHORITY_ROOT: /home/monster/realsas_authority
      RCLONE_REMOTE: ${{ vars.REALSAS_RCLONE_DRIVE_REMOTE || 'gdrive' }}
      PYTHONPATH: ${{ github.workspace }}
      BASE_SHA256: bfd2bd24f55bdce2dc36b0ae6a7afe01b8381c680de545c66a11a3d707fe73ed
      COMPOSITE_SHA256: 490cd7791c94c0e15e3fa6479a6701bd7bec21e03dff76b69ada638d5bf30a40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements/mainline-ci.txt
            requirements/torch-cpu.txt

      - name: Install pinned runtime-recovery dependencies
        run: |
          set -euo pipefail
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
          python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt

      - name: Require exact PR head and authority tools
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          command -v rclone >/dev/null
          rclone listremotes | grep -Fx "${RCLONE_REMOTE}:"
          python - <<'PY'
          import torch
          assert torch.__version__ == '2.8.0+cpu', torch.__version__
          assert not torch.cuda.is_available()
          PY

      - name: Resolve exact sealed historical components
        run: |
          set -euo pipefail
          ROOT="$AUTHORITY_ROOT/model_runtime_recovery/mira_v55"
          INPUT="$ROOT/input"
          mkdir -p "$INPUT"

          ensure_exact() {
            local remote="$1"
            local target="$2"
            local expected="$3"
            if [ -f "$target" ]; then
              actual="$(sha256sum "$target" | awk '{print $1}')"
              if [ "$actual" = "$expected" ]; then
                echo "MIRA_RUNTIME_INPUT_CACHE_HIT:$target:$actual"
                return 0
              fi
              echo "MIRA_RUNTIME_INPUT_CACHE_DRIFT:$target:$actual!=$expected"
              rm -f "$target"
            fi
            rclone copyto "$remote" "$target"
            test "$(sha256sum "$target" | awk '{print $1}')" = "$expected"
          }

          ensure_exact \
            "${RCLONE_REMOTE}:RealSaS_SUBJECT2_KNIGHT_DEMO_V2_20260924/ARACHNE_STAGE31_V6_DEMO_OUTPUT/ARACHNE_KNIGHT_V6_MODEL_FINAL_FP32.pt" \
            "$INPUT/ARACHNE_KNIGHT_V6_MODEL_FINAL_FP32.pt" \
            "$BASE_SHA256"
          ensure_exact \
            "${RCLONE_REMOTE}:RealSaS_KNIGHT_MIRA_M_V5_5_AXIS541_FROZEN_CARRIER_OUTPUT/MIRA_M/MIRA_M_DIRECT_COMPOSITE_V55.pt" \
            "$INPUT/MIRA_M_DIRECT_COMPOSITE_V55.pt" \
            "$COMPOSITE_SHA256"

      - name: Build self-contained MIRA runtime package
        run: |
          set -euo pipefail
          ROOT="$AUTHORITY_ROOT/model_runtime_recovery/mira_v55"
          INPUT="$ROOT/input"
          OUTPUT="$ROOT/runtime"
          mkdir -p "$OUTPUT"
          python tools/build_mira_v55_runtime_checkpoint_v1.py \
            --base-v6-checkpoint "$INPUT/ARACHNE_KNIGHT_V6_MODEL_FINAL_FP32.pt" \
            --v55-composite "$INPUT/MIRA_M_DIRECT_COMPOSITE_V55.pt" \
            --out "$OUTPUT/MIRA_RUNTIME_CHECKPOINT_V1.pt" \
            --receipt "$OUTPUT/MIRA_RUNTIME_CHECKPOINT_V1_RECEIPT.json"

      - name: Load exact runtime package and seal recovery receipt
        run: |
          set -euo pipefail
          ROOT="$AUTHORITY_ROOT/model_runtime_recovery/mira_v55/runtime"
          EXPECTED_HEAD="${{ github.event.pull_request.head.sha }}"
          export ROOT EXPECTED_HEAD
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from models.mira.runtime_checkpoint_v1 import load_mira_runtime_model_v1

          root=Path(os.environ['ROOT'])
          package=root/'MIRA_RUNTIME_CHECKPOINT_V1.pt'
          base_receipt=json.loads((root/'MIRA_RUNTIME_CHECKPOINT_V1_RECEIPT.json').read_text())
          backbone,decoder,payload=load_mira_runtime_model_v1(package,device='cpu')
          assert payload['schema']=='RealSaS.MIRA.RuntimeCheckpoint.v1'
          assert payload['architecture_id']=='RealSaS.MIRA.DirectCarrierSimplex.Axis541.v5_5'
          assert sum(p.numel() for p in backbone.parameters())==138_053_153
          assert sum(p.numel() for p in decoder.parameters())==1_619_491
          digest=hashlib.sha256(package.read_bytes()).hexdigest()
          assert digest==base_receipt['content_sha256']
          receipt={
            'schema':'RealSaS.MIRAV55RuntimeRecoveryExecution.v1',
            'status':'PASS_SELF_CONTAINED_RUNTIME_PACKAGE',
            'source_head_sha':os.environ['EXPECTED_HEAD'],
            'runtime_checkpoint_path':str(package),
            'runtime_checkpoint_sha256':digest,
            'runtime_checkpoint_size_bytes':package.stat().st_size,
            'base_v6_checkpoint_sha256':payload['source_components']['base_v6_checkpoint_sha256'],
            'v55_composite_sha256':payload['source_components']['v55_composite_sha256'],
            'backbone_parameter_count':sum(p.numel() for p in backbone.parameters()),
            'decoder_parameter_count':sum(p.numel() for p in decoder.parameters()),
            'fit_executed':False,
            'training_executed':False,
            'modelrelease_registered':False,
            'product_skin_activated':False,
            'scientific_pass_minted':False,
          }
          (root/'MIRA_RUNTIME_RECOVERY_EXECUTION_V1.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print('MIRA_RUNTIME_RECOVERY='+json.dumps(receipt,sort_keys=True),flush=True)
          PY

      - name: Preserve small recovery receipts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mira-v55-runtime-recovery-${{ github.run_id }}
          path: |
            /home/monster/realsas_authority/model_runtime_recovery/mira_v55/runtime/MIRA_RUNTIME_CHECKPOINT_V1_RECEIPT.json
            /home/monster/realsas_authority/model_runtime_recovery/mira_v55/runtime/MIRA_RUNTIME_RECOVERY_EXECUTION_V1.json
          if-no-files-found: error
          retention-days: 30
