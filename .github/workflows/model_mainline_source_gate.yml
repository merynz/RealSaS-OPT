name: model-mainline-source-gate

on:
  pull_request:
    paths:
      - 'models/**'
      - 'compiler/realsas_compiler_core/**'
      - 'compiler/realsas_compiler_services/**'
      - 'runtime/reference_v4/**'
      - 'experiments/iris_reprojection_v2_20260831/**'
      - 'experiments/geppetto_arachne_r6_20260901/**'
      - 'tests/iris/test_iris_mainline_source_v1.py'
      - 'tests/models/**'
      - 'restoration/MODEL_SOURCE_OWNERSHIP_AUDIT_V1_20260903.md'
      - '.github/workflows/model_mainline_source_gate.yml'
  push:
    paths:
      - 'models/**'
      - 'compiler/realsas_compiler_core/**'
      - 'compiler/realsas_compiler_services/**'
      - 'runtime/reference_v4/**'
      - 'experiments/iris_reprojection_v2_20260831/**'
      - 'experiments/geppetto_arachne_r6_20260901/**'
      - 'tests/iris/test_iris_mainline_source_v1.py'
      - 'tests/models/**'
      - 'restoration/MODEL_SOURCE_OWNERSHIP_AUDIT_V1_20260903.md'
      - '.github/workflows/model_mainline_source_gate.yml'

jobs:
  source-ownership:
    runs-on: [self-hosted, linux, x64, realsas]
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model source-test dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
          PIP_DEFAULT_TIMEOUT: '60'
        run: |
          python -m pip install --no-input --progress-bar off --only-binary=:all: numpy scipy
      - name: IRIS byte-equivalence and mainline import firewall
        run: python tests/iris/test_iris_mainline_source_v1.py
      - name: Geppetto inference source gate
        run: python tests/models/test_geppetto_mainline_source_v1.py
      - name: SkinFieldCodec source/config gate
        run: python tests/models/test_skin_field_codec_mainline_source_v1.py
      - name: Arachne inference source/dependency bridge gate
        run: python tests/models/test_arachne_mainline_source_v1.py
      - name: Current model training/evaluation source gate
        run: python tests/models/test_model_training_mainline_source_v1.py
      - name: Syntax-compile promoted model packages
        run: |
          python - <<'PY'
          import py_compile
          from pathlib import Path
          for root in (
              Path('models/iris/v2'),
              Path('models/geppetto/v2'),
              Path('models/skin_field_codec/v1'),
              Path('models/arachne/v2'),
          ):
              for path in sorted(root.glob('*.py')):
                  py_compile.compile(str(path), doraise=True)
          PY
