name: motion-retarget-frames-v3

on:
  pull_request:
    branches: [main]
    paths:
      - 'compiler/realsas_compiler_core/motion_retarget_frames_v3.py'
      - 'tests/compiler/test_motion_retarget_frames_v3.py'
      - 'tools/demo/render_knight_source_motion_v3.py'
      - '.github/workflows/motion_retarget_frames_v3.yml'
      - 'tools/motion/blender_extract_motion_source_v2.py'
      - 'canonical/MOTION_PRESET_SOURCE_QUATERNIUS_KNIGHT_NATIVE_V1.json'
  push:
    branches: [main]
    paths:
      - 'compiler/realsas_compiler_core/motion_retarget_frames_v3.py'
      - 'tests/compiler/test_motion_retarget_frames_v3.py'
      - 'tools/demo/render_knight_source_motion_v3.py'
      - '.github/workflows/motion_retarget_frames_v3.yml'
      - 'tools/motion/blender_extract_motion_source_v2.py'
      - 'canonical/MOTION_PRESET_SOURCE_QUATERNIUS_KNIGHT_NATIVE_V1.json'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frame-and-ancestry-contract:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/mainline-ci.txt
      - run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - run: python -m unittest tests.compiler.test_motion_retarget_frames_v3 -v
      - run: python -m py_compile compiler/realsas_compiler_core/motion_retarget_frames_v3.py tools/demo/render_knight_source_motion_v3.py

  extract-knight-native-source:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install distro Blender for exact FBX extraction
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy
      - name: Extract Knight native takes and full action inventory
        run: |
          blender --background --python tools/motion/blender_extract_motion_source_v2.py -- \
            --source-fbx assets/external/quaternius/knight/KnightCharacter.fbx \
            --spec canonical/MOTION_PRESET_SOURCE_QUATERNIUS_KNIGHT_NATIVE_V1.json \
            --out-dir native-motion-source
      - uses: actions/upload-artifact@v4
        with:
          name: knight-native-motion-source-${{ github.sha }}
          path: native-motion-source
          if-no-files-found: error
          retention-days: 30
