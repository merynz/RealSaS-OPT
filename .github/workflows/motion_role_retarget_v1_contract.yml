name: motion-role-retarget-v1-contract

on:
  push:
    branches:
      - research/tessa-mechanical-mesh-v1-20261004
    paths:
      - compiler/realsas_compiler_core/motion_role_retarget_v1.py
      - tests/compiler/test_motion_role_retarget_v1.py
      - tools/research/run_tessa_knight_role_aware_motion_witness_v1.py
      - .github/workflows/motion_role_retarget_v1_contract.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motion-role-retarget-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: .
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned contract dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_DEFAULT_TIMEOUT: "60"
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt

      - name: Compile role retarget contract and Knight adapter
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            compiler/realsas_compiler_core/motion_role_retarget_v1.py \
            tests/compiler/test_motion_role_retarget_v1.py \
            tools/research/run_tessa_knight_role_aware_motion_witness_v1.py
          echo "MOTION_ROLE_RETARGET_V1_COMPILE_PASS"

      - name: Run role retarget unit court
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/compiler/test_motion_role_retarget_v1.py
          echo "MOTION_ROLE_RETARGET_V1_CONTRACT_PASS"
