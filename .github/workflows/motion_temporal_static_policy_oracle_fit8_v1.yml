name: motion-temporal-static-policy-oracle-fit8-v1
on:
  pull_request:
    branches: [main]
    paths:
      - 'models/iris/truth/motion_temporal_oracle_v1.py'
      - 'compiler/realsas_compiler_core/motion_temporal_static_policy_gate_v1.py'
      - 'tools/truth_foundry/audit_motion_temporal_static_policy_oracle_v1.py'
      - 'tests/truth_foundry/test_motion_temporal_static_policy_oracle_v1.py'
      - '.github/workflows/motion_temporal_static_policy_oracle_fit8_v1.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: motion-temporal-static-policy-oracle-fit8-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  authority-court:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: '1'
      PLATFORM_ROOT: /home/monster/realsas_platform
      CALIBRATION_ROOT: /home/monster/realsas_authority/truth_calibration_preparation/40480940440-1
      CALIBRATION_PREPARATION_SHA256: 060e19bd46766ed65e7a3bfc31ba193210dfb508a93cc2abcb6b1843eb356f42
      CANDIDATE_ROOT: /home/monster/realsas_authority/motion_temporal_response_candidate_v1/40508267119-1
      CANDIDATE_MANIFEST_SHA256: 7fc2be303a92145594f33b47eb7677f6c7dd0d2644b6510da85ba7d4eca9b138
      COURT_ROOT: /home/monster/realsas_authority/motion_temporal_static_policy_oracle_v1/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact temporal and calibration authority bytes
        run: |
          set -euo pipefail
          "$PLATFORM_ROOT/current/bin/realsas-python" - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          calibration=Path(os.environ['CALIBRATION_ROOT'])
          preparation=calibration/'PREPARATION.json'
          observation=calibration/'evidence'/'OBSERVATION.json'
          candidate=Path(os.environ['CANDIDATE_ROOT'])/'TEMPORAL_RESPONSE_CANDIDATE_MANIFEST_V1.json'
          for path, expected, code in (
              (preparation, os.environ['CALIBRATION_PREPARATION_SHA256'], 'CALIBRATION'),
              (candidate, os.environ['CANDIDATE_MANIFEST_SHA256'], 'CANDIDATE'),
          ):
              if not path.is_file():raise SystemExit('MOTION_TEMPORAL_'+code+'_MISSING')
              digest=hashlib.sha256(path.read_bytes()).hexdigest()
              if digest!=expected:raise SystemExit('MOTION_TEMPORAL_'+code+'_HASH_DRIFT')
          obs=json.loads(observation.read_text())
          if obs.get('all_measurements_committed_and_exported') is not True:
              raise SystemExit('MOTION_TEMPORAL_CALIBRATION_NOT_CLOSED')
          if obs.get('training_submitted') is not False or obs.get('truth_qualification_inferred') is not False:
              raise SystemExit('MOTION_TEMPORAL_CALIBRATION_AUTHORITY_DRIFT')
          manifest=json.loads(candidate.read_text())
          if manifest.get('action_count')!=62 or manifest.get('posed_sample_count')!=956:
              raise SystemExit('MOTION_TEMPORAL_CANDIDATE_COUNT_DRIFT')
          for key in ('physical_dof_authority','physical_impulse_authority','secondary_motion_physics_authority','qualification_minted','student_target_allowed','compiler_consequence_allowed','training_allowed'):
              if manifest.get(key) is not False:raise SystemExit('MOTION_TEMPORAL_CANDIDATE_AUTHORITY_LEAK:'+key)
          print('MOTION_TEMPORAL_STATIC_POLICY_INPUTS=PASS')
          PY

      - name: Run temporal evidence and fixed-consumer regressions
        run: |
          set -euo pipefail
          "$PLATFORM_ROOT/current/bin/realsas-python" -m pytest -q \
            tests/truth_foundry/test_motion_temporal_static_policy_oracle_v1.py

      - name: Measure sealed FIT8 temporal relative transport
        run: |
          set -euo pipefail
          mkdir -p "$COURT_ROOT"
          "$PLATFORM_ROOT/current/bin/realsas-python" tools/truth_foundry/audit_motion_temporal_static_policy_oracle_v1.py \
            --calibration-root "$CALIBRATION_ROOT" \
            --candidate-root "$CANDIDATE_ROOT" \
            --output "$COURT_ROOT/MOTION_TEMPORAL_STATIC_POLICY_ORACLE_V1.json"

      - name: Enforce no authority inflation
        run: |
          set -euo pipefail
          "$PLATFORM_ROOT/current/bin/realsas-python" - <<'PY'
          import json,os
          from pathlib import Path
          value=json.loads((Path(os.environ['COURT_ROOT'])/'MOTION_TEMPORAL_STATIC_POLICY_ORACLE_V1.json').read_text())
          if value.get('court_status')!='PASS_MEASURED_TEMPORAL_RELATIVE_TRANSPORT_COVERAGE':raise SystemExit('MOTION_TEMPORAL_ORACLE_NOT_PASSED')
          if value.get('evaluated_surface_condition_pairs',0)<20 or value.get('heldout_confirmed_count',0)<1:raise SystemExit('MOTION_TEMPORAL_ORACLE_COVERAGE_INVALID')
          for key in ('finite_authored_conditions_mint_global_static_authority','dynamic_generation_authorized','qualification_minted','student_target_allowed','training_allowed'):
              if value.get(key) is not False:raise SystemExit('MOTION_TEMPORAL_ORACLE_AUTHORITY_LEAK:'+key)
          print('MOTION_TEMPORAL_STATIC_POLICY_AUTHORITY=PASS_FAIL_CLOSED')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motion-temporal-static-policy-oracle-fit8-v1-${{ github.run_id }}
          path: ${{ env.COURT_ROOT }}/MOTION_TEMPORAL_STATIC_POLICY_ORACLE_V1.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
