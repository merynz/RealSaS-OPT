name: mwb0-typed-seam-v1
# Historical vendor replay; current V2 contracts run in mainline CI.
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  typed-seam:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install current compiler dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile current compiler source
        run: python -m compileall -q compiler/realsas_compiler_core compiler/test_mwb0_contract_v1.py compiler/test_geometric_substrate_naming_v1.py compiler/test_solver_registry_external_authority_v1.py
      - name: Run Compiler typed-seam, nomenclature and solver-authority regressions
        env:
          PYTHONPATH: ${{ github.workspace }}/compiler
        run: python -m unittest -v compiler/test_mwb0_contract_v1.py compiler/test_geometric_substrate_naming_v1.py compiler/test_solver_registry_external_authority_v1.py
