name: mwb1-identity-subset-v1
on:
  pull_request:
    paths:
      - 'compiler/**'
      - 'experiments/mwb1_identity_subset_20260901/**'
      - 'experiments/consumer_interlock_20260829/**'
      - 'canonical/MWB1_IDENTITY_SUBSET_BASELINE_PREREG_20260901.md'
      - 'canonical/MWB1_IDENTITY_SUBSET_BASELINE_PREREG_AMENDMENT_20260901.md'
      - '.github/workflows/mwb1_identity_subset_v1.yml'
permissions:
  contents: read
jobs:
  real-witness-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install current compiler dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile MWB1 source
        run: python -m compileall -q compiler/realsas_compiler_core experiments/mwb1_identity_subset_20260901/run_mwb1_identity_subset_v1.py
      - name: Execute preregistered real-witness MWB1 baseline
        env:
          PYTHONPATH: ${{ github.workspace }}/compiler
        run: python experiments/mwb1_identity_subset_20260901/run_mwb1_identity_subset_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mwb1-identity-subset-result
          path: experiments/mwb1_identity_subset_20260901/MWB1_IDENTITY_SUBSET_BASELINE_RESULT_V1.json
          if-no-files-found: warn
