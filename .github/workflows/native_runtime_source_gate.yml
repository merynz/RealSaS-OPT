name: Native runtime source gate

on:
  push:
    paths:
      - 'runtime/realsas_cpp/**'
      - 'canonical/COMPILER_RUNTIME_PROMOTION_SOURCE_SEAL_V1_20260903.json'
      - 'canonical/COMPILER_RUNTIME_SOURCE_EXTENSION_SEAL_V1_20260917.json'
      - '.github/workflows/native_runtime_source_gate.yml'
  pull_request:
    paths:
      - 'runtime/realsas_cpp/**'
      - 'canonical/COMPILER_RUNTIME_PROMOTION_SOURCE_SEAL_V1_20260903.json'
      - 'canonical/COMPILER_RUNTIME_SOURCE_EXTENSION_SEAL_V1_20260917.json'
      - '.github/workflows/native_runtime_source_gate.yml'

jobs:
  verify-native-runtime:
    runs-on: [self-hosted, linux, x64, realsas]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native E2E Python dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
          PIP_DEFAULT_TIMEOUT: '60'
        run: |
          python -m pip install --no-input --progress-bar off --only-binary=:all: numpy

      - name: Verify native dependencies
        run: |
          cmake --version
          c++ --version
          python --version
          dpkg -s libarchive-dev libpng-dev zlib1g-dev >/dev/null

      - name: Verify historical seal + append-only Runtime-v4 extension bytes
        run: |
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          base_path = Path('canonical/COMPILER_RUNTIME_PROMOTION_SOURCE_SEAL_V1_20260903.json')
          ext_path = Path('canonical/COMPILER_RUNTIME_SOURCE_EXTENSION_SEAL_V1_20260917.json')
          base = json.loads(base_path.read_text(encoding='utf-8'))
          ext = json.loads(ext_path.read_text(encoding='utf-8'))

          def git_blob_sha1(payload: bytes) -> str:
              return subprocess.check_output(
                  ['git', 'hash-object', '--stdin'],
                  input=payload,
                  text=False,
              ).decode('ascii').strip()

          assert ext['schema'] == 'realsas.compiler_runtime_source_extension_seal.v1'
          assert ext['base_seal']['path'] == str(base_path)
          assert git_blob_sha1(base_path.read_bytes()) == ext['base_seal']['git_blob_sha1']
          assert ext['authority']['historical_base_seal_mutated'] is False
          assert ext['authority']['runtime_role'] == 'subordinate_deployment_consumer'

          expected = {
              row['path']: {
                  'size_bytes': int(row['size_bytes']),
                  'sha256': row['sha256'],
                  'git_blob_sha1': row['git_blob_sha1'],
                  'source': 'historical_base',
              }
              for row in base['files']
          }

          for row in ext['replacements']:
              assert row['path'] in expected, row['path']
              expected[row['path']] = {
                  'size_bytes': int(row['size_bytes']),
                  'git_blob_sha1': row['git_blob_sha1'],
                  'source': 'extension_replacement',
              }

          for row in ext['additions']:
              assert row['path'] not in expected, row['path']
              expected[row['path']] = {
                  'size_bytes': int(row['size_bytes']),
                  'git_blob_sha1': row['git_blob_sha1'],
                  'source': 'extension_addition',
              }

          for path_text, identity in expected.items():
              path = Path(path_text)
              payload = path.read_bytes()
              assert len(payload) == identity['size_bytes'], (path, len(payload), identity['size_bytes'])
              actual_blob = git_blob_sha1(payload)
              assert actual_blob == identity['git_blob_sha1'], (path, actual_blob, identity['git_blob_sha1'])
              if identity['source'] == 'historical_base':
                  actual_sha256 = hashlib.sha256(payload).hexdigest()
                  assert actual_sha256 == identity['sha256'], (path, actual_sha256, identity['sha256'])

          print(f"NATIVE_SOURCE_SEAL_PASS files={len(expected)} base={len(base['files'])} extension={len(ext['replacements']) + len(ext['additions'])}")
          PY

      - name: Configure
        run: cmake -S runtime/realsas_cpp -B build/native-runtime -DCMAKE_BUILD_TYPE=Release -DREALSAS_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/native-runtime --parallel 2

      - name: ABI + reference runtime tests
        run: ctest --test-dir build/native-runtime --output-on-failure
