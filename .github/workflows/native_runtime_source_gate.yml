name: Native runtime source gate

on:
  push:
    branches-ignore:
      - playback-stack-v1-20260916
    paths:
      - 'runtime/realsas_cpp/**'
      - 'canonical/COMPILER_RUNTIME_PROMOTION_SOURCE_SEAL_V1_20260903.json'
      - 'canonical/COMPILER_RUNTIME_SOURCE_EXTENSION_SEAL_V*.json'
      - 'tests/repository/test_native_source_seal_lineage.py'
      - 'tools/verify_native_runtime_source_seal_v2.py'
      - '.github/workflows/native_runtime_source_gate.yml'
  pull_request:
    branches-ignore:
      - playback-stack-v1-20260916
    paths:
      - 'runtime/realsas_cpp/**'
      - 'canonical/COMPILER_RUNTIME_PROMOTION_SOURCE_SEAL_V1_20260903.json'
      - 'canonical/COMPILER_RUNTIME_SOURCE_EXTENSION_SEAL_V*.json'
      - 'tests/repository/test_native_source_seal_lineage.py'
      - 'tools/verify_native_runtime_source_seal_v2.py'
      - '.github/workflows/native_runtime_source_gate.yml'

concurrency:
  group: realsas-self-hosted-runtime-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-native-runtime:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements/mainline-ci.txt
            requirements/torch-cpu.txt
      - name: Install native E2E Python dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
          PIP_DEFAULT_TIMEOUT: '60'
        run: |
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt

      - name: Install native build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake g++ libarchive-dev libpng-dev zlib1g-dev

      - name: Verify native dependencies
        run: |
          cmake --version
          c++ --version
          python --version
          dpkg -s libarchive-dev libpng-dev zlib1g-dev >/dev/null

      - name: Verify historical seal + append-only native runtime extension chain
        run: PYTHONPATH=. python tools/verify_native_runtime_source_seal_v2.py

      - name: Historical lineage compatibility and fail-closed regressions
        run: PYTHONPATH=. python -m pytest -q tests/repository/test_native_source_seal_lineage.py

      - name: Configure
        run: cmake -S runtime/realsas_cpp -B build/native-runtime -DCMAKE_BUILD_TYPE=Release -DREALSAS_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/native-runtime --parallel 2

      - name: ABI + reference runtime tests
        run: ctest --test-dir build/native-runtime --output-on-failure
