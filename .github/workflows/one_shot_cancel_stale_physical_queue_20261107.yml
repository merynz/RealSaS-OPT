# One-shot SHA and workflow-bound cleanup; NOT intended for merge.
name: one-shot-stale-physical-queue-cleanup-20261107
on:
  push:
    branches: [ops/stale-physical-queue-cleanup-20261107]
    paths:
      - '.github/workflows/one_shot_cancel_stale_physical_queue_20261107.yml'
permissions:
  contents: read
  actions: write
jobs:
  scoped-cancel:
    if: github.repository == 'merynz/RealSaS-OPT' && github.ref == 'refs/heads/ops/stale-physical-queue-cleanup-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const targets = [
              {
                id: 42345979180,
                sha: '53c38aab5b6a0fed547b96ab84504cb1d5b06c1a',
                branch: 'corpus370-source-relative-contact-v1-review',
                event: 'pull_request',
                path: '.github/workflows/truth_teacher_source.yml'
              },
              {
                id: 42314974910,
                sha: 'd72280a4d33a9c6301ebc868957e714d8a9601fa',
                branch: 'main', event: 'push',
                path: '.github/workflows/v2_witness_orchestration_subject_free_dry_run.yml'
              }
            ];
            let errors = 0;
            for (const t of targets) {
              const {data: run} = await github.rest.actions.getWorkflowRun({
                owner, repo, run_id: t.id
              });
              if (run.head_sha !== t.sha || run.head_branch !== t.branch ||
                  run.event !== t.event || run.path !== t.path) {
                core.error('MISMATCH_REFUSE:' + t.id); errors++; continue;
              }
              if (!['pending', 'queued'].includes(run.status)) {
                core.info('SKIP_NOT_QUEUED:' + t.id + ':' + run.status); continue;
              }
              try {
                await github.rest.actions.cancelWorkflowRun({owner,repo,run_id:t.id});
                core.info('CANCEL_ACCEPTED:' + t.id);
              } catch (err) {
                core.error('CANCEL_FAILED:' + t.id + ':' + err.status); errors++;
              }
            }
            if (errors) core.setFailed('SCOPED_QUEUE_CLEANUP_INCOMPLETE');
