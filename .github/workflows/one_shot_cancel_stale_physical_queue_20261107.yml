# One-shot, exact SHA-bound cleanup of obsolete automatic physical-runner queues.
# DO NOT MERGE: delete this workflow after its one authorized push execution.
name: one-shot-stale-physical-queue-cleanup-20261107
on:
  push:
    branches:
      - ops/stale-physical-queue-cleanup-20261107
    paths:
      - '.github/workflows/one_shot_cancel_stale_physical_queue_20261107.yml'

permissions:
  contents: read
  actions: write

jobs:
  cancel-exact-obsolete-runs:
    if: github.repository == 'merynz/RealSaS-OPT' && github.ref == 'refs/heads/ops/stale-physical-queue-cleanup-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only SHA-pinned queued old deployments and obsolete PR native witness
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const targets = [
              {
                id: 42313723679,
                sha: 'fb2b0caa0571ed0fbeec1a28571529e246264bba',
                branch: 'main', event: 'push',
                path: '.github/workflows/platform_developer_deploy.yml'
              },
              {
                id: 42314974945,
                sha: 'd72280a4d33a9c6301ebc868957e714d8a9601fa',
                branch: 'main', event: 'push',
                path: '.github/workflows/platform_developer_deploy.yml'
              },
              {
                id: 42358642094,
                sha: '988a1a6a9147ca3b469da27c6698647a0bbb7b7e',
                branch: 'corpus370-three-head-semantic-truth-v1-20261107',
                event: 'pull_request',
                path: '.github/workflows/truth_teacher_source.yml'
              },
            ];
            let errors = 0;
            for (const t of targets) {
              const {data: run} = await github.rest.actions.getWorkflowRun({
                owner, repo, run_id: t.id
              });
              if (run.head_sha !== t.sha ||
                  run.head_branch !== t.branch ||
                  run.event !== t.event ||
                  run.path !== t.path) {
                core.error('REFUSE_UNEXPECTED_RUN_IDENTITY:' + t.id);
                errors++;
                continue;
              }
              if (!['queued', 'pending'].includes(run.status)) {
                core.info('SKIP_NON_QUEUED_RUN:' + t.id + ':' + run.status);
                continue;
              }
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner, repo, run_id: t.id
                });
                core.info('CANCEL_REQUEST_ACCEPTED:' + t.id);
              } catch (err) {
                core.error('CANCEL_REQUEST_FAILED:' + t.id + ':' + err.status);
                errors++;
              }
            }
            if (errors) core.setFailed('EXACT_PHYSICAL_QUEUE_CLEANUP_INCOMPLETE');
