name: Operational representation synthesis v0 research reference
on:
  push:
    branches: [research/operational-representation-synthesis-v0]
    paths:
      - 'compiler/realsas_compiler_core/operational_representation_synthesis_v0.py'
      - 'compiler/realsas_compiler_core/operational_puppet_runtime_v0.py'
      - 'tests/corpus/test_operational_representation_synthesis_v0.py'
      - '.github/workflows/operational-representation-synthesis-v0.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-puppet-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU reference and test dependencies
        run: |
          python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'pillow>=10,<13' 'pytest>=8,<10'
      - name: Byte-compile and exercise executable puppet with V2/V3 research regressions
        run: |
          python -m py_compile compiler/realsas_compiler_core/operational_representation_synthesis_v0.py compiler/realsas_compiler_core/operational_puppet_runtime_v0.py
          PYTHONPATH=. python -m pytest -q tests/corpus/test_operational_representation_synthesis_v0.py tests/corpus/test_drawable_capability_decision_v2.py tests/corpus/test_drawable_capability_pose_transport_v3.py
