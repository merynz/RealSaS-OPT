name: Original Cat V3 physical puppet parity reference tests v0
on:
  push:
    branches: [research/original-cat-puppet-physical-parity-v0]
    paths:
      - 'tools/corpus/compile_original_cat_v3_puppet_reference_predictions_v0.py'
      - 'tools/corpus/court_original_cat_v3_puppet_reference_parity_v0.py'
      - 'tests/corpus/test_original_cat_v3_puppet_reference_parity_v0.py'
      - '.github/workflows/original-cat-puppet-parity-reference-v0.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-court-and-reference-compiler-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reference dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'pillow>=10,<13' 'pytest>=8,<10'
      - name: Validate source court and reference compiler without original private bytes
        run: |
          python -m py_compile tools/corpus/compile_original_cat_v3_puppet_reference_predictions_v0.py tools/corpus/court_original_cat_v3_puppet_reference_parity_v0.py
          PYTHONPATH=. python -m pytest -q tests/corpus/test_original_cat_v3_puppet_reference_parity_v0.py tests/corpus/test_operational_representation_synthesis_v0.py
