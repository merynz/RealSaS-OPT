name: p0-directional-binding-closure
on:
  push:
    branches:
      - restoration/compiler-runtime-promotion-v1-20260903-p0-directional-binding
    paths:
      - 'compiler/realsas_compiler_core/directional_binding.py'
      - 'compiler/realsas_compiler_core/__init__.py'
      - 'compiler/realsas_compiler_core/api.py'
      - 'compiler/realsas_compiler_core/proof_engine.py'
      - 'compiler/realsas_compiler_services/proof/directional_motion_evaluator.py'
      - 'compiler/realsas_compiler_services/proof/directional_motion_provider.py'
      - 'compiler/realsas_compiler_services/proof/motion_bake.py'
      - 'compiler/realsas_compiler_services/proof/motion_frame_metrics.py'
      - 'compiler/realsas_compiler_services/proof/__init__.py'
      - 'compiler/realsas_compiler_services/export/current_v4_runtime_v2.py'
      - 'compiler/realsas_compiler_services/export/runtime_v2.py'
      - 'compiler/realsas_compiler_services/export/__init__.py'
      - 'tests/compiler/test_directional_joint_view_binding_v1.py'
      - 'tests/compiler/test_current_v4_runtime_v2_projection_v1.py'
      - 'tests/runtime/current_v4_native_package_probe.cpp'
      - 'experiments/single_family_e2e_v1/run_complete_e2e_v1.py'
      - 'experiments/single_family_e2e_v1/test_complete_e2e_source_v1.py'
      - '.github/workflows/p0_directional_binding_closure.yml'
  workflow_dispatch:

jobs:
  p0-directional-binding-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install gate dependencies
        run: python -m pip install numpy scipy pytest
      - name: Compile P0 sources
        run: |
          python -m py_compile \
            compiler/realsas_compiler_core/directional_binding.py \
            compiler/realsas_compiler_core/proof_engine.py \
            compiler/realsas_compiler_services/proof/directional_motion_evaluator.py \
            compiler/realsas_compiler_services/proof/directional_motion_provider.py \
            compiler/realsas_compiler_services/export/current_v4_runtime_v2.py \
            experiments/single_family_e2e_v1/run_complete_e2e_v1.py
      - name: Run directional binding regression
        run: PYTHONPATH=. python -m pytest -q tests/compiler/test_directional_joint_view_binding_v1.py
      - name: Run proof-bake runtime projection regression
        run: PYTHONPATH=. python -m pytest -q tests/compiler/test_current_v4_runtime_v2_projection_v1.py
      - name: Run complete synthetic E2E with qualified motion provider and native archive
        run: PYTHONPATH=. python -m pytest -q experiments/single_family_e2e_v1/test_complete_e2e_source_v1.py
      - name: Generate deterministic native package gate fixture
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from experiments.single_family_e2e_v1.run_complete_e2e_v1 import run_complete_e2e_v1

          root = Path('/tmp/realsas_p0_native_gate')
          out = run_complete_e2e_v1(root)
          Path('/tmp/realsas_p0_native_gate.json').write_text(json.dumps({
              'archive': out['native_runtime_archive'],
              'source_binding_sha256': out['native_runtime_result']['source_binding_sha256'],
              'proof_bundle_hash': out['proof'].proof_bundle_hash,
          }), encoding='utf-8')
          PY
      - name: Build sealed native runtime consumer
        run: |
          cmake -S runtime/realsas_cpp -B /tmp/realsas_runtime_build \
            -DREALSAS_BUILD_EXAMPLES=OFF \
            -DREALSAS_BUILD_TESTS=ON \
            -DREALSAS_BUILD_SHARED=ON
          cmake --build /tmp/realsas_runtime_build --config Release -j2
          ctest --test-dir /tmp/realsas_runtime_build --output-on-failure
      - name: Compile external current-V4 package probe
        run: |
          c++ -std=c++17 tests/runtime/current_v4_native_package_probe.cpp \
            -Iruntime/realsas_cpp/include \
            -L/tmp/realsas_runtime_build \
            -Wl,-rpath,/tmp/realsas_runtime_build \
            -lrealsas_runtime \
            -o /tmp/realsas_current_v4_package_probe
      - name: Native open sample and software-render exact proof package
        run: |
          python - <<'PY'
          import json, subprocess
          gate = json.load(open('/tmp/realsas_p0_native_gate.json', 'r', encoding='utf-8'))
          subprocess.check_call([
              '/tmp/realsas_current_v4_package_probe',
              gate['archive'],
              gate['source_binding_sha256'],
              gate['proof_bundle_hash'],
          ])
          PY
