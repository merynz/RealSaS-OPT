name: p0-gofmt-fix

on:
  pull_request:
    paths:
      - 'platform/internal/modelrelease/store.go'
      - '.github/workflows/p0_gofmt_fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/operational-spine-p0-20261022
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: gofmt exact hardened model release file
        working-directory: platform
        run: |
          gofmt -w internal/modelrelease/store.go
          test -z "$(gofmt -l .)"
      - name: Push if changed
        run: |
          if git diff --quiet; then
            echo 'P0_GOFMT_ALREADY_CLEAN'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform/internal/modelrelease/store.go
          git commit -m 'style: gofmt hardened model release store'
          git push origin HEAD:review/operational-spine-p0-20261022
