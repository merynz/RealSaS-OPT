name: p0-model-maturity-fix

on:
  pull_request:
    paths:
      - 'platform/internal/modelrelease/store.go'
      - 'platform/internal/operational/status_integration_test.go'
      - '.github/workflows/p0_model_maturity_fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/operational-spine-p0-20261022
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Patch release maturity to be monotonic
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('platform/internal/modelrelease/store.go')
          s=p.read_text()
          anchor='''func targetState(channel Channel) (State, error) {\n'''
          helper='''func maturityRank(state State) (int, error) {\n\tswitch state {\n\tcase StateDraft:\n\t\treturn 0, nil\n\tcase StateResearchQualified:\n\t\treturn 1, nil\n\tcase StateProductCandidate:\n\t\treturn 2, nil\n\tcase StateProduction:\n\t\treturn 3, nil\n\tdefault:\n\t\treturn -1, fmt.Errorf("model release state is not a promotable maturity: %s", state)\n\t}\n}\n\n'''
          if 'func maturityRank(state State)' not in s:
              if anchor not in s:
                  raise SystemExit('targetState anchor missing')
              s=s.replace(anchor, helper+anchor, 1)
          old='''\t\tif State(currentState) == StateRejected || State(currentState) == StateSuperseded {\n\t\t\treturn errors.New("MODEL_RELEASE_NOT_PROMOTABLE")\n\t\t}\n'''
          new='''\t\tcurrentLifecycle := State(currentState)\n\t\tif currentLifecycle == StateRejected || currentLifecycle == StateSuperseded {\n\t\t\treturn errors.New("MODEL_RELEASE_NOT_PROMOTABLE")\n\t\t}\n\t\tcurrentRank, rankErr := maturityRank(currentLifecycle)\n\t\tif rankErr != nil {\n\t\t\treturn rankErr\n\t\t}\n\t\ttargetRank, rankErr := maturityRank(state)\n\t\tif rankErr != nil {\n\t\t\treturn rankErr\n\t\t}\n\t\tnextLifecycle := currentLifecycle\n\t\tif targetRank > currentRank {\n\t\t\tnextLifecycle = state\n\t\t}\n'''
          if old in s:
              s=s.replace(old,new,1)
          elif 'nextLifecycle := currentLifecycle' not in s:
              raise SystemExit('promotion lifecycle seam missing')
          old='''\t\tif _, err := tx.Exec(ctx, "UPDATE model_releases SET lifecycle_state=$2 WHERE id=$1", req.ModelReleaseID, string(state)); err != nil {\n'''
          new='''\t\tif _, err := tx.Exec(ctx, "UPDATE model_releases SET lifecycle_state=$2 WHERE id=$1", req.ModelReleaseID, string(nextLifecycle)); err != nil {\n'''
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('lifecycle update seam missing')
          p.write_text(s)
          PY
          cd platform
          gofmt -w internal/modelrelease/store.go
          go test ./internal/modelrelease ./internal/operational
      - name: Push monotonic maturity fix
        run: |
          if git diff --quiet; then
            echo 'P0_MATURITY_ALREADY_MONOTONIC'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform/internal/modelrelease/store.go
          git commit -m 'platform: keep model release maturity monotonic'
          git push origin HEAD:review/operational-spine-p0-20261022
