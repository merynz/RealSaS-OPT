name: p1-frozen-provenance-transform

on:
  push:
    branches:
      - ops/p1-frozen-provenance-descendant-v1-20261023

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch frozen provenance verification
        run: |
          python - <<'PY'
          from pathlib import Path

          tool = Path('tools/platform_operational_migrate_v1.py')
          text = tool.read_text()
          old = '''def verify_git(repo: Path, descriptor: dict[str, Any]) -> dict[str, str]:
              source = descriptor["source_authority"]
              branch_head = git(repo, "rev-parse", source["legacy_branch"])
              if branch_head != source["legacy_branch_head_sha"]:
                  raise MigrationError("MIGRATION_LEGACY_BRANCH_HEAD_DRIFT")
              blob = git(repo, "rev-parse", f"{branch_head}:{source['execution_binding_path']}")
              if blob != source["execution_binding_git_blob_sha"]:
                  raise MigrationError("MIGRATION_EXECUTION_BINDING_BLOB_DRIFT")
              if git(repo, "cat-file", "-t", source["scientific_execution_source_sha"]) != "commit":
                  raise MigrationError("MIGRATION_EXECUTION_SOURCE_NOT_COMMIT")
              return {"legacy_branch_head_sha": branch_head, "execution_binding_git_blob_sha": blob}
          '''
          import textwrap
          old = textwrap.dedent(old)
          new = textwrap.dedent('''\
          def verify_git(repo: Path, descriptor: dict[str, Any]) -> dict[str, str]:
              source = descriptor["source_authority"]
              frozen_head = source["legacy_branch_head_sha"]
              if git(repo, "cat-file", "-t", frozen_head) != "commit":
                  raise MigrationError("MIGRATION_FROZEN_LEGACY_HEAD_NOT_COMMIT")
              branch_head = git(repo, "rev-parse", source["legacy_branch"])
              merge_base = git(repo, "merge-base", frozen_head, branch_head)
              if merge_base != frozen_head:
                  raise MigrationError("MIGRATION_LEGACY_BRANCH_DIVERGED_FROM_FROZEN_HEAD")
              blob = git(repo, "rev-parse", f"{frozen_head}:{source['execution_binding_path']}")
              if blob != source["execution_binding_git_blob_sha"]:
                  raise MigrationError("MIGRATION_EXECUTION_BINDING_BLOB_DRIFT")
              if git(repo, "cat-file", "-t", source["scientific_execution_source_sha"]) != "commit":
                  raise MigrationError("MIGRATION_EXECUTION_SOURCE_NOT_COMMIT")
              return {
                  "legacy_branch_head_sha": frozen_head,
                  "current_legacy_branch_head_sha": branch_head,
                  "execution_binding_git_blob_sha": blob,
              }
          ''')
          if text.count(old) != 1:
              raise SystemExit('P1_VERIFY_GIT_TRANSFORM_ANCHOR_INVALID')
          tool.write_text(text.replace(old, new, 1))

          workflow = Path('.github/workflows/p1_operational_migration_apply.yml')
          text = workflow.read_text()
          old = '''      - name: Fetch exact current Structural-Evidence authority
                  shell: bash
                  run: |
                    set -euo pipefail
                    git fetch --no-tags origin \\
                      "$LEGACY_BRANCH:refs/heads/$LEGACY_BRANCH"
                    test "$(git rev-parse "$LEGACY_BRANCH")" = "$LEGACY_HEAD"
          '''
          old = textwrap.dedent(old)
          new = '''      - name: Fetch legacy continuation and verify frozen migration source
                  shell: bash
                  run: |
                    set -euo pipefail
                    git fetch --no-tags origin \\
                      "$LEGACY_BRANCH:refs/heads/$LEGACY_BRANCH"
                    CURRENT_LEGACY_HEAD="$(git rev-parse "$LEGACY_BRANCH")"
                    test "$(git cat-file -t "$LEGACY_HEAD")" = "commit"
                    test "$(git merge-base "$LEGACY_HEAD" "$CURRENT_LEGACY_HEAD")" = "$LEGACY_HEAD"
                    echo "P1_FROZEN_SOURCE_ANCESTOR_PASS frozen=$LEGACY_HEAD current=$CURRENT_LEGACY_HEAD"
          '''
          new = textwrap.dedent(new)
          if text.count(old) != 1:
              raise SystemExit('P1_WORKFLOW_TRANSFORM_ANCHOR_INVALID')
          workflow.write_text(text.replace(old, new, 1))

          tests = Path('tests/tools/test_platform_operational_migrate_v1.py')
          text = tests.read_text()
          if 'import subprocess\n' not in text:
              text = text.replace('import importlib.util\n', 'import importlib.util\nimport subprocess\n', 1)
          marker = 'def test_verify_git_accepts_descendant_branch_while_preserving_frozen_source'
          if marker in text:
              raise SystemExit('P1_TESTS_ALREADY_PATCHED')
          text += r'''


def _run_git(repo: Path, *args: str) -> str:
    proc = subprocess.run(
        ["git", "-C", str(repo), *args],
        check=True,
        text=True,
        stdout=subprocess.PIPE,
        stderr=subprocess.PIPE,
    )
    return proc.stdout.strip()


def _commit_file(repo: Path, relative: str, content: str, message: str) -> str:
    path = repo / relative
    path.parent.mkdir(parents=True, exist_ok=True)
    path.write_text(content, encoding="utf-8")
    _run_git(repo, "add", relative)
    _run_git(repo, "commit", "-m", message)
    return _run_git(repo, "rev-parse", "HEAD")


def _init_git_repo(repo: Path) -> None:
    repo.mkdir()
    _run_git(repo, "init")
    _run_git(repo, "config", "user.name", "P1 Test")
    _run_git(repo, "config", "user.email", "p1@example.invalid")


def test_verify_git_accepts_descendant_branch_while_preserving_frozen_source(tmp_path):
    repo = tmp_path / "repo"
    _init_git_repo(repo)
    frozen = _commit_file(repo, "canonical/BINDING.json", '{"sealed":true}\n', "frozen migration source")
    binding_blob = _run_git(repo, "rev-parse", f"{frozen}:canonical/BINDING.json")
    _run_git(repo, "branch", "research/example", frozen)
    _run_git(repo, "checkout", "research/example")
    current = _commit_file(repo, "continuation.txt", "post-migration continuation\n", "continue evaluator only")

    value = descriptor()
    value["source_authority"].update(
        {
            "legacy_branch_head_sha": frozen,
            "execution_binding_git_blob_sha": binding_blob,
            "scientific_execution_source_sha": frozen,
        }
    )
    verified = migration.verify_git(repo, migration.validate_descriptor(value))
    assert verified == {
        "legacy_branch_head_sha": frozen,
        "current_legacy_branch_head_sha": current,
        "execution_binding_git_blob_sha": binding_blob,
    }


def test_verify_git_rejects_branch_divergence_from_frozen_source(tmp_path):
    repo = tmp_path / "repo"
    _init_git_repo(repo)
    root = _commit_file(repo, "root.txt", "root\n", "root")
    frozen = _commit_file(repo, "canonical/BINDING.json", '{"sealed":true}\n', "frozen migration source")
    binding_blob = _run_git(repo, "rev-parse", f"{frozen}:canonical/BINDING.json")
    _run_git(repo, "checkout", "-b", "research/example", root)
    _commit_file(repo, "diverged.txt", "diverged\n", "diverged continuation")

    value = descriptor()
    value["source_authority"].update(
        {
            "legacy_branch_head_sha": frozen,
            "execution_binding_git_blob_sha": binding_blob,
            "scientific_execution_source_sha": frozen,
        }
    )
    with pytest.raises(migration.MigrationError, match="LEGACY_BRANCH_DIVERGED_FROM_FROZEN_HEAD"):
        migration.verify_git(repo, migration.validate_descriptor(value))
'''
          tests.write_text(text)
          PY
      - name: Targeted P1 migration proofs
        run: |
          python -m pip install --no-input --progress-bar off pytest
          python -m pytest -q tests/tools/test_platform_operational_migrate_v1.py
          python tools/platform_operational_migrate_v1.py \
            --descriptor canonical/P1_IRIS_TESSA_OPERATIONAL_MIGRATION_V1.json \
            --repo "$PWD" \
            --out "$RUNNER_TEMP/p1-plan.json"
          python - "$RUNNER_TEMP/p1-plan.json" <<'PY'
          import json, sys
          plan = json.load(open(sys.argv[1]))
          provenance = plan['git_provenance']
          assert provenance['legacy_branch_head_sha'] == '2f6ba5491c54546e1001bd041dc88a0118a95687', provenance
          assert provenance['current_legacy_branch_head_sha'] == 'ff7be648b9dce421936e2ce6662dc09a1e9ab6e3', provenance
          assert provenance['execution_binding_git_blob_sha'] == '05764b7925087e8b9800e5ba5feb04f515422507', provenance
          assert plan['scientific_execution'] == 'FORBIDDEN', plan
          assert plan['promotion'] == 'FORBIDDEN', plan
          assert plan['branch_mutation'] == 'FORBIDDEN', plan
          print('P1_FROZEN_PROVENANCE_DESCENDANT_PASS')
          PY
      - name: Commit source and remove transient workflow
        run: |
          git rm .github/workflows/p1_frozen_provenance_transform.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/platform_operational_migrate_v1.py \
            tests/tools/test_platform_operational_migrate_v1.py \
            .github/workflows/p1_operational_migration_apply.yml
          git commit -m 'P1: separate frozen migration provenance from legacy continuation tip'
          git push origin HEAD:${GITHUB_REF_NAME}
