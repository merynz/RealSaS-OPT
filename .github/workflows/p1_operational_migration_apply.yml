name: p1-operational-migration-apply

on:
  workflow_run:
    workflows: [platform-developer-deployment]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-operational-migration-main
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    env:
      PLATFORM_ROOT: /home/monster/realsas_platform
      DESCRIPTOR: canonical/P1_IRIS_TESSA_OPERATIONAL_MIGRATION_V1.json
      LEGACY_BRANCH: research/structural-evidence-ab-free-run-failclosed-20261022
      LEGACY_HEAD: 2f6ba5491c54546e1001bd041dc88a0118a95687
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve and verify exact deployed main
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            EXPECTED_SHA="${{ github.event.workflow_run.head_sha }}"
          else
            EXPECTED_SHA="$(git rev-parse HEAD)"
          fi
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
          test -x "$PLATFORM_ROOT/current/bin/realsas-python"
          test -f "$PLATFORM_ROOT/deployment.json"
          EXPECTED_SHA="$EXPECTED_SHA" "$PLATFORM_ROOT/current/bin/realsas-python" - <<'PY'
          import json, os
          from pathlib import Path
          marker=json.loads(Path('/home/monster/realsas_platform/deployment.json').read_text())
          expected=os.environ['EXPECTED_SHA']
          # platform_deploy.py seals a successful service switch as SERVICES_ACTIVE.
          assert marker.get('state') == 'SERVICES_ACTIVE', marker
          assert marker.get('code_sha') == expected, (marker.get('code_sha'), expected)
          current=Path('/home/monster/realsas_platform/current')
          assert current.exists()
          print('P1_DEPLOYMENT_IDENTITY_PASS', expected)
          PY

      - name: Fetch exact current Structural-Evidence authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "$LEGACY_BRANCH:refs/heads/$LEGACY_BRANCH"
          test "$(git rev-parse "$LEGACY_BRANCH")" = "$LEGACY_HEAD"

      - name: Prove migration plan before mutation
        shell: bash
        run: |
          set -euo pipefail
          "$PLATFORM_ROOT/current/bin/realsas-python" \
            tools/platform_operational_migrate_v1.py \
            --descriptor "$DESCRIPTOR" \
            --repo "$PWD" \
            --out "$RUNNER_TEMP/p1-plan.json"
          "$PLATFORM_ROOT/current/bin/realsas-python" - "$RUNNER_TEMP/p1-plan.json" <<'PY'
          import json, sys
          plan=json.load(open(sys.argv[1]))
          assert plan['experiment']['action'] == 'ENSURE_RUNNING', plan
          assert plan['experiment']['historical_training_executed'] is True, plan
          assert plan['scientific_execution'] == 'FORBIDDEN', plan
          assert plan['promotion'] == 'FORBIDDEN', plan
          assert plan['branch_mutation'] == 'FORBIDDEN', plan
          assert plan['git_provenance']['legacy_branch_head_sha'] == '2f6ba5491c54546e1001bd041dc88a0118a95687', plan
          assert plan['git_provenance']['execution_binding_git_blob_sha'] == '05764b7925087e8b9800e5ba5feb04f515422507', plan
          print('P1_PREAPPLY_PLAN_PASS')
          PY

      - name: Apply idempotent RUNNING Experiment migration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PLATFORM_ROOT/operational_migrations"
          RECEIPT="$PLATFORM_ROOT/operational_migrations/P1_IRIS_TESSA_OPERATIONAL_MIGRATION_V1.json"
          "$PLATFORM_ROOT/current/bin/realsas-python" \
            tools/platform_operational_migrate_v1.py \
            --descriptor "$DESCRIPTOR" \
            --repo "$PWD" \
            --api http://127.0.0.1:8080 \
            --apply \
            --out "$RECEIPT"
          cp "$RECEIPT" "$RUNNER_TEMP/P1_IRIS_TESSA_OPERATIONAL_MIGRATION_V1.json"

      - name: Verify operational truth and no invented authority
        shell: bash
        run: |
          set -euo pipefail
          RECEIPT="$PLATFORM_ROOT/operational_migrations/P1_IRIS_TESSA_OPERATIONAL_MIGRATION_V1.json"
          "$PLATFORM_ROOT/current/bin/realsas-python" - "$RECEIPT" <<'PY'
          import json, sys, urllib.request
          receipt=json.load(open(sys.argv[1]))
          assert receipt['mode'] == 'APPLY', receipt
          assert receipt['promotion_performed'] is False, receipt
          assert receipt['scientific_execution_performed'] is False, receipt
          assert receipt['historical_training_executed_at_migration'] is True, receipt
          assert receipt['model_releases'] == [], receipt
          assert receipt['blocked_models'] == [{
              'family':'IRIS',
              'checkpoint_sha256':'0be15df5614a05343cf3850aff747ba4d31f00a322f058819cb5a54d5a5d2fc5',
              'reason':'BLOCKED_IDENTITY_RESOLUTION',
          }], receipt
          status=json.load(urllib.request.urlopen('http://127.0.0.1:8080/v1/ops/status', timeout=10))
          matches=[x for x in status['active_experiments'] if x['slug']=='structural-evidence-a-b-v2']
          assert len(matches)==1, matches
          exp=matches[0]
          assert exp['lifecycle_state']=='RUNNING', exp
          md=exp['metadata']
          assert md['scientific_training_executed_at_migration'] is True, md
          assert md['training_execution_state']=='COMPLETED_FROZEN_ARM_CHECKPOINTS', md
          assert md['training_execution_source_sha']=='eb11004e4d8c7fba6f6ba95fa8eacaa0c24fcb3d', md
          assert md['scientific_free_running_result_observed_at_migration'] is False, md
          assert md['scientific_causal_result_observed_at_migration'] is False, md
          assert md['canonical_m_authorized'] is False, md
          assert md['product_promotion_authorized'] is False, md
          print('P1_OPERATIONAL_RUNNING_STATE_LIVE_PASS', exp['id'])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-operational-migration-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/P1_IRIS_TESSA_OPERATIONAL_MIGRATION_V1.json
          if-no-files-found: warn
          retention-days: 30
