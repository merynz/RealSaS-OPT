name: p1-operational-migration-v1

on:
  pull_request:
    paths:
      - 'canonical/P1_IRIS_TESSA_OPERATIONAL_MIGRATION_V1.json'
      - 'tools/platform_operational_migrate_v1.py'
      - 'tests/tools/test_platform_operational_migrate_v1.py'
      - '.github/workflows/p1_operational_migration_v1.yml'
      - '.github/workflows/p1_operational_migration_apply.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-operational-migration-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependency
        run: python -m pip install --no-input --progress-bar off pytest==8.4.1
      - name: Fetch exact current legacy research authority
        run: |
          git fetch --no-tags origin \
            research/structural-evidence-ab-free-run-failclosed-20261022:refs/heads/research/structural-evidence-ab-free-run-failclosed-20261022
          test "$(git rev-parse research/structural-evidence-ab-free-run-failclosed-20261022)" = \
            "2f6ba5491c54546e1001bd041dc88a0118a95687"
      - name: Validate source, descriptor, policy and importer contracts
        run: |
          python -m py_compile tools/platform_operational_migrate_v1.py
          python -m json.tool canonical/P1_IRIS_TESSA_OPERATIONAL_MIGRATION_V1.json >/dev/null
          python -m pytest -q \
            tests/tools/test_platform_operational_migrate_v1.py \
            tests/repository/test_platform_deployment.py \
            tests/repository/test_self_hosted_execution_policy.py
      - name: Prove dry-run against immutable current Git authority
        run: |
          python tools/platform_operational_migrate_v1.py \
            --descriptor canonical/P1_IRIS_TESSA_OPERATIONAL_MIGRATION_V1.json \
            --repo . \
            --out /tmp/p1-plan.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/p1-plan.json'))
          assert p['mode']=='DRY_RUN'
          assert p['experiment']=={
              'slug':'structural-evidence-a-b-v2',
              'action':'ENSURE_RUNNING',
              'historical_training_executed':True,
          }
          assert p['models']==[{
              'family':'IRIS',
              'checkpoint_sha256':'0be15df5614a05343cf3850aff747ba4d31f00a322f058819cb5a54d5a5d2fc5',
              'action':'BLOCKED_IDENTITY_RESOLUTION',
          }]
          assert p['promotion']=='FORBIDDEN'
          assert p['scientific_execution']=='FORBIDDEN'
          assert p['branch_mutation']=='FORBIDDEN'
          assert p['git_provenance']['legacy_branch_head_sha']=='2f6ba5491c54546e1001bd041dc88a0118a95687'
          assert p['git_provenance']['execution_binding_git_blob_sha']=='05764b7925087e8b9800e5ba5feb04f515422507'
          print('P1_OPERATIONAL_MIGRATION_CURRENT_RUNNING_DRY_RUN_PASS')
          PY
