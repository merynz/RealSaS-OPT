name: p3-gofmt-probe

on:
  push:
    branches:
      - product/inference-model-binding-v1-20261022

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Show gofmt drift
        working-directory: platform
        run: |
          files="$(gofmt -l .)"
          printf '%s\n' "$files"
          test -z "$files"
