name: p3-model-materialization-transform

on:
  push:
    branches:
      - product/inference-model-materialization-v1-20261023

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: platform/go.mod
      - name: Bind immutable Attempt model snapshot into compile resolver
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('platform/internal/control/activities.go')
          text = path.read_text()
          old = '''\texternalInputs, err := externalstage.ResolverInputs(ctx, a.Pool, attemptID)
          \tif err != nil {
          \t\treturn orchestration.ResolvedCompilePlan{}, err
          \t}
          \tplan, err := resolver.ResolveWithExternal(
          \t\tctx,
          \t\ta.Graph,
          \t\tregistry.QualifiedCatalog{Pool: a.Pool, AllowDemo: mode == "RESEARCH"},
          \t\tin.TargetStageID,
          \t\tloaded.RootInputs,
          \t\tversions,
          \t\texternalInputs,
          \t)
          '''
          new = '''\texternalInputs, err := externalstage.ResolverInputs(ctx, a.Pool, attemptID)
          \tif err != nil {
          \t\treturn orchestration.ResolvedCompilePlan{}, err
          \t}
          \tmodelInputs, err := modelselection.ResolverInputs(ctx, a.Pool, attemptID)
          \tif err != nil {
          \t\treturn orchestration.ResolvedCompilePlan{}, err
          \t}
          \tplan, err := resolver.ResolveWithExternalAndModels(
          \t\tctx,
          \t\ta.Graph,
          \t\tregistry.QualifiedCatalog{Pool: a.Pool, AllowDemo: mode == "RESEARCH"},
          \t\tin.TargetStageID,
          \t\tloaded.RootInputs,
          \t\tversions,
          \t\texternalInputs,
          \t\tmodelInputs,
          \t)
          '''
          if old not in text:
              raise SystemExit('P3_MODEL_RESOLVER_TRANSFORM_ANCHOR_MISSING')
          if text.count(old) != 1:
              raise SystemExit('P3_MODEL_RESOLVER_TRANSFORM_ANCHOR_AMBIGUOUS')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format and targeted Go contracts
        working-directory: platform
        run: |
          gofmt -w internal/control/activities.go internal/modelselection/resolver.go internal/modelselection/resolver_test.go internal/resolver/compile.go internal/resolver/model_snapshot_test.go
          go test ./internal/modelselection ./internal/resolver ./internal/control
      - name: Commit transformed source
        run: |
          if git diff --quiet; then
            echo 'No transform diff to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform/internal/control/activities.go platform/internal/modelselection/resolver.go platform/internal/modelselection/resolver_test.go platform/internal/resolver/compile.go platform/internal/resolver/model_snapshot_test.go
          git commit -m 'P3: bind model snapshot into compile resolver'
          git push origin HEAD:${GITHUB_REF_NAME}
