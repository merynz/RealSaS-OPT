name: p3-model-ref-injection-transform

on:
  push:
    branches:
      - product/inference-model-binding-v1-20261022

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/inference-model-binding-v1-20261022
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: platform/go.sum
      - name: Inject immutable Attempt model snapshot into EngineStageRequest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('platform/internal/control/activities.go')
          s = p.read_text()
          import_anchor = '\t"github.com/merynz/RealSaS-OPT/platform/internal/input"\n'
          import_line = '\t"github.com/merynz/RealSaS-OPT/platform/internal/modelselection"\n'
          if import_line not in s:
              if import_anchor not in s:
                  raise SystemExit('modelselection import anchor missing')
              s = s.replace(import_anchor, import_anchor + import_line, 1)
          source_block = '''\tsources, err := a.boundSourceInputs(ctx, executionID)\n\tif err != nil {\n\t\treturn orchestration.EngineStageRequest{}, err\n\t}\n'''
          model_block = source_block + '''\tmodels, err := modelselection.LoadAttempt(ctx, a.Pool, attemptID)\n\tif err != nil {\n\t\treturn orchestration.EngineStageRequest{}, err\n\t}\n'''
          if 'models, err := modelselection.LoadAttempt' not in s:
              if source_block not in s:
                  raise SystemExit('source input block anchor missing')
              s = s.replace(source_block, model_block, 1)
          field_anchor = '\t\tSourceInputs:       sources,\n'
          field_line = '\t\tModelReleases:      modelselection.EngineRefs(models),\n'
          if field_line not in s:
              if field_anchor not in s:
                  raise SystemExit('EngineStageRequest field anchor missing')
              s = s.replace(field_anchor, field_anchor + field_line, 1)
          p.write_text(s)
          PY
          cd platform
          gofmt -w internal/control/activities.go internal/release/model_requirements_test.go
          test -z "$(gofmt -l .)"
          go test ./internal/release -run 'Test(LegacyManifestOmitsModelRequirements|ProductModelRequirementsAreDeterministicAndProductionOnly|DuplicateModelRequirementFamilyFailsClosed)$'
          go test ./internal/control -run '^$'
      - name: Commit transform
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform/internal/control/activities.go platform/internal/release/model_requirements_test.go
          if git diff --cached --quiet; then
            echo 'No transform diff.'
            exit 0
          fi
          git commit -m 'P3: inject exact Attempt model snapshot into engine requests'
          git push origin HEAD:product/inference-model-binding-v1-20261022
