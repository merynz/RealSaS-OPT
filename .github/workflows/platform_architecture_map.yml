name: canonical-architecture-map

on:
  push:
    branches: [main]
  pull_request:
    # Full court runs on opening/ready state, not every intermediate commit.
    types: [opened, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-architecture-map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  map:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: platform/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded operator-test dependencies
        run: python -m pip install --no-input --progress-bar off pytest==8.4.1
      - name: Map and failed-run handoff contracts
        run: python -m pytest -q tests/repository/test_architecture_map.py tests/repository/test_live_architecture.py tests/repository/test_platform_oracle_handoff.py tests/compiler/test_platform_snapshot_closure_v1.py
      - name: Audit active product graph, legacy imports and workflow triggers
        run: |
          python -m pytest -q tests/repository/test_repository_clarity_audit_v1.py
          mkdir -p architecture-view
          python tools/repository_clarity_audit_v1.py --json > architecture-view/repository-clarity.json
          python - <<'PY'
          import json
          x = json.load(open("architecture-view/repository-clarity.json"))
          print("active_product_roles=", sorted(x["active_catalog_roles"]))
          print("workflows=", x["workflows"]["yaml_count"])
          print("legacy_model_direct_importers=", len(x["legacy_model_static_imports_from_product_readers"]))
          print("other_auto_workflows=", len(x["workflows"]["other_automatic"]))
          PY
      - name: Generate compatibility StageGraph view without model execution
        run: |
          mkdir -p architecture-view
          python tools/realsas_architecture.py --json-out architecture-view/architecture.json map --html-out architecture-view/architecture.html
          python - <<'PY'
          import json
          p=json.load(open('architecture-view/architecture.json'))
          print('source=',p['source']['head_sha'])
          print('fingerprint=',p['source']['source_fingerprint_sha256'])
          print('stages=',len(p['nodes']),'edges=',len(p['edges']))
          print('ownership_debt=',p['audit']['ownership_debt_count'])
          print('dynamic_import_sites=',p['audit']['dynamic_import_site_count'])
          PY
      - name: Capture text-only source paths for safe layout migration
        run: |
          python - <<'PY'
          import pathlib, subprocess, tarfile
          roots = ("models/", "compiler/", "runtime/", "tools/", "tests/", "platform/", ".github/workflows/")
          suffixes = {".py", ".go", ".js", ".ts", ".c", ".cpp", ".h", ".hpp", ".json", ".md", ".yml", ".yaml", ".sh", ".sql", ".toml", ".txt"}
          src = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\x00")
          output = pathlib.Path("architecture-view/repo-layout-source.tar.gz")
          with tarfile.open(output, "w:gz") as tar:
              for item in src:
                  if not item: continue
                  path = pathlib.Path(item.decode())
                  if not path.as_posix().startswith(roots): continue
                  if path.suffix.lower() not in suffixes: continue
                  if not path.is_file() or path.stat().st_size > 300_000: continue
                  tar.add(path, arcname=str(path), recursive=False)
          print("source_snapshot_bytes=", output.stat().st_size)
          PY
      - name: Preserve commit-bound architecture view
        uses: actions/upload-artifact@v4
        with:
          name: canonical-architecture-${{ github.sha }}
          path: architecture-view/
          if-no-files-found: error
          retention-days: 14
