name: platform-backend-contract-v1

on:
  push:
    branches: [platform/professional-backend-v1-20261001]
    paths:
      - 'backend/**'
      - 'tests/platform/**'
      - 'requirements/platform.txt'
      - 'alembic.ini'
      - 'canonical/MAINLINE_EXECUTION_PLAN_V2.json'
      - 'docs/platform/**'
      - '.github/workflows/platform_backend_contract_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: realsas
          POSTGRES_PASSWORD: realsas
          POSTGRES_DB: realsas_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U realsas -d realsas_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
      REALSAS_PLATFORM_DATABASE_URL: postgresql+psycopg://realsas:realsas@127.0.0.1:5432/realsas_platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install platform dependencies
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt -r requirements/platform.txt
      - name: Compile platform package
        run: python -m compileall -q backend tests/platform
      - name: Upgrade empty PostgreSQL schema
        run: alembic -c alembic.ini upgrade head
      - name: Verify migration/model parity
        run: alembic -c alembic.ini check
      - name: Platform contract and PostgreSQL integration tests
        run: python -m pytest -q tests/platform
      - name: Prove baseline migration is reversible
        run: |
          alembic -c alembic.ini downgrade base
          alembic -c alembic.ini upgrade head
          alembic -c alembic.ini check
