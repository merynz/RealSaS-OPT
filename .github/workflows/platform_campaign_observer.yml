name: platform-campaign-observer

on:
  pull_request:
    paths:
      - canonical/CAMPAIGN_STATUS_REQUEST_V1.json
      - .github/workflows/platform_campaign_observer.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-campaign-observer
  cancel-in-progress: true

jobs:
  observe:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 10
    env:
      PLATFORM_ROOT: /home/monster/realsas_platform
      REQUEST_PATH: canonical/CAMPAIGN_STATUS_REQUEST_V1.json
      OUTPUT_PATH: /home/monster/realsas_authority/campaign_observer/${{ github.run_id }}/CAMPAIGN_STATUS.json
    steps:
      - uses: actions/checkout@v4

      - name: Read campaign and attempts without mutation
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$OUTPUT_PATH")"
          "$PLATFORM_ROOT/current/bin/realsas-python" - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          req = json.loads(Path(os.environ['REQUEST_PATH']).read_text(encoding='utf-8'))
          assert req.get('schema') == 'RealSaS.CampaignStatusRequest.v1', 'CAMPAIGN_OBSERVER_REQUEST_SCHEMA'
          campaign_id = str(req.get('campaign_id') or '').strip()
          expected_sha = str(req.get('expected_canonical_code_sha') or '').strip()
          assert campaign_id, 'CAMPAIGN_OBSERVER_ID_REQUIRED'
          assert len(expected_sha) == 40, 'CAMPAIGN_OBSERVER_CODE_SHA_REQUIRED'

          deployment = json.loads(Path('/home/monster/realsas_platform/deployment.json').read_text(encoding='utf-8'))
          assert deployment.get('code_sha') == expected_sha, 'CAMPAIGN_OBSERVER_DEPLOYED_CODE_DRIFT'

          def get(path):
              with urllib.request.urlopen('http://127.0.0.1:8080' + path, timeout=30) as r:
                  return json.loads(r.read())

          campaign = get('/v1/research/campaigns/' + campaign_id)
          assert campaign.get('canonical_code_sha') == expected_sha, 'CAMPAIGN_OBSERVER_CAMPAIGN_CODE_DRIFT'
          attempts = []
          if bool(req.get('include_attempts')):
              for member in campaign.get('members') or []:
                  attempt_id = str(member.get('attempt_id') or '').strip()
                  assert attempt_id, 'CAMPAIGN_OBSERVER_ATTEMPT_ID_REQUIRED'
                  attempts.append({
                      'member': member,
                      'attempt': get('/v1/attempts/' + attempt_id),
                  })

          out = {
              'schema': 'RealSaS.CampaignStatusObservation.v1',
              'read_only': True,
              'request': req,
              'deployment_code_sha': deployment.get('code_sha'),
              'campaign': campaign,
              'attempts': attempts,
          }
          path = Path(os.environ['OUTPUT_PATH'])
          path.write_text(json.dumps(out, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(out, sort_keys=True))
          PY

      - name: Preserve campaign status observation
        uses: actions/upload-artifact@v4
        with:
          name: platform-campaign-observer-${{ github.run_id }}
          path: ${{ env.OUTPUT_PATH }}
          if-no-files-found: error
          retention-days: 7
