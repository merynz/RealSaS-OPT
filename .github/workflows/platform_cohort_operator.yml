name: platform-cohort-operator

on:
  workflow_dispatch:
    inputs:
      descriptor:
        description: Repo-relative sealed cohort bootstrap descriptor
        required: true
        type: string
        default: canonical/FIT8_PLATFORM_BOOTSTRAP_V1.json
      submit:
        description: Submit campaign execution after fail-closed preparation
        required: true
        type: boolean
        default: false
  workflow_run:
    workflows: [platform-developer-deployment, current-mainline-ci]
    types: [completed]

concurrency:
  group: platform-cohort-operator
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  activation:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      descriptor: ${{ steps.resolve.outputs.descriptor }}
      submit: ${{ steps.resolve.outputs.submit }}
      expected_sha: ${{ steps.resolve.outputs.expected_sha }}
    steps:
      - name: Resolve selected canonical SHA
        id: sha
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'workflow_run' ]; then
            echo "expected_sha=$WORKFLOW_RUN_HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "expected_sha=$DISPATCH_SHA" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.expected_sha }}
          fetch-depth: 2

      - name: Resolve generic operator request
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SHA: ${{ steps.sha.outputs.expected_sha }}
          DISPATCH_DESCRIPTOR: ${{ inputs.descriptor }}
          DISPATCH_SUBMIT: ${{ inputs.submit }}
          WORKFLOW_RUN_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import subprocess
          from pathlib import Path

          event = os.environ['EVENT_NAME']
          expected_sha = os.environ['EXPECTED_SHA'].strip()
          should_run = False
          descriptor = ''
          submit = False

          if event == 'workflow_dispatch':
              should_run = True
              descriptor = os.environ.get('DISPATCH_DESCRIPTOR', '').strip()
              submit = os.environ.get('DISPATCH_SUBMIT', '').strip().lower() == 'true'
          elif event == 'workflow_run':
              if (os.environ.get('WORKFLOW_RUN_NAME') == 'platform-developer-deployment' and
                      os.environ.get('WORKFLOW_RUN_CONCLUSION') == 'success' and
                      os.environ.get('WORKFLOW_RUN_HEAD_BRANCH') == 'main'):
                  changed = subprocess.check_output(
                      ['git', 'diff-tree', '--no-commit-id', '--name-only', '-r', 'HEAD^1', 'HEAD'],
                      text=True,
                  ).splitlines()
                  trigger_path = 'canonical/COHORT_OPERATOR_TRIGGER_V1.json'
                  if trigger_path in changed:
                      trigger = json.loads(Path(trigger_path).read_text(encoding='utf-8'))
                      assert trigger.get('schema') == 'RealSaS.CohortOperatorTrigger.v1', 'COHORT_OPERATOR_TRIGGER_SCHEMA'
                      assert isinstance(trigger.get('enabled'), bool), 'COHORT_OPERATOR_TRIGGER_ENABLED_BOOL'
                      assert isinstance(trigger.get('submit'), bool), 'COHORT_OPERATOR_TRIGGER_SUBMIT_BOOL'
                      descriptor = str(trigger.get('descriptor') or '').strip()
                      assert descriptor, 'COHORT_OPERATOR_TRIGGER_DESCRIPTOR_REQUIRED'
                      submit = bool(trigger['submit'])
                      should_run = bool(trigger['enabled'])

          print(f"should_run={'true' if should_run else 'false'}")
          print(f'descriptor={descriptor}')
          print(f"submit={'true' if submit else 'false'}")
          print(f'expected_sha={expected_sha}')
          PY

  cohort-operator:
    needs: activation
    if: needs.activation.outputs.should_run == 'true'
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 45
    env:
      PLATFORM_ROOT: /home/monster/realsas_platform
      AUTHORITY_ROOT: /home/monster/realsas_authority
      DESCRIPTOR: ${{ needs.activation.outputs.descriptor }}
      SUBMIT: ${{ needs.activation.outputs.submit }}
      EXPECTED_SHA: ${{ needs.activation.outputs.expected_sha }}
      RCLONE_REMOTE: ${{ vars.REALSAS_RCLONE_DRIVE_REMOTE || 'gdrive' }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}

      - name: Require exact deployed canonical main
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
          "$PLATFORM_ROOT/current/bin/realsas-python" - <<'PY'
          import json, os
          from pathlib import Path

          deployment = json.loads(Path('/home/monster/realsas_platform/deployment.json').read_text())
          assert deployment['code_sha'] == os.environ['EXPECTED_SHA'], 'DEPLOYED_MAIN_DRIFT'
          PY

      - name: Validate generic descriptor selection
        id: descriptor
        run: |
          set -euo pipefail
          "$PLATFORM_ROOT/current/bin/realsas-python" - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          import os
          from pathlib import Path

          repo = Path.cwd().resolve()
          raw = os.environ['DESCRIPTOR'].strip()
          descriptor = Path(raw)
          assert raw, 'COHORT_OPERATOR_DESCRIPTOR_REQUIRED'
          assert not descriptor.is_absolute(), 'COHORT_OPERATOR_DESCRIPTOR_MUST_BE_REPO_RELATIVE'
          assert '..' not in descriptor.parts, 'COHORT_OPERATOR_DESCRIPTOR_PATH_ESCAPE'
          resolved = (repo / descriptor).resolve()
          resolved.relative_to(repo)
          assert resolved.is_file(), 'COHORT_OPERATOR_DESCRIPTOR_MISSING'
          assert resolved.suffix == '.json', 'COHORT_OPERATOR_DESCRIPTOR_JSON_REQUIRED'
          digest = hashlib.sha256(resolved.read_bytes()).hexdigest()
          print(f'descriptor_sha256={digest}')
          print(f'output_path=/home/monster/realsas_authority/campaign_bootstrap/actions/{digest}/{os.environ["GITHUB_RUN_ID"]}/BOOTSTRAP_RESULT.json')
          PY

      - name: Require cohort storage access
        run: |
          set -euo pipefail
          test -n "$RCLONE_REMOTE"
          rclone listremotes | grep -Fx "${RCLONE_REMOTE}:"

      - name: Execute generic cohort bootstrap
        env:
          OUTPUT_PATH: ${{ steps.descriptor.outputs.output_path }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$OUTPUT_PATH")"
          args=(
            tools/platform_cohort_bootstrap_v1.py
            --descriptor "$DESCRIPTOR"
            --repo "$GITHUB_WORKSPACE"
            --platform-root "$PLATFORM_ROOT"
            --authority-root "$AUTHORITY_ROOT"
            --rclone-remote "$RCLONE_REMOTE"
            --out "$OUTPUT_PATH"
          )
          if [ "$SUBMIT" != 'true' ]; then
            args+=(--no-submit)
          fi
          "$PLATFORM_ROOT/current/bin/realsas-python" "${args[@]}"

      - name: Verify operator receipt
        env:
          OUTPUT_PATH: ${{ steps.descriptor.outputs.output_path }}
          DESCRIPTOR_SHA256: ${{ steps.descriptor.outputs.descriptor_sha256 }}
        run: |
          set -euo pipefail
          "$PLATFORM_ROOT/current/bin/realsas-python" - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['OUTPUT_PATH'])
          assert path.is_file(), 'COHORT_OPERATOR_RECEIPT_MISSING'
          receipt = json.loads(path.read_text())
          assert receipt['schema'] == 'RealSaS.PlatformCohortBootstrapPreflight.v1', 'COHORT_OPERATOR_RECEIPT_SCHEMA'
          assert receipt['qualification_minted'] is False, 'COHORT_OPERATOR_RAW_BOOTSTRAP_MINTED_QUALIFICATION'
          assert receipt['all_observation_bindings_verified'] is True, 'COHORT_OPERATOR_OBSERVATION_BINDING_UNVERIFIED'
          if os.environ['SUBMIT'] == 'true':
              assert 'campaign_run' in receipt, 'COHORT_OPERATOR_SUBMIT_RECEIPT_MISSING'
          else:
              assert 'campaign_run' not in receipt, 'COHORT_OPERATOR_PREFLIGHT_SUBMITTED_EXECUTION'
          PY

      - name: Preserve exact cohort operator receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-cohort-operator-${{ github.run_id }}
          path: ${{ steps.descriptor.outputs.output_path }}
          if-no-files-found: error
          retention-days: 30

  research-activation:
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'current-mainline-ci'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      request: ${{ steps.resolve.outputs.request }}
      target_sha: ${{ steps.resolve.outputs.target_sha }}
      main_sha: ${{ steps.resolve.outputs.main_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Resolve typed research operation request
        id: resolve
        env:
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUEST_PATH: canonical/V9_PRETRAINING_ARTIFACT_REQUEST_V1.json
          TRIGGER_PATH: canonical/RESEARCH_OPERATOR_TRIGGER_V1.json
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, subprocess
          from pathlib import Path

          should = False
          request_path = os.environ['REQUEST_PATH']
          target_sha = ''
          main_sha = os.environ.get('WORKFLOW_RUN_HEAD_SHA', '').strip().lower()

          if os.environ.get('WORKFLOW_RUN_CONCLUSION') == 'success' and os.environ.get('WORKFLOW_RUN_HEAD_BRANCH') == 'main':
              changed = subprocess.check_output(
                  ['git', 'diff-tree', '--no-commit-id', '--name-only', '-r', 'HEAD^1', 'HEAD'],
                  text=True,
              ).splitlines()
              if request_path in changed:
                  trigger_path = Path(os.environ['TRIGGER_PATH'])
                  trigger = json.loads(trigger_path.read_text(encoding='utf-8'))
                  assert trigger.get('schema') == 'RealSaS.ResearchOperatorTrigger.v1', 'RESEARCH_OPERATOR_TRIGGER_SCHEMA'
                  assert trigger.get('enabled') is True, 'RESEARCH_OPERATOR_TRIGGER_NOT_ENABLED'
                  assert trigger.get('request') == request_path, 'RESEARCH_OPERATOR_TRIGGER_REQUEST_DRIFT'
                  assert trigger.get('operation') == 'IRIS_VNEXT_V9_PRETRAINING_ARTIFACT_BUILD', 'RESEARCH_OPERATOR_OPERATION_NOT_ALLOWLISTED'
                  assert trigger.get('training_allowed') is False, 'RESEARCH_OPERATOR_TRAINING_FORBIDDEN'

                  request = Path(request_path)
                  value = json.loads(request.read_text(encoding='utf-8'))
                  assert value.get('schema') == 'RealSaS.IRISVNextV9PretrainingArtifactRequest.v1', 'RESEARCH_OPERATOR_REQUEST_SCHEMA_INVALID'
                  assert value.get('operation') == trigger['operation'], 'RESEARCH_OPERATOR_REQUEST_OPERATION_DRIFT'
                  assert value.get('target_branch') == 'research/iris-vnext-post-v8-quality-plan-20261018', 'RESEARCH_OPERATOR_TARGET_BRANCH_DRIFT'
                  target_sha = str(value.get('target_source_sha') or '').lower()
                  assert re.fullmatch(r'[0-9a-f]{40}', target_sha), 'RESEARCH_OPERATOR_TARGET_SHA_INVALID'
                  assert value.get('training_allowed') is False, 'RESEARCH_OPERATOR_REQUEST_TRAINING_FORBIDDEN'
                  assert value.get('external_storage_write_allowed') is False, 'RESEARCH_OPERATOR_EXTERNAL_WRITE_FORBIDDEN'

                  remote_target = subprocess.check_output(
                      ['git', 'ls-remote', 'origin', 'refs/heads/research/iris-vnext-post-v8-quality-plan-20261018'],
                      text=True,
                  ).strip().split('\t', 1)[0].lower()
                  assert remote_target == target_sha, 'RESEARCH_OPERATOR_TARGET_BRANCH_SHA_DRIFT'
                  should = True

          print(f"should_run={'true' if should else 'false'}")
          print(f'request={request_path if should else ""}')
          print(f'target_sha={target_sha}')
          print(f'main_sha={main_sha}')
          PY

  v9-pretraining-artifact:
    needs: research-activation
    if: needs.research-activation.outputs.should_run == 'true'
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 180
    env:
      AUTHORITY_ROOT: /home/monster/realsas_authority
      REQUEST: ${{ needs.research-activation.outputs.request }}
      TARGET_SHA: ${{ needs.research-activation.outputs.target_sha }}
      EXPECTED_MAIN_SHA: ${{ needs.research-activation.outputs.main_sha }}
      OUTPUT_ROOT: /home/monster/realsas_authority/research_operator/actions/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN_SHA }}
          fetch-depth: 2

      - name: Require exact canonical main source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install reviewed preparation dependencies
        run: |
          set -euo pipefail
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
          python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt
          python -m py_compile tools/iris_vnext/v9_pretraining_artifact_operator_v1.py
          command -v rclone >/dev/null
          test -x "$HOME/.cache/realsas/blender/blender-4.5.14-linux-x64/blender"

      - name: Build exact V9 pretraining candidate locally
        run: |
          set -euo pipefail
          rm -rf "$OUTPUT_ROOT"
          mkdir -p "$OUTPUT_ROOT"
          python tools/iris_vnext/v9_pretraining_artifact_operator_v1.py \
            --request "$REQUEST" \
            --repo "$GITHUB_WORKSPACE" \
            --authority-root "$AUTHORITY_ROOT" \
            --out-dir "$OUTPUT_ROOT"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['OUTPUT_ROOT'])
          result=json.loads((root/'OPERATOR_RESULT.json').read_text())
          assert result['status']=='LOCAL_CANDIDATE_ARTIFACT_READY__DRIVE_PERSISTENCE_PENDING'
          assert result['target_source_sha']==os.environ['TARGET_SHA']
          assert result['external_storage_written'] is False
          assert result['remote_roundtrip_verified'] is False
          assert result['training_steps_executed']==0
          assert result['scientific_fit_started'] is False
          assert result['training_authorized'] is False
          PY

      - name: Preserve local candidate for connector persistence
        uses: actions/upload-artifact@v4
        with:
          name: iris-vnext-v9-local-candidate-${{ github.run_id }}
          path: |
            ${{ env.OUTPUT_ROOT }}/OPERATOR_RESULT.json
            ${{ env.OUTPUT_ROOT }}/evidence/**
            ${{ env.OUTPUT_ROOT }}/candidate/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
