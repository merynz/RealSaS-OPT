# Host-independent deployment contract validation only.
# Do NOT rename to platform-developer-deployment: that name is consumed by
# workflow_run operators as a successful PHYSICAL install signal.
name: platform-developer-contracts-hosted

on:
  push:
    branches: [main]
    paths:
      - 'platform/**'
      - 'compiler/realsas_compiler_services/platform_worker/**'
      - 'tools/platform_deploy.py'
      - 'tools/platform_service.py'
      - 'tools/platform_deployment_smoke.py'
      - 'requirements/platform-deployment.txt'
      - 'requirements/mainline-ci.txt'
      - 'requirements/platform-worker.txt'
      - 'requirements/torch-cpu.txt'
      - 'requirements/truth-family-courts.txt'
      - 'requirements/torch-cuda.txt'
      - 'tests/repository/test_platform_deployment.py'
      - 'tests/repository/test_platform_wheelhouse_v1.py'
      - 'tests/repository/test_self_hosted_execution_policy.py tests/repository/test_ci_execution_authority_v1.py'
      - '.github/workflows/platform_developer_deploy.yml'
      - '.github/workflows/platform_developer_contracts_hosted.yml'
  pull_request:
    branches: [main]
    paths:
      - 'platform/**'
      - 'compiler/realsas_compiler_services/platform_worker/**'
      - 'tools/platform_deploy.py'
      - 'tools/platform_service.py'
      - 'tools/platform_deployment_smoke.py'
      - 'requirements/platform-deployment.txt'
      - 'requirements/mainline-ci.txt'
      - 'requirements/platform-worker.txt'
      - 'requirements/torch-cpu.txt'
      - 'requirements/truth-family-courts.txt'
      - 'requirements/torch-cuda.txt'
      - 'tests/repository/test_platform_deployment.py'
      - 'tests/repository/test_platform_wheelhouse_v1.py'
      - 'tests/repository/test_self_hosted_execution_policy.py'
      - '.github/workflows/platform_developer_deploy.yml'
      - '.github/workflows/platform_developer_contracts_hosted.yml'

concurrency:
  group: platform-developer-contracts-hosted-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  developer-contract:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/mainline-ci.txt
      - name: Deployment and runner contracts (no physical host)
        run: |
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
          python -m pytest -q tests/repository/test_platform_deployment.py tests/repository/test_platform_wheelhouse_v1.py tests/repository/test_self_hosted_execution_policy.py
