name: platform-developer-deployment

on:
  push:
    branches: [main]
    paths:
      - 'tools/platform_deploy.py'
      - 'tools/platform_service.py'
      - 'tools/platform_deployment_smoke.py'
      - 'requirements/platform-deployment.txt'
      - '.github/workflows/platform_developer_deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/platform_deploy.py'
      - 'tools/platform_service.py'
      - 'tools/platform_deployment_smoke.py'
      - 'requirements/platform-deployment.txt'
      - 'tests/repository/test_platform_deployment.py'
      - '.github/workflows/platform_developer_deploy.yml'

concurrency:
  group: platform-developer-deployment-${{ github.ref }}
  # Never interrupt a permanent service switch; obsolete PR tests may cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  developer-host:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Isolated deployment contract dependencies
        run: |
          python -m venv "$RUNNER_TEMP/platform-deploy-contract-$GITHUB_RUN_ID"
          "$RUNNER_TEMP/platform-deploy-contract-$GITHUB_RUN_ID/bin/python" -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
          echo "$RUNNER_TEMP/platform-deploy-contract-$GITHUB_RUN_ID/bin" >> "$GITHUB_PATH"
      - name: Deployment and authorized runner contracts
        run: python -m pytest -q tests/repository/test_platform_deployment.py tests/repository/test_self_hosted_execution_policy.py
      - name: Read-only user service manager readiness
        run: |
          python - <<'PY'
          from tools.platform_deploy import manager_environment
          try:
              manager_environment()
              print('USER_MANAGER_AVAILABLE')
          except RuntimeError as error:
              # PR validates the package even if the operator needs to enable
              # its user manager. The actual main install fails closed.
              print('::warning::' + str(error))
          PY
      - uses: actions/setup-go@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          go-version: '1.27.1'
          cache: false
      - name: Install persistent developer services from exact canonical main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python tools/platform_deploy.py \
            --root /home/monster/realsas_platform \
            --authority-root /home/monster/realsas_authority \
            --expected-main-sha "$GITHUB_SHA"
      - name: Real API to Engine execution and exact reuse proof
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          /home/monster/realsas_platform/current/venv/bin/python \
            /home/monster/realsas_platform/current/source/tools/platform_deployment_smoke.py \
            --root /home/monster/realsas_platform
      - name: Service status (no environment or credentials)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import subprocess
          from tools.platform_deploy import manager_environment, UNITS
          manager_environment()
          subprocess.run(['systemctl', '--user', 'is-active',
                          *[f'realsas-platform-{name}.service' for name in UNITS]], check=True)
          PY
      - name: Preserve engineering execution receipts
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: platform-developer-deployment
          path: |
            /home/monster/realsas_platform/deployment.json
            /home/monster/realsas_platform/receipts/smoke-*.json
          if-no-files-found: ignore
          retention-days: 7
