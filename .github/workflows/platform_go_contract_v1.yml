name: platform-go-contract-v1
# normalized-worker-closure-20261001-final

on:
  push:
    branches: [main, 'review/platform-input-dag-*', 'review/platform-worker-lifecycle-*']
    paths:
      - 'platform/**'
      - 'compiler/realsas_compiler_services/orchestrator/**'
      - 'compiler/realsas_compiler_core/**'
      - 'compiler/realsas_compiler_services/platform_worker/**'
      - 'tools/platform_release_snapshot.py'
      - 'tools/platform_artifact_store.py'
      - 'tools/platform_cache_gc.py'
      - 'tools/platform_ci_bootstrap.py'
      - 'tests/compiler/test_platform_stage_inputs_v1.py'
      - 'tests/compiler/test_platform_released_graph_v1.py'
      - 'tools/platform_host_preflight.py'
      - 'tests/repository/test_platform_host_preflight.py'
      - 'tests/repository/test_platform_artifact_store.py'
      - 'tests/repository/test_platform_cache_gc.py'
      - 'tests/repository/test_platform_ci_bootstrap.py'
      - 'canonical/PLATFORM_KNIGHT_INPUT_INVENTORY_V1.json'
      - 'canonical/PLATFORM_THROUGHPUT_HYDRATION_GC_PREREG_20261008.json'
      - 'models/**'
      - 'runtime/**'
      - 'tools/realsas_architecture.py'
      - 'canonical/MAINLINE_EXECUTION_PLAN_V2.json'
      - 'docs/platform/adr/0003-go-control-plane.md'
      - '.github/workflows/platform_go_contract_v1.yml'
  workflow_dispatch:

concurrency:
  group: platform-go-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REALSAS_CI_CACHE_SOFT_GIB: '12'
  REALSAS_CI_CACHE_TARGET_GIB: '8'
  REALSAS_CI_CACHE_MIN_FREE_GIB: '5'
  REALSAS_CI_CACHE_MAX_AGE_DAYS: '30'

jobs:
  contract:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          # Self-hosted caches stay local. Avoid remote cache uploads serializing
          # the runner queue; GOMODCACHE/GOCACHE are persisted explicitly below.
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select persistent per-runner cache namespace
        run: |
          CACHE_ROOT="$HOME/.cache/realsas-ci/${RUNNER_NAME:-unnamed-runner}"
          echo "REALSAS_CI_CACHE_ROOT=$CACHE_ROOT" >> "$GITHUB_ENV"
          echo "PIP_CACHE_DIR=$CACHE_ROOT/pip" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$CACHE_ROOT/go-mod" >> "$GITHUB_ENV"
          echo "GOCACHE=$CACHE_ROOT/go-build" >> "$GITHUB_ENV"
          echo "REALSAS_CI_PGDATA=$RUNNER_TEMP/realsas-platform-pg-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Bounded local cache GC
        working-directory: .
        run: |
          python3 tools/platform_cache_gc.py \
            --root "$REALSAS_CI_CACHE_ROOT" \
            --soft-max-gib "$REALSAS_CI_CACHE_SOFT_GIB" \
            --target-max-gib "$REALSAS_CI_CACHE_TARGET_GIB" \
            --max-age-days "$REALSAS_CI_CACHE_MAX_AGE_DAYS" \
            --min-free-gib "$REALSAS_CI_CACHE_MIN_FREE_GIB" \
            --out "$RUNNER_TEMP/realsas-ci-cache-gc.json"
      - name: Reuse exact Python contract environment
        working-directory: .
        run: |
          python3 tools/platform_ci_bootstrap.py \
            --cache-root "$REALSAS_CI_CACHE_ROOT" \
            --pip-cache "$PIP_CACHE_DIR" \
            --require pytest \
            --require temporalio \
            --require Pillow==11.3.0 \
            --require pgserver==0.1.4 \
            --github-path "$GITHUB_PATH" \
            --out "$RUNNER_TEMP/realsas-ci-bootstrap.json"
      - name: Start isolated PostgreSQL without Docker
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from pgserver import get_server
          server = get_server(Path(os.environ['REALSAS_CI_PGDATA']), cleanup_mode=None)
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write('REALSAS_DATABASE_URL=' + server.get_uri() + '\n')
          print('Isolated PostgreSQL started; no host database service changed')
          PY
      - name: Download pinned modules
        run: go mod download
      - name: Format gate
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Apply Go-owned PostgreSQL baseline
        run: go run ./cmd/realsas-migrate up
      - name: Migration status
        run: go run ./cmd/realsas-migrate status
      - name: Explicit generic developer execution proof
        run: go test -p 1 ./internal/control -run TestDeveloperCapabilityGoalPersistsDependencyArtifactsAndFinalizes -count=1
      - name: Unit and PostgreSQL integration contracts
        run: go test -p 1 ./...
      - name: Dynamic architecture discovery audit
        run: |
          python3 ../tools/realsas_architecture.py --json-out /tmp/realsas-architecture-audit.json audit
          python3 ../tools/realsas_architecture.py --json-out /tmp/realsas-stage35.json stage 35_DYNAMIC_MECHANICAL_MESH_QUALIFIED
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/realsas-architecture-audit.json',encoding='utf-8'))
          print('ARCH stage_dependency_files=',p['stage_dependency_file_count'])
          print('ARCH ownership_debt=',p['ownership_debt_count'])
          print('ARCH shared_dependencies=',p['shared_dependency_file_count'])
          print('ARCH outside_current_closure=',p['outside_current_stage_closure_count'])
          print('ARCH dynamic_import_sites=',p['dynamic_import_site_count'])
          print('ARCH missing_module_paths=',p['missing_module_path_count'])
          print('ARCH missing_critical_files=',p['missing_critical_file_count'])
          PY
      - name: Prove migration reversibility
        run: |
          # Expanded research DAG fixtures correctly prevent downgrade to the
          # old 46-stage constraint. Verify reversible DDL on a separate empty DB.
          REALSAS_MIGRATION_URL="$(python3 - <<'PY'
          import os
          from pathlib import Path
          from pgserver import get_server
          server = get_server(Path(os.environ['REALSAS_CI_PGDATA'] + '-migrations'), cleanup_mode=None)
          print(server.get_uri())
          PY
          )"
          REALSAS_DATABASE_URL="$REALSAS_MIGRATION_URL" go run ./cmd/realsas-migrate up
          REALSAS_DATABASE_URL="$REALSAS_MIGRATION_URL" go run ./cmd/realsas-migrate reset
          REALSAS_DATABASE_URL="$REALSAS_MIGRATION_URL" go run ./cmd/realsas-migrate up
          REALSAS_DATABASE_URL="$REALSAS_MIGRATION_URL" go test -p 1 ./internal/product -run TestAtomicPromotion -count=1
      - name: Build native control-plane binaries
        run: |
          go build ./cmd/realsasctl
          go build ./cmd/realsas-api
          go build ./cmd/realsas-migrate
          go build ./cmd/realsas-architecture
          go build ./cmd/realsas-control-worker
      - name: Python Engine worker and artifact reuse contracts
        run: |
          python3 -m py_compile ../compiler/realsas_compiler_services/platform_worker/worker.py
          cd ..
          python3 -m pytest -q \
            tests/compiler/test_platform_stage_inputs_v1.py \
            tests/compiler/test_platform_released_graph_v1.py \
            tests/repository/test_platform_host_preflight.py \
            tests/repository/test_platform_artifact_store.py \
            tests/repository/test_platform_cache_gc.py \
            tests/repository/test_platform_ci_bootstrap.py \
            tests/repository/test_source_owned_visual_runtime_wiring_v1.py \
            tests/repository/test_self_hosted_execution_policy.py
      - name: Read-only latest Knight input and platform host preflight
        run: |
          cd ..
          python3 tools/platform_host_preflight.py \
            --authority-root /home/monster/realsas_authority \
            --inventory canonical/PLATFORM_KNIGHT_INPUT_INVENTORY_V1.json \
            --out "$RUNNER_TEMP/platform-host-preflight.json"
      - name: Preserve cache and host diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: platform-host-and-cache-preflight
          path: |
            ${{ runner.temp }}/platform-host-preflight.json
            ${{ runner.temp }}/realsas-ci-cache-gc.json
            ${{ runner.temp }}/realsas-ci-bootstrap.json
          retention-days: 7
      - name: Current continuation contracts
        run: |
          cd ..
          python3 tools/render_authority_map.py --write
          python3 tools/render_rehydration_packet.py --write
      - name: Stop isolated PostgreSQL
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          location = os.environ.get('REALSAS_CI_PGDATA')
          if location:
              from pgserver import pg_ctl
              for suffix in ('', '-migrations'):
                  data = Path(location + suffix)
                  if (data / 'postmaster.pid').exists():
                      pg_ctl(['-m', 'fast', '-w', 'stop'], pgdata=data, timeout=30)
          PY
