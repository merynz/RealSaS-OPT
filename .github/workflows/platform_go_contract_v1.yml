name: platform-go-contract-v1

on:
  push:
    branches: [platform/professional-backend-v1-20261001]
    paths:
      - 'platform/**'
      - 'canonical/MAINLINE_EXECUTION_PLAN_V2.json'
      - 'docs/platform/adr/0003-go-control-plane.md'
      - '.github/workflows/platform_go_contract_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: realsas
          POSTGRES_PASSWORD: realsas
          POSTGRES_DB: realsas_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U realsas -d realsas_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      REALSAS_DATABASE_URL: postgres://realsas:realsas@127.0.0.1:5432/realsas_platform?sslmode=disable
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: platform/go.sum
      - name: Download pinned modules
        run: go mod download
      - name: Format gate
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Apply Go-owned PostgreSQL baseline
        run: go run ./cmd/realsas-migrate up
      - name: Migration status
        run: go run ./cmd/realsas-migrate status
      - name: Unit and PostgreSQL integration contracts
        run: go test ./...
      - name: Prove migration reversibility
        run: |
          go run ./cmd/realsas-migrate reset
          go run ./cmd/realsas-migrate up
          go test ./internal/product -run TestAtomicPromotion -count=1
      - name: Build native control-plane binaries
        run: |
          go build ./cmd/realsas-api
          go build ./cmd/realsas-migrate
