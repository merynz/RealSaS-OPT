name: platform-go-contract-v1
# normalized-worker-closure-20261001-final

on:
  push:
    branches: [main, implementation/platform-execution-lanes-20261008]
    paths:
      - 'platform/**'
      - 'compiler/realsas_compiler_services/orchestrator/**'
      - 'compiler/realsas_compiler_core/**'
      - 'compiler/realsas_compiler_services/platform_worker/**'
      - 'tools/platform_release_snapshot.py'
      - 'tests/compiler/test_platform_stage_inputs_v1.py'
      - 'models/**'
      - 'runtime/**'
      - 'tools/realsas_architecture.py'
      - 'canonical/MAINLINE_EXECUTION_PLAN_V2.json'
      - 'docs/platform/adr/0003-go-control-plane.md'
      - '.github/workflows/platform_go_contract_v1.yml'
  workflow_dispatch:

concurrency:
  group: platform-go-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: platform/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python contract dependencies
        run: |
          python3 -m venv --clear "$RUNNER_TEMP/realsas-platform-contract-venv"
          "$RUNNER_TEMP/realsas-platform-contract-venv/bin/python" -m pip install pytest temporalio pgserver==0.1.4
          echo "$RUNNER_TEMP/realsas-platform-contract-venv/bin" >> "$GITHUB_PATH"
          echo "REALSAS_CI_PGDATA=$RUNNER_TEMP/realsas-platform-pg-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Start isolated PostgreSQL without Docker
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from pgserver import get_server
          server = get_server(Path(os.environ['REALSAS_CI_PGDATA']), cleanup_mode=None)
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write('REALSAS_DATABASE_URL=' + server.get_uri() + '\n')
          print('Isolated PostgreSQL started; no host database service changed')
          PY
      - name: Download pinned modules
        run: go mod download
      - name: Format gate
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Apply Go-owned PostgreSQL baseline
        run: go run ./cmd/realsas-migrate up
      - name: Migration status
        run: go run ./cmd/realsas-migrate status
      - name: Explicit generic developer execution proof
        run: go test -p 1 ./internal/control -run TestDeveloperCapabilityGoalPersistsDependencyArtifactsAndFinalizes -count=1
      - name: Unit and PostgreSQL integration contracts
        run: go test -p 1 ./...
      - name: Dynamic architecture discovery audit
        run: |
          python3 ../tools/realsas_architecture.py --json-out /tmp/realsas-architecture-audit.json audit
          python3 ../tools/realsas_architecture.py --json-out /tmp/realsas-stage35.json stage 35_DYNAMIC_MECHANICAL_MESH_QUALIFIED
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/realsas-architecture-audit.json',encoding='utf-8'))
          print('ARCH stage_dependency_files=',p['stage_dependency_file_count'])
          print('ARCH ownership_debt=',p['ownership_debt_count'])
          print('ARCH shared_dependencies=',p['shared_dependency_file_count'])
          print('ARCH outside_current_closure=',p['outside_current_stage_closure_count'])
          print('ARCH dynamic_import_sites=',p['dynamic_import_site_count'])
          print('ARCH missing_module_paths=',p['missing_module_path_count'])
          print('ARCH missing_critical_files=',p['missing_critical_file_count'])
          PY
      - name: Prove migration reversibility
        run: |
          go run ./cmd/realsas-migrate reset
          go run ./cmd/realsas-migrate up
          go test -p 1 ./internal/product -run TestAtomicPromotion -count=1
      - name: Build native control-plane binaries
        run: |
          go build ./cmd/realsasctl
          go build ./cmd/realsas-api
          go build ./cmd/realsas-migrate
          go build ./cmd/realsas-architecture
          go build ./cmd/realsas-control-worker
      - name: Python Engine worker and artifact reuse contracts
        run: |
          python3 -m py_compile ../compiler/realsas_compiler_services/platform_worker/worker.py
          cd ..
          python3 -m pytest -q tests/compiler/test_platform_stage_inputs_v1.py tests/repository/test_source_owned_visual_runtime_wiring_v1.py tests/repository/test_self_hosted_execution_policy.py
      - name: Current continuation contracts
        run: |
          cd ..
          python3 tools/render_authority_map.py --write
          python3 tools/render_rehydration_packet.py --write
      - name: Stop isolated PostgreSQL
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          location = os.environ.get('REALSAS_CI_PGDATA')
          data = Path(location) if location else None
          if data and (data / 'postmaster.pid').exists():
              from pgserver import pg_ctl
              pg_ctl(['-m', 'fast', '-w', 'stop'], pgdata=data, timeout=30)
          PY
