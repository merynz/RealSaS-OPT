name: platform-go-contract-v1
# hosted-control-plane-closure-20261008

on:
  push:
    branches: [main, 'review/platform-input-dag-*', 'review/platform-worker-lifecycle-*']
    paths:
      - 'platform/**'
      - 'compiler/realsas_compiler_services/orchestrator/**'
      - 'compiler/realsas_compiler_core/**'
      - 'compiler/realsas_compiler_services/platform_worker/**'
      - 'tools/platform_release_snapshot.py'
      - 'tools/platform_artifact_store.py'
      - 'tools/platform_cache_gc.py'
      - 'tools/platform_ci_bootstrap.py'
      - 'tools/platform_ci_database.py'
      - 'tests/compiler/test_platform_stage_inputs_v1.py'
      - 'tests/compiler/test_platform_released_graph_v1.py'
      - 'tools/platform_host_preflight.py'
      - 'tests/repository/test_platform_host_preflight.py'
      - 'tests/repository/test_platform_artifact_store.py'
      - 'tests/repository/test_platform_cache_gc.py'
      - 'tests/repository/test_platform_ci_bootstrap.py'
      - 'tests/repository/test_platform_ci_database.py'
      - 'canonical/PLATFORM_KNIGHT_INPUT_INVENTORY_V1.json'
      - 'canonical/PLATFORM_THROUGHPUT_HYDRATION_GC_PREREG_20261008.json'
      - 'models/**'
      - 'runtime/**'
      - 'tools/realsas_architecture.py'
      - 'canonical/MAINLINE_EXECUTION_PLAN_V2.json'
      - 'docs/platform/adr/0003-go-control-plane.md'
      - '.github/workflows/platform_go_contract_v1.yml'
  workflow_dispatch:

concurrency:
  group: platform-go-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REALSAS_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/realsas_ci_main?sslmode=disable
      REALSAS_MIGRATION_URL: postgresql://postgres:postgres@127.0.0.1:5432/realsas_ci_migrations?sslmode=disable
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: realsas_ci_main
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d realsas_ci_main"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: platform/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements/mainline-ci.txt
            requirements/platform-worker.txt
      - name: Install pinned Python contract dependencies
        run: |
          python3 -m pip install --no-input --progress-bar off -r ../requirements/mainline-ci.txt
          python3 -m pip install --no-input --progress-bar off -r ../requirements/platform-worker.txt
      - name: Create isolated migration database
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
          PGPASSWORD=postgres createdb -h 127.0.0.1 -U postgres realsas_ci_migrations
      - name: Download pinned modules
        run: go mod download
      - name: Format gate
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Apply Go-owned PostgreSQL baseline
        run: go run ./cmd/realsas-migrate up
      - name: Migration status
        run: go run ./cmd/realsas-migrate status
      - name: Explicit generic developer execution proof
        run: go test -p 1 ./internal/control -run TestDeveloperCapabilityGoalPersistsDependencyArtifactsAndFinalizes -count=1
      - name: Unit and PostgreSQL integration contracts
        run: go test -p 1 ./...
      - name: Dynamic architecture discovery audit
        run: |
          python3 ../tools/realsas_architecture.py --json-out /tmp/realsas-architecture-audit.json audit
          python3 ../tools/realsas_architecture.py --json-out /tmp/realsas-stage35.json stage 35_DYNAMIC_MECHANICAL_MESH_QUALIFIED
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/realsas-architecture-audit.json',encoding='utf-8'))
          print('ARCH stage_dependency_files=',p['stage_dependency_file_count'])
          print('ARCH ownership_debt=',p['ownership_debt_count'])
          print('ARCH shared_dependencies=',p['shared_dependency_file_count'])
          print('ARCH outside_current_closure=',p['outside_current_stage_closure_count'])
          print('ARCH dynamic_import_sites=',p['dynamic_import_site_count'])
          print('ARCH missing_module_paths=',p['missing_module_path_count'])
          print('ARCH missing_critical_files=',p['missing_critical_file_count'])
          PY
      - name: Prove migration reversibility
        run: |
          REALSAS_DATABASE_URL="$REALSAS_MIGRATION_URL" go run ./cmd/realsas-migrate up
          REALSAS_DATABASE_URL="$REALSAS_MIGRATION_URL" go run ./cmd/realsas-migrate reset
          REALSAS_DATABASE_URL="$REALSAS_MIGRATION_URL" go run ./cmd/realsas-migrate up
          REALSAS_DATABASE_URL="$REALSAS_MIGRATION_URL" go test -p 1 ./internal/product -run TestAtomicPromotion -count=1
      - name: Build native control-plane binaries
        run: |
          go build ./cmd/realsasctl
          go build ./cmd/realsas-api
          go build ./cmd/realsas-migrate
          go build ./cmd/realsas-architecture
          go build ./cmd/realsas-control-worker
      - name: Python Engine worker and platform contracts
        run: |
          python3 -m py_compile ../compiler/realsas_compiler_services/platform_worker/worker.py
          cd ..
          python3 -m pytest -q \
            tests/compiler/test_platform_stage_inputs_v1.py \
            tests/compiler/test_platform_released_graph_v1.py \
            tests/repository/test_platform_host_preflight.py \
            tests/repository/test_platform_artifact_store.py \
            tests/repository/test_platform_cache_gc.py \
            tests/repository/test_platform_ci_bootstrap.py \
            tests/repository/test_platform_ci_database.py \
            tests/repository/test_source_owned_visual_runtime_wiring_v1.py \
            tests/repository/test_self_hosted_execution_policy.py
      - name: Current continuation contracts
        run: |
          cd ..
          python3 tools/render_authority_map.py --write
          python3 tools/render_rehydration_packet.py --write
      - name: Hosted lane summary
        run: |
          echo 'PLATFORM_GO_CONTRACT_PASS'
          echo 'execution_lane=github_hosted_public_standard'
          echo 'private_repo_guard=true'
          echo 'database_transport=ephemeral_postgres_service'
          echo 'local_wsl_mutation=false'
