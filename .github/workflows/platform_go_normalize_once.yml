name: platform-go-normalize-once

on:
  push:
    branches: [platform/professional-backend-v1-20261001]
    paths:
      - '.github/workflows/platform_go_normalize_once.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: platform/professional-backend-v1-20261001
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Normalize and test
        run: |
          set -euo pipefail
          cd platform
          gofmt -w .
          go mod tidy
          go test -p 1 ./...
      - name: Commit normalized Go batch and remove workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/platform_go_normalize_once.yml
          git add platform
          git commit -m "platform: normalize dynamic graph contracts"
          git push origin HEAD:platform/professional-backend-v1-20261001
