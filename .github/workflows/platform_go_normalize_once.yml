name: platform-go-normalize-once

on:
  push:
    branches: [platform/professional-backend-v1-20261001]
    paths:
      - '.github/workflows/platform_go_normalize_once.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: realsas
          POSTGRES_PASSWORD: realsas
          POSTGRES_DB: realsas_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U realsas -d realsas_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      REALSAS_DATABASE_URL: postgres://realsas:realsas@127.0.0.1:5432/realsas_platform?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: platform/professional-backend-v1-20261001
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Normalize and verify capability persistence
        run: |
          set -euo pipefail
          cd platform
          gofmt -w .
          go mod tidy
          go run ./cmd/realsas-migrate up
          go test -p 1 ./...
          go run ./cmd/realsas-migrate reset
          go run ./cmd/realsas-migrate up
      - name: Commit normalized capability persistence and remove workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/platform_go_normalize_once.yml
          git add platform
          git commit -m "platform: normalize versioned capability persistence"
          git push origin HEAD:platform/professional-backend-v1-20261001
