name: platform-go-normalize-once

on:
  push:
    branches: [platform/professional-backend-v1-20261001]
    paths:
      - '.github/workflows/platform_go_normalize_once.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: platform/professional-backend-v1-20261001
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Normalize and validate Go platform
        run: |
          set -euo pipefail
          echo 'Running dependency-free architecture discovery validation.'
          cd platform
          gofmt -w .
          go mod tidy
          go test -p 1 ./...
          cd ..
          python3 tools/realsas_architecture.py --json-out /tmp/realsas-architecture-audit.json audit
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/realsas-architecture-audit.json',encoding='utf-8'))
          for key in (
              'stage_dependency_file_count',
              'ownership_debt_count',
              'shared_dependency_file_count',
              'dynamic_import_site_count',
              'outside_current_stage_closure_count',
              'platform_unclaimed_go_file_count',
              'missing_critical_file_count',
              'missing_module_path_count',
          ):
              print(f'ARCH {key}={p[key]}')
          PY
      - name: Commit normalized module and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/platform_go_normalize_once.yml
          git add platform
          git commit -m "platform: normalize live architecture discovery"
          git push origin HEAD:platform/professional-backend-v1-20261001
