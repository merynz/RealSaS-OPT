name: platform-host-startup-diagnostic-once
on:
  push:
    branches: ['review/platform-host-diagnostics-20261008']
    paths: ['.github/workflows/platform_host_startup_diagnostic_once.yml']
permissions:
  contents: read
jobs:
  startup-diagnostics:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 3
    steps:
      - name: Stop only the confirmed failing managed PostgreSQL restart loop
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user stop realsas-platform-postgres.service
          systemctl --user show realsas-platform-postgres.service --property=Id,ActiveState,SubState
          echo 'No data removed; canonical main loader fix will restart the managed service.'
