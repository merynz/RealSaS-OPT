name: platform-knight-hydration-host-proof

on:
  push:
    branches: ['platform/throughput-hydration-gc-*']
    paths:
      - 'tools/platform_artifact_store.py'
      - 'tests/repository/test_platform_artifact_store.py'
      - 'canonical/PLATFORM_KNIGHT_INPUT_INVENTORY_V1.json'
      - 'canonical/PLATFORM_KNIGHT_DRIVE_LOCATOR_PROOF_20261008.json'
      - '.github/workflows/platform_knight_hydration_host_proof.yml'
  workflow_dispatch:

concurrency:
  group: platform-knight-hydration-host-proof-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hydrate-exact-knight-inputs:
    # This is intentionally stateful-host work: it consumes the workstation's
    # authenticated read-only Drive remote and persistent external-artifact CAS.
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select authenticated Google Drive rclone remote
        shell: bash
        run: |
          set -euo pipefail
          command -v rclone >/dev/null || { echo 'RCLONE_REQUIRED'; exit 2; }
          mapfile -t remotes < <(rclone listremotes)
          selected=''
          for preferred in 'realsas-drive:' 'gdrive:'; do
            for remote in "${remotes[@]}"; do
              if [[ "$remote" == "$preferred" ]]; then
                selected="${remote%:}"
                break 2
              fi
            done
          done
          [[ -n "$selected" ]] || { printf 'GOOGLE_DRIVE_RCLONE_REMOTE_REQUIRED available=%s\n' "${remotes[*]:-none}"; exit 3; }
          echo "REALSAS_RCLONE_DRIVE_REMOTE=$selected" >> "$GITHUB_ENV"
          echo "RCLONE_REMOTE_SELECTED=$selected"
      - name: Hydrate exact 12/12 Knight external inputs
        run: |
          python3 tools/platform_artifact_store.py \
            --inventory canonical/PLATFORM_KNIGHT_INPUT_INVENTORY_V1.json \
            --cas-root "$HOME/.cache/realsas/external-artifacts" \
            --rclone-remote "$REALSAS_RCLONE_DRIVE_REMOTE" \
            --out "$RUNNER_TEMP/knight-hydration-online.json"
      - name: Prove second pass is offline exact CAS
        run: |
          python3 tools/platform_artifact_store.py \
            --inventory canonical/PLATFORM_KNIGHT_INPUT_INVENTORY_V1.json \
            --cas-root "$HOME/.cache/realsas/external-artifacts" \
            --offline \
            --out "$RUNNER_TEMP/knight-hydration-offline.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          online=json.loads(Path(os.environ['RUNNER_TEMP'],'knight-hydration-online.json').read_text())
          offline=json.loads(Path(os.environ['RUNNER_TEMP'],'knight-hydration-offline.json').read_text())
          assert online['required_file_count'] == 12
          assert online['verified_file_count'] == 12
          assert online['all_input_bytes_verified'] is True
          assert offline['required_file_count'] == 12
          assert offline['verified_file_count'] == 12
          assert offline['all_input_bytes_verified'] is True
          assert all(row['status'] == 'CAS_HIT' for row in offline['files'])
          assert online['scientific_pass_claimed'] is False
          assert offline['qualification_minted'] is False
          print('KNIGHT_HOST_HYDRATION_EXACT=12/12')
          print('KNIGHT_OFFLINE_CAS_HITS=12/12')
          PY
      - name: Preserve host hydration receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knight-host-hydration-proof
          path: |
            ${{ runner.temp }}/knight-hydration-online.json
            ${{ runner.temp }}/knight-hydration-offline.json
          if-no-files-found: warn
          retention-days: 14
