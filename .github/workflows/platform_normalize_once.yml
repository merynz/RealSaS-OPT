name: platform normalize once
on:
  push:
    branches: [platform/professional-backend-v1-20261001]
    paths: ['.github/workflows/platform_normalize_once.yml']
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: platform/professional-backend-v1-20261001, fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.1', cache-dependency-path: platform/go.sum}
      - run: gofmt -w platform
      - run: |
          set -euo pipefail
          rm .github/workflows/platform_normalize_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform .github/workflows/platform_normalize_once.yml
          git diff --cached --quiet && exit 0
          git commit -m "style: normalize platform Go"
          git push origin HEAD:platform/professional-backend-v1-20261001
