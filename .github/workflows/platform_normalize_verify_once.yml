name: platform normalize and verify once

on:
  push:
    branches: [platform/professional-backend-v1-20261001]
    paths:
      - '.github/workflows/platform_normalize_verify_once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: platform/professional-backend-v1-20261001
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: platform/go.sum
      - name: Normalize Go
        run: gofmt -w platform
      - name: Commit normalized tree
        run: |
          set -euo pipefail
          rm .github/workflows/platform_normalize_verify_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform .github/workflows/platform_normalize_verify_once.yml
          if git diff --cached --quiet; then
            echo "NORMALIZATION_NOOP"
          else
            git commit -m "style: normalize platform Go"
            git push origin HEAD:platform/professional-backend-v1-20261001
          fi
      - name: Full Go contract on normalized tree
        working-directory: platform
        env:
          REALSAS_DATABASE_URL: postgres://realsas:realsas@127.0.0.1:5432/realsas_platform?sslmode=disable
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
