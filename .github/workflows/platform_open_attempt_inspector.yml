name: platform-open-attempt-inspector

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/platform_open_attempt_inspector.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-open-attempt-inspector
  cancel-in-progress: true

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Read open Attempts from the deployed Platform database
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          root=/home/monster/realsas_platform
          test -f "$root/deployment.json"
          socket_dir="$root/data/socket"
          test -S "$socket_dir/.s.PGSQL.55432"
          psql="$($root/current/bin/realsas-python - <<'PY'
          from pgserver._commands import POSTGRES_BIN_PATH
          print(POSTGRES_BIN_PATH / 'psql')
          PY
          )"
          output="$RUNNER_TEMP/open-attempts-$GITHUB_RUN_ID.jsonl"
          "$psql" -h "$socket_dir" -p 55432 -d postgres -Atc \
            "SELECT json_build_object(
               'attempt_id', a.id,
               'subject_id', a.subject_id,
               'kind', a.kind,
               'engine_release_id', a.engine_release_id,
               'parent_attempt_id', a.parent_attempt_id,
               'created_by', a.created_by,
               'created_at', a.created_at,
               'latest_event', (
                 SELECT json_build_object(
                   'type', e.event_type,
                   'created_at', e.created_at,
                   'payload', e.payload
                 )
                 FROM attempt_events e
                 WHERE e.attempt_id = a.id
                 ORDER BY e.id DESC
                 LIMIT 1
               )
             )::text
             FROM attempts a
             WHERE a.final_state = 'OPEN'
             ORDER BY a.created_at, a.id" > "$output"
          count="$(grep -cve '^$' "$output" || true)"
          echo "open_attempt_count=$count"
          cat "$output"
          {
            echo '### Open Platform Attempts'
            echo
            echo "Count: $count"
            echo
            echo '```jsonl'
            cat "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/open-attempt-inspector"
          cp "$output" "$RUNNER_TEMP/open-attempt-inspector/OPEN_ATTEMPTS.jsonl"
          printf '{"schema":"RealSaS.OpenAttemptInspection.v1","canonical_main_sha":"%s","open_attempt_count":%s,"read_only":true}\n' \
            "$GITHUB_SHA" "$count" > "$RUNNER_TEMP/open-attempt-inspector/INSPECTION.json"

      - name: Preserve read-only inspection
        uses: actions/upload-artifact@v4
        with:
          name: platform-open-attempt-inspection-${{ github.run_id }}
          path: ${{ runner.temp }}/open-attempt-inspector/
          if-no-files-found: error
          retention-days: 7
