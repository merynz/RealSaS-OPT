name: platform worker seam normalize once

on:
  push:
    branches: [platform/worker-seam-20261001]
    paths:
      - '.github/workflows/platform_worker_normalize_once.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: realsas
          POSTGRES_PASSWORD: realsas
          POSTGRES_DB: realsas_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U realsas -d realsas_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      REALSAS_DATABASE_URL: postgres://realsas:realsas@127.0.0.1:5432/realsas_platform?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: platform/worker-seam-20261001
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: platform/go.sum
      - id: gate
        continue-on-error: true
        working-directory: platform
        run: |
          set -euo pipefail
          gofmt -w .
          go vet ./...
          go run ./cmd/realsas-migrate up
          go test -p 1 ./...
          go build -o /tmp/realsas-control-worker ./cmd/realsas-control-worker
          go build -o /tmp/realsas-forge ./cmd/realsas-forge
      - name: Commit normalized sources and evidence
        if: always()
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          set -euo pipefail
          mkdir -p docs/platform/evidence
          python - <<'PY'
          import json, os
          from pathlib import Path
          p={
            "schema":"RealSaS.PlatformWorkerNormalizeGate.v1",
            "status":"PASS" if os.environ["GATE_OUTCOME"]=="success" else "FAIL",
            "workflow_run_id":os.environ["GITHUB_RUN_ID"],
            "source_head":os.environ["GITHUB_SHA"],
            "go_gate":os.environ["GATE_OUTCOME"],
          }
          Path("docs/platform/evidence/WORKER_SEAM_NORMALIZE_GATE_20261001.json").write_text(json.dumps(p,indent=2,sort_keys=True)+"\n")
          PY
          rm .github/workflows/platform_worker_normalize_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ':(glob)platform/**/*.go' docs/platform/evidence/WORKER_SEAM_NORMALIZE_GATE_20261001.json .github/workflows/platform_worker_normalize_once.yml
          git commit -m "platform: normalize and gate worker seam"
          git push origin HEAD:platform/worker-seam-20261001
          test "$GATE_OUTCOME" = success
