name: platform worker seam capture once

on:
  push:
    branches: [platform/worker-seam-20261001]
    paths:
      - '.github/workflows/platform_worker_seam_capture_once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: realsas
          POSTGRES_PASSWORD: realsas
          POSTGRES_DB: realsas_platform
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U realsas -d realsas_platform"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      REALSAS_DATABASE_URL: postgres://realsas:realsas@127.0.0.1:5432/realsas_platform?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: platform/worker-seam-20261001
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: platform/go.sum
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Gate Go worker seam
        working-directory: platform
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go vet ./...
          go run ./cmd/realsas-migrate up
          go test -p 1 ./...
          go build ./cmd/realsas-control-worker
      - name: Gate Python worker syntax and render-only boundary
        run: |
          set -euo pipefail
          python -m py_compile compiler/realsas_compiler_services/platform_worker_v1.py
          python - <<'PY'
          from pathlib import Path
          p=Path('compiler/realsas_compiler_services/platform_worker_v1.py').read_text()
          forbidden=('mainline.execute(', 'fit(', 'train(', 'calibrate(')
          assert all(token not in p for token in forbidden), [x for x in forbidden if x in p]
          assert 'RUNTIME_V2_RSS_PACKAGE' in p
          assert 'upstream_stage_executions": 0' in p
          print('PLATFORM_WORKER_SEAM_STATIC=PASS')
          PY
      - name: Seal gate evidence
        run: |
          set -euo pipefail
          mkdir -p docs/platform/evidence
          cat > docs/platform/evidence/WORKER_SEAM_STATIC_GATE_20261001.json <<EOF
          {
            "schema": "RealSaS.PlatformWorkerSeamStaticGate.v1",
            "status": "PASS",
            "source_head": "${GITHUB_SHA}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "go_format_vet_test_build": true,
            "postgres_migrations": true,
            "python_worker_compiles": true,
            "render_only_boundary": true,
            "temporal_cross_language_e2e": false,
            "knight_render_executed": false
          }
          EOF
          rm .github/workflows/platform_worker_seam_capture_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/platform/evidence/WORKER_SEAM_STATIC_GATE_20261001.json .github/workflows/platform_worker_seam_capture_once.yml
          git commit -m "evidence: seal platform worker seam static gate"
          git push origin HEAD:platform/worker-seam-20261001
