name: platform worker seam normalize and gate once

on:
  push:
    branches: [platform/worker-seam-20261001]
    paths:
      - '.github/workflows/platform_worker_seam_normalize_once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: realsas
          POSTGRES_PASSWORD: realsas
          POSTGRES_DB: realsas_platform
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U realsas -d realsas_platform"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      REALSAS_DATABASE_URL: postgres://realsas:realsas@127.0.0.1:5432/realsas_platform?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: platform/worker-seam-20261001
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: platform/go.sum
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - id: gate
        continue-on-error: true
        working-directory: platform
        run: |
          set -euo pipefail
          gofmt -w .
          go vet ./...
          go run ./cmd/realsas-migrate up
          go test -p 1 ./...
          go build ./cmd/realsas-control-worker
      - id: py
        continue-on-error: true
        run: python -m py_compile compiler/realsas_compiler_services/platform_worker_v1.py
      - name: Commit normalization and evidence
        if: always()
        env:
          GO_OUTCOME: ${{ steps.gate.outcome }}
          PY_OUTCOME: ${{ steps.py.outcome }}
        run: |
          set -euo pipefail
          STATUS=PASS
          if [ "$GO_OUTCOME" != success ] || [ "$PY_OUTCOME" != success ]; then STATUS=FAIL; fi
          mkdir -p docs/platform/evidence
          cat > docs/platform/evidence/WORKER_SEAM_STATIC_GATE_20261001.json <<EOF
          {
            "schema": "RealSaS.PlatformWorkerSeamStaticGate.v1",
            "status": "$STATUS",
            "source_head": "${GITHUB_SHA}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "go_gate": "$GO_OUTCOME",
            "python_gate": "$PY_OUTCOME",
            "normalized_by_gate": true,
            "temporal_cross_language_e2e": false,
            "knight_render_executed": false
          }
          EOF
          rm .github/workflows/platform_worker_seam_normalize_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform docs/platform/evidence/WORKER_SEAM_STATIC_GATE_20261001.json .github/workflows/platform_worker_seam_normalize_once.yml
          git commit -m "platform: normalize and certify worker seam"
          git push origin HEAD:platform/worker-seam-20261001
          test "$STATUS" = PASS
