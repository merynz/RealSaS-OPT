name: post139-corpus-audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/post139_corpus_audit.yml'
      - 'tools/corpus/post139_audit_v1.py'
      - 'tools/corpus/blender_post139_source_structure_v1.py'
      - 'tests/tools/test_post139_audit_v1.py'
      - 'tests/fixtures/post139_corpus_audit_v1/**'
      - 'docs/corpus/POST139_AUDIT.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/post139_corpus_audit.yml'
      - 'tools/corpus/post139_audit_v1.py'
      - 'tools/corpus/blender_post139_source_structure_v1.py'
      - 'tests/tools/test_post139_audit_v1.py'
      - 'tests/fixtures/post139_corpus_audit_v1/**'
      - 'docs/corpus/POST139_AUDIT.md'
  workflow_dispatch:

concurrency:
  group: post139-corpus-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-blender-smoke:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Direct GLTF audit unit tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q tests/tools/test_post139_audit_v1.py
      - name: Install headless Blender runtime dependencies
        run: |
          sudo apt-get -o Acquire::Retries=6 -o Acquire::http::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=6 -o Acquire::http::Timeout=30 install -y --no-install-recommends libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 libgl1 unzip
      - name: Restore pinned Blender 4.0.2 archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender-4.0.2-linux-x64.tar.xz
          key: observation-blender-4.0.2-linux-x64-5583a5588736da8858c522ef17fff5d73be59c47a6fe91ad29c6f3263e22086a
      - name: Verify and unpack Blender 4.0.2
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/blender-4.0.2-linux-x64.tar.xz"
          if [ ! -f "$archive" ]; then
            curl --fail --location --retry 3 --retry-delay 2 'https://download.blender.org/release/Blender4.0/blender-4.0.2-linux-x64.tar.xz' --output "$archive"
          fi
          echo "5583a5588736da8858c522ef17fff5d73be59c47a6fe91ad29c6f3263e22086a  $archive" | sha256sum --check -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          exe="$RUNNER_TEMP/blender-4.0.2-linux-x64/blender"
          test "$("$exe" --version | head -n 1)" = 'Blender 4.0.2'
          echo "BLENDER_EXE=$exe" >> "$GITHUB_ENV"
      - name: Cross-format canonical fingerprint smoke
        run: |
          "$BLENDER_EXE" --background --factory-startup --python-exit-code 1 \
            --python tests/fixtures/post139_corpus_audit_v1/blender_cross_format_smoke.py
      - name: Acquire and census official CC0 Quaternius UAC archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ultimate_animated_character_pack_by_quaternius.zip"
          root="$RUNNER_TEMP/uac-official"
          curl --fail --location --retry 4 --retry-delay 3 \
            'https://opengameart.org/sites/default/files/ultimate_animated_character_pack_by_quaternius.zip' \
            --output "$archive"
          echo "POST139_UAC_ARCHIVE_BYTES=$(stat -c %s "$archive")"
          echo "POST139_UAC_ARCHIVE_SHA256=$(sha256sum "$archive" | awk '{print $1}')"
          mkdir -p "$root"
          unzip -q "$archive" -d "$root"
          python - "$root" <<'PY'
          from collections import Counter
          from pathlib import Path
          import json
          import sys

          root = Path(sys.argv[1])
          files = sorted(p for p in root.rglob('*') if p.is_file())
          extensions = Counter((p.suffix.lower() or '<none>') for p in files)
          fbx = [p.relative_to(root).as_posix() for p in files if p.suffix.lower() == '.fbx']
          blend = [p.relative_to(root).as_posix() for p in files if p.suffix.lower() == '.blend']
          obj = [p.relative_to(root).as_posix() for p in files if p.suffix.lower() == '.obj']
          report = {
              'schema': 'RealSaS.Post139.PublicArchiveCensus.v1',
              'source_family': 'Quaternius',
              'pack': 'Ultimate Animated Character',
              'license': 'CC0',
              'file_count': len(files),
              'extension_counts': dict(sorted(extensions.items())),
              'fbx_count': len(fbx),
              'blend_count': len(blend),
              'obj_count': len(obj),
              'fbx_files': fbx,
          }
          out = root / 'POST139_PUBLIC_ARCHIVE_CENSUS.json'
          out.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print('POST139_UAC_PUBLIC_ARCHIVE_CENSUS', json.dumps(report, sort_keys=True))
          if len(fbx) != 52:
              raise SystemExit(f'POST139_UAC_FBX_CENSUS_EXPECTED_52_GOT:{len(fbx)}')
          PY
          echo "POST139_UAC_PUBLIC_ARCHIVE_ROOT=$root" >> "$GITHUB_ENV"
      - name: Canonical audit all 52 official FBX subjects
        shell: bash
        run: |
          set -euo pipefail
          source_root="$POST139_UAC_PUBLIC_ARCHIVE_ROOT/Ultimate Animated Character Pack - Nov 2019/FBX"
          out="$RUNNER_TEMP/post139-uac-audit"
          python tools/corpus/post139_audit_v1.py audit \
            --source-root "$source_root" \
            --out "$out" \
            --family Quaternius \
            --pack 'Ultimate Animated Character' \
            --provenance CLEAN_CC0_HUMAN_AUTHORED \
            --license-name CC0 \
            --blender-exe "$BLENDER_EXE"
          cat "$out/POST139_AUDIT_INDEX.json"
          python - "$out/POST139_AUDIT_INDEX.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          index = json.loads(Path(sys.argv[1]).read_text())
          if index['candidate_count'] != 52:
              raise SystemExit(f"POST139_UAC_AUDIT_EXPECTED_52_GOT:{index['candidate_count']}")
          if index['failure_count']:
              raise SystemExit(f"POST139_UAC_AUDIT_FAILURES:{index['failure_count']}")
          print('POST139_UAC_52_CANONICAL_AUDIT_PASS', json.dumps(index['status_counts'], sort_keys=True))
          PY
          echo "POST139_UAC_AUDIT_ROOT=$out" >> "$GITHUB_ENV"
      - name: Upload official archive census evidence
        uses: actions/upload-artifact@v4
        with:
          name: post139-uac-public-census-${{ github.sha }}
          path: ${{ env.POST139_UAC_PUBLIC_ARCHIVE_ROOT }}/POST139_PUBLIC_ARCHIVE_CENSUS.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload canonical 52-subject audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: post139-uac-canonical-audit-${{ github.sha }}
          path: ${{ env.POST139_UAC_AUDIT_ROOT }}/**
          if-no-files-found: error
          retention-days: 14
      - name: Summary
        run: |
          echo 'POST139_CORPUS_AUDIT_SOURCE_AND_BLENDER_SMOKE_PASS'
          echo "commit=$GITHUB_SHA"
          echo 'scope=engineering_source_audit_only'
          echo 'training_or_product_authority=false'
