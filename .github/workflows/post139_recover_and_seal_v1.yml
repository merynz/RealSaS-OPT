name: post139-recover-and-seal-v1

on:
  push:
    branches: [post139-corpus-audit-v1]
    paths:
      - '.github/workflows/post139_recover_and_seal_v1.yml'
      - 'canonical/POST139_ACQUISITION_PINS_V1.json'
      - 'canonical/POST139_SUBJECT_POLICY_V1.json'
      - 'tools/corpus/post139_acquire_resilient_v1.py'
      - 'tools/corpus/post139_acquire_itch_actor_lane_v1.py'
      - 'tools/corpus/post139_rebind_candidate_manifest_v1.py'
      - 'tools/corpus/post139_compile_inventory_v2.py'
      - 'tools/corpus/post139_corpus_authority_v1.py'
      - 'tools/corpus/post139_build_materialization_closure_v1.py'
      - 'tests/tools/test_post139_compile_inventory_v2.py'
      - 'tests/tools/test_post139_corpus_authority_v1.py'
      - 'docs/corpus/POST139_CORPUS_AUTHORITY_V1.md'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: post139-recover-and-seal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recover-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source_id:
          - quaternius-platformer-kit
          - quaternius-cube-world
          - quaternius-sushi-restaurant
          - quaternius-sci-fi-essentials
          - quaternius-universal-base-characters
          - kenney-mini-characters
          - kenney-blocky-characters
          - kenney-cube-pets
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install acquisition and Blender runtime dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet 'gdown==5.2.0'
          python -m py_compile \
            tools/corpus/post139_acquire_resilient_v1.py \
            tools/corpus/post139_acquire_itch_actor_lane_v1.py
          sudo apt-get -o Acquire::Retries=6 -o Acquire::http::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=6 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 libgl1 unzip

      - name: Restore pinned Blender 4.0.2 archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender-4.0.2-linux-x64.tar.xz
          key: observation-blender-4.0.2-linux-x64-5583a5588736da8858c522ef17fff5d73be59c47a6fe91ad29c6f3263e22086a

      - name: Verify and unpack Blender 4.0.2
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/blender-4.0.2-linux-x64.tar.xz"
          if [ ! -f "$archive" ]; then
            curl --fail --location --retry 4 --retry-delay 3 \
              'https://download.blender.org/release/Blender4.0/blender-4.0.2-linux-x64.tar.xz' \
              --output "$archive"
          fi
          echo "5583a5588736da8858c522ef17fff5d73be59c47a6fe91ad29c6f3263e22086a  $archive" | sha256sum --check -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          exe="$RUNNER_TEMP/blender-4.0.2-linux-x64/blender"
          test "$("$exe" --version | head -n 1)" = 'Blender 4.0.2'
          echo "BLENDER_EXE=$exe" >> "$GITHUB_ENV"

      - name: Recover exact publisher source
        shell: bash
        run: |
          set -euo pipefail
          source_id='${{ matrix.source_id }}'
          root="$RUNNER_TEMP/post139/$source_id"
          echo "POST139_SOURCE_ROOT=$root" >> "$GITHUB_ENV"
          case "$source_id" in
            quaternius-platformer-kit|quaternius-cube-world|quaternius-sushi-restaurant)
              python tools/corpus/post139_acquire_itch_actor_lane_v1.py \
                --registry canonical/POST139_SOURCE_REGISTRY_V1.json \
                --pins canonical/POST139_ACQUISITION_PINS_V1.json \
                --source-id "$source_id" \
                --out "$root"
              ;;
            *)
              python tools/corpus/post139_acquire_resilient_v1.py \
                --registry canonical/POST139_SOURCE_REGISTRY_V1.json \
                --source-id "$source_id" \
                --out "$root" \
                --attempts 3 \
                --base-delay-seconds 15
              ;;
          esac

      - name: Produce source byte ledger and candidate manifest
        shell: bash
        run: |
          set -euo pipefail
          python tools/corpus/post139_source_inventory_v1.py inventory \
            --registry canonical/POST139_SOURCE_REGISTRY_V1.json \
            --source-root "$POST139_SOURCE_ROOT/raw" \
            --source-id '${{ matrix.source_id }}' \
            --out "$POST139_SOURCE_ROOT/inventory"
          python tools/corpus/post139_rebind_candidate_manifest_v1.py \
            --inventory "$POST139_SOURCE_ROOT/inventory/SOURCE_INVENTORY.json" \
            --manifest "$POST139_SOURCE_ROOT/inventory/CANDIDATE_MANIFEST.json"

      - name: Canonical Blender structural audit
        shell: bash
        run: |
          set -euo pipefail
          python tools/corpus/post139_audit_v1.py audit \
            --source-root "$POST139_SOURCE_ROOT/raw" \
            --out "$POST139_SOURCE_ROOT/audit" \
            --manifest "$POST139_SOURCE_ROOT/inventory/CANDIDATE_MANIFEST.json" \
            --blender-exe "$BLENDER_EXE"

      - name: Source recovery summary
        shell: bash
        run: |
          set -euo pipefail
          python - "$POST139_SOURCE_ROOT" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          receipt=json.loads((root/'ACQUISITION_RECEIPT.json').read_text())
          inv=json.loads((root/'inventory/SOURCE_INVENTORY.json').read_text())
          audit=json.loads((root/'audit/POST139_AUDIT_INDEX.json').read_text())
          print('POST139_RECOVERY_SOURCE_PASS', json.dumps({
              'source_id': receipt['source_id'],
              'transport': receipt.get('transport', receipt.get('acquisition_kind')),
              'publisher_files': inv.get('publisher_file_count'),
              'acquired_files': inv.get('raw_file_count'),
              'audit_candidates': inv.get('audit_candidate_count'),
              'audited': audit.get('audited_count'),
              'audit_failures': audit.get('failure_count'),
              'statuses': audit.get('status_counts'),
          }, sort_keys=True))
          if audit.get('failure_count'):
              raise SystemExit(2)
          PY

      - name: Upload recovered immutable source workspace
        uses: actions/upload-artifact@v4
        with:
          name: post139-recovered-source-${{ matrix.source_id }}-${{ github.sha }}
          path: ${{ env.POST139_SOURCE_ROOT }}/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: post139-recovery-debug-${{ matrix.source_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/post139/${{ matrix.source_id }}/**
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 6

  compile-seal:
    needs: recover-source
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: .
      SOURCE_RUN_ID: '41192533150'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore 21 immutable successful source workspaces
        uses: actions/download-artifact@v4
        with:
          repository: merynz/RealSaS-OPT
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          pattern: post139-source-*
          path: ${{ runner.temp }}/old-source-artifacts
          merge-multiple: false

      - name: Restore 8 recovered source workspaces
        uses: actions/download-artifact@v4
        with:
          pattern: post139-recovered-source-*-${{ github.sha }}
          path: ${{ runner.temp }}/recovered-source-artifacts
          merge-multiple: false

      - name: Assemble exact 29-source workspace
        shell: bash
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/workspace"
          mkdir -p "$workspace"
          shopt -s nullglob
          old_count=0
          for folder in "$RUNNER_TEMP"/old-source-artifacts/post139-source-*; do
            name="$(basename "$folder")"
            source_id="${name#post139-source-}"
            mv "$folder" "$workspace/$source_id"
            old_count=$((old_count+1))
          done
          recovered_count=0
          for folder in "$RUNNER_TEMP"/recovered-source-artifacts/post139-recovered-source-*-${GITHUB_SHA}; do
            name="$(basename "$folder")"
            source_id="${name#post139-recovered-source-}"
            source_id="${source_id%-$GITHUB_SHA}"
            test ! -e "$workspace/$source_id"
            mv "$folder" "$workspace/$source_id"
            recovered_count=$((recovered_count+1))
          done
          echo "POST139_OLD_SOURCE_COUNT=$old_count"
          echo "POST139_RECOVERED_SOURCE_COUNT=$recovered_count"
          test "$old_count" -eq 21
          test "$recovered_count" -eq 8
          echo "POST139_WORKSPACE=$workspace" >> "$GITHUB_ENV"

      - name: Verify complete source workspace closure
        shell: bash
        run: |
          set -euo pipefail
          python - canonical/POST139_SOURCE_REGISTRY_V1.json "$POST139_WORKSPACE" <<'PY'
          import json,sys
          from pathlib import Path
          registry=json.loads(Path(sys.argv[1]).read_text())
          workspace=Path(sys.argv[2])
          required=[r['id'] for r in registry['sources'] if r['role']!='QUARANTINE']
          required_files=[
              'ACQUISITION_RECEIPT.json',
              'PUBLISHER_TREE.json',
              'inventory/RAW_FILE_LEDGER.json',
              'inventory/SOURCE_INVENTORY.json',
              'inventory/CANDIDATE_MANIFEST.json',
              'audit/POST139_AUDIT_INDEX.json',
          ]
          present={p.name for p in workspace.iterdir() if p.is_dir()}
          missing_sources=sorted(set(required)-present)
          extra_sources=sorted(present-set(required))
          missing_files=[]
          for sid in required:
              root=workspace/sid
              for rel in required_files:
                  if not (root/rel).is_file():
                      missing_files.append(f'{sid}:{rel}')
          print('POST139_REQUIRED_SOURCE_COUNT', len(required))
          print('POST139_PRESENT_SOURCE_COUNT', len(present))
          if missing_sources or extra_sources or missing_files:
              print('POST139_WORKSPACE_MISSING_SOURCES', json.dumps(missing_sources))
              print('POST139_WORKSPACE_EXTRA_SOURCES', json.dumps(extra_sources))
              print('POST139_WORKSPACE_MISSING_FILES', json.dumps(missing_files, indent=2))
              raise SystemExit(2)
          PY

      - name: Compile corrected semantic V2 ledgers
        shell: bash
        run: |
          set -euo pipefail
          final="$RUNNER_TEMP/post139-final-v2"
          python tools/corpus/post139_compile_inventory_v2.py \
            --registry canonical/POST139_SOURCE_REGISTRY_V1.json \
            --workspace "$POST139_WORKSPACE" \
            --semantic-policy canonical/POST139_SUBJECT_POLICY_V1.json \
            --out "$final"
          python tools/corpus/post139_render_inventory_report_v1.py \
            --inventory-dir "$final" \
            --out "$final/REALSAS_POST139_EXACT_INVENTORY_V2.md"
          cat "$final/POST139_FINAL_INVENTORY_REPORT_V2.json"
          echo "POST139_FINAL_OUT=$final" >> "$GITHUB_ENV"

      - name: Seal and independently verify corpus authority
        shell: bash
        run: |
          set -euo pipefail
          authority="$RUNNER_TEMP/post139-authority-v1"
          python tools/corpus/post139_corpus_authority_v1.py seal \
            --registry canonical/POST139_SOURCE_REGISTRY_V1.json \
            --workspace "$POST139_WORKSPACE" \
            --final-dir "$POST139_FINAL_OUT" \
            --semantic-policy canonical/POST139_SUBJECT_POLICY_V1.json \
            --out "$authority"
          python tools/corpus/post139_corpus_authority_v1.py verify \
            --authority-dir "$authority"
          cat "$authority/POST139_CORPUS_AUTHORITY_V1.json"
          echo "POST139_AUTHORITY_OUT=$authority" >> "$GITHUB_ENV"

      - name: Emit sealed training-consumer manifest
        shell: bash
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/POST139_TRAINING_CONSUMER_MANIFEST_V1.json"
          python tools/corpus/post139_training_consumer_v1.py emit \
            --authority-dir "$POST139_AUTHORITY_OUT" \
            --out "$consumer"
          cp "$consumer" "$POST139_AUTHORITY_OUT/POST139_TRAINING_CONSUMER_MANIFEST_V1.json"
          cat "$consumer"

      - name: Build deterministic materialization source closure
        shell: bash
        run: |
          set -euo pipefail
          closure_dir="$RUNNER_TEMP/post139-materialization-closure"
          closure_zip="$RUNNER_TEMP/REALSAS_POST139_MATERIALIZATION_SOURCE_CLOSURE_V1.zip"
          python tools/corpus/post139_build_materialization_closure_v1.py \
            --workspace "$POST139_WORKSPACE" \
            --plan "$POST139_FINAL_OUT/POST139_MATERIALIZATION_PLAN_V2.json" \
            --authority-dir "$POST139_AUTHORITY_OUT" \
            --out-dir "$closure_dir" \
            --zip "$closure_zip"
          sha256sum "$closure_zip"
          echo "POST139_CLOSURE_DIR=$closure_dir" >> "$GITHUB_ENV"
          echo "POST139_CLOSURE_ZIP=$closure_zip" >> "$GITHUB_ENV"

      - name: Upload corrected V2 ledgers and report
        uses: actions/upload-artifact@v4
        with:
          name: post139-final-v2-${{ github.sha }}
          path: ${{ env.POST139_FINAL_OUT }}/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload sealed corpus authority
        uses: actions/upload-artifact@v4
        with:
          name: post139-corpus-authority-v1-${{ github.sha }}
          path: ${{ env.POST139_AUTHORITY_OUT }}/**
          if-no-files-found: error
          retention-days: 90

      - name: Upload deterministic materialization closure
        uses: actions/upload-artifact@v4
        with:
          name: post139-materialization-source-closure-${{ github.sha }}
          path: ${{ env.POST139_CLOSURE_ZIP }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Final fail-closed authority gate
        shell: bash
        run: |
          set -euo pipefail
          python - "$POST139_FINAL_OUT/POST139_FINAL_INVENTORY_REPORT_V2.json" "$POST139_AUTHORITY_OUT/POST139_CORPUS_AUTHORITY_V1.json" <<'PY'
          import json,sys
          from pathlib import Path
          report=json.loads(Path(sys.argv[1]).read_text())
          authority=json.loads(Path(sys.argv[2]).read_text())
          print('POST139_FINAL_V2_STATUS', report['status'])
          print('POST139_BASE139_ROWS', report['base139_training_rows'])
          print('POST139_POST_PRIMARY', report['post139_primary_materialization_subjects'])
          print('POST139_POST_AUX', report['post139_auxiliary_materialization_subjects'])
          print('POST139_EXPANDED_FULL_ROWS', report['expanded_full_training_rows'])
          print('POST139_AUTHORITY_STATUS', authority['status'])
          print('POST139_AUTHORITY_DIGEST', authority['authority_digest'])
          if report['status'] != 'PASS_MATERIALIZATION_READY': raise SystemExit(2)
          if report['blocker_count'] != 0: raise SystemExit(2)
          if authority['status'] != 'SEALED': raise SystemExit(2)
          PY
