name: pr153-gofmt-diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'platform/**/*.go'
      - '.github/workflows/pr153_gofmt_diagnostic.yml'

permissions:
  contents: read

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Report gofmt drift
        shell: bash
        run: |
          set -euo pipefail
          dirty="$(gofmt -l platform)"
          if [[ -n "$dirty" ]]; then
            echo 'GOFMT_DRIFT_BEGIN'
            printf '%s\n' "$dirty"
            echo 'GOFMT_DRIFT_END'
            echo 'GOFMT_DIFF_BEGIN'
            gofmt -d platform/internal/release/source_authority.go || true
            echo 'GOFMT_DIFF_END'
            exit 1
          fi
          echo 'GOFMT_CLEAN'
