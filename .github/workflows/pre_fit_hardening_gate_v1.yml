name: pre-fit-hardening-gate-v1

'on':
  push:
    branches:
      - hardening/pre-fit-closure-v1-20260904
    paths:
      - 'models/**'
      - 'compiler/**'
      - 'experiments/iris_reprojection_v2_20260831/**'
      - 'experiments/geppetto_arachne_r6_20260901/**'
      - 'tests/compiler/**'
      - 'tests/iris/**'
      - 'tests/models/**'
      - 'tests/repository/**'
      - 'canonical/LEARNED_ARTIFACT_REGISTRY_V1_20260904.json'
      - '.github/workflows/pre_fit_hardening_gate_v1.yml'
  workflow_dispatch: {}

jobs:
  hardening:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install regression dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
          PIP_DEFAULT_TIMEOUT: '60'
        run: python -m pip install --no-input --progress-bar off --only-binary=:all: numpy scipy pytest
      - name: Compile living Python source
        run: python -m compileall -q models compiler
      - name: Visible canonical graph authority
        run: python -m pytest -q tests/compiler/test_canonical_graph_visible_authority_v1.py
      - name: Compiler repair accounting
        run: python -m pytest -q tests/compiler/test_skin_repair_accounting_v1.py
      - name: IRIS deterministic and resource contracts
        run: |
          python -m pytest -q \
            tests/iris/test_iris_v2_mode_determinism_v1.py \
            tests/iris/test_iris_v2_resource_contract_v1.py \
            tests/iris/test_iris_v2_support_telemetry_v1.py \
            tests/iris/test_iris_mainline_source_v1.py
      - name: Geppetto determinism and matching
        run: |
          python -m pytest -q \
            tests/models/test_geppetto_determinism_hardening_v1.py \
            tests/models/test_geppetto_matching_hardening_v1.py \
            tests/models/test_geppetto_mainline_source_v1.py
      - name: Learned artifact lifecycle
        run: |
          python -m pytest -q \
            tests/models/test_arachne_checkpoint_v2.py \
            tests/models/test_learned_artifact_registry_authorization_v1.py \
            tests/repository/test_learned_artifact_registry_v1.py
      - name: Hardening summary
        run: |
          echo 'PRE_FIT_HARDENING_TARGETED_GATE_PASS'
          echo "commit=$GITHUB_SHA"
          echo 'scientific_fit_steps=0'
          echo 'fit_authorized=false'
