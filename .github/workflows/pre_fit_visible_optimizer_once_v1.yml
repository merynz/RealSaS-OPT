name: pre-fit-visible-optimizer-once-v1

on:
  push:
    branches:
      - hardening/pre-fit-closure-v1-20260904
    paths:
      - 'tools/materialize_visible_canonical_graph_optimizer_v1.py'
      - 'compiler/vendor/realsas_v05_current_execution_closure.b64/**'
      - 'compiler/vendor/realsas_synthesis/**'
      - '.github/workflows/pre_fit_visible_optimizer_once_v1.yml'

permissions:
  contents: write

jobs:
  exact-materialize:
    runs-on: [self-hosted, linux, x64, realsas]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert hardening branch only
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = 'hardening/pre-fit-closure-v1-20260904'
      - name: Materialize byte-exact visible optimizer
        shell: bash
        run: |
          python3 tools/materialize_visible_canonical_graph_optimizer_v1.py
          python3 tools/materialize_visible_canonical_graph_optimizer_v1.py --verify
      - name: Commit exact visible source if newly materialized
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- compiler/vendor/realsas_synthesis)" ]; then
            echo 'VISIBLE_OPTIMIZER_ALREADY_EXACT'
            exit 0
          fi
          git config user.name 'realsas-ci'
          git config user.email 'realsas-ci@users.noreply.github.com'
          git add compiler/vendor/realsas_synthesis
          git commit -m 'Expose byte-exact canonical graph optimizer source'
          git push origin HEAD:hardening/pre-fit-closure-v1-20260904
