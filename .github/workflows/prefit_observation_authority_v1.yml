name: prefit-observation-authority-v1

on:
  push:
    branches:
      - architecture/v4-generic-strength-source-completion-20260902
    paths:
      - 'experiments/family_selection_v1/prefit_observation_authority_v1.py'
      - 'tests/family_selection/test_prefit_observation_authority_v1.py'
      - '.github/workflows/prefit_observation_authority_v1.yml'
  workflow_dispatch:

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install pytest pillow
      - name: Reject geometry-control rasters from FIT authority
        env:
          PYTHONPATH: .
        run: pytest -q tests/family_selection/test_prefit_observation_authority_v1.py
