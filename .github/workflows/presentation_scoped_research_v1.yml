name: archived-presentation-research-notice

# Historical hosted Attempts were ephemeral engineering fixtures, not durable research.
# Source/evidence remain in Git history and PR #66; canonical continuation is main.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived-notice:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - name: Direct new component experiments to durable main services
        run: |
          echo 'PR #66 is archived diagnostic history; no Attempt is opened by this workflow.'
          echo 'Use main docs/platform/CAUSAL_INTERVENTIONS.md and the persistent Go deployment.'
          echo 'No product, appearance or scientific PASS is implied by this notice.'
