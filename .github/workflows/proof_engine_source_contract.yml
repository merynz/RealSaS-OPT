name: proof-engine-source-contract
on:
  pull_request:
    paths:
      - 'compiler/realsas_compiler_core/deformation.py'
      - 'compiler/realsas_compiler_core/proof_engine.py'
      - 'compiler/test_proof_engine_source_v1.py'
      - '.github/workflows/proof_engine_source_contract.yml'
  push:
    branches: [source/generic-completion-v1-20260902]
    paths:
      - 'compiler/realsas_compiler_core/deformation.py'
      - 'compiler/realsas_compiler_core/proof_engine.py'
      - 'compiler/test_proof_engine_source_v1.py'
      - '.github/workflows/proof_engine_source_contract.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof-engine-source-contract:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, linux, x64, realsas]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy pytest
      - run: python -m py_compile compiler/realsas_compiler_core/deformation.py compiler/realsas_compiler_core/proof_engine.py
      - run: PYTHONPATH=. python -m pytest -q compiler/test_proof_engine_source_v1.py
