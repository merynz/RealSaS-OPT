name: proof-result-p4-cache-measurement

on:
  push:
    branches:
      - playback-stack-v1-20260916
    paths:
      - 'compiler/realsas_compiler_services/cache/content_addressed.py'
      - 'compiler/realsas_compiler_services/cache/proof_result.py'
      - 'compiler/realsas_compiler_core/proof_engine.py'
      - 'compiler/realsas_compiler_services/proof/**'
      - 'tests/compiler/test_proof_result_cache_v1.py'
      - 'experiments/playback_stack_v1/benchmark_proof_result_p4_cache.py'
      - '.github/workflows/proof_result_p4_cache_measurement.yml'
  workflow_dispatch:

jobs:
  proof-result-cache:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
          PIP_DEFAULT_TIMEOUT: '60'
        run: |
          python -m pip install --no-input --progress-bar off --only-binary=:all: numpy pytest
      - name: Proof-result cache fail-closed gates
        run: |
          PYTHONPATH=. python -m pytest -q tests/compiler/test_proof_result_cache_v1.py
      - name: Cold-to-warm proof-result cache measurement
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .proof-result-p4
          PYTHONPATH=. python experiments/playback_stack_v1/benchmark_proof_result_p4_cache.py \
            --work-root .proof-result-p4/work \
            | tee .proof-result-p4/benchmark.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof-result-p4-cache-measurement-${{ github.sha }}
          path: .proof-result-p4/benchmark.log
          if-no-files-found: warn
