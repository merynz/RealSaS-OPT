name: quaternius-motion-external-gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/motion/materialize_quaternius_preset_v1.py'
      - 'tools/motion/blender_extract_motion_source_v2.py'
      - 'tests/compiler/test_quaternius_motion_materializer_v1.py'
      - 'canonical/MOTION_PRESET_SOURCE_QUATERNIUS_KNIGHT_V1.json'
      - '.github/workflows/quaternius_motion_external_gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-sealed-motion-source:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 15
    env:
      QUATERNIUS_DRIVE_FILE_ID: '1f-Y_lNExN-eAp2XCMVokY9x3xy6-4Aen'
      EXPECTED_FBX_SHA256: '41f2616fb4a42f9d35e242bbed1450ededc7537def4bf38cbb11b4e54ff2bf21'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Blender
        run: |
          python - <<'PY'
          from tools.motion.materialize_quaternius_preset_v1 import resolve_blender
          print(f"blender={resolve_blender(None)}")
          PY

      - name: Download exact public Quaternius FBX
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/KnightCharacter.fbx"
          curl --fail --location --retry 3 --retry-delay 2             "https://drive.usercontent.google.com/download?id=$QUATERNIUS_DRIVE_FILE_ID&export=download&confirm=t"             --output "$target"
          printf '%s  %s\n' "$EXPECTED_FBX_SHA256" "$target" | sha256sum --check -

      - name: Extract and qualify MotionSourceClip v2
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/quaternius_motion_v2"
          rm -rf "$out"
          python tools/motion/materialize_quaternius_preset_v1.py             --source-fbx "$RUNNER_TEMP/KnightCharacter.fbx"             --out-dir "$out"
          test -s "$out/demo_idle_v1.motion.json"
          test -s "$out/demo_run_v1.motion.json"
          test -s "$out/demo_slash_v1.motion.json"
          test -s "$out/EXTRACTION_RECEIPT.json"
          test -s "$out/MATERIALIZATION_RECEIPT.json"
          test -s "$out/MOTION_RUN_MANIFEST_FRAGMENT.json"

      - name: Summarize extraction
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "quaternius_motion_v2"
          receipt = json.loads((root / "MATERIALIZATION_RECEIPT.json").read_text(encoding="utf-8"))
          assert receipt["status"] == "PASS"
          assert receipt["source_input_mode"] == "EXACT_FBX_SHA"
          assert receipt["source_fbx_sha256"] == os.environ["EXPECTED_FBX_SHA256"]
          assert len(receipt["outputs"]) == 3
          print("QUATERNIUS_MOTION_EXTERNAL_GATE_PASS")
          for row in receipt["outputs"]:
              print(row["clip_id"], row["sha256"])
          PY

      - name: Upload qualified motion artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quaternius-motion-source-v2
          path: ${{ runner.temp }}/quaternius_motion_v2
          if-no-files-found: error
          retention-days: 14
