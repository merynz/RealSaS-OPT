name: quaternius-nonroot-translation-diagnostic

on:
  push:
    branches: [recovery/canonical-main-20261001]
    paths:
      - 'tools/motion/diagnose_quaternius_nonroot_translation_v1.py'
      - '.github/workflows/quaternius_nonroot_translation_diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve or bootstrap Blender
        shell: bash
        run: |
          set -euo pipefail
          if python3 - <<'PY'
          from tools.motion.materialize_quaternius_preset_v1 import resolve_blender
          print(resolve_blender(None))
          PY
          then
            exit 0
          fi
          version='4.5.14'
          base="https://download.blender.org/release/Blender4.5"
          archive="blender-${version}-linux-x64.tar.xz"
          install_root="$RUNNER_TEMP/realsas_blender"
          mkdir -p "$install_root"
          curl --fail --location --retry 3 --retry-delay 2 "$base/$archive" --output "$RUNNER_TEMP/$archive"
          curl --fail --location --retry 3 --retry-delay 2 "$base/blender-${version}.sha256" --output "$RUNNER_TEMP/blender.sha256"
          (
            cd "$RUNNER_TEMP"
            grep "  $archive\$" blender.sha256 | sha256sum --check -
          )
          tar -xJf "$RUNNER_TEMP/$archive" -C "$install_root"
          blender_path="$install_root/blender-${version}-linux-x64/blender"
          echo "BLENDER_EXE=$blender_path" >> "$GITHUB_ENV"
      - name: Measure exact non-root translation distribution
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_EXE" --background             --python tools/motion/diagnose_quaternius_nonroot_translation_v1.py --             assets/external/quaternius/knight/KnightCharacter.fbx             canonical/MOTION_PRESET_SOURCE_QUATERNIUS_KNIGHT_V1.json
