name: r6-oracle-substrate-geppetto-heterogeneous

on:
  pull_request:
    paths:
      - 'canonical/R6_ORACLE_SUBSTRATE_INFORMATION_SUFFICIENCY_PREREG_20260903.md'
      - 'canonical/R6_G_ORACLE_SUBSTRATE_ONE_FAMILY_RESULT_20260903.md'
      - 'experiments/geppetto_arachne_r6_20260901/oracle_substrate_synthetic_v1.py'
      - 'experiments/geppetto_arachne_r6_20260901/test_r6_oracle_substrate_geppetto_heterogeneous_v1.py'
      - 'experiments/geppetto_arachne_r6_20260901/test_r6_oracle_substrate_geppetto_one_family_v1.py'
      - 'experiments/geppetto_arachne_r6_20260901/geppetto_*_v2.py'
      - 'compiler/realsas_compiler_core/surface.py'
      - 'compiler/realsas_compiler_core/local_geometry.py'
      - 'compiler/realsas_compiler_core/rig.py'
      - '.github/workflows/r6_oracle_substrate_geppetto_heterogeneous.yml'

jobs:
  r6-g-syn-heterogeneous-u1:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile frozen heterogeneous U1 apparatus
        run: |
          python -m py_compile \
            experiments/geppetto_arachne_r6_20260901/oracle_substrate_synthetic_v1.py \
            experiments/geppetto_arachne_r6_20260901/test_r6_oracle_substrate_geppetto_one_family_v1.py \
            experiments/geppetto_arachne_r6_20260901/test_r6_oracle_substrate_geppetto_heterogeneous_v1.py
      - name: Run R6-G heterogeneous U1 observation-oracle gate
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          PYTHONHASHSEED: '0'
        run: |
          lscpu | grep -E 'Model name|Vendor ID|Architecture' || true
          python -m pytest -q -s experiments/geppetto_arachne_r6_20260901/test_r6_oracle_substrate_geppetto_heterogeneous_v1.py
