name: r6-oracle-substrate-geppetto-one-family

# Frozen September R6 training replay: explicit historical reproduction.
on:
  workflow_dispatch:

jobs:
  r6-g-syn-one-family:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile frozen U0/U1 apparatus
        run: |
          python -m py_compile \
            experiments/geppetto_arachne_r6_20260901/oracle_substrate_synthetic_v1.py \
            experiments/geppetto_arachne_r6_20260901/test_r6_oracle_substrate_geppetto_one_family_v1.py
      - name: Run R6-G synthetic one-family U0 then U1 gate
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          PYTHONHASHSEED: '0'
        run: |
          lscpu | grep -E 'Model name|Vendor ID|Architecture' || true
          python -m pytest -q -s experiments/geppetto_arachne_r6_20260901/test_r6_oracle_substrate_geppetto_one_family_v1.py
