name: realsas-all-cohorts-original-qa-and-rejects-v2

# No private source downloads in public CI, only synthetic provenance tests.
on:
  push:
    branches: [corpus-global-universe-all-source-truth-v1-20261107]
    paths:
      - "tools/corpus/reconcile_realsas_all_cohorts_v2.py"
      - "tests/corpus/test_realsas_all_cohorts_v2.py"
      - ".github/workflows/realsas-all-cohorts-original-qa-and-rejects-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  immutable-cohort-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify fail-closed source and QA lineage
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check pytest
          python -m compileall -q tools/corpus/reconcile_realsas_all_cohorts_v2.py
          PYTHONPATH=. python -m pytest -q tests/corpus/test_realsas_all_cohorts_v2.py
