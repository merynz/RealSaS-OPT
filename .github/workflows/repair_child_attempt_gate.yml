name: repair-child-attempt-gate

on:
  pull_request:
    paths:
      - 'compiler/realsas_compiler_core/repair_registry.py'
      - 'compiler/realsas_compiler_core/repair_attempt.py'
      - 'tests/compiler/test_repair_child_attempt_gate_v1.py'
      - 'canonical/REPAIR_OPERATION_SOURCE_DIFF_V1_20260903.json'
      - '.github/workflows/repair_child_attempt_gate.yml'
  push:
    paths:
      - 'compiler/realsas_compiler_core/repair_registry.py'
      - 'compiler/realsas_compiler_core/repair_attempt.py'
      - 'tests/compiler/test_repair_child_attempt_gate_v1.py'
      - 'canonical/REPAIR_OPERATION_SOURCE_DIFF_V1_20260903.json'
      - '.github/workflows/repair_child_attempt_gate.yml'

jobs:
  repair-child-attempt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Compile repair authority gate
        run: |
          python -m py_compile \
            compiler/realsas_compiler_core/repair_registry.py \
            compiler/realsas_compiler_core/repair_attempt.py
      - name: Run repair child-attempt regressions
        run: PYTHONPATH=. python -m pytest -q tests/compiler/test_repair_child_attempt_gate_v1.py
