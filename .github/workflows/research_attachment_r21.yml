name: research-attachment-r21

on:
  pull_request:
    branches: [main]
    paths:
      - 'compiler/realsas_compiler_core/rigid_attachment_surface_anchor_v1.py'
      - 'tests/compiler/test_rigid_attachment_surface_anchor_v1.py'
      - 'tools/research/render_knight_attachment_r21.py'
      - '.github/workflows/research_attachment_r21.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-attachment-r21-${{ github.ref }}
  cancel-in-progress: true

jobs:
  theorem:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements/mainline-ci.txt
      - run: python -m pytest -q tests/compiler/test_rigid_attachment_surface_anchor_v1.py

  knight-court:
    if: github.event.repository.private == false && github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 25
    steps:
      - name: Checkout current R21 research head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: current
          clean: true
      - name: Checkout sealed witness generator commit
        uses: actions/checkout@v4
        with:
          ref: cc89978e0378086086a788b0c67911cd7058ad35
          path: legacy
          clean: true
      - name: Reconstruct sealed RUN and SLASH witness only
        env:
          AUTHORITY_ROOT: /home/monster/realsas_authority
          INPUT_ROOT: /home/monster/realsas_authority/imports/knight_latest_carrier_20261010
          CURRENT_ROOT: ${{ github.workspace }}/current
          LEGACY_ROOT: ${{ github.workspace }}/legacy
          PYTHONPATH: ${{ github.workspace }}/legacy
        run: |
          rm -rf /tmp/r21_scratch /tmp/r21_output
          mkdir -p /tmp/r21_scratch /tmp/r21_output
          cd "$LEGACY_ROOT"
          /home/monster/realsas_platform/current/bin/realsas-python - <<'PY'
          from __future__ import annotations
          import json, os, sys
          from pathlib import Path
          from types import FunctionType
          import numpy as np

          from compiler.realsas_compiler_core.artifact_codec_v2 import (
              canonical_mesh_candidate_from_dict, qualified_camera_set_from_dict,
              qualified_skeleton_from_dict,
          )
          from compiler.realsas_compiler_core.carrier_skin_v1 import qualified_carrier_skin_from_dict
          from compiler.realsas_compiler_core.joint_frames_v2 import derive_joint_frames_post_bind_v2
          from compiler.realsas_compiler_core.motion_dynamic_proof_v2 import _joint_pose_v2
          from tools.demo.render_knight_motion_preview_v1 import _skin, _tracks_for_clip
          from tools.ops import knight_render_inputs_v1 as base

          auth=Path(os.environ['AUTHORITY_ROOT'])
          inputs=Path(os.environ['INPUT_ROOT'])
          current=Path(os.environ['CURRENT_ROOT'])
          legacy=Path(os.environ['LEGACY_ROOT'])
          mat=auth/'runs'/'KNIGHT_LATEST_CARRIER_MATERIALIZATION_20261010'
          candidate=canonical_mesh_candidate_from_dict(json.loads((mat/'rebound_candidate.json').read_text()))
          skin=qualified_carrier_skin_from_dict(json.loads((mat/'qualified_carrier_skin.json').read_text()))
          skeleton=qualified_skeleton_from_dict(json.loads((inputs/'AXIS41_DISCRETE_XYZ_FROZEN_CAUSAL_QUALIFIED_SKELETON_V541.json').read_text()))
          camera_set=qualified_camera_set_from_dict(json.loads((inputs/'qualified_camera_set.json').read_text()))
          cameras=tuple(sorted(camera_set.cameras,key=lambda c:int(c.view_index)))
          rest=np.asarray([v.P for v in candidate.vertices],dtype=np.float64)
          faces=np.asarray(base.mechanical_faces(candidate),dtype=np.int64)
          with np.load(inputs/'MIRA_AXIS41_TESSA_M_SKIN_FIELD_V55.npz',allow_pickle=False) as z:
              W=np.asarray(z['weights_axis41_canonical'],dtype=np.float64)
              joint_ids=tuple(map(str,np.asarray(z['canonical_joint_ids']).tolist()))
          joints={str(j.canonical_joint_id):j for j in skeleton.joints}
          jindex={jid:i for i,jid in enumerate(joint_ids)}
          axis=np.asarray([joints[jid].position for jid in joint_ids],dtype=np.float64)
          parents=np.asarray([-1 if joints[jid].parent_canonical_id is None else jindex[str(joints[jid].parent_canonical_id)] for jid in joint_ids],dtype=np.int64)
          frames,qualification=derive_joint_frames_post_bind_v2(skeleton,carrier_skin=skin,cameras=cameras)
          if qualification['status']!='PASS': raise RuntimeError('R21_POST_BIND_FRAME_FAIL')
          def bind_frames(fn):
              namespace={**fn.__globals__,'derive_joint_frames_from_skeleton':lambda skeleton,*,cameras:frames}
              return FunctionType(fn.__code__,namespace,fn.__name__,fn.__defaults__,fn.__closure__)
          tracks_for_clip,joint_pose=[bind_frames(fn) for fn in (_tracks_for_clip,_joint_pose_v2)]
          source_report=json.loads((legacy/base.SOURCE_REPORT).read_text())
          motions=base.motion_payloads(inputs)
          with np.load(current/'tests/fixtures/single_m_caa_knight_v1/run_poses.npz',allow_pickle=False) as z:
              canonical_rest=z['rest'].astype(np.float64); canonical_faces=z['faces'].astype(np.int64)
              run_times=z['times'].astype(np.float64); canonical_run=z['poses'].astype(np.float64)
          if not np.array_equal(rest,canonical_rest): raise RuntimeError('R21_REST_DOMAIN_DRIFT')
          if not np.array_equal(faces,canonical_faces): raise RuntimeError('R21_FACE_DOMAIN_DRIFT')
          payloads={}
          for clip_id,idx in (('demo_run_v1',1),('demo_slash_v1',2)):
              payload,_=motions[clip_id]
              tracks,mapping=tracks_for_clip(payload,skeleton,cameras,source_report)
              times=(run_times if idx==1 else np.linspace(0,float(payload['duration_seconds']),len(run_times),endpoint=not bool(payload.get('loop'))))
              poses=[]; matrices=[]
              for t in times:
                  mats,_,_=joint_pose(skeleton=skeleton,tracks=tracks,time_seconds=float(t),cameras=cameras)
                  matrices.append(np.asarray([mats[jid] for jid in joint_ids],dtype=np.float64))
                  poses.append(_skin(rest,W,joint_ids,mats))
              payloads[f'clip_{idx}_times']=np.asarray(times,dtype=np.float64)
              payloads[f'clip_{idx}_canonical_xyz']=np.asarray(poses,dtype=np.float64)
              payloads[f'clip_{idx}_skin_matrices_source']=np.asarray(matrices,dtype=np.float64)
          residual=float(np.max(np.abs(payloads['clip_1_canonical_xyz']-canonical_run)))
          print('RUN_REPLAY_MAX_ABS_RESIDUAL',repr(residual),flush=True)
          if residual>1e-8: raise RuntimeError('R21_RUN_REPLAY_NOT_CURRENT_CANONICAL:'+repr(residual))
          np.savez_compressed('/tmp/r21_scratch/sealed_witness_replay.npz',
              vertices=rest,faces=faces,axis_positions_source=axis,axis_parents=parents,
              canonical_motion_weights=W,**payloads)
          Path('/tmp/r21_scratch/WITNESS_REPORT.json').write_text(json.dumps({
              'schema':'RealSaS.R21ScratchWitness.v1','run_replay_max_abs_residual':residual,
              'vertex_count':len(rest),'face_count':len(faces),'joint_count':len(axis),
              'run_frames':len(payloads['clip_1_times']),'slash_frames':len(payloads['clip_2_times']),
              'product_authority_claimed':False,
          },indent=2)+'\n')
          PY
      - name: Render side and diagonal BASE-vs-R21 courts
        env:
          PYTHONPATH: ${{ github.workspace }}/current
        run: |
          cd "$GITHUB_WORKSPACE/current"
          /home/monster/realsas_platform/current/bin/realsas-python tools/research/render_knight_attachment_r21.py \
            --witness /tmp/r21_scratch/sealed_witness_replay.npz \
            --output /tmp/r21_output --views 6,5 --resolution 256
          cp /tmp/r21_scratch/WITNESS_REPORT.json /tmp/r21_output/
          ls -lh /tmp/r21_output
      - name: Preserve R21 court
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knight-attachment-r21-court
          path: /tmp/r21_output
          if-no-files-found: error
          retention-days: 7
