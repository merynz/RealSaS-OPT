name: research-attachment-r21

on:
  pull_request:
    branches: [main]
    paths:
      - 'compiler/realsas_compiler_core/rigid_attachment_surface_anchor_v1.py'
      - 'compiler/realsas_compiler_core/visual_attachment_motion_v1.py'
      - 'tests/compiler/test_rigid_attachment_surface_anchor_v1.py'
      - 'tests/compiler/test_visual_attachment_motion_v1.py'
      - 'tools/research/render_knight_attachment_r21.py'
      - '.github/workflows/research_attachment_r21.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  fixture-probe:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements/mainline-ci.txt
      - name: Inspect canonical RUN fixture without mutating it
        run: |
          mkdir -p evidence
          python - <<'PY' > evidence/fixture_probe.txt
          import json, numpy as np
          from pathlib import Path
          root=Path('tests/fixtures/single_m_caa_knight_v1')
          with np.load(root/'run_poses.npz',allow_pickle=False) as z:
              for k in z.files:
                  a=z[k]
                  print(k, a.shape, a.dtype)
          print('--- baseline keys ---')
          b=json.loads((root/'baseline.json').read_text())
          print(sorted(b))
          PY
          cat evidence/fixture_probe.txt
      - uses: actions/upload-artifact@v4
        with:
          name: attachment-r21-fixture-probe
          path: evidence/

  sealed-input-probe:
    if: github.event.repository.private == false && github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
      - name: Inspect sealed Knight inputs and attachment presentation evidence
        env:
          AUTHORITY_ROOT: /home/monster/realsas_authority
          INPUT_ROOT: /home/monster/realsas_authority/imports/knight_latest_carrier_20261010
          CAA_RUN: KNIGHT_LATEST_CURRENT_CAA_VISUAL_20261010
          MAT_RUN: KNIGHT_LATEST_CARRIER_MATERIALIZATION_20261010
        run: |
          mkdir -p evidence
          /home/monster/realsas_platform/current/bin/realsas-python - <<'PY' > evidence/sealed_probe.txt
          import json, os
          from pathlib import Path
          import numpy as np
          root=Path(os.environ['INPUT_ROOT'])
          auth=Path(os.environ['AUTHORITY_ROOT'])
          print('INPUT_ROOT',root,'exists',root.exists())
          for p in sorted(root.iterdir()):
              if p.is_file() and p.suffix.lower() in {'.npz','.json','.rss'}:
                  print('FILE',p.name,p.stat().st_size)
                  if p.suffix.lower()=='.npz':
                      try:
                          with np.load(p,allow_pickle=False) as z:
                              print(' KEYS',[(k,z[k].shape,str(z[k].dtype)) for k in z.files])
                      except Exception as exc:
                          print(' NPZ_ERROR',type(exc).__name__,str(exc)[:200])
          print('--- SEARCH AUTHORITY ATTACHMENT EVIDENCE ---')
          roots=[auth/'runs'/os.environ['CAA_RUN'], auth/'runs'/os.environ['MAT_RUN'], root]
          needles=('attachment','presentation_attachment','target_attachments','vertex_attachment_owner','target_slot_raw_index')
          hits=[]
          for base in roots:
              if not base.exists():
                  print('MISSING_ROOT',base); continue
              print('ROOT',base)
              for p in base.rglob('*'):
                  if not p.is_file(): continue
                  lname=p.name.lower()
                  if any(n in lname for n in ('attach','present','projection')):
                      hits.append(('NAME',str(p),p.stat().st_size))
                  if p.suffix.lower() in {'.json','.rss'} and p.stat().st_size <= 20_000_000:
                      try: text=p.read_text(errors='ignore')
                      except Exception: continue
                      low=text.lower()
                      found=[n for n in needles if n in low]
                      if found:
                          hits.append(('TEXT',str(p),found))
                          try:
                              data=json.loads(text)
                              # print only compact paths/values for relevant keys
                              def walk(x,path=''):
                                  if isinstance(x,dict):
                                      for k,v in x.items():
                                          q=f'{path}.{k}' if path else k
                                          if any(n in k.lower() for n in needles):
                                              if isinstance(v,(str,int,float,bool)) or v is None:
                                                  print(' FIELD',q,repr(v))
                                              elif isinstance(v,list):
                                                  print(' FIELD',q,'LIST',len(v),repr(v[:3])[:1500])
                                              elif isinstance(v,dict):
                                                  print(' FIELD',q,'DICT_KEYS',list(v)[:30])
                                          walk(v,q)
                                  elif isinstance(x,list):
                                      for i,v in enumerate(x[:200]): walk(v,f'{path}[{i}]')
                              walk(data)
                          except Exception as exc:
                              print(' JSON_PARSE',p,type(exc).__name__)
                  if p.suffix.lower()=='.npz' and p.stat().st_size <= 300_000_000:
                      try:
                          with np.load(p,allow_pickle=False) as z:
                              keys=[k for k in z.files if any(n in k.lower() for n in needles)]
                              if keys:
                                  print(' NPZ',p)
                                  for k in keys:
                                      a=z[k]
                                      print('  ARRAY',k,a.shape,a.dtype,'minmax', (float(np.min(a)),float(np.max(a))) if a.size and a.dtype.kind in 'iuf' else '')
                      except Exception:
                          pass
          for row in hits[:300]: print('HIT',row)
          print('hit_count',len(hits))
          print('--- MOTION SUMMARIES ---')
          for name in ('demo_run_v1.motion.json','demo_slash_v1.motion.json'):
              p=root/name
              data=json.loads(p.read_text())
              print(name,'keys',sorted(data.keys()),'duration',data.get('duration_seconds'),'loop',data.get('loop'))
              for key in ('tracks','joints','channels','frames'):
                  if key in data:
                      v=data[key]
                      print(' ',key,type(v).__name__,len(v) if hasattr(v,'__len__') else '')
          PY
          cat evidence/sealed_probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attachment-r21-sealed-probe
          path: evidence/
