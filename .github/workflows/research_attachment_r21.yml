name: research-attachment-r21

on:
  pull_request:
    branches: [main]
    paths:
      - 'compiler/realsas_compiler_core/rigid_attachment_surface_anchor_v1.py'
      - 'compiler/realsas_compiler_core/visual_attachment_motion_v1.py'
      - 'tests/compiler/test_rigid_attachment_surface_anchor_v1.py'
      - 'tests/compiler/test_visual_attachment_motion_v1.py'
      - 'tools/research/render_knight_attachment_r21.py'
      - '.github/workflows/research_attachment_r21.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: .

jobs:
  fixture-probe:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements/mainline-ci.txt
      - name: Inspect canonical RUN fixture and current M components
        run: |
          mkdir -p evidence
          python - <<'PY' > evidence/fixture_probe.txt
          import json, numpy as np
          from pathlib import Path
          root=Path('tests/fixtures/single_m_caa_knight_v1')
          with np.load(root/'run_poses.npz',allow_pickle=False) as z:
              arrays={k:z[k] for k in z.files}
              for k,a in arrays.items(): print(k,a.shape,a.dtype)
          rest,faces=arrays['rest'],arrays['faces']
          parent=np.arange(len(rest))
          def find(x):
              while parent[x]!=x:
                  parent[x]=parent[parent[x]]; x=parent[x]
              return x
          def union(a,b):
              a,b=find(int(a)),find(int(b))
              if a!=b: parent[b]=a
          for a,b,c in faces:
              union(a,b); union(b,c)
          groups={}
          for i in range(len(rest)): groups.setdefault(find(i),[]).append(i)
          comps=sorted(groups.values(),key=lambda x:min(x))
          print('--- COMPONENTS',len(comps),'---')
          for ci,ids in enumerate(comps):
              p=rest[np.asarray(ids)]
              print('COMP',ci,'n',len(ids),'first',min(ids),'last',max(ids),
                    'lo',np.round(p.min(0),6).tolist(),'hi',np.round(p.max(0),6).tolist(),
                    'centroid',np.round(p.mean(0),6).tolist())
          print('--- baseline keys ---')
          b=json.loads((root/'baseline.json').read_text())
          print(sorted(b))
          PY
          cat evidence/fixture_probe.txt
      - name: Run R21 unit theorem
        run: python -m pytest -q tests/compiler/test_rigid_attachment_surface_anchor_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attachment-r21-fixture-probe
          path: evidence/

  sealed-input-probe:
    if: github.event.repository.private == false && github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
      - name: Inspect sealed Knight inputs and locate earlier attachment witness
        env:
          AUTHORITY_ROOT: /home/monster/realsas_authority
          INPUT_ROOT: /home/monster/realsas_authority/imports/knight_latest_carrier_20261010
        run: |
          mkdir -p evidence
          {
            echo '--- presentation config ---'
            cat "$INPUT_ROOT/presentation_config.json" || true
            echo
            echo '--- attachment tokens in large rigging surface ---'
            grep -aoE '.{0,120}(target_attachments|attachment_id|target_slot_raw_index_fit_only|presentation_attachment_vertex_owner).{0,500}' "$INPUT_ROOT/qualified_rigging_surface.json" | head -80 || true
            echo '--- prior scratch/witness candidates under authority ---'
            find "$AUTHORITY_ROOT" -type f \( -name 'sealed_witness_replay.npz' -o -name 'projection.json' -o -iname '*attachment*' -o -iname '*presentation*projection*' \) -printf '%p %s\n' 2>/dev/null | head -300
          } > evidence/sealed_probe.txt
          cat evidence/sealed_probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attachment-r21-sealed-probe
          path: evidence/

  parent-witness-probe:
    if: github.event.repository.private == false && github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
      - name: Recover historical parent presentation evidence
        uses: actions/download-artifact@v4
        with:
          name: knight-presentation-research-evidence
          path: /tmp/r21-parent-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '37859732443'
      - name: Locate exact witness and inspect only relevant arrays
        run: |
          mkdir -p evidence
          /home/monster/realsas_platform/current/bin/realsas-python - <<'PY' > evidence/parent_witness_probe.txt
          from pathlib import Path
          import json, hashlib, numpy as np
          root=Path('/tmp/r21-parent-evidence')
          print('root',root,'exists',root.exists())
          files=[p for p in root.rglob('*') if p.is_file()]
          print('file_count',len(files))
          for p in files:
              n=p.name.lower()
              if p.suffix.lower() in {'.npz','.json'} and any(k in n for k in ('witness','projection','stage42','runtime','pose','motion','presentation')):
                  print('CANDIDATE',p,p.stat().st_size)
                  if p.suffix.lower()=='.npz' and p.stat().st_size < 500_000_000:
                      try:
                          with np.load(p,allow_pickle=False) as z:
                              keys=z.files
                              relevant=[k for k in keys if any(s in k.lower() for s in ('vertices','faces','axis','skin_matrices','canonical_xyz','attachment','times','weights'))]
                              print(' KEYS',[(k,z[k].shape,str(z[k].dtype)) for k in relevant])
                      except Exception as exc:
                          print(' NPZ_ERROR',type(exc).__name__,str(exc)[:300])
                  elif p.suffix.lower()=='.json' and p.stat().st_size < 50_000_000:
                      try:
                          text=p.read_text(errors='ignore')
                          if 'target_attachments' in text or 'presentation_attachment_vertex_owner' in text or 'target_slot_raw_index_fit_only' in text:
                              print(' ATTACHMENT_JSON',p)
                              data=json.loads(text)
                              def walk(x,path=''):
                                  if isinstance(x,dict):
                                      for k,v in x.items():
                                          q=f'{path}.{k}' if path else k
                                          if k in {'target_attachments','target_slot_raw_index_fit_only','attachment_id','attachment_index'}:
                                              print('  FIELD',q,repr(v)[:3000])
                                          walk(v,q)
                                  elif isinstance(x,list):
                                      for i,v in enumerate(x[:100]): walk(v,f'{path}[{i}]')
                              walk(data)
                      except Exception as exc:
                          print(' JSON_ERROR',type(exc).__name__,str(exc)[:300])
          PY
          cat evidence/parent_witness_probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attachment-r21-parent-witness-probe
          path: evidence/
