name: research-head-mechanics-truth-gate-v1

on:
  push:
    branches:
      - audit/generic-main-normalization-20260930
    paths:
      - '.github/workflows/research_head_mechanics_truth_gate_v1.yml'
  workflow_dispatch:

concurrency:
  group: research-head-mechanics-truth-gate-v1
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  truth:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout exact research head detached
        run: |
          git fetch --no-tags origin research/vf11-certified-adaptive-20260921
          git checkout --detach origin/research/vf11-certified-adaptive-20260921
          echo "research_head=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "6ed060351512a5f76a206acce011b585f48b1768"
      - name: Install pinned regression dependencies
        run: |
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
          python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt
      - name: Compile research mechanics and geometry closure
        run: |
          python -m compileall -q             compiler/realsas_compiler_core             compiler/realsas_compiler_services/orchestrator/adapters             models/geppetto/reference_strength_v1
      - name: Exact candidate mechanical geometry regression suite
        run: |
          python -m pytest -q             tests/compiler/test_automatic_deformation_envelope_v1.py             tests/compiler/test_canonical_mesh_candidate_v1.py             tests/compiler/test_canonical_mesh_quality_repair_v1.py             tests/compiler/test_compacted_dense_face_provenance_v1.py             tests/compiler/test_compiler_mesh_layout_v1.py             tests/compiler/test_compiler_substrate_layout_v1.py             tests/compiler/test_deformation_stress_v1.py             tests/compiler/test_deformation_stress_v2_vectorization.py             tests/compiler/test_demo_stage18_mesh_fallback_v2.py             tests/compiler/test_drawable_surface_v1.py             tests/compiler/test_dynamic_geometry_integrity_v2.py             tests/compiler/test_geometry_substrate_evidence_v2.py             tests/compiler/test_geppetto_demo_surface_scope_v2.py             tests/compiler/test_holeless_partitioned_dense_candidate_v1.py             tests/compiler/test_mechanical_partition_v1.py             tests/compiler/test_mechanical_repartition_v2.py             tests/compiler/test_mesh_component_labels_v1.py             tests/compiler/test_mesh_conditioning_v1.py             tests/compiler/test_playback_full_surface_v3.py             tests/compiler/test_product_authority_v1.py             tests/compiler/test_product_mesh_skin_v1.py             tests/compiler/test_product_mesh_stage_adapters_v1.py             tests/compiler/test_scene_first_signed_surface_bridge_v1.py             tests/compiler/test_skeleton_identity_determinism_v2.py             tests/compiler/test_skin_repair_accounting_v1.py             tests/compiler/test_skin_topology_repartition_directive_v2.py             tests/compiler/test_source_edge_probe_repartition_v1.py             tests/compiler/test_stage13_geometry_gate_v2.py             tests/compiler/test_stage14_policy_v3.py             tests/compiler/test_substrate_adequacy_v1.py             tests/compiler/test_v2_geometry_dependency_split.py             tests/compiler/test_v2_static_mesh_source_fidelity_gate.py             tests/compiler/test_visual_mesh_arap_v1.py
