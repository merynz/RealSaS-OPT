name: restoration-closure-manual

on:
  workflow_dispatch:
  workflow_call:

jobs:
  restoration-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact requested ref
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python gate dependencies
        run: python -m pip install --upgrade pip numpy scipy pytest

      - name: Compile current Python mainline
        run: |
          python -m compileall -q models compiler runtime/reference_v4

      - name: Canonical-main readiness and dependency firewall
        run: PYTHONPATH=. python -m pytest -q tests/repository/test_canonical_main_readiness_v1.py

      - name: Learned-model ownership/source gates
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/models \
            tests/iris/test_iris_mainline_source_v1.py

      - name: Compiler restoration regressions
        run: PYTHONPATH=. python -m pytest -q tests/compiler

      - name: Complete synthetic V4 proof/export gate
        run: PYTHONPATH=. python -m pytest -q experiments/single_family_e2e_v1/test_complete_e2e_source_v1.py

      - name: Emit exact current V4 native package fixture
        run: |
          mkdir -p .closure
          PYTHONPATH=. python - <<'PY'
          from pathlib import Path
          from experiments.single_family_e2e_v1.run_complete_e2e_v1 import run_complete_e2e_v1

          out = run_complete_e2e_v1(Path('.closure/e2e'))
          native = out['native_runtime_result']
          archive = Path(out['native_runtime_archive']).resolve()
          env = Path('.closure/native_probe.env')
          env.write_text(
              f"ARCHIVE_PATH={archive}\n"
              f"SOURCE_BINDING_SHA256={native['source_binding_sha256']}\n"
              f"PROOF_BUNDLE_SHA256={out['proof'].proof_bundle_hash}\n",
              encoding='utf-8',
          )
          print(env.read_text(encoding='utf-8'))
          PY

      - name: Install sealed native runtime build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libarchive-dev libpng-dev zlib1g-dev

      - name: Build and test sealed C++ runtime
        run: |
          cmake -S runtime/realsas_cpp -B .closure/native-build \
            -DREALSAS_BUILD_SHARED=ON \
            -DREALSAS_BUILD_EXAMPLES=OFF \
            -DREALSAS_BUILD_TESTS=ON
          cmake --build .closure/native-build --parallel
          ctest --test-dir .closure/native-build --output-on-failure

      - name: Build external current-V4 package probe
        run: |
          c++ -std=c++17 \
            -Iruntime/realsas_cpp/include \
            tests/runtime/current_v4_native_package_probe.cpp \
            -L.closure/native-build \
            -Wl,-rpath,"$GITHUB_WORKSPACE/.closure/native-build" \
            -lrealsas_runtime \
            -o .closure/current_v4_native_package_probe

      - name: Open, bind, sample, and render exact current V4 package in sealed C++ runtime
        run: |
          set -a
          source .closure/native_probe.env
          set +a
          .closure/current_v4_native_package_probe \
            "$ARCHIVE_PATH" \
            "$SOURCE_BINDING_SHA256" \
            "$PROOF_BUNDLE_SHA256"

      - name: Closure summary
        run: |
          echo 'RESTORATION_CLOSURE_GATE_PASS'
          echo "commit=$GITHUB_SHA"
          echo 'fit_authorization=STILL_FALSE_UNTIL_CANONICAL_MAIN_PROMOTION_AND_POST_MERGE_INTEGRITY'
