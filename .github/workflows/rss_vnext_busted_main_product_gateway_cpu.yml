name: RSS vNext BUSTED main-owned website and product gateway court

on:
  push:
    branches: [main, feat/rss-vnext-main-owned-busted-site-20261111]
    paths:
      - "product/busted_site/**"
      - "product/living_compile/server.py"
      - "tests/product/test_busted_main_site_gateway_v1.py"
      - "tests/product/test_busted_api_origin.mjs"
      - ".github/workflows/rss_vnext_busted_main_product_gateway_cpu.yml"
  pull_request:
    branches: [main]
    paths:
      - "product/busted_site/**"
      - "product/living_compile/server.py"
      - "tests/product/test_busted_main_site_gateway_v1.py"
      - "tests/product/test_busted_api_origin.mjs"
      - ".github/workflows/rss_vnext_busted_main_product_gateway_cpu.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website-and-product-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install product Python test dependencies
        run: python -m pip install pytest numpy
      - name: Compile BUSTED entrypoint, test old proof-gated API and new product server
        env:
          PYTHONPATH: .
        run: |
          python -m compileall -q product/busted_site product/living_compile/server.py
          python -m pytest -q tests/product/test_living_compile_v4.py tests/product/test_busted_main_site_gateway_v1.py
      - name: Validate actual JS API origin policy and all BUSTED entry JS imports
        run: |
          node --experimental-default-type=module tests/product/test_busted_api_origin.mjs
          node --check product/busted_site/static/js/awaken.js
          node --check product/busted_site/static/js/app.js
          node --check product/busted_site/static/js/product_shell.js
          node --check product/busted_site/static/js/api_gateway_v1.js
