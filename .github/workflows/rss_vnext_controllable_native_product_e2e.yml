name: RSS vNext authored puppet pose to native product E2E

on:
  push:
    branches: [main, feat/rss-vnext-controllable-to-runtime-v4-20261111]
    paths:
      - "compiler/realsas_compiler_services/export/playback_v4_control_bridge_v1.py"
      - "tests/compiler/test_playback_v4_control_bridge_v1.py"
      - "runtime/realsas_cpp/**"
      - ".github/workflows/rss_vnext_controllable_native_product_e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "compiler/realsas_compiler_services/export/playback_v4_control_bridge_v1.py"
      - "tests/compiler/test_playback_v4_control_bridge_v1.py"
      - ".github/workflows/rss_vnext_controllable_native_product_e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  controllable-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ libarchive-dev libpng-dev zlib1g-dev
          python -m pip install numpy scipy pytest pillow
      - name: Build native eight-view renderer
        run: |
          cmake -S runtime/realsas_cpp -B build/rss-vnext-native -DCMAKE_BUILD_TYPE=Release -DREALSAS_BUILD_TESTS=ON
          cmake --build build/rss-vnext-native --parallel 2
      - name: Compiled interaction to eight-view PNG and negative courts
        env:
          PYTHONPATH: .
          REALSAS_V4_NATIVE_DEMO: build/rss-vnext-native/realsas_runtime_v4_demo
        run: |
          python -m pytest -q tests/compiler/test_controllable_puppet_runtime_v1.py tests/compiler/test_playback_v4_control_bridge_v1.py
          ctest --test-dir build/rss-vnext-native --output-on-failure
