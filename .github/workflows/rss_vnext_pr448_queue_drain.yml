name: RSS vNext PR448 orphan queue cleanup

# Do not run on every code commit. One maintenance dispatch only.
# These are GitHub scheduler records (zero jobs), not self-hosted work.
on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/rss_vnext_pr448_queue_drain.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: rss-vnext-queue-drain-pr448
  cancel-in-progress: true

jobs:
  delete-orphaned-unstarted-pr448-checks:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.number == 448
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify orphan queue and delete safely if GitHub allows it
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            const pullNumber = 448;
            const targetBranch = "audit/rss-vnext-three-contract-v6-20261111";
            const {data: pr} = await github.rest.pulls.get({
              owner, repo, pull_number: pullNumber
            });
            if (pr.state !== "open" ||
                pr.head.ref !== targetBranch ||
                pr.head.repo.full_name !== `${owner}/${repo}` ||
                pr.base.ref !== "main") {
              throw new Error("RSS_PR448_QUEUE_CLEANUP_SCOPE_DRIFT");
            }
            const activeHead = pr.head.sha;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            const all = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {owner, repo, status: "queued", per_page: 100}
            );
            const stale = all.filter(run =>
              run.event === "pull_request" &&
              run.head_branch === targetBranch &&
              run.head_sha !== activeHead &&
              run.pull_requests?.some(p => p.number === pullNumber)
            );
            core.info(`Found ${stale.length} stale queued PR448 runs; protected ${activeHead}`);
            if (!stale.length) return;
            // GitHub may report status=queued despite NO job and reject both
            // cancel and force-cancel with 409. DELETE is the documented
            // separate REST endpoint. Probe EXACTLY ONE run before batching.
            const first = stale[0];
            const {data: jobs} = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: first.id, per_page: 1
            });
            if (jobs.total_count !== 0) {
              throw new Error(`RSS_QUEUE_NON_ORPHAN_JOB_PROTECTED:${first.id}`);
            }
            async function deleteRun(run) {
              return github.request("DELETE /repos/{owner}/{repo}/actions/runs/{run_id}", {
                owner, repo, run_id: run.id
              });
            }
            try {
              const response = await deleteRun(first);
              core.info(`Single-run DELETE probe ${first.id}: HTTP ${response.status}`);
              if (response.status !== 204) {
                throw new Error(`RSS_QUEUE_DELETE_HTTP_${response.status}`);
              }
            } catch (error) {
              core.error(`GitHub refused deletion of orphan ${first.id}: HTTP ${error.status}: ${error.message}`);
              core.error("This is a GitHub Actions scheduler inconsistency: queued, zero jobs, cancellation/force cancellation rejected.");
              core.error("Stop here; repository owner must escalate to GitHub Support. Do not retry hundreds of blocked requests.");
              throw new Error("RSS_QUEUE_GITHUB_BACKEND_SUPPORT_REQUIRED");
            }
            let deleted = 1;
            let transitioned = 0;
            const failures = [];
            // Only old queued + NO-JOB runs. Never remove completed CI,
            // current head, other branches or other PRs.
            for (const run of stale.slice(1)) {
              try {
                const {data: current} = await github.rest.actions.getWorkflowRun({
                  owner, repo, run_id: run.id
                });
                if (current.status !== "queued" ||
                    current.head_sha === activeHead ||
                    current.head_branch !== targetBranch ||
                    !current.pull_requests?.some(p => p.number === pullNumber)) {
                  transitioned++;
                  continue;
                }
                const {data: jobList} = await github.rest.actions.listJobsForWorkflowRun({
                  owner, repo, run_id: run.id, per_page: 1
                });
                if (jobList.total_count !== 0) {
                  failures.push({id:run.id, reason:"NONEMPTY_JOBS_PROTECTED"});
                  continue;
                }
                await deleteRun(run);
                deleted++;
              } catch (error) {
                failures.push({
                  id:run.id, status:error.status || 0, message:error.message
                });
                if (failures.length >= 5) {
                  core.warning("Five unexpected delete failures: fail-fast to avoid bulk damage/rate limits");
                  break;
                }
              }
              if (deleted % 25 === 0) {
                core.info(`Deleted ${deleted} orphaned PR448 queued run records`);
                await sleep(250);
              }
            }
            const after = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {owner, repo, status:"queued", per_page:100}
            );
            const remaining = after.filter(run =>
              run.event === "pull_request" &&
              run.head_branch === targetBranch &&
              run.head_sha !== activeHead &&
              run.pull_requests?.some(p => p.number === pullNumber)
            );
            const summary = {
              protected_current_sha: activeHead,
              deleted_orphaned_queued_records: deleted,
              transitioned_without_delete: transitioned,
              unexpected_failures: failures.slice(0, 8),
              remaining_old_pr448_queued: remaining.length,
              remaining_examples: remaining.slice(0, 10).map(x => x.id),
            };
            core.info(JSON.stringify(summary));
            await core.summary
              .addHeading("PR448 orphaned zero-job GitHub Actions queue")
              .addCodeBlock(JSON.stringify(summary, null, 2), "json")
              .write();
            if (failures.length || remaining.length) {
              core.setFailed("RSS_QUEUE_ORPHAN_CLEANUP_INCOMPLETE");
            }
