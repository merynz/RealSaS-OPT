name: rss-vnext-pretraining-mechanics-runtime

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'compiler/realsas_compiler_core/mechanics_*_v1.py'
      - 'tests/compiler/test_mechanics_*_v1.py'
      - '.github/workflows/rss_vnext_pretrain_mechanics_runtime_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pretraining-mechanics-court:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install mainline compiler CPU profile
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Deterministic secondary, multi-goal, grip and skin courts
        run: |
          python -m pytest -q \
            tests/compiler/test_mechanics_secondary_runtime_contract_v1.py \
            tests/compiler/test_mechanics_multigoal_solver_v1.py \
            tests/compiler/test_mechanics_live_multigoal_integration_v1.py \
            tests/compiler/test_mechanics_attachment_frames_v1.py \
            tests/compiler/test_mechanics_oriented_ik_v1.py \
            tests/compiler/test_mechanics_attachment_feasibility_v1.py \
            tests/compiler/test_mechanics_relative_attachment_bridge_v1.py \
            tests/compiler/test_mechanics_attachment_priority_v1.py \
            tests/compiler/test_mechanics_prepared_skin_v1.py
