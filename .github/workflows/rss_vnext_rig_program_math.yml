name: RSS vNext RigProgram source mathematics

on:
  push:
    branches: [feat/rigprogram-source-math-20261116, main]
    paths:
      - "models/rss_vnext/training_rig_program_grounding_v1.py"
      - "models/rss_vnext/training_engine.py"
      - "tests/models/test_rig_program_source_grounding_v1.py"
      - ".github/workflows/rss_vnext_rig_program_math.yml"
  pull_request:
    branches: [main]
    paths:
      - "models/rss_vnext/training_rig_program_grounding_v1.py"
      - "models/rss_vnext/training_engine.py"
      - "tests/models/test_rig_program_source_grounding_v1.py"
      - ".github/workflows/rss_vnext_rig_program_math.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-math:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU scientific stack
        run: |
          python -m pip install pytest numpy scipy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Source-grounded RigProgram math and structural trainer checks
        env:
          PYTHONPATH: .
        run: |
          python -m compileall -q models/rss_vnext/training_rig_program_grounding_v1.py models/rss_vnext/training_engine.py tests/models/test_rig_program_source_grounding_v1.py
          python -m pytest -q tests/models/test_rig_program_source_grounding_v1.py tests/models/test_rss_vnext_structural_trainer.py
