name: RSS vNext licensed-source supervision coverage court

on:
  push:
    branches: [main]
    paths:
      - 'tools/corpus/rss_vnext_source_supervision_coverage_v1.py'
      - 'tests/corpus/test_rss_vnext_source_supervision_coverage_v1.py'
      - '.github/workflows/rss_vnext_source_supervision_coverage_v1.yml'
  pull_request:
    paths:
      - 'tools/corpus/rss_vnext_source_supervision_coverage_v1.py'
      - 'tests/corpus/test_rss_vnext_source_supervision_coverage_v1.py'
      - '.github/workflows/rss_vnext_source_supervision_coverage_v1.yml'
  workflow_dispatch:

jobs:
  coverage-inventory-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Python test harness
        run: python -m pip install --disable-pip-version-check pytest==8.4.2
      - name: Fail-closed licensing and supervision coverage tests
        run: python -m pytest -q tests/corpus/test_rss_vnext_source_supervision_coverage_v1.py
