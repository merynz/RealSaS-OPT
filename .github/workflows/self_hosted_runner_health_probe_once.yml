name: self-hosted-runner-health-probe-once

on:
  push:
    branches:
      - restoration/compiler-runtime-promotion-v1-20260903
    paths:
      - '.github/workflows/self_hosted_runner_health_probe_once.yml'

permissions:
  contents: read

jobs:
  runner-health:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 5
    steps:
      - name: Runner identity and host health
        run: |
          set -euxo pipefail
          date -Is
          uname -a
          id
          pwd
          echo "RUNNER_NAME=${RUNNER_NAME:-unknown}"
          echo "RUNNER_OS=${RUNNER_OS:-unknown}"
          echo "RUNNER_ARCH=${RUNNER_ARCH:-unknown}"
          uptime
          free -h
          df -h /
          ulimit -a

      - name: System Python baseline
        run: |
          set -euxo pipefail
          command -v python3
          python3 --version
          python3 -m pip --version || true

      - name: HTTPS and DNS probe
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import socket, urllib.request
          print('github.com ->', socket.gethostbyname_ex('github.com'))
          print('pypi.org ->', socket.gethostbyname_ex('pypi.org'))
          with urllib.request.urlopen('https://pypi.org/simple/pytest/', timeout=20) as r:
              print('https_status=', r.status)
              print('content_type=', r.headers.get('content-type'))
          PY

      - name: Diagnostic sentinel expected failure
        run: |
          echo 'RUNNER_HEALTH_PHASE1_REACHED_SENTINEL'
          echo 'Expected diagnostic failure: runner stayed alive through host, Python, DNS and HTTPS probes.'
          exit 86
