name: single-family-data-contract-v1

on:
  pull_request:
    paths:
      - 'experiments/single_family_e2e_v1/data_manifest_v1.py'
      - 'experiments/single_family_e2e_v1/mechanical_truth_adapter_v1.py'
      - 'experiments/single_family_e2e_v1/test_data_contract_v1.py'
      - '.github/workflows/single_family_data_contract_v1.yml'
  push:
    branches:
      - source/generic-completion-v1-20260902
    paths:
      - 'experiments/single_family_e2e_v1/data_manifest_v1.py'
      - 'experiments/single_family_e2e_v1/mechanical_truth_adapter_v1.py'
      - 'experiments/single_family_e2e_v1/test_data_contract_v1.py'
      - '.github/workflows/single_family_data_contract_v1.yml'

jobs:
  single-family-data-contract-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow pytest
      - name: Compile data source
        run: |
          python -m py_compile \
            experiments/single_family_e2e_v1/data_manifest_v1.py \
            experiments/single_family_e2e_v1/mechanical_truth_adapter_v1.py
      - name: Run data authority gates
        run: |
          python -m pytest -q experiments/single_family_e2e_v1/test_data_contract_v1.py
