name: source-edge-probe-repartition-unit-v1

on:
  workflow_dispatch:
  push:
    branches: [research/vf11-certified-adaptive-20260921]
    paths:
      - 'compiler/realsas_compiler_core/mesh/skin_topology_compatibility_v1.py'
      - 'compiler/realsas_compiler_services/orchestrator/adapters/mesh_v2.py'
      - 'tests/compiler/test_source_edge_probe_repartition_v1.py'
      - '.github/workflows/source_edge_probe_repartition_unit_v1.yml'

concurrency:
  group: source-edge-probe-repartition-unit-v1
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Source-edge probe repartition tests
        run: |
          set -euo pipefail
          python -m py_compile compiler/realsas_compiler_core/mesh/skin_topology_compatibility_v1.py
          PYTHONPATH=. pytest -q tests/compiler/test_source_edge_probe_repartition_v1.py tests/compiler/test_mechanical_repartition_v2.py
