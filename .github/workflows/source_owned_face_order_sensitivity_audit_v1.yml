name: source-owned-face-order-sensitivity-audit-v1

on:
  push:
    branches: [audit/appearance-runtime-dataflow-20261002]
    paths:
      - 'tools/audit_source_owned_face_order_sensitivity_v1.py'
      - '.github/workflows/source_owned_face_order_sensitivity_audit_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Run face-order sensitivity audit
        env:
          PYTHONPATH: .
        run: |
          python tools/audit_source_owned_face_order_sensitivity_v1.py             --out /tmp/source_owned_face_order_sensitivity.json
          cat /tmp/source_owned_face_order_sensitivity.json
      - uses: actions/upload-artifact@v4
        with:
          name: source-owned-face-order-sensitivity-audit-v1
          path: /tmp/source_owned_face_order_sensitivity.json
          if-no-files-found: error
