name: source-owned-visual-runtime-wiring-gate-v1

on:
  push:
    branches:
      - integration/generic-main-normalization-v2-20260930
    paths:
      - '.github/workflows/source_owned_visual_runtime_wiring_gate_v1.yml'
      - 'tests/repository/test_source_owned_visual_runtime_wiring_v1.py'
      - 'compiler/realsas_compiler_core/product_state_v2.py'
      - 'compiler/realsas_compiler_core/runtime_authority_v2.py'
      - 'compiler/realsas_compiler_core/runtime_package_v2.py'
      - 'compiler/realsas_compiler_services/orchestrator/adapters/product_state_v2.py'
      - 'compiler/realsas_compiler_services/orchestrator/adapters/runtime_v2.py'
      - 'canonical/MAINLINE_EXECUTION_PLAN_V2.json'
  workflow_dispatch:

concurrency:
  group: source-owned-visual-runtime-wiring-gate-v1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wiring:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run visual-runtime authority wiring gate
        run: |
          python -m pytest -q tests/repository/test_source_owned_visual_runtime_wiring_v1.py
