name: source-ray-appearance-platform-admission-fit8-v1

on:
  pull_request:
    paths:
      - 'canonical/SOURCE_RAY_APPEARANCE_ADMISSION_REQUEST_V1.json'
      - 'tools/truth_foundry/source_ray_admission_activation_v1.py'
      - 'tests/truth_foundry/test_source_ray_admission_activation_v1.py'
      - 'compiler/realsas_compiler_services/orchestrator/adapters/source_ray_appearance_platform_v1.py'
      - 'tools/truth_foundry/build_source_ray_appearance_platform_bundle_v1.py'
      - 'tools/platform_source_ray_appearance_admission_v1.py'
      - 'tests/truth_foundry/test_source_ray_appearance_platform_admission_v1.py'
      - 'tests/truth_foundry/test_source_ray_appearance_platform_bundle_v1.py'
      - 'tests/truth_foundry/test_source_ray_appearance_platform_plan_v1.py'
      - '.github/workflows/source_ray_appearance_platform_admission_fit8_v1.yml'
  push:
    branches: [main]
    paths:
      - 'canonical/SOURCE_RAY_APPEARANCE_ADMISSION_REQUEST_V1.json'
      - 'tools/truth_foundry/source_ray_admission_activation_v1.py'
      - 'tests/truth_foundry/test_source_ray_admission_activation_v1.py'
      - 'compiler/realsas_compiler_services/orchestrator/adapters/source_ray_appearance_platform_v1.py'
      - 'tools/truth_foundry/build_source_ray_appearance_platform_bundle_v1.py'
      - 'tools/platform_source_ray_appearance_admission_v1.py'
      - 'tests/truth_foundry/test_source_ray_appearance_platform_admission_v1.py'
      - 'tests/truth_foundry/test_source_ray_appearance_platform_bundle_v1.py'
      - 'tests/truth_foundry/test_source_ray_appearance_platform_plan_v1.py'
      - '.github/workflows/source_ray_appearance_platform_admission_fit8_v1.yml'
  workflow_dispatch:
  workflow_run:
    workflows: [platform-developer-deployment]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: source-ray-appearance-platform-admission-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-contract:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      decision: ${{ steps.resolve.outputs.decision }}
      expected_sha: ${{ steps.resolve.outputs.expected_sha }}
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-court dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy
      - name: Run admission source courts
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/truth_foundry/test_source_ray_appearance_platform_admission_v1.py \
            tests/truth_foundry/test_source_ray_appearance_platform_bundle_v1.py \
            tests/truth_foundry/test_source_ray_appearance_platform_plan_v1.py \
            tests/truth_foundry/test_source_ray_admission_activation_v1.py
          python -m py_compile \
            compiler/realsas_compiler_services/orchestrator/adapters/source_ray_appearance_platform_v1.py \
            tools/truth_foundry/build_source_ray_appearance_platform_bundle_v1.py \
            tools/platform_source_ray_appearance_admission_v1.py

      - name: Resolve explicit admission request
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
          DEPLOYMENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: python tools/truth_foundry/source_ray_admission_activation_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: source-ray-admission-decision-${{ github.run_id }}
          path: source-ray-admission-decision.json
          if-no-files-found: error
          retention-days: 30

  platform-registry-admission:
    if: needs.source-contract.outputs.decision == 'RUN'
    needs: source-contract
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PLATFORM_ROOT: /home/monster/realsas_platform
      EXPECTED_SHA: ${{ needs.source-contract.outputs.expected_sha }}
      RECEIPT_PATH: /home/monster/realsas_platform/research-results/source-ray-appearance-platform-admission-v1/${{ github.run_id }}-${{ github.run_attempt }}/receipt.json
      COURT_RUN_ID: '40544781242'
      COURT_ARTIFACT_ID: '12751917983'
      COURT_ARTIFACT_NAME: source-ray-appearance-source-equivalence-fit8-v1-40544781242
      COURT_ARTIFACT_DIGEST: sha256:a63940ef7bb9064f42941f595089b85bb120a7f53a271b7392b0db3c2dbe01dc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - name: Require exact deployed canonical main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
          /home/monster/realsas_platform/current/bin/realsas-python - <<'PY'
          import json, os
          from pathlib import Path
          deployment = json.loads(Path('/home/monster/realsas_platform/deployment.json').read_text())
          assert deployment.get('state') == 'SERVICES_ACTIVE', 'SOURCE_RAY_APPEARANCE_DEPLOYMENT_NOT_ACTIVE'
          assert deployment.get('code_sha') == os.environ['EXPECTED_SHA'], 'SOURCE_RAY_APPEARANCE_DEPLOYED_MAIN_DRIFT'
          PY
      - name: Fetch pinned #243 court artifact
        run: |
          set -euo pipefail
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${COURT_ARTIFACT_ID}" --jq .digest)"
          test "$actual" = "$COURT_ARTIFACT_DIGEST"
          work="$RUNNER_TEMP/source-ray-appearance-243"
          rm -rf "$work"
          mkdir -p "$work"
          gh run download "$COURT_RUN_ID" -n "$COURT_ARTIFACT_NAME" --dir "$work"
          test -f "$work/SOURCE_RAY_APPEARANCE_SOURCE_EQUIVALENCE_FIT8_V1.json"
          test "$(find "$work/subjects" -mindepth 2 -maxdepth 2 -name PACKED_A.json | wc -l)" -eq 8
      - name: Build exact unqualified Platform input bundle
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/source-ray-appearance-243"
          bundle="$RUNNER_TEMP/source-ray-appearance-platform-bundle.json"
          args=()
          while IFS= read -r path; do
            args+=(--measurement "$path")
          done < <(find "$work/subjects" -mindepth 2 -maxdepth 2 -name PACKED_A.json | sort)
          /home/monster/realsas_platform/current/bin/realsas-python \
            tools/truth_foundry/build_source_ray_appearance_platform_bundle_v1.py \
            --court "$work/SOURCE_RAY_APPEARANCE_SOURCE_EQUIVALENCE_FIT8_V1.json" \
            "${args[@]}" \
            --out "$bundle"
      - name: Execute real Platform CAS and Registry admission
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$RECEIPT_PATH")"
          /home/monster/realsas_platform/current/bin/realsas-python \
            tools/platform_source_ray_appearance_admission_v1.py \
            --root "$PLATFORM_ROOT" \
            --bundle "$RUNNER_TEMP/source-ray-appearance-platform-bundle.json" \
            --expected-main-sha "$EXPECTED_SHA" \
            --out "$RECEIPT_PATH"
      - name: Preserve admission receipt mirror
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-ray-appearance-platform-admission-fit8-v1-${{ github.run_id }}
          path: ${{ env.RECEIPT_PATH }}
          if-no-files-found: error
          retention-days: 30

  finalize:
    needs: [source-contract, platform-registry-admission]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      SOURCE_RESULT: ${{ needs.source-contract.result }}
      DECISION: ${{ needs.source-contract.outputs.decision }}
      ADMISSION_RESULT: ${{ needs.platform-registry-admission.result }}
    steps:
      - name: Require the selected admission outcome
        run: |
          python - <<'PY'
          import os
          assert os.environ['SOURCE_RESULT'] == 'success', 'SOURCE_RAY_ADMISSION_SOURCE_FAILED'
          decision = os.environ['DECISION']
          assert decision in {'RUN', 'NOOP'}, 'SOURCE_RAY_ADMISSION_DECISION_INVALID'
          expected = 'success' if decision == 'RUN' else 'skipped'
          assert os.environ['ADMISSION_RESULT'] == expected, 'SOURCE_RAY_ADMISSION_EXPECTED_OUTCOME_MISSING'
          print('SOURCE_RAY_ADMISSION_OUTCOME_PASS', decision, expected)
          PY
