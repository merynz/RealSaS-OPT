name: stage14-mechanical-capacity-curve
on:
  push:
    branches: [research/stage14-mechanical-capacity-curve-20260919]
    paths: ['tools/stage14_mechanical_capacity_curve.py','.github/workflows/stage14_mechanical_capacity_curve.yml']
  workflow_dispatch:
jobs:
  curve:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 45
    env: {PYTHONPATH: ., OMP_NUM_THREADS: '1', MKL_NUM_THREADS: '1', OPENBLAS_NUM_THREADS: '1', REALSAS_STAGE14_CURVE_OUT: stage14_curve_out}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - run: python tools/stage14_mechanical_capacity_curve.py
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: stage14-mechanical-capacity-curve, path: stage14_curve_out/, if-no-files-found: error}
