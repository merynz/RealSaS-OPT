name: stage35-orientation-inversion-adversary-v1

on:
  workflow_dispatch:
  push:
    branches:
      - research/vf11-certified-adaptive-20260921
    paths:
      - 'tools/audit_stage35_orientation_inversion_v1.py'
      - '.github/workflows/stage35_orientation_inversion_adversary_v1.yml'

concurrency:
  group: stage35-orientation-inversion-adversary-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        run: python -m pip install --no-input --progress-bar off numpy scipy
      - name: Run adversary
        run: |
          set -euo pipefail
          PYTHONPATH=. python tools/audit_stage35_orientation_inversion_v1.py | tee /tmp/stage35_orientation.txt
      - name: Seal evidence
        run: |
          set -euo pipefail
          mkdir -p canonical/stage35_orientation_inversion_adversary_v1
          cp /tmp/stage35_orientation.txt canonical/stage35_orientation_inversion_adversary_v1/AUDIT_STDOUT.txt
          git config user.name realsas-self-hosted-runner
          git config user.email runner@realsas.local
          git add canonical/STAGE35_ORIENTATION_INVERSION_ADVERSARY_V1_20260928.json canonical/stage35_orientation_inversion_adversary_v1
          git commit -m 'audit: seal Stage35 orientation inversion evidence'
          git fetch origin research/vf11-certified-adaptive-20260921
          git rebase origin/research/vf11-certified-adaptive-20260921
          git push origin HEAD:research/vf11-certified-adaptive-20260921
