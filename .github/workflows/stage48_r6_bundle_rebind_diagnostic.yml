name: stage48-r6-bundle-rebind-diagnostic

on:
  push:
    branches: [stage48-bundle-subject-binding-fix]
    paths:
      - '.github/workflows/stage48_r6_bundle_rebind_diagnostic.yml'

permissions:
  contents: read

jobs:
  rebind:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 15
    env:
      PLATFORM_ROOT: /home/monster/realsas_platform
      R6_ROOT: /home/monster/realsas_authority/presentation_truth_preparation/40782479846-1
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Build exact V3 bundle from completed r6 evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f "$R6_ROOT/evidence/OBSERVATION.json"
          OUT="$RUNNER_TEMP/stage48-r6-v3-bundle"
          rm -rf "$OUT"
          "$PLATFORM_ROOT/current/bin/realsas-python" tools/truth_foundry/build_fit8_presentation_truth_bundle_v3.py \
            --observation "$R6_ROOT/evidence/OBSERVATION.json" \
            --artifact-root "$PLATFORM_ROOT/artifacts" \
            --repo-root "$GITHUB_WORKSPACE" \
            --output "$OUT"
          "$PLATFORM_ROOT/current/bin/realsas-python" - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'stage48-r6-v3-bundle'
          b=json.loads((root/'FIT8_PRESENTATION_TRUTH_BUNDLE_V1.json').read_text())
          assert b['bundle_builder_revision']=='V2_OBJECTIVE_EXACT_OBSERVABILITY_COUNTS'
          assert b['subject_binding_revision']=='V3_PLATFORM_UUID_TO_LOGICAL_KEY_FROM_EXACT_STAGE48_PAYLOAD'
          assert len(b['cohort'])==8
          assert {r['subject_id'] for r in b['cohort']}=={
            'fit8_snake_v1','fit8_bat_v1','fit8_trex_v1','fit8_horse_v1',
            'fit8_spider_v1','fit8_greenblob_v1','fit8_shark_v1','fit8_george_v1'}
          assert b['regression_subjects']==['knight']
          assert b['regression_bindings'][0]['producer_subject_id']=='SUBJECT2_KNIGHT'
          assert b['aggregate_counts']['observable_appearance_hits']>0
          print(json.dumps({'status':'PASS_R6_REAL_EVIDENCE_V3_REBIND','cohort':len(b['cohort']),'aggregate_counts':b['aggregate_counts']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage48-r6-v3-bundle-${{ github.run_id }}
          path: ${{ runner.temp }}/stage48-r6-v3-bundle/
          if-no-files-found: error
          retention-days: 7
