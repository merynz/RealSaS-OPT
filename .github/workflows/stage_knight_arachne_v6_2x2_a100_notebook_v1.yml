name: stage-knight-arachne-v6-2x2-a100-notebook-v1

on:
  workflow_dispatch:
  push:
    branches: [research/vf11-certified-adaptive-20260921]
    paths:
      - 'tools/training/run_knight_arachne_v6_coverage_sampling_2x2_v1.py'
      - 'tools/audit_knight_arachne_v6_coverage_sampling_2x2_results_v1.py'
      - 'canonical/KNIGHT_ARACHNE_V6_COVERAGE_SAMPLING_2X2_PREREG_V1_20260929.json'
      - '.github/workflows/stage_knight_arachne_v6_2x2_a100_notebook_v1.yml'

concurrency:
  group: stage-knight-arachne-v6-2x2-a100-notebook-v1
  cancel-in-progress: true

permissions: {contents: read}

jobs:
  stage:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 15
    env:
      BASE: gdrive:RealSaS_SUBJECT2_KNIGHT_DEMO_V2_20260924
      V6_OUT: gdrive:RealSaS_SUBJECT2_KNIGHT_DEMO_V2_20260924/ARACHNE_STAGE31_V6_DEMO_OUTPUT
      APP_DST: gdrive:RealSaS_SUBJECT2_KNIGHT_DEMO_V2_20260924/ARACHNE_V6_COVERAGE_SAMPLING_2X2_20260929/_APPARATUS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Build frozen apparatus and Run-All notebook
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp tools/training/run_knight_arachne_v6_coverage_sampling_2x2_v1.py "$tmp/"
          cp tools/audit_knight_arachne_v6_coverage_sampling_2x2_results_v1.py "$tmp/"
          cp canonical/KNIGHT_ARACHNE_V6_COVERAGE_SAMPLING_2X2_PREREG_V1_20260929.json "$tmp/"
          rclone copyto "$V6_OUT/run_knight_arachne_v6_demo_closure_v1.py" "$tmp/run_knight_arachne_v6_demo_closure_v1.py" --checksum
          rclone copyto "$V6_OUT/KNIGHT_ARACHNE_V6_DEMO_CLOSURE_PREREG_V1_20260926.json" "$tmp/KNIGHT_ARACHNE_V6_DEMO_CLOSURE_PREREG_V1_20260926.json" --checksum

          python - "$tmp" "${GITHUB_SHA}" <<'PY'
          import hashlib,json,sys
          from pathlib import Path

          root=Path(sys.argv[1]); commit=sys.argv[2]
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(8<<20),b''): h.update(b)
              return h.hexdigest()

          names=[
              'run_knight_arachne_v6_coverage_sampling_2x2_v1.py',
              'audit_knight_arachne_v6_coverage_sampling_2x2_results_v1.py',
              'KNIGHT_ARACHNE_V6_COVERAGE_SAMPLING_2X2_PREREG_V1_20260929.json',
              'run_knight_arachne_v6_demo_closure_v1.py',
              'KNIGHT_ARACHNE_V6_DEMO_CLOSURE_PREREG_V1_20260926.json',
          ]
          manifest={
              'schema':'RealSaS.KnightArachneV6CoverageSampling2x2Apparatus.v1',
              'status':'FROZEN_BEFORE_A100_OPTIMIZER_STEP_1',
              'repo_commit':commit,
              'files':{name:sha(root/name) for name in names},
              'historical_control':{
                  'result_sha256':'42424db07f9e928bdad33a22fc5eed7c5507f4b20627731d62486eeb4f66d995',
                  'closure_step':8192,
                  'terminal_check_steps':[7680,7936,8192],
                  'wall_seconds':121.81457332699983,
                  'gpu':'NVIDIA A100-SXM4-40GB',
              },
              'product_authority_claimed':False,
              'generalization_claimed':False,
          }
          (root/'STAGING_MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')

          setup = r'''from google.colab import drive
drive.mount('/content/drive')
from pathlib import Path
import hashlib,json,os,shutil,subprocess,sys,time
import torch

BASE=Path('/content/drive/MyDrive/RealSaS_SUBJECT2_KNIGHT_DEMO_V2_20260924')
APP=BASE/'ARACHNE_V6_COVERAGE_SAMPLING_2X2_20260929'/'_APPARATUS'
DRIVE_ROOT=BASE/'ARACHNE_V6_COVERAGE_SAMPLING_2X2_20260929'/'ARMS'
LOCAL_ROOT=Path('/content/knight_arachne_v6_2x2')
LOCAL_ROOT.mkdir(parents=True,exist_ok=True); DRIVE_ROOT.mkdir(parents=True,exist_ok=True)

WRAPPER=APP/'run_knight_arachne_v6_coverage_sampling_2x2_v1.py'
EVALUATOR=APP/'audit_knight_arachne_v6_coverage_sampling_2x2_results_v1.py'
EXP_PREREG=APP/'KNIGHT_ARACHNE_V6_COVERAGE_SAMPLING_2X2_PREREG_V1_20260929.json'
V6_SOURCE=APP/'run_knight_arachne_v6_demo_closure_v1.py'
V6_PREREG=APP/'KNIGHT_ARACHNE_V6_DEMO_CLOSURE_PREREG_V1_20260926.json'
MANIFEST=APP/'STAGING_MANIFEST.json'

SURFACE=BASE/'GEPPETTO_STAGE27_HANDOFF'/'qualified_rigging_surface.json'
SKELETON=BASE/'ARACHNE_STAGE31_V5_DEMO_HANDOFF'/'FINAL_QUALIFIED_SKELETON_IR.json'
BANK=BASE/'ARACHNE_STAGE31_V5_DEMO_HANDOFF'/'ARACHNE_KNIGHT_TEACHER_BANK_FIX2.npz'
SOURCE_PROGRESS=BASE/'ARACHNE_STAGE31_V5_DEMO_LIVE_V3_DISCONNECT_SAFE'/'ARACHNE_KNIGHT_PROGRESS.pt'

def sha(p):
    h=hashlib.sha256()
    with open(p,'rb') as f:
        for b in iter(lambda:f.read(8<<20),b''): h.update(b)
    return h.hexdigest()

m=json.loads(MANIFEST.read_text())
assert m['status']=='FROZEN_BEFORE_A100_OPTIMIZER_STEP_1',m
for name,expected in m['files'].items():
    p=APP/name
    assert p.is_file(),p
    assert sha(p)==expected,(name,sha(p),expected)

expected={
    SURFACE:'7b71969e12316503dd1cd540b3fa2a17e5cbc96a9b04c03aed88d69077f79182',
    SKELETON:'73639a8470ac2d1909ff8e76dfa55a03fb0f952d2bfe7c2e7ed52ef7d828353e',
    BANK:'26b6891ff81b9bfc3405461394159547fa76b417852a44518425b4e1de7e67d3',
    SOURCE_PROGRESS:'49e189b9ed2ab473a9e36e47fdd0b1e0d6342be5883734a1067a717fdd4c457f',
    V6_SOURCE:'39ff4f7a2051f0d9c1251a5999f472b9926e83deacbedcedc8e92eea424dce01',
    V6_PREREG:'187f5c1bac1e813ebdfd1bbb76fa6def3d6543b4c7abc5609d217b3ece5fd597',
}
for p,h in expected.items():
    assert p.is_file(),p
    assert sha(p)==h,(p,sha(p),h)

assert torch.cuda.is_available(),'CUDA_REQUIRED'
props=torch.cuda.get_device_properties(0)
free,total=torch.cuda.mem_get_info()
assert 'A100' in props.name,props.name
assert torch.cuda.is_bf16_supported(),'BF16_REQUIRED'
assert free>=24*1024**3,(props.name,free/1024**3)
print('A100_PREFLIGHT_PASS',{'gpu':props.name,'free_gib':round(free/1024**3,2),'torch':torch.__version__})
'''

          preflight = r'''ARMS=['UNIFORM_VALID','ACTIVE_BALANCED_VALID','UNIFORM_ALL_PROJECTED','ACTIVE_BALANCED_ALL_PROJECTED']
for arm in ARMS:
    out=LOCAL_ROOT/'PREFLIGHT'/arm
    out.mkdir(parents=True,exist_ok=True)
    cmd=[sys.executable,str(WRAPPER),
         '--arm',arm,
         '--experiment-prereg',str(EXP_PREREG),
         '--v6-source',str(V6_SOURCE),
         '--v6-prereg',str(V6_PREREG),
         '--teacher-bank',str(BANK),
         '--output-dir',str(out),
         '--preflight-only']
    print('+',' '.join(cmd),flush=True)
    subprocess.run(cmd,check=True)
print('FOUR_ARM_PREFLIGHT_PASS')
'''

          runarms = r'''def mirror_arm(local_dir,drive_dir):
    drive_dir.mkdir(parents=True,exist_ok=True)
    for p in local_dir.glob('*'):
        if p.is_file():
            try: shutil.copy2(p,drive_dir/p.name)
            except Exception as exc: print('MIRROR_WARNING',p.name,repr(exc),flush=True)

def run_arm(arm):
    local_dir=LOCAL_ROOT/'ARMS'/arm
    drive_dir=DRIVE_ROOT/arm
    local_dir.mkdir(parents=True,exist_ok=True); drive_dir.mkdir(parents=True,exist_ok=True)
    progress_name='ARACHNE_KNIGHT_V6_PROGRESS.pt'
    if not (local_dir/progress_name).is_file() and (drive_dir/progress_name).is_file():
        shutil.copy2(drive_dir/progress_name,local_dir/progress_name)
        print('RESTORED_PROGRESS',arm,flush=True)
    log_path=local_dir/'A100_CONSOLE.log'
    cmd=[sys.executable,str(WRAPPER),
         '--arm',arm,
         '--experiment-prereg',str(EXP_PREREG),
         '--v6-source',str(V6_SOURCE),
         '--v6-prereg',str(V6_PREREG),
         '--teacher-bank',str(BANK),
         '--surface-json',str(SURFACE),
         '--skeleton-json',str(SKELETON),
         '--source-progress',str(SOURCE_PROGRESS),
         '--output-dir',str(local_dir)]
    print('\n=== RUN',arm,'===',flush=True)
    print('+',' '.join(cmd),flush=True)
    last_mirror=time.monotonic()
    with log_path.open('a',encoding='utf-8') as log:
        proc=subprocess.Popen(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,bufsize=1,start_new_session=True)
        try:
            for line in proc.stdout:
                print(line,end='',flush=True); log.write(line); log.flush()
                now=time.monotonic()
                if now-last_mirror>=20:
                    mirror_arm(local_dir,drive_dir); last_mirror=now
            rc=proc.wait()
        except KeyboardInterrupt:
            import signal
            os.killpg(proc.pid,signal.SIGTERM)
            proc.wait(timeout=15)
            mirror_arm(local_dir,drive_dir)
            raise
    mirror_arm(local_dir,drive_dir)
    if rc!=0: raise RuntimeError(f'ARM_CHILD_FAILED::{arm}::{rc}')
    result_path=local_dir/'ARACHNE_KNIGHT_V6_RESULT.json'
    assert result_path.is_file(),result_path
    result=json.loads(result_path.read_text())
    print('ARM_DONE',arm,result.get('status'),result.get('closure_step'),'wall',result.get('wall_seconds'))
    return result

results={}
for arm in ARMS:
    results[arm]=run_arm(arm)
    if arm=='UNIFORM_VALID':
        r=results[arm]
        assert r.get('status')=='PASS',r
        assert int(r.get('closure_step'))==8192,r.get('closure_step')
        assert list(r.get('terminal_check_steps'))==[7680,7936,8192],r.get('terminal_check_steps')
        print('HISTORICAL_CONTROL_REPRO_PASS')
'''

          evaluate = r'''audit_path=LOCAL_ROOT/'ARACHNE_V6_2X2_RESULT_AUDIT.json'
cmd=[sys.executable,str(EVALUATOR),'--teacher-bank',str(BANK),'--root',str(LOCAL_ROOT/'ARMS'),'--out',str(audit_path)]
print('+',' '.join(cmd),flush=True)
subprocess.run(cmd,check=True)
shutil.copy2(audit_path,DRIVE_ROOT/'ARACHNE_V6_2X2_RESULT_AUDIT.json')
audit=json.loads(audit_path.read_text())
print('\n=== 2X2 RESULT SUMMARY ===')
for arm,row in audit['arms'].items():
    print(arm,
          'closure=',row['closure_step'],
          'wall=',round(float(row['wall_seconds']),2) if row['wall_seconds'] is not None else None,
          'valid_p95=',row['valid']['row_l1_p95'],
          'invalid_p95=',row['invalid']['row_l1_p95'],
          'invalid_gt1=',row['invalid']['row_l1_gt_1'],
          'all_p99=',row['all']['row_l1_p99'])
print('NO_PROMOTION_YET__DOWNSTREAM_TOPOLOGY_REPLAY_REQUIRED')
'''

          nb={
              'nbformat':4,'nbformat_minor':5,
              'metadata':{'accelerator':'GPU','colab':{'gpuType':'A100','provenance':[]},'kernelspec':{'display_name':'Python 3','language':'python','name':'python3'}},
              'cells':[
                  {'cell_type':'markdown','metadata':{},'source':[
                      '# RealSaS — Knight Arachne V6 Coverage × Sampling 2×2 Court — A100 Run All\n',
                      '\n',
                      '**Preregistered causal court.** Exact V6 backbone remains frozen; only the 1.619M readout is optimized.\n',
                      '\n',
                      'Historical control: 8192-step closure in 121.8146 seconds on A100-SXM4-40GB. Control reproduction is fail-closed before experimental arms continue.\n',
                      '\n',
                      'Run **Runtime → Run all** on an A100. Outputs mirror to Drive after each arm and every ~20 seconds during execution.\n',
                  ]},
                  {'cell_type':'code','execution_count':None,'metadata':{},'outputs':[],'source':[x+'\n' for x in setup.splitlines()]},
                  {'cell_type':'code','execution_count':None,'metadata':{},'outputs':[],'source':[x+'\n' for x in preflight.splitlines()]},
                  {'cell_type':'code','execution_count':None,'metadata':{},'outputs':[],'source':[x+'\n' for x in runarms.splitlines()]},
                  {'cell_type':'code','execution_count':None,'metadata':{},'outputs':[],'source':[x+'\n' for x in evaluate.splitlines()]},
              ],
          }
          (root/'RealSaS_KNIGHT_ARACHNE_V6_COVERAGE_SAMPLING_2X2_A100_RUN_ALL.ipynb').write_text(json.dumps(nb,indent=1)+'\n')
          PY

          python -m json.tool "$tmp/RealSaS_KNIGHT_ARACHNE_V6_COVERAGE_SAMPLING_2X2_A100_RUN_ALL.ipynb" >/dev/null
          python -m py_compile "$tmp/run_knight_arachne_v6_coverage_sampling_2x2_v1.py" "$tmp/audit_knight_arachne_v6_coverage_sampling_2x2_results_v1.py"
          cat "$tmp/STAGING_MANIFEST.json"
          rclone copy "$tmp" "$APP_DST" --checksum
          echo "ARACHNE_2X2_A100_APPARATUS_STAGED=$APP_DST"
