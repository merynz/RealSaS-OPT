name: static-proposal-mechanical-admissibility-contract-v1

on:
  push:
    branches: [audit/canonical-caa-mechanics-geometry-lock-20261002]
    paths:
      - compiler/realsas_compiler_core/canonical_mesh_quality_topology_safe_flip_v2.py
      - compiler/realsas_compiler_core/canonical_mesh_quality_batched_collapse_v2.py
      - compiler/realsas_compiler_core/canonical_mesh_quality_cavity_remesh_v1.py
      - compiler/realsas_compiler_core/canonical_mesh_quality_edge_cavity_remesh_v1.py
      - compiler/realsas_compiler_core/mesh/mechanical_proposal_admissibility_v1.py
      - tools/audit_knight_static_quality_split_cycle_v8.py
      - tests/compiler/test_canonical_mesh_quality_topology_safe_flip_v2.py
      - tests/compiler/test_canonical_mesh_quality_batched_collapse_v2.py
      - tests/compiler/test_canonical_mesh_quality_cavity_remesh_v1.py
      - tests/compiler/test_canonical_mesh_quality_edge_cavity_remesh_v1.py
      - tests/compiler/test_mechanical_proposal_admissibility_v1.py
      - tests/compiler/test_split_mechanical_support_preservation_v1.py
      - .github/workflows/static_proposal_mechanical_admissibility_contract_v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - run: |
          python -m pytest -q \
            tests/compiler/test_canonical_mesh_quality_topology_safe_flip_v2.py \
            tests/compiler/test_canonical_mesh_quality_batched_collapse_v2.py \
            tests/compiler/test_canonical_mesh_quality_cavity_remesh_v1.py \
            tests/compiler/test_canonical_mesh_quality_edge_cavity_remesh_v1.py \
            tests/compiler/test_mechanical_proposal_admissibility_v1.py \
            tests/compiler/test_split_mechanical_support_preservation_v1.py
