name: structural-evidence-ab-execution-binding-v2

on:
  pull_request:
    paths:
      - 'canonical/STRUCTURAL_EVIDENCE_AB_EXECUTION_BINDING_V2.json'
      - 'tests/iris/test_structural_evidence_ab_execution_binding_v2.py'
      - '.github/workflows/structural-evidence-ab-execution-binding-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execution-binding-v2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --no-input --progress-bar off pytest==8.4.1
      - name: Compile binding test
        run: python -m py_compile tests/iris/test_structural_evidence_ab_execution_binding_v2.py
      - name: Run binding contract test
        env:
          PYTHONPATH: .
        run: python -m pytest -q -s tests/iris/test_structural_evidence_ab_execution_binding_v2.py
