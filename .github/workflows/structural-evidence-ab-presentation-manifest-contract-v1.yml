name: structural-evidence-ab-presentation-manifest-contract-v1

on:
  pull_request:
    paths:
      - 'tools/iris_vnext/normalize_direct_presentation_manifest_contract_v1.py'
      - 'tests/iris/test_direct_presentation_manifest_contract_v1.py'
      - '.github/workflows/structural-evidence-ab-presentation-manifest-contract-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  presentation-manifest-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --no-input --progress-bar off pytest==8.4.1
      - name: Compile compatibility source
        run: |
          python -m py_compile \
            tools/iris_vnext/normalize_direct_presentation_manifest_contract_v1.py \
            tests/iris/test_direct_presentation_manifest_contract_v1.py
      - name: Run presentation manifest contract tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q -s tests/iris/test_direct_presentation_manifest_contract_v1.py
