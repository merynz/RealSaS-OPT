name: subject2-knight-demo-arachne-v6-ingest

on:
  push:
    branches:
      - research/vf11-certified-adaptive-20260921
    paths:
      - 'canonical/KNIGHT_DEMO_GEPPETTO_STAGE29_V2_RECEIPT_20260926.json'
  workflow_dispatch:

concurrency:
  group: subject2-knight-demo-v2-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest-qualify-seal:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 60
    env:
      RUN_ID: SUBJECT2_KNIGHT_DEMO_V2_20260924
      RUN_ROOT: /home/monster/realsas_authority/runs/SUBJECT2_KNIGHT_DEMO_V2_20260924
      ARACHNE_REMOTE: gdrive:RealSaS_SUBJECT2_KNIGHT_DEMO_V2_20260924/ARACHNE_STAGE31_V6_DEMO_OUTPUT
      ARACHNE_HANDOFF_REMOTE: gdrive:RealSaS_SUBJECT2_KNIGHT_DEMO_V2_20260924/ARACHNE_STAGE31_V6_DEMO_HANDOFF
      EXPECTED_SURFACE_LINEAGE: 452cf6564a2cde35a4d6d420021491d231f90cec267df9f41d4424dc8d74895a
      EXPECTED_SKELETON_LINEAGE: e54548b5dbd39e399fbd901edaef57efee167b665c9628f1f38820fa62c34850
      EXPECTED_SEMANTIC_TREE_SHA256: 95f6f224f52ba43dd96296ce877a11851037e939640a4c995e2b9f3e874c7f59
      HISTORICAL_V6_SKELETON_LINEAGE: c2727bcf4f4b7f4bfbc8e4af24b8d731dd0892beee10608862f0943e4daebcce
      HISTORICAL_V6_SKIN_LINEAGE: 3fa8dacae0d52b86193f14f6cb0214ed68d8d40035317e367b335d9c06a48397
      EXPECTED_MODEL_SHA256: bfd2bd24f55bdce2dc36b0ae6a7afe01b8381c680de545c66a11a3d707fe73ed
      EXPECTED_WEIGHTS_SHA256: a0a3e652e323c6f2042354eb2095f3f66ff6168bf5ab51b53c83f728b8a00499
      EXPECTED_QUALIFIED_SKIN_SHA256: 5949af1e54bdc7612520980cb6fd866990f5ab0792e5e1d21fa0ed5f90898329
      EXPECTED_RUNNER_SHA256: 39ff4f7a2051f0d9c1251a5999f472b9926e83deacbedcedc8e92eea424dce01
      PYTHONHASHSEED: '0'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned mainline dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
          python -m py_compile \
            tools/training/materialize_dense_skin_proposal_v1.py \
            tools/training/rebind_dense_skin_to_semantically_equivalent_skeleton_v1.py \
            compiler/realsas_compiler_services/orchestrator/adapters/learned_mechanics_v2.py

      - name: Pull and verify exact V6 closure bytes
        shell: bash
        run: |
          set -euo pipefail
          local="$RUN_ROOT/imports/arachne_stage31_v6"
          rm -rf "$local"; mkdir -p "$local"
          rclone copy "$ARACHNE_REMOTE" "$local" --checksum
          for f in \
            ARACHNE_KNIGHT_V6_RESULT.json \
            ARACHNE_KNIGHT_V6_MODEL_FINAL_FP32.pt \
            ARACHNE_KNIGHT_V6_CANONICAL_SKIN_WEIGHTS_F64.npz \
            ARACHNE_KNIGHT_V6_QUALIFIED_SKIN_IR.json \
            KNIGHT_ARACHNE_V6_DEMO_CLOSURE_PREREG_V1_20260926.json \
            run_knight_arachne_v6_demo_closure_v1.py; do
            test -s "$local/$f"
          done
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUN_ROOT"])/"imports"/"arachne_stage31_v6"
          def sha(path):
              h=hashlib.sha256()
              with Path(path).open("rb") as f:
                  for b in iter(lambda:f.read(1<<20),b""): h.update(b)
              return h.hexdigest()
          result=json.loads((root/"ARACHNE_KNIGHT_V6_RESULT.json").read_text())
          assert result["schema"]=="RealSaS.KnightArachneV6DemoClosure.v1.Result.v1"
          assert result["status"]=="PASS"
          assert result["architecture_id"]=="RealSaS.Arachne.A1.RawSurfaceK4AttentionDirectSimplex.v6"
          assert result["terminal_check_steps"]==[7680,7936,8192]
          assert result["surface_lineage_hash"]==os.environ["EXPECTED_SURFACE_LINEAGE"]
          assert result["skeleton_lineage_hash"]==os.environ["HISTORICAL_V6_SKELETON_LINEAGE"]
          assert result["skin_lineage_hash"]==os.environ["HISTORICAL_V6_SKIN_LINEAGE"]
          assert result["final_evaluation"]["full_gate"] is True
          assert result["final_evaluation"]["compiler"]["pass"] is True
          assert result["final_evaluation"]["metrics"]["row_l1_p95"] <= 0.05
          assert result["final_evaluation"]["metrics"]["legacy_deformation_ratio"] <= 0.05
          assert result["final_evaluation"]["metrics"]["articulated_deformation_ratio"] <= 0.05
          assert sha(root/"ARACHNE_KNIGHT_V6_MODEL_FINAL_FP32.pt")==os.environ["EXPECTED_MODEL_SHA256"]
          assert sha(root/"ARACHNE_KNIGHT_V6_CANONICAL_SKIN_WEIGHTS_F64.npz")==os.environ["EXPECTED_WEIGHTS_SHA256"]
          assert sha(root/"ARACHNE_KNIGHT_V6_QUALIFIED_SKIN_IR.json")==os.environ["EXPECTED_QUALIFIED_SKIN_SHA256"]
          assert sha(root/"run_knight_arachne_v6_demo_closure_v1.py")==os.environ["EXPECTED_RUNNER_SHA256"]
          print("ARACHNE_V6_EXTERNAL_CLOSURE_BYTES_PASS")
          PY
          echo "ARACHNE_LOCAL=$local" >> "$GITHUB_ENV"

      - name: Resolve current Stage15 and Stage28 authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUN_ROOT"])
          ledger=json.loads((root/"ACTIVE_RUN_V2.json").read_text())
          by={x["id"]:x for x in ledger["stages"]}
          def one(stage,schema):
              rows=[x for x in by[stage]["outputs"] if x["schema"]==schema]
              assert len(rows)==1,(stage,schema,len(rows))
              return Path(rows[0]["path"]).resolve()
          surface_path=one("15_RIGGING_SURFACE_QUALIFIED","RealSaS.RiggingSurfaceIR.v1")
          skeleton_path=one("28_SKELETON_QUALIFIED","RealSaS.QualifiedSkeletonIR.v1")
          geppetto_seal_path=one("29_GEPPETTO_CHECKPOINT_SEALED","RealSaS.ModelCheckpointSealIR.v1")
          surface=json.loads(surface_path.read_text())
          skeleton=json.loads(skeleton_path.read_text())
          seal=json.loads(geppetto_seal_path.read_text())
          assert surface["geometry_lineage_hash"]==os.environ["EXPECTED_SURFACE_LINEAGE"]
          assert skeleton["skeleton_lineage_hash"]==os.environ["EXPECTED_SKELETON_LINEAGE"]
          assert len(skeleton["joints"])==28
          env=Path(os.environ["GITHUB_ENV"])
          with env.open("a") as f:
              f.write(f"SURFACE_JSON={surface_path}\n")
              f.write(f"SKELETON_JSON={skeleton_path}\n")
              f.write(f"GEPPETTO_SEAL_HASH={seal['checkpoint_seal_hash']}\n")
          print("ARACHNE_V6_UPSTREAM_AUTHORITY_PASS",seal["checkpoint_seal_hash"])
          PY

      - name: Reconstruct exact dense V6 proposal through generic bridge
        shell: bash
        run: |
          set -euo pipefail
          proposal="$ARACHNE_LOCAL/ARACHNE_KNIGHT_V6_SKIN_PROPOSAL_REPLAY.json"
          python tools/training/materialize_dense_skin_proposal_v1.py \
            --weights-npz "$ARACHNE_LOCAL/ARACHNE_KNIGHT_V6_CANONICAL_SKIN_WEIGHTS_F64.npz" \
            --surface-json "$SURFACE_JSON" \
            --skeleton-json "$SKELETON_JSON" \
            --output-json "$proposal" \
            --model-provenance "KNIGHT_ARACHNE_V6_STEP_8192" \
            --metadata-json '{"candidate_architecture":"RealSaS.Arachne.A1.RawSurfaceK4AttentionDirectSimplex.v6","backbone_architecture":"RealSaS.Arachne.A1.RichQualifiedBidirectional.v4","field_tokens":4,"surface_memory_direct":true,"point_conditioned_k4_attention":true,"v5_readout_used":false,"dense_proposal":true,"compiler_owns_qualification":true,"teacher_input_used":false,"demo_witness":true}'
          echo "ARACHNE_PROPOSAL=$proposal" >> "$GITHUB_ENV"

      - name: Mint exact Stage30 preregistration spec
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUN_ROOT"])
          local=Path(os.environ["ARACHNE_LOCAL"])
          runner=(local/"run_knight_arachne_v6_demo_closure_v1.py").resolve()
          def sha(path):
              h=hashlib.sha256()
              with Path(path).open("rb") as f:
                  for b in iter(lambda:f.read(1<<20),b""): h.update(b)
              return h.hexdigest()
          spec={
            "schema":"RealSaS.ModelFitPreregistrationSpec.v1",
            "lane":"ARACHNE",
            "architecture_id":"RealSaS.Arachne.A1.RawSurfaceK4AttentionDirectSimplex.v6",
            "executor_kind":"EXTERNAL_GPU_JOB_V1",
            "random_seed":20260926,
            "model_source":{"path":str(runner),"sha256":sha(runner)},
            "teacher_inference_inputs_allowed":False,
            "expected_output_contract":["RealSaS.SkinProposalIR.v1"],
            "qualification_policy":{
              "max_simplex_repair_l1":1e-5,
              "max_total_correction_l1":1e-4,
              "negative_tolerance":1e-8
            },
            "upstream_bindings":{
              "rigging_surface":os.environ["EXPECTED_SURFACE_LINEAGE"],
              "qualified_skeleton":os.environ["EXPECTED_SKELETON_LINEAGE"],
              "geppetto_checkpoint_seal":os.environ["GEPPETTO_SEAL_HASH"]
            },
            "metadata":{
              "external_closure_prereg":"KNIGHT_ARACHNE_V6_DEMO_CLOSURE_PREREG_V1_20260926.json",
              "parent_execution_commit":"1dc51f4929a3ff35edc33f10cd5f8cd2cef0e98e",
              "demo_witness":True,
              "product_authority_claimed":False,
              "generalization_claimed":False
            }
          }
          path=local/"ARACHNE_V6_MAINLINE_PREREG_SPEC.json"
          path.write_text(json.dumps(spec,indent=2,sort_keys=True)+"\n")
          manifest_path=root/"run_manifest.json"
          manifest=json.loads(manifest_path.read_text())
          manifest["arachne_fit"]={"preregistration":{"path":str(path),"sha256":sha(path)}}
          manifest_path.write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          print("ARACHNE_V6_STAGE30_SPEC_BOUND",sha(path))
          PY

      - name: Execute exact Stage30
        shell: bash
        run: |
          set -euo pipefail
          python -m compiler.realsas_compiler_services.orchestrator.mainline execute \
            --run-id "$RUN_ID" \
            --target 30_ARACHNE_FIT_PREREGISTERED
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUN_ROOT"])
          ledger=json.loads((root/"ACTIVE_RUN_V2.json").read_text())
          by={x["id"]:x for x in ledger["stages"]}
          assert by["30_ARACHNE_FIT_PREREGISTERED"]["status"]=="PASS_DEMO_ONLY"
          rows=[x for x in by["30_ARACHNE_FIT_PREREGISTERED"]["outputs"] if x["schema"]=="RealSaS.ModelFitPreregistrationIR.v1"]
          assert len(rows)==1
          p=Path(rows[0]["path"]).resolve()
          prereg=json.loads(p.read_text())
          assert prereg["architecture_id"]=="RealSaS.Arachne.A1.RawSurfaceK4AttentionDirectSimplex.v6"
          assert dict(prereg["upstream_bindings"])["qualified_skeleton"]==os.environ["EXPECTED_SKELETON_LINEAGE"]
          with Path(os.environ["GITHUB_ENV"]).open("a") as f:
              f.write(f"STAGE30_PREREG_IR={p}\n")
          print("ARACHNE_V6_STAGE30_PASS",prereg["preregistration_hash"])
          PY

      - name: Bind exact V6 execution receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUN_ROOT"])
          local=Path(os.environ["ARACHNE_LOCAL"])
          prereg=json.loads(Path(os.environ["STAGE30_PREREG_IR"]).read_text())
          def sha(path):
              h=hashlib.sha256()
              with Path(path).open("rb") as f:
                  for b in iter(lambda:f.read(1<<20),b""): h.update(b)
              return h.hexdigest()
          checkpoint=(local/"ARACHNE_KNIGHT_V6_MODEL_FINAL_FP32.pt").resolve()
          result=(local/"ARACHNE_KNIGHT_V6_RESULT.json").resolve()
          proposal=Path(os.environ["ARACHNE_PROPOSAL"]).resolve()
          receipt={
            "schema":"RealSaS.ModelFitExecutionReceipt.v1",
            "lane":"ARACHNE",
            "status":"PASS",
            "architecture_id":prereg["architecture_id"],
            "preregistration_binding_hash":prereg["preregistration_hash"],
            "model_source_sha256":prereg["model_source_sha256"],
            "checkpoint_sha256":sha(checkpoint),
            "result_sha256":sha(result),
            "proposal_sha256":sha(proposal),
            "teacher_inference_inputs_used":False,
            "upstream_bindings":dict(prereg["upstream_bindings"]),
            "wall_seconds":121.81457332699983,
            "timing":{"closure_step":8192,"terminal_check_steps":[7680,7936,8192]},
            "metadata":{
              "closure_mode":"V6_FROZEN_BACKBONE_FRESH_READOUT",
              "compiler_qualification_passed_externally":True,
              "external_qualified_skin_lineage":os.environ["HISTORICAL_V6_SKIN_LINEAGE"],
              "external_qualified_skin_is_evidence_only":True,
              "stage32_requalification_required":True,
              "product_authority_minted":False,
              "generalization_claimed":False,
              "teacher_boundary":"OBJECTIVE_AND_EVALUATION_ONLY__NEVER_PREDICTOR_INPUT"
            }
          }
          receipt_path=local/"ARACHNE_V6_MAINLINE_EXECUTION_RECEIPT.json"
          receipt_path.write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          manifest_path=root/"run_manifest.json"
          manifest=json.loads(manifest_path.read_text())
          prereg_ref=dict(manifest["arachne_fit"]["preregistration"])
          manifest["arachne_fit"]={
            "preregistration":prereg_ref,
            "execution_receipt":{"path":str(receipt_path),"sha256":sha(receipt_path)},
            "checkpoint":{"path":str(checkpoint),"sha256":sha(checkpoint)},
            "result":{"path":str(result),"sha256":sha(result)},
            "proposal":{"path":str(proposal),"sha256":sha(proposal)}
          }
          manifest_path.write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          print("ARACHNE_V6_EXECUTION_RECEIPT_BOUND",sha(receipt_path))
          PY

      - name: Execute Stage31 through Stage33 and independently requalify skin
        shell: bash
        run: |
          set -euo pipefail
          python -m compiler.realsas_compiler_services.orchestrator.mainline execute \
            --run-id "$RUN_ID" \
            --target 33_ARACHNE_CHECKPOINT_SEALED
          python -m compiler.realsas_compiler_services.orchestrator.mainline status --run-id "$RUN_ID"
          python - <<'PY'
          import json,math,os
          from pathlib import Path
          root=Path(os.environ["RUN_ROOT"])
          ledger=json.loads((root/"ACTIVE_RUN_V2.json").read_text())
          by={x["id"]:x for x in ledger["stages"]}
          for sid in ("31_ARACHNE_FIT","32_SKIN_QUALIFIED","33_ARACHNE_CHECKPOINT_SEALED"):
              assert by[sid]["status"]=="PASS_DEMO_ONLY",(sid,by[sid]["status"],by[sid].get("blockers"))
          rows=[x for x in by["32_SKIN_QUALIFIED"]["outputs"] if x["schema"]=="RealSaS.QualifiedSkinIR.v1"]
          assert len(rows)==1
          skin=json.loads(Path(rows[0]["path"]).read_text())
          report=skin["qualification_report"]
          assert skin["skin_lineage_hash"]==os.environ["EXPECTED_SKIN_LINEAGE"],skin["skin_lineage_hash"]
          assert len(skin["rows"])==12090
          assert report["corrected_row_count"]==0
          assert float(report["total_correction_l1"]) <= 1e-4
          assert math.isclose(float(report["total_correction_l1"]),4.4249063704254265e-13,rel_tol=0.0,abs_tol=1e-15)
          print("ARACHNE_V6_STAGE33_PASS",skin["skin_lineage_hash"])
          PY

      - name: Seal Stage33 V6 receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUN_ROOT"])
          ledger=json.loads((root/"ACTIVE_RUN_V2.json").read_text())
          by={x["id"]:x for x in ledger["stages"]}
          def payload(stage,schema):
              rows=[x for x in by[stage]["outputs"] if x["schema"]==schema]
              assert len(rows)==1
              return json.loads(Path(rows[0]["path"]).read_text())
          execution=payload("31_ARACHNE_FIT","RealSaS.ModelFitExecutionIR.v1")
          skin=payload("32_SKIN_QUALIFIED","RealSaS.QualifiedSkinIR.v1")
          seal=payload("33_ARACHNE_CHECKPOINT_SEALED","RealSaS.ModelCheckpointSealIR.v1")
          receipt={
            "schema":"RealSaS.KnightDemoArachneStage33V6Receipt.v1",
            "status":"PASS_DEMO_ONLY",
            "run_id":os.environ["RUN_ID"],
            "architecture_id":execution["architecture_id"],
            "arachne_execution_hash":execution["execution_hash"],
            "qualified_skin_lineage_hash":skin["skin_lineage_hash"],
            "qualified_skin_row_count":len(skin["rows"]),
            "checkpoint_seal_hash":seal["checkpoint_seal_hash"],
            "terminal_check_steps":[7680,7936,8192],
            "execution_repo_commit":os.environ["GITHUB_SHA"],
            "product_authority_claimed":False,
            "generalization_claimed":False
          }
          Path("canonical/KNIGHT_DEMO_ARACHNE_STAGE33_V6_RECEIPT_20260926.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          PY
          git config user.name realsas-self-hosted-runner
          git config user.email runner@realsas.local
          git add canonical/KNIGHT_DEMO_ARACHNE_STAGE33_V6_RECEIPT_20260926.json
          git commit -m 'demo: seal Knight Arachne V6 Stage33 evidence'
          git fetch origin research/vf11-certified-adaptive-20260921
          git rebase origin/research/vf11-certified-adaptive-20260921
          git push origin HEAD:research/vf11-certified-adaptive-20260921
