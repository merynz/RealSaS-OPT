name: subject2-knight-demo-transfer-probe

on:
  push:
    branches:
      - research/vf11-certified-adaptive-20260921
    paths:
      - 'canonical/KNIGHT_DEMO_TRANSFER_PROBE_TRIGGER_20260924.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify current demo-only orchestration semantics
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            compiler/realsas_compiler_services/orchestrator/status_semantics.py \
            compiler/realsas_compiler_services/orchestrator/mainline.py \
            compiler/realsas_compiler_services/orchestrator/adapters/adapter_io.py \
            compiler/realsas_compiler_services/orchestrator/adapters/mesh_v2.py
          python -m pytest -q \
            tests/repository/test_demo_only_status_semantics.py \
            tests/repository/test_mainline_v2_dag_scheduler.py

      - name: Verify authenticated Google Drive and exact Frozen C bytes
        shell: bash
        env:
          CHECKPOINT_SHA: '222350d1d1fb37fffdf0b5cbef3ca941fe94dd440451ee9fd0e6f8029b51d2e0'
          ZERO_SHA: 'adbaf0a939eb414631736dabba1140245e88b14a41af0dc172adb7a25e5c084c'
        run: |
          set -euo pipefail
          command -v rclone
          rclone listremotes | grep -Fx 'gdrive:'
          rclone lsf 'gdrive:RealSaS_SUBJECT2_KNIGHT_IRIS_FIT_V1' --dirs-only --max-depth 1 >/dev/null
          d="$HOME/realsas_authority/imports/frozen_c_20260924T115953Z"
          required=(
            SELECTED_CHECKPOINT.pt
            IRIS_SIGNED_ZERO_SURFACE.npz
            SELECTED_CHECKPOINT_REPORT.json
            DECODER_RESULT.json
            FROZEN_STAGE13_RESULT.json
            V5_TP64_LONG_HORIZON_LOW_LR_RESULT.json
          )
          for name in "${required[@]}"; do test -s "$d/$name"; done
          printf '%s  %s\n' "$CHECKPOINT_SHA" "$d/SELECTED_CHECKPOINT.pt" | sha256sum -c -
          printf '%s  %s\n' "$ZERO_SHA" "$d/IRIS_SIGNED_ZERO_SURFACE.npz" | sha256sum -c -

      - name: Seal verified resume gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          d=Path.home()/"realsas_authority"/"imports"/"frozen_c_20260924T115953Z"
          def sha(p):
              h=hashlib.sha256()
              with Path(p).open("rb") as f:
                  for chunk in iter(lambda:f.read(1<<20),b""): h.update(chunk)
              return h.hexdigest()
          files={}
          for name in (
              "SELECTED_CHECKPOINT.pt",
              "IRIS_SIGNED_ZERO_SURFACE.npz",
              "SELECTED_CHECKPOINT_REPORT.json",
              "DECODER_RESULT.json",
              "FROZEN_STAGE13_RESULT.json",
              "V5_TP64_LONG_HORIZON_LOW_LR_RESULT.json",
          ):
              p=d/name
              files[name]={"sha256":sha(p),"bytes":p.stat().st_size}
          payload={
              "schema":"RealSaS.KnightDemoResumeGateReceipt.v1",
              "status":"PASS",
              "tested_commit":os.environ["GITHUB_SHA"],
              "runner_name":os.environ.get("RUNNER_NAME",""),
              "runner_os":os.environ.get("RUNNER_OS",""),
              "demo_only_status_semantics":"PASS",
              "rclone_google_drive_access":"PASS",
              "frozen_c_checkpoint_sha256":files["SELECTED_CHECKPOINT.pt"]["sha256"],
              "frozen_c_zero_surface_sha256":files["IRIS_SIGNED_ZERO_SURFACE.npz"]["sha256"],
              "files":files,
              "product_authority_claimed":False,
          }
          out=Path("canonical/KNIGHT_DEMO_RESUME_GATE_RECEIPT_20260925.json")
          out.write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(payload,sort_keys=True))
          PY
          git config user.name "realsas-self-hosted-runner"
          git config user.email "runner@realsas.local"
          git add canonical/KNIGHT_DEMO_RESUME_GATE_RECEIPT_20260925.json
          if ! git diff --cached --quiet; then
            git commit -m 'demo: seal verified Frozen C resume gate'
            git push origin HEAD:research/vf11-certified-adaptive-20260921
          fi
