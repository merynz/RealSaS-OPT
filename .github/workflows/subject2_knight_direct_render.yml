name: subject2-knight-current-main-stage25-render

on:
  push:
    branches:
      - ops/current-main-knight-render-20260930
    paths:
      - '.github/workflows/subject2_knight_direct_render.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 30
    env:
      REALSAS_AUTHORITY_ROOT: /home/monster/realsas_authority
      SOURCE_RUN_ID: SUBJECT2_KNIGHT_CORRECTED_MECHANICAL_CAA_AB_V1_20260929
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prove exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "EXACT_MAIN_SHA=$(git rev-parse HEAD)"

      - name: Install current-main dependencies
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt

      - name: Render Knight Stage25 with exact current-main renderer
        shell: bash
        run: |
          set -euo pipefail
          OUT_ROOT="$RUNNER_TEMP/knight_current_main_stage25"
          rm -rf "$OUT_ROOT"
          mkdir -p "$OUT_ROOT"
          export OUT_ROOT

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from compiler.realsas_compiler_services.orchestrator.adapters.appearance_v2 import (
              prove_caa_reference_rest_stage,
          )

          authority = Path(os.environ["REALSAS_AUTHORITY_ROOT"])
          source_run_id = os.environ["SOURCE_RUN_ID"]
          source_root = authority / "runs" / source_run_id
          ledger_path = source_root / "ACTIVE_RUN_V2.json"
          manifest_path = source_root / "run_manifest.json"
          if not ledger_path.is_file() or not manifest_path.is_file():
              raise RuntimeError("KNIGHT_SOURCE_RUN_MISSING")

          ledger = json.loads(ledger_path.read_text())
          manifest = json.loads(manifest_path.read_text())
          stage = next(
              row for row in ledger["stages"]
              if row["id"] == "25_CAA_REFERENCE_REST_RENDER_PROOF"
          )

          if str(stage.get("status")) != "PASS":
              raise RuntimeError(
                  f"KNIGHT_STAGE25_SOURCE_NOT_PASS:{stage.get('status')}:{stage.get('blockers')}"
              )

          required = [
              "05_CAMERA_CONTRACT_SOLVED",
              "07_OBSERVATION_CONTRACT_QUALIFIED",
              "18_CANONICAL_MESH_ADDRESSING_BUILD",
              "19_STATIC_CANONICAL_MESH_QUALIFIED",
              "20_CAA_BACKEND_PREREGISTERED",
              "23_COMPLETE_APPEARANCE_ASSET_BAKED",
              "24_COMPLETE_APPEARANCE_QUALIFIED",
          ]
          by = {row["id"]: row for row in ledger["stages"]}
          bad = {
              sid: by[sid].get("status")
              for sid in required
              if str(by[sid].get("status")) not in {"PASS", "PASS_DEMO_ONLY", "CACHE_HIT"}
          }
          if bad:
              raise RuntimeError(f"KNIGHT_STAGE25_UPSTREAM_NOT_ADMISSIBLE:{bad}")

          out_root = Path(os.environ["OUT_ROOT"])
          ctx = {
              "run_id": source_run_id,
              "run_root": out_root,
              "ledger": ledger,
              "run_manifest": manifest,
              "stage": dict(stage),
          }

          result = prove_caa_reference_rest_stage(ctx)
          status = str(result.get("status") or "")
          if status != "PASS":
              raise RuntimeError(
                  "CURRENT_MAIN_STAGE25_RENDER_FAILED:"
                  + json.dumps(result, sort_keys=True, default=str)
              )

          outputs = list(result.get("outputs") or [])
          pngs = [row for row in outputs if str(row.get("schema") or "").startswith("RealSaS.CAAReferenceRestRender.V")]
          if len(pngs) != 8:
              raise RuntimeError(f"CURRENT_MAIN_STAGE25_RENDER_PNG_CARDINALITY:{len(pngs)}")

          verified = []
          for row in pngs:
              p = Path(row["path"])
              if not p.is_file():
                  raise RuntimeError(f"CURRENT_MAIN_RENDER_FILE_MISSING:{p}")
              actual = hashlib.sha256(p.read_bytes()).hexdigest()
              if actual != row["sha256"]:
                  raise RuntimeError(f"CURRENT_MAIN_RENDER_HASH_DRIFT:{p}")
              verified.append({
                  "path": str(p),
                  "name": p.name,
                  "sha256": actual,
                  "size_bytes": p.stat().st_size,
                  "schema": row["schema"],
              })

          report = {
              "schema": "RealSaS.CurrentMainKnightStage25RenderReport.v1",
              "source_run_id": source_run_id,
              "source_stage25_status": stage["status"],
              "renderer": "compiler.realsas_compiler_services.orchestrator.adapters.appearance_v2.prove_caa_reference_rest_stage",
              "refit_performed": False,
              "model_execution_performed": False,
              "compiler_mainline_execute_performed": False,
              "render_count": len(verified),
              "renders": verified,
          }
          (out_root / "REPORT.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          print("CURRENT_MAIN_KNIGHT_STAGE25_RENDER_PASS")
          print(json.dumps(report, sort_keys=True))
          PY

          echo "OUT_ROOT=$OUT_ROOT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: knight-current-main-stage25-render
          path: ${{ env.OUT_ROOT }}
          if-no-files-found: error
          retention-days: 7
