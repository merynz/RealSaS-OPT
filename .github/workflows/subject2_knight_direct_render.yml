name: subject2-knight-direct-main-render

on:
  push:
    branches:
      - ops/current-main-knight-render-20260930
    paths:
      - '.github/workflows/subject2_knight_direct_render.yml'

permissions:
  contents: read

jobs:
  direct-render:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 30
    env:
      REALSAS_AUTHORITY_ROOT: /home/monster/realsas_authority
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prove exact main checkout
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "EXACT_MAIN_SHA=$(git rev-parse HEAD)"

      - name: Install render-only Python dependencies
        run: python -m pip install --no-input --progress-bar off numpy Pillow

      - name: Build current-main native CAA runtime
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -pedantic             runtime/realsas_cpp/src/runtime_v2_caa_reference.cpp             -lpng -lz             -o "$RUNNER_TEMP/realsas_runtime_v2_caa_reference_MAIN"
          sha256sum "$RUNNER_TEMP/realsas_runtime_v2_caa_reference_MAIN"

      - name: Find existing Knight RSS and render it with current main
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="$RUNNER_TEMP/knight_current_main_render"
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          export OUT_DIR
          export PLAYER="$RUNNER_TEMP/realsas_runtime_v2_caa_reference_MAIN"

          python - <<'PY'
          import hashlib, json, math, os, subprocess
          from pathlib import Path

          import numpy as np
          from PIL import Image

          authority = Path(os.environ["REALSAS_AUTHORITY_ROOT"])
          out_dir = Path(os.environ["OUT_DIR"])
          player = Path(os.environ["PLAYER"])
          clips = ["demo_idle_v1", "demo_run_v1", "demo_slash_v1"]

          def resolve_candidate(raw, ledger_path=None):
              p = Path(str(raw)).expanduser()
              if p.is_file():
                  return p
              if str(raw).startswith("$REALSAS_AUTHORITY_ROOT/"):
                  q = authority / str(raw).split("/", 1)[1]
                  if q.is_file():
                      return q
              if ledger_path is not None and not p.is_absolute():
                  q = ledger_path.parent / p
                  if q.is_file():
                      return q
              return None

          candidates = []
          seen = set()

          for ledger_path in authority.rglob("ACTIVE_RUN_V2.json"):
              if "KNIGHT" not in str(ledger_path).upper():
                  continue
              try:
                  ledger = json.loads(ledger_path.read_text())
              except Exception:
                  continue
              for row in ledger.get("stages") or []:
                  if str(row.get("id")) != "43_RSS_MATERIALIZE_COMPACT":
                      continue
                  if str(row.get("status")) not in {"PASS", "PASS_DEMO_ONLY", "CACHE_HIT"}:
                      continue
                  for out in row.get("outputs") or []:
                      if out.get("schema") != "application/x-realsas-rss-v2":
                          continue
                      p = resolve_candidate(out.get("path"), ledger_path)
                      if p and p not in seen:
                          seen.add(p)
                          candidates.append((0, p.stat().st_mtime, p, str(ledger_path), out.get("sha256")))

          for p in authority.rglob("*"):
              if not p.is_file():
                  continue
              u = str(p).upper()
              if "KNIGHT" not in u:
                  continue
              n = p.name.lower()
              if not (n.endswith(".rss") or n.endswith(".rssv2") or ".rss." in n or "rss" in n):
                  continue
              if p in seen or p.stat().st_size < 1024:
                  continue
              seen.add(p)
              candidates.append((1, p.stat().st_mtime, p, "filesystem_scan", None))

          candidates.sort(key=lambda x: (x[0], -x[1]))
          if not candidates:
              raise RuntimeError("NO_EXISTING_KNIGHT_RSS_FOUND")

          chosen = None
          probe_errors = []
          for _, _, rss, provenance, expected_sha in candidates:
              if expected_sha:
                  actual = hashlib.sha256(rss.read_bytes()).hexdigest()
                  if actual != str(expected_sha):
                      probe_errors.append(f"HASH_MISMATCH:{rss}")
                      continue
              raw = out_dir / "probe.rgba"
              proc = subprocess.run(
                  [str(player), str(rss), "--clip", clips[0], "--view", "V0",
                   "--frame", "0", "--out-rgba", str(raw)],
                  capture_output=True, text=True
              )
              if proc.returncode == 0 and raw.is_file() and raw.stat().st_size >= 4:
                  chosen = (rss, provenance)
                  raw.unlink()
                  break
              probe_errors.append(f"{rss}:{proc.returncode}:{proc.stderr[-300:]}")
              raw.unlink(missing_ok=True)

          if chosen is None:
              raise RuntimeError("NO_RENDERABLE_KNIGHT_RSS_WITH_CURRENT_MAIN\n" + "\n".join(probe_errors[:25]))

          rss, provenance = chosen
          rss_sha = hashlib.sha256(rss.read_bytes()).hexdigest()
          report = {
              "schema": "RealSaS.CurrentMainDirectKnightRenderReport.v1",
              "runtime_source": "runtime/realsas_cpp/src/runtime_v2_caa_reference.cpp",
              "rss_path": str(rss),
              "rss_sha256": rss_sha,
              "rss_provenance": provenance,
              "refit_performed": False,
              "compiler_pipeline_executed": False,
              "clips": [],
          }

          for cid in clips:
              frames = []
              frame_hashes = []
              resolution = None
              for fi in range(48):
                  raw = out_dir / f"{cid}_{fi:04d}.rgba"
                  proc = subprocess.run(
                      [str(player), str(rss), "--clip", cid, "--view", "V0",
                       "--frame", str(fi), "--out-rgba", str(raw)],
                      capture_output=True, text=True
                  )
                  if proc.returncode != 0:
                      raw.unlink(missing_ok=True)
                      if fi == 0:
                          raise RuntimeError(f"CURRENT_MAIN_RENDER_FAIL:{cid}:0:{proc.stderr}")
                      break
                  data = raw.read_bytes()
                  raw.unlink()
                  px = len(data) // 4
                  side = int(round(math.sqrt(px)))
                  if side * side * 4 != len(data):
                      raise RuntimeError(f"NON_SQUARE_RGBA:{cid}:{fi}:{len(data)}")
                  if resolution is None:
                      resolution = side
                  elif resolution != side:
                      raise RuntimeError(f"RESOLUTION_DRIFT:{cid}:{resolution}:{side}")
                  arr = np.frombuffer(data, dtype=np.uint8).reshape(side, side, 4)
                  frames.append(Image.fromarray(arr, "RGBA"))
                  frame_hashes.append(hashlib.sha256(data).hexdigest())

              if not frames:
                  raise RuntimeError(f"NO_FRAMES_RENDERED:{cid}")

              first_png = out_dir / f"KNIGHT_{cid.upper()}_MAIN_FIRST.png"
              last_png = out_dir / f"KNIGHT_{cid.upper()}_MAIN_LAST.png"
              gif = out_dir / f"KNIGHT_{cid.upper()}_MAIN.gif"
              frames[0].save(first_png)
              frames[-1].save(last_png)
              pframes = [im.convert("P", palette=Image.Palette.ADAPTIVE, colors=255) for im in frames]
              pframes[0].save(
                  gif, save_all=True, append_images=pframes[1:],
                  duration=80, loop=0, disposal=2, optimize=False, transparency=0
              )
              report["clips"].append({
                  "clip_id": cid,
                  "frames_rendered": len(frames),
                  "resolution": resolution,
                  "unique_frame_hashes": len(set(frame_hashes)),
                  "gif": gif.name,
                  "first_png": first_png.name,
                  "last_png": last_png.name,
              })

          (out_dir / "REPORT.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          print("CURRENT_MAIN_KNIGHT_RENDER_PASS")
          print(json.dumps(report, sort_keys=True))
          PY

          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: knight-current-main-render
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 7
