name: subject2-knight-stage35-envelope-fix-proof

on:
  push:
    branches:
      - ops/current-main-knight-render-20260930
    paths:
      - '.github/workflows/subject2_knight_direct_render.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    env:
      REALSAS_AUTHORITY_ROOT: /home/monster/realsas_authority
      SOURCE_RUN_ID: SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/current-main-knight-render-20260930
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt

      - name: Unit proof for envelope-bound G3B stress
        run: |
          python -m pytest -q             tests/compiler/test_source_edge_probe_repartition_v1.py             tests/compiler/test_skin_topology_repartition_directive_v2.py             tests/compiler/test_deformation_stress_v2_vectorization.py

      - name: Re-run Knight Stage35 with patched G3B stress authority
        shell: bash
        run: |
          set -euo pipefail
          OUT_ROOT="$RUNNER_TEMP/knight_stage35_envelope_fix"
          rm -rf "$OUT_ROOT"
          mkdir -p "$OUT_ROOT"
          export OUT_ROOT
          python - <<'PY'
          import copy, importlib, json, os
          from pathlib import Path

          authority=Path(os.environ["REALSAS_AUTHORITY_ROOT"])
          source_run_id=os.environ["SOURCE_RUN_ID"]
          source_root=authority/"runs"/source_run_id
          out_root=Path(os.environ["OUT_ROOT"])

          ledger=json.loads((source_root/"ACTIVE_RUN_V2.json").read_text())
          manifest=json.loads((source_root/"run_manifest.json").read_text())
          plan=json.loads(Path("canonical/MAINLINE_EXECUTION_PLAN_V2.json").read_text())
          stage=next(s for s in plan["stages"] if int(s["ordinal"])==35)

          ctx={
              "repo_root":Path.cwd().resolve(),
              "run_id":source_run_id,
              "run_root":out_root,
              "ledger":copy.deepcopy(ledger),
              "run_manifest":manifest,
              "stage":stage,
          }
          module_name,function_name=str(stage["adapter"]).split(":",1)
          func=getattr(importlib.import_module(module_name),function_name)
          result=func(ctx)

          report={
              "schema":"RealSaS.KnightStage35EnvelopeStressFixProof.v1",
              "status":result.get("status"),
              "blockers":result.get("blockers") or [],
              "diagnostics":result.get("diagnostics") or {},
              "outputs":result.get("outputs") or [],
          }
          (out_root/"REPORT.json").write_text(
              json.dumps(report,indent=2,sort_keys=True,default=str)+"\n"
          )
          print(json.dumps(report,sort_keys=True,default=str),flush=True)
          if str(result.get("status") or "") not in {"PASS","PASS_DEMO_ONLY","CACHE_HIT"}:
              raise RuntimeError(
                  f"STAGE35_STILL_FAILS:{result.get('status')}:{result.get('blockers')}"
              )
          PY
          echo "OUT_ROOT=$OUT_ROOT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knight-stage35-envelope-fix-proof
          path: ${{ env.OUT_ROOT }}
          if-no-files-found: warn
          retention-days: 7
