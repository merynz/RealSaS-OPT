name: subject2-knight-current-main-deterministic-rebuild-render

on:
  push:
    branches:
      - ops/current-main-knight-render-20260930
    paths:
      - '.github/workflows/subject2_knight_direct_render.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 90
    env:
      REALSAS_AUTHORITY_ROOT: /home/monster/realsas_authority
      SOURCE_RUN_ID: SUBJECT2_KNIGHT_SOLVED_LINEAGE_V1_20260929
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prove exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "EXACT_MAIN_SHA=$(git rev-parse HEAD)"

      - name: Install current-main dependencies
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt

      - name: Build exact current-main native runtime
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -pedantic             runtime/realsas_cpp/src/runtime_v2_caa_reference.cpp             -lpng -lz             -o "$RUNNER_TEMP/realsas_runtime_v2_caa_reference_MAIN"
          sha256sum "$RUNNER_TEMP/realsas_runtime_v2_caa_reference_MAIN"

      - name: Rebuild deterministic Stage18-25 then execute Stage35-43 and render clips
        shell: bash
        run: |
          set -euo pipefail
          OUT_ROOT="$RUNNER_TEMP/knight_current_main_rebuild_render"
          rm -rf "$OUT_ROOT"
          mkdir -p "$OUT_ROOT"
          echo "OUT_ROOT=$OUT_ROOT" >> "$GITHUB_ENV"
          export OUT_ROOT
          export PLAYER="$RUNNER_TEMP/realsas_runtime_v2_caa_reference_MAIN"

          python - <<'PY'
          import copy, hashlib, importlib, json, os, subprocess
          from pathlib import Path
          import numpy as np
          from PIL import Image

          authority = Path(os.environ["REALSAS_AUTHORITY_ROOT"])
          source_run_id = os.environ["SOURCE_RUN_ID"]
          source_root = authority / "runs" / source_run_id
          out_root = Path(os.environ["OUT_ROOT"])
          player = Path(os.environ["PLAYER"])

          ledger = json.loads((source_root / "ACTIVE_RUN_V2.json").read_text())
          manifest = json.loads((source_root / "run_manifest.json").read_text())
          plan = json.loads(Path("canonical/MAINLINE_EXECUTION_PLAN_V2.json").read_text())
          admissible = {"PASS", "PASS_DEMO_ONLY", "CACHE_HIT"}

          # Rebind the exact current-main Stage18 demo fallback contract in temp only.
          stage18_prereg = {
              "schema": "RealSaS.KnightDemoStage18MeshFallbackPreregistration.v1",
              "status": "FROZEN_BEFORE_KNIGHT_STAGE18_PARENT_QUALITY_METRICS_INSPECTION",
              "run_id": str(ledger["run_id"]),
              "subject_id": str(ledger["subject_id"]),
              "execution_class": "DEMO_WITNESS",
              "eligibility": {
                  "stage15_ledger_status_required": "PASS_DEMO_ONLY",
                  "product_authority_claimed_required": False,
                  "requested_backend_required": "CANONICAL_CDT_LOCAL_CHART_V1",
                  "only_admissible_precondition_failure": "RELATION_PARENT_MIN_ANGLE_BELOW_FROZEN_G3_TARGET",
                  "boundary_split_must_remain_forbidden": True,
                  "teacher_truth_allowed": False,
                  "source_rig_labels_allowed": False,
                  "source_skin_labels_allowed": False,
                  "appearance_quality_allowed_for_selection": False,
                  "future_geppetto_result_allowed_for_selection": False,
                  "future_arachne_result_allowed_for_selection": False,
              },
              "fallback_rule": {
                  "rule_id": "RELATION_BASELINE_IF_AND_ONLY_IF_CDT_PARENT_MIN_ANGLE_UNREPAIRABLE_V1",
                  "producer": "CANONICAL_RELATION_BASELINE_V1",
                  "candidate_choice": "EXACT_CURRENT_RELATION_BASELINE",
                  "no_candidate_ranking": True,
                  "no_threshold_relaxation": True,
                  "stage19_remeasurement_required": True,
              },
              "demo_admission_semantics": {
                  "stage19_actual_candidate_source_fidelity_replay_required": True,
                  "product_pass_forbidden": True,
              },
          }
          prereg_path = out_root / "stage18_fallback_preregistration.json"
          prereg_path.write_text(json.dumps(stage18_prereg, sort_keys=True) + "\n")
          demo = dict(manifest.get("demo_execution") or {})
          demo["product_authority_claimed"] = False
          demo["stage18_mesh_fallback_preregistration"] = {
              "path": str(prereg_path),
              "sha256": hashlib.sha256(prereg_path.read_bytes()).hexdigest(),
          }
          manifest["demo_execution"] = demo

          expected_clips = {"demo_idle_v1", "demo_run_v1", "demo_slash_v1"}

          def resolve_ref(ref):
              raw = str(ref.get("path") or "")
              if raw.startswith("$REALSAS_AUTHORITY_ROOT/"):
                  return authority / raw.split("/", 1)[1]
              return Path(os.path.expandvars(raw)).expanduser()

          def sources_valid(rows):
              if len(rows) != 3 or {str(x.get("clip_id")) for x in rows} != expected_clips:
                  return False
              for row in rows:
                  ref = dict(row.get("file") or {})
                  p = resolve_ref(ref)
                  expected = str(ref.get("sha256") or "")
                  if not p.is_file() or len(expected) != 64:
                      return False
                  if hashlib.sha256(p.read_bytes()).hexdigest() != expected:
                      return False
              return True

          sources = list(dict(manifest.get("motion") or {}).get("sources") or [])
          if not sources_valid(sources):
              donor = None
              for frag in sorted(authority.rglob("MOTION_RUN_MANIFEST_FRAGMENT.json")):
                  try:
                      payload = json.loads(frag.read_text())
                      candidate = dict(payload.get("motion") or {})
                      rows = list(candidate.get("sources") or [])
                  except Exception:
                      continue
                  if sources_valid(rows):
                      donor = (frag, candidate)
                      break
              if donor is None:
                  raise RuntimeError("VALID_IDLE_RUN_SLASH_MOTION_FRAGMENT_NOT_FOUND")
              manifest["motion"] = donor[1]
              print("MOTION_FRAGMENT_REUSED", donor[0])

          work_ledger = copy.deepcopy(ledger)
          work_by = {str(row["id"]): row for row in work_ledger["stages"]}

          # Source-run artifacts remain read-only. Rebuilt outputs land only in OUT_ROOT.
          stage_log = []

          def run_stage(ordinal):
              stage = next(s for s in plan["stages"] if int(s["ordinal"]) == ordinal)
              sid = str(stage["id"])
              module_name, function_name = str(stage["adapter"]).split(":", 1)
              func = getattr(importlib.import_module(module_name), function_name)
              ctx = {
                  "run_id": source_run_id,
                  "run_root": out_root,
                  "ledger": work_ledger,
                  "run_manifest": manifest,
                  "stage": stage,
              }
              print("DIRECT_CURRENT_MAIN_STAGE_BEGIN", ordinal, sid)
              result = func(ctx)
              status = str(result.get("status") or "")
              row = work_by[sid]
              row["status"] = status
              row["outputs"] = list(result.get("outputs") or [])
              row["blockers"] = list(result.get("blockers") or [])
              row["performance"] = dict(result.get("performance") or {})
              stage_log.append({
                  "ordinal": ordinal,
                  "id": sid,
                  "status": status,
                  "blockers": row["blockers"],
                  "outputs": row["outputs"],
              })
              print("DIRECT_CURRENT_MAIN_STAGE_END", ordinal, sid, status, row["blockers"])
              if status not in admissible:
                  (out_root / "FAILURE_REPORT.json").write_text(
                      json.dumps({
                          "schema": "RealSaS.CurrentMainKnightDeterministicRebuildFailure.v1",
                          "failed_stage": sid,
                          "result": result,
                          "stage_log": stage_log,
                          "model_execution_performed": False,
                          "refit_performed": False,
                      }, indent=2, sort_keys=True, default=str) + "\n"
                  )
                  raise RuntimeError(
                      f"STAGE_FAILED:{ordinal}:{sid}:{status}:{row['blockers']}"
                  )

          # Current-main deterministic visual/mesh rebuild only.
          for ordinal in range(18, 26):
              run_stage(ordinal)

          # Reuse solved model outputs unchanged.
          for sid in ("28_SKELETON_QUALIFIED", "32_SKIN_QUALIFIED", "34_DEFORMATION_CAPABILITY_ENVELOPE"):
              if str(work_by[sid].get("status")) not in admissible:
                  raise RuntimeError(f"MODEL_DERIVED_AUTHORITY_NOT_READY:{sid}:{work_by[sid].get('status')}")

          # Current-main downstream product/runtime chain.
          for ordinal in range(35, 44):
              run_stage(ordinal)

          s42 = work_by["42_RUNTIME_PROJECTION_AND_CAA_BINDING"]
          s43 = work_by["43_RSS_MATERIALIZE_COMPACT"]
          proj_rows = [x for x in s42.get("outputs") or [] if x.get("schema") == "RealSaS.RuntimeProjectionIR.v2"]
          rss_rows = [x for x in s43.get("outputs") or [] if x.get("schema") == "application/x-realsas-rss-v2"]
          if len(proj_rows) != 1 or len(rss_rows) != 1:
              raise RuntimeError(f"RUNTIME_OUTPUT_CARDINALITY:{len(proj_rows)}:{len(rss_rows)}")

          projection_path = Path(proj_rows[0]["path"])
          rss_path = Path(rss_rows[0]["path"])
          projection = json.loads(projection_path.read_text())
          view = next(v for v in projection["views"] if str(v["view_id"]) == "V0")
          resolution = int(view["camera"]["resolution"])
          clips = {str(c["clip_id"]): c for c in projection["clips"]}

          render_dir = out_root / "GIFS"
          render_dir.mkdir(parents=True, exist_ok=True)
          rendered = []

          for cid in ("demo_idle_v1", "demo_run_v1", "demo_slash_v1"):
              clip = clips.get(cid)
              if clip is None:
                  raise RuntimeError(f"RUNTIME_CLIP_MISSING:{cid}")
              n = int(clip["frame_count"])
              duration = float(clip["duration_seconds"])
              frames = []
              hashes = []
              for fi in range(n):
                  raw = render_dir / f"{cid}_{fi:04d}.rgba"
                  proc = subprocess.run(
                      [str(player), str(rss_path), "--clip", cid, "--view", "V0", "--frame", str(fi), "--out-rgba", str(raw)],
                      capture_output=True, text=True,
                  )
                  if proc.returncode != 0:
                      raise RuntimeError(f"NATIVE_RENDER_FAIL:{cid}:{fi}:{proc.stderr}")
                  data = raw.read_bytes()
                  raw.unlink()
                  if len(data) != resolution * resolution * 4:
                      raise RuntimeError(f"RGBA_SIZE_DRIFT:{cid}:{fi}:{len(data)}")
                  arr = np.frombuffer(data, dtype=np.uint8).reshape(resolution, resolution, 4)
                  frames.append(Image.fromarray(arr, "RGBA"))
                  hashes.append(hashlib.sha256(data).hexdigest())

              delay = max(20, int(round(1000.0 * duration / max(1, n - 1))))
              gif = render_dir / f"KNIGHT_{cid.upper()}_CURRENT_MAIN.gif"
              first = render_dir / f"KNIGHT_{cid.upper()}_CURRENT_MAIN_FIRST.png"
              frames[0].save(first)
              pframes = [im.convert("P", palette=Image.Palette.ADAPTIVE, colors=255) for im in frames]
              pframes[0].save(
                  gif,
                  save_all=True,
                  append_images=pframes[1:],
                  duration=delay,
                  loop=0,
                  disposal=2,
                  optimize=False,
                  transparency=0,
              )
              rendered.append({
                  "clip_id": cid,
                  "frame_count": n,
                  "duration_seconds": duration,
                  "unique_frame_hashes": len(set(hashes)),
                  "gif": gif.name,
                  "first_png": first.name,
                  "gif_sha256": hashlib.sha256(gif.read_bytes()).hexdigest(),
              })

          report = {
              "schema": "RealSaS.CurrentMainKnightDeterministicRebuildRenderReport.v1",
              "source_run_id": source_run_id,
              "current_main_rebuilt_stages": list(range(18, 26)),
              "current_main_downstream_stages": list(range(35, 44)),
              "model_execution_performed": False,
              "refit_performed": False,
              "iris_fit_performed": False,
              "geppetto_fit_performed": False,
              "arachne_fit_performed": False,
              "runtime_player_source": "runtime/realsas_cpp/src/runtime_v2_caa_reference.cpp",
              "rss_path": str(rss_path),
              "rss_sha256": hashlib.sha256(rss_path.read_bytes()).hexdigest(),
              "stage_log": stage_log,
              "clips": rendered,
          }
          (render_dir / "REPORT.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          print("CURRENT_MAIN_KNIGHT_IDLE_RUN_SLASH_RENDER_PASS")
          print(json.dumps(report, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knight-current-main-idle-run-slash
          path: ${{ env.OUT_ROOT }}
          if-no-files-found: warn
          retention-days: 7
