name: subject2-knight-direct-sealed-render

on:
  push:
    branches:
      - ops/current-main-knight-render-20260930
    paths:
      - '.github/workflows/subject2_knight_direct_render.yml'

permissions:
  contents: read

jobs:
  direct-render:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 30
    env:
      REALSAS_AUTHORITY_ROOT: /home/monster/realsas_authority
      SOURCE_RUN_ID: SUBJECT2_KNIGHT_CORRECTED_MECHANICAL_CAA_HARMONIC_FIRST_IMMUTABLE_V1_70CBD671
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install render-only Python dependencies
        run: python -m pip install --no-input --progress-bar off numpy Pillow

      - name: Render sealed historical Stage42/43 outputs directly
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="$RUNNER_TEMP/knight_direct_sealed_render"
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          export OUT_DIR

          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path

          import numpy as np
          from PIL import Image

          authority = Path(os.environ["REALSAS_AUTHORITY_ROOT"])
          run_id = os.environ["SOURCE_RUN_ID"]
          live_root = authority / "runs" / run_id
          backup = authority / "historical_run_backups" / (run_id + "_PRE_CURRENT_MAIN_20260930")
          ledger_path = backup / "ACTIVE_RUN_V2.json"
          if not ledger_path.is_file():
              raise RuntimeError(f"HISTORICAL_LEDGER_MISSING:{ledger_path}")

          ledger = json.loads(ledger_path.read_text())
          by = {str(x["id"]): x for x in ledger["stages"]}
          s42 = by["42_RUNTIME_PROJECTION_AND_CAA_BINDING"]
          s43 = by["43_RSS_MATERIALIZE_COMPACT"]

          allowed = {"PASS", "PASS_DEMO_ONLY", "CACHE_HIT"}
          if str(s42.get("status")) not in allowed:
              raise RuntimeError(f"HISTORICAL_STAGE42_NOT_RENDERABLE:{s42.get('status')}:{s42.get('blockers')}")
          if str(s43.get("status")) not in allowed:
              raise RuntimeError(f"HISTORICAL_STAGE43_NOT_RENDERABLE:{s43.get('status')}:{s43.get('blockers')}")

          def one(stage, schema):
              rows = [x for x in stage.get("outputs") or [] if x.get("schema") == schema]
              if len(rows) != 1:
                  raise RuntimeError(f"OUTPUT_CARDINALITY:{stage['id']}:{schema}:{len(rows)}")
              return rows[0]

          def resolve_output(stage_id, row):
              raw = str(row.get("path") or "")
              p = Path(raw).expanduser()
              if p.is_file():
                  candidate = p
              else:
                  stage_dir = backup / "artifacts" / stage_id
                  direct = stage_dir / p.name
                  if direct.is_file():
                      candidate = direct
                  else:
                      matches = list(stage_dir.rglob(p.name)) if stage_dir.is_dir() else []
                      if len(matches) != 1:
                          raise RuntimeError(f"HISTORICAL_OUTPUT_NOT_FOUND:{stage_id}:{raw}:{len(matches)}")
                      candidate = matches[0]

              expected = str(row.get("sha256") or "")
              actual = hashlib.sha256(candidate.read_bytes()).hexdigest()
              if expected and actual != expected:
                  raise RuntimeError(f"HISTORICAL_OUTPUT_HASH_MISMATCH:{stage_id}:{candidate}:{expected}:{actual}")
              return candidate, actual

          rss_row = one(s43, "application/x-realsas-rss-v2")
          proj_row = one(s42, "RealSaS.RuntimeProjectionIR.v2")
          rss, rss_sha = resolve_output("43_RSS_MATERIALIZE_COMPACT", rss_row)
          projection_path, projection_sha = resolve_output("42_RUNTIME_PROJECTION_AND_CAA_BINDING", proj_row)
          projection = json.loads(projection_path.read_text())

          player_candidates = [
              live_root / "tools" / "current_main_runtime" / "realsas_runtime_v2_caa_reference",
              authority / "tools" / "current_main_runtime" / "realsas_runtime_v2_caa_reference",
          ]
          player = next((p for p in player_candidates if p.is_file() and os.access(p, os.X_OK)), None)
          if player is None:
              raise RuntimeError("NATIVE_PLAYER_MISSING:" + ":".join(map(str, player_candidates)))

          v0 = next(v for v in projection["views"] if str(v["view_id"]) == "V0")
          resolution = int(v0["camera"]["resolution"])
          out_dir = Path(os.environ["OUT_DIR"])

          report = {
              "schema": "RealSaS.DirectSealedHistoricalRenderReport.v1",
              "source_run_id": run_id,
              "source_ledger": str(ledger_path),
              "source_mode": "READ_ONLY_HISTORICAL_STAGE42_STAGE43",
              "refit_performed": False,
              "compile_performed": False,
              "stage42_status": s42.get("status"),
              "stage43_status": s43.get("status"),
              "rss_path": str(rss),
              "rss_sha256": rss_sha,
              "projection_path": str(projection_path),
              "projection_sha256": projection_sha,
              "native_player": str(player),
              "resolution": resolution,
              "clips": [],
          }

          for clip in projection["clips"]:
              cid = str(clip["clip_id"])
              frame_count = int(clip["frame_count"])
              duration = float(clip["duration_seconds"])
              sample_count = min(frame_count, 32)
              indices = sorted(set(
                  int(round(i * (frame_count - 1) / max(1, sample_count - 1)))
                  for i in range(sample_count)
              ))
              frames = []
              for fi in indices:
                  raw = out_dir / f"{cid}_V0_{fi:04d}.rgba"
                  proc = subprocess.run(
                      [str(player), str(rss), "--clip", cid, "--view", "V0",
                       "--frame", str(fi), "--out-rgba", str(raw)],
                      capture_output=True, text=True
                  )
                  if proc.returncode != 0:
                      raise RuntimeError(f"NATIVE_RENDER_FAIL:{cid}:{fi}:{proc.stderr}")
                  arr = np.frombuffer(raw.read_bytes(), dtype=np.uint8)
                  expected = resolution * resolution * 4
                  if arr.size != expected:
                      raise RuntimeError(f"RGBA_SIZE_DRIFT:{cid}:{fi}:{arr.size}:{expected}")
                  im = Image.fromarray(arr.reshape(resolution, resolution, 4), "RGBA")
                  frames.append(im)
                  raw.unlink()

              first_png = out_dir / f"KNIGHT_{cid.upper()}_FIRST.png"
              last_png = out_dir / f"KNIGHT_{cid.upper()}_LAST.png"
              frames[0].save(first_png)
              frames[-1].save(last_png)

              delay = max(40, int(round(1000.0 * duration / max(1, frame_count - 1))))
              gif = out_dir / f"KNIGHT_{cid.upper()}_SEALED.gif"
              pframes = [im.convert("P", palette=Image.Palette.ADAPTIVE, colors=255) for im in frames]
              pframes[0].save(
                  gif,
                  save_all=True,
                  append_images=pframes[1:],
                  duration=delay,
                  loop=0,
                  disposal=2,
                  optimize=False,
                  transparency=0,
              )
              report["clips"].append({
                  "clip_id": cid,
                  "frame_count": frame_count,
                  "sampled_indices": indices,
                  "gif": gif.name,
                  "first_png": first_png.name,
                  "last_png": last_png.name,
              })

          (out_dir / "REPORT.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          print("DIRECT_SEALED_RENDER_PASS", json.dumps(report, sort_keys=True))
          PY

          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: knight-direct-sealed-render
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 7
