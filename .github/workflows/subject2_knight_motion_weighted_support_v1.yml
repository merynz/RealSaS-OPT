name: subject2-knight-motion-weighted-support-v1

on:
  push:
    branches:
      - research/vf11-certified-adaptive-20260921
    paths:
      - 'canonical/KNIGHT_MOTION_SOURCE_ACTION_DIAGNOSTIC_20260927.json'
  workflow_dispatch:

concurrency:
  group: subject2-knight-motion-weighted-support-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 15
    env:
      RUN_ID: SUBJECT2_KNIGHT_DEMO_V2_20260924
      AUTHORITY_ROOT: /home/monster/realsas_authority

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt

      - name: Measure target skin support descriptors
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m tools.motion.diagnose_target_skin_support_v1 \
            --authority-root "$AUTHORITY_ROOT" \
            --run-id "$RUN_ID" \
            --out canonical/KNIGHT_MOTION_TARGET_SKIN_SUPPORT_DIAGNOSTIC_20260927.json

      - name: Measure noninjective weighted support field
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m tools.motion.diagnose_weighted_support_field_v1 \
            --source-report canonical/KNIGHT_MOTION_SOURCE_ACTION_DIAGNOSTIC_20260927.json \
            --target-report canonical/KNIGHT_MOTION_TARGET_SKIN_SUPPORT_DIAGNOSTIC_20260927.json \
            --support-count 4 \
            --out canonical/KNIGHT_MOTION_WEIGHTED_SUPPORT_FIELD_DIAGNOSTIC_20260927.json

      - name: Seal diagnostics
        run: |
          set -euo pipefail
          git config user.name realsas-self-hosted-runner
          git config user.email runner@realsas.local
          git add \
            canonical/KNIGHT_MOTION_TARGET_SKIN_SUPPORT_DIAGNOSTIC_20260927.json \
            canonical/KNIGHT_MOTION_WEIGHTED_SUPPORT_FIELD_DIAGNOSTIC_20260927.json
          if git diff --cached --quiet; then
            echo "MOTION_WEIGHTED_SUPPORT_DIAGNOSTICS_UNCHANGED"
            exit 0
          fi
          git commit -m 'diagnostic: seal Knight weighted motion support field'
          git fetch origin research/vf11-certified-adaptive-20260921
          git rebase origin/research/vf11-certified-adaptive-20260921
          git push origin HEAD:research/vf11-certified-adaptive-20260921
