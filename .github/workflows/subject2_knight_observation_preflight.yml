name: subject2-knight-v2-observation-preflight

on:
  push:
    branches:
      - ops/current-main-knight-render-20260930
    paths:
      - '.github/workflows/subject2_knight_observation_preflight.yml'

permissions:
  contents: read

jobs:
  render-and-preflight:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 180
    env:
      REALSAS_AUTHORITY_ROOT: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_CORRECTED_MECHANICAL_CAA_HARMONIC_FIRST_IMMUTABLE_V1_70CBD671
      SUBJECT_ID: SUBJECT2_KNIGHT
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prove compiler runtime models are exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          echo "BRANCH_SHA=$(git rev-parse HEAD)"
          echo "CURRENT_MAIN_SHA=$(git rev-parse origin/main)"
          git diff --exit-code origin/main HEAD -- compiler runtime models requirements canonical/MAINLINE_EXECUTION_PLAN_V2.json
          echo CURRENT_MAIN_SOURCE_TREE_EXACT_PASS

      - name: Install pinned dependencies
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt

      - name: Preserve historical ledger and prepare same-lineage current-main execution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path

          authority=Path(os.environ["REALSAS_AUTHORITY_ROOT"])
          root=authority/"runs"/os.environ["RUN_ID"]
          manifest_path=root/"run_manifest.json"
          if not manifest_path.is_file():
              raise RuntimeError(f"RUN_MANIFEST_MISSING:{manifest_path}")

          ledger_path=root/"ACTIVE_RUN_V2.json"
          current_scope="REALSAS_V2_CURRENT_MAIN_KNIGHT_RENDER_DIAGNOSTIC"
          already_current=False
          if ledger_path.is_file():
              existing=json.loads(ledger_path.read_text())
              already_current=str(existing.get("architecture_scope") or "")==current_scope

          if not already_current:
              backup=authority/"historical_run_backups"/(os.environ["RUN_ID"]+"_PRE_CURRENT_MAIN_20260930")
              backup.mkdir(parents=True,exist_ok=True)
              if ledger_path.is_file():
                  dst=backup/"ACTIVE_RUN_V2.json"
                  if not dst.exists():
                      shutil.move(str(ledger_path),str(dst))
                  else:
                      ledger_path.unlink()
              artifacts=root/"artifacts"
              if artifacts.exists():
                  dst=backup/"artifacts"
                  if not dst.exists():
                      shutil.move(str(artifacts),str(dst))
                  else:
                      shutil.rmtree(artifacts)
              print("HISTORICAL_RUN_STATE_BACKED_UP",backup)
          else:
              print("CURRENT_MAIN_RUN_STATE_RESUME")

          manifest=json.loads(manifest_path.read_text())
          if str(manifest.get("run_id") or "")!=os.environ["RUN_ID"]:
              raise RuntimeError("EXACT_RUN_ID_LINEAGE_DRIFT")
          if str(manifest.get("subject_id") or "")!=os.environ["SUBJECT_ID"]:
              raise RuntimeError("EXACT_SUBJECT_ID_DRIFT")

          expected={"demo_idle_v1","demo_run_v1","demo_slash_v1"}
          sources=list(dict(manifest.get("motion") or {}).get("sources") or [])
          if len(sources)!=3 or {str(x.get("clip_id")) for x in sources}!=expected:
              donor=None
              for frag in sorted(authority.rglob("MOTION_RUN_MANIFEST_FRAGMENT.json")):
                  try:
                      payload=json.loads(frag.read_text())
                      candidate_motion=dict(payload.get("motion") or {})
                      rows=list(candidate_motion.get("sources") or [])
                  except Exception:
                      continue
                  if len(rows)!=3 or {str(x.get("clip_id")) for x in rows}!=expected:
                      continue
                  valid=True
                  for row in rows:
                      ref=dict(row.get("file") or {})
                      raw=str(ref.get("path") or "")
                      fp=(authority/raw.split("/",1)[1]) if raw.startswith("$REALSAS_AUTHORITY_ROOT/") else Path(raw).expanduser()
                      if not fp.is_file() or hashlib.sha256(fp.read_bytes()).hexdigest()!=str(ref.get("sha256") or ""):
                          valid=False
                          break
                  if valid:
                      donor=(frag,candidate_motion)
                      break
              if donor is None:
                  raise RuntimeError("THREE_CLIP_MOTION_FRAGMENT_NOT_FOUND")
              manifest["motion"]=donor[1]
              print("MOTION_INPUT_REUSED_FROM_FRAGMENT",donor[0])

          manifest_path.write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          print("EXACT_RUN_ID_PRESERVED",os.environ["RUN_ID"])
          PY

      - name: Hydrate exact relative authority documents referenced by manifest
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin audit/knight-rest-visual-owner-20260930 research/vf11-certified-adaptive-20260921
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ["REALSAS_AUTHORITY_ROOT"])/"runs"/os.environ["RUN_ID"]
          manifest=json.loads((root/"run_manifest.json").read_text())
          refs={}
          def walk(x):
              if isinstance(x,dict):
                  if isinstance(x.get("path"),str) and isinstance(x.get("sha256"),str) and len(x["sha256"])==64:
                      refs[x["path"]]=x["sha256"]
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(manifest)
          branches=["origin/audit/knight-rest-visual-owner-20260930","origin/research/vf11-certified-adaptive-20260921"]
          hydrated=0
          workspace=Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          for rel,expected in sorted(refs.items()):
              if rel.startswith("$REALSAS_AUTHORITY_ROOT/"):
                  continue
              raw=Path(rel).expanduser()
              if raw.is_absolute():
                  try:
                      repo_rel=raw.resolve().relative_to(workspace)
                  except ValueError:
                      # External immutable data under authority root is already
                      # materialized and must not be copied into the checkout.
                      continue
                  path=workspace/repo_rel
              else:
                  repo_rel=raw
                  path=workspace/repo_rel
              if path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest()==expected:
                  continue
              payload=None
              source=None
              for ref in branches:
                  q=subprocess.run(["git","show",f"{ref}:{repo_rel.as_posix()}"],capture_output=True)
                  if q.returncode==0 and hashlib.sha256(q.stdout).hexdigest()==expected:
                      payload=q.stdout; source=ref; break
              if payload is None:
                  raise RuntimeError(f"RELATIVE_AUTHORITY_NOT_RECOVERED:{repo_rel}:{expected}")
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(payload)
              hydrated+=1
              print("HYDRATED",repo_rel,source)
          print("HYDRATED_RELATIVE_AUTHORITY_COUNT",hydrated)
          PY

      - name: Build and bind exact current-main native player
        shell: bash
        run: |
          set -euo pipefail
          root="$REALSAS_AUTHORITY_ROOT/runs/$RUN_ID"
          mkdir -p "$root/tools/current_main_runtime"
          player="$root/tools/current_main_runtime/realsas_runtime_v2_caa_reference"
          c++ -std=c++17 -O3 -DNDEBUG runtime/realsas_cpp/src/runtime_v2_caa_reference.cpp -lpng -lz -o "$player"
          test -x "$player"
          PLAYER="$player" python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["REALSAS_AUTHORITY_ROOT"])/"runs"/os.environ["RUN_ID"]
          path=root/"run_manifest.json"
          manifest=json.loads(path.read_text())
          player=Path(os.environ["PLAYER"]).resolve()
          sha=hashlib.sha256(player.read_bytes()).hexdigest()
          runtime=dict(manifest.get("runtime") or {})
          runtime["native_player"]={"path":str(player),"sha256":sha}
          manifest["runtime"]=runtime
          path.write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          print("CURRENT_MAIN_NATIVE_PLAYER",sha)
          PY
          echo "PLAYER=$player" >> "$GITHUB_ENV"

      - name: Initialize or resume exact-lineage current-main 46-stage demo ledger
        shell: bash
        run: |
          set -euo pipefail
          ledger="$REALSAS_AUTHORITY_ROOT/runs/$RUN_ID/ACTIVE_RUN_V2.json"
          if test -s "$ledger"; then
            echo CURRENT_MAIN_LEDGER_RESUME
          else
            python -m compiler.realsas_compiler_services.orchestrator.mainline init-run --run-id "$RUN_ID" --subject-id "$SUBJECT_ID" --architecture-scope REALSAS_V2_CURRENT_MAIN_KNIGHT_RENDER_DIAGNOSTIC --execution-class DEMO_WITNESS
          fi
          python -m compiler.realsas_compiler_services.orchestrator.mainline status --run-id "$RUN_ID"

      - name: Execute exact current-main DAG
        shell: bash
        run: |
          set +e
          python -m compiler.realsas_compiler_services.orchestrator.mainline execute             --run-id "$RUN_ID"             --target 46_PRODUCT_CLOSURE_SEAL
          rc=$?
          python -m compiler.realsas_compiler_services.orchestrator.mainline status --run-id "$RUN_ID" || true
          echo "EXECUTE_RC=$rc" >> "$GITHUB_ENV"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["REALSAS_AUTHORITY_ROOT"])/"runs"/os.environ["RUN_ID"]
          ledger=json.loads((root/"ACTIVE_RUN_V2.json").read_text())
          print("CURRENT_MAIN_STAGE_SUMMARY",json.dumps({
              "pass_count":sum(str(x.get("status") or "") in {"PASS","PASS_DEMO_ONLY","CACHE_HIT"} for x in ledger["stages"]),
              "pending_count":sum(str(x.get("status") or "")=="PENDING" for x in ledger["stages"]),
              "failures":[{"ordinal":x["ordinal"],"id":x["id"],"status":x["status"],"blockers":x.get("blockers") or []} for x in ledger["stages"] if str(x.get("status") or "") in {"FAIL","ABSTAIN","BLOCKED"}],
          },sort_keys=True))
          PY
          exit 0

      - name: Render current-main RSS to GIFs when Stage43 exists
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/current_main_knight_render"
          rm -rf "$out"; mkdir -p "$out"
          OUT_DIR="$out" python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          import numpy as np
          from PIL import Image

          root=Path(os.environ["REALSAS_AUTHORITY_ROOT"])/"runs"/os.environ["RUN_ID"]
          ledger=json.loads((root/"ACTIVE_RUN_V2.json").read_text())
          by={x["id"]:x for x in ledger["stages"]}
          report={
              "schema":"RealSaS.CurrentMainKnightRenderReport.v1",
              "run_id":os.environ["RUN_ID"],
              "execution_sha":os.environ["GITHUB_SHA"],
              "current_main_source_tree_exact":True,
              "execute_rc":int(os.environ.get("EXECUTE_RC","-1")),
              "stage_status":{x["id"]:x["status"] for x in ledger["stages"]},
          }
          s42=by["42_RUNTIME_PROJECTION_AND_CAA_BINDING"]
          s43=by["43_RSS_MATERIALIZE_COMPACT"]
          report["stage42_status"]=s42["status"]
          report["stage43_status"]=s43["status"]
          if str(s43["status"]) not in {"PASS","PASS_DEMO_ONLY"}:
              Path(os.environ["OUT_DIR"],"REPORT.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
              raise SystemExit(0)
          rss_rows=[x for x in s43.get("outputs") or [] if x.get("schema")=="application/x-realsas-rss-v2"]
          proj_rows=[x for x in s42.get("outputs") or [] if x.get("schema")=="RealSaS.RuntimeProjectionIR.v2"]
          if len(rss_rows)!=1 or len(proj_rows)!=1:
              raise RuntimeError("RUNTIME_OUTPUT_NOT_UNIQUE")
          rss=Path(rss_rows[0]["path"])
          projection=json.loads(Path(proj_rows[0]["path"]).read_text())
          resolution=int(next(v for v in projection["views"] if v["view_id"]=="V0")["camera"]["resolution"])
          player=Path(os.environ["PLAYER"])
          report["rss_sha256"]=rss_rows[0]["sha256"]
          report["resolution"]=resolution
          report["clips"]=[]
          for clip in projection["clips"]:
              cid=str(clip["clip_id"])
              n=int(clip["frame_count"])
              dur=float(clip["duration_seconds"])
              sample_count=min(n,24)
              indices=sorted(set(int(round(i*(n-1)/max(1,sample_count-1))) for i in range(sample_count)))
              frames=[]
              for fi in indices:
                  raw=Path(os.environ["OUT_DIR"])/f"{cid}_V0_{fi:04d}.rgba"
                  proc=subprocess.run([str(player),str(rss),"--clip",cid,"--view","V0","--frame",str(fi),"--out-rgba",str(raw)],capture_output=True,text=True)
                  if proc.returncode!=0:
                      raise RuntimeError(f"NATIVE_RENDER_FAIL:{cid}:{fi}:{proc.stderr}")
                  arr=np.frombuffer(raw.read_bytes(),dtype=np.uint8)
                  if arr.size!=resolution*resolution*4:
                      raise RuntimeError(f"RGBA_SIZE_DRIFT:{cid}:{fi}:{arr.size}")
                  frames.append(Image.fromarray(arr.reshape(resolution,resolution,4),"RGBA"))
                  raw.unlink()
              delay=max(40,int(round(1000.0*dur/max(1,n-1))))
              gif=Path(os.environ["OUT_DIR"])/f"KNIGHT_{cid.upper()}_CURRENT_MAIN.gif"
              pframes=[im.convert("P",palette=Image.Palette.ADAPTIVE,colors=255) for im in frames]
              pframes[0].save(gif,save_all=True,append_images=pframes[1:],duration=delay,loop=0,disposal=2,optimize=False,transparency=0)
              report["clips"].append({"clip_id":cid,"frame_count":n,"sampled_indices":indices,"gif":gif.name})
          Path(os.environ["OUT_DIR"],"REPORT.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          PY
          echo "OUT_DIR=$out" >> "$GITHUB_ENV"

      - name: Upload current-main Knight render
        uses: actions/upload-artifact@v4
        with:
          name: current-main-knight-render
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 7
