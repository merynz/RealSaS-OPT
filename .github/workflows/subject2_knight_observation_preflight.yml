name: subject2-knight-v2-observation-preflight

on:
  push:
    branches:
      - ops/current-main-knight-render-20260930
    paths:
      - '.github/workflows/subject2_knight_observation_preflight.yml'

permissions:
  contents: read

jobs:
  render-and-preflight:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 10
    env:
      REALSAS_AUTHORITY_ROOT: /home/monster/realsas_authority
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit existing Knight V2 run roots against current branch source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["REALSAS_AUTHORITY_ROOT"])/"runs"
          rows=[]
          for d in sorted(root.glob("*KNIGHT*")):
              if not d.is_dir():
                  continue
              ledger=d/"ACTIVE_RUN_V2.json"
              manifest=d/"run_manifest.json"
              row={"run_id":d.name,"ledger":ledger.is_file(),"manifest":manifest.is_file()}
              if ledger.is_file():
                  p=json.loads(ledger.read_text())
                  stages=list(p.get("stages") or [])
                  row.update({
                      "execution_class":p.get("execution_class"),
                      "status":p.get("status"),
                      "completed_count":p.get("completed_count"),
                      "total_count":p.get("total_count"),
                      "pass_count":sum(str(x.get("status") or "").startswith("PASS") for x in stages),
                      "fail_count":sum(str(x.get("status") or "") in {"FAIL","ABSTAIN","BLOCKED"} for x in stages),
                      "pending_count":sum(str(x.get("status") or "")=="PENDING" for x in stages),
                      "passes":[{"ordinal":x.get("ordinal"),"id":x.get("id"),"status":x.get("status")} for x in stages if str(x.get("status") or "").startswith("PASS")],
                      "failures":[{"ordinal":x.get("ordinal"),"id":x.get("id"),"status":x.get("status"),"blockers":x.get("blockers") or []} for x in stages if str(x.get("status") or "") in {"FAIL","ABSTAIN","BLOCKED"}],
                  })
              rows.append(row)
          out=Path("/tmp/current_main_knight_runroots.json")
          out.write_text(json.dumps(rows,indent=2,sort_keys=True)+"\n")
          print(out.read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: current-main-knight-runroot-audit
          path: /tmp/current_main_knight_runroots.json
          if-no-files-found: error
          retention-days: 2
