name: teacher-truth-revalidation-v1

on:
  pull_request:
    paths:
      - 'models/iris/truth/component_geometry_training_targets_v1.py'
      - 'tools/corpus/plan_teacher_truth_revalidation_v1.py'
      - 'tools/corpus/*teacher_source_inspection_v1.py'
      - 'tools/corpus/compile_expanded_subject_candidates_v1.py'
      - 'tools/corpus/revalidate_existing_truth139_v1.py'
      - 'tools/corpus/probe_closed_source_embedding_v1.py'
      - 'tools/corpus/probe_source_coincidence_weights_v1.py'
      - 'tools/corpus/*source_union_solid_candidate_v1.py'
      - 'tools/corpus/revalidate_existing_source_observations_v1.py'
      - 'tools/corpus/prepare_expanded_corpus_source_bundle_v1.py'
      - 'tools/training/*tessa_teacher*'
      - 'tools/training/tessa_candidate_diagnostics_v1.py'
      - 'tests/corpus/test_teacher*'
      - 'tests/corpus/test_expanded_teacher_source_inspection_v1.py'
      - 'tests/corpus/test_existing_truth139_numeric_revalidation_v1.py'
      - 'tests/corpus/test_source_embedding_and_weights_probes_v1.py'
      - 'tests/corpus/test_source_union_solid_candidate_v1.py'
      - 'tests/corpus/test_expanded_corpus_source_bundle_v1.py'
      - 'tests/corpus/test_*component*'
      - 'tests/corpus/test_tessa*'
      - 'tests/training/test_tessa_candidate_diagnostics_v1.py'
      - 'canonical/CORPUS_TEACHER_INSPECTION_AND_REUSE_POLICY_V1.json'
      - '.github/workflows/teacher-truth-revalidation-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teacher-contracts:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU court dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 trimesh==5.2.0 Rtree==1.4.1 Pillow==12.3.0 pytest==9.2.0
      - name: Verify source, sign and teacher contracts
        run: |
          python -m pytest -q \
            tests/corpus/test_component_geometry_authority_v1.py \
            tests/corpus/test_component_geometry_court_v1.py \
            tests/corpus/test_component_geometry_authority_e2e_v1.py \
            tests/corpus/test_iris_component_geometry_consumer_v1.py \
            tests/corpus/test_tessa_component_surface_topology_v1.py \
            tests/corpus/test_tessa_mechanical_surface_topology_v5.py \
            tests/corpus/test_teacher_sign_scope_regression_v1.py \
            tests/corpus/test_teacher_truth_revalidation_plan_v1.py \
            tests/corpus/test_expanded_teacher_source_inspection_v1.py \
            tests/corpus/test_corpus_structural_geometry_audit_v1.py \
            tests/training/test_truth139_v32_spatial_index_v1.py \
            tests/training/test_tessa_candidate_diagnostics_v1.py

  numeric-inspection-kernels:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless mesh and CPU numeric dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libopengl0
          python -m pip install numpy==2.3.5 scipy==1.17.0 trimesh==5.2.0 Rtree==1.4.1 Pillow==12.3.0 pytest==9.2.0 pymeshlab==2025.7.post1 manifold3d==3.5.4
          python -m pip install torch==2.8.0+cpu torchvision==0.23.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Verify geometry identity, intersections and mechanical seam evidence
        run: |
          python -m pytest -q \
            tests/corpus/test_existing_truth139_numeric_revalidation_v1.py \
            tests/corpus/test_source_embedding_and_weights_probes_v1.py \
            tests/corpus/test_source_union_solid_candidate_v1.py \
            tests/corpus/test_expanded_corpus_source_bundle_v1.py
