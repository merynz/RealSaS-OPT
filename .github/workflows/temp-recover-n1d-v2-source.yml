name: Temporary recover exact N1D V2 source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact research authority commit
        uses: actions/checkout@v4
        with:
          ref: 08620737ce526b0c0cc6c551f53910e34a1107fe
      - name: Diagnose persisted source bundle and decode
        shell: bash
        run: |
          set -euo pipefail
          cd research/n1d/global_mechanical_solver_20260819
          P0=source_bundle_b64/global_relational_candidate_solver_v2_exec.py.b64.part00
          P1=source_bundle_b64/global_relational_candidate_solver_v2_exec.py.b64.part01
          P2=source_bundle_b64/global_relational_candidate_solver_v2_exec.py.b64.part02
          sha256sum "$P0" "$P1" "$P2"
          cat "$P0" "$P1" "$P2" > global_relational_candidate_solver_v2_exec.CONCAT.b64
          echo '--- concatenated base64 ---'
          sha256sum global_relational_candidate_solver_v2_exec.CONCAT.b64
          wc -c global_relational_candidate_solver_v2_exec.CONCAT.b64
          base64 -d global_relational_candidate_solver_v2_exec.CONCAT.b64 > global_relational_candidate_solver_v2_exec.RECOVERED.py
          echo '--- decoded source ---'
          sha256sum global_relational_candidate_solver_v2_exec.RECOVERED.py
          wc -c global_relational_candidate_solver_v2_exec.RECOVERED.py
          python -m py_compile global_relational_candidate_solver_v2_exec.RECOVERED.py
      - name: Upload diagnostic recovery bytes
        uses: actions/upload-artifact@v4
        with:
          name: n1d-v2-source-recovery-diagnostic
          path: |
            research/n1d/global_mechanical_solver_20260819/global_relational_candidate_solver_v2_exec.CONCAT.b64
            research/n1d/global_mechanical_solver_20260819/global_relational_candidate_solver_v2_exec.RECOVERED.py
            research/n1d/global_mechanical_solver_20260819/GLOBAL_RELATIONAL_CANDIDATE_SOLVER_V2_SOURCE_MANIFEST.json
          if-no-files-found: error
          retention-days: 1
