name: Temporary recover exact N1D V2 source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact research authority history
        uses: actions/checkout@v4
        with:
          ref: 08620737ce526b0c0cc6c551f53910e34a1107fe
          fetch-depth: 0
      - name: Scan persisted V2 source history
        shell: bash
        run: |
          set -euo pipefail
          cd research/n1d/global_mechanical_solver_20260819
          P0=source_bundle_b64/global_relational_candidate_solver_v2_exec.py.b64.part00
          P1=source_bundle_b64/global_relational_candidate_solver_v2_exec.py.b64.part01
          P2=source_bundle_b64/global_relational_candidate_solver_v2_exec.py.b64.part02
          MAN=GLOBAL_RELATIONAL_CANDIDATE_SOLVER_V2_SOURCE_MANIFEST.json
          EXP_CONCAT=07c43f50039bd45968fdc3872af09978241b73b6f3f7cecaf4c533aab8a73ce6
          EXP_DEC=047c264e5a59ff05386cb801e23f0fb8a083828817a329737c50b407093ae8ba
          ROOT=$(git rev-parse --show-toplevel)
          cd "$ROOT"
          echo '=== TOUCH HISTORY ==='
          git log --format='%H %s' -- "research/n1d/global_mechanical_solver_20260819/$P0" "research/n1d/global_mechanical_solver_20260819/$P1" "research/n1d/global_mechanical_solver_20260819/$P2" "research/n1d/global_mechanical_solver_20260819/$MAN"
          echo '=== VERSION SCAN ==='
          : > /tmp/history_scan.txt
          for C in $(git rev-list HEAD -- "research/n1d/global_mechanical_solver_20260819/$P0" "research/n1d/global_mechanical_solver_20260819/$P1" "research/n1d/global_mechanical_solver_20260819/$P2"); do
            if git cat-file -e "$C:research/n1d/global_mechanical_solver_20260819/$P0" 2>/dev/null && \
               git cat-file -e "$C:research/n1d/global_mechanical_solver_20260819/$P1" 2>/dev/null && \
               git cat-file -e "$C:research/n1d/global_mechanical_solver_20260819/$P2" 2>/dev/null; then
              git show "$C:research/n1d/global_mechanical_solver_20260819/$P0" > /tmp/p0
              git show "$C:research/n1d/global_mechanical_solver_20260819/$P1" > /tmp/p1
              git show "$C:research/n1d/global_mechanical_solver_20260819/$P2" > /tmp/p2
              cat /tmp/p0 /tmp/p1 /tmp/p2 > /tmp/all.b64
              CS=$(sha256sum /tmp/all.b64 | awk '{print $1}')
              if base64 -d /tmp/all.b64 > /tmp/decoded.py 2>/dev/null; then
                DS=$(sha256sum /tmp/decoded.py | awk '{print $1}')
                SZ=$(wc -c < /tmp/decoded.py)
              else
                DS=DECODE_FAIL
                SZ=0
              fi
              B0=$(git rev-parse "$C:research/n1d/global_mechanical_solver_20260819/$P0")
              B1=$(git rev-parse "$C:research/n1d/global_mechanical_solver_20260819/$P1")
              B2=$(git rev-parse "$C:research/n1d/global_mechanical_solver_20260819/$P2")
              MSG=$(git show -s --format=%s "$C")
              printf '%s | concat=%s | decoded=%s | size=%s | blobs=%s,%s,%s | %s\n' "$C" "$CS" "$DS" "$SZ" "$B0" "$B1" "$B2" "$MSG" | tee -a /tmp/history_scan.txt
              if [ "$CS" = "$EXP_CONCAT" ] || [ "$DS" = "$EXP_DEC" ]; then
                echo "MATCH_FOUND $C concat=$CS decoded=$DS"
                cp /tmp/decoded.py /tmp/MATCHED_global_relational_candidate_solver_v2_exec.py
              fi
            fi
          done
          echo '=== EXPECTED HASH SEARCH ==='
          grep -E "$EXP_CONCAT|$EXP_DEC" /tmp/history_scan.txt || true
          cp /tmp/history_scan.txt research/n1d/global_mechanical_solver_20260819/V2_SOURCE_HISTORY_SCAN.txt
          if [ -f /tmp/MATCHED_global_relational_candidate_solver_v2_exec.py ]; then
            cp /tmp/MATCHED_global_relational_candidate_solver_v2_exec.py research/n1d/global_mechanical_solver_20260819/MATCHED_global_relational_candidate_solver_v2_exec.py
          fi
      - name: Upload history scan
        uses: actions/upload-artifact@v4
        with:
          name: n1d-v2-source-history-scan
          path: |
            research/n1d/global_mechanical_solver_20260819/V2_SOURCE_HISTORY_SCAN.txt
            research/n1d/global_mechanical_solver_20260819/MATCHED_global_relational_candidate_solver_v2_exec.py
          if-no-files-found: warn
          retention-days: 1
