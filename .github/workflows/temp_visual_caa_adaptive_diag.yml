name: temp-visual-caa-adaptive-diagnostic

on:
  push:
    branches:
      - visual/sealed-material-20261009
    paths:
      - '.github/workflows/temp_visual_caa_adaptive_diag.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/sealed-material-20261009
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt pyyaml
      - name: Apply exact adaptive candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, yaml
          data = yaml.safe_load(Path('.github/workflows/temp_visual_caa_adaptive_final.yml').read_text())
          script = next(step['run'] for step in data['jobs']['validate-commit']['steps'] if step.get('name') == 'Apply candidate then remove fixed-resolution visual shortcut')
          subprocess.run(['bash','-lc',script],check=True)
          PY
      - name: Capture adaptive behavioral failure
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -vv -s \
            tests/compiler/test_product_mesh_stage_adapters_v1.py::test_vf23_source_visual_chain_proves_transport_but_not_full_product \
            2>&1 | tee /tmp/source_visual_caa_adaptive_failure.log
      - name: Upload adaptive failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-visual-caa-adaptive-failure
          path: /tmp/source_visual_caa_adaptive_failure.log
          if-no-files-found: error
          retention-days: 1
