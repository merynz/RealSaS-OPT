name: temp-visual-caa-adaptive-final

on:
  push:
    branches:
      - visual/sealed-material-20261009
    paths:
      - '.github/workflows/temp_visual_caa_adaptive_final.yml'

permissions:
  contents: write

jobs:
  validate-commit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 45
    env:
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/sealed-material-20261009
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt pyyaml
      - name: Apply candidate then remove fixed-resolution visual shortcut
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, yaml

          # Apply the already-audited candidate and its stronger provenance test.
          data = yaml.safe_load(Path('.github/workflows/temp_visual_caa_final_apply.yml').read_text())
          script = next(step['run'] for step in data['jobs']['finalize']['steps'] if step.get('name') == 'Apply producer patch and strengthen accounting regression')
          subprocess.run(['bash','-lc',script],check=True)

          path = Path('compiler/realsas_compiler_services/orchestrator/adapters/appearance_v2.py')
          text = path.read_text(encoding='utf-8')

          old_mode = '''def _source_owned_visual_mode_from_prereg(prereg) -> bool:\n    return (\n        str(dict(prereg.compile_policy or {}).get("tile_resolution_strategy") or "")\n        == "SOURCE_VISUAL_MESH_V1"\n    )\n'''
          new_mode = '''def _source_owned_visual_mode_from_prereg(prereg) -> bool:\n    policy = dict(prereg.compile_policy or {})\n    return (\n        policy.get("source_owned_visual_mesh_mode") is True\n        or str(policy.get("tile_resolution_strategy") or "")\n        == "SOURCE_VISUAL_MESH_V1"\n    )\n'''
          if text.count(old_mode) != 1:
              raise RuntimeError(f'SOURCE_VISUAL_MODE_MATCH:{text.count(old_mode)}')
          text = text.replace(old_mode, new_mode, 1)

          old_policy = '''        compile_policy = dict(policy["compile_policy"])\n        compile_policy["tile_resolution"] = 4\n        compile_policy["tile_resolution_strategy"] = "SOURCE_VISUAL_MESH_V1"\n        compile_policy["max_supported_face_count"] = int(\n            sum(int(row.face_count) for row in visual_set.views)\n        )\n        compile_policy["visual_mesh_set_binding_hash"] = visual_set.set_hash\n        compile_policy["visual_geometry_authority"] = "SOURCE_ART_SILHOUETTE"\n        compile_policy["mechanical_mesh_render_authority"] = False\n        compile_policy["visual_uv_authority"] = "FIXED_SOURCE_RASTER_UV"\n        compile_policy["runtime_generation_forbidden"] = True\n        compile_policy["cross_view_completion_authorized"] = True\n        compile_policy["canonical_surface_completion_authorized"] = True\n        compile_policy["source_owned_visual_mesh_mode"] = True\n'''
          new_policy = '''        compile_policy = dict(policy["compile_policy"])\n        if str(compile_policy.get("tile_resolution_mode") or "") != "PROJECTED_SOURCE_DENSITY_V1":\n            raise QualificationError("CAA_TILE_RESOLUTION_MODE_UNSUPPORTED")\n        _source_rgba, source_masks = _load_source_inputs(ctx, observation)\n        tile_evidence = projected_adaptive_face_tile_evidence(\n            candidate=candidate,\n            cameras=cameras.cameras,\n            foreground_mask_by_view=source_masks,\n            candidate_resolutions=tuple(\n                int(value)\n                for value in compile_policy.get("tile_resolution_candidates") or ()\n            ),\n            max_source_pixels_per_atlas_texel=float(\n                compile_policy["max_source_pixels_per_atlas_texel"]\n            ),\n            bleed_px=int(compile_policy["bleed_px"]),\n            max_atlas_resolution=int(compile_policy["max_atlas_resolution"]),\n        )\n        if int(tile_evidence["unsatisfied_face_count"]) != 0:\n            return {\n                "status": "FAIL",\n                "blockers": ["CAA_ADAPTIVE_TILE_DENSITY_UNSATISFIED"],\n                "diagnostics": {\n                    "backend_id": backend,\n                    "shipping_eligible": False,\n                    "contract_sha256": contract_sha,\n                    "raster_correspondence_prerequisite": "PASS",\n                    "appearance_domain": "SOURCE_OWNED_VISUAL_MESH",\n                    "visual_mesh_set_hash": visual_set.set_hash,\n                    "tile_resolution_evidence": tile_evidence,\n                },\n            }\n        compile_policy["tile_resolution"] = int(\n            tile_evidence["maximum_required_resolution"]\n        )\n        compile_policy["tile_resolution_strategy"] = "PER_FACE_ADAPTIVE_V1"\n        compile_policy["face_tile_resolutions"] = list(\n            tile_evidence["selected_resolution_by_face"]\n        )\n        compile_policy["sample_count_per_direction"] = int(\n            tile_evidence["sample_count_per_direction"]\n        )\n        compile_policy["adaptive_atlas_page_count"] = int(\n            tile_evidence["deterministic_shelf_page_count"]\n        )\n        compile_policy["adaptive_atlas_placement_hash"] = str(\n            tile_evidence["placement_hash"]\n        )\n        compile_policy["max_supported_face_count"] = int(tile_evidence["face_count"])\n        compile_policy["tile_resolution_evidence"] = tile_evidence\n        compile_policy["renderable_support_admission_contract"] = (\n            "SOURCE_OR_BOUNDED_LOCAL_COMPLETION_V1"\n        )\n        compile_policy["renderable_support_admission_contract_sha256"] = (\n            admission_contract_sha\n        )\n        compile_policy["unsupported_policy_disqualification_action"] = (\n            "EXPLICIT_COMPILER_ABSTENTION"\n        )\n        compile_policy["unsupported_provenance_code"] = int(\n            CAA_PROVENANCE["UNSUPPORTED_ABSTAIN"]\n        )\n        compile_policy["unsupported_source_view_value"] = -4\n        compile_policy["physical_padding_provenance_code"] = 255\n        compile_policy["thresholds_changed_for_admission"] = False\n        compile_policy["visual_mesh_set_binding_hash"] = visual_set.set_hash\n        compile_policy["visual_geometry_authority"] = "SOURCE_ART_SILHOUETTE"\n        compile_policy["mechanical_mesh_render_authority"] = False\n        compile_policy["visual_uv_authority"] = "FIXED_SOURCE_RASTER_UV"\n        compile_policy["runtime_generation_forbidden"] = True\n        compile_policy["cross_view_completion_authorized"] = True\n        compile_policy["canonical_surface_completion_authorized"] = True\n        compile_policy["source_owned_visual_mesh_mode"] = True\n'''
          if text.count(old_policy) != 1:
              raise RuntimeError(f'SOURCE_VISUAL_POLICY_MATCH:{text.count(old_policy)}')
          text = text.replace(old_policy, new_policy, 1)

          old_diag = '''                "cross_view_completion_authorized": True,\n                "canonical_surface_completion_authorized": True,\n'''
          new_diag = '''                "cross_view_completion_authorized": True,\n                "canonical_surface_completion_authorized": True,\n                "tile_resolution_evidence": tile_evidence,\n'''
          # Only the Stage20 source-owned diagnostics occurrence should be replaced.
          if text.count(old_diag) < 1:
              raise RuntimeError('SOURCE_VISUAL_DIAGNOSTIC_MATCH_MISSING')
          text = text.replace(old_diag, new_diag, 1)

          old_compile_mode = '    source_owned_visual_mode = strategy == "SOURCE_VISUAL_MESH_V1"\n'
          new_compile_mode = '    source_owned_visual_mode = _source_owned_visual_mode_from_prereg(prereg)\n'
          if text.count(old_compile_mode) != 1:
              raise RuntimeError(f'COMPILE_SOURCE_MODE_MATCH:{text.count(old_compile_mode)}')
          text = text.replace(old_compile_mode, new_compile_mode, 1)

          path.write_text(text, encoding='utf-8')
          PY
          python -m compileall -q compiler/realsas_compiler_services/orchestrator/adapters/appearance_v2.py tests/compiler/test_product_mesh_stage_adapters_v1.py
      - name: Stage20-25 and complete CAA bank
        run: |
          python -m pytest -q \
            tests/compiler/test_product_mesh_stage_adapters_v1.py::test_vf23_source_visual_chain_proves_transport_but_not_full_product \
            tests/compiler/test_caa_canonical_completion_v1.py \
            tests/compiler/test_caa_variational_completion_v1.py \
            tests/compiler/test_caa_v2_subject_free_policy.py \
            tests/compiler/test_visibility_and_caa_v2.py
      - name: Material and native source-visual bank
        env:
          REALSAS_RUNTIME_V2_PLAYER: /tmp/realsas_runtime_v2_caa_reference_adaptive_final
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -pedantic runtime/realsas_cpp/src/runtime_v2_caa_reference.cpp -lpng -lz -o "$REALSAS_RUNTIME_V2_PLAYER"
          python -m pytest -q \
            tests/compiler/test_visual_material_native_v1.py \
            tests/compiler/test_runtime_v2_source_owned_visual_native_smoke.py
      - name: Wider affected regressions
        run: |
          python -m pytest -q \
            tests/compiler/test_caa_abstention_contract_v1.py \
            tests/compiler/test_caa_adaptive_paging_v2.py \
            tests/compiler/test_caa_demo_static_mesh_admission_v2.py \
            tests/compiler/test_dynamic_appearance_conditioning_v2.py \
            tests/compiler/test_playback_appearance_authority_v2.py \
            tests/compiler/test_visual_mesh_arap_v1.py
      - name: Commit producer closure
        run: |
          git diff --check
          git config user.name 'RealSaS - OPT'
          git config user.email '140457344+merynz@users.noreply.github.com'
          git add compiler/realsas_compiler_services/orchestrator/adapters/appearance_v2.py tests/compiler/test_product_mesh_stage_adapters_v1.py
          git commit -m 'Restore complete CAA production for source-owned visuals'
          git push origin HEAD:visual/sealed-material-20261009
