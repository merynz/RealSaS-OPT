name: temp-visual-caa-apply-commit

on:
  push:
    branches:
      - visual/sealed-material-20261009
    paths:
      - '.github/workflows/temp_visual_caa_apply_commit.yml'

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 35
    env:
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/sealed-material-20261009
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install regression dependencies
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt pyyaml
      - name: Apply complete CAA producer patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, yaml
          data = yaml.safe_load(Path('.github/workflows/temp_visual_caa_completion_patch.yml').read_text())
          steps = data['jobs']['patch-and-validate']['steps']
          script = next(step['run'] for step in steps if step.get('name') == 'Restore complete CAA production on source-owned visual path')
          subprocess.run(['bash', '-lc', script], check=True)
          PY
          python -m compileall -q compiler/realsas_compiler_services/orchestrator/adapters/appearance_v2.py
      - name: Stage20-25 and complete CAA behavioral gates
        id: caa
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/compiler/test_product_mesh_stage_adapters_v1.py::test_vf23_source_visual_chain_proves_transport_but_not_full_product \
            tests/compiler/test_caa_canonical_completion_v1.py \
            tests/compiler/test_caa_variational_completion_v1.py \
            tests/compiler/test_caa_v2_subject_free_policy.py \
            tests/compiler/test_visibility_and_caa_v2.py \
            2>&1 | tee /tmp/source_visual_caa_apply.log
      - name: Material and native source-visual gates
        id: native
        if: steps.caa.outcome == 'success'
        continue-on-error: true
        env:
          REALSAS_RUNTIME_V2_PLAYER: /tmp/realsas_runtime_v2_caa_reference_completion_patch
        run: |
          set -o pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -pedantic runtime/realsas_cpp/src/runtime_v2_caa_reference.cpp -lpng -lz -o "$REALSAS_RUNTIME_V2_PLAYER" \
            2>&1 | tee -a /tmp/source_visual_caa_apply.log
          python -m pytest -q \
            tests/compiler/test_visual_material_native_v1.py \
            tests/compiler/test_runtime_v2_source_owned_visual_native_smoke.py \
            2>&1 | tee -a /tmp/source_visual_caa_apply.log
      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-visual-caa-apply-log
          path: /tmp/source_visual_caa_apply.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Commit validated producer fix
        if: steps.caa.outcome == 'success' && steps.native.outcome == 'success'
        run: |
          git diff --check
          git config user.name 'RealSaS - OPT'
          git config user.email '140457344+merynz@users.noreply.github.com'
          git add compiler/realsas_compiler_services/orchestrator/adapters/appearance_v2.py
          git commit -m 'Restore complete CAA production for source-owned visual path'
          git push origin HEAD:visual/sealed-material-20261009
      - name: Fail closed on regression
        if: steps.caa.outcome != 'success' || steps.native.outcome != 'success'
        run: exit 1
