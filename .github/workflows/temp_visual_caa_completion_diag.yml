name: temp-visual-caa-completion-diagnostic

on:
  push:
    branches:
      - visual/sealed-material-20261009
    paths:
      - '.github/workflows/temp_visual_caa_completion_diag.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/sealed-material-20261009
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install regression dependencies
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Reapply candidate patch from patch workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, yaml
          data = yaml.safe_load(Path('.github/workflows/temp_visual_caa_completion_patch.yml').read_text())
          steps = data['jobs']['patch-and-validate']['steps']
          target = next(step for step in steps if step.get('name') == 'Restore complete CAA production on source-owned visual path')
          subprocess.run(['bash', '-lc', target['run']], check=True)
          PY
      - name: Capture first failing Stage20-25 regression
        id: regression
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -vv -s \
            tests/compiler/test_product_mesh_stage_adapters_v1.py::test_vf23_stage20_to25_uses_unmodified_production_caa_policy \
            2>&1 | tee /tmp/source_visual_caa_failure.log
      - name: Capture broader CAA regression if first passes
        if: steps.regression.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -vv -s \
            tests/compiler/test_caa_canonical_completion_v1.py \
            tests/compiler/test_caa_variational_completion_v1.py \
            tests/compiler/test_caa_v2_subject_free_policy.py \
            tests/compiler/test_visibility_and_caa_v2.py \
            2>&1 | tee /tmp/source_visual_caa_failure.log
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-visual-caa-failure
          path: /tmp/source_visual_caa_failure.log
          if-no-files-found: error
          retention-days: 1
