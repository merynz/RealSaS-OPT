name: temp-visual-caa-completion-patch

on:
  push:
    branches:
      - visual/sealed-material-20261009
    paths:
      - '.github/workflows/temp_visual_caa_completion_patch.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 45
    env:
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/sealed-material-20261009
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install regression dependencies
        run: |
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Restore complete CAA production on source-owned visual path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('compiler/realsas_compiler_services/orchestrator/adapters/appearance_v2.py')
          text = path.read_text(encoding='utf-8')

          def mutate_function(source, name, mutate):
              marker = f'def {name}('
              start = source.index(marker)
              nxt = source.find('\ndef ', start + len(marker))
              if nxt < 0:
                  nxt = len(source)
              section = source[start:nxt]
              changed = mutate(section)
              if changed == section:
                  raise RuntimeError(f'NO_CHANGE:{name}')
              return source[:start] + changed + source[nxt:]

          def once(section, old, new, label):
              count = section.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}:EXPECTED_1_GOT_{count}')
              return section.replace(old, new, 1)

          def patch_preregister(section):
              section = once(
                  section,
                  '        compile_policy["cross_view_completion_authorized"] = False\n',
                  '        compile_policy["cross_view_completion_authorized"] = True\n'
                  '        compile_policy["canonical_surface_completion_authorized"] = True\n'
                  '        compile_policy["source_owned_visual_mesh_mode"] = True\n',
                  'PREREG_COMPLETION_POLICY',
              )
              section = once(
                  section,
                  '                "cross_view_completion_authorized": False,\n',
                  '                "cross_view_completion_authorized": True,\n'
                  '                "canonical_surface_completion_authorized": True,\n',
                  'PREREG_COMPLETION_DIAGNOSTIC',
              )
              return section

          text = mutate_function(text, 'preregister_caa_backend_stage', patch_preregister)

          def patch_compile(section):
              start_marker = '    if strategy == "SOURCE_VISUAL_MESH_V1":\n'
              end_marker = '\n    face_tile_resolutions = None\n'
              start = section.index(start_marker)
              end = section.index(end_marker, start)
              replacement = '''    source_owned_visual_mode = strategy == "SOURCE_VISUAL_MESH_V1"\n    visual_set = None\n    if source_owned_visual_mode:\n        visual_set = _visual_mesh_set(ctx)\n        if (\n            visual_set.set_hash\n            != str(compile_policy.get("visual_mesh_set_binding_hash") or "")\n        ):\n            raise QualificationError("CAA_VISUAL_COMPILE_MESH_SET_DRIFT")\n        if visual_set.observation_set_binding_hash != observation.observation_set_hash:\n            raise QualificationError("CAA_VISUAL_COMPILE_OBSERVATION_DRIFT")\n        rows = tuple(sorted(visual_set.views, key=lambda row: int(row.view_index)))\n        if len(rows) != 8:\n            raise QualificationError("CAA_VISUAL_COMPILE_REQUIRES_V0_V7")\n        if compile_policy.get("cross_view_completion_authorized") is not True:\n            raise QualificationError("CAA_VISUAL_CROSS_VIEW_COMPLETION_NOT_AUTHORIZED")\n        if compile_policy.get("canonical_surface_completion_authorized") is not True:\n            raise QualificationError("CAA_VISUAL_CANONICAL_COMPLETION_NOT_AUTHORIZED")\n        for row in rows:\n            vi = int(row.view_index)\n            source_visual_material(rgba[vi], masks[vi], vi)\n'''
              section = section[:start] + replacement + section[end:]
              section = once(
                  section,
                  '    elif strategy != "UNIFORM_FACE_LATTICE_V1":\n',
                  '    elif strategy not in ("UNIFORM_FACE_LATTICE_V1", "SOURCE_VISUAL_MESH_V1"):\n',
                  'COMPILE_STRATEGY_ALLOW_SOURCE_VISUAL',
              )
              section = once(
                  section,
                  '        metadata={\n            "component_ids": component_ids,\n',
                  '        metadata={\n'
                  '            "source_owned_visual_mesh_mode": bool(source_owned_visual_mode),\n'
                  '            "visual_mesh_set_binding_hash": (\n'
                  '                visual_set.set_hash if source_owned_visual_mode else ""\n'
                  '            ),\n'
                  '            "mechanical_mesh_render_authority": (\n'
                  '                False if source_owned_visual_mode else True\n'
                  '            ),\n'
                  '            "visual_geometry_authority": (\n'
                  '                "SOURCE_ART_SILHOUETTE" if source_owned_visual_mode else ""\n'
                  '            ),\n'
                  '            "canonical_surface_completion_produced": bool(\n'
                  '                source_owned_visual_mode\n'
                  '            ),\n'
                  '            "cross_view_completion_used": (\n'
                  '                int(counts["OTHER_VIEW_SOURCE"]) > 0\n'
                  '            ),\n'
                  '            "generated_appearance_used": (\n'
                  '                int(counts["COMPILED_LOCAL_HARMONIC"]) > 0\n'
                  '                or int(counts["CANONICAL_GLOBAL_COMPLETION"]) > 0\n'
                  '            ),\n'
                  '            "component_ids": component_ids,\n',
                  'COMPILE_METADATA_SOURCE_VISUAL',
              )
              section = once(
                  section,
                  '            "compile_hash": artifact.compile_hash,\n            "total_sample_count": total,\n',
                  '            "compile_hash": artifact.compile_hash,\n'
                  '            "source_owned_visual_mesh_mode": bool(source_owned_visual_mode),\n'
                  '            "visual_mesh_set_hash": (\n'
                  '                visual_set.set_hash if source_owned_visual_mode else ""\n'
                  '            ),\n'
                  '            "canonical_surface_completion_produced": bool(\n'
                  '                source_owned_visual_mode\n'
                  '            ),\n'
                  '            "total_sample_count": total,\n',
                  'COMPILE_DIAGNOSTICS_SOURCE_VISUAL',
              )
              return section

          text = mutate_function(text, 'compile_caa_stage', patch_compile)

          def patch_seal(section):
              needle = '''        and dict(artifact.metadata or {}).get("source_owned_visual_mesh_mode")\n        is True\n    ):'''
              replacement = '''        and dict(artifact.metadata or {}).get("source_owned_visual_mesh_mode")\n        is True\n        and dict(artifact.metadata or {}).get("compile_array_schema")\n        == "RealSaS.VisualAppearanceCompileArrays.v1"\n    ):'''
              return once(section, needle, replacement, 'SEAL_LEGACY_ONLY')

          text = mutate_function(text, 'seal_caa_compile_stage', patch_seal)

          def patch_bake(section):
              section = once(
                  section,
                  '        if visual_set.set_hash != visual_hash:\n            raise QualificationError("CAA_VISUAL_BAKE_MESH_SET_DRIFT")\n        root = ctx["run_root"] / "artifacts" / ctx["stage"]["id"]\n',
                  '        if visual_set.set_hash != visual_hash:\n'
                  '            raise QualificationError("CAA_VISUAL_BAKE_MESH_SET_DRIFT")\n'
                  '        compile_metadata = dict(artifact.metadata or {})\n'
                  '        canonical_completion_field_bound = (\n'
                  '            str(compile_metadata.get("compile_array_schema") or "")\n'
                  '            == "RealSaS.CAACompileArrays.v3"\n'
                  '        )\n'
                  '        if canonical_completion_field_bound:\n'
                  '            compile_path = resolved_path(artifact.compile_npz_path)\n'
                  '            if (\n'
                  '                not compile_path.is_file()\n'
                  '                or sha256_file(compile_path) != artifact.compile_npz_sha256\n'
                  '            ):\n'
                  '                raise QualificationError("CAA_VISUAL_COMPLETION_FIELD_BYTES_DRIFT")\n'
                  '            if compile_metadata.get("canonical_surface_completion_produced") is not True:\n'
                  '                raise QualificationError("CAA_VISUAL_COMPLETION_FIELD_AUTHORITY_MISSING")\n'
                  '        root = ctx["run_root"] / "artifacts" / ctx["stage"]["id"]\n',
                  'BAKE_BIND_COMPLETION_FIELD',
              )
              section = once(
                  section,
                  '                "total_appearance_asset": True,\n',
                  '                "total_appearance_asset": (\n'
                  '                    bool(compile_metadata.get("total_appearance_defined", False))\n'
                  '                    if canonical_completion_field_bound\n'
                  '                    else True\n'
                  '                ),\n',
                  'BAKE_TOTALITY_FROM_FIELD',
              )
              section = once(
                  section,
                  '                "cross_view_completion_used": False,\n                "generated_appearance_used": False,\n',
                  '                "cross_view_completion_used": bool(\n'
                  '                    canonical_completion_field_bound\n'
                  '                    and artifact.other_view_source_sample_count > 0\n'
                  '                ),\n'
                  '                "generated_appearance_used": bool(\n'
                  '                    canonical_completion_field_bound\n'
                  '                    and (\n'
                  '                        artifact.compiled_local_harmonic_sample_count > 0\n'
                  '                        or int(compile_metadata.get(\n'
                  '                            "canonical_global_completion_sample_count", 0\n'
                  '                        )) > 0\n'
                  '                    )\n'
                  '                ),\n'
                  '                "canonical_completion_field_bound": bool(\n'
                  '                    canonical_completion_field_bound\n'
                  '                ),\n'
                  '                "canonical_completion_field_path": (\n'
                  '                    str(artifact.compile_npz_path)\n'
                  '                    if canonical_completion_field_bound else ""\n'
                  '                ),\n'
                  '                "canonical_completion_field_sha256": (\n'
                  '                    str(artifact.compile_npz_sha256)\n'
                  '                    if canonical_completion_field_bound else ""\n'
                  '                ),\n'
                  '                "canonical_completion_field_compile_hash": (\n'
                  '                    str(artifact.compile_hash)\n'
                  '                    if canonical_completion_field_bound else ""\n'
                  '                ),\n'
                  '                "canonical_completion_field_schema": (\n'
                  '                    str(compile_metadata.get("compile_array_schema") or "")\n'
                  '                    if canonical_completion_field_bound else ""\n'
                  '                ),\n'
                  '                "canonical_completion_support_domain": (\n'
                  '                    "CANONICAL_SURFACE_ADDRESSING"\n'
                  '                    if canonical_completion_field_bound else ""\n'
                  '                ),\n'
                  '                "hidden_layer_support_qualified": False,\n',
                  'BAKE_COMPLETION_METADATA',
              )
              section = once(
                  section,
                  '        outputs.extend(\n            [\n',
                  '        if canonical_completion_field_bound:\n'
                  '            outputs.append(\n'
                  '                {\n'
                  '                    "path": str(artifact.compile_npz_path),\n'
                  '                    "sha256": str(artifact.compile_npz_sha256),\n'
                  '                    "authority_class": "CAA_CANONICAL_COMPLETION_FIELD_SIDECAR",\n'
                  '                    "schema": "RealSaS.CAACompileArrays.v3",\n'
                  '                }\n'
                  '            )\n'
                  '        outputs.extend(\n'
                  '            [\n',
                  'BAKE_OUTPUT_SIDECAR',
              )
              section = once(
                  section,
                  '                "generated_appearance_used": False,\n                "mechanical_mesh_render_authority": False,\n',
                  '                "generated_appearance_used": bool(\n'
                  '                    asset.metadata.get("generated_appearance_used")\n'
                  '                ),\n'
                  '                "cross_view_completion_used": bool(\n'
                  '                    asset.metadata.get("cross_view_completion_used")\n'
                  '                ),\n'
                  '                "canonical_completion_field_bound": bool(\n'
                  '                    canonical_completion_field_bound\n'
                  '                ),\n'
                  '                "mechanical_mesh_render_authority": False,\n',
                  'BAKE_DIAGNOSTIC_COMPLETION',
              )
              return section

          text = mutate_function(text, 'bake_complete_appearance_stage', patch_bake)

          def patch_qualify(section):
              insertion_point = '''    for texture in asset.textures:\n        _load_texture_pages(texture)\n\n'''
              validation = '''    for texture in asset.textures:\n        _load_texture_pages(texture)\n\n    source_owned_visual_mode = (\n        _source_owned_visual_mode_from_prereg(prereg)\n        and dict(asset.metadata or {}).get("source_owned_visual_mesh_mode") is True\n    )\n    compile_array_schema = str(\n        dict(artifact.metadata or {}).get("compile_array_schema") or ""\n    )\n    if source_owned_visual_mode:\n        visual_set = _visual_mesh_set(ctx)\n        visual_hash = str(\n            dict(asset.metadata or {}).get("visual_mesh_set_binding_hash") or ""\n        )\n        if visual_set.set_hash != visual_hash:\n            raise QualificationError("CAA_VISUAL_QUALIFICATION_MESH_SET_DRIFT")\n        observation = qualified_observation_set_from_dict(\n            stage_output_payload(\n                ctx,\n                "07_OBSERVATION_CONTRACT_QUALIFIED",\n                "RealSaS.QualifiedObservationSetIR.v1",\n            )\n        )\n        source_rgba, source_masks = _load_source_inputs(ctx, observation)\n        textures = {int(row.direction_index): row for row in asset.textures}\n        if set(textures) != set(range(8)):\n            raise QualificationError(\n                "CAA_VISUAL_QUALIFICATION_TEXTURE_MATRIX_INCOMPLETE"\n            )\n        for view_index in range(8):\n            row = textures[view_index]\n            path = resolved_path(row.transport_png_path)\n            if not path.is_file() or sha256_file(path) != row.transport_png_sha256:\n                raise QualificationError("CAA_VISUAL_QUALIFICATION_TEXTURE_BYTES_DRIFT")\n            actual = np.asarray(Image.open(path).convert("RGBA"), dtype=np.uint8)\n            expected = _source_visual_rgba(\n                source_rgba[view_index], source_masks[view_index]\n            )\n            if actual.shape != expected.shape or not np.array_equal(actual, expected):\n                raise QualificationError("CAA_VISUAL_SOURCE_TEXTURE_NOT_EXACT")\n            actual_provenance, actual_source_view = load_visual_material(\n                asset, view_index=view_index, rgba=actual\n            )\n            _, expected_provenance, expected_source_view = source_visual_material(\n                source_rgba[view_index], source_masks[view_index], view_index\n            )\n            if (\n                not np.array_equal(actual_provenance, expected_provenance)\n                or not np.array_equal(actual_source_view, expected_source_view)\n            ):\n                raise QualificationError("CAA_VISUAL_SOURCE_PROVENANCE_NOT_EXACT")\n        if compile_array_schema == "RealSaS.CAACompileArrays.v3":\n            metadata = dict(asset.metadata or {})\n            if (\n                metadata.get("canonical_completion_field_bound") is not True\n                or str(metadata.get("canonical_completion_field_sha256") or "")\n                != artifact.compile_npz_sha256\n                or str(metadata.get("canonical_completion_field_compile_hash") or "")\n                != artifact.compile_hash\n                or metadata.get("hidden_layer_support_qualified") is not False\n            ):\n                raise QualificationError("CAA_VISUAL_COMPLETION_FIELD_BINDING_DRIFT")\n\n'''
              section = once(section, insertion_point, validation, 'QUALIFY_SOURCE_EXACT_AND_SIDECAR')
              needle = '''        _source_owned_visual_mode_from_prereg(prereg)\n        and dict(asset.metadata or {}).get("source_owned_visual_mesh_mode")\n        is True\n    ):'''
              replacement = '''        source_owned_visual_mode\n        and compile_array_schema == "RealSaS.VisualAppearanceCompileArrays.v1"\n    ):'''
              section = once(section, needle, replacement, 'QUALIFY_LEGACY_ONLY')
              section = once(
                  section,
                  '            "totality_domain": "ADMITTED_RENDERABLE_SUPPORT_ONLY",\n',
                  '            "totality_domain": (\n'
                  '                "CANONICAL_SURFACE_APPEARANCE_FIELD__VISUAL_PRESENTATION_SUPPORT_SEPARATE"\n'
                  '                if source_owned_visual_mode\n'
                  '                else "ADMITTED_RENDERABLE_SUPPORT_ONLY"\n'
                  '            ),\n'
                  '            "source_owned_visual_mesh_mode": bool(source_owned_visual_mode),\n'
                  '            "canonical_completion_field_qualified": bool(\n'
                  '                source_owned_visual_mode and passed\n'
                  '            ),\n'
                  '            "hidden_layer_support_qualified": (\n'
                  '                False if source_owned_visual_mode else None\n'
                  '            ),\n',
                  'QUALIFY_TOTALITY_DOMAIN',
              )
              section = once(
                  section,
                  '            "totality_does_not_claim_geometry_or_visibility_correctness": True,\n',
                  '            "totality_does_not_claim_geometry_or_visibility_correctness": True,\n'
                  '            "source_owned_visual_mesh_mode": bool(source_owned_visual_mode),\n'
                  '            "canonical_completion_field_compile_hash": (\n'
                  '                artifact.compile_hash if source_owned_visual_mode else ""\n'
                  '            ),\n'
                  '            "hidden_layer_support_qualified": (\n'
                  '                False if source_owned_visual_mode else None\n'
                  '            ),\n',
                  'QUALIFY_METADATA_SOURCE_VISUAL',
              )
              return section

          text = mutate_function(text, 'qualify_complete_appearance_stage', patch_qualify)

          path.write_text(text, encoding='utf-8')

          # Structural regression: source-owned visual mode must no longer mint a
          # source-raster-only compile artifact as its current producer.
          final = path.read_text(encoding='utf-8')
          compile_section = final[final.index('def compile_caa_stage('):final.index('\ndef seal_caa_compile_stage(')]
          assert 'sample_count_mode": "SOURCE_RASTER_DIRECT_V1"' not in compile_section
          assert 'canonical_surface_completion_produced' in compile_section
          assert 'RealSaS.CAACompileArrays.v3' in compile_section
          assert 'CAA_CANONICAL_COMPLETION_FIELD_SIDECAR' in final
          print('SOURCE_VISUAL_CAA_COMPLETION_PATCH_APPLIED')
          PY
      - name: Compile patched appearance authority
        run: |
          python -m compileall -q compiler/realsas_compiler_services/orchestrator/adapters/appearance_v2.py
      - name: Stage20-25 and CAA completion regressions
        run: |
          python -m pytest -q \
            tests/compiler/test_product_mesh_stage_adapters_v1.py::test_vf23_stage20_to25_uses_unmodified_production_caa_policy \
            tests/compiler/test_caa_canonical_completion_v1.py \
            tests/compiler/test_caa_variational_completion_v1.py \
            tests/compiler/test_caa_v2_subject_free_policy.py \
            tests/compiler/test_visibility_and_caa_v2.py
      - name: Material and native runtime regressions
        env:
          REALSAS_RUNTIME_V2_PLAYER: /tmp/realsas_runtime_v2_caa_reference_completion_patch
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -pedantic runtime/realsas_cpp/src/runtime_v2_caa_reference.cpp -lpng -lz -o "$REALSAS_RUNTIME_V2_PLAYER"
          python -m pytest -q \
            tests/compiler/test_visual_material_native_v1.py \
            tests/compiler/test_runtime_v2_source_owned_visual_native_smoke.py
      - name: Commit validated producer fix
        run: |
          git diff --check
          git status --short
          git config user.name 'RealSaS - OPT'
          git config user.email '140457344+merynz@users.noreply.github.com'
          git add compiler/realsas_compiler_services/orchestrator/adapters/appearance_v2.py
          git commit -m 'Restore complete CAA production for source-owned visual path'
          git push origin HEAD:visual/sealed-material-20261009
