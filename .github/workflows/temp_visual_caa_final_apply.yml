name: temp-visual-caa-final-apply

on:
  push:
    branches:
      - visual/sealed-material-20261009
    paths:
      - '.github/workflows/temp_visual_caa_final_apply.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 40
    env:
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/sealed-material-20261009
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install regression dependencies
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt pyyaml
      - name: Apply producer patch and strengthen accounting regression
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, yaml

          workflow = yaml.safe_load(Path('.github/workflows/temp_visual_caa_completion_patch.yml').read_text())
          script = next(
              step['run'] for step in workflow['jobs']['patch-and-validate']['steps']
              if step.get('name') == 'Restore complete CAA production on source-owned visual path'
          )
          subprocess.run(['bash', '-lc', script], check=True)

          test_path = Path('tests/compiler/test_product_mesh_stage_adapters_v1.py')
          text = test_path.read_text(encoding='utf-8')
          old = '''    assert compile_artifact.total_sample_count > 0\n    assert (\n        compile_artifact.direct_source_sample_count\n        + compile_artifact.other_view_source_sample_count\n        + compile_artifact.compiled_local_harmonic_sample_count\n        == compile_artifact.total_sample_count\n    )\n'''
          new = '''    assert compile_artifact.total_sample_count > 0\n    compile_metadata = dict(compile_artifact.metadata or {})\n    canonical_global_count = int(\n        compile_metadata.get("canonical_global_completion_sample_count", 0)\n    )\n    unsupported_count = int(\n        compile_metadata.get("unsupported_abstain_sample_count", 0)\n    )\n    assert (\n        compile_artifact.direct_source_sample_count\n        + compile_artifact.other_view_source_sample_count\n        + compile_artifact.compiled_local_harmonic_sample_count\n        + canonical_global_count\n        + unsupported_count\n        == compile_artifact.total_sample_count\n    )\n    assert compile_metadata["compile_array_schema"] == "RealSaS.CAACompileArrays.v3"\n    assert compile_metadata["source_owned_visual_mesh_mode"] is True\n    assert compile_metadata["canonical_surface_completion_produced"] is True\n    assert compile_artifact.direct_source_sample_count < compile_artifact.total_sample_count\n    assert canonical_global_count > 0\n    assert unsupported_count == 0\n'''
          if text.count(old) != 1:
              raise RuntimeError(f'ACCOUNTING_ASSERTION_MATCH_COUNT:{text.count(old)}')
          text = text.replace(old, new, 1)

          old_asset = '''    assert len(asset.textures) == 8\n    assert asset.metadata["runtime_generation_forbidden"] is True\n'''
          new_asset = '''    assert len(asset.textures) == 8\n    assert asset.metadata["runtime_generation_forbidden"] is True\n    assert asset.metadata["canonical_completion_field_bound"] is True\n    assert asset.metadata["canonical_completion_field_compile_hash"] == compile_artifact.compile_hash\n    assert asset.metadata["canonical_completion_field_sha256"] == compile_artifact.compile_npz_sha256\n    assert asset.metadata["hidden_layer_support_qualified"] is False\n'''
          if text.count(old_asset) != 1:
              raise RuntimeError(f'ASSET_ASSERTION_MATCH_COUNT:{text.count(old_asset)}')
          text = text.replace(old_asset, new_asset, 1)

          old_qual = '''    assert qualification.qualification_report["status"] == "PASS_COMPLETE_APPEARANCE"\n    assert qualification.source_lock_exact_fraction == 1.0\n    assert qualification.total_defined_fraction == 1.0\n'''
          new_qual = '''    assert qualification.qualification_report["status"] == "PASS_COMPLETE_APPEARANCE"\n    assert qualification.source_lock_exact_fraction == 1.0\n    assert qualification.total_defined_fraction == 1.0\n    assert (\n        qualification.qualification_report["totality_domain"]\n        == "CANONICAL_SURFACE_APPEARANCE_FIELD__VISUAL_PRESENTATION_SUPPORT_SEPARATE"\n    )\n    assert qualification.qualification_report["source_owned_visual_mesh_mode"] is True\n    assert qualification.qualification_report["canonical_completion_field_qualified"] is True\n    assert qualification.qualification_report["hidden_layer_support_qualified"] is False\n'''
          if text.count(old_qual) != 1:
              raise RuntimeError(f'QUAL_ASSERTION_MATCH_COUNT:{text.count(old_qual)}')
          text = text.replace(old_qual, new_qual, 1)
          test_path.write_text(text, encoding='utf-8')
          PY
          python -m compileall -q compiler/realsas_compiler_services/orchestrator/adapters/appearance_v2.py tests/compiler/test_product_mesh_stage_adapters_v1.py
      - name: Stage20-25 and CAA completion bank
        run: |
          python -m pytest -q \
            tests/compiler/test_product_mesh_stage_adapters_v1.py::test_vf23_source_visual_chain_proves_transport_but_not_full_product \
            tests/compiler/test_caa_canonical_completion_v1.py \
            tests/compiler/test_caa_variational_completion_v1.py \
            tests/compiler/test_caa_v2_subject_free_policy.py \
            tests/compiler/test_visibility_and_caa_v2.py
      - name: Material and native source-visual bank
        env:
          REALSAS_RUNTIME_V2_PLAYER: /tmp/realsas_runtime_v2_caa_reference_completion_final
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -pedantic runtime/realsas_cpp/src/runtime_v2_caa_reference.cpp -lpng -lz -o "$REALSAS_RUNTIME_V2_PLAYER"
          python -m pytest -q \
            tests/compiler/test_visual_material_native_v1.py \
            tests/compiler/test_runtime_v2_source_owned_visual_native_smoke.py
      - name: Full affected appearance regressions
        run: |
          python -m pytest -q \
            tests/compiler/test_caa_abstention_contract_v1.py \
            tests/compiler/test_caa_adaptive_paging_v2.py \
            tests/compiler/test_caa_demo_static_mesh_admission_v2.py \
            tests/compiler/test_dynamic_appearance_conditioning_v2.py \
            tests/compiler/test_playback_appearance_authority_v2.py \
            tests/compiler/test_visual_mesh_arap_v1.py
      - name: Commit producer closure
        run: |
          git diff --check
          git config user.name 'RealSaS - OPT'
          git config user.email '140457344+merynz@users.noreply.github.com'
          git add \
            compiler/realsas_compiler_services/orchestrator/adapters/appearance_v2.py \
            tests/compiler/test_product_mesh_stage_adapters_v1.py
          git commit -m 'Restore complete CAA production for source-owned visuals'
          git push origin HEAD:visual/sealed-material-20261009
