name: temp-visual-caa-final-diagnostic

on:
  push:
    branches:
      - visual/sealed-material-20261009
    paths:
      - '.github/workflows/temp_visual_caa_final_diag.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/sealed-material-20261009
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt pyyaml
      - name: Reapply exact candidate and instrument only Stage24 fail return
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, yaml
          data = yaml.safe_load(Path('.github/workflows/temp_visual_caa_final_apply.yml').read_text())
          script = next(step['run'] for step in data['jobs']['finalize']['steps'] if step.get('name') == 'Apply producer patch and strengthen accounting regression')
          subprocess.run(['bash','-lc',script],check=True)

          path = Path('compiler/realsas_compiler_services/orchestrator/adapters/appearance_v2.py')
          text = path.read_text(encoding='utf-8')
          marker = 'def qualify_complete_appearance_stage(ctx: dict) -> dict:\n'
          start = text.index(marker)
          end = text.index('\ndef prove_caa_reference_rest_stage(', start)
          section = text[start:end]
          old = '''    if not passed:\n        return {\n            "status": "FAIL",\n            "blockers": ["COMPLETE_APPEARANCE_QUALITY_GATE_FAILED"],\n            "diagnostics": value.to_dict(),\n        }\n'''
          new = '''    if not passed:\n        print("REALSAS_STAGE24_FULL_QUALIFICATION_JSON")\n        print(json.dumps(value.to_dict(), indent=2, sort_keys=True))\n        return {\n            "status": "FAIL",\n            "blockers": ["COMPLETE_APPEARANCE_QUALITY_GATE_FAILED"],\n            "diagnostics": value.to_dict(),\n        }\n'''
          if section.count(old) != 1:
              raise RuntimeError(f'STAGE24_FAIL_RETURN_MATCH_COUNT:{section.count(old)}')
          section = section.replace(old, new, 1)
          path.write_text(text[:start] + section + text[end:], encoding='utf-8')
          PY
      - name: Capture exact Stage24 quality diagnostics
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q -s \
            tests/compiler/test_product_mesh_stage_adapters_v1.py::test_vf23_source_visual_chain_proves_transport_but_not_full_product \
            2>&1 | tee /tmp/source_visual_caa_stage24_quality.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-visual-caa-stage24-quality-v2
          path: /tmp/source_visual_caa_stage24_quality.log
          if-no-files-found: error
          retention-days: 1
