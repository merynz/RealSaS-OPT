name: temp-visual-caa-patch-capture

on:
  push:
    branches:
      - visual/sealed-material-20261009
    paths:
      - '.github/workflows/temp_visual_caa_patch_capture.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/sealed-material-20261009
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install YAML parser
        run: python -m pip install --no-input --progress-bar off pyyaml
      - name: Capture patch execution
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, yaml
          out = Path('/tmp/patch_capture.log')
          try:
              data = yaml.safe_load(Path('.github/workflows/temp_visual_caa_completion_patch.yml').read_text())
              steps = data['jobs']['patch-and-validate']['steps']
              target = next(step for step in steps if step.get('name') == 'Restore complete CAA production on source-owned visual path')
              proc = subprocess.run(['bash', '-lc', target['run']], text=True, capture_output=True)
              out.write_text('returncode=' + str(proc.returncode) + '\nSTDOUT\n' + proc.stdout + '\nSTDERR\n' + proc.stderr, encoding='utf-8')
          except Exception as exc:
              out.write_text(type(exc).__name__ + ': ' + str(exc), encoding='utf-8')
          print(out.read_text())
          PY
      - name: Upload patch capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-caa-patch-capture
          path: /tmp/patch_capture.log
          if-no-files-found: error
          retention-days: 1
