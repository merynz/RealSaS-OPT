name: tessa-knight-authority-inventory-v1

on:
  pull_request:
    paths:
      - .github/workflows/tessa_knight_authority_inventory_v1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tessa-knight-authority-inventory-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 10
    env:
      AUTHORITY_ROOT: /home/monster/realsas_authority
      PYTHONUNBUFFERED: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Read-only Knight authority inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["AUTHORITY_ROOT"]).resolve()
          runs_root = root / "runs"
          if not runs_root.is_dir():
              raise SystemExit(f"AUTHORITY_RUNS_ROOT_MISSING::{runs_root}")

          target_schema_tokens = (
              "TESSA",
              "CanonicalMeshCandidate",
              "StaticCanonicalMeshQualification",
              "QualifiedSkeleton",
              "QualifiedSkin",
              "DeformationCapabilityEnvelope",
              "Axis",
              "QualifiedMesh",
          )
          path_tokens = (
              "tessa",
              "canonical_mesh_candidate",
              "static_canonical",
              "static_mesh",
              "qualified_skeleton",
              "qualified_skin",
              "deformation_envelope",
              "axis",
              "qualified_mesh",
              "stage18",
              "stage19",
              "stage28",
              "stage32",
              "stage34",
              "stage35",
          )
          lineage_keys = (
              "candidate_lineage_hash",
              "candidate_mesh_binding_hash",
              "bridge_evidence_hash",
              "static_mesh_qualification_hash",
              "proposal_geometry_hash",
              "material_support_field_hash",
              "partition_binding_hash",
              "binding_hash",
              "geometry_lineage_hash",
              "surface_binding_hash",
              "skeleton_lineage_hash",
              "skeleton_binding_hash",
              "skin_lineage_hash",
              "mesh_lineage_hash",
              "envelope_lineage_hash",
              "axis_contract_hash",
              "topology_sequence_hash",
          )

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(8 << 20), b""):
                      h.update(chunk)
              return h.hexdigest()

          def json_head(path: Path):
              try:
                  if path.stat().st_size > 64 * 1024 * 1024:
                      return None, "JSON_TOO_LARGE_FOR_INVENTORY_PARSE"
                  return json.loads(path.read_text(encoding="utf-8")), None
              except Exception as exc:
                  return None, f"{type(exc).__name__}:{exc}"

          def schema_of(payload):
              if not isinstance(payload, dict):
                  return ""
              return str(payload.get("schema_version") or payload.get("schema") or "")

          def lineage_of(payload):
              if not isinstance(payload, dict):
                  return {}
              out = {}
              for key in lineage_keys:
                  value = payload.get(key)
                  if isinstance(value, (str, int, float, bool)) and value not in ("", None):
                      out[key] = value
              meta = payload.get("metadata")
              if isinstance(meta, dict):
                  for key in lineage_keys:
                      value = meta.get(key)
                      if isinstance(value, (str, int, float, bool)) and value not in ("", None):
                          out[f"metadata.{key}"] = value
              return out

          run_dirs = sorted(p for p in runs_root.iterdir() if p.is_dir())
          knight_runs = [p for p in run_dirs if "KNIGHT" in p.name.upper()]
          report = {
              "schema": "RealSaS.TESSAKnightAuthorityInventory.v1",
              "status": "PASS_READ_ONLY_INVENTORY",
              "authority_root": str(root),
              "run_count": len(run_dirs),
              "knight_run_count": len(knight_runs),
              "knight_runs": [],
              "read_only": True,
          }

          for run in knight_runs:
              rows = []
              for path in sorted(run.rglob("*.json")):
                  rel = path.relative_to(root).as_posix()
                  low = rel.lower()
                  path_match = any(token in low for token in path_tokens)
                  payload, parse_error = json_head(path)
                  schema = schema_of(payload)
                  schema_match = any(token.lower() in schema.lower() for token in target_schema_tokens)
                  if not (path_match or schema_match):
                      continue
                  row = {
                      "path": rel,
                      "bytes": path.stat().st_size,
                      "sha256": sha256(path),
                      "schema": schema,
                      "status": (
                          payload.get("status")
                          if isinstance(payload, dict) and isinstance(payload.get("status"), (str, bool, int, float))
                          else None
                      ),
                      "lineage": lineage_of(payload),
                  }
                  if parse_error:
                      row["parse_note"] = parse_error
                  rows.append(row)
              report["knight_runs"].append({
                  "run_id": run.name,
                  "artifact_count": len(rows),
                  "artifacts": rows,
              })

          # Also inventory research/result JSONs outside runs if they are Knight+TESSA/MIRA/AXIS relevant.
          extras = []
          for path in sorted(root.rglob("*.json")):
              try:
                  rel = path.relative_to(root).as_posix()
              except ValueError:
                  continue
              if rel.startswith("runs/"):
                  continue
              low = rel.lower()
              if "knight" not in low or not any(token in low for token in ("tessa", "mira", "axis", "stage35", "g3")):
                  continue
              payload, parse_error = json_head(path)
              row = {
                  "path": rel,
                  "bytes": path.stat().st_size,
                  "sha256": sha256(path),
                  "schema": schema_of(payload),
                  "status": (
                      payload.get("status")
                      if isinstance(payload, dict) and isinstance(payload.get("status"), (str, bool, int, float))
                      else None
                  ),
                  "lineage": lineage_of(payload),
              }
              if parse_error:
                  row["parse_note"] = parse_error
              extras.append(row)
          report["external_knight_research_artifacts"] = extras

          compact = json.dumps(report, sort_keys=True, separators=(",", ":"))
          print("TESSA_KNIGHT_AUTHORITY_INVENTORY=" + compact, flush=True)

          # Explicitly prove this job created no file below authority root: only reads were performed.
          print(
              "TESSA_KNIGHT_AUTHORITY_INVENTORY_SUMMARY="
              + json.dumps(
                  {
                      "status": report["status"],
                      "run_count": report["run_count"],
                      "knight_run_count": report["knight_run_count"],
                      "matched_run_artifact_count": sum(x["artifact_count"] for x in report["knight_runs"]),
                      "external_research_artifact_count": len(extras),
                      "read_only": True,
                  },
                  sort_keys=True,
              ),
              flush=True,
          )
          PY
