name: tessa-knight-motion-source-materialize-v1

on:
  push:
    branches:
      - research/tessa-mechanical-mesh-v1-20261004
    paths:
      - .github/workflows/tessa_knight_motion_source_materialize_v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: .
      SOURCE_FBX: assets/external/quaternius/knight/KnightCharacter.fbx
      EXPECTED_FBX_SHA256: 41f2616fb4a42f9d35e242bbed1450ededc7537def4bf38cbb11b4e54ff2bf21

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify source FBX
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SOURCE_FBX"
          printf '%s  %s\n' "$EXPECTED_FBX_SHA256" "$SOURCE_FBX" | sha256sum --check -
          echo "TESSA_MOTION_SOURCE_FBX_PASS"

      - name: Resolve or bootstrap canonical pinned Blender
        shell: bash
        run: |
          set -euo pipefail
          if python - <<'PY'
          from tools.motion.materialize_quaternius_preset_v1 import resolve_blender
          print(resolve_blender(None))
          PY
          then
            resolved="$(python - <<'PY'
          from tools.motion.materialize_quaternius_preset_v1 import resolve_blender
          print(resolve_blender(None))
          PY
          )"
            echo "BLENDER_EXE=$resolved" >> "$GITHUB_ENV"
            "$resolved" --version | head -n 2
            exit 0
          fi

          version='4.5.14'
          base="https://download.blender.org/release/Blender4.5"
          archive="blender-${version}-linux-x64.tar.xz"
          install_root="$RUNNER_TEMP/realsas_blender"
          mkdir -p "$install_root"
          curl --fail --location --retry 3 --retry-delay 2 "$base/$archive" --output "$RUNNER_TEMP/$archive"
          curl --fail --location --retry 3 --retry-delay 2 "$base/blender-${version}.sha256" --output "$RUNNER_TEMP/blender.sha256"
          (
            cd "$RUNNER_TEMP"
            grep "  $archive\$" blender.sha256 | sha256sum --check -
          )
          tar -xJf "$RUNNER_TEMP/$archive" -C "$install_root"
          blender_path="$install_root/blender-${version}-linux-x64/blender"
          test -x "$blender_path"
          echo "BLENDER_EXE=$blender_path" >> "$GITHUB_ENV"
          "$blender_path" --version | head -n 2
          echo "TESSA_PINNED_BLENDER_BOOTSTRAP_PASS"

      - name: Materialize sealed Knight clips
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/tessa_knight_motion_v1"
          rm -rf "$out"
          python tools/motion/materialize_quaternius_preset_v1.py \
            --source-fbx "$SOURCE_FBX" \
            --blender "$BLENDER_EXE" \
            --out-dir "$out" \
            --run-id TESSA_KNIGHT_CONTINUOUS_FIELD_WITNESS_V1
          for f in demo_idle_v1.motion.json demo_run_v1.motion.json demo_slash_v1.motion.json EXTRACTION_RECEIPT.json MATERIALIZATION_RECEIPT.json; do
            test -s "$out/$f"
          done
          echo "MOTION_OUT=$out" >> "$GITHUB_ENV"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'tessa_knight_motion_v1'
          receipt=json.loads((root/'MATERIALIZATION_RECEIPT.json').read_text())
          assert receipt['status']=='PASS'
          assert receipt['source_input_mode']=='EXACT_FBX_SHA'
          assert receipt['source_fbx_sha256']==os.environ['EXPECTED_FBX_SHA256']
          for name in ('demo_idle_v1.motion.json','demo_run_v1.motion.json','demo_slash_v1.motion.json'):
              x=json.loads((root/name).read_text())
              print('TESSA_MOTION_CLIP_PASS', name, x['schema'], x['clip_kind'], len(x.get('source_skeleton',())), len(x.get('tracks',())))
          PY

      - name: Upload motion witness source
        uses: actions/upload-artifact@v4
        with:
          name: tessa-knight-motion-source-v1
          path: ${{ env.MOTION_OUT }}
          if-no-files-found: error
          retention-days: 14
