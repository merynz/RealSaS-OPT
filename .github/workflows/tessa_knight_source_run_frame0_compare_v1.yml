name: tessa-knight-source-run-frame0-compare-v1

on:
  push:
    branches:
      - research/tessa-mechanical-mesh-v1-20261004
    paths:
      - tools/research/blender_render_knight_source_run_frame0_v1.py
      - .github/workflows/tessa_knight_source_run_frame0_compare_v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: .
      SOURCE_FBX: assets/external/quaternius/knight/KnightCharacter.fbx
      EXPECTED_FBX_SHA256: 41f2616fb4a42f9d35e242bbed1450ededc7537def4bf38cbb11b4e54ff2bf21

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify exact source FBX
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SOURCE_FBX"
          printf '%s  %s\n' "$EXPECTED_FBX_SHA256" "$SOURCE_FBX" | sha256sum --check -
          echo "SOURCE_COMPARE_FBX_PASS"

      - name: Resolve or bootstrap canonical pinned Blender
        shell: bash
        run: |
          set -euo pipefail
          if resolved="$(python - <<'PY'
          from tools.motion.materialize_quaternius_preset_v1 import resolve_blender
          print(resolve_blender(None))
          PY
          )" && test -x "$resolved"; then
            echo "BLENDER_EXE=$resolved" >> "$GITHUB_ENV"
            "$resolved" --version | head -n 2
            exit 0
          fi

          version='4.5.14'
          base="https://download.blender.org/release/Blender4.5"
          archive="blender-${version}-linux-x64.tar.xz"
          install_root="$RUNNER_TEMP/realsas_blender"
          mkdir -p "$install_root"
          curl --fail --location --retry 3 --retry-delay 2 "$base/$archive" --output "$RUNNER_TEMP/$archive"
          curl --fail --location --retry 3 --retry-delay 2 "$base/blender-${version}.sha256" --output "$RUNNER_TEMP/blender.sha256"
          (
            cd "$RUNNER_TEMP"
            grep "  $archive\$" blender.sha256 | sha256sum --check -
          )
          tar -xJf "$RUNNER_TEMP/$archive" -C "$install_root"
          blender_path="$install_root/blender-${version}-linux-x64/blender"
          test -x "$blender_path"
          echo "BLENDER_EXE=$blender_path" >> "$GITHUB_ENV"
          "$blender_path" --version | head -n 2
          echo "SOURCE_COMPARE_PINNED_BLENDER_PASS"

      - name: Render exact source RUN frame 0
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/knight_source_run_frame0_compare"
          rm -rf "$out"
          mkdir -p "$out"
          "$BLENDER_EXE" --background --python tools/research/blender_render_knight_source_run_frame0_v1.py -- \
            --source-fbx "$SOURCE_FBX" \
            --out-png "$out/SOURCE_FBX_RUN_FRAME0.png" \
            --out-json "$out/SOURCE_FBX_RUN_FRAME0.json"
          test -s "$out/SOURCE_FBX_RUN_FRAME0.png"
          test -s "$out/SOURCE_FBX_RUN_FRAME0.json"
          echo "SOURCE_COMPARE_OUT=$out" >> "$GITHUB_ENV"
          echo "SOURCE_COMPARE_RENDER_PASS"

      - name: Upload exact source comparison
        uses: actions/upload-artifact@v4
        with:
          name: tessa-knight-source-run-frame0-compare-v1
          path: ${{ env.SOURCE_COMPARE_OUT }}
          if-no-files-found: error
          retention-days: 14
