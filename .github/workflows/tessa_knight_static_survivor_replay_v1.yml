name: tessa-knight-static-survivor-replay-v1

on:
  pull_request:
    paths:
      - "compiler/realsas_compiler_core/canonical_mesh_quality_repair_v1.py"
      - "compiler/realsas_compiler_core/tessa_static_repair_v1.py"
      - "tools/audit_tessa_knight_static_survivor_replay_v1.py"
      - "tests/fixtures/tessa/**"
      - ".github/workflows/tessa_knight_static_survivor_replay_v1.yml"
  push:
    branches:
      - promotion/tessa-mira-mechanical-survivor-v2-20261006
    paths:
      - "compiler/realsas_compiler_core/canonical_mesh_quality_repair_v1.py"
      - "compiler/realsas_compiler_core/tessa_static_repair_v1.py"
      - "tools/audit_tessa_knight_static_survivor_replay_v1.py"
      - "tests/fixtures/tessa/**"
      - ".github/workflows/tessa_knight_static_survivor_replay_v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "."
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned gate dependencies
        run: |
          set -euo pipefail
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Verify sealed fixture bytes
        run: |
          set -euo pipefail
          test "$(sha256sum tests/fixtures/tessa/TESSA_T1B_DECODED_MESH.npz | awk '{print $1}')" = "b7ccb058ef23f8c54d053e64580150dffffeb6a76a126ecaf48b265dd093f390"
          test "$(sha256sum tests/fixtures/tessa/normalization_domain.json | awk '{print $1}')" = "01b63a57390de9a5d2c731d9644e65ff779980caa066c19204db3b4a3e0c634b"
          echo TESSA_KNIGHT_STATIC_REPLAY_FIXTURES_PASS
      - name: Replay historical V2 to V3 survivor
        run: |
          set -euo pipefail
          rm -rf /tmp/tessa_knight_static_survivor_replay_v1
          python tools/audit_tessa_knight_static_survivor_replay_v1.py \
            --t1b tests/fixtures/tessa/TESSA_T1B_DECODED_MESH.npz \
            --normalization tests/fixtures/tessa/normalization_domain.json \
            --out /tmp/tessa_knight_static_survivor_replay_v1
          test -s /tmp/tessa_knight_static_survivor_replay_v1/TESSA_KNIGHT_STATIC_SURVIVOR_REPLAY_V1.json
      - name: Upload replay receipt
        uses: actions/upload-artifact@v4
        with:
          name: tessa-knight-static-survivor-replay-v1
          path: /tmp/tessa_knight_static_survivor_replay_v1/TESSA_KNIGHT_STATIC_SURVIVOR_REPLAY_V1.json
          if-no-files-found: error
