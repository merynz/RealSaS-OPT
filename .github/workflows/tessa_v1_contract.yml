name: tessa-v1-contract

on:
  push:
    branches: [research/tessa-mechanical-mesh-v1-20261004]
    paths:
      - models/tessa/**
      - tools/training/run_tessa_supervised_fit_v1.py
      - notebooks/RealSaS_TESSA_KNIGHT_T1_RUN_ALL.ipynb
      - tests/models/test_tessa_v1.py
      - tests/models/test_tessa_training_data_v1.py
      - canonical/TESSA_MECHANICAL_MESH_MODEL_EXECUTION_PLAN_V1.md
      - canonical/TESSA_MESHANYTHING_V2_CLEANROOM_REFERENCE_AUDIT_V1.md
      - canonical/TESSA_CARRIER_FIRST_MECHANICAL_COHERENCE_AMENDMENT_V1.md
      - requirements/mainline-ci.txt
      - requirements/torch-cpu.txt
      - .github/workflows/tessa_v1_contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: .
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned TESSA gate dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_DEFAULT_TIMEOUT: "60"
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
          python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt
          python - <<'PY'
          import numpy, pytest, torch
          print("TESSA_PINNED_ENV_PASS", numpy.__version__, pytest.__version__, torch.__version__)
          PY

      - name: Compile TESSA sources
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            models/tessa/__init__.py \
            models/tessa/v1/__init__.py \
            models/tessa/v1/contracts_v1.py \
            models/tessa/v1/conditioning_v1.py \
            models/tessa/v1/model_v1.py \
            models/tessa/v1/tokenization_v1.py \
            models/tessa/v1/proposal_v1.py \
            models/tessa/v1/mechanical_objective_v1.py \
            models/tessa/v1/training_data_v1.py \
            tools/training/run_tessa_supervised_fit_v1.py \
            tests/models/test_tessa_v1.py \
            tests/models/test_tessa_training_data_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('notebooks/RealSaS_TESSA_KNIGHT_T1_RUN_ALL.ipynb').read_text(encoding='utf-8'))
          assert payload['nbformat']==4
          assert payload['cells']
          print('TESSA_NOTEBOOK_JSON_PASS', len(payload['cells']))
          PY
          echo "TESSA_COMPILE_PASS"

      - name: Import TESSA package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import torch
          import models.tessa.v1 as tessa
          cfg = tessa.TESSAConfigV1()
          assert cfg.scaling_policy().admits(vertex_count=3665, face_count=6952)
          print("TESSA_IMPORT_SMOKE_PASS", torch.__version__, cfg.max_faces)
          PY

      - name: Run TESSA unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/models/test_tessa_v1.py \
            tests/models/test_tessa_training_data_v1.py
          echo "TESSA_V1_CONTRACT_PASS"
