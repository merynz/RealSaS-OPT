name: tmp-model-terrain-gofmt
on:
  push:
    branches:
      - platform/model-terrain-baseline-v1
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Format changed Go files and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.go')
          if ((${#files[@]})); then
            gofmt -w "${files[@]}"
          fi
          rm -f .github/workflows/tmp_model_terrain_gofmt.yml
          git config user.name 'RealSaS - OPT'
          git config user.email '140457344+merynz@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: gofmt model terrain platform slice'
          git push origin HEAD:platform/model-terrain-baseline-v1
