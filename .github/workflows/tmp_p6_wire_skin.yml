name: tmp-p6-wire-skin
on:
  push:
    branches:
      - product/skin-mira-v1-20261023
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/skin-mira-v1-20261023
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: platform/go.sum
      - name: Wire Skin contracts and self-clean
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path('.')
          sem_path=root/'platform/internal/capability/contracts/product_capabilities_v1.json'
          sem=json.loads(sem_path.read_text())
          sem['capabilities']['product.skin']={
            'entry_module':'compiler.realsas_compiler_services.platform_worker.skin_executor_v1',
            'policy':{
              'allowed_modes':['DEVELOPER'],
              'product_pass_authority':False,
              'dependencies':['product.mesh','product.rig','compiler.stage/15_RIGGING_SURFACE_QUALIFIED'],
            },
            'metadata':{
              'product_role_id':'skin','implementation_class':'HYBRID',
              'interface_contract':'RealSaS.ProductSkinInference.v1','executor_contract':'RealSaS.ProductSkinInference.v1',
              'input_mesh_artifact_type':'RealSaS.CanonicalMeshIR','input_mesh_schema_version':'v1',
              'input_rig_artifact_type':'RealSaS.CanonicalRigIR','input_rig_schema_version':'v1',
              'feature_evidence_type':'RealSaS.RiggingSurfaceIR','feature_evidence_version':'v1',
              'output_artifact_type':'RealSaS.CanonicalSkinIR','output_schema_version':'v1',
              'qualification_artifact_type':'RealSaS.CanonicalSkinQualificationIR','proposal_artifact_type':'RealSaS.CarrierSkinProposalIR',
              'max_simplex_repair_l1':1e-5,'max_total_correction_l1':1e-4,'negative_tolerance':1e-9,
              'required_models':[{'family':'MIRA','architecture_id':'RealSaS.MIRA.DirectCarrierSimplex.Axis541.v5_5'}],
              'model_checkpoint_artifact_type':'RealSaS.MIRARuntimeCheckpoint','model_checkpoint_schema_version':'v1',
              'canonical_parent_set':['CANONICAL_MESH','CANONICAL_RIG'],'feature_evidence_is_canonical_parent':False,
              'current_model_fit1_carrier_bound':True,'current_model_fit1_rig_bound':True,'generalization_claimed':False,
              'semantic_skin_transfer_allowed':False,'gsa_skin_field_authority_allowed':False,
              'post_bind_frame_observability_claimed':False,'post_bind_frame_observability_required':True,
              'fit_allowed_during_product_execution':False,'implementation_owner_may_change':True,
              'stable_product_role_survives_rewiring':True,
            },
          }
          sem_path.write_text(json.dumps(sem,indent=2,sort_keys=False)+'\n')

          p=root/'platform/internal/capability/release_compose.go'
          text=p.read_text()
          old='\t\tProductRigProvider{},\n\t}'
          new='\t\tProductRigProvider{},\n\t\tProductSkinProvider{},\n\t}'
          if text.count(old)!=1: raise SystemExit('RELEASE_COMPOSE_ANCHOR_DRIFT')
          p.write_text(text.replace(old,new))

          p=root/'compiler/realsas_compiler_services/platform_worker/worker.py'
          text=p.read_text()
          anchor='''    if str(request.get("kind") or "") != "STAGE":\n'''
          block='''    if (\n        str(request.get("kind") or "") == "MODULE"\n        and metadata.get("executor_contract") == "RealSaS.ProductSkinInference.v1"\n    ):\n        from compiler.realsas_compiler_services.platform_worker.skin_executor_v1 import (\n            execute_skin_capability_v1,\n        )\n\n        def run_skin(value):\n            return execute_skin_capability_v1(\n                value, read_object=_read_cas_object, put_bytes=_put_cas_bytes\n            )\n        return await _with_heartbeat(run_skin, request)\n\n'''
          if text.count(anchor)!=1: raise SystemExit('WORKER_SKIN_ANCHOR_DRIFT')
          if 'ProductSkinInference.v1' not in text:
              text=text.replace(anchor,block+anchor)
          p.write_text(text)

          p=root/'platform/internal/capability/release_compose_test.go'
          text=p.read_text()
          text=text.replace('\t\tProductRigCapabilityID,\n\t} {','\t\tProductRigCapabilityID,\n\t\tProductSkinCapabilityID,\n\t} {',1)
          text=text.replace('resolved, err := registry.Resolve(ProductRigCapabilityID)','resolved, err := registry.Resolve(ProductSkinCapabilityID)',1)
          text=text.replace('\t\tProductRigCapabilityID,\n\t} {\n\t\tif !seen[id] {\n\t\t\tt.Fatalf("rig resolution missing %s: %+v", id, resolved)','\t\tProductRigCapabilityID,\n\t\tProductSkinCapabilityID,\n\t} {\n\t\tif !seen[id] {\n\t\t\tt.Fatalf("skin resolution missing %s: %+v", id, resolved)',1)
          text=text.replace('if resolved[len(resolved)-1].ID != ProductRigCapabilityID {\n\t\tt.Fatalf("rig must resolve after all dependencies: %+v", resolved)\n\t}', 'if resolved[len(resolved)-1].ID != ProductSkinCapabilityID {\n\t\tt.Fatalf("skin must resolve after all dependencies: %+v", resolved)\n\t}',1)
          text=text.replace('if len(providers) != 4 {','if len(providers) != 5 {',1)
          marker='''\tif rig.Metadata["frame_observability_claimed"] != false {\n\t\tt.Fatalf("rig prematurely claims post-bind observability: %+v", rig.Metadata)\n\t}\n'''
          addition=marker+'''\tskin, ok := registry.Get(ProductSkinCapabilityID)\n\tif !ok {\n\t\tt.Fatal("product.skin missing")\n\t}\n\tif len(skin.Dependencies) != 3 || skin.Dependencies[0] != ProductMeshCapabilityID || skin.Dependencies[1] != ProductRigCapabilityID || skin.Dependencies[2] != StageCapabilityID("15_RIGGING_SURFACE_QUALIFIED") {\n\t\tt.Fatalf("skin descriptor=%+v", skin)\n\t}\n\tfor _, dependency := range skin.Dependencies {\n\t\tif strings.Contains(dependency, "ARACHNE_FIT") || strings.Contains(dependency, "MIRA_FIT") {\n\t\t\tt.Fatalf("fit/training dependency leaked into product.skin: %s", dependency)\n\t\t}\n\t}\n\tif skin.Metadata["feature_evidence_is_canonical_parent"] != false || skin.Metadata["post_bind_frame_observability_claimed"] != false {\n\t\tt.Fatalf("skin authority boundary drift: %+v", skin.Metadata)\n\t}\n\tif skin.Metadata["generalization_claimed"] != false {\n\t\tt.Fatalf("FIT1 MIRA incorrectly claims generalization: %+v", skin.Metadata)\n\t}\n'''
          if text.count(marker)!=1: raise SystemExit('RELEASE_TEST_SKIN_ANCHOR_DRIFT')
          text=text.replace(marker,addition,1)
          text=text.replace('\t\tProductRigCapabilityID,\n\t} {\n\t\tdescriptor, ok := registry.Get(capabilityID)','\t\tProductRigCapabilityID,\n\t\tProductSkinCapabilityID,\n\t} {\n\t\tdescriptor, ok := registry.Get(capabilityID)',1)
          p.write_text(text)

          p=root/'tests/compiler/test_product_capability_dependency_locality_v1.py'
          text=p.read_text()
          old='''from compiler.realsas_compiler_services.platform_worker import rig_executor_v1\nassert worker.EXECUTE_CAPABILITY_ACTIVITY == "engine.execute_capability.v1"\nassert rig_executor_v1.RIG_EXECUTOR_CONTRACT_V1 == "RealSaS.ProductRigInference.v1"\nassert not any(name == "models.axis" or name.startswith("models.axis.") for name in sys.modules)\nassert "torch" not in sys.modules\n'''
          new='''from compiler.realsas_compiler_services.platform_worker import rig_executor_v1, skin_executor_v1\nassert worker.EXECUTE_CAPABILITY_ACTIVITY == "engine.execute_capability.v1"\nassert rig_executor_v1.RIG_EXECUTOR_CONTRACT_V1 == "RealSaS.ProductRigInference.v1"\nassert skin_executor_v1.SKIN_EXECUTOR_CONTRACT_V1 == "RealSaS.ProductSkinInference.v1"\nassert not any(name == "models.axis" or name.startswith("models.axis.") for name in sys.modules)\nassert not any(name == "models.mira" or name.startswith("models.mira.") for name in sys.modules)\nassert "torch" not in sys.modules\n'''
          if text.count(old)!=1: raise SystemExit('LOCALITY_SKIN_ANCHOR_DRIFT')
          p.write_text(text.replace(old,new,1))
          PY
          (cd platform && gofmt -w internal/capability/product_skin.go internal/capability/release_compose.go internal/capability/release_compose_test.go)
          rm .github/workflows/tmp_p6_wire_skin.yml
          git config user.name 'RealSaS CI'
          git config user.email 'actions@users.noreply.github.com'
          git add platform compiler tests .github/workflows/tmp_p6_wire_skin.yml
          git diff --cached --check
          git commit -m 'P6: wire Skin into product release graph'
          git push origin HEAD:product/skin-mira-v1-20261023
