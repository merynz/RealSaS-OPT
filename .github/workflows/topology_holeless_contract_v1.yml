name: topology-holeless-contract-v1

on:
  workflow_dispatch:
  push:
    branches: [research/vf11-certified-adaptive-20260921]
    paths:
      - 'compiler/realsas_compiler_core/canonical_mesh_candidate_v1.py'
      - 'compiler/realsas_compiler_core/product_authority_v1.py'
      - 'compiler/realsas_compiler_core/product_mesh_skin_v1.py'
      - 'compiler/realsas_compiler_core/mesh/skin_topology_compatibility_v1.py'
      - 'compiler/realsas_compiler_services/orchestrator/adapters/mesh_v2.py'
      - 'tests/compiler/test_holeless_partitioned_dense_candidate_v1.py'
      - 'tests/compiler/test_skin_topology_repartition_directive_v2.py'
      - '.github/workflows/topology_holeless_contract_v1.yml'

permissions: {contents: read}

jobs:
  test:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        run: python -m pip install --no-input --progress-bar off numpy scipy pytest
      - name: Pycompile
        run: |
          python -m py_compile             compiler/realsas_compiler_core/canonical_mesh_candidate_v1.py             compiler/realsas_compiler_core/product_authority_v1.py             compiler/realsas_compiler_core/product_mesh_skin_v1.py             tests/compiler/test_holeless_partitioned_dense_candidate_v1.py
      - name: Focused topology contract tests
        run: |
          PYTHONPATH=. pytest -q             tests/compiler/test_holeless_partitioned_dense_candidate_v1.py             tests/compiler/test_canonical_mesh_candidate_v1.py             tests/compiler/test_product_mesh_skin_v1.py             tests/compiler/test_mechanical_partition_v1.py
