name: truth-foundry-graphics-singleview-inventory-v1

on:
  pull_request:
    paths:
      - '.github/workflows/truth-foundry-graphics-singleview-inventory-v1.yml'
      - 'tools/corpus/truth_foundry/graphics_singleview_inventory_v1.py'
      - 'tests/corpus/test_graphics_singleview_inventory_v1.py'
      - 'canonical/REALSAS_GRAPHICS_SINGLEVIEW_TEACHER_TARGET_V1.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: truth-foundry-graphics-16397-${{ github.ref }}
  cancel-in-progress: false

jobs:
  graphics-oneview-source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Enforce six-head Graphics source/teacher/student training firewall
        run: |
          set -euo pipefail
          python -m compileall -q tools/corpus/truth_foundry/graphics_singleview_inventory_v1.py
          python -m unittest discover -s tests/corpus -p 'test_graphics_singleview_inventory_v1.py' -v

  private-rebuild-graphics-oneview-matrix:
    needs: [graphics-oneview-source-contracts]
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 395 && github.event.pull_request.head.repo.full_name == 'merynz/RealSaS-OPT' && github.event.pull_request.head.ref == 'truth-foundry-source-census-matrix-v1-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RCLONE_CONFIG: /tmp/realsas-graphics-oneview-rclone.conf
      ROOT: gdrive:RealSaS_MASTER_CORPUS_1024_V3/audits
      DEST: gdrive:RealSaS_MASTER_CORPUS_1024_V3/audits/truth_foundry_graphics_singleview_rebuild_v1/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure private Drive reader, no model downloads
        env:
          DRIVE_CONFIG_B64: ${{ secrets.REALSAS_HOSTED_DRIVE_RCLONE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$DRIVE_CONFIG_B64"
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends rclone
          printf '%s' "$DRIVE_CONFIG_B64" | base64 -d > "$RCLONE_CONFIG"
      - name: Read frozen six source evidence inputs and SHA check
        run: |
          set -euo pipefail
          umask 077
          out="$RUNNER_TEMP/graphics-oneview-16397"
          mkdir -p "$out/in" "$out/out"
          rclone copyto "$ROOT/truth_foundry_global_source_census_v1/42509443199-1/matrix/SOURCE_RECORD_CENSUS_4363.csv" "$out/in/source.csv" --retries 3
          rclone copyto "$ROOT/truth_foundry_partverse_selected2500_v1/42522239139-1/ASSET_PART_GEOMETRY_EVIDENCE_V1.csv" "$out/in/first.csv" --retries 3
          rclone copyto "$ROOT/truth_foundry_partverse_wave2_4799_v1/42529564616-1/ASSET_PART_GEOMETRY_EVIDENCE_V1.csv" "$out/in/second.csv" --retries 3
          rclone copyto "$ROOT/truth_foundry_external_pool_metadata_v1/42518887140-1/PARALLEL_ARTICULATION_UNIML_TRIAGE_20261108_V1/ARTICULATION_2500_SOURCE_CANDIDATE_QUEUE.csv" "$out/in/art.csv" --retries 3
          rclone copyto "$ROOT/truth_foundry_external_pool_metadata_v1/42518887140-1/PARALLEL_ARTICULATION_UNIML_TRIAGE_20261108_V1/UNIML3D_2500_DIVERSITY_SOURCE_CANDIDATE_QUEUE.csv" "$out/in/uni.csv" --retries 3
          rclone copyto "$ROOT/truth_foundry_uniml_rare_glb_v1/42525444732-1/UNIML3D_SOURCE_GLB_EVIDENCE_V1.csv" "$out/in/glb.csv" --retries 3
          python - "$out/in" <<'PY'
          import sys,hashlib
          from pathlib import Path
          d=Path(sys.argv[1]); e={
            'source.csv':'b03fc7b378ab5e8f70bd83f55822372eb5516746cc3d0b96286a1e903d0d2d1f',
            'first.csv':'305e17b217e40ca46135dea6fac9aadd15c1b26dd13f140aaffe482201c9eabd',
            'second.csv':'163cd1d376557b5ae77998149a40ae742467471db43eb98063fa1c6e18f1061e',
            'art.csv':'e1dd85380aa09bb55181cf6e96e6db01f5d7d45a55a3d09031c60de7eccc75d4',
            'uni.csv':'653ab31e1e25d20c1737f71c3af080a1f4562ebf204311353afc8fb6e609de43',
            'glb.csv':'7ad4b8ad6943f7cee817a50868a64637f6ee059ac576218fbf172d99bf9e29dd',
          }
          for name,expected in e.items():
              actual=hashlib.sha256((d/name).read_bytes()).hexdigest()
              if actual!=expected:raise SystemExit('FROZEN_INPUT_SHA_MISMATCH '+name)
          print('All 6 sources SHA-pinned')
          PY
      - name: Rebuild Graphics source and oneview prior evidence, never training PASS
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/graphics-oneview-16397"
          python tools/corpus/truth_foundry/graphics_singleview_inventory_v1.py \
            --source "$root/in/source.csv" \
            --partverse-wave1 "$root/in/first.csv" \
            --partverse-wave2 "$root/in/second.csv" \
            --articulation-queue "$root/in/art.csv" \
            --uniml-queue "$root/in/uni.csv" \
            --uniml-glb "$root/in/glb.csv" \
            --out "$root/out" --expected-sources 16397
          cp canonical/REALSAS_GRAPHICS_SINGLEVIEW_TEACHER_TARGET_V1.json "$root/out/GRAPHICS_SINGLEVIEW_TEACHER_TARGET_CONTRACT_V1.json"
          python - "$root/out" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);s=json.loads((p/'SUMMARY_V1.json').read_text())
          assert s['total_provider_scoped_source_records']==16397
          assert s['pixel_source_recovery_candidates_not_approved']==595
          assert s['graphics_priority_buckets']['P1_RELINK_TEXTURE_DEPENDENCIES']==883
          assert s['source_original_rights_qualified']==0
          assert s['approved_stylized_2d_art_target_count']==0
          assert s['teacher_front_back_exact_multiview_pairs_pass']==0
          assert s['training_authorized'] is False
          print('## Graphics single view forensic evidence — no fabricated prior')
          print('Provider-scoped records:',s['total_provider_scoped_source_records'])
          print('P0 pixel inspection candidates:',s['pixel_source_recovery_candidates_not_approved'])
          print('Missing dependency relink candidates:',s['graphics_priority_buckets']['P1_RELINK_TEXTURE_DEPENDENCIES'])
          print('Qualified source-back 2D pairs and head truths:',0)
          print('All six head target courts remain independent')
          PY
      - name: Publish only compact SHA-pinned CSV, schema and summary
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/graphics-oneview-16397/out"
          test -s "$root/GRAPHICS_SINGLEVIEW_SOURCE_COVERAGE_V1.csv"
          rclone copy "$root" "$DEST" --checksum --retries 3
          echo 'No original 3D source/texture bytes duplicated in private Drive.' >> "$GITHUB_STEP_SUMMARY"