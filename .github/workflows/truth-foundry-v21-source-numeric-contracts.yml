name: truth-foundry-v21-source-numeric-contracts
on:
  push:
    branches: [truth-foundry-v21-266-npz-numeric-court-20261110]
    paths:
      - '.github/workflows/truth-foundry-v21-source-numeric-contracts.yml'
      - 'tools/corpus/truth_foundry/evidence_v21/**'
      - 'tests/corpus/test_truth_v21.py'
  pull_request:
    paths:
      - '.github/workflows/truth-foundry-v21-source-numeric-contracts.yml'
      - 'tools/corpus/truth_foundry/evidence_v21/**'
      - 'tests/corpus/test_truth_v21.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: truth-foundry-v21-numeric-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  strict-master726-source-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: No-private-data syntax and negative source admission tests
        run: |
          set -euo pipefail
          python -m compileall -q tools/corpus/truth_foundry/evidence_v21 tests/corpus/test_truth_v21.py
          python -m unittest discover -s tests/corpus -p 'test_truth_v21.py' -v
      - name: Explicit no data promotion from synthetic CI
        run: |
          echo "ACTUAL_SOURCE_NPZ_DOWNLOADS=0 TRAINING_ADMISSIONS=0 CREATOR_ORIGINAL_BYTES=0"
