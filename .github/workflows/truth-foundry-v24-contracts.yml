name: Truth Foundry V24 synthetic evidence guards
on:
  pull_request:
    paths:
      - 'tools/corpus/truth_foundry/evidence_v24/**'
      - 'tests/corpus/test_truth_v24_worker.py'
      - '.github/workflows/truth-foundry-v24-contracts.yml'
  workflow_dispatch:
jobs:
  source-court-synthetic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic-only scope and admission firewall tests
        run: python tests/corpus/test_truth_v24_worker.py
