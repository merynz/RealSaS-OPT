name: truth139-corpus-locator

on:
  push:
    branches: [truth139-platform-generalization-v1]
    paths:
      - canonical/TRUTH139_CORPUS_LOCATOR_REQUEST_V1.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: truth139-corpus-locator
  cancel-in-progress: false

jobs:
  locate:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 15
    env:
      PLATFORM_ROOT: /home/monster/realsas_platform
      AUTHORITY_ROOT: /home/monster/realsas_authority
      EXPECTED_ROOT_SHA256: 2f15bf84694417cee3862c39a89e04bfa131f51331d6da5880739d40b7eab5ab
      EXPECTED_MANIFEST_SHA256: 3799b170d4138dbc0447d2d3456cc9ad5ba7e185fddace6d6ce2de0d0a2adc00
      EXPECTED_LEDGER_SHA256: 1524edeb99e2383e2d7516bf9680275289976d57efa3fac3a4b01f78426979b4
    steps:
      - uses: actions/checkout@v4

      - name: Validate locator request
        run: |
          set -euo pipefail
          "$PLATFORM_ROOT/current/bin/realsas-python" - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('canonical/TRUTH139_CORPUS_LOCATOR_REQUEST_V1.json').read_text())
          assert row['schema']=='RealSaS.Truth139CorpusLocatorRequest.v1'
          assert row['enabled'] is True
          assert row['training_allowed'] is False
          assert row['mutation_allowed'] is False
          assert int(row.get('locator_revision',0)) >= 5
          PY

      - name: Locate exact October-4 seal copies and audit raw-byte coverage
        id: locate
        run: |
          set -euo pipefail
          OUT="$AUTHORITY_ROOT/truth139/corpus_locator/${GITHUB_RUN_ID}/LOCATOR.json"
          mkdir -p "$(dirname "$OUT")"
          echo "output_path=$OUT" >> "$GITHUB_OUTPUT"
          export OUT
          "$PLATFORM_ROOT/current/bin/realsas-python" - <<'PY'
          import hashlib,json,os
          from pathlib import Path

          expected_root=os.environ['EXPECTED_ROOT_SHA256']
          expected_manifest=os.environ['EXPECTED_MANIFEST_SHA256']
          expected_ledger=os.environ['EXPECTED_LEDGER_SHA256']
          search_roots=[Path('/home/monster/realsas_authority'),Path('/home/monster')]
          seen=set();matches=[];sealed_manifest=None;sealed_ledger_rows=None

          def sha(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(4*1024*1024),b''):h.update(chunk)
              return h.hexdigest()

          def ledger_rows(path):
              rows=[]
              for line in path.read_text(encoding='utf-8').splitlines():
                  if not line.strip():continue
                  digest,relative=line.split('  ',1)
                  rows.append((digest.lower(),relative.replace('\\','/')))
              return rows

          for base in search_roots:
              if not base.exists():continue
              for material in base.glob('**/manifest/CORPUS_SEAL_MATERIAL.txt'):
                  try:
                      root=material.parent.parent.resolve()
                      if root in seen:continue
                      seen.add(root)
                      manifest=root/'manifest/MANIFEST.json';ledger=root/'manifest/FILE_HASHES.sha256'
                      if not manifest.is_file() or not ledger.is_file():continue
                      if sha(material)!=expected_root or sha(manifest)!=expected_manifest or sha(ledger)!=expected_ledger:continue
                      manifest_value=json.loads(manifest.read_text(encoding='utf-8-sig'))
                      rows=ledger_rows(ledger)
                      if sealed_manifest is None:
                          sealed_manifest=manifest_value;sealed_ledger_rows=rows
                      elif sealed_manifest!=manifest_value or sealed_ledger_rows!=rows:
                          raise ValueError('SEALED_MANIFEST_OR_LEDGER_CONTENT_DRIFT')
                      gltf_rows=[r for r in rows if r[1].startswith('raw/quaternius/') and r[1].lower().endswith(('.gltf','.glb'))]
                      existing=0;correct=0;wrong=[]
                      for digest,relative in gltf_rows:
                          path=root/relative
                          if not path.is_file():continue
                          existing+=1
                          actual=sha(path)
                          if actual==digest:correct+=1
                          elif len(wrong)<20:wrong.append({'path':relative,'expected':digest,'actual':actual})
                      all_existing=sum(1 for _digest,relative in rows if (root/relative).is_file())
                      matches.append({
                          'root':str(root),
                          'seal_material_sha256':sha(material),
                          'manifest_sha256':sha(manifest),
                          'ledger_sha256':sha(ledger),
                          'ledger_entry_count':len(rows),
                          'quaternius_gltf_glb_ledger_count':len(gltf_rows),
                          'quaternius_gltf_glb_existing_count':existing,
                          'quaternius_gltf_glb_hash_correct_count':correct,
                          'ledger_existing_file_count':all_existing,
                          'primary_source_hash_failures':wrong,
                          'full_primary_source_coverage':len(gltf_rows)==395 and correct==395,
                      })
                  except (OSError,PermissionError,ValueError):
                      continue

          acquisition=[]
          if sealed_manifest is not None:
              for row in sealed_manifest.get('results') or ():
                  if str(row.get('provider') or '').lower()!='quaternius':continue
                  acquisition.append({
                      'pack_id':str(row.get('id') or ''),
                      'status':str(row.get('status') or ''),
                      'drive_folder_id':str(row.get('drive_folder_id') or ''),
                      'official_url':str(row.get('official_url') or ''),
                      'source_snapshot':str(row.get('source_snapshot') or ''),
                      'source_snapshot_sha256':str(row.get('source_snapshot_sha256') or ''),
                  })
              acquisition.sort(key=lambda x:x['pack_id'])

          pack_summary={}
          for digest,relative in sealed_ledger_rows or ():
              parts=relative.split('/')
              if len(parts)<3 or parts[0]!='raw' or parts[1]!='quaternius':continue
              pack=parts[2]
              row=pack_summary.setdefault(pack,{'pack_id':pack,'ledger_file_count':0,'gltf_glb_count':0})
              row['ledger_file_count']+=1
              if relative.lower().endswith(('.gltf','.glb')):row['gltf_glb_count']+=1
          binding_by_id={row['pack_id']:row for row in acquisition}
          pack_rows=[]
          for pack,row in sorted(pack_summary.items()):
              binding=binding_by_id.get(pack) or {}
              pack_rows.append({**row,
                  'sealed_manifest_status':str(binding.get('status') or 'MISSING_FROM_MANIFEST'),
                  'drive_folder_id':str(binding.get('drive_folder_id') or ''),
                  'has_drive_folder_id':bool(binding.get('drive_folder_id')),
              })

          full=[row for row in matches if row['full_primary_source_coverage']]
          payload={
              'schema':'RealSaS.Truth139CorpusLocatorReceipt.v4',
              'run_id':os.environ['GITHUB_RUN_ID'],
              'matches':matches,
              'match_count':len(matches),
              'full_primary_source_roots':[row['root'] for row in full],
              'full_primary_source_root_count':len(full),
              'recommended_raw_root':full[0]['root'] if len(full)==1 else None,
              'sealed_manifest':{
                  'corpus_id':str((sealed_manifest or {}).get('corpus_id') or ''),
                  'result_count':len((sealed_manifest or {}).get('results') or ()),
                  'quaternius_pack_count':len(acquisition),
                  'quaternius_acquisition_bindings':acquisition,
              },
              'sealed_ledger_quaternius_pack_summary':pack_rows,
              'sealed_ledger_quaternius_pack_count':len(pack_rows),
              'training_allowed':False,
              'mutation_performed':False,
              'status':'PASS_EXACT_FULL_RAW_ROOT' if len(full)==1 else ('FAIL_NO_FULL_RAW_ROOT' if not full else 'FAIL_MULTIPLE_FULL_RAW_ROOTS'),
          }
          out=Path(os.environ['OUT']);out.write_text(json.dumps(payload,sort_keys=True,indent=2)+'\n')
          print(json.dumps({'status':payload['status'],'match_count':len(matches),'full_primary_source_root_count':len(full),'quaternius_pack_count':len(acquisition),'ledger_pack_count':len(pack_rows),'ledger_gltf_total':sum(r['gltf_glb_count'] for r in pack_rows)},sort_keys=True))
          PY

      - name: Preserve locator receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truth139-corpus-locator-${{ github.run_id }}
          path: ${{ steps.locate.outputs.output_path }}
          if-no-files-found: error
          retention-days: 30
