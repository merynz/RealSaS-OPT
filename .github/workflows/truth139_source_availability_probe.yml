name: truth139-source-availability-probe

on:
  push:
    branches: [truth139-platform-generalization-v1]
    paths:
      - canonical/TRUTH139_SOURCE_AVAILABILITY_PROBE_V1.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: truth139-source-availability-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    env:
      PLATFORM_ROOT: /home/monster/realsas_platform
      AUTHORITY_ROOT: /home/monster/realsas_authority
      RCLONE_REMOTE: ${{ vars.REALSAS_RCLONE_DRIVE_REMOTE || 'gdrive' }}
      EXPECTED_ROOT_SHA256: 2f15bf84694417cee3862c39a89e04bfa131f51331d6da5880739d40b7eab5ab
      EXPECTED_MANIFEST_SHA256: 3799b170d4138dbc0447d2d3456cc9ad5ba7e185fddace6d6ce2de0d0a2adc00
      EXPECTED_LEDGER_SHA256: 1524edeb99e2383e2d7516bf9680275289976d57efa3fac3a4b01f78426979b4
    steps:
      - uses: actions/checkout@v4

      - name: Validate request and storage access
        run: |
          set -euo pipefail
          "$PLATFORM_ROOT/current/bin/realsas-python" - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('canonical/TRUTH139_SOURCE_AVAILABILITY_PROBE_V1.json').read_text())
          assert r['schema']=='RealSaS.Truth139SourceAvailabilityProbeRequest.v1'
          assert r['enabled'] is True
          assert r['download_allowed'] is False and r['mutation_allowed'] is False
          assert r['render_allowed'] is False and r['training_allowed'] is False
          PY
          test -n "$RCLONE_REMOTE"
          rclone listremotes | grep -Fx "${RCLONE_REMOTE}:"

      - name: Probe sealed acquisition folders and provenance snapshots read-only
        id: probe
        run: |
          set -euo pipefail
          OUT="$AUTHORITY_ROOT/truth139/source_availability/${GITHUB_RUN_ID}/AVAILABILITY.json"
          mkdir -p "$(dirname "$OUT")"
          echo "output_path=$OUT" >> "$GITHUB_OUTPUT"
          export OUT
          "$PLATFORM_ROOT/current/bin/realsas-python" - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path

          def sha(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(4*1024*1024),b''):h.update(chunk)
              return h.hexdigest()

          roots=[]
          for base in (Path('/home/monster/realsas_authority'),Path('/home/monster')):
              if not base.exists():continue
              for p in base.glob('**/manifest/CORPUS_SEAL_MATERIAL.txt'):
                  root=p.parent.parent.resolve()
                  m=root/'manifest/MANIFEST.json';l=root/'manifest/FILE_HASHES.sha256'
                  try:
                      if sha(p)==os.environ['EXPECTED_ROOT_SHA256'] and sha(m)==os.environ['EXPECTED_MANIFEST_SHA256'] and sha(l)==os.environ['EXPECTED_LEDGER_SHA256']:
                          if root not in roots:roots.append(root)
                  except (OSError,PermissionError):pass
          if not roots:raise SystemExit('NO_EXACT_SEAL_COPY')
          authority_root=sorted(roots,key=lambda p:str(p))[0]
          manifest=json.loads((authority_root/'manifest/MANIFEST.json').read_text(encoding='utf-8-sig'))
          ledger=[]
          for line in (authority_root/'manifest/FILE_HASHES.sha256').read_text().splitlines():
              if not line.strip():continue
              digest,rel=line.split('  ',1);ledger.append((digest.lower(),rel.replace('\\','/')))
          by_pack={}
          for digest,rel in ledger:
              parts=rel.split('/')
              if len(parts)>=3 and parts[:2]==['raw','quaternius']:
                  by_pack.setdefault(parts[2],[]).append((digest,'/'.join(parts[3:])))
          bindings={str(r.get('id')):r for r in manifest.get('results') or () if str(r.get('provider')).lower()=='quaternius'}
          required=[]
          for pack,rows in sorted(by_pack.items()):
              gltf=sum(rel.lower().endswith(('.gltf','.glb')) for _d,rel in rows)
              if not gltf:continue
              binding=bindings.get(pack) or {}
              folder=str(binding.get('drive_folder_id') or '')
              required.append((pack,gltf,rows,folder,binding))
          if sum(x[1] for x in required)!=395:raise SystemExit('GLTF_PACK_CENSUS_DRIFT')

          pack_rows=[]
          remote=os.environ['RCLONE_REMOTE']
          for pack,gltf,rows,folder,binding in required:
              if not folder:
                  pack_rows.append({'pack_id':pack,'gltf_glb_count':gltf,'drive_folder_id':'','remote_listing_ok':False,'error':'DRIVE_FOLDER_ID_MISSING'})
                  continue
              target=f'{remote},root_folder_id={folder}:'
              proc=subprocess.run(['rclone','lsf',target,'--recursive','--files-only'],text=True,capture_output=True,timeout=300)
              listed=sorted({x.strip().replace('\\','/') for x in proc.stdout.splitlines() if x.strip()}) if proc.returncode==0 else []
              expected={rel for _digest,rel in rows}
              present=sorted(expected & set(listed))
              missing=sorted(expected-set(listed))
              pack_rows.append({
                  'pack_id':pack,'gltf_glb_count':gltf,'drive_folder_id':folder,
                  'remote_listing_ok':proc.returncode==0,'remote_file_count':len(listed),
                  'ledger_pack_file_count':len(rows),'ledger_relative_paths_present_by_name':len(present),
                  'ledger_relative_paths_missing_by_name':len(missing),'missing_sample':missing[:20],
                  'rclone_stderr':proc.stderr[-2000:] if proc.returncode else '',
              })

          snapshot_rows=[]
          for pack,_gltf,_rows,_folder,binding in required:
              rel=str(binding.get('source_snapshot') or '')
              expected=str(binding.get('source_snapshot_sha256') or '')
              copies=[]
              for root in roots:
                  p=(root/rel).resolve() if rel else root/'__missing__'
                  if rel and p.is_file():
                      actual=sha(p);copies.append({'root':str(root),'hash_correct':actual==expected,'actual_sha256':actual})
              snapshot_rows.append({'pack_id':pack,'path':rel,'expected_sha256':expected,'existing_copy_count':len(copies),'hash_correct_copy_count':sum(c['hash_correct'] for c in copies),'copies':copies})

          payload={
              'schema':'RealSaS.Truth139SourceAvailabilityProbeReceipt.v1','run_id':os.environ['GITHUB_RUN_ID'],
              'exact_seal_copy_count':len(roots),'required_pack_count':len(required),'required_gltf_glb_count':sum(x[1] for x in required),
              'packs':pack_rows,'source_page_snapshots':snapshot_rows,
              'all_required_drive_folders_listable':all(r['remote_listing_ok'] for r in pack_rows),
              'all_ledger_paths_present_by_name_on_remote':all(r.get('ledger_relative_paths_missing_by_name',1)==0 for r in pack_rows),
              'all_required_source_snapshots_have_exact_copy':all(r['hash_correct_copy_count']>0 for r in snapshot_rows),
              'download_performed':False,'mutation_performed':False,'render_performed':False,'training_performed':False,
          }
          payload['status']='PASS_SOURCE_BYTES_AVAILABLE_FOR_HASHED_HYDRATION' if payload['all_required_drive_folders_listable'] and payload['all_ledger_paths_present_by_name_on_remote'] and payload['all_required_source_snapshots_have_exact_copy'] else 'BLOCKED_SOURCE_AVAILABILITY_INCOMPLETE'
          Path(os.environ['OUT']).write_text(json.dumps(payload,sort_keys=True,indent=2)+'\n')
          print(json.dumps({'status':payload['status'],'required_pack_count':len(required),'listable':payload['all_required_drive_folders_listable'],'paths_present':payload['all_ledger_paths_present_by_name_on_remote'],'snapshots_present':payload['all_required_source_snapshots_have_exact_copy']},sort_keys=True))
          PY

      - name: Preserve availability receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truth139-source-availability-${{ github.run_id }}
          path: ${{ steps.probe.outputs.output_path }}
          if-no-files-found: error
          retention-days: 30
