name: truth-calibration-declared-drain
on:
  push:
    branches: [main]
    paths:
      - 'canonical/TRUTH_CALIBRATION_DRAIN_REQUEST_V1.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: truth-calibration-declared-drain
  cancel-in-progress: false
jobs:
  drain:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: '1'
      OUTPUT: /home/monster/realsas_authority/truth_calibration_drains/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Explicitly drain only the pinned idle regression after cohort failure
        run: |
          /home/monster/realsas_platform/current/bin/realsas-python tools/truth_foundry/drain_failed_calibration_v1.py \
            --request canonical/TRUTH_CALIBRATION_DRAIN_REQUEST_V1.json --platform-root /home/monster/realsas_platform \
            --authority-root /home/monster/realsas_authority --output "$OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: truth-calibration-drain-${{ github.run_id }}
          path: ${{ env.OUTPUT }}/
          if-no-files-found: warn
          retention-days: 14
