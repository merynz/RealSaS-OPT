name: truth-calibration-measurement-retirement

on:
  workflow_run:
    workflows: [current-mainline-ci]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: truth-calibration-measurement-retirement
  cancel-in-progress: false

jobs:
  activation:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      expected_sha: ${{ steps.resolve.outputs.expected_sha }}
      reason: ${{ steps.resolve.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - id: resolve
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, subprocess
          from pathlib import Path

          request = 'canonical/TRUTH_CALIBRATION_MEASUREMENT_RETIREMENT_REQUEST_V1.json'
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if os.environ['EVENT'] == 'workflow_dispatch':
              decision, reason = True, 'manual_dispatch'
          elif os.environ['CONCLUSION'] != 'success':
              decision, reason = False, 'mainline_ci_not_successful'
          elif os.environ['HEAD_BRANCH'] != 'main':
              decision, reason = False, 'non_main_ci'
          else:
              changed = subprocess.check_output(
                  ['git', 'diff-tree', '--no-commit-id', '--name-only', '-r', 'HEAD^1', 'HEAD'],
                  text=True,
              ).splitlines()
              decision = request in changed
              reason = 'retirement_request_changed_after_green_mainline' if decision else 'retirement_request_unchanged'
          print('should_run=' + ('true' if decision else 'false'))
          print('expected_sha=' + sha)
          print('reason=' + reason)
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(
              '# Measurement retirement activation\n\n'
              f'- should run: `{decision}`\n'
              f'- reason: `{reason}`\n'
              f'- SHA: `{sha}`\n', encoding='utf-8')
          PY

  retire:
    needs: activation
    if: needs.activation.outputs.should_run == 'true'
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ needs.activation.outputs.expected_sha }}
      PLATFORM_ROOT: /home/monster/realsas_platform
      AUTHORITY_ROOT: /home/monster/realsas_authority
      OUTPUT: /home/monster/realsas_authority/truth_calibration_measurement_retirement/${{ github.run_id }}-${{ github.run_attempt }}
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}

      - name: Require exact current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA"

      - name: Retire only the exact completed measurement campaign full-target workflows
        shell: bash
        run: |
          set -euo pipefail
          "$PLATFORM_ROOT/current/bin/realsas-python" \
            tools/truth_foundry/retire_completed_measurement_campaign_v1.py \
            --request canonical/TRUTH_CALIBRATION_MEASUREMENT_RETIREMENT_REQUEST_V1.json \
            --platform-root "$PLATFORM_ROOT" \
            --authority-root "$AUTHORITY_ROOT" \
            --output "$OUTPUT"

      - name: Preserve retirement receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truth-calibration-measurement-retirement-${{ github.run_id }}
          path: ${{ env.OUTPUT }}/
          if-no-files-found: error
          retention-days: 14
