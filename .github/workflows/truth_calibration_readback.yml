name: truth-calibration-readback
on:
  workflow_run:
    workflows: [platform-developer-deployment]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: truth-calibration-readback
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.select.outputs.selected }}
      decision: ${{ steps.select.outputs.decision }}
      reason: ${{ steps.select.outputs.reason }}
      expected_sha: ${{ steps.select.outputs.expected_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, subprocess
          from pathlib import Path

          name = 'canonical/TRUTH_CALIBRATION_READBACK_REQUEST_V1.json'
          request = json.loads(Path(name).read_text())
          enabled = request.get('enabled') is True
          expected_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          changed = subprocess.check_output(
              ['git', 'diff-tree', '--root', '--no-commit-id', '--name-only', '-r', 'HEAD^1', 'HEAD'],
              text=True,
          ).splitlines()

          # A deployment completion starts this workflow on every main push.
          # Most such runs are deliberate no-ops. Make that state explicit so
          # an expected no-op can never be mistaken for a runner/operation skip.
          if not enabled:
              decision, reason = 'NOOP', 'request_disabled'
          elif os.environ['EVENT'] == 'workflow_dispatch':
              decision, reason = 'RUN', 'manual_dispatch'
          elif os.environ['CONCLUSION'] not in {'success', 'failure'}:
              decision, reason = 'NOOP', 'unsupported_deployment_conclusion'
          elif os.environ['BRANCH'] != 'main':
              decision, reason = 'NOOP', 'non_main_deployment'
          elif name not in changed:
              decision, reason = 'NOOP', 'request_not_changed'
          else:
              # Failed/blocked deployment remains inspectable. Readback uses
              # only GETs and pinned files and never submits Engine execution.
              decision, reason = 'RUN', 'request_changed_on_main_deployment'

          print(f"selected={'true' if decision == 'RUN' else 'false'}")
          print(f'decision={decision}')
          print(f'reason={reason}')
          print(f'expected_sha={expected_sha}')
          PY

  decision_receipt:
    needs: select
    if: always()
    runs-on: ubuntu-latest
    env:
      SELECT_RESULT: ${{ needs.select.result }}
      DECISION: ${{ needs.select.outputs.decision }}
      REASON: ${{ needs.select.outputs.reason }}
      EXPECTED_SHA: ${{ needs.select.outputs.expected_sha }}
    steps:
      - name: Validate and publish readback decision
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          select_result = os.environ.get('SELECT_RESULT', '')
          decision = os.environ.get('DECISION', '')
          reason = os.environ.get('REASON', '')
          expected_sha = os.environ.get('EXPECTED_SHA', '')
          if select_result != 'success':
              raise SystemExit(f'READBACK_SELECTOR_NOT_SUCCESS:{select_result or "missing"}')
          if decision not in {'RUN', 'NOOP'}:
              raise SystemExit(f'READBACK_SELECTOR_INVALID_DECISION:{decision or "missing"}')
          if not reason:
              raise SystemExit('READBACK_SELECTOR_MISSING_REASON')
          if len(expected_sha) != 40:
              raise SystemExit('READBACK_SELECTOR_INVALID_EXPECTED_SHA')
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          summary.write_text(
              '# Truth calibration readback decision\n\n'
              f'- decision: `{decision}`\n'
              f'- reason: `{reason}`\n'
              f'- expected SHA: `{expected_sha}`\n',
              encoding='utf-8',
          )
          print(f'READBACK_DECISION={decision} reason={reason} expected_sha={expected_sha}')
          PY

  read:
    needs: [select, decision_receipt]
    if: needs.select.outputs.decision == 'RUN'
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: '1'
      EXPECTED_SHA: ${{ needs.select.outputs.expected_sha }}
      OUTPUT: /home/monster/realsas_authority/truth_calibration_readback/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - name: Read the original campaign without submitting any execution
        run: |
          /home/monster/realsas_platform/current/bin/realsas-python - <<'PY'
          import json, os
          from pathlib import Path
          from tools.truth_foundry.audit_native_teacher_bytes_v1 import sha256, _bound_path
          from tools.truth_foundry.observe_calibration_v1 import observe

          request = json.loads(Path('canonical/TRUTH_CALIBRATION_READBACK_REQUEST_V1.json').read_text())
          assert request['schema'] == 'RealSaS.TeacherCalibrationReadbackRequest.v1'
          assert request['execution_allowed'] is False and request['training_allowed'] is False
          preparation = _bound_path(Path('/home/monster/realsas_authority'), request['preparation_relative_path'])
          assert sha256(preparation) == request['preparation_sha256'], 'READBACK_PREPARATION_BYTES_DRIFT'
          value = json.loads(preparation.read_text())
          assert value['campaign_id'] == request['campaign_id']
          result = observe(
              value,
              api_root='http://127.0.0.1:8080',
              artifact_root='/home/monster/realsas_platform/artifacts',
              output=os.environ['OUTPUT'],
              maximum_seconds=0,
          )
          print(json.dumps({
              'campaign_id': result['campaign_id'],
              'diagnostic_members': len(result['bound_run_diagnostics']),
              'execution_resubmitted': result['execution_resubmitted'],
              'training_submitted': False,
          }), flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: truth-calibration-readback-${{ github.run_id }}
          path: ${{ env.OUTPUT }}/
          if-no-files-found: warn
          retention-days: 14

  finalize:
    needs: [select, decision_receipt, read]
    if: always()
    runs-on: ubuntu-latest
    env:
      SELECT_RESULT: ${{ needs.select.result }}
      RECEIPT_RESULT: ${{ needs.decision_receipt.result }}
      READ_RESULT: ${{ needs.read.result }}
      DECISION: ${{ needs.select.outputs.decision }}
      REASON: ${{ needs.select.outputs.reason }}
    steps:
      - name: Require expected RUN/NOOP outcome
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          select_result = os.environ.get('SELECT_RESULT', '')
          receipt_result = os.environ.get('RECEIPT_RESULT', '')
          read_result = os.environ.get('READ_RESULT', '')
          decision = os.environ.get('DECISION', '')
          reason = os.environ.get('REASON', '')

          if select_result != 'success':
              raise SystemExit(f'READBACK_SELECT_FAILED:{select_result or "missing"}')
          if receipt_result != 'success':
              raise SystemExit(f'READBACK_DECISION_RECEIPT_FAILED:{receipt_result or "missing"}')
          if decision == 'RUN':
              if read_result != 'success':
                  raise SystemExit(f'READBACK_EXPECTED_RUN_NOT_SUCCESS:{read_result or "missing"}')
          elif decision == 'NOOP':
              if read_result != 'skipped':
                  raise SystemExit(f'READBACK_EXPECTED_NOOP_NOT_SKIPPED:{read_result or "missing"}')
          else:
              raise SystemExit(f'READBACK_UNKNOWN_DECISION:{decision or "missing"}')

          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(
              '# Truth calibration readback outcome\n\n'
              f'- decision: `{decision}`\n'
              f'- reason: `{reason}`\n'
              f'- read job result: `{read_result}`\n'
              '- outcome: `PASS`\n',
              encoding='utf-8',
          )
          print(f'READBACK_OUTCOME=PASS decision={decision} reason={reason} read_result={read_result}')
          PY
