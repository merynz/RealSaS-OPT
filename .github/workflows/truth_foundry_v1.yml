name: truth-foundry-v1-source

on:
  pull_request:
    branches: [main]
    paths:
      - 'models/iris/truth/**'
      - 'tools/truth_foundry/**'
      - 'tests/truth_foundry/**'
      - 'canonical/TRUTH_FOUNDRY*'
      - 'canonical/schemas/truth_package_manifest_v1.schema.json'
      - '.github/workflows/truth_foundry_v1.yml'
  push:
    branches: [main]
    paths:
      - 'models/iris/truth/**'
      - 'tools/truth_foundry/**'
      - 'tests/truth_foundry/**'
      - 'canonical/TRUTH_FOUNDRY*'
      - 'canonical/schemas/truth_package_manifest_v1.schema.json'
      - '.github/workflows/truth_foundry_v1.yml'

permissions:
  contents: read

concurrency:
  group: truth-foundry-v1-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-courts:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: platform/go.sum
      - name: Install existing pinned CPU profile
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Behavioral measurements and package courts
        run: python -m unittest discover -s tests/truth_foundry -v
      - name: Inspect source architecture impact without model execution
        run: |
          mkdir -p truth-source-inspection
          python tools/realsas_architecture.py --json-out truth-source-inspection/map.json map
          python tools/realsas_architecture.py --json-out truth-source-inspection/impact.json impact --path models/iris/truth --path tools/truth_foundry --path canonical/TRUTH_FOUNDRY_V1_CONTRACT.json --path canonical/TRUTH_FOUNDRY_FIT8_PREREGISTRATION_V1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: truth-foundry-source-inspection-${{ github.sha }}
          path: truth-source-inspection/
          if-no-files-found: warn
          retention-days: 14
