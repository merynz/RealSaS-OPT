name: v2-fingerprint-completeness-audit-v1

on:
  push:
    branches:
      - research/vf11-certified-adaptive-20260921
    paths:
      - 'tools/audit_v2_fingerprint_completeness_v1.py'
      - '.github/workflows/v2_fingerprint_completeness_audit_v1.yml'
  workflow_dispatch:

concurrency:
  group: v2-fingerprint-completeness-audit-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - name: Run fingerprint completeness audit
        run: |
          set -euo pipefail
          python tools/audit_v2_fingerprint_completeness_v1.py | tee /tmp/fp_audit.txt

      - name: Run remaining repository/compiler suite excluding known stale collector
        run: |
          set -uo pipefail
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
          set +e
          python -m pytest -q tests/repository tests/compiler             --ignore=tests/repository/test_mainline_execution_plan_v1.py             --disable-warnings 2>&1 | tee /tmp/fp_pytest.txt
          RC=${PIPESTATUS[0]}
          set -e
          echo "$RC" > /tmp/fp_pytest_rc.txt
          echo "FP_REMAINING_PYTEST_RC=$RC"
          exit 0

      - name: Seal audit evidence
        run: |
          set -euo pipefail
          mkdir -p canonical/v2_fingerprint_completeness_audit_v1
          cp /tmp/fp_audit.txt canonical/v2_fingerprint_completeness_audit_v1/AUDIT_STDOUT.txt
          cp /tmp/fp_pytest.txt canonical/v2_fingerprint_completeness_audit_v1/PYTEST_EXCLUDING_STALE.txt
          cp /tmp/fp_pytest_rc.txt canonical/v2_fingerprint_completeness_audit_v1/PYTEST_RC.txt
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          files=[
            Path("canonical/V2_FINGERPRINT_COMPLETENESS_AUDIT_V1_20260928.json"),
            Path("canonical/v2_fingerprint_completeness_audit_v1/AUDIT_STDOUT.txt"),
            Path("canonical/v2_fingerprint_completeness_audit_v1/PYTEST_EXCLUDING_STALE.txt"),
            Path("canonical/v2_fingerprint_completeness_audit_v1/PYTEST_RC.txt"),
          ]
          payload={
            "schema":"RealSaS.V2FingerprintCompletenessAuditSeal.v1",
            "status":"AUDIT_ONLY__NO_REPAIR_APPLIED",
            "repo_head":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
            "artifacts":[{"path":str(p),"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"bytes":p.stat().st_size} for p in files],
            "repair_applied":False,
          }
          Path("canonical/v2_fingerprint_completeness_audit_v1/SEAL.json").write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n")
          PY
          git config user.name realsas-self-hosted-runner
          git config user.email runner@realsas.local
          git add canonical/V2_FINGERPRINT_COMPLETENESS_AUDIT_V1_20260928.json canonical/v2_fingerprint_completeness_audit_v1
          git commit -m 'audit: seal V2 fingerprint completeness evidence'
          git fetch origin research/vf11-certified-adaptive-20260921
          git rebase origin/research/vf11-certified-adaptive-20260921
          git push origin HEAD:research/vf11-certified-adaptive-20260921
