name: v31-evidence-adapter-pilot
on:
  pull_request:
    branches: [main]
    paths:
      - 'models/iris/v31/evidence_adapter_model_v2.py'
      - 'models/iris/v31/fixed_snake_evidence_adapter_pilot_v2.py'
      - 'canonical/IRIS_V31_FIXED_SNAKE_EVIDENCE_ADAPTER_PILOT_V2.json'
      - 'tools/training/run_iris_v31_fixed_snake_evidence_adapter_pilot_v2.py'
      - 'tests/iris/test_v31_evidence_adapter_v2.py'
      - '.github/workflows/v31_evidence_adapter_pilot.yml'
  push:
    branches: [main]
    paths:
      - 'models/iris/v31/evidence_adapter_model_v2.py'
      - 'models/iris/v31/fixed_snake_evidence_adapter_pilot_v2.py'
      - 'canonical/IRIS_V31_FIXED_SNAKE_EVIDENCE_ADAPTER_PILOT_V2.json'
      - 'tools/training/run_iris_v31_fixed_snake_evidence_adapter_pilot_v2.py'
      - 'tests/iris/test_v31_evidence_adapter_v2.py'
      - '.github/workflows/v31_evidence_adapter_pilot.yml'
permissions:
  contents: read
concurrency:
  group: v31-evidence-adapter-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-court:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt -r requirements/torch-cpu.txt
      - name: Compile protected pilot source
        run: >-
          python -m py_compile
          models/iris/v31/evidence_adapter_model_v2.py
          models/iris/v31/fixed_snake_evidence_adapter_pilot_v2.py
          tools/training/run_iris_v31_fixed_snake_evidence_adapter_pilot_v2.py
      - name: Evidence adapter architecture and recipe courts
        run: python -m pytest -q tests/iris/test_v31_evidence_adapter_v2.py
