name: v31-mechanics-student-t-pilot
on:
  pull_request:
    branches: [main]
    paths:
      - 'models/iris/v31/mechanics_student_t_v3.py'
      - 'models/iris/v31/fixed_snake_evidence_student_t_pilot_v3.py'
      - 'canonical/IRIS_V31_FIXED_SNAKE_EVIDENCE_STUDENT_T_PILOT_V3.json'
      - 'tools/training/run_iris_v31_fixed_snake_evidence_student_t_pilot_v3.py'
      - 'tests/iris/test_v31_mechanics_student_t_pilot_v3.py'
      - '.github/workflows/v31_mechanics_student_t_pilot.yml'
  push:
    branches: [main]
    paths:
      - 'models/iris/v31/mechanics_student_t_v3.py'
      - 'models/iris/v31/fixed_snake_evidence_student_t_pilot_v3.py'
      - 'canonical/IRIS_V31_FIXED_SNAKE_EVIDENCE_STUDENT_T_PILOT_V3.json'
      - 'tools/training/run_iris_v31_fixed_snake_evidence_student_t_pilot_v3.py'
      - 'tests/iris/test_v31_mechanics_student_t_pilot_v3.py'
      - '.github/workflows/v31_mechanics_student_t_pilot.yml'
permissions:
  contents: read
concurrency:
  group: v31-mechanics-student-t-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-court:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt -r requirements/torch-cpu.txt
      - name: Compile Student-t pilot source
        run: |
          python -m py_compile models/iris/v31/mechanics_student_t_v3.py
          python -m py_compile models/iris/v31/fixed_snake_evidence_student_t_pilot_v3.py
          python -m py_compile tools/training/run_iris_v31_fixed_snake_evidence_student_t_pilot_v3.py
      - name: Student-t objective, capacity and recipe courts
        run: python -m pytest -q tests/iris/test_v31_mechanics_student_t_pilot_v3.py
