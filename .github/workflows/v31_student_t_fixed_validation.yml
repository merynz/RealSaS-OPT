name: v31-student-t-fixed-validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'models/iris/v31/fixed_snake_evidence_student_t_fixed_validation_v3.py'
      - 'tools/training/run_iris_v31_fixed_snake_evidence_student_t_fixed_validation_v3.py'
      - 'tests/iris/test_v31_student_t_fixed_validation_v3.py'
      - '.github/workflows/v31_student_t_fixed_validation.yml'
  push:
    branches: [main]
    paths:
      - 'models/iris/v31/fixed_snake_evidence_student_t_fixed_validation_v3.py'
      - 'tools/training/run_iris_v31_fixed_snake_evidence_student_t_fixed_validation_v3.py'
      - 'tests/iris/test_v31_student_t_fixed_validation_v3.py'
      - '.github/workflows/v31_student_t_fixed_validation.yml'
permissions:
  contents: read
concurrency:
  group: v31-student-t-fixed-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-court:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt -r requirements/torch-cpu.txt
      - name: Compile fixed-validation source
        run: |
          python -m py_compile models/iris/v31/fixed_snake_evidence_student_t_fixed_validation_v3.py
          python -m py_compile tools/training/run_iris_v31_fixed_snake_evidence_student_t_fixed_validation_v3.py
      - name: Exact fixed validation partition court
        run: python -m pytest -q tests/iris/test_v31_student_t_fixed_validation_v3.py
