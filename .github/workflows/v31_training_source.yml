name: v31-training-source
on:
  pull_request:
    branches: [main]
    paths:
      - 'models/iris/v31/**'
      - 'models/tessa/v31/**'
      - 'models/training_runtime/**'
      - 'compiler/realsas_compiler_services/platform_worker/iris_v31_inference_v1.py'
      - 'compiler/realsas_compiler_services/platform_worker/tessa_v31_inference_v1.py'
      - 'compiler/realsas_compiler_services/platform_worker/scene_input_contract_v31.py'
      - 'compiler/realsas_compiler_services/platform_worker/input_capability_v31.py'
      - 'compiler/realsas_compiler_services/platform_worker/input_executor_v31.py'
      - 'tests/iris/test_v31_inference_checkpoint_contracts_v1.py'
      - 'tests/compiler/test_platform_v31_inference_plumbing_v1.py'
      - 'tests/compiler/test_product_input_capability_v31.py'
      - 'tests/training_runtime/**'
      - 'experiments/iris_tessa_v3_apparatus_audit_20261025/v31_alpha_resampling_policy_probe_v1.py'
      - 'tools/ops/inspect_truth_inputs_v1.py'
      - 'compiler/realsas_compiler_core/graphics_evidence_v2.py'
      - 'compiler/realsas_compiler_core/graphics_v2.py'
      - 'tests/compiler/test_graphics_v2.py'
      - '.github/workflows/v31_training_source.yml'
  push:
    branches: [main]
    paths:
      - 'models/iris/v31/**'
      - 'models/tessa/v31/**'
      - 'models/training_runtime/**'
      - 'compiler/realsas_compiler_services/platform_worker/iris_v31_inference_v1.py'
      - 'compiler/realsas_compiler_services/platform_worker/tessa_v31_inference_v1.py'
      - 'compiler/realsas_compiler_services/platform_worker/scene_input_contract_v31.py'
      - 'compiler/realsas_compiler_services/platform_worker/input_capability_v31.py'
      - 'compiler/realsas_compiler_services/platform_worker/input_executor_v31.py'
      - 'tests/iris/test_v31_inference_checkpoint_contracts_v1.py'
      - 'tests/compiler/test_platform_v31_inference_plumbing_v1.py'
      - 'tests/compiler/test_product_input_capability_v31.py'
      - 'tests/training_runtime/**'
      - 'experiments/iris_tessa_v3_apparatus_audit_20261025/v31_alpha_resampling_policy_probe_v1.py'
      - 'tools/ops/inspect_truth_inputs_v1.py'
      - 'compiler/realsas_compiler_core/graphics_evidence_v2.py'
      - 'compiler/realsas_compiler_core/graphics_v2.py'
      - 'tests/compiler/test_graphics_v2.py'
      - '.github/workflows/v31_training_source.yml'
permissions:
  contents: read
concurrency:
  group: v31-training-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-courts:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: platform/go.sum
      - run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt -r requirements/torch-cpu.txt
      - name: Models, rolling attention, packing, resume and telemetry
        run: python -m unittest discover -s tests/training_runtime -v
      - name: V3.1 checkpoint and runtime admission contracts
        run: >-
          python -m pytest -q
          tests/iris/test_v31_inference_checkpoint_contracts_v1.py
          tests/compiler/test_platform_v31_inference_plumbing_v1.py
          tests/compiler/test_product_input_capability_v31.py
      - name: V3.1 alpha resampling bounded court
        run: |
          mkdir -p v31-courts
          python experiments/iris_tessa_v3_apparatus_audit_20261025/v31_alpha_resampling_policy_probe_v1.py --out v31-courts/V31_ALPHA_RESAMPLING_POLICY_COURT_V1.json
      - name: Existing Truth Foundry source regressions
        run: python -m unittest discover -s tests/truth_foundry -v
      - name: Scoped ray evidence consumer
        run: python -m unittest discover -s tests/compiler -p test_graphics_v2.py -v
      - name: Inspect source dependencies
        run: |
          mkdir -p source-inspection
          python tools/realsas_architecture.py --json-out source-inspection/map.json map
          python tools/realsas_architecture.py --json-out source-inspection/impact.json impact --path models/iris/v31/model_v31.py --path models/iris/v31/frozen_features_v31.py --path models/iris/v31/checkpoint_v1.py --path models/iris/v31/alpha_resampling_v1.py --path models/iris/v31/numerical_environment_v1.py --path models/tessa/v31/model_v31.py --path models/tessa/v31/attention_v31.py --path models/tessa/v31/checkpoint_v1.py --path models/training_runtime/durable_state_v1.py --path compiler/realsas_compiler_services/platform_worker/iris_v31_inference_v1.py --path compiler/realsas_compiler_services/platform_worker/tessa_v31_inference_v1.py --path compiler/realsas_compiler_services/platform_worker/scene_input_contract_v31.py --path compiler/realsas_compiler_services/platform_worker/input_capability_v31.py --path compiler/realsas_compiler_services/platform_worker/input_executor_v31.py --path experiments/iris_tessa_v3_apparatus_audit_20261025/v31_alpha_resampling_policy_probe_v1.py --path tools/ops/inspect_truth_inputs_v1.py --path compiler/realsas_compiler_core/graphics_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v31-source-inspection-${{ github.sha }}
          path: |
            source-inspection/
            v31-courts/
          retention-days: 14
