name: v6-main-contract-integration-v1

on:
  pull_request:
    paths:
      - 'compiler/realsas_compiler_core/rig_program_ir_v1.py'
      - 'compiler/realsas_compiler_core/rig_constraint_schema_v1.py'
      - 'compiler/realsas_compiler_core/skin_code_ir_v1.py'
      - 'models/rss_vnext/semantic_geometry_prior.py'
      - 'models/rss_vnext/training_engine.py'
      - 'tests/models/test_rss_vnext_early_semantics.py'
      - 'compiler/realsas_compiler_core/canonical_mesh_ir_v1.py'
      - 'compiler/realsas_compiler_core/canonical_rig_ir_v2.py'
      - 'compiler/realsas_compiler_core/canonical_skin_ir_v2.py'
      - 'compiler/realsas_compiler_core/mechanics_control_solver_v1.py'
      - 'compiler/realsas_compiler_core/controllable_puppet_runtime_v1.py'
      - 'compiler/realsas_compiler_services/export/playback_v4_control_bridge_v1.py'
      - 'compiler/realsas_compiler_services/platform_worker/shape_capability_v2.py'
      - 'tests/compiler/test_product_shape_capability_v2.py'
      - 'compiler/realsas_compiler_services/platform_worker/rig_executor_v2.py'
      - 'compiler/realsas_compiler_services/platform_worker/skin_executor_v2.py'
      - 'platform/internal/capability/product_rig.go'
      - 'platform/internal/capability/product_skin.go'
      - 'platform/internal/capability/product_models_test.go'
      - 'platform/internal/capability/release_compose_test.go'
      - 'platform/internal/capability/contracts/product_capabilities_v1.json'
      - 'tools/platform_capability_versions.py'
      - 'tests/compiler/test_canonical_mesh_ir_v1.py'
      - 'tests/compiler/test_vnext_single_carrier_graphics_v1.py'
      - 'compiler/realsas_compiler_core/graphics_v1.py'
      - 'compiler/realsas_compiler_core/graphics_runtime_v1.py'
      - 'models/axis/rig_program_decode_v6.py'
      - 'tests/models/test_axis_mira_v6_product_runtime.py'
      - 'tests/compiler/test_control_ready_rig_v2.py'
      - 'tests/compiler/test_mechanics_control_solver_v1.py'
      - 'tests/compiler/test_controllable_puppet_runtime_v1.py'
      - 'tests/compiler/test_playback_v4_control_bridge_v1.py'
      - 'tests/compiler/test_platform_capability_versions_v1.py'
      - 'tests/repository/test_fit1_mechanical_product_role_alignment_v1.py'
      - 'tests/compiler/test_mechanics_main_subtree_runtime_v1.py'
      - 'tests/compiler/test_control_motion_ik_integration_v1.py'
      - 'tests/compiler/test_rig_program_causal_linear_v1.py'
      - 'tests/compiler/test_v6_typed_rig_skin_main_integration_v1.py'
      - '.github/workflows/v6_main_contract_integration_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typed-canonical-contract-courts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic compiler testing requirements
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Compile imported contracts
        run: |
          python -m py_compile \
            compiler/realsas_compiler_core/rig_program_ir_v1.py \
            compiler/realsas_compiler_core/rig_constraint_schema_v1.py \
            compiler/realsas_compiler_core/skin_code_ir_v1.py \
            models/rss_vnext/semantic_geometry_prior.py \
            models/rss_vnext/training_engine.py \
            compiler/realsas_compiler_core/canonical_mesh_ir_v1.py \
            compiler/realsas_compiler_core/canonical_rig_ir_v2.py \
            compiler/realsas_compiler_core/canonical_skin_ir_v2.py \
            compiler/realsas_compiler_core/mechanics_control_solver_v1.py \
            compiler/realsas_compiler_core/controllable_puppet_runtime_v1.py \
            compiler/realsas_compiler_services/export/playback_v4_control_bridge_v1.py \
            compiler/realsas_compiler_services/platform_worker/rig_executor_v2.py
      - name: Independently verify existing V6 and main integration regressions
        run: |
          python -m pytest -q \
            tests/compiler/test_canonical_mesh_ir_v1.py \
            tests/compiler/test_product_shape_capability_v2.py \
            tests/compiler/test_vnext_single_carrier_graphics_v1.py \
            tests/compiler/test_control_ready_rig_v2.py \
            tests/compiler/test_rig_program_causal_linear_v1.py \
            tests/compiler/test_v6_typed_rig_skin_main_integration_v1.py \
            tests/compiler/test_mechanics_control_solver_v1.py \
            tests/compiler/test_controllable_puppet_runtime_v1.py \
            tests/compiler/test_playback_v4_control_bridge_v1.py \
            tests/compiler/test_platform_capability_versions_v1.py \
            tests/repository/test_fit1_mechanical_product_role_alignment_v1.py \
            tests/compiler/test_mechanics_main_subtree_runtime_v1.py \
            tests/compiler/test_control_motion_ik_integration_v1.py
      - name: Typed contracts do not mint product or training authority
        run: |
          python - <<'PY'
          from compiler.realsas_compiler_core.rig_program_ir_v1 import RigProgramProposalIR
          from compiler.realsas_compiler_core.canonical_skin_ir_v2 import CanonicalSkinIRV2
          from compiler.realsas_compiler_core.rig_constraint_schema_v1 import RIG_CONSTRAINT_OPERATOR_IDS_V1
          assert RigProgramProposalIR.__module__.endswith('rig_program_ir_v1')
          assert CanonicalSkinIRV2.__module__.endswith('canonical_skin_ir_v2')
          assert len(RIG_CONSTRAINT_OPERATOR_IDS_V1) == 5
          print('PASS_V6_TYPED_CONTRACTS_NO_MODEL_RELEASE_NO_RUNTIME_EXECUTOR')
          PY

  platform-catalog-v6-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: platform/go.sum
      - name: Verify active Rig/Skin providers and release requirements without database or apt
        working-directory: platform
        run: |
          go test -count=1 ./internal/capability
