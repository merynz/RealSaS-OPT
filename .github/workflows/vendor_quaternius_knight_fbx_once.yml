name: vendor-quaternius-knight-fbx-once

on:
  push:
    branches: [recovery/canonical-main-20261001]
    paths:
      - '.github/workflows/vendor_quaternius_knight_fbx_once.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 10
    env:
      QUATERNIUS_DRIVE_FILE_ID: '1f-Y_lNExN-eAp2XCMVokY9x3xy6-4Aen'
      EXPECTED_FBX_SHA256: '41f2616fb4a42f9d35e242bbed1450ededc7537def4bf38cbb11b4e54ff2bf21'
      TARGET: 'assets/external/quaternius/knight/KnightCharacter.fbx'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/canonical-main-20261001
          fetch-depth: 0

      - name: Download and verify exact CC0 source asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$TARGET")"
          tmp="$RUNNER_TEMP/KnightCharacter.fbx"
          curl --fail --location --retry 3 --retry-delay 2             "https://drive.usercontent.google.com/download?id=$QUATERNIUS_DRIVE_FILE_ID&export=download&confirm=t"             --output "$tmp"
          printf '%s  %s\n' "$EXPECTED_FBX_SHA256" "$tmp" | sha256sum --check -
          cp "$tmp" "$TARGET"
          printf '%s  %s\n' "$EXPECTED_FBX_SHA256" "$TARGET" | sha256sum --check -

      - name: Add provenance and license
        shell: bash
        run: |
          set -euo pipefail
          cat > assets/external/quaternius/knight/LICENSE.txt <<'EOF'
          Knight Pack by Quaternius
          License: CC0 1.0 Universal (CC0 1.0)
          Public Domain Dedication
          https://creativecommons.org/publicdomain/zero/1.0/
          EOF
          cat > assets/external/quaternius/knight/PROVENANCE.json <<'EOF'
          {
            "schema": "RealSaS.ExternalAssetProvenance.v1",
            "asset": "KnightCharacter.fbx",
            "source": "Knight Pack by Quaternius",
            "license": "CC0-1.0",
            "sha256": "41f2616fb4a42f9d35e242bbed1450ededc7537def4bf38cbb11b4e54ff2bf21",
            "purpose": "Pinned external motion-source fixture for RealSaS qualification and regression."
          }
          EOF

      - name: Commit vendored fixture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/external/quaternius/knight/KnightCharacter.fbx                   assets/external/quaternius/knight/LICENSE.txt                   assets/external/quaternius/knight/PROVENANCE.json
          if git diff --cached --quiet; then
            echo "Exact fixture already vendored."
            exit 0
          fi
          git commit -m "assets: vendor pinned Quaternius Knight FBX fixture"
          git push origin HEAD:recovery/canonical-main-20261001
