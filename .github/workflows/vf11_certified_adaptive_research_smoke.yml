name: VF11 certified adaptive research smoke

on:
  push:
    branches:
      - research/vf11-certified-adaptive-20260921
    paths:
      - 'experiments/vf11_certified_adaptive/**'
      - 'tests/research/test_vf11_range_engine_v1.py'
      - 'tests/research/test_vf11_range_engine_c0_v2.py'
      - 'tests/research/test_vf11_range_engine_c0_v3.py'
      - 'tests/research/test_vf11_paired_profile_c0_v3.py'
      - 'tests/research/test_vf11_directional_regular_c1_v1.py'
      - 'tests/research/test_vf11_profile_c1_handoff_v1.py'
      - 'tests/research/test_vf11_directional_regular_c1_v2.py'
      - 'tests/research/test_vf11_profile_c1_handoff_v2.py'
      - 'tests/research/test_vf11_oriented_crossing_c2_v1.py'
      - 'tests/research/test_vf11_profile_c2_primary_v1.py'
      - 'canonical/VF11_CERTIFIED_ADAPTIVE_RESEARCH_REDIRECTION_V1_20260921.json'
      - 'canonical/VF11_RANGE_ENGINE_V1_CLOSURE_20260921.json'
      - 'canonical/VF11_C0_RANGE_RESEARCH_PREREGISTRATION_V2_20260921.json'
      - 'canonical/VF11_C0_PAIRED_RESEARCH_PREREGISTRATION_V3_20260921.json'
      - 'canonical/VF11_C0_RESEARCH_CLOSURE_V4_20260921.json'
      - 'canonical/VF11_C1_DIRECTIONAL_REGULARITY_PREREGISTRATION_V1_20260921.json'
      - 'canonical/VF11_C1_V1_CLOSURE_20260921.json'
      - 'canonical/VF11_C1_V2_CORRELATED_AFFINE_PREREGISTRATION_20260921.json'
      - 'canonical/VF11_C1_V2_INTERIM_REVIEW_20260921.json'
      - 'canonical/VF11_C1_V2_RESEARCH_CLOSURE_20260921.json'
      - 'canonical/VF11_C2_ORIENTED_CROSSING_PREREGISTRATION_20260921.json'
      - '.github/workflows/vf11_certified_adaptive_research_smoke.yml'
  workflow_dispatch:

concurrency:
  group: vf11-certified-adaptive-smoke-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  range-engine-smoke:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal frozen test dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
          PIP_DEFAULT_TIMEOUT: '60'
        run: |
          python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt
          python -m pip install --no-input --progress-bar off pytest==8.3.5

      - name: Compile research range engine
        run: |
          python -m py_compile experiments/vf11_certified_adaptive/range_engine_v1.py
          python -m py_compile experiments/vf11_certified_adaptive/range_engine_c0_v2.py
          python -m py_compile experiments/vf11_certified_adaptive/profile_c0_v2.py
          python -m py_compile experiments/vf11_certified_adaptive/range_engine_c0_v3.py
          python -m py_compile experiments/vf11_certified_adaptive/paired_profile_c0_v3.py
          python -m py_compile experiments/vf11_certified_adaptive/directional_regular_c1_v1.py
          python -m py_compile experiments/vf11_certified_adaptive/profile_c1_handoff_v1.py
          python -m py_compile experiments/vf11_certified_adaptive/directional_regular_c1_v2.py
          python -m py_compile experiments/vf11_certified_adaptive/profile_c1_handoff_v2.py
          python -m py_compile experiments/vf11_certified_adaptive/oriented_crossing_c2_v1.py
          python -m py_compile experiments/vf11_certified_adaptive/profile_c2_primary_v1.py
          python -m py_compile tests/research/test_vf11_range_engine_v1.py
          python -m py_compile tests/research/test_vf11_range_engine_c0_v2.py
          python -m py_compile tests/research/test_vf11_range_engine_c0_v3.py
          python -m py_compile tests/research/test_vf11_paired_profile_c0_v3.py
          python -m py_compile tests/research/test_vf11_directional_regular_c1_v1.py
          python -m py_compile tests/research/test_vf11_profile_c1_handoff_v1.py
          python -m py_compile tests/research/test_vf11_directional_regular_c1_v2.py
          python -m py_compile tests/research/test_vf11_profile_c1_handoff_v2.py
          python -m py_compile tests/research/test_vf11_oriented_crossing_c2_v1.py
          python -m py_compile tests/research/test_vf11_profile_c2_primary_v1.py

      - name: Enforce research-only claim boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('canonical/VF11_CERTIFIED_ADAPTIVE_RESEARCH_REDIRECTION_V1_20260921.json',encoding='utf-8'))
          assert p['authority_class']=='RESEARCH_PREREGISTRATION_ONLY'
          assert p['product_authority_minted'] is False
          assert p['witness_execution_authorized'] is False
          assert p['knight_mainline_started'] is False
          assert p['x1_disposition']['state']=='HOLD_NOT_EXECUTED'
          assert p['next_long_experiment']['execution_class']=='LONG__USER_RUN_ALL_NOTEBOOK_REQUIRED'
          v1=json.load(open('canonical/VF11_RANGE_ENGINE_V1_CLOSURE_20260921.json',encoding='utf-8'))
          assert v1['status']=='FALSIFIED__PRACTICALLY_VACUOUS_BOUNDS'
          v2=json.load(open('canonical/VF11_C0_RANGE_RESEARCH_PREREGISTRATION_V2_20260921.json',encoding='utf-8'))
          assert v2['status']=='PREREGISTERED__C0_RANGE_ONLY'
          assert v2['product_authority_minted'] is False
          assert v2['witness_execution'] is False
          v3=json.load(open('canonical/VF11_C0_PAIRED_RESEARCH_PREREGISTRATION_V3_20260921.json',encoding='utf-8'))
          assert v3['status']=='PREREGISTERED__PAIRED_MULTI_DEPTH_C0_ONLY'
          assert v3['product_authority_minted'] is False
          assert v3['witness_execution'] is False
          assert v3['proven_regular']=='FORBIDDEN'
          c0c=json.load(open('canonical/VF11_C0_RESEARCH_CLOSURE_V4_20260921.json',encoding='utf-8'))
          assert c0c['status']=='C0_RESEARCH_CLOSED__C1_RESEARCH_AUTHORIZED'
          assert c0c['product_authority_minted'] is False
          assert c0c['shipping_certificate_backend'] is False
          c1=json.load(open('canonical/VF11_C1_DIRECTIONAL_REGULARITY_PREREGISTRATION_V1_20260921.json',encoding='utf-8'))
          assert c1['status']=='PREREGISTERED__C1_DIRECTIONAL_REGULARITY'
          assert c1['product_authority_minted'] is False
          assert 'PROVEN_SINGLE_COMPONENT' in c1['forbidden_inferences']
          c1v1c=json.load(open('canonical/VF11_C1_V1_CLOSURE_20260921.json',encoding='utf-8'))
          assert c1v1c['status']=='FALSIFIED__C1_V1_VACUOUS_DIRECTIONAL_BOUNDS'
          assert c1v1c['product_authority_minted'] is False
          c1v2=json.load(open('canonical/VF11_C1_V2_CORRELATED_AFFINE_PREREGISTRATION_20260921.json',encoding='utf-8'))
          assert c1v2['status']=='PREREGISTERED__C1_V2_CORRELATED_TANGENT_AFFINE'
          assert c1v2['product_authority_minted'] is False
          assert c1v2['full_domain_traversal_authorized'] is False
          c1v2r=json.load(open('canonical/VF11_C1_V2_INTERIM_REVIEW_20260921.json',encoding='utf-8'))
          assert c1v2r['status']=='NONVACUOUS__MARGIN_REPORTING_REPLAY_REQUIRED_BEFORE_CLOSURE'
          assert c1v2r['product_authority_minted'] is False
          c1close=json.load(open('canonical/VF11_C1_V2_RESEARCH_CLOSURE_20260921.json',encoding='utf-8'))
          assert c1close['status']=='C1_V2_RESEARCH_CLOSED__C2_CROSSING_RESEARCH_AUTHORIZED'
          assert c1close['product_authority_minted'] is False
          c2=json.load(open('canonical/VF11_C2_ORIENTED_CROSSING_PREREGISTRATION_20260921.json',encoding='utf-8'))
          assert c2['status']=='PREREGISTERED__C2_ORIENTED_CROSSING_EXISTENCE_UNIQUENESS'
          assert c2['product_authority_minted'] is False
          assert c2['full_domain_traversal_authorized'] is False
          print('VF11_RESEARCH_CLAIM_BOUNDARY=PASS')
          PY

      - name: Diagnose C2 point-bound semantic mismatch
        run: |
          python - <<'PY'
          import sys, torch, numpy as np
          import torch.nn.functional as F
          from torch import nn
          sys.path.insert(0,'experiments/vf11_certified_adaptive')
          import range_engine_c0_v3 as c0
          torch.manual_seed(502)
          class TinyField(nn.Module):
              def __init__(self, channels=2, hidden=8):
                  super().__init__()
                  width=3*channels
                  self.body=nn.Sequential(nn.LayerNorm(width),nn.Linear(width,hidden),nn.SiLU(),nn.Linear(hidden,hidden),nn.SiLU())
                  self.sdf_head=nn.Linear(hidden,1)
              @staticmethod
              def sample(planes, points):
                  b,_,c,h,w=planes.shape
                  x,y,z=points.unbind(-1)
                  grids=torch.stack([torch.stack([x,y],-1),torch.stack([x,z],-1),torch.stack([y,z],-1)],dim=1)
                  sampled=F.grid_sample(planes.reshape(b*3,c,h,w),grids.reshape(b*3,points.shape[1],1,2),mode='bilinear',padding_mode='border',align_corners=False)
                  return sampled.squeeze(-1).reshape(b,3,c,points.shape[1]).permute(0,3,1,2).reshape(b,points.shape[1],3*c)
              def forward(self,planes,points):
                  h=self.body(self.sample(planes,points))
                  return {'sdf':self.sdf_head(h).squeeze(-1)}
          field=TinyField().double().eval()
          planes=torch.randn(1,3,2,8,8,dtype=torch.float64)
          pp=c0.prepare_planes(planes); p=c0.prepare_field(field)
          point=np.array([0.13,-0.22,0.31],dtype=np.float64)
          q=torch.tensor(point.reshape(1,1,3),dtype=torch.float64)
          direct0=field.sample(pp,q).reshape(-1)
          aff=c0._triplane_affine_single_regime(pp,point,point)
          print('TRIPLANE maxdiff',float((direct0-aff.center).abs().max()), 'direct', direct0.tolist(), 'aff', aff.center.tolist())
          direct1=field.body[0](direct0)
          aff1=c0._layernorm_affine(aff,p)
          print('LN maxdiff',float((direct1-aff1.center).abs().max()), 'rad',float(aff1.generators.abs().sum(dim=1).max()))
          direct2=field.body[1](direct1)
          aff2=c0._linear(aff1,p.w1,p.b1)
          print('LIN1 maxdiff',float((direct2-aff2.center).abs().max()), 'rad',float(aff2.generators.abs().sum(dim=1).max()))
          direct3=field.body[2](direct2)
          aff3=c0._silu_affine(aff2)
          print('SILU1 maxdiff',float((direct3-aff3.center).abs().max()), 'rad',float(aff3.generators.abs().sum(dim=1).max()))
          direct4=field.body[3](direct3)
          aff4=c0._linear(aff3,p.w2,p.b2)
          print('LIN2 maxdiff',float((direct4-aff4.center).abs().max()), 'rad',float(aff4.generators.abs().sum(dim=1).max()))
          direct5=field.body[4](direct4)
          aff5=c0._silu_affine(aff4)
          print('SILU2 maxdiff',float((direct5-aff5.center).abs().max()), 'rad',float(aff5.generators.abs().sum(dim=1).max()))
          direct6=field.sdf_head(direct5).reshape(())
          aff6=c0._linear(aff5,p.wh,p.bh)
          lo,hi=aff6.bounds()
          print('HEAD direct',float(direct6),'center',float(aff6.center.item()),'lo',float(lo.item()),'hi',float(hi.item()),'diff',float(direct6-aff6.center.item()))
          PY

      - name: Run short deterministic/adversarial range tests
        run: pytest -q tests/research/test_vf11_range_engine_v1.py tests/research/test_vf11_range_engine_c0_v2.py tests/research/test_vf11_range_engine_c0_v3.py tests/research/test_vf11_paired_profile_c0_v3.py tests/research/test_vf11_directional_regular_c1_v1.py tests/research/test_vf11_profile_c1_handoff_v1.py tests/research/test_vf11_directional_regular_c1_v2.py tests/research/test_vf11_profile_c1_handoff_v2.py tests/research/test_vf11_oriented_crossing_c2_v1.py tests/research/test_vf11_profile_c2_primary_v1.py

      - name: Emit smoke receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vf11_cert_smoke
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          files=[
            'experiments/vf11_certified_adaptive/range_engine_v1.py',
            'experiments/vf11_certified_adaptive/range_engine_c0_v2.py',
            'experiments/vf11_certified_adaptive/profile_c0_v2.py',
            'experiments/vf11_certified_adaptive/range_engine_c0_v3.py',
            'experiments/vf11_certified_adaptive/paired_profile_c0_v3.py',
            'experiments/vf11_certified_adaptive/directional_regular_c1_v1.py',
            'experiments/vf11_certified_adaptive/profile_c1_handoff_v1.py',
            'experiments/vf11_certified_adaptive/directional_regular_c1_v2.py',
            'experiments/vf11_certified_adaptive/profile_c1_handoff_v2.py',
            'experiments/vf11_certified_adaptive/oriented_crossing_c2_v1.py',
            'experiments/vf11_certified_adaptive/profile_c2_primary_v1.py',
            'tests/research/test_vf11_range_engine_v1.py',
            'tests/research/test_vf11_range_engine_c0_v2.py',
            'tests/research/test_vf11_range_engine_c0_v3.py',
            'tests/research/test_vf11_paired_profile_c0_v3.py',
            'tests/research/test_vf11_directional_regular_c1_v1.py',
            'tests/research/test_vf11_profile_c1_handoff_v1.py',
            'tests/research/test_vf11_directional_regular_c1_v2.py',
            'tests/research/test_vf11_profile_c1_handoff_v2.py',
            'tests/research/test_vf11_oriented_crossing_c2_v1.py',
            'tests/research/test_vf11_profile_c2_primary_v1.py',
            'canonical/VF11_CERTIFIED_ADAPTIVE_RESEARCH_REDIRECTION_V1_20260921.json',
            'canonical/VF11_RANGE_ENGINE_V1_CLOSURE_20260921.json',
            'canonical/VF11_C0_RANGE_RESEARCH_PREREGISTRATION_V2_20260921.json',
            'canonical/VF11_C0_PAIRED_RESEARCH_PREREGISTRATION_V3_20260921.json',
            'canonical/VF11_C0_RESEARCH_CLOSURE_V4_20260921.json',
            'canonical/VF11_C1_DIRECTIONAL_REGULARITY_PREREGISTRATION_V1_20260921.json',
            'canonical/VF11_C1_V1_CLOSURE_20260921.json',
            'canonical/VF11_C1_V2_CORRELATED_AFFINE_PREREGISTRATION_20260921.json',
            'canonical/VF11_C1_V2_INTERIM_REVIEW_20260921.json',
            'canonical/VF11_C1_V2_RESEARCH_CLOSURE_20260921.json',
            'canonical/VF11_C2_ORIENTED_CROSSING_PREREGISTRATION_20260921.json',
          ]
          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          out={
            'schema':'RealSaS.VF11CertifiedAdaptiveResearchSmokeReceipt.v7',
            'status':'PASS',
            'product_authority_minted':False,
            'files':{p:sha(p) for p in files},
          }
          Path('vf11_cert_smoke/receipt.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: vf11-certified-adaptive-research-smoke
          path: vf11_cert_smoke/
          if-no-files-found: error
