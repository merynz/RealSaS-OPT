name: VF11 R512 phase sensitivity capture once

on:
  push:
    branches:
      - recovery/canonical-main-20261001
    paths:
      - '.github/workflows/vf11_r512_phase_capture_once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 240
    env:
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      REALSAS_VF11_DECODER_RESOLUTION: '512'
      REALSAS_VF11_Z_SLAB: '4'
      REALSAS_VF11_X1_OUT: vf11_x1_out
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/canonical-main-20261001
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
          PIP_DEFAULT_TIMEOUT: '60'
        run: |
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
          python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt
          python -m pip install --no-input --progress-bar off scikit-image==0.25.2

      - name: Run subject-free R512 phase panel
        run: python tools/vf11_r512_phase_sensitivity_panel.py

      - name: Seal measurement into recovery branch
        shell: bash
        run: |
          set -euo pipefail
          cp vf11_x1_out/VF11_R512_PHASE_SENSITIVITY_PANEL.json canonical/VF11_R512_PHASE_SENSITIVITY_RESULT_20261001.json
          python - <<'PY'
          import json
          p=json.load(open('canonical/VF11_R512_PHASE_SENSITIVITY_RESULT_20261001.json',encoding='utf-8'))
          assert p['schema']=='RealSaS.VF11R512PhaseSensitivityPanel.v1'
          assert p['decoder_resolution']==512
          assert p['subject_inputs_used'] is False
          assert p['knight_result_used'] is False
          print(json.dumps(p['decision'],sort_keys=True))
          PY
          rm .github/workflows/vf11_r512_phase_capture_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canonical/VF11_R512_PHASE_SENSITIVITY_RESULT_20261001.json .github/workflows/vf11_r512_phase_capture_once.yml
          git commit -m "evidence: seal VF11 R512 phase sensitivity measurement"
          git push origin HEAD:recovery/canonical-main-20261001
