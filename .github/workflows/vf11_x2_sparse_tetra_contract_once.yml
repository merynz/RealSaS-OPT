name: vf11-x2 sparse tetra source restoration

on:
  push:
    branches: [research/vf11-x2-sparse-tetra-20261001]
    paths:
      - '.github/workflows/vf11_x2_sparse_tetra_contract_once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/vf11-x2-sparse-tetra-20261001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Restore exact missing V5 companion sources from repository history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models/iris/v5
          : > /tmp/v5_restore_receipt.txt
          for path in             models/iris/v5/contained_sparse_tetra_decoder_v5.py             models/iris/v5/learned_tail_localization_v5.py
          do
            commit="$(git log --all --format=%H -- "$path" | head -n 1)"
            test -n "$commit"
            git show "$commit:$path" > "$path"
            sha="$(sha256sum "$path" | awk '{print $1}')"
            printf '%s %s %s\n' "$path" "$commit" "$sha" | tee -a /tmp/v5_restore_receipt.txt
          done
      - name: Install CPU test dependencies
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Exact sparse tetra decoder contracts
        run: |
          python -m pytest -q             tests/iris/test_indexed_sparse_tetra_decoder_v5.py             tests/iris/test_shell_escape_diagnostics_v5.py             tests/iris/test_learned_tail_localization_v5.py
      - name: Seal restoration receipt and retire one-shot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          rows=[]
          for line in Path('/tmp/v5_restore_receipt.txt').read_text().splitlines():
              path,commit,sha=line.split()
              rows.append({"path":path,"source_commit":commit,"sha256":sha})
          p={
            "schema":"RealSaS.VF11X2V5SourceRestoration.v1",
            "status":"PASS_EXACT_HISTORY_RESTORATION_AND_CONTRACTS",
            "files":rows,
            "subject_inputs_used":False,
            "knight_result_used":False,
          }
          out=Path("canonical/VF11_X2_V5_SOURCE_RESTORATION_20261001.json")
          out.write_text(json.dumps(p,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          PY
          rm .github/workflows/vf11_x2_sparse_tetra_contract_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/iris/v5/contained_sparse_tetra_decoder_v5.py                   models/iris/v5/learned_tail_localization_v5.py                   canonical/VF11_X2_V5_SOURCE_RESTORATION_20261001.json                   .github/workflows/vf11_x2_sparse_tetra_contract_once.yml
          git commit -m "research: restore complete proven IRIS V5 sparse decoder source"
          git push origin HEAD:research/vf11-x2-sparse-tetra-20261001
