name: vf11-x2 sparse tetra source contract

on:
  push:
    branches: [research/vf11-x2-sparse-tetra-20261001]
    paths:
      - 'models/iris/v5/indexed_sparse_tetra_decoder_v5.py'
      - '.github/workflows/vf11_x2_sparse_tetra_contract_once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/vf11-x2-sparse-tetra-20261001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install CPU test dependencies
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Exact sparse tetra decoder contracts
        run: |
          python -m pytest -q             tests/iris/test_indexed_sparse_tetra_decoder_v5.py             tests/iris/test_shell_escape_diagnostics_v5.py             tests/iris/test_learned_tail_localization_v5.py
      - name: Retire one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/vf11_x2_sparse_tetra_contract_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/vf11_x2_sparse_tetra_contract_once.yml
          git commit -m "ci: retire sparse tetra source contract probe"
          git push origin HEAD:research/vf11-x2-sparse-tetra-20261001
