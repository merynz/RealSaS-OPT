name: visual-mesh-ownership-gate-v1
# rerun-after-ledger-rebind

on:
  push:
    branches:
      - research/vf11-certified-adaptive-20260921
    paths:
      - 'compiler/realsas_compiler_core/visual_mesh_arap_v1.py'
      - 'compiler/realsas_compiler_core/surface_addressing_v1.py'
      - 'compiler/realsas_compiler_core/appearance_authority_v2.py'
      - 'compiler/realsas_compiler_services/orchestrator/adapters/v2_architecture.py'
      - 'compiler/realsas_compiler_services/orchestrator/adapters/appearance_v2.py'
      - 'compiler/realsas_compiler_core/product_state_v2.py'
      - 'compiler/realsas_compiler_services/orchestrator/adapters/product_state_v2.py'
      - 'canonical/MAINLINE_EXECUTION_PLAN_V2.json'
      - 'tests/compiler/test_visual_mesh_arap_v1.py'
      - 'tests/repository/test_mainline_execution_plan_v2.py'
      - '.github/workflows/visual_mesh_ownership_gate_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Compile visual ownership modules
        run: |
          set -euo pipefail
          python -m py_compile \
            compiler/realsas_compiler_core/visual_mesh_arap_v1.py \
            compiler/realsas_compiler_core/surface_addressing_v1.py \
            compiler/realsas_compiler_core/appearance_authority_v2.py \
            compiler/realsas_compiler_services/orchestrator/adapters/v2_architecture.py \
            compiler/realsas_compiler_services/orchestrator/adapters/appearance_v2.py \
            compiler/realsas_compiler_core/product_state_v2.py \
            compiler/realsas_compiler_services/orchestrator/adapters/product_state_v2.py
      - name: Run focused regressions
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m pytest -q \
            tests/compiler/test_visual_mesh_arap_v1.py \
            tests/repository/test_mainline_execution_plan_v2.py \
            tests/compiler/test_product_mesh_stage_adapters_v1.py::test_vf23_stage20_to25_uses_unmodified_production_caa_policy
