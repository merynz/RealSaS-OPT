name: mesh-go-diagnostic-once
on:
  push:
    branches: [product/mesh-capability-v1-20261023-canonical-main]
    paths: [.github/workflows/zz_mesh_go_diagnostic_once.yml]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/mesh-capability-v1-20261023-canonical-main
      - uses: actions/setup-go@v5
        with:
          go-version-file: platform/go.mod
      - name: Capture Go capability test output
        working-directory: platform
        run: |
          set +e
          go test -v ./internal/capability > ../mesh-go-test.txt 2>&1
          code=$?
          echo "$code" > ../mesh-go-exit.txt
          cat ../mesh-go-test.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: mesh-go-diagnostic
          path: |
            mesh-go-test.txt
            mesh-go-exit.txt
      - name: Remove transient workflow
        run: |
          rm .github/workflows/zz_mesh_go_diagnostic_once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/zz_mesh_go_diagnostic_once.yml
          git commit -m 'CI: remove transient Mesh Go diagnostic'
          git push
