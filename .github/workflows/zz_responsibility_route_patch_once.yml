name: responsibility-route-patch-once
on:
  push:
    branches: [platform/responsibility-ledger-v1-20261023]
    paths: [.github/workflows/zz_responsibility_route_patch_once.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: platform/responsibility-ledger-v1-20261023
      - name: Add release terrain route
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('platform/internal/httpapi/operational_routes.go')
          s = p.read_text()
          marker = '''\tmux.HandleFunc("POST /v1/research/attempts", func(w http.ResponseWriter, r *http.Request) {\n'''
          if marker not in s:
              raise SystemExit('research route marker missing')
          route = '''\tmux.HandleFunc("GET /v1/releases/{id}/terrain", func(w http.ResponseWriter, r *http.Request) {\n\t\tid, err := uuid.Parse(r.PathValue("id"))\n\t\tif err != nil {\n\t\t\trespond(w, 400, map[string]string{"error": "invalid release id"})\n\t\t\treturn\n\t\t}\n\t\tsnapshot, err := capability.LoadReleaseSnapshot(r.Context(), a.Pool, id)\n\t\tif err != nil {\n\t\t\tresult(w, nil, err)\n\t\t\treturn\n\t\t}\n\t\troles, roleStatus, err := capability.ProductRoleReadProjection(snapshot.Registry)\n\t\tif err != nil {\n\t\t\tresult(w, nil, err)\n\t\t\treturn\n\t\t}\n\t\tterrain, responsibilityStatus, err := capability.ResponsibilityReadProjection(snapshot.Registry)\n\t\tif err != nil {\n\t\t\tresult(w, nil, err)\n\t\t\treturn\n\t\t}\n\t\trespond(w, 200, map[string]any{\n\t\t\t"schema":                           "RealSaS.ReleaseTerrainMap.v1",\n\t\t\t"engine_release_id":                snapshot.ReleaseID.String(),\n\t\t\t"capability_set_sha256":            snapshot.CapabilitySetSHA256,\n\t\t\t"product_roles":                    roles,\n\t\t\t"product_role_projection_status":   roleStatus,\n\t\t\t"responsibilities":                 terrain,\n\t\t\t"responsibility_projection_status": responsibilityStatus,\n\t\t})\n\t})\n\n'''
          p.write_text(s.replace(marker, route + marker, 1))
          PY
          rm .github/workflows/zz_responsibility_route_patch_once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform/internal/httpapi/operational_routes.go .github/workflows/zz_responsibility_route_patch_once.yml
          git commit -m 'Platform: expose release responsibility terrain map'
          git push
