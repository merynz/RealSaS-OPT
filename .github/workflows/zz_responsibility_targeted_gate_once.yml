name: responsibility-terrain-targeted-gate-once
# retry after isolating the responsibility fixture from dependency validation
on:
  push:
    branches: [platform/responsibility-ledger-v1-20261023]
    paths: [.github/workflows/zz_responsibility_targeted_gate_once.yml]
permissions:
  contents: write
jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: platform/responsibility-ledger-v1-20261023
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version-file: platform/go.mod
      - name: Install canonical Python profile
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/mainline-ci.txt
      - name: Canonical Go formatting
        run: |
          gofmt -w \
            platform/internal/capability/product_input.go \
            platform/internal/capability/product_shape.go \
            platform/internal/capability/product_contracts.go \
            platform/internal/capability/responsibility.go \
            platform/internal/capability/responsibility_role_ids.go \
            platform/internal/capability/responsibility_read.go \
            platform/internal/capability/responsibility_test.go \
            platform/internal/capability/responsibility_read_test.go \
            platform/internal/capability/product_contracts_test.go \
            platform/internal/capability/release_compose.go \
            platform/internal/httpapi/operational_routes.go
          git diff --check
      - name: Go capability and API gates
        working-directory: platform
        run: |
          go test ./internal/capability
          go test ./internal/httpapi
      - name: Release tooling gates
        run: |
          python -m py_compile tools/platform_capability_versions.py
          pytest -q tests/compiler/test_platform_capability_versions_v1.py
      - name: Remove transient workflow after success
        run: |
          rm .github/workflows/zz_responsibility_targeted_gate_once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform tools tests .github/workflows/zz_responsibility_targeted_gate_once.yml
          git commit -m 'Platform: seal responsibility terrain targeted proof'
          git push
