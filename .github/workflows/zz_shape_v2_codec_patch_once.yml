name: shape-v2-codec-patch-once
on:
  push:
    branches: [product/mesh-capability-v1-20261023-canonical-main]
    paths: [.github/workflows/zz_shape_v2_codec_patch_once.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/mesh-capability-v1-20261023-canonical-main
      - name: Patch exact V3-to-V1 topology codec contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('compiler/realsas_compiler_services/platform_worker/shape_capability_v2.py')
          s = p.read_text()
          anchor = 'from models.tessa.v1.sequence_codec_v1 import decode_tessa_asset_sequence_v1\n'
          if anchor not in s:
              raise SystemExit('codec import anchor missing')
          s = s.replace(anchor, 'from models.tessa.v1.model_v1 import TESSAConfigV1\n' + anchor, 1)
          helper_anchor = '\n\ndef _tensor_numpy(value: torch.Tensor, dtype: np.dtype | None = None) -> np.ndarray:\n'
          helper = '''\n\ndef _codec_config_v1(config: Any) -> TESSAConfigV1:\n    config.validate()\n    return TESSAConfigV1(\n        d_model=int(config.d_model),\n        n_heads=int(config.n_heads),\n        surface_layers=0,\n        decoder_layers=int(config.decoder_layers),\n        mlp_ratio=int(config.mlp_ratio),\n        dropout=float(config.dropout),\n        coordinate_bins=int(config.coordinate_bins),\n        surface_latent_count=int(config.total_conditioning_tokens),\n        local_attention_window=int(config.local_attention_window),\n        query_chunk_size=int(config.query_chunk_size),\n        max_faces=int(config.max_faces),\n        max_vertices=int(config.max_vertices),\n    )\n'''
          if helper_anchor not in s:
              raise SystemExit('helper anchor missing')
          s = s.replace(helper_anchor, helper + helper_anchor, 1)
          old = '''    decoded = decode_tessa_asset_sequence_v1(\n        proposal.token_ids,\n        cfg=tessa_binding.model.config,\n    )\n'''
          new = '''    decoded = decode_tessa_asset_sequence_v1(\n        proposal.token_ids,\n        cfg=_codec_config_v1(tessa_binding.model.config),\n    )\n'''
          if old not in s:
              raise SystemExit('decode call anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/zz_shape_v2_codec_patch_once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compiler/realsas_compiler_services/platform_worker/shape_capability_v2.py .github/workflows/zz_shape_v2_codec_patch_once.yml
          git commit -m 'P3: bind Shape v2 decode to exact TESSA codec config'
          git push
