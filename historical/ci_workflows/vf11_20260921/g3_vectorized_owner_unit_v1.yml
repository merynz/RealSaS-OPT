name: g3-vectorized-owner-unit-v1

on:
  workflow_dispatch:
  push:
    branches: [research/vf11-certified-adaptive-20260921]
    paths:
      - 'compiler/realsas_compiler_core/mesh/deformation_stress_v2.py'
      - 'tests/compiler/test_deformation_stress_v2_vectorization.py'
      - '.github/workflows/g3_vectorized_owner_unit_v1.yml'

concurrency:
  group: g3-vectorized-owner-unit-v1
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Vectorized G3 owner tests
        run: |
          set -euo pipefail
          python -m py_compile compiler/realsas_compiler_core/mesh/deformation_stress_v2.py
          PYTHONPATH=. pytest -q \
            tests/compiler/test_deformation_stress_v2_vectorization.py \
            tests/compiler/test_deformation_stress_v1.py
