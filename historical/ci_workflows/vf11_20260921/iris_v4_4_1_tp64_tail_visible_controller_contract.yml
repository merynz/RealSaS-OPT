name: iris-v4-4-1-tp64-tail-visible-controller-contract

on:
  push:
    branches:
      - research/vf11-certified-adaptive-20260921
    paths:
      - 'models/iris/v4/adaptive_hull_constraint_v4_4_1.py'
      - 'models/iris/v4/train_fit_v4_4_1.py'
      - 'tests/iris/test_v4_4_1_adaptive_hull_constraint.py'
      - 'canonical/IRIS_V4_4_1_TP64_ADAPTIVE_HULL_CONSTRAINT_POLICY_20260923.json'
      - '.github/workflows/iris_v4_4_1_tp64_tail_visible_controller_contract.yml'
  workflow_dispatch:

jobs:
  v4-4-1-controller-contract:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen CPU test dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
          PIP_DEFAULT_TIMEOUT: '60'
        run: |
          python -m pip install --no-input --progress-bar off -r requirements/torch-cpu.txt
          python -m pip install --no-input --progress-bar off pytest==8.3.5 scipy==1.15.3
      - name: Compile V4.4.1 lane
        run: |
          python -m py_compile models/iris/v4/adaptive_hull_constraint_v4_4_1.py
          python -m py_compile models/iris/v4/train_fit_v4_4_1.py
          python -m py_compile tests/iris/test_v4_4_1_adaptive_hull_constraint.py
      - name: Run V4.4.1 and inherited tests
        run: |
          python -m pytest -q \
            tests/iris/test_v4_4_1_adaptive_hull_constraint.py \
            tests/iris/test_v4_4_adaptive_hull_constraint.py \
            tests/iris/test_source_hull_lattice_v4_3.py \
            tests/iris/test_regularity_v4_2.py \
            tests/iris/test_source_exterior_v4.py
      - name: Prove V4.4.1 claim boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import torch
          from models.iris.v4.adaptive_hull_constraint_v4_4_1 import (
              AdaptiveHullConstraintPolicyV441,
              violation_conditioned_sign_control_v441,
              initialize_controller_v441,
              update_lambda_from_replay_v441,
          )
          p=json.loads(Path('canonical/IRIS_V4_4_1_TP64_ADAPTIVE_HULL_CONSTRAINT_POLICY_20260923.json').read_text())
          c=AdaptiveHullConstraintPolicyV441()
          assert p['status']=='FROZEN_PRE_RUN'
          assert p['frozen']['architecture_change'] is False
          assert p['frozen']['foreground_audit_target_max_miss_fraction']==0
          assert p['frozen']['rho_adaptive'] is False
          assert p['controller']['state_variables']==['lambda']
          assert p['decision_tree']['lambda_zero_while_sign_violations_remain']=='APPARATUS_ABORT_CONTROLLER_INVARIANT_BROKEN'
          # Sparse-tail witness: 1000 satisfied + one violating point must remain visible.
          s=torch.cat([torch.full((1000,),0.05),torch.tensor([-0.01])])
          m=torch.full_like(s,0.02); d=torch.ones_like(s); cert=torch.ones_like(s,dtype=torch.bool)
          row=violation_conditioned_sign_control_v441(s,m,d,cert,require_all_bands=False)
          assert int(row['nonpositive_sign_count'])==1
          assert float(row['control'])>0.0
          state=initialize_controller_v441(full_anchor_control=float(row['control']),replay_anchor_control=float(row['control']),anchor_step=0)
          nxt,diag=update_lambda_from_replay_v441(state,replay_control_now=float(row['control']))
          assert nxt.lambda_value>state.lambda_value
          assert diag['controller_mode']=='ACCUMULATE'
          print('V441_SPARSE_TAIL_VISIBLE=PASS')
          print('V441_LAMBDA_ACCUMULATES_WHILE_VIOLATING=PASS')
          print('V441_ZERO_ONLY_LEAK=PASS')
          print('V441_RHO_UNCHANGED=PASS')
          print('V441_STAGE13_UNCHANGED=PASS')
          PY
      - name: Enforce source-authority boundary
        run: |
          set -euo pipefail
          ! grep -RniE 'teacher_first_hit|global_teacher_sdf|visual[_ -]?hull.*clip|posthoc.*carv|differentiable.*raster' \
            models/iris/v4/adaptive_hull_constraint_v4_4_1.py \
            models/iris/v4/train_fit_v4_4_1.py
          echo 'V441_SOURCE_AUTHORITY_BOUNDARY=PASS'
