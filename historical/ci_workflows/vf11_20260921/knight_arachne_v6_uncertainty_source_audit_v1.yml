name: knight-arachne-v6-uncertainty-source-audit-v1
on:
  workflow_dispatch:
  push:
    branches: [research/vf11-certified-adaptive-20260921]
    paths:
      - 'tools/audit_knight_arachne_v6_uncertainty_source_v1.py'
      - 'canonical/KNIGHT_ARACHNE_V6_UNCERTAINTY_SOURCE_AUDIT_PREREG_V1_20260929.json'
      - '.github/workflows/knight_arachne_v6_uncertainty_source_audit_v1.yml'
concurrency:
  group: knight-arachne-v6-uncertainty-source-audit-v1
  cancel-in-progress: true
permissions: {contents: write}
jobs:
  court:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 10
    env:
      AUTHORITY_ROOT: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_DEMO_V2_20260924
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Run exact Arachne source audit
        run: |
          set -euo pipefail
          PYTHONPATH=. python tools/audit_knight_arachne_v6_uncertainty_source_v1.py --authority-root "$AUTHORITY_ROOT" --run-id "$RUN_ID" --out canonical/KNIGHT_ARACHNE_V6_UNCERTAINTY_SOURCE_AUDIT_V1_20260929.json | tee /tmp/v6_source_audit.txt
      - name: Seal
        run: |
          set -euo pipefail
          mkdir -p canonical/knight_arachne_v6_uncertainty_source_audit_v1
          cp /tmp/v6_source_audit.txt canonical/knight_arachne_v6_uncertainty_source_audit_v1/AUDIT_STDOUT.txt
          git config user.name realsas-self-hosted-runner
          git config user.email runner@realsas.local
          git add canonical/KNIGHT_ARACHNE_V6_UNCERTAINTY_SOURCE_AUDIT_V1_20260929.json canonical/knight_arachne_v6_uncertainty_source_audit_v1
          git commit -m 'audit: seal exact Knight Arachne v6 uncertainty source audit'
          git fetch origin research/vf11-certified-adaptive-20260921
          git rebase origin/research/vf11-certified-adaptive-20260921
          git push origin HEAD:research/vf11-certified-adaptive-20260921
