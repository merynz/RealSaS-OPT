name: knight-corrected-stage24-diagnostics-v1

on:
  workflow_dispatch:
  push:
    branches: [research/vf11-certified-adaptive-20260921]
    paths:
      - 'tools/demo/diagnose_knight_corrected_stage24_v1.py'
      - '.github/workflows/knight_corrected_stage24_diagnostics_v1.yml'

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 5
    env:
      AUTHORITY_ROOT: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_CORRECTED_MECHANICAL_CAA_AB_V1_20260929
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Diagnose Stage24 only
        run: |
          set -euo pipefail
          PYTHONPATH=. python tools/demo/diagnose_knight_corrected_stage24_v1.py             --authority-root "$AUTHORITY_ROOT"             --run-id "$RUN_ID"
