name: knight-graph-seam-cut-preview-v1

on:
  push:
    branches:
      - research/vf11-certified-adaptive-20260921
    paths:
      - 'tools/demo/render_knight_graph_seam_cut_preview_v1.py'
      - '.github/workflows/knight_graph_seam_cut_preview_v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: knight-graph-seam-cut-preview-v1
  cancel-in-progress: true

jobs:
  render:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 30
    env:
      RUN_ID: SUBJECT2_KNIGHT_DEMO_V2_20260924
      AUTHORITY_ROOT: /home/monster/realsas_authority
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Compile
        run: python -m py_compile tools/demo/render_knight_graph_seam_cut_preview_v1.py
      - name: Render graph seam cut preview
        run: |
          set -euo pipefail
          rm -rf canonical/knight_graph_seam_cut_preview_v1
          python -m tools.demo.render_knight_graph_seam_cut_preview_v1             --authority-root "$AUTHORITY_ROOT"             --run-id "$RUN_ID"             --out-dir canonical/knight_graph_seam_cut_preview_v1
      - name: Seal
        run: |
          set -euo pipefail
          git config user.name realsas-self-hosted-runner
          git config user.email runner@realsas.local
          git add canonical/knight_graph_seam_cut_preview_v1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'demo: seal graph-level skin seam cut preview'
          git fetch origin research/vf11-certified-adaptive-20260921
          git rebase origin/research/vf11-certified-adaptive-20260921
          git push origin HEAD:research/vf11-certified-adaptive-20260921
