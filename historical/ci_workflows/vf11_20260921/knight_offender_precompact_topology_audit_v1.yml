name: knight-offender-precompact-topology-audit-v1

on:
  workflow_dispatch:
  push:
    branches:
      - research/vf11-certified-adaptive-20260921
    paths:
      - '.github/workflows/knight_offender_precompact_topology_audit_v1.yml'

concurrency:
  group: knight-offender-precompact-topology-audit-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 25
    env:
      RUN_ROOT: /home/monster/realsas_authority/runs/SUBJECT2_KNIGHT_DEMO_V2_20260924
      OUT: canonical/knight_offender_precompact_topology_audit_v1

    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        run: python -m pip install --no-input --progress-bar off numpy scipy

      - name: Audit offender dense provenance and teacher-bank layout
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import json, hashlib, os
          from pathlib import Path
          import numpy as np

          from compiler.realsas_compiler_core.artifact_codec_v2 import (
              canonical_mesh_candidate_from_dict,
              rigging_surface_from_dict,
          )
          from compiler.realsas_compiler_core.substrate.scene_first_signed import (
              mesh_connected_component_labels_v1,
              _adaptive_voxel_compact,
          )

          root=Path("/home/monster/realsas_authority/runs/SUBJECT2_KNIGHT_DEMO_V2_20260924")
          out=Path("canonical/knight_offender_precompact_topology_audit_v1")
          out.mkdir(parents=True,exist_ok=True)

          p12=root/"artifacts/12_ZERO_SURFACE_DECODED/signed_zero_surface_seal.json"
          p15=root/"artifacts/15_RIGGING_SURFACE_QUALIFIED/qualified_rigging_surface.json"
          p18=root/"artifacts/18_CANONICAL_MESH_ADDRESSING_BUILD/canonical_mesh_candidate.json"
          z=json.loads(p12.read_text())
          surface=rigging_surface_from_dict(json.loads(p15.read_text()))
          candidate=canonical_mesh_candidate_from_dict(json.loads(p18.read_text()))
          npz=Path(str(z["npz_path"]))
          with np.load(npz,allow_pickle=False) as data:
              dense_v=np.asarray(data["vertices_normalized"],np.float64)
              dense_f=np.asarray(data["faces"],np.int64)

          meta=dict(surface.metadata or {})
          target=int(meta["compact_target_nodes"])
          component_aware=bool(meta["component_aware_compaction"])
          dummy=np.zeros_like(dense_v); dummy[:,2]=1.0
          labels=mesh_connected_component_labels_v1(len(dense_v),dense_f) if component_aware else None
          cp,_cn,_edges,divisions,inverse=_adaptive_voxel_compact(
              dense_v,dense_f,dummy,
              target_nodes=target,
              preserve_connected_components=component_aware,
              precomputed_component_labels=labels,
          )

          sid_to_idx={str(n.surface_id):i for i,n in enumerate(surface.surface_nodes)}
          cid_to_idx={}
          for v in candidate.vertices:
              sid=str(dict(v.metadata or {}).get("source_surface_id") or "")
              cid_to_idx[str(v.candidate_vertex_id)]=sid_to_idx[sid]

          # Find candidate triangle -> supporting dense triangles.
          mapped=np.sort(np.asarray(inverse[dense_f],np.int64),axis=1)
          offenders=(253,3829,3573)
          rows={}
          for fi in offenders:
              face=candidate.faces[fi]
              compact=tuple(sorted(cid_to_idx[str(x)] for x in face))
              mask=np.all(mapped==np.asarray(compact,dtype=np.int64)[None,:],axis=1)
              dense_ids=np.nonzero(mask)[0]
              # Buckets of dense vertices assigned to each compact endpoint.
              buckets={}
              for ci in compact:
                  members=np.nonzero(np.asarray(inverse)==ci)[0]
                  pts=dense_v[members]
                  if len(pts):
                      diameter=float(np.max(np.linalg.norm(pts-pts.mean(axis=0)[None,:],axis=1))*2.0)
                      bbox=(pts.max(axis=0)-pts.min(axis=0)).tolist()
                  else:
                      diameter=0.0; bbox=[0.0,0.0,0.0]
                  component_ids=sorted(set(map(int,labels[members].tolist()))) if labels is not None else []
                  buckets[str(ci)]={
                    "member_count":int(len(members)),
                    "component_ids":component_ids,
                    "bbox_extent":list(map(float,bbox)),
                    "diameter_upper_proxy":diameter,
                  }
              rows[str(fi)]={
                "candidate_vertex_ids":list(map(str,face)),
                "compact_indices":list(map(int,compact)),
                "supporting_dense_face_count":int(len(dense_ids)),
                "supporting_dense_face_indices":list(map(int,dense_ids[:128])),
                "compact_buckets":buckets,
              }

          # Locate teacher assets by exact filename anywhere under authority root/home.
          wanted=[
            "ARACHNE_KNIGHT_TEACHER_BANK_FIX2.npz",
            "KNIGHT_EVALUATED_TEACHER_SOURCE.npz",
          ]
          search_roots=[root,Path("/home/monster/realsas_authority"),Path("/home/monster")]
          found={}
          for name in wanted:
              hits=[]
              for sr in search_roots:
                  try:
                      hits.extend(sr.rglob(name))
                  except Exception:
                      pass
                  if hits: break
              uniq=[]
              seen=set()
              for p in hits:
                  rp=str(p.resolve())
                  if rp not in seen:
                      seen.add(rp); uniq.append(p)
              if uniq:
                  p=uniq[0]
                  with np.load(p,allow_pickle=False) as d:
                      found[name]={
                        "path":str(p),
                        "sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
                        "keys":{k:{"shape":list(d[k].shape),"dtype":str(d[k].dtype)} for k in d.files},
                      }
              else:
                  found[name]={"path":None}

          report={
            "schema":"RealSaS.KnightOffenderPrecompactTopologyAudit.v1",
            "status":"AUDIT_ONLY__NO_REPAIR_APPLIED",
            "bindings":{
              "candidate_lineage_hash":candidate.candidate_lineage_hash,
              "surface_lineage_hash":surface.geometry_lineage_hash,
              "zero_surface_npz_sha256":hashlib.sha256(npz.read_bytes()).hexdigest(),
            },
            "compaction":{
              "dense_vertex_count":int(len(dense_v)),
              "dense_face_count":int(len(dense_f)),
              "compact_node_count":int(len(cp)),
              "voxel_divisions":int(divisions),
              "component_aware":component_aware,
            },
            "offenders":rows,
            "teacher_assets":found,
            "finding":{
              "id":"KNIGHT_OFFENDER_PRECOMPACT_TOPOLOGY_PROVENANCE",
              "claim_boundary":"Determines whether known smear offender faces are already supported by pre-compaction dense triangles and characterizes compact endpoint buckets. It does not yet map every dense vertex to artist-source topology."
            }
          }
          (out/"REPORT.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print(json.dumps(report,indent=2,sort_keys=True))
          PY

      - name: Seal
        run: |
          set -euo pipefail
          git config user.name realsas-self-hosted-runner
          git config user.email runner@realsas.local
          git add "$OUT/REPORT.json"
          git commit -m 'audit: seal Knight offender precompact topology evidence'
          git fetch origin research/vf11-certified-adaptive-20260921
          git rebase origin/research/vf11-certified-adaptive-20260921
          git push origin HEAD:research/vf11-certified-adaptive-20260921
