name: knight-old-vs-corrected-lineage-audit-v1

on:
  workflow_dispatch:
  push:
    branches: [research/vf11-certified-adaptive-20260921]
    paths:
      - 'tools/demo/audit_knight_old_vs_corrected_lineage_v1.py'
      - '.github/workflows/knight_old_vs_corrected_lineage_audit_v1.yml'

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 5
    env:
      AUTHORITY_ROOT: /home/monster/realsas_authority
      NEW_PREVIEW_ROOT: /tmp/knight_harmonic_first_frozen_render_only_v1/frozen_renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Audit old vs corrected lineage
        run: |
          set -euo pipefail
          PYTHONPATH=. python tools/demo/audit_knight_old_vs_corrected_lineage_v1.py             --authority-root "$AUTHORITY_ROOT"             --new-preview-root "$NEW_PREVIEW_ROOT"
