name: knight-recover-stage28-authority-v1

on:
  push:
    branches: [research/vf11-certified-adaptive-20260921]
    paths:
      - 'tools/demo/audit_recover_stage28_authority_v1.py'
      - '.github/workflows/knight_recover_stage28_authority_v1.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 5
    env:
      AUTHORITY_ROOT: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_DEMO_V2_20260924
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Recover Stage28 authority
        run: |
          set -euo pipefail
          PYTHONPATH=. python tools/demo/audit_recover_stage28_authority_v1.py             --authority-root "$AUTHORITY_ROOT"             --run-id "$RUN_ID"
