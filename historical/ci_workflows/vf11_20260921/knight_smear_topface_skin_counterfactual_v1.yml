name: knight-smear-topface-skin-counterfactual-v1

on:
  push:
    branches:
      - research/vf11-certified-adaptive-20260921
    paths:
      - 'tools/demo/diagnose_knight_smear_topface_skin_counterfactual_v1.py'
      - '.github/workflows/knight_smear_topface_skin_counterfactual_v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: knight-smear-topface-skin-counterfactual-v1
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 30
    env:
      RUN_ID: SUBJECT2_KNIGHT_DEMO_V2_20260924
      AUTHORITY_ROOT: /home/monster/realsas_authority
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Compile diagnostic
        run: |
          set -euo pipefail
          python -m py_compile tools/demo/diagnose_knight_smear_topface_skin_counterfactual_v1.py
      - name: Run top-face skin counterfactual
        run: |
          set -euo pipefail
          rm -rf canonical/knight_smear_topface_skin_counterfactual_v1
          python -m tools.demo.diagnose_knight_smear_topface_skin_counterfactual_v1 \
            --authority-root "$AUTHORITY_ROOT" \
            --run-id "$RUN_ID" \
            --out-dir canonical/knight_smear_topface_skin_counterfactual_v1
      - name: Seal diagnostic evidence
        run: |
          set -euo pipefail
          git config user.name realsas-self-hosted-runner
          git config user.email runner@realsas.local
          git add canonical/knight_smear_topface_skin_counterfactual_v1
          if git diff --cached --quiet; then
            echo "NO_DIAGNOSTIC_DIFF"
            exit 0
          fi
          git commit -m "diagnostic: seal top-face skin counterfactual evidence"
          git fetch origin research/vf11-certified-adaptive-20260921
          git rebase origin/research/vf11-certified-adaptive-20260921
          git push origin HEAD:research/vf11-certified-adaptive-20260921
