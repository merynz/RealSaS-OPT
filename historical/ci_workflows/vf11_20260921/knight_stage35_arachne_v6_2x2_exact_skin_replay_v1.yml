name: knight-stage35-arachne-v6-2x2-exact-skin-replay-v1

on:
  workflow_dispatch:
  push:
    branches: [research/vf11-certified-adaptive-20260921]
    paths:
      - '.github/workflows/knight_stage35_arachne_v6_2x2_exact_skin_replay_v1.yml'

concurrency:
  group: knight-stage35-arachne-v6-2x2-exact-skin-replay-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  replay:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 30
    env:
      AUTHORITY_ROOT: /home/monster/realsas_authority
      RUN_ID: SUBJECT2_KNIGHT_DEMO_V2_20260924
      DRIVE_ROOT: gdrive:RealSaS_SUBJECT2_KNIGHT_DEMO_V2_20260924/ARACHNE_V6_COVERAGE_SAMPLING_2X2_INDEXSPACE_FIXED_20260929/ARMS
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        run: python -m pip install --no-input --progress-bar off numpy scipy
      - name: Syntax
        run: python -m py_compile tools/audit_knight_stage35_exact_skin_replay_v1.py
      - name: Replay all corrected Arachne arms
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          mkdir -p canonical/knight_arachne_v6_2x2_stage35_exact_skin_replay_v1
          arms=(UNIFORM_VALID ACTIVE_BALANCED_VALID UNIFORM_ALL_PROJECTED ACTIVE_BALANCED_ALL_PROJECTED)

          for arm in "${arms[@]}"; do
            mkdir -p "$work/$arm"
            src="$DRIVE_ROOT/$arm/ARACHNE_KNIGHT_V6_QUALIFIED_SKIN_IR.json"
            skin="$work/$arm/skin.json"
            out="$work/$arm/report.json"
            echo "FETCH_ARM=$arm SRC=$src"
            rclone copyto "$src" "$skin" --checksum
            PYTHONPATH=. python tools/audit_knight_stage35_exact_skin_replay_v1.py \
              --authority-root "$AUTHORITY_ROOT" \
              --run-id "$RUN_ID" \
              --skin-json "$skin" \
              --out "$out" \
              | tee "canonical/knight_arachne_v6_2x2_stage35_exact_skin_replay_v1/$arm.STDOUT.txt"
          done

          python - "$work" <<'PY'
          import json,sys,hashlib
          from pathlib import Path
          root=Path(sys.argv[1])
          arms=("UNIFORM_VALID","ACTIVE_BALANCED_VALID","UNIFORM_ALL_PROJECTED","ACTIVE_BALANCED_ALL_PROJECTED")
          rows={}
          for arm in arms:
              p=root/arm/"report.json"
              x=json.loads(p.read_text())
              if x.get("status")!="PASS_REPLAY_EXECUTED":
                  raise RuntimeError(f"REPLAY_NOT_EXECUTED::{arm}::{x.get('status')}")
              rows[arm]={
                  "skin_json_sha256":x["skin_json_sha256"],
                  "skin_lineage_hash":x["skin_lineage_hash"],
                  "candidate_lineage_hash":x["candidate_lineage_hash"],
                  "partition_lineage_hash":x["partition_lineage_hash"],
                  "g3":x["g3"],
                  "g3b":x["g3b"],
                  "repartition":x["repartition"],
              }

          report={
              "schema":"RealSaS.KnightArachneV6CoverageSampling2x2Stage35Replay.v1",
              "status":"COMPLETE",
              "run_id":"SUBJECT2_KNIGHT_DEMO_V2_20260924",
              "source_court":"ARACHNE_V6_COVERAGE_SAMPLING_2X2_INDEXSPACE_FIXED_20260929",
              "harness":"tools/audit_knight_stage35_exact_skin_replay_v1.py",
              "arms":rows,
              "decision_boundary":[
                  "These are exact Stage35 G3/G3B replays on the four corrected Arachne skins.",
                  "No arm is promoted merely from Arachne valid-row metrics.",
                  "Projected teacher-invalid rows remain diagnostic rather than product teacher authority.",
                  "Any repartition directive remains authorization-gated and performs no weight mutation or face deletion.",
              ],
          }
          out=Path("canonical/KNIGHT_ARACHNE_V6_2X2_STAGE35_EXACT_SKIN_REPLAY_V1_20260929.json")
          out.write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print("KNIGHT_ARACHNE_V6_2X2_STAGE35_REPLAY_COMPLETE="+json.dumps({
              a:{
                  "g3_passed":rows[a]["g3"]["passed"],
                  "g3_unsafe":rows[a]["g3"]["unsafe_face_count"],
                  "g3b_passed":rows[a]["g3b"]["passed"],
                  "g3b_risky":rows[a]["g3b"]["risky_face_count"],
                  "g3b_unsafe":rows[a]["g3b"]["unsafe_face_count"],
                  "separate_pairs":None if rows[a]["repartition"] is None else rows[a]["repartition"]["candidate_separate_pair_count"],
                  "unresolved":None if rows[a]["repartition"] is None else rows[a]["repartition"]["unresolved_unsafe_face_count"],
              } for a in arms
          },sort_keys=True))
          PY

      - name: Seal canonical replay report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name realsas-self-hosted-runner
          git config user.email runner@realsas.local
          git add canonical/KNIGHT_ARACHNE_V6_2X2_STAGE35_EXACT_SKIN_REPLAY_V1_20260929.json \
                  canonical/knight_arachne_v6_2x2_stage35_exact_skin_replay_v1
          git commit -m 'audit: seal Arachne V6 2x2 Stage35 replay'
          git fetch origin research/vf11-certified-adaptive-20260921
          git rebase origin/research/vf11-certified-adaptive-20260921
          git push origin HEAD:research/vf11-certified-adaptive-20260921
