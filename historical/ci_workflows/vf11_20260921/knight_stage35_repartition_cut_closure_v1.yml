name: knight-stage35-repartition-cut-closure-v1
on:
  workflow_dispatch:
  push:
    branches: [research/vf11-certified-adaptive-20260921]
    paths:
      - 'tools/audit_knight_stage35_repartition_cut_closure_v1.py'
      - '.github/workflows/knight_stage35_repartition_cut_closure_v1.yml'
permissions: {contents: write}
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 15
    env:
      RUN_ROOT: /home/monster/realsas_authority/runs/SUBJECT2_KNIGHT_DEMO_V2_20260924
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Measure cut closure
        shell: bash
        run: |
          set -euo pipefail
          surface="$RUN_ROOT/artifacts/15_RIGGING_SURFACE_QUALIFIED/qualified_rigging_surface.json"
          outroot="canonical/knight_stage35_repartition_cut_closure_v1"
          rm -rf "$outroot"; mkdir -p "$outroot"
          for arm in UNIFORM_ALL_PROJECTED ACTIVE_BALANCED_ALL_PROJECTED; do
            directive="canonical/knight_arachne_v6_2x2_rebound_stage35_v1/$arm.REPARTITION_DIRECTIVE.json"
            PYTHONPATH=. python tools/audit_knight_stage35_repartition_cut_closure_v1.py               --surface-json "$surface" --directive-json "$directive" --out "$outroot/$arm.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("canonical/knight_stage35_repartition_cut_closure_v1")
          arms=("UNIFORM_ALL_PROJECTED","ACTIVE_BALANCED_ALL_PROJECTED")
          rows={a:json.loads((root/f"{a}.json").read_text()) for a in arms}
          Path("canonical/KNIGHT_STAGE35_REPARTITION_CUT_CLOSURE_V1_20260929.json").write_text(
            json.dumps({"schema":"RealSaS.KnightStage35RepartitionCutClosureCourt.v1","status":"COMPLETE","arms":rows},indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps({a:{k:rows[a][k] for k in ("proposed_pair_count","removed_graph_component_count","true_cut_pair_count","redundant_noncut_pair_count","missing_crossing_edge_count","canonical_cut_partition_build_passed","canonical_child_component_count")} for a in arms},sort_keys=True))
          PY
      - name: Seal
        run: |
          set -euo pipefail
          git config user.name realsas-self-hosted-runner
          git config user.email runner@realsas.local
          git add canonical/KNIGHT_STAGE35_REPARTITION_CUT_CLOSURE_V1_20260929.json canonical/knight_stage35_repartition_cut_closure_v1
          git commit -m 'audit: seal Stage35 repartition cut closure'
          git fetch origin research/vf11-certified-adaptive-20260921
          git rebase origin/research/vf11-certified-adaptive-20260921
          git push origin HEAD:research/vf11-certified-adaptive-20260921
