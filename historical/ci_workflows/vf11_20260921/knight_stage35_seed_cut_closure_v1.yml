name: knight-stage35-seed-cut-closure-v1

on:
  workflow_dispatch:
  push:
    branches: [research/vf11-certified-adaptive-20260921]
    paths:
      - 'tools/audit_knight_stage35_seed_cut_closure_v1.py'
      - '.github/workflows/knight_stage35_seed_cut_closure_v1.yml'

concurrency:
  group: knight-stage35-seed-cut-closure-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    env:
      RUN_ROOT: /home/monster/realsas_authority/runs/SUBJECT2_KNIGHT_DEMO_V2_20260924
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        run: python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Syntax
        run: python -m py_compile tools/audit_knight_stage35_seed_cut_closure_v1.py
      - name: Measure coverage-arm seed closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p canonical/knight_stage35_seed_cut_closure_v1
          surface="$RUN_ROOT/artifacts/15_RIGGING_SURFACE_QUALIFIED/qualified_rigging_surface.json"
          for arm in UNIFORM_ALL_PROJECTED ACTIVE_BALANCED_ALL_PROJECTED; do
            directive="canonical/knight_arachne_v6_2x2_rebound_stage35_v1/$arm.REPARTITION_DIRECTIVE.json"
            out="canonical/knight_stage35_seed_cut_closure_v1/$arm.REPORT.json"
            PYTHONPATH=. python tools/audit_knight_stage35_seed_cut_closure_v1.py \
              --surface-json "$surface" \
              --directive-json "$directive" \
              --arm "$arm" \
              --out "$out" \
              | tee "canonical/knight_stage35_seed_cut_closure_v1/$arm.STDOUT.txt"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("canonical/knight_stage35_seed_cut_closure_v1")
          arms=("UNIFORM_ALL_PROJECTED","ACTIVE_BALANCED_ALL_PROJECTED")
          rows={a:json.loads((root/f"{a}.REPORT.json").read_text()) for a in arms}
          report={
            "schema":"RealSaS.KnightStage35SeedCutClosureCourt.v1",
            "status":"COMPLETE",
            "arms":rows,
            "verdict":{
              "both_current_directives_partition_closed":all(x["interpretation"]["current_directive_is_partition_closed"] for x in rows.values()),
              "both_preloaded_mutex_closures_satisfy_all_seeds":all(x["preloaded_mutex_closure"]["all_seed_constraints_satisfied"] for x in rows.values()),
            },
            "claim_boundary":"Diagnostic graph closure only; no Stage17 product state mutation.",
          }
          Path("canonical/KNIGHT_STAGE35_SEED_CUT_CLOSURE_COURT_V1_20260929.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print("KNIGHT_STAGE35_SEED_CUT_CLOSURE_COURT="+json.dumps({
            a:{
              "seeds":rows[a]["seed_separation"]["seed_count"],
              "noncut":rows[a]["seed_separation"]["naive_noncut_seed_count"],
              "components":rows[a]["preloaded_mutex_closure"]["component_count"],
              "blocked":rows[a]["preloaded_mutex_closure"]["attractive_union_blocked_by_mutex"],
              "closure_added":rows[a]["preloaded_mutex_closure"]["closure_added_separate_pair_count"],
              "final_separate":rows[a]["preloaded_mutex_closure"]["final_separate_pair_count"],
              "violated":rows[a]["preloaded_mutex_closure"]["seed_constraint_violation_count"],
            } for a in arms
          },sort_keys=True))
          PY
      - name: Seal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name realsas-self-hosted-runner
          git config user.email runner@realsas.local
          git add canonical/KNIGHT_STAGE35_SEED_CUT_CLOSURE_COURT_V1_20260929.json canonical/knight_stage35_seed_cut_closure_v1
          git commit -m 'audit: seal Stage35 seed cut closure evidence'
          git fetch origin research/vf11-certified-adaptive-20260921
          git rebase origin/research/vf11-certified-adaptive-20260921
          git push origin HEAD:research/vf11-certified-adaptive-20260921
