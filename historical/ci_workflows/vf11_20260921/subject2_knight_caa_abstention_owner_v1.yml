name: subject2-knight-caa-abstention-owner-v1

on:
  push:
    branches:
      - research/vf11-certified-adaptive-20260921
    paths:
      - 'canonical/KNIGHT_CAA_ABSTENTION_OWNER_TRIGGER_20260927.json'
      - 'tools/appearance/diagnose_caa_abstention_owner_v1.py'
      - '.github/workflows/subject2_knight_caa_abstention_owner_v1.yml'
  workflow_dispatch:

concurrency:
  group: subject2-knight-caa-abstention-owner-v1
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 20
    env:
      RUN_ID: SUBJECT2_KNIGHT_DEMO_V2_20260924
      AUTHORITY_ROOT: /home/monster/realsas_authority
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install --no-input --progress-bar off -r requirements/mainline-ci.txt
      - name: Measure abstention owner partition
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m tools.appearance.diagnose_caa_abstention_owner_v1 \
            --repo-root . \
            --authority-root "$AUTHORITY_ROOT" \
            --run-id "$RUN_ID" \
            --out canonical/KNIGHT_CAA_ABSTENTION_OWNER_DIAGNOSTIC_20260927.json
      - name: Verify and seal diagnostic
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("canonical/KNIGHT_CAA_ABSTENTION_OWNER_DIAGNOSTIC_20260927.json").read_text())
          assert d["schema"]=="RealSaS.CAAAbstentionOwnerDiagnostic.v1"
          assert d["status"]=="MEASURED"
          assert d["thresholds_changed"] is False
          print(json.dumps(d,sort_keys=True))
          PY
          git config user.name realsas-self-hosted-runner
          git config user.email runner@realsas.local
          git add canonical/KNIGHT_CAA_ABSTENTION_OWNER_DIAGNOSTIC_20260927.json
          git commit -m 'diagnostic: seal Knight CAA abstention owner partition'
          git fetch origin research/vf11-certified-adaptive-20260921
          git rebase origin/research/vf11-certified-adaptive-20260921
          git push origin HEAD:research/vf11-certified-adaptive-20260921
