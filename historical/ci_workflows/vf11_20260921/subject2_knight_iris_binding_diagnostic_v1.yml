name: subject2-knight-iris-binding-diagnostic-v1

on:
  push:
    branches:
      - research/vf11-certified-adaptive-20260921
    paths:
      - 'canonical/KNIGHT_IRIS_BINDING_DIAGNOSTIC_TRIGGER_20260927.json'
      - 'tools/iris/diagnose_knight_binding_drift_v1.py'
      - '.github/workflows/subject2_knight_iris_binding_diagnostic_v1.yml'
  workflow_dispatch:

concurrency:
  group: subject2-knight-iris-binding-diagnostic-v1
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, realsas]
    timeout-minutes: 15
    env:
      RUN_ID: SUBJECT2_KNIGHT_DEMO_V2_20260924
      AUTHORITY_ROOT: /home/monster/realsas_authority
      PYTHONHASHSEED: '0'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Diagnose frozen IRIS binding drift
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m tools.iris.diagnose_knight_binding_drift_v1 \
            --authority-root "$AUTHORITY_ROOT" \
            --run-id "$RUN_ID" \
            --out canonical/KNIGHT_IRIS_BINDING_DRIFT_DIAGNOSTIC_20260927.json

      - name: Seal diagnostic
        run: |
          set -euo pipefail
          git config user.name realsas-self-hosted-runner
          git config user.email runner@realsas.local
          git add canonical/KNIGHT_IRIS_BINDING_DRIFT_DIAGNOSTIC_20260927.json
          if git diff --cached --quiet; then
            echo "IRIS_BINDING_DIAGNOSTIC_UNCHANGED"
            exit 0
          fi
          git commit -m 'diagnostic: seal Knight IRIS binding drift'
          git fetch origin research/vf11-certified-adaptive-20260921
          git rebase origin/research/vf11-certified-adaptive-20260921
          git push origin HEAD:research/vf11-certified-adaptive-20260921
