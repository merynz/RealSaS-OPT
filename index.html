<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BUSTED · Awaken</title>
  <meta name="description" content="Awaken a source character into an editable living puppet.">
  <link rel="stylesheet" href="./static/css/awaken.css">
  <link rel="stylesheet" href="./static/css/awaken_input_slots.css">
  <link rel="stylesheet" href="./static/css/awaken_stage.css">
</head>
<body>
  <main class="awaken-shell">
    <canvas id="depthScene" aria-hidden="true"></canvas>
    <div class="scene-fog" aria-hidden="true"></div>
    <div class="scene-vignette" aria-hidden="true"></div>

    <header class="masthead" aria-label="BUSTED navigation">
      <nav class="mast-links" aria-label="Primary navigation">
        <a class="brand-home" href="./index.html" aria-current="page"><span class="brandmark">B</span><span class="brand-name">BUSTED<small>POWERED BY REALSAS</small></span></a>
        <a class="studio-link" href="./studio.html">STUDIO <span aria-hidden="true">↗</span></a>
      </nav>
      <div id="mastStatus" class="mast-status"><i></i><span>INTAKE READY</span></div>
    </header>

    <section class="stage-wrap" aria-label="Character awakening stage">
      <section class="hero">
        <div class="input-orbit">
          <div class="orbit-ring orbit-ring-a" aria-hidden="true"></div>
          <div class="orbit-ring orbit-ring-b" aria-hidden="true"></div>
          <div class="pedestal-glow" aria-hidden="true"></div>

          <label id="dropzone" class="dropzone" for="sourceInput">
            <input id="sourceInput" type="file" accept="image/png,image/webp,image/jpeg" multiple>
            <div class="drop-empty">
              <span class="drop-symbol">＋</span>
              <strong>DROP CHARACTER</strong>
            </div>
            <div class="drop-preview"><img id="sourcePreview" alt="Selected source character"></div>
            <span id="viewCount" class="view-count">0 VIEWS</span>
          </label>

          <div id="inputSlotLedger" class="input-slot-ledger" aria-live="polite" aria-label="Source view assignments">
            <div class="input-slot required" data-input-slot="front">
              <span>FRONT</span>
              <strong id="frontSlotFile">REQUIRED</strong>
            </div>
            <button id="swapInputViews" class="swap-input-views" type="button" hidden>SWAP FRONT / BACK</button>
            <div class="input-slot" data-input-slot="back">
              <span>BACK</span>
              <strong id="backSlotFile">OPTIONAL</strong>
            </div>
          </div>
        </div>

        <button id="awaken" class="awaken-button" type="button" disabled>AWAKEN</button>

        <aside class="telemetry" aria-label="Compiler telemetry">
          <div class="pipeline" aria-hidden="true">
            <div class="pipe-step"><span class="n">01</span><span>Input</span><i class="state"></i></div>
            <div class="pipe-step"><span class="n">02</span><span>Shape</span><i class="state"></i></div>
            <div class="pipe-step"><span class="n">03</span><span>Mesh</span><i class="state"></i></div>
            <div class="pipe-step"><span class="n">04</span><span>Rig</span><i class="state"></i></div>
            <div class="pipe-step"><span class="n">05</span><span>Skin</span><i class="state"></i></div>
            <div class="pipe-step"><span class="n">06</span><span>Mechanics</span><i class="state"></i></div>
            <div class="pipe-step"><span class="n">07</span><span>Graphics</span><i class="state"></i></div>
            <div class="pipe-step"><span class="n">08</span><span>Motion</span><i class="state"></i></div>
            <div class="pipe-step"><span class="n">09</span><span>Proof</span><i class="state"></i></div>
          </div>
          <div id="compilerLog" class="compiler-log" aria-live="polite"></div>
        </aside>
      </section>
    </section>

    <section id="result" class="result" aria-live="polite">
      <div class="result-stage">
        <div class="result-art"><img id="resultPreview" alt="Compiled character preview"></div>
        <div class="result-stream">
          <small>PRODUCT PROOF · PASS</small>
          <h2>ALIVE</h2>
          <a class="open-workspace" href="./studio.html">OPEN STUDIO</a>
        </div>
      </div>
    </section>

    <div class="dev-mode">MODE · <strong id="modeLabel">CHECKING GATEWAY</strong></div>
  </main>
  <script src="./static/js/awaken_depth.js" defer></script>
  <script type="module" src="./static/js/awaken_input_slots.js"></script>
  <script type="module" src="./static/js/awaken.js"></script>
</body>
</html>
