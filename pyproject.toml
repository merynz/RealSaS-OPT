[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["models", "compiler", "runtime", "tools"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Start with correctness-only checks so repository hygiene does not rewrite sealed
# scientific code or generate a large style-only diff. Broader linting can tighten
# incrementally after promoted-source parity is protected.
select = ["E9", "F63", "F7", "F82"]
ignore = []
