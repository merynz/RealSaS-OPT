<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RealSaS canonical architecture</title>
<style>
body{margin:0;background:#101722;color:#dce6f3;font:14px system-ui}header{padding:22px 28px;background:#182333}h1{margin:0 0 8px;font-size:24px}p{line-height:1.5;max-width:1100px}input,button{background:#202f42;color:inherit;border:1px solid #546d88;border-radius:6px;padding:9px}input{width:min(650px,75%)}main{display:grid;grid-template-columns:minmax(520px,1.4fr) minmax(340px,1fr);gap:18px;padding:22px}section{min-width:0}.graph{overflow:auto;max-height:75vh;background:#152030;border-radius:8px}svg{display:block;width:100%;min-width:520px}path{fill:none;stroke:#4b617a;stroke-width:1.3}.selected{stroke:#83d1fc;stroke-width:3}.node{cursor:pointer}.node rect{fill:#263b52;stroke:#7798ba;rx:5}.node.active rect{fill:#315b80;stroke:#b8edff}.node.dim{opacity:.25}text{fill:#e2edf9;font:12px system-ui}.detail{overflow:auto;max-height:75vh}pre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:#192638;padding:12px;border-radius:6px}.pill{display:inline-block;padding:4px 8px;border-radius:5px;background:#304762;margin:3px}a{color:#a1d8ff}small{color:#b3c6da}@media(max-width:900px){main{display:block}.detail{max-height:none;margin-top:20px}}
</style>
<header><h1>RealSaS canonical architecture</h1><div id="identity"></div><p>Source-derived DAG • select a stage to inspect producers, consumers, manifest inputs, owner and source closure. Search a source path to highlight its direct consumers and downstream impact.</p><input id="search" placeholder="Stage, module, adapter or source path"><button id="reset">Reset</button><p><small id="boundary"></small></p></header>
<main><section class="graph"><svg id="graph" role="img" aria-label="Canonical stage dependency graph"></svg></section><section class="detail" id="detail"></section></main>
<script id="data" type="application/json">__ARCHITECTURE_DATA__</script>
<script>
const data=JSON.parse(document.getElementById('data').textContent), nodes=data.nodes, byId=new Map(nodes.map(n=>[n.id,n]));
document.getElementById('identity').textContent=`HEAD ${data.source.head_sha} · ${nodes.length} stages · ${data.edges.length} connections · ${data.source.working_tree_status.length ? 'dirty checkout' : 'clean checkout'}`;
document.getElementById('boundary').textContent=data.evidence_boundary;
const ns='http://www.w3.org/2000/svg',svg=document.getElementById('graph'),positions=new Map(),depth=new Map(),counts=new Map();
function element(tag,attrs={},text){const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text)e.textContent=text;return e;}
for(const n of nodes){const d=n.depends_on.length?1+Math.max(...n.depends_on.map(id=>depth.get(id))):0;depth.set(n.id,d);const c=counts.get(d)||0;counts.set(d,c+1);positions.set(n.id,{x:20+c*255,y:25+d*76});}
const width=Math.max(520,Math.max(...counts.values())*255+20),height=(Math.max(...depth.values())+1)*76+30;svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
const links=[];for(const edge of data.edges){const a=positions.get(edge.producer),b=positions.get(edge.consumer);const p=element('path',{d:`M${a.x+118},${a.y+43} C${a.x+118},${a.y+62} ${b.x+118},${b.y-18} ${b.x+118},${b.y}`});svg.append(p);links.push([edge,p]);}
const visuals=new Map();for(const n of nodes){const p=positions.get(n.id),g=element('g',{class:'node',transform:`translate(${p.x} ${p.y})`,tabindex:'0',role:'button','aria-label':n.id});g.append(element('rect',{width:236,height:43}));g.append(element('text',{x:9,y:17},n.id.length>32?n.id.slice(0,31)+'…':n.id));g.append(element('text',{x:9,y:33},n.owner_module_id));g.append(element('title',{},n.id));g.addEventListener('click',()=>select(n.id));g.addEventListener('keydown',e=>{if(e.key==='Enter')select(n.id)});svg.append(g);visuals.set(n.id,g);}
function block(parent,title,value){const h=document.createElement('h3');h.textContent=title;parent.append(h);const pre=document.createElement('pre');pre.textContent=typeof value==='string'?value:JSON.stringify(value,null,2);parent.append(pre);}
function highlight(ids){for(const [id,g] of visuals){g.classList.toggle('active',ids.has(id));g.classList.toggle('dim',ids.size>0&&!ids.has(id));}for(const [e,p] of links)p.classList.toggle('selected',ids.has(e.producer)&&ids.has(e.consumer));}
function select(id){const n=byId.get(id);highlight(new Set([id,...n.depends_on,...n.downstream_stage_ids]));const d=document.getElementById('detail');d.replaceChildren();block(d,n.id,n.title);block(d,'Producer and owner',{adapter:n.adapter,owner:n.owner_module_id,produces:n.produces,implementation_hash:n.implementation_hash});block(d,'Upstream producers',n.depends_on);block(d,'Direct consumers',n.direct_consumers);block(d,'Manifest input roles',n.input_roles);block(d,'Transitive source dependencies',n.dependency_files);block(d,'Downstream impact',n.downstream_stage_ids);block(d,'Policy',n.policy);}
function overview(){highlight(new Set());const d=document.getElementById('detail');d.replaceChildren();block(d,'Authority boundary',data.authority_note);block(d,'Source fingerprint',data.source.source_fingerprint_sha256);block(d,'Graph identity',data.pipeline_plan_sha256);block(d,'Known dependency debt',{ownership_debt:data.audit.ownership_debt_count,shared_files:data.audit.shared_dependency_file_count,dynamic_import_sites:data.audit.dynamic_import_site_count,unclaimed_go:data.audit.platform_unclaimed_go_file_count});block(d,'Agent operation','Read current state → inspect Go agent-context → exact main/released DAG entry → declared target execution → inspect terminal state → exact-scope exit/handoff. A main merge never selects a scientific experiment.');}
document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();if(!q)return overview();const matches=nodes.filter(n=>[n.id,n.owner_module_id,n.adapter,...n.dependency_files].some(v=>v.toLowerCase().includes(q)));highlight(new Set(matches.flatMap(n=>[n.id,...n.downstream_stage_ids])));const d=document.getElementById('detail');d.replaceChildren();block(d,'Direct matches',matches.map(n=>n.id));block(d,'Impact boundary','Highlighted descendants are declared impact, not a cache/reuse receipt. No match is unclassified, never proof that an edit is safe.');});
document.getElementById('reset').addEventListener('click',()=>{document.getElementById('search').value='';overview()});overview();
</script></html>
